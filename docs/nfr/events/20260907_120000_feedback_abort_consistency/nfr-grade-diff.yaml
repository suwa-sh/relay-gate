    grade_description: "運用者の手動復旧(プロセス停止 → 中止スクリプト → background-rerun または正規ジョブ再実行)。abort-blue / abort-green は slot を ABORTED にするとき対象 run の未着手(REQUESTED)の速報比較依頼も ABORTED にする(完了通知で依頼が作成された直後に slot を中止した場合の競合窓を塞ぐ保険)。REQUESTED / CLAIMED / RUNNING の速報比較依頼の明示中止は worker 停止を確認したうえで abort-rapid-crosscheck で行い、確報比較依頼は RUNNING のみ abort-final-crosscheck で中止する。中止済み run(並行稼働実行が ABORTED、または対象 slot の slot 実行が ABORTED)では完了通知を受けても速報比較依頼を作成しない。完了通知の送信失敗は速報クロスチェック runner の同一引数再実行(冪等・先勝ち)で復旧。自動中止・自動再実行なし"
    reason: "監視は通知のみで、復旧手段は復旧対象ごとに background 側リランと正規ジョブ再実行に分かれ、完了通知失敗の復旧も運用者の再実行で行う設計のため。中止済み run の判定は管理 DB の parallel_run.status と slot_executions.status(aborted.txt のミラー)で行い、foreground 完了後に background slot を中止した典型経路(並行稼働実行は COMPLETED のまま)も slot 実行 ABORTED の側で依頼作成から除外する。claim 済み(CLAIMED)の依頼は lease 失効で REQUESTED に戻り別の worker が再 claim するため、運用者が abort-rapid-crosscheck の条件付き UPDATE で ABORTED にし、worker は RUNNING への更新件数が 0 件なら比較を開始しない。リラン後は新しい run_id で依頼が作り直されるため、復旧後に古い依頼が残らない"
    source_model: "条件: 監視は通知のみ / 条件: 復旧手段の選択 / 条件: 完了通知失敗の扱い / 条件: 中止済み run の比較依頼作成除外 / 条件: slot 中止可否判定 / 条件: 依頼中止可否判定 / 状態: クロスチェック依頼(REQUESTED / CLAIMED / RUNNING → ABORTED)"
