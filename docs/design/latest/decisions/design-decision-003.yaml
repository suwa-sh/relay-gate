schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "design_system"
artifact_id: "design-decision-003"
title: "Runner実行結果6値状態のバッジ表現とrun共通/slot別実行設定の分離表示"
status: "approved"
generated_at: "2026-08-18T14:30:57+09:00"
context: |
  feedback request 20260818_113601_impl_feedback_6078c4ed の CR-6078c4ed-003/005 により、
  上流正本が更新された。
  - arch: run共通 execution spec と slot別実行設定(host/exec_user/script/work_dir/impl_version)の分離、
    Runner実行結果 identity = (run_id, slot_type, role_type, attempt_id)、
    実行状態6値 STARTING/RUNNING/SUCCEEDED/FAILED/UNKNOWN/ABORTED(timeout後は推測でFAILEDを確定せずUNKNOWN)。
  - RDRA: 再実行は新run_id発行 + parent_run_idで元runに関連付け、既存履歴は不変。
  デザインシステムの StatusBadge/RunnerResultPanel/ExecutionSpecCard はこれらを表現できていなかった。
decision: |
  - StatusBadge に starting(cyan系)/unknown(orange系)バリアントを追加し、light/dark両方のトークンを定義する。
    unknown は要注意状態として requested(amber) と識別可能な色相を採用した。
  - RunnerResultPanel は attempt_no/attempt_id を identity 表示に併記し、state prop で6値状態を明示表示する。
    state 未指定時のみ exitCode からの暫定導出(後方互換)とし、timeout後の推測FAILED表示を禁止する。
  - ExecutionSpecCard は run共通(run_id/parent_run_id/JOB_ID/map版/hang_detect_limit_minutes/認証参照名)と
    slot別実行設定(slot/host/実行ユーザー/スクリプト/作業ディレクトリ/実装版)をセクション分離して表示し、
    再実行時は parent_run_id で系譜を明示する。
  - states セクション(RDRA 状態モデル由来)は変更しない。STARTING/UNKNOWN は RDRA 状態.tsv に存在しない
    arch データモデルの状態のため、RDRA 状態モデルへの追加は docs/todo.md へ提案登録し、ユーザー確認に委ねる。
consequences:
  positive:
    - 実装(spec/spec-stories 以降)が UNKNOWN/STARTING の CLI 表示色・ラベルをトークン参照で一意に決められる
    - timeout後の結果不明を failed と誤認させない表示規約が確立する
    - 再実行の系譜(parent_run_id)が運用者に可視化される
  negative:
    - RDRA 状態モデルとコンポーネント states の粒度差(4値 vs 6値)が todo 解消まで残る
alternatives_considered:
  - name: "RDRA 状態モデルへ STARTING/UNKNOWN を自動追加し states セクションにも反映する"
    reason_rejected: "RDRA に存在しない要素の自動追加は禁止(整合性ルール)。todo 登録のうえユーザー確認に委ねる"
  - name: "unknown を failed(red) の亜種として表現する"
    reason_rejected: "CR-005 の趣旨(推測でFAILEDを確定しない)に反し、運用者の誤判断を誘発する"
