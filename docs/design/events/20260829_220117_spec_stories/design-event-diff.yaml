components:
  domain:
    - name: "ExecutionSpecCard"
      description: "run共通execution spec(run_id/parent_run_id/JOB_ID/固定引数・追加引数/hang_detect_limit_minutes)とslot別実行設定(slot/host/実行ユーザー/スクリプト/作業ディレクトリ/実装版/マップ版)を分離して表示するカード。マップ版(job_map_version)はslotごとの独立ファイルから解決するためslot別実行設定側に表示する(CR-6078c4ed-018)。再実行では系譜(parent_run_id)を明示する。認証情報は参照名のみ表示し実値は表示しない"
      screens:
        - "起動slot選択画面"
        - "リラン実行画面"
    - name: "RunnerResultPanel"
      description: "Runner実行結果(started-at/stdout/stderr/exitcode)を表示するターミナル調パネル。実行結果identityは(run_id, slot, role, attempt)でattempt_no/attempt_idを併記する。実行状態はarch正本の6値(STARTING/RUNNING/SUCCEEDED/FAILED/UNKNOWN/ABORTED)を表示し、timeout後は推測でFAILEDを表示せずUNKNOWNを明示する。foreground役割の応答はstdout/stderr/exitcodeのみに限定表示し、exitCodeは0を含む全値をそのまま表示して退避終了コードへ丸めない。relay-gate自身のエラーは退避終了コード(実行結果未確定・取得不能・中止済み・起動イベント送出失敗の補償記録であるFAILEDかつexit_code=NULL=125、バリデーションエラー=124)として表示し、stderr欄にはforeground stderr.logの内容とrelay-gateのエラー内容(原因と次アクション)を併記する"
      screens:
        - "並行稼働実行結果確認画面"
        - "実行結果応答管理画面"
        - "確報結果応答画面"
