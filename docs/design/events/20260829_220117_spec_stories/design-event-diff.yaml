source: "dist-spec-stories: feedback request 20260822_085257_impl_feedback_6078c4ed の差分反映(reconciliation)。direct work unitなし。CR-6078c4ed-012(起動失敗補償)とCR-6078c4ed-018(slot別ジョブマップ・job_map_versionのslot側移動)がCLI出力・画面表示に影響するため、ExecutionSpecCardのmap版表示位置をslot別実行設定へ移し、起動slot選択画面に per-slot ジョブマップ欠落フィールドエラー・起動イベント送出失敗(FAILED)/timeout(UNKNOWN)補償記録の3バリエーションを追加し、実行結果応答管理画面に起動イベント送出失敗の補償記録(status=FAILEDかつexit_code=NULL、退避コード125)バリエーションを追加した。CR-6078c4ed-011(監査hash正規化)・014(引数JSON配列)・015(物理型対応表)は保存形式・算出規則のみでCLI出力/Story表示に現れないためnot_impacted、CR-6078c4ed-013(Scenario責務境界)は既存のSTARTING出力/exit0という表示済み挙動の帰属先を仕様文書内で移すテスト構成変更でありStory表示文言に差分が無いためnot_impacted、CR-6078c4ed-017(credential_ref解決契約)は参照名のみを表示する既存表示のまま(env var名の追加は表示対象外)のためnot_impacted、CR-6078c4ed-016(SPEC-009-03文言)はUSDM文言整理でありbackground実行異常検知画面のダッシュボード表示に新規文言は生じないためnot_impactedと判定した"
