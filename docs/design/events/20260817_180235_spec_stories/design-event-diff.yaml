source: 'dist-spec-stories: 全23 UC のページ Story 生成 + 共通レイアウトシェル(OpsPortalShell)/Logo コンポーネント実装'
components:
  ui:
  - name: Logo
    description: brand.logo.variants (full/icon/stacked) の SVG を variant 指定で描画するロゴコンポーネント
    path: src/components/ui/Logo.tsx
  common:
  - name: OpsPortalShell
    description: 運用ポータル(ops)の共通レイアウトシェル。header(Logo+運用モードバッジ)/sidebar(5セクションナビ)/main/footer(バージョン表示)で構成。headless
      propでCLI単体運用時のヘッドレス表示に切替可能
    path: src/components/common/OpsPortalShell.tsx
