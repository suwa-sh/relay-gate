uc: "比較ツールでジョブ単位比較を実行して結果を登録する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"
paths: []
x_cli_commands:
  - name: "rapid-crosscheck-worker.sh"
    tier: "tier-rapid-crosscheck"
    role: "uses"
    synopsis: "rapid-crosscheck-worker.sh [--once] [--worker-id <id>] [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(定期起動 --once)または常駐プロセス"
    args: []
    options: []
    stdin: "なし"
    stdout: "claim UC の 4 行に続けて request_status=(SUCCEEDED|FAILED|ABORTED。RUNNING 遷移 0 件のときは再 SELECT した現在の status をそのまま出す。ABORTED 以外(REQUESTED / 他 worker の CLAIMED / RUNNING / 別 worker が終端まで進めた SUCCEEDED / FAILED)は lease 失効で回収済み = WARN request not owned) / result_status=(OK|NG|FAILED|-) / exit_code= / comparison_result_id=(8 hex|-) / artifact_dir: <絶対パス>。comparison_results を作らないケース(比較定義なし・起動失敗)は result_status=- / comparison_result_id=-、終端 UPDATE 0 件(ABORTED 検出)は request_status=ABORTED。RUNNING 遷移の条件付き UPDATE(status='CLAIMED' AND worker_id=?)0 行(abort-rapid-crosscheck で ABORTED 済み / lease 失効で回収済み)は比較ツールを起動せず成果物 dir も comparison_results も作らず、request_status=<再 SELECT した現在の status> / result_status=- / exit_code=- / comparison_result_id=- / artifact_dir: - を出して 0(実行ログ WARN comparison not started ... reason=request_aborted / WARN request not owned ...)"
    stderr: "error: compare tool launch failed run_id=... command=... / error: management db update failed run_id=..."
    exit_codes:
      - code: 0
        meaning: "依頼を終端状態まで処理した(比較 NG / 実行エラーの 3 / 6 も 0)。RUNNING 遷移の条件付き UPDATE(status='CLAIMED' AND worker_id=?)が 0 件(abort-rapid-crosscheck で ABORTED 済み / lease 失効で回収済み)で比較を開始せず終了した場合も 0"
      - code: 6
        meaning: "比較ツールの起動自体に失敗(依頼は FAILED で終端、comparison_results は INSERT しない)、成果物 dir 作成不可、DB 更新失敗"
async_events:
  - name: "rapid-crosscheck-requests"
    channel: "rapid-crosscheck-requests"
    direction: "subscribe"
    message: "RapidCrosscheckRequestMessage"
    summary: "claim した依頼を条件付き UPDATE で RUNNING にし(0 件なら abort-rapid-crosscheck で ABORTED 済みとして比較を開始しない)、job_id の比較定義(crosscheck-job-map.csv)で比較ツールを起動、結果を依頼に保存して SUCCEEDED / FAILED で終端させる。comparison_results は比較ツールの終了コードを得たときだけ登録する(比較結果の登録条件)。速報比較依頼だけのリラン由来 run(parent_run_id あり・slot_executions 0 件)は依頼終端時に parallel_runs を COMPLETED にする"
schemas: []
