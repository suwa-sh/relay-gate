  work_unit_ids: ["CR-6078c4ed-011#1","CR-6078c4ed-012#1","CR-6078c4ed-013#1","CR-6078c4ed-014#1","CR-6078c4ed-015#1","CR-6078c4ed-016#1","CR-6078c4ed-017#1","CR-6078c4ed-018#1"]
context: |
  audit-event-contract.yaml は event_hash を「正規化済みイベント本体と previous_hash から算出する」と定めるのみで、
  正規化形式（対象フィールドと順序、null の表現、区切り、エスケープ、ハッシュ関数、出力表現）が無かった
  （CR-6078c4ed-011）。同じ run_id のチェーンには複数 UC が追記するため、UC ごとの実装が異なる文字列をハッシュすると
  チェーンが分岐し、定期検証ジョブが再計算できない。

  起動 UC は起動イベント送出失敗・timeout を stderr と終了コードで応答するだけで、commit 済みの STARTING 行が
  残っていた（CR-6078c4ed-012）。foreground の STARTING 滞留を検知・確定する UC が無く、運用者が RDB と監査から
  「何が起きたか」を確定できなかった。加えて、E2E Scenario が「foreground 完了を待つ（60 秒）」と「CLI 応答 10 秒以内」を
  同じ tier 仕様で要求し両立しなかった（CR-6078c4ed-013）。
decision: |
  監査 event_hash の正規化形式を audit-event-contract.yaml `hash_chain.canonical_form` に定義し、全 emitter と
  検証ジョブはこれだけを参照する。契約 fields[] 順の 13 項目（event_id … error_code）を `|` で連結し、null は空文字、
  非該当の '-' は文字列のまま、値中の `\` は `\\`、`|` は `\|` へエスケープし、末尾に `|previous_hash`（最初の
  イベントは空）を付けた UTF-8 文字列の SHA-256 を 16 進小文字 64 桁で記録する。uuid は小文字ハイフン区切り、
  occurred_at は UTC マイクロ秒 6 桁の ISO 8601 で直列化する。

  起動イベント送出失敗・timeout は起動 UC が補償記録する。送出失敗は FAILED（attempt_failed）、timeout は UNKNOWN
  （attempt_unknown。推測で FAILED にしない）へ、runner_result_events INSERT と runner_results UPDATE を同一
  transaction で commit し、続けて slot_launch_failed / slot_launch_timeout（error_code=launch_event_send_failed /
  launch_event_send_timeout）を hash-chain lock 契約で追記する。追記失敗は post_launch 契約（outbox 退避）に従う。
  標準出力契約（status=STARTING 行）は起動受付の記録として維持し、終了コードは送出失敗 1、timeout のみ 124 とする。
  foreground の後続では respond-foreground が status=FAILED かつ exit_code=NULL を退避コード 125 で応答し、
  background の後続では hang-detector の STARTING 走査に送出失敗/timeout の試行が現れない。

  CLI 応答 10 秒以内（CTP-009）の対象は、起動 UC では起動受付（transaction commit と起動イベント送出）まで、
  foreground 応答 UC では status 確定後の応答処理までとする。foreground 完了の待機は foreground 応答 UC の
  `wait_contract`（RELAYGATE_FOREGROUND_POLL_INTERVAL_SECONDS 間隔のポーリング、上限 execution_specs.
  hang_detect_limit_minutes、超過は 125）とし、起動 UC の E2E Scenario は送出順序・STARTING 存在・非待機の
  責務内 Then に改め、元の統合 Then は uc-dependencies.md の「UC 横断統合シナリオ」へ移す。
consequences:
  positive:
    - "監査イベントを追記する全 UC と検証ジョブが契約だけから同一の event_hash を算出でき、保存行から再計算して照合できる"
    - "起動イベント送出失敗・timeout 後の runner_results / runner_result_events / audit_logs と後続 UC の挙動が一意に決まる"
    - "起動 UC の E2E Scenario がハーネス注入なしに単一 tier で成立し、応答時間の対象範囲が UC 間で矛盾しない"
  negative:
    - "foreground 応答 UC が待機モデルになり、待機上限が hang_detect_limit_minutes に連動する（短すぎる設定は 125 応答を増やす）"
    - "foreground 試行の STARTING→RUNNING→SUCCEEDED/FAILED を確定する担い手が現行仕様に無い既存ギャップが、待機契約により顕在化する（docs/todo.md に確認項目として記録）"
alternatives_considered:
  - name: "起動 UC は STARTING 固定を維持し、STARTING 滞留の検知・確定を後続 UC の責務とする"
    reason_rejected: "foreground の STARTING 滞留を確定する UC が無く永続的に未確定になる。feedback request の採用案で不採用と明示された"
  - name: "正規化形式を JSON 直列化（キー順ソート）にする"
    reason_rejected: "実装が実 PostgreSQL テストを通過させている `|` 連結形式を採用案として確定済みであり、JSON 化は既存 hash の再計算を伴う"
  - name: "foreground 完了待機を起動 UC（select-slot）に残す"
    reason_rejected: "CLI 応答 10 秒以内と両立せず、起動 UC の Scenario が他 UC の責務を含んで単一 tier で検証できない"
