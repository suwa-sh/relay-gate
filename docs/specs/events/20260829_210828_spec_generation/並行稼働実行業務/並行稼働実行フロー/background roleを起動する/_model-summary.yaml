uc: "background roleを起動する"
business: "並行稼働実行業務"
buc: "並行稼働実行フロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-002"

models:
  - name: "StartBackgroundRequest"
    tier: "tier-facade"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "execution-spec.json"
  - name: "TriggerBackgroundStartCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "execution-spec.json"
  - name: "BackgroundStartTriggerClient"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "BackgroundStartJobEntry"
    tier: "tier-worker"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "StartBackgroundExecutionCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerExecutionResult"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerResultRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "AuditEventRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "該当なし（CTP-005監査ログ要件から導出）"

tables:
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = :run_id"
    indexes_needed: []
  - name: "slot_execution_specs"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = :run_id AND slot_type = :slot_type"
    indexes_needed: []
  - name: "runner_result_events"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "新規発番するUUID"
          - name: "run_id"
            value: "facadeから引き継いだrun_id"
          - name: "slot_type"
            value: "background対象slot（blue/green）"
          - name: "role_type"
            value: "固定値 background"
          - name: "attempt_id"
            value: "起動試行の一意識別子"
          - name: "attempt_no"
            value: "同一（run_id, slot_type, role_type）内の連番（1始まり）"
          - name: "event_name"
            value: "attempt_started / attempt_running / attempt_failed / attempt_unknown"
          - name: "status"
            value: "STARTING / RUNNING / FAILED / UNKNOWN"
          - name: "occurred_at"
            value: "イベント発生時刻"
          - name: "started_at"
            value: "attempt_running時のみ実行開始時刻（それ以外はNULL）"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_id", "event_name"]
        reason: "ユニーク制約。同一起動試行への同一遷移イベントの重複追記を防止し、クラッシュ後の再試行を冪等化する（CTP-006）"
        access_pattern: "起動試行の冪等INSERT"
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "facadeから引き継いだrun_id"
          - name: "slot_type"
            value: "background対象slot（blue/green）"
          - name: "role_type"
            value: "固定値 background"
          - name: "attempt_id"
            value: "起動試行の一意識別子"
          - name: "attempt_no"
            value: "同一（run_id, slot_type, role_type）内の連番（1始まり）"
          - name: "accepted_at"
            value: "起動受付時刻（STARTING遷移時点）"
          - name: "status"
            value: "固定値 STARTING（未記録の場合の冪等INSERT）"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "RUNNING（起動確認成功）/ FAILED（起動失敗）/ UNKNOWN（タイムアウト等の結果取得不能）"
          - name: "started_at"
            value: "起動確認成功時の実行開始時刻"
          - name: "updated_at"
            value: "対応するrunner_result_events.occurred_atと一致"
        where: "run_id = :run_id AND slot_type = :slot_type AND role_type = 'background' AND attempt_id = :attempt_id"
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_no"]
        reason: "ユニーク制約。起動試行連番の一意性を担保する。履歴INSERTとsnapshot UPSERTは同一transactionで実行する（LR-002）"
        access_pattern: "background起動の冪等性チェックと状態遷移UPDATE"
  - name: "audit_logs"
    rdra_info: "該当なし（CTP-005監査ログ要件・CTR-008失敗時契約から導出）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_name"
            value: "slot_launch_attempted（起動前）/ slot_launch_succeeded / slot_launch_failed / slot_launch_timeout（起動後）"
          - name: "run_id"
            value: "facadeから引き継いだrun_id"
          - name: "slot"
            value: "background対象slot（blue/green）"
          - name: "attempt_id"
            value: "起動試行のattempt_id"
          - name: "actor"
            value: "RELAYGATE_OPERATORの値（システム自動処理ではworker）"
          - name: "operation"
            value: "固定値 slot_launch"
          - name: "outcome"
            value: "accepted / succeeded / failed / timeout"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot", "attempt_id", "event_name"]
        reason: "ユニーク制約（冪等キー）。外部slot起動後の追記失敗はoutbox退避後、本キーで照合して重複なく再試行する（CTR-008）"
        access_pattern: "監査イベントの冪等INSERT"
  - name: "audit_chain_heads"
    rdra_info: "該当なし（CTP-005ハッシュチェーン要件から導出）"
    operations:
      - type: "SELECT"
        columns:
          - name: "head_hash"
            value: "previous_hash確定のためSELECT ... FOR UPDATEで排他ロック取得"
        where: "run_id = :run_id"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "当該run_idの最初の監査イベント時に新規作成"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "head_event_id"
            value: "追記した監査イベントのevent_id"
          - name: "head_hash"
            value: "追記した監査イベントのevent_hash"
          - name: "chain_length"
            value: "インクリメント"
        where: "run_id = :run_id"
    indexes_needed:
      - columns: ["run_id"]
        reason: "主キー。run_id単位でhash-chain追記を直列化する排他ロック対象"
        access_pattern: "監査イベント追記時のSELECT ... FOR UPDATE"

kvs: []
object_storage: []
