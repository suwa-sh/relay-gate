uc: "foreground roleの標準出力・標準エラー・終了コードを応答する"
business: "並行稼働実行業務"
buc: "並行稼働実行フロー"
commands:
  - name: "relaygate concurrent-run respond-foreground"
    tier: "tier-facade"
    summary: "foreground役割のRunner実行結果から標準出力・標準エラー・終了コードのみをジョブスケジューラへ応答する（foreground完了待機を含む）"
    args:
      - name: "--run-id"
        required: true
        description: "foreground役割のRunner実行結果を特定するrun_id"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "RDB接続文字列"
      - name: "RELAYGATE_LOG_ROOT"
        required: true
        description: "stdout.log/stderr.logの格納ルートディレクトリ"
      - name: "RELAYGATE_FOREGROUND_POLL_INTERVAL_SECONDS"
        required: false
        description: "foreground完了待機のポーリング間隔（秒）。未指定時は5秒（wait_contract）"
    stdin: "なし"
    stdout_contract: "stdout.logの内容をそのまま出力（整形は行末改行以外加えない）"
    stderr_contract: "stderr.logの内容をそのまま出力する。relay-gateエラー（退避コード125/124）で応答する場合は、取得可能ならstderr.logの内容を先に出力し、続けてrelay-gate自身のエラー内容（原因と次アクション）を併記する"
    exit_code_policy: "passthrough"
    exit_code_passthrough:
      source: "foreground exitcode.txt"
      range: "0-255"
      description: "status=SUCCEEDED/FAILED かつ exit_code が非NULL（exitcode.txt回収済み）のとき、exitcode.txtの値を0を含む全値そのままプロセス終了コードへ透過する。丸め・再割り当てをしない。status=FAILED かつ exit_code=NULL（起動イベント送出失敗の補償記録）は透過できる値が無いため退避コード125で応答する"
    wait_contract:
      description: "foreground実行の完了待機は本コマンドの責務とする（起動コマンド select-slot は起動受付までで応答し、foreground完了を待たない）"
      wait_target: "runner_results の対象run_idの role_type='foreground' 最新試行（attempt_no最大）の status が SUCCEEDED / FAILED / UNKNOWN / ABORTED のいずれかへ確定すること"
      poll_interval: "RELAYGATE_FOREGROUND_POLL_INTERVAL_SECONDS（既定 5 秒）"
      wait_origin: "待機上限の起点は対象試行の runner_results.accepted_at（本コマンドのプロセス起動時刻ではない）"
      wait_limit: "execution_specs.hang_detect_limit_minutes（run共通の1値）を上限とする。accepted_at + hang_detect_limit_minutes を超えても STARTING / RUNNING のままなら退避コード125（未確定）で応答し、待機を打ち切る。起動時点で既に上限を超えている場合は1回だけ確認して即座に125"
      missing_target: "対象run_idの execution_specs 行または role_type=foreground の runner_results 行が無い場合は待機せず即座に125（stderr: foreground実行結果を特定できません: run_id={run_id}）"
      response_time_note: "CTP-009 のCLI応答10秒以内は、status確定後の応答処理（snapshot取得・stdout.log/stderr.log読み取り・出力）に適用し、待機時間は含めない"
    exit_codes:
      - code: 125
        meaning: "relay-gate退避コード: 実行結果未確定（STARTING/RUNNINGのまま待機上限を超過）・取得不能（UNKNOWN、および起動イベント送出失敗の補償記録である status=FAILED かつ exit_code=NULL）・中止済み（ABORTED）。UNKNOWNを推測でFAILED相当の業務終了コードへ変換しない"
      - code: 124
        meaning: "relay-gate退避コード: relay-gateのバリデーションエラー（run_id未指定）"
    exit_code_notes: "退避コードは業務ジョブが通常使用しない値を予約したものであり、bashが自動生成する126（実行不可）・127（コマンド未検出）とは衝突させない（SR-006）"
screens:
  - name: "実行結果応答管理画面"
    route: "/cli/concurrent-run/respond-foreground"
    components: ["RunnerResultPanel"]
