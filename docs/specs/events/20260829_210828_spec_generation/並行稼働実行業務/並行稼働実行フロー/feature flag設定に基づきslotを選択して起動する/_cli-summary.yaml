uc: "feature flag設定に基づきslotを選択して起動する"
business: "並行稼働実行業務"
buc: "並行稼働実行フロー"
commands:
  - name: "relaygate concurrent-run select-slot"
    tier: "tier-facade"
    summary: "feature flag設定に基づきblue/greenのslotを選択し、slotごとの独立したジョブマップから実行先を解決してrun共通execution specとslot別実行設定（job_map_versionを含む）を確定して起動イベントを送出する。実行設定のINSERT・runner_results/runner_result_eventsのSTARTING記録・起動前監査イベント（slot_launch_accepted/slot_launch_attempted）の追記を同一transactionでcommitしてから外部slotへ送出し、送出失敗/timeoutはFAILED/UNKNOWNへ補償記録する。CLI応答時間の対象は起動受付までであり、foreground完了を待たない"
    args:
      - name: "--job-id"
        required: true
        description: "ジョブスケジューラから渡されるJOB_ID"
      - name: "-- 追加引数"
        required: false
        description: "ジョブ定義に付随する追加引数。要素順のままJSON配列としてexecution_specs.additional_argsへ保存する"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "RDB接続文字列"
      - name: "RELAYGATE_JOB_MAP_PATH_BLUE"
        required: false
        description: "blue slotのジョブマップファイルパス（BLUE_MODE が off 以外のとき必須）"
      - name: "RELAYGATE_JOB_MAP_PATH_GREEN"
        required: false
        description: "green slotのジョブマップファイルパス（GREEN_MODE が off 以外のとき必須）"
      - name: "RELAYGATE_CREDENTIAL_DIR"
        required: true
        description: "認証情報ディレクトリ。credential_ref からSSH秘密鍵を解決する（credential_resolution）"
      - name: "RELAYGATE_SSH_KEY_PATH"
        required: false
        description: "credential_ref が null のslotに用いる既定のSSH秘密鍵パス"
      - name: "BLUE_MODE"
        required: true
        description: "off/background/foreground のいずれか"
      - name: "GREEN_MODE"
        required: true
        description: "off/background/foreground のいずれか"
      - name: "RAPID_CROSSCHECK_MODE"
        required: true
        description: "on/off のいずれか"
      - name: "RELAYGATE_OPERATOR"
        required: true
        description: "監査イベントのactorへ記録する操作者識別子。省略時はfacadeを既定値としない（起動前監査ゲートのため必須）"
    stdin: "なし"
    stdout_contract: "run_id・slot_type・role・attempt_id・status=STARTINGを選択slotごとに1行で出力する（起動受付の記録。送出失敗/timeout時も維持し、実行状態の正本はrunner_results）"
    stderr_contract: "feature flag違反（BLUE_MODEとGREEN_MODEの同時foreground）・ジョブマップ未解決/不正・認証情報の解決失敗・起動前監査の追記失敗・起動イベント送出失敗/timeout時に原因と次アクションを1文ずつ出力する"
    exit_codes:
      - code: 0
        meaning: "正常終了（全起動対象slotへの起動イベント送出まで完了）"
      - code: 1
        meaning: "業務エラー（JOB_ID未解決・SSH認証情報の解決失敗・起動前監査の追記失敗による起動中止・起動イベント送出失敗（FAILEDへ補償記録））"
      - code: 2
        meaning: "バリデーションエラー（同時foreground・JOB_ID未指定・ジョブマップの欠落/不正・credential_ref の書式不正）"
      - code: 124
        meaning: "タイムアウト（RDB接続タイムアウト、または起動イベント送出timeout（UNKNOWNへ補償記録）。送出失敗と混在した場合は1）"
      - code: 130
        meaning: "SIGINT中断"
screens:
  - name: "起動slot選択画面"
    route: "/cli/concurrent-run/select-slot"
    components: ["ExecutionSpecCard", "Banner"]
