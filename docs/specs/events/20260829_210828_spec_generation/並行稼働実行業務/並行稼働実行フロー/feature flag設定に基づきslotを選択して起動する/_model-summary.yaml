uc: "feature flag設定に基づきslotを選択して起動する"
business: "並行稼働実行業務"
buc: "並行稼働実行フロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "SelectSlotRequest"
    tier: "tier-facade"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "execution-spec.json"
  - name: "SelectAndStartSlotCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "execution-spec.json"
  - name: "ExecutionSpec"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "execution-spec.json"
  - name: "SlotExecutionSpec"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
  - name: "ExecutionSpecRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "execution-spec.json"
  - name: "AuditEventRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "該当なし（CTP-005監査ログ要件から導出）"

tables:
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "起動時に新規発番するUUID"
          - name: "parent_run_id"
            value: "通常起動時はNULL（リラン時のみ元run_id）"
          - name: "job_id"
            value: "CLI引数 --job-id の値"
          - name: "additional_args"
            value: "CLI追加引数（run共通、nullable）。要素順のままJSON配列で保存する（argument_serialization）"
          - name: "hang_detect_limit_minutes"
            value: "background roleに選ばれたslotのジョブマップ値（両slotがbackgroundなら大きい方、backgroundが無ければ起動対象の唯一のslotの値）"
        where: ""
    indexes_needed:
      - columns: ["job_id"]
        reason: "同一JOB_IDに紐づくblue/green実行結果の相関取得に使用"
        access_pattern: "並行稼働実行結果を確認するUCからのjob_id検索"
  - name: "slot_execution_specs"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "本UCで新規発番したrun_id"
          - name: "slot_type"
            value: "選択されたslot（blue/green）。選択slotごとに1行"
          - name: "host"
            value: "ジョブマップ解決結果（slotごとに異なりうる）"
          - name: "exec_user"
            value: "ジョブマップ解決結果"
          - name: "script_path"
            value: "ジョブマップ解決結果"
          - name: "work_dir"
            value: "ジョブマップ解決結果"
          - name: "fixed_args"
            value: "ジョブマップ解決結果（nullable）。要素順のままJSON配列で保存する（argument_serialization）"
          - name: "impl_version"
            value: "当該slotの実装バージョン"
          - name: "credential_ref"
            value: "認証情報参照名のみ（実値は保存しない、nullable）。解決規則は cli-command-contract.yaml credential_resolution"
          - name: "job_map_version"
            value: "そのslotのジョブマップ（slotごとの独立ファイル）の job_map_version"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type"]
        reason: "複合主キー。同一runに対する同一slotの実行設定重複を防止する"
        access_pattern: "background起動・結果確認UCからの(run_id, slot_type)参照"
  - name: "runner_result_events"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "新規発番するUUID"
          - name: "run_id"
            value: "本UCで新規発番したrun_id"
          - name: "slot_type"
            value: "選択されたslot（blue/green）"
          - name: "role_type"
            value: "feature flagで決定した役割（foreground/background）"
          - name: "attempt_id"
            value: "起動試行の一意識別子"
          - name: "attempt_no"
            value: "固定値 1（初回起動）"
          - name: "event_name"
            value: "起動受付は attempt_started。起動イベント送出失敗の補償記録は attempt_failed、送出timeoutは attempt_unknown"
          - name: "status"
            value: "起動受付は STARTING。補償記録は FAILED（送出失敗）/ UNKNOWN（送出timeout。推測でFAILEDにしない）"
          - name: "occurred_at"
            value: "起動受付時刻（同一transactionの accepted_at / updated_at と同一値。UTC・マイクロ秒精度）"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_id", "event_name"]
        reason: "ユニーク制約。同一起動試行への同一遷移イベントの重複追記を防止し再試行を冪等化する"
        access_pattern: "クラッシュ後再試行時の冪等INSERT"
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "本UCで新規発番したrun_id"
          - name: "slot_type"
            value: "選択されたslot（blue/green）"
          - name: "role_type"
            value: "feature flagで決定した役割（foreground/background）"
          - name: "attempt_id"
            value: "起動試行の一意識別子"
          - name: "attempt_no"
            value: "固定値 1（初回起動）"
          - name: "accepted_at"
            value: "起動受付時刻（STARTING遷移時点）"
          - name: "status"
            value: "固定値 STARTING"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "起動イベント送出失敗は FAILED、送出timeoutは UNKNOWN（補償記録。runner_result_events の履歴INSERTと同一transaction。exit_code / stdout_path / stderr_path はNULLのまま）"
          - name: "updated_at"
            value: "対応する runner_result_events.occurred_at と同一値"
        where: "run_id = 本UCで新規発番したrun_id AND slot_type = 対象slot AND role_type = 対象role AND attempt_id = 対象試行 AND status = 'STARTING'"
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_no"]
        reason: "ユニーク制約。同一（run_id, slot_type, role_type）内の起動試行連番の一意性を担保する。runner_result_eventsへの履歴INSERTと同一transactionでsnapshotをINSERTする（LR-002）"
        access_pattern: "起動受付の冪等性チェックおよび後続UCからの起動試行identity参照"
  - name: "audit_logs"
    rdra_info: "該当なし（CTP-005監査ログ要件・CTR-008失敗時契約から導出）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_name"
            value: "slot_launch_accepted（slot='-', attempt_id='-'）/ slot_launch_attempted（選択slotごと）。起動イベント送出失敗/timeoutの補償記録後は slot_launch_failed / slot_launch_timeout（対象slotごと）"
          - name: "run_id"
            value: "本UCで新規発番したrun_id"
          - name: "actor"
            value: "RELAYGATE_OPERATORの値"
          - name: "operation"
            value: "固定値 slot_launch"
          - name: "outcome"
            value: "accepted（起動前）/ failed（送出失敗）/ timeout（送出timeout）"
          - name: "error_code"
            value: "送出失敗は launch_event_send_failed、送出timeoutは launch_event_send_timeout。起動前イベントではNULL"
          - name: "previous_hash"
            value: "audit_chain_heads排他ロックで確定したhead_hash"
          - name: "event_hash"
            value: "audit-event-contract.yaml hash_chain.canonical_form に従って算出（SHA-256、16進小文字64桁）"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot", "attempt_id", "event_name"]
        reason: "ユニーク制約（冪等キー）。再試行時の重複追記を防止する"
        access_pattern: "起動前監査ゲートの冪等INSERT"
  - name: "audit_chain_heads"
    rdra_info: "該当なし（CTP-005ハッシュチェーン要件から導出）"
    operations:
      - type: "SELECT"
        columns:
          - name: "head_hash"
            value: "previous_hash確定のためSELECT ... FOR UPDATEで排他ロック取得"
        where: "run_id = 本UCで新規発番したrun_id"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "当該run_idの最初の監査イベント時に新規作成"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "head_event_id"
            value: "追記した監査イベントのevent_id"
          - name: "head_hash"
            value: "追記した監査イベントのevent_hash"
          - name: "chain_length"
            value: "インクリメント"
          - name: "updated_at"
            value: "audit_logs.occurred_atと一致"
        where: "run_id = 本UCで新規発番したrun_id"
    indexes_needed:
      - columns: ["run_id"]
        reason: "主キー。run_id単位でhash-chain追記を直列化する排他ロック対象"
        access_pattern: "監査イベント追記時のSELECT ... FOR UPDATE"

kvs: []
object_storage: []
