version: '1.0'
contract_type: cli-command-contract
description: RelayGate の CLI コマンド契約。HTTP APIは存在せず、CLI引数・環境変数・ファイル成果物・終了コードが正本のインターフェース契約である
system_name: RelayGate
audit_event_contract_ref: _cross-cutting/api/audit-event-contract.yaml
dispatch_contract_rule: dispatch を持つコマンドは、dispatch[] の各エントリに env_vars / stdout_contract
  / stderr_contract / exit_codes を必ず定義する。コマンドレベルの定義は dispatch 先共通の最大集合であり、実装は --target の値で選ばれた dispatch エントリの定義に従う
exit_code_convention:
- code: 0
  meaning: 正常終了
- code: 1
  meaning: 業務エラー
- code: 2
  meaning: バリデーションエラー
- code: 124
  meaning: タイムアウト
- code: 130
  meaning: SIGINT中断（対話確認プロンプトでの中断等）
exit_code_convention_exception:
  command: relaygate concurrent-run respond-foreground
  policy: passthrough
  description: 本コマンドの終了コードはジョブスケジューラが業務ジョブの終了コードとして解釈するため、上記の運用者向け規約を適用しない。foregroundのexitcode.txtの値を0を含む全値そのまま透過し、relay-gate自身のエラーだけを退避コード125（実行結果未確定・取得不能・中止済み）と124（relay-gateのバリデーションエラー）へ分離する。この文脈での124はタイムアウトではなくバリデーションエラーを意味する（USDM
    SPEC-002-03 / arch SR-006）
job_map_contract:
  description: ジョブマップ（実行先解決定義）の契約。運用者が編集する外部入力ファイルであり、slotごとに独立したファイルとして管理する（1ファイルにblue/greenを併記する形式は採用しない）。blueとgreenは別ライフサイクルでメンテナンスされるため、片方のslotのジョブマップだけを差し替えて新世代実装を起動できる（USDM
    SPEC-009-01 / SPEC-012-01、CR-6078c4ed-018）
  env_vars:
  - name: RELAYGATE_JOB_MAP_PATH_BLUE
    required: BLUE_MODE が off 以外のとき必須
    description: blue slotのジョブマップファイルパス（JSON）
  - name: RELAYGATE_JOB_MAP_PATH_GREEN
    required: GREEN_MODE が off 以外のとき必須
    description: green slotのジョブマップファイルパス（JSON）
  env_var_rule: 読み込むのは起動対象（mode が background / foreground）に選ばれたslotのジョブマップだけである。mode=off のslotのジョブマップは読まず、当該環境変数が未設定でもエラーにしない。旧
    RELAYGATE_JOB_MAP_PATH（1ファイル共有）は廃止し、参照しない
  file_format: JSON（UTF-8、1ファイル1オブジェクト）
  structure:
    top_level:
    - name: job_map_version
      type: string
      required: true
      description: このファイル（このslotのジョブマップ）の版。slot_execution_specs.job_map_version へ保存する
    - name: slot_type
      type: string(enum blue|green)
      required: true
      description: このファイルが対象とするslot。環境変数（_BLUE / _GREEN）で指定したslotと一致しない場合はバリデーションエラー（ファイルの取り違え防止）
    - name: jobs
      type: object（キー = job_id）
      required: true
      description: job_id ごとの実行先解決定義
    job_entry:
    - name: host
      type: string
      required: true
      description: 実行先ホスト。slot_execution_specs.host へ保存する
    - name: exec_user
      type: string
      required: true
      description: 実行ユーザー。slot_execution_specs.exec_user へ保存する
    - name: script_path
      type: string
      required: true
      description: 実行スクリプトパス。slot_execution_specs.script_path へ保存する
    - name: work_dir
      type: string
      required: true
      description: 作業ディレクトリ。slot_execution_specs.work_dir へ保存する
    - name: fixed_args
      type: array of string
      required: false
      description: 固定引数（JSON配列。省略時は空配列 []）。要素順のまま slot_execution_specs.fixed_args へJSON配列として保存する（_cross-cutting/datastore/rdb-schema.yaml
        の argument_serialization を参照）
    - name: impl_version
      type: string
      required: true
      description: 当該slotの実装バージョン。slot_execution_specs.impl_version へ保存する
    - name: credential_ref
      type: string
      required: false
      description: 認証情報の参照名（省略時は null）。credential_resolution に従って解決する。実値（鍵・パスワード）をジョブマップへ書かない
    - name: hang_detect_limit_minutes
      type: integer（1以上）
      required: true
      description: このslotをbackground roleで起動した場合のハング疑い判定しきい値（分）。run共通の execution_specs.hang_detect_limit_minutes へ採用する規則は hang_detect_limit_minutes_rule
        を参照
  unknown_fields: 無視する（エラーにしない）。ただし無視したフィールドの値をRDB・監査イベント・標準出力・標準エラー・起動イベントへ出力してはならない（余剰フィールドに秘密情報が混入しても露出しないことを受け入れテストで検証する）
  hang_detect_limit_minutes_rule: run共通の execution_specs.hang_detect_limit_minutes には、background role に選ばれたslotのジョブマップの hang_detect_limit_minutes を採用する。両slotがbackgroundの場合は両ジョブマップの値のうち大きい方を採用する（ハング疑いの誤検知を避ける保守的な選び方）。backgroundのslotが無い場合（foregroundのみ）は、起動対象に選ばれた唯一のslotのジョブマップの値を採用する
  validation:
  - condition: 起動対象slotの環境変数（RELAYGATE_JOB_MAP_PATH_BLUE / _GREEN）が未設定
    exit_code: 2
    stderr: 'ジョブマップのパスが未設定です: slot_type={blue|green} env={RELAYGATE_JOB_MAP_PATH_BLUE|RELAYGATE_JOB_MAP_PATH_GREEN}'
  - condition: ジョブマップファイルが存在しない・読み取れない・JSONとして解析できない
    exit_code: 2
    stderr: 'ジョブマップを読み込めません: slot_type={blue|green} path={path} reason={理由}'
  - condition: 必須フィールド（top_level / job_entry の required=true）が欠落、または型・enum が不正、または slot_type がファイルと環境変数で不一致
    exit_code: 2
    stderr: 'ジョブマップの必須フィールドが欠落しています: slot_type={blue|green} path={path} field={フィールドパス}'
  - condition: 起動対象slotのジョブマップ jobs に指定 JOB_ID が存在しない
    exit_code: 1
    stderr: 'JOB_IDに対応するジョブマップが見つかりません: {job_id}'
  validation_rule: バリデーションは実行設定を確定する前（transaction開始前）に起動対象の全slot分を行う。1つでも失敗した場合は execution_specs / slot_execution_specs / runner_results / audit_logs へのINSERTを行わず、外部slotを起動しない
  readers:
  - feature flag設定に基づきslotを選択して起動する
  readers_note: ジョブマップを読むのは起動時に実行設定を確定する上記UCだけである。「background roleを起動する」「execution-spec.jsonの実行設定を保ったまま再実行する」はジョブマップを読まず、slot_execution_specs
    に保存済みの解決結果を用いる（SPEC-009-04）
  example:
    path: /etc/relaygate/job-map.blue.json
    content: '{"job_map_version":"v1.4.0","slot_type":"blue","jobs":{"daily-settlement":{"host":"blue-host-01","exec_user":"batchuser","script_path":"/opt/blue/run.sh","work_dir":"/opt/relaygate/work","fixed_args":["--mode","batch"],"impl_version":"blue-2.3.1","credential_ref":"cred-blue-batch","hang_detect_limit_minutes":30}}}'
credential_resolution:
  description: slot_execution_specs.credential_ref（認証情報の参照名）からSSH認証情報を解決する契約。facade（起動・中止・リラン）とworker（background起動）で共通に適用する（CR-6078c4ed-017、arch
    CTP-001）
  method: 認証情報ディレクトリ方式。ジョブマップ外の認証情報ディレクトリを参照名で引く。ssh_config の Host エイリアス方式は採用しない
  env_vars:
  - name: RELAYGATE_CREDENTIAL_DIR
    required: true（SSH接続を行う全コマンド）
    description: 認証情報ディレクトリのパス。配下に参照名と同名のファイルを置く
  - name: RELAYGATE_SSH_KEY_PATH
    required: false
    description: credential_ref が null のときに用いる既定のSSH秘密鍵パス。credential_ref が非nullのコマンド実行では参照しない
  resolution_rules:
  - "credential_ref が非null → 秘密鍵ファイルは {RELAYGATE_CREDENTIAL_DIR}/{credential_ref} とする"
  - "credential_ref が null → RELAYGATE_SSH_KEY_PATH を秘密鍵ファイルとする。RELAYGATE_SSH_KEY_PATH も未設定なら業務エラー（exit 1、stderr 'SSH認証情報を解決できません: credential_ref=null かつ RELAYGATE_SSH_KEY_PATH 未設定'）"
  - "解決したファイルが存在しない・読み取れない → 業務エラー（exit 1、stderr 'SSH認証情報を解決できません: credential_ref={参照名}'。ファイルパスの実値と鍵の内容は出力しない）"
  - "credential_ref の書式は ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ に限定する（パス区切り・'..' を含む値はディレクトリ外参照を防ぐためバリデーションエラー exit 2、stderr 'credential_ref の書式が不正です: slot_type={blue|green}'）"
  - "秘密鍵ファイルは所有者のみ読み取り可能（0600）で配置する。パーミッション検査の失敗は業務エラー（exit 1）として扱う"
  non_exposure: 認証情報の実値（鍵の内容・パスワード）はジョブマップ・RDB（slot_execution_specs.credential_ref は参照名のみ）・監査イベント・標準出力・標準エラー・起動イベントの引数のいずれにも現れない。検証方法は共通とし、鍵ファイルに固有の識別文字列を含めたうえで上記の各出力先にその文字列が現れないことを確認する
  applies_to:
  - relaygate concurrent-run select-slot
  - relaygate worker start-background-execution
  - relaygate abort blue request
  - relaygate abort blue confirm
  - relaygate abort green request
  - relaygate abort green confirm
  - relaygate rerun run（--target background）
commands:
- name: relaygate concurrent-run select-slot
  tier: tier-facade
  uc: feature flag設定に基づきslotを選択して起動する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: feature flag設定に基づきblue/greenのslotを選択し、run共通execution specとslot別実行設定を確定して起動する。run共通execution
    spec・slot別実行設定のINSERT、runner_results/runner_result_eventsのSTARTING記録、起動前監査イベント（slot_launch_accepted/slot_launch_attempted）の追記を同一transactionでcommitしてから外部slotへ起動イベントを送出する。送出に失敗・timeoutした試行は本コマンドがFAILED（attempt_failed）/UNKNOWN（attempt_unknown）へ補償記録し、slot_launch_failed/slot_launch_timeoutを追記する。CLI応答時間（10秒以内、CTP-009）の対象は起動受付（transaction
    commitと起動イベント送出）までであり、foreground実行の完了を待たない
  args:
  - name: --job-id
    required: true
    description: ジョブスケジューラから渡されるJOB_ID
  - name: -- 追加引数
    required: false
    description: ジョブ定義に付随する追加引数。要素順のまま execution_specs.additional_args へJSON配列として保存する（rdb-schema.yaml の argument_serialization）
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列
  - name: RELAYGATE_JOB_MAP_PATH_BLUE
    required: BLUE_MODE が off 以外のとき必須
    description: blue slotのジョブマップファイルパス（job_map_contract）
  - name: RELAYGATE_JOB_MAP_PATH_GREEN
    required: GREEN_MODE が off 以外のとき必須
    description: green slotのジョブマップファイルパス（job_map_contract）
  - name: RELAYGATE_CREDENTIAL_DIR
    required: true
    description: 認証情報ディレクトリ（credential_resolution）。credential_ref から起動イベント送出用のSSH秘密鍵を解決する
  - name: RELAYGATE_SSH_KEY_PATH
    required: false
    description: credential_ref が null のslotに用いる既定のSSH秘密鍵パス（credential_resolution）
  - name: BLUE_MODE
    required: true
    description: off/background/foreground のいずれか
  - name: GREEN_MODE
    required: true
    description: off/background/foreground のいずれか
  - name: RAPID_CROSSCHECK_MODE
    required: true
    description: on/off のいずれか
  - name: RELAYGATE_OPERATOR
    required: true
    description: 監査イベントのactorへ記録する操作者識別子。省略時はfacadeを既定値としない（起動前監査ゲートのため必須）
  stdin: なし
  stdout_contract: run_id・slot_type・role・attempt_id・status=STARTINGを選択slotごとに1行で出力する（起動受付の記録。起動イベント送出に失敗・timeoutした場合もこの契約を維持し、実行状態の正本は
    runner_results とする）
  stderr_contract: feature flag違反（BLUE_MODEとGREEN_MODEの同時foreground）・ジョブマップ未解決/不正・起動前監査の追記失敗・起動イベント送出失敗/timeout時に原因と次アクションを1文ずつ出力する（送出失敗/timeoutでは
    'slot_type={blue|green} attempt_id={attempt_id} を {FAILED|UNKNOWN} として記録しました' を含める）
  exit_codes:
  - code: 0
    meaning: 正常終了（全起動対象slotへの起動イベント送出まで完了）
  - code: 1
    meaning: 業務エラー（JOB_ID未解決・SSH認証情報の解決失敗・起動前監査の追記失敗による起動中止・起動イベント送出失敗（起動先接続失敗。当該試行をFAILEDへ補償記録））
  - code: 2
    meaning: バリデーションエラー（同時foreground・JOB_ID未指定・ジョブマップの欠落/不正・credential_ref の書式不正）
  - code: 124
    meaning: タイムアウト（RDB接続タイムアウト、または起動イベント送出timeout。送出timeoutの試行はUNKNOWNへ補償記録し推測でFAILEDを確定しない。送出失敗（1）とtimeout（124）が混在した場合は1）
  - code: 130
    meaning: SIGINT中断
  screens:
  - name: 起動slot選択画面
    route: /cli/concurrent-run/select-slot
    components:
    - ExecutionSpecCard
    - Banner
- name: relaygate concurrent-run start-background
  tier: tier-facade
  uc: background roleを起動する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: execution-spec.jsonで確定済みのbackground対象slotについてworkerへ起動トリガーを送出する
  args:
  - name: --run-id
    required: true
    description: 起動対象run_id
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列
  - name: RELAYGATE_WORKER_TRIGGER_ENDPOINT
    required: true
    description: tier-workerへの起動トリガー送出先
  - name: RELAYGATE_OPERATOR
    required: true
    description: 監査イベントのactorへ記録する操作者識別子
  stdin: なし
  stdout_contract: 'background起動: run_id/slot_type/attempt_id/attempt_no/status=STARTINGの1行'
  stderr_contract: background対象slotなし・接続失敗・起動前監査の追記失敗時に原因と次アクションを1文ずつ出力する
  exit_codes:
  - code: 0
    meaning: 正常終了
  - code: 1
    meaning: 業務エラー（background対象slotなし・接続失敗・起動前監査の追記失敗による起動中止）
  - code: 2
    meaning: バリデーションエラー（run_id未指定）
  - code: 124
    meaning: タイムアウト（RDB接続タイムアウト）
  - code: 130
    meaning: SIGINT中断
  screens:
  - name: background role起動画面
    route: /cli/concurrent-run/start-background
    components:
    - ExecutionSpecCard
    - RunnerResultPanel
- name: relaygate worker start-background-execution
  tier: tier-worker
  uc: background roleを起動する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: facadeからのトリガーを受けてbackground実行を開始しRunner実行結果を記録する
  args:
  - name: --run-id
    required: true
    description: facadeから引き継いだrun_id
  - name: --slot-type
    required: true
    description: 起動対象slot種別（blue/green）
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列
  - name: RELAYGATE_CREDENTIAL_DIR
    required: true
    description: 認証情報ディレクトリ（credential_resolution）。slot_execution_specs.credential_ref からSSH秘密鍵を解決する
  - name: RELAYGATE_SSH_KEY_PATH
    required: false
    description: credential_ref が null のときに用いる既定のSSH秘密鍵パス（credential_resolution）
  - name: RELAYGATE_OPERATOR
    required: true
    description: 監査イベントのactorへ記録する操作者識別子
  stdin: なし
  stdout_contract: 'background実行開始: run_id/slot_type/attempt_id/attempt_no/statusの1行。statusはSTARTING（受付時）またはRUNNING（起動確認後）'
  stderr_contract: SSH接続失敗・RDB書込み失敗・起動前監査の追記失敗時に原因と次アクションを1文ずつ出力する
  exit_codes:
  - code: 0
    meaning: 正常終了
  - code: 1
    meaning: 業務エラー（起動先接続失敗・起動前監査の追記失敗による起動中止）
  - code: 2
    meaning: バリデーションエラー（run_id/slot-type未指定）
  - code: 124
    meaning: タイムアウト（SSH起動確認タイムアウト。起動試行はUNKNOWNとして記録し推測でFAILEDを確定しない）
  - code: 130
    meaning: SIGINT中断
  screens:
  - name: background role起動画面
    route: /cli/concurrent-run/start-background
    components:
    - ExecutionSpecCard
    - RunnerResultPanel
- name: relaygate concurrent-run respond-foreground
  tier: tier-facade
  uc: foreground roleの標準出力・標準エラー・終了コードを応答する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: foreground役割のRunner実行結果から標準出力・標準エラー・終了コードのみをジョブスケジューラへ応答する
  args:
  - name: --run-id
    required: true
    description: foreground役割のRunner実行結果を特定するrun_id
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列
  - name: RELAYGATE_LOG_ROOT
    required: true
    description: stdout.log/stderr.logの格納ルートディレクトリ
  - name: RELAYGATE_FOREGROUND_POLL_INTERVAL_SECONDS
    required: false
    description: foreground完了待機のポーリング間隔（秒）。未指定時は5秒（wait_contract）
  stdin: なし
  stdout_contract: stdout.logの内容をそのまま出力（整形は行末改行以外加えない）
  stderr_contract: stderr.logの内容をそのまま出力する。relay-gateエラー（退避コード125/124）で応答する場合は、取得可能ならstderr.logの内容を先に出力し、続けてrelay-gate自身のエラー内容（原因と次アクション）を併記する
  exit_code_policy: passthrough
  exit_code_passthrough:
    source: foreground exitcode.txt
    range: 0-255
    description: status=SUCCEEDED/FAILED かつ exit_code が非NULL（exitcode.txt回収済み）のとき、exitcode.txtの値を0を含む全値そのままプロセス終了コードへ透過する。丸め・再割り当てをしない。status=FAILED
      かつ exit_code=NULL（起動イベント送出失敗の補償記録）は透過できる値が無いため退避コード125で応答する
  wait_contract:
    description: foreground実行の完了待機は本コマンドの責務とする（起動コマンド select-slot は起動受付までで応答し、foreground完了を待たない。CR-6078c4ed-013）
    wait_target: runner_results の対象run_idの role_type='foreground' 最新試行（attempt_no最大）の status が SUCCEEDED / FAILED / UNKNOWN / ABORTED のいずれかへ確定すること
    poll_interval: RELAYGATE_FOREGROUND_POLL_INTERVAL_SECONDS（既定 5 秒）
    wait_origin: 待機上限の起点は対象試行の runner_results.accepted_at（起動受付時刻。本コマンドのプロセス起動時刻ではない）。ハング監視の起点（started_at 未記録時は accepted_at）と同じ基準を用いる
    wait_limit: execution_specs.hang_detect_limit_minutes（run共通の1値）を上限とする。accepted_at + hang_detect_limit_minutes を超えても STARTING / RUNNING のままなら退避コード125（未確定）で応答し、待機を打ち切る。起動時点で既に上限を超えている場合は1回だけ SELECT し、未確定なら即座に125で応答する
    missing_target: "対象run_idの execution_specs 行または role_type='foreground' の runner_results 行が存在しない場合は待機せず即座に125で応答する（stderr 'foreground実行結果を特定できません: run_id={run_id}'）"
    response_time_note: CTP-009 のCLI応答10秒以内は、status確定後の応答処理（snapshot取得・stdout.log/stderr.log読み取り・出力）に適用し、待機時間は含めない
  exit_codes:
  - code: 125
    meaning: 'relay-gate退避コード: 実行結果未確定（STARTING/RUNNINGのまま待機上限を超過）・取得不能（UNKNOWN、および起動イベント送出失敗の補償記録である status=FAILED かつ exit_code=NULL）・中止済み（ABORTED）。UNKNOWNを推測でFAILED相当の業務終了コードへ変換しない'
  - code: 124
    meaning: 'relay-gate退避コード: relay-gateのバリデーションエラー（run_id未指定）'
  exit_code_notes: 退避コードは業務ジョブが通常使用しない値を予約したものであり、bashが自動生成する126（実行不可）・127（コマンド未検出）とは衝突させない（SR-006）
  screens:
  - name: 実行結果応答管理画面
    route: /cli/concurrent-run/respond-foreground
    components:
    - RunnerResultPanel
