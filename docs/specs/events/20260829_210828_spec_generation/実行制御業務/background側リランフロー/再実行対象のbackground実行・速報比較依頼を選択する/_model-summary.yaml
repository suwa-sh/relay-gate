uc: "再実行対象のbackground実行・速報比較依頼を選択する"
business: "実行制御業務"
buc: "background側リランフロー"

# facadeがbackground実行(BC-001/AG-002)、workerが速報比較依頼(BC-002/AG-003)をそれぞれ担当するため、
# primary BC/aggregateは主エントリポイントであるfacade側（background実行の選定）を採用する
bounded_context_id: "BC-001"
aggregate_id: "AG-002"

models:
  - name: "RerunSelectBackground CLI"
    tier: "tier-facade"
    layer: "presentation"
    type: "request"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "ListRerunCandidateBackgroundQuery"
    tier: "tier-facade"
    layer: "usecase"
    type: "query"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "Runner実行結果"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerResultRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RerunSelectRapidCrosscheck CLI"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: "速報比較依頼"
  - name: "ListRerunCandidateRapidCrosscheckQuery"
    tier: "tier-worker"
    layer: "usecase"
    type: "query"
    rdra_info: "速報比較依頼"
  - name: "速報比較依頼"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較依頼"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較依頼"

tables:
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "SELECT"
        columns: []
        where: "role_type = 'background' AND status IN ('SUCCEEDED', 'FAILED', 'UNKNOWN', 'ABORTED')（--status/--slot指定時はstatus・slot_typeで追加絞り込み）"
    indexes_needed:
      - columns: ["role_type", "status"]
        reason: "リラン候補一覧のためのrole_type+status絞り込みを高速化する（rdb-schema.yaml idx_runner_results_role_type_status）"
        access_pattern: "role_type='background'かつstatus IN (...)の範囲検索"
      - columns: ["slot_type", "status"]
        reason: "--slotフィルタによるblue/green絞り込みと状態絞り込みを高速化する（rdb-schema.yaml idx_runner_results_slot_type_status）"
        access_pattern: "slot_type指定+status条件による絞り込み"
  - name: "slot_execution_specs"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ? AND slot_type = ?（候補のslot別実行設定（host/impl_version等）の補足表示）"
    indexes_needed:
      - columns: ["slot_type"]
        reason: "slot種別単位でのリラン候補絞り込みを高速化する（rdb-schema.yaml idx_slot_execution_specs_slot_type）"
        access_pattern: "slot_type指定による絞り込み"
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    operations:
      - type: "SELECT"
        columns: []
        where: "status IN ('SUCCEEDED', 'FAILED', 'ABORTED')（--status指定時は単一状態へ絞り込み。parent_run_idを候補行へ含める）"
    indexes_needed:
      - columns: ["status", "lease_expires_at"]
        reason: "リラン候補一覧のためのstatus絞り込みを高速化する（rdb-schema.yaml idx_rapid_crosscheck_requests_status_lease_expires_at）"
        access_pattern: "status IN (...)の範囲検索"

kvs: []
object_storage: []
