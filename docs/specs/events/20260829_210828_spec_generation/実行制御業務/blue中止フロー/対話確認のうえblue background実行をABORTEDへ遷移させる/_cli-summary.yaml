uc: "対話確認のうえblue background実行をABORTEDへ遷移させる"
business: "実行制御業務"
buc: "blue中止フロー"
commands:
  - name: "relaygate abort blue confirm"
    tier: "tier-facade"
    summary: "対話確認（y/n二択）のうえ中止依頼済みのblue background実行をABORTEDへ遷移させる"
    args:
      - name: "--run-id"
        required: true
        description: "ABORTEDへ遷移させる対象run_id"
      - name: "--yes"
        required: false
        description: "非TTY環境で対話確認に代えて明示同意を表すフラグ"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "RDB接続文字列"
      - name: "RELAYGATE_CREDENTIAL_DIR"
        required: true
        description: "認証情報ディレクトリ。対象runのblue slot_execution_specs.credential_ref からSSH秘密鍵を解決する（credential_resolution）"
      - name: "RELAYGATE_SSH_KEY_PATH"
        required: false
        description: "credential_ref が null のときに用いる既定のSSH秘密鍵パス（credential_resolution）"
      - name: "RELAYGATE_OPERATOR"
        required: true
        description: "監査イベントのactorへ記録する操作者識別子"
    stdin: "対象run_id・影響範囲・取消不可を明示したy/n二択の対話確認プロンプト"
    stdout_contract: "ABORTED遷移完了: run_idの1行（y応答時のみ）"
    stderr_contract: "n応答時・非TTY未同意時のエラーメッセージ"
    exit_codes:
      - code: 0
        meaning: "正常終了（ABORTEDへの遷移完了）"
      - code: 1
        meaning: "業務エラー（n応答による中断、中止依頼未済）"
      - code: 2
        meaning: "バリデーションエラー（run_id未指定、非TTY環境で--yes未指定）"
screens:
  - name: "blue background中止確認画面"
    route: "/cli/abort/blue/confirm"
    components: ["AbortConfirmDialog"]
