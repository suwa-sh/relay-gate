uc: "RUNNING中の確報比較依頼の中止を依頼する"
business: "実行制御業務"
buc: "確報比較中止フロー"
commands:
  - name: "relaygate abort final-crosscheck request"
    tier: "tier-worker"
    summary: "RUNNING中の確報比較依頼について中止依頼を受理する（状態遷移は行わない）"
    args:
      - name: "--run-id"
        type: "string"
        required: true
        description: "中止依頼対象の確報比較依頼のrun_id"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "final_crosscheck_requestsへ接続するRDB接続文字列"
    stdin: "なし"
    stdout_contract: "受理時のみ対象run_id・対象日・現在状態・次アクション（confirmコマンド）を1行で出力する"
    stderr_contract: "対象未存在・状態不一致・引数不正の場合、原因と次アクションを1文ずつ出力する"
    exit_codes:
      - code: 0
        meaning: "正常終了（中止依頼を受理）"
      - code: 1
        meaning: "業務エラー（対象未存在、またはstatusがRUNNING以外）"
      - code: 2
        meaning: "バリデーションエラー（run_id未指定）"
      - code: 124
        meaning: "タイムアウト（RDB接続タイムアウト）"
      - code: 130
        meaning: "SIGINT中断"
screens:
  - name: "確報比較中止依頼画面"
    route: "/cli/abort/final-crosscheck/request"
    components: ["CrossCheckRequestRow", "Button"]
