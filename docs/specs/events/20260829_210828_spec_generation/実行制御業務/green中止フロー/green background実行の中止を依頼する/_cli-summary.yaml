uc: "green background実行の中止を依頼する"
business: "実行制御業務"
buc: "green中止フロー"
commands:
  - name: "relaygate abort green request"
    tier: "tier-facade"
    summary: "RUNNING中のgreen background実行に中止依頼を発行する"
    args:
      - name: "--run-id"
        required: true
        description: "中止依頼対象のgreen background実行run_id"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "RDB接続文字列"
      - name: "RELAYGATE_CREDENTIAL_DIR"
        required: true
        description: "認証情報ディレクトリ。対象runのgreen slot_execution_specs.credential_ref からSSH秘密鍵を解決する（credential_resolution）"
      - name: "RELAYGATE_SSH_KEY_PATH"
        required: false
        description: "credential_ref が null のときに用いる既定のSSH秘密鍵パス（credential_resolution）"
    stdin: "なし"
    stdout_contract: "中止依頼受理: run_idの1行"
    stderr_contract: "対象なし・既に完了済みの場合のエラーメッセージ"
    exit_codes:
      - code: 0
        meaning: "正常終了"
      - code: 1
        meaning: "業務エラー（対象なし・状態不整合）"
      - code: 2
        meaning: "バリデーションエラー（run_id未指定）"
screens:
  - name: "green background中止依頼画面"
    route: "/cli/abort/green/request"
    components: ["RunnerResultPanel", "Button"]
