uc: "対話確認のうえgreen background実行をABORTEDへ遷移させる"
business: "実行制御業務"
buc: "green中止フロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-002"

models:
  - name: "ConfirmAbortGreenRequest"
    tier: "tier-facade"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "ConfirmAbortGreenCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerExecutionResult"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerResultRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "AuditLogRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "該当なし（CTP-005監査ログ要件から導出）"

tables:
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = :run_id AND slot_type = 'green' AND role_type = 'background'（起動試行identity=(run_id, slot_type, role_type, attempt_id)）"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "'ABORTED'（遷移元はRUNNINGまたはUNKNOWN）"
          - name: "updated_at"
            value: "runner_result_events.occurred_atと一致させる"
        where: "run_id = :run_id AND slot_type = 'green' AND role_type = 'background' AND attempt_id = :attempt_id（runner_result_eventsのINSERTと同一transaction）"
    indexes_needed:
      - columns: ["slot_type", "status"]
        reason: "ABORTED遷移対象のslot・状態絞り込み（rdb-schema.yaml idx_runner_results_slot_type_status）"
        access_pattern: "relaygate abort green confirm --run-id"
  - name: "runner_result_events"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "新規発行するUUID"
          - name: "run_id"
            value: "対象run_id"
          - name: "slot_type"
            value: "'green'固定"
          - name: "role_type"
            value: "'background'固定"
          - name: "attempt_id"
            value: "対象起動試行のattempt_id"
          - name: "attempt_no"
            value: "対象起動試行のattempt_no"
          - name: "event_name"
            value: "'attempt_aborted'固定"
          - name: "status"
            value: "'ABORTED'固定"
          - name: "occurred_at"
            value: "遷移時刻（runner_resultsのUPDATEと同一transaction）"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_id", "event_name"]
        reason: "ユニーク制約による再試行の冪等化（rdb-schema.yaml uq_runner_result_events_attempt_event_name）"
        access_pattern: "冪等キーによる重複追記防止"
  - name: "audit_logs"
    rdra_info: "該当なし（RDRAに明示定義なし。CTP-005監査ログ要件から導出。列定義とイベント契約は_cross-cutting/datastore/rdb-schema.yamlと_cross-cutting/api/audit-event-contract.yamlを正本とする）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "新規発行するUUID"
          - name: "event_name"
            value: "'abort_confirmed'固定"
          - name: "schema_version"
            value: "'1.0'固定"
          - name: "run_id"
            value: "対象run_id"
          - name: "slot"
            value: "'green'固定"
          - name: "attempt_id"
            value: "'-'（起動試行に紐づかない中止イベント）"
          - name: "occurred_at"
            value: "イベント発生時刻"
          - name: "actor"
            value: "RELAYGATE_OPERATOR環境変数の値"
          - name: "operation"
            value: "'abort'固定"
          - name: "outcome"
            value: "'succeeded'（遷移完了）/'rejected'（y以外の回答による中断）"
          - name: "previous_hash"
            value: "audit_chain_heads.head_hash（run_id内の最初のイベントはNULL）"
          - name: "event_hash"
            value: "正規化済みイベント本体とprevious_hashから算出"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot", "attempt_id", "event_name"]
        reason: "冪等キーのユニーク制約（rdb-schema.yaml uq_audit_logs_run_slot_attempt_event_name）"
        access_pattern: "冪等キーによる重複追記防止"
  - name: "audit_chain_heads"
    rdra_info: "該当なし（CTP-005ハッシュチェーン要件から導出）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = :run_id（SELECT ... FOR UPDATEで排他ロックしprevious_hashを確定する）"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "対象run_id（当該run_idの最初のイベント時のみ）"
          - name: "head_event_id"
            value: "追記した監査イベントのevent_id"
          - name: "head_hash"
            value: "追記した監査イベントのevent_hash"
          - name: "chain_length"
            value: "1"
          - name: "updated_at"
            value: "audit_logs.occurred_atと一致させる"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "head_event_id"
            value: "追記した監査イベントのevent_id"
          - name: "head_hash"
            value: "追記した監査イベントのevent_hash"
          - name: "chain_length"
            value: "chain_length + 1"
          - name: "updated_at"
            value: "audit_logs.occurred_atと一致させる"
        where: "run_id = :run_id（audit_logs INSERTと同一transaction）"
    indexes_needed: []

kvs: []
object_storage: []
