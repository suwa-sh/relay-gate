round: 2
findings:
- id: R2-001
  viewpoint: 契約生成適性
  severity: blocker
  target: _cross-cutting/api/cli-command-contract.yaml:322（respond-foreground.wait_contract.missing_target）
  claim: 'R1-010 で追加した missing_target の値がプレーンスカラーのまま「: 」を含むため、YAML としてパースできない（3 契約のうち本ファイルのみ失敗）。契約から bash 定数を生成する工程が止まる。latest/ の同名ファイルも同じ行で失敗する。'
  evidence: 'python3 -c ''import yaml,sys; yaml.safe_load(open(sys.argv[1]))'' _cross-cutting/api/cli-command-contract.yaml → yaml.scanner.ScannerError: mapping values are not allowed here in line 322, column 148。原因は値末尾の (stderr ''foreground実行結果を特定できません: run_id={run_id}'') 内の「: run_id」。同じ内容を UC03 _cli-summary.yaml:36 は二重引用符で囲んでおりパース可能。audit-event-contract.yaml / rdb-schema.yaml は OK。'
  suggested_fix: 'missing_target の値全体を二重引用符で囲む（または stderr 文言を wait_contract の別キー stderr_message: "..." に分離する）。修正後に 3 契約のパース確認を行い、latest/ へも反映する。'
- id: R2-002
  viewpoint: 一貫性
  severity: major
  target: 並行稼働実行業務/並行稼働実行フロー/background roleを起動する/spec.md:83-97（シーケンス）, :131-134（状態遷移一覧）, :196-212（Scenario 起動先接続失敗 / SSH起動タイムアウト） / tier-worker.md:5, :33, :130-154（Scenario 接続失敗 / タイムアウト / credential_ref解決）
  claim: R1-005 で追加したビジネスルール「STARTING 行が存在する試行へ worker は起動イベント（SSH）を再送出しない。行が存在しない場合に限り STARTING を冪等 INSERT して送出する」と、同一 UC 内の処理フロー・状態遷移一覧・既存 Scenario が食い違ったまま残っている。既存 Scenario はすべて Given で status=STARTING の行を前提にしながら、Then で worker の SSH 接続（鍵解決・argv 連結・接続失敗→FAILED・タイムアウト→UNKNOWN）を要求しており、新ルールでは起こり得ない振る舞いを検証している。
  evidence: 'spec.md:120 ビジネスルール「対象試行の runner_results 行が STARTING（起動UCが送出済み）の場合は起動イベントを再送出せず … 起動確認と回収不能時の FAILED/UNKNOWN 判定だけを行う」。一方 spec.md:83-86 のシーケンスは無条件に STARTING UPSERT → 「WGW->>Green: green実装background起動イベント（SSH経由…）」を続け、:90/:93 で SSH 起動失敗 / タイムアウトに分岐する。spec.md:196-198「Given … att-green-0001（status="STARTING"）一式が存在する / And green-host-01 への SSH 接続が失敗する状態である / Then FAILED」、:205-207 同様に UNKNOWN。tier-worker.md:146-152「Given runner_results に … status="STARTING" の行が存在する … Then SSH は /etc/relaygate/credentials/cred-green-batch を秘密鍵として green-host-01 へ接続する」。tier-worker.md:5「STARTING 記録と起動前監査を同一 transaction で commit してから blue/green 実装を SSH 経由で非同期起動し」、:33「124 タイムアウト（SSH起動タイムアウト…）」。状態遷移一覧 :133-134 の STARTING→FAILED / UNKNOWN のトリガーも「SSH起動失敗 / SSH起動タイムアウト」のまま。UC01 spec.md:98 は green background へ UC01 が SSH 送出し、:155 で「送出成功後の STARTING 以降の遷移は UC02 が担う」としており、UC02 の新ルールとは整合するが UC02 の既存記述とは整合しない。'
  suggested_fix: UC02 の処理フロー（mermaid シーケンス）を「対象試行の行を SELECT → STARTING なら SSH 送出をスキップし started-at.txt 回収による起動確認へ / 行なしなら STARTING 冪等 INSERT + slot_launch_attempted 追記 → SSH 送出 / FAILED・UNKNOWN・RUNNING 以降なら exit 1」の分岐に書き換える。状態遷移一覧の STARTING→FAILED / UNKNOWN のトリガーを「起動確認不能（started-at.txt 回収失敗）/ 回収タイムアウト」（行なし経路の SSH 失敗 / timeout を含むなら併記）に改める。既存 Scenario「起動先実装への接続に失敗し FAILED」「SSH起動タイムアウトで UNKNOWN」「credential_ref から SSH 秘密鍵を解決し…起動する」は、Given を「runner_results に対象試行の行が存在しない」に変えるか、STARTING 前提のまま SSH ではなく起動確認（started-at.txt 回収）の失敗/タイムアウトを検証する形に改める。tier-worker.md:5 / :33 / 標準出力契約 :25 の記述も同じ分岐に揃える。
- id: R1-007
  viewpoint: 一貫性
  severity: minor
  target: _cross-cutting/uc-dependencies.md:131（#13）
  claim: 'UC11 内の走査 SQL は IN (''STARTING'',''RUNNING'',''UNKNOWN'') に統一されたが、cross-cutting の uc-dependencies.md #13 は依然「status IN (''STARTING'',''RUNNING'') AND role_type=''background''」のままで、UC11 spec / tier-worker と食い違う。'
  evidence: uc-dependencies.md:131「`runner_results` の status IN ('STARTING','RUNNING') AND role_type='background' 行」。UC11 spec.md:32/:45/:67-68/:183、tier-worker.md:12/:137 はすべて IN ('STARTING','RUNNING','UNKNOWN')。
  suggested_fix: 'uc-dependencies.md #13 の依存内容を IN (''STARTING'',''RUNNING'',''UNKNOWN'') に揃え、「UNKNOWN 行は送出 timeout（UC01 補償記録）または回収不能の試行で、回収再試行の対象」と 1 文添える。'
