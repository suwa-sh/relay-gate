round: 1
findings:
  - id: "R1-001"
    viewpoint: "トレーサビリティ"
    severity: "major"
    target: "_cross-cutting/usdm-acceptance-matrix.md:33, :35（SPEC-002-03 #1 / #3 の行）"
    claim: "SPEC-002-03 #1 / #3 が指す UC03 の Scenario 名が、本イベントで改名した Scenario 見出しと一致しない（改名前の名前が残っている）。逆引き行列から実在しない Scenario を引くことになる。"
    evidence: "行列は「Scenario: foreground実行結果がまだ確定していない」「tier-facade.md / Scenario: foreground実行結果が未確定で退避コード125を返す」を記載。実在する見出しは spec.md:165「Scenario: foreground実行結果が待機上限内に確定しない」、tier-facade.md:120「Scenario: foreground実行結果が待機上限内に確定せず退避コード125を返す」（grep 'Scenario:' で確認。旧名はどのファイルにも存在しない）。"
    suggested_fix: "SPEC-002-03 #1 の UC Scenario 列を「Scenario: foreground実行結果が待機上限内に確定しない」へ、#1 / #3 の tier Scenario 列を「tier-facade.md / Scenario: foreground実行結果が待機上限内に確定せず退避コード125を返す」へ更新する。#1 には CR-012 で追加した「Scenario: 起動イベント送出失敗でFAILEDかつexit_code=NULLの場合は退避コード125で応答する」も併記する。"

  - id: "R1-002"
    viewpoint: "依存の宣言"
    severity: "major"
    target: "並行稼働実行業務/並行稼働実行フロー/foreground roleの標準出力・標準エラー・終了コードを応答する/_model-summary.yaml:30-55 / _cross-cutting/datastore/rdb-schema.yaml:96-105（execution_specs.used_by）"
    claim: "UC03 の wait_contract は execution_specs.hang_detect_limit_minutes を SELECT するが、UC03 の _model-summary.yaml（データアクセス定義）と rdb-schema.yaml の execution_specs.used_by に UC03 が無い。uc-dependencies.md #3 とは食い違い、契約生成物（テーブル利用 UC）からこの依存が落ちる。"
    evidence: "spec.md:30 に「SELECT hang_detect_limit_minutes FROM execution_specs WHERE run_id = ?」、uc-dependencies.md #3 に「execution_specs.hang_detect_limit_minutes（foreground 完了待機の上限）」がある一方、_model-summary.yaml の tables は runner_results のみ。rdb-schema.yaml execution_specs.used_by は 起動UC / background起動 / 速報依頼作成 / 確報実行 / リラン の 5 UC で UC03 を含まない。_changes.md でも UC03 の更新対象は spec.md / tier-facade.md / _cli-summary.yaml のみ。"
    suggested_fix: "UC03 _model-summary.yaml の tables に execution_specs（SELECT hang_detect_limit_minutes、where run_id = :run_id）を追加し、rdb-schema.yaml の execution_specs.used_by に「foreground roleの標準出力・標準エラー・終了コードを応答する: [SELECT]」を追加する。あわせて _model-summary.yaml の runner_results.exit_code の value「未完了・UNKNOWN時はNULL」に「起動イベント送出失敗の補償記録（FAILED）時もNULL」を追記する。"

  - id: "R1-003"
    viewpoint: "一貫性"
    severity: "major"
    target: "_cross-cutting/datastore/rdb-schema.yaml:36-37（datetime_rules.ordering_guarantee / same_transaction_rule）"
    claim: "datetime_rules の ordering_guarantee（同一 transaction 内で連続して記録するイベントには単調増加する値を与える）と same_transaction_rule（時刻は transaction 内で 1 回だけ取得して使い回す）が矛盾する。slot 起動トランザクションは 1 transaction で attempt_started × 2 と slot_launch_accepted + slot_launch_attempted × 2 を記録するため、実装者はどちらかを選ばざるを得ない。"
    evidence: "rdb-schema.yaml:36「同一transaction内で連続して記録するイベントには単調増加する値を与える」、:37「時刻はtransaction内で1回だけ取得して使い回す」。audit-event-contract.yaml:210 の検証は「previous_hash が同一run_id内で occurred_at 昇順の直前行の event_hash と一致」を要求しており、同一 occurred_at が複数行あると昇順の直前行が一意に決まらない。UC01 spec.md:194 は各 attempt_started 行の occurred_at が対応する accepted_at / updated_at と同一値であることを要求する。"
    suggested_fix: "same_transaction_rule の単位を「transaction」ではなく「1 つのレコード遷移（履歴 1 行 + それに対応する snapshot 列、監査 1 行 + chain head）」に改め、「同一 transaction で複数イベントを記録する場合はイベントごとに時刻を取得し、単調増加させる。各イベントに対応する時刻カラム同士は同一値にする」と明記する。監査検証は occurred_at 昇順ではなく previous_hash → event_hash の連鎖（chain_length 順）を正とし、occurred_at は非減少であることの検査に留める旨を audit-event-contract.yaml verification_guarantee に反映する。"

  - id: "R1-004"
    viewpoint: "gherkin品質"
    severity: "major"
    target: "_cross-cutting/api/cli-command-contract.yaml:320（wait_contract.wait_limit）/ UC03 spec.md:165-174 / tier-facade.md:120-127"
    claim: "待機上限 hang_detect_limit_minutes の起点（respond-foreground 起動時刻からか、runner_results.accepted_at / started_at からか）が定義されておらず、Scenario「待機上限（1分）を超えても」も起点を示さない。select-slot と respond-foreground は別プロセスで時間差があるため、実装者の解釈で 125 応答のタイミングが変わる。"
    evidence: "wait_limit は「execution_specs.hang_detect_limit_minutes（run共通の1値）を上限とする」のみ。ハング監視 UC は started_at（未記録なら accepted_at）起点で同じ値を判定しており（hang UC spec.md 分岐条件「ハング疑い判定」）、UC03 が起動時刻起点だと同じしきい値の意味が UC 間で異なる。"
    suggested_fix: "wait_contract に wait_origin を追加し「待機上限の起点は runner_results の対象試行の accepted_at（プロセス起動時刻ではない）。起動時点で既に上限を超えていれば 1 回 SELECT して未確定なら即 125」と定義する。UC03 spec.md / tier-facade.md の待機上限 Scenario の Given に accepted_at の具体値（例: 実行開始の 30 秒前）を置き、Then で「accepted_at から 60 秒経過後の最初のポーリングで 125」と期待時刻を具体化する。"

  - id: "R1-005"
    viewpoint: "一貫性"
    severity: "major"
    target: "UC01 spec.md:98（GW->>Green: green実装起動イベント（SSH経由、background role））/ UC02 spec.md:83-86, :130 / uc-dependencies.md #2, #13"
    claim: "background slot への起動イベントを誰が送出するかが二重に定義されている（UC01 select-slot が SSH で green へ直接送出し、UC02 worker も自ら STARTING を UPSERT してから SSH で起動する）。CR-012 の補償記録（UC01 が green background を FAILED/UNKNOWN へ更新）後に UC02 がどう振る舞うか（再送出するか、FAILED 行を対象外にするか）が未定義で、「STARTING 走査は送出成功試行のみ」の前提も UC02 の独自 STARTING UPSERT と両立しない。"
    evidence: "UC01 spec.md:98「GW->>Green: green実装起動イベント（SSH経由、background role。先に送出）」と補償記録 Scenario（spec.md:314-324）は green background の SSH 送出失敗を UC01 が FAILED へ記録する。UC02 spec.md:83「runner_result_events INSERT（attempt_started ... 既存試行は一意制約で冪等スキップ）+ runner_results UPSERT（status='STARTING'）」、:86「WGW->>Green: green実装background起動イベント（SSH経由）」。UC02 の全 Scenario は Given で status=STARTING を前提とし、FAILED/UNKNOWN 行に対する挙動の記述が無い。hang UC spec.md 処理フロー 1「STARTING で走査に現れる試行は、起動イベントの送出には成功したが起動確認前の試行だけ」。"
    suggested_fix: "UC01 の「background 起動イベント」を UC02 の起動トリガー（RELAYGATE_WORKER_TRIGGER_ENDPOINT 経由）と定義し直すか、逆に UC02 worker は SSH 送出を行わず起動確認（RUNNING 遷移）のみを担うかを決め、両 spec の処理フローを一本化する。加えて UC02 に「対象 background 試行が既に FAILED/UNKNOWN（UC01 の補償記録）の場合は再送出せず exit 1（stderr 文言を定義）」の Scenario を追加し、uc-dependencies.md #2 / #13 の記述をそれに合わせる。"

  - id: "R1-006"
    viewpoint: "契約生成適性"
    severity: "minor"
    target: "_cross-cutting/api/cli-command-contract.yaml:29, :32, :115, :156, :159（env_vars[].required）"
    claim: "env_vars[].required が boolean と自由文字列（「BLUE_MODE が off 以外のとき必須」「true（SSH接続を行う全コマンド）」）で混在しており、契約から bash 定数を機械生成する際に型が揃わない。UC01 _cli-summary.yaml は同じ変数を required: false + description で表現しており、表現が二重化している。"
    evidence: "cli-command-contract.yaml:29「required: BLUE_MODE が off 以外のとき必須」、:115「required: true（SSH接続を行う全コマンド）」。UC01 _cli-summary.yaml:19-24 は required: false。"
    suggested_fix: "required は boolean のみとし、条件付き必須は required: false + required_when: \"BLUE_MODE != off\" のような別キー（または description）へ移す。credential_resolution.env_vars の「true（…）」も required: true に直し注記は description へ移す。"

  - id: "R1-007"
    viewpoint: "一貫性"
    severity: "minor"
    target: "実行監視業務/ハング監視フロー/background実行の未完了・非0終了・速報比較異常を定期検知する/tier-worker.md:137 / spec.md:32, :45, :67-68"
    claim: "走査条件が同一 UC 内で食い違う。spec.md の分岐条件・処理フロー（tier-worker.md:15）は status IN ('STARTING','RUNNING','UNKNOWN') だが、データフロー図・シーケンス図・tier-worker.md の Scenario は IN ('STARTING','RUNNING') のまま。"
    evidence: "spec.md:183「SELECT対象（status IN ('STARTING','RUNNING','UNKNOWN') AND role_type='background'）」に対し、spec.md:68「SELECT * FROM runner_results WHERE status IN ('STARTING','RUNNING') AND role_type='background'」、tier-worker.md:137 も同じ 2 値。CR-012 で「送出 timeout により UNKNOWN となった試行は回収再試行の対象に含まれる」と明記したため、UNKNOWN を含まない SQL は矛盾する。"
    suggested_fix: "spec.md のデータフロー図（:32）・シーケンス（:67-68）・レイヤー表（:45）と tier-worker.md:137 の SQL を IN ('STARTING','RUNNING','UNKNOWN') に揃える。"

  - id: "R1-008"
    viewpoint: "gherkin品質"
    severity: "minor"
    target: "並行稼働実行業務/並行稼働実行フロー/feature flag設定に基づきslotを選択して起動する/tier-facade.md:151-154, :207-211"
    claim: "tier-facade の Background は blue ジョブマップの fixed_args を宣言していないが、Scenario「追加引数をJSON配列で保存し要素順のままargvへ復元する」は argv に [\"--mode\",\"batch\"] が前置されることを期待している。Given に無い値を Then が要求している。"
    evidence: "tier-facade.md:153 の Background は host / impl_version / credential_ref / hang_detect_limit_minutes のみ。:211「argvは ... [\"--mode\",\"batch\",\"--note\",\"a b \\\"c\\\"\"] である」。spec.md:181 の E2E Background には fixed_args=[\"--mode\",\"batch\"] がある。"
    suggested_fix: "tier-facade.md の Background に fixed_args=[\"--mode\",\"batch\"] を追記する（spec.md:181 と同値）。"

  - id: "R1-009"
    viewpoint: "契約生成適性"
    severity: "minor"
    target: "_cross-cutting/api/audit-event-contract.yaml:231-233（transaction_rules「起動イベント送出失敗の補償記録」）"
    claim: "description は「runner_result_events INSERT と runner_results UPDATE を同一 transaction で commit し、その後 slot_launch_failed / slot_launch_timeout を追記」と 2 transaction を示すのに、tables に audit_logs / audit_chain_heads も列挙しており、同一 transaction の対象と読める。"
    evidence: "audit-event-contract.yaml:232-233。rdb-schema.yaml transaction_rules（:973-）の他エントリは tables = 同一 transaction の対象として使われている。"
    suggested_fix: "エントリを 2 つに分ける（(a) 状態遷移: tables [runner_result_events, runner_results]、(b) 補償監査追記: tables [audit_logs, audit_chain_heads]、lock_contract に従い (a) の commit 後に実行）か、tables を (a) の 2 テーブルに限定し監査は description の参照に留める。"

  - id: "R1-010"
    viewpoint: "gherkin品質"
    severity: "minor"
    target: "並行稼働実行業務/並行稼働実行フロー/foreground roleの標準出力・標準エラー・終了コードを応答する/spec.md:162-208 / _cross-cutting/uc-dependencies.md #3"
    claim: "run_id に対応する execution_specs 行または foreground の runner_results 行が存在しない場合の挙動が UC03 spec に無い。uc-dependencies.md #3 は「対象行が無い場合は exit 125」とするが、待機モデルでは hang_detect_limit_minutes を読めないため待機するのか即応答するのかを実装者が推測する。"
    evidence: "spec.md の異常系 Scenario は待機上限超過 / FAILED+NULL / UNKNOWN / ABORTED / run_id 未指定のみ。uc-dependencies.md:121「対象行が無い場合は exit 125（stderr「foreground実行結果が未確定です」）」。"
    suggested_fix: "UC03 spec.md / tier-facade.md に Scenario「run_id に対応する実行設定または foreground 試行が存在しない」を追加し、Then「待機せず即座に 125」「stderr『foreground実行結果を特定できません: run_id=...』（uc-dependencies.md #3 の文言と揃える）」を明記する。"
resolved:
  - id: "R1-001"
    resolution: "fixed: usdm-acceptance-matrix.md の SPEC-002-03 #1/#3 を改名後の Scenario 名（待機上限内に確定しない / 待機上限内に確定せず退避コード125を返す）へ更新し、#1 に送出失敗 FAILED+exit_code=NULL の Scenario を併記"
  - id: "R1-002"
    resolution: "fixed: UC03 _model-summary.yaml に execution_specs SELECT（hang_detect_limit_minutes）と runner_results.accepted_at を追加、rdb-schema.yaml execution_specs.used_by に UC03 SELECT を追加、exit_code の NULL 条件に補償記録を追記"
  - id: "R1-003"
    resolution: "fixed: datetime_rules を「同一値の単位 = 1 イベントとその派生カラム」「同一 transaction 内の複数イベントはイベントごとに時刻取得し単調増加」へ改め、audit 契約の verification_guarantee を previous_hash 連鎖順を正とし occurred_at は連鎖順に単調増加を検査する記述へ変更"
  - id: "R1-004"
    resolution: "fixed: wait_contract に wait_origin（runner_results.accepted_at）と起動時点で上限超過時の 1 回確認・即 125 を追加。UC03 spec.md / tier-facade.md / _cli-summary.yaml の待機 Scenario に accepted_at の具体値（実行開始の 30 秒前）と期待タイミングを明記し、上限超過済み Scenario を追加"
  - id: "R1-005"
    resolution: "fixed: background 起動イベント（SSH）の送出主体を UC01 と定義し、UC02 worker は STARTING 行が存在する試行へは再送出せず起動確認のみ、FAILED/UNKNOWN（UC01 補償記録）または RUNNING 以降は exit 1（stderr 定義）とする分岐条件・ビジネスルール・Scenario「起動UCが補償記録済みの試行は再送出しない」を UC02 spec.md / tier-worker.md に追加。uc-dependencies.md #1/#2 を整合"
  - id: "R1-006"
    resolution: "deferred: env_vars[].required の型統一（boolean + required_when）は契約フォーマット全体の変更であり、feedback request の範囲外。次回の cross-cutting 整備で扱う（minor）"
  - id: "R1-007"
    resolution: "fixed: UC11 spec.md のデータフロー図・レイヤー表・シーケンスと tier-worker.md の SQL を status IN ('STARTING','RUNNING','UNKNOWN') に統一"
  - id: "R1-008"
    resolution: "fixed: UC01 tier-facade.md の Background に fixed_args=[\"--mode\",\"batch\"] を追記"
  - id: "R1-009"
    resolution: "fixed: audit-event-contract.yaml の transaction_rules を「補償記録（状態遷移）」と「補償記録（監査追記）」の 2 エントリに分割し tables を分離"
  - id: "R1-010"
    resolution: "fixed: wait_contract に missing_target を追加し、UC03 spec.md / tier-facade.md に Scenario「run_idに対応する実行設定またはforeground試行が存在しない」（待機せず即 125、stderr『foreground実行結果を特定できません: run_id=…』）を追加。uc-dependencies.md #3 の文言を揃えた"
