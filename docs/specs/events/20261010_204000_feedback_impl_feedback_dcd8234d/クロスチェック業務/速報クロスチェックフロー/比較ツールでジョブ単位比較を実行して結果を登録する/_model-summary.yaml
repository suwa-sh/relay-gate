uc: "比較ツールでジョブ単位比較を実行して結果を登録する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"
bounded_context_id: "BC-002"
aggregate_id: "AG-002"

models:
  - name: "ExecuteComparison"
    tier: "tier-rapid-crosscheck"
    layer: "usecase"
    type: "command"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
  - name: "ComparisonOutcome"
    tier: "tier-rapid-crosscheck"
    layer: "domain"
    type: "value-object"
    rdra_info: "比較ツール実行結果"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
  - name: "RapidCompareCommandRecord"
    # rapid-crosscheck.env の RAPID_COMPARE_COMMAND(1 行)を読み、依頼レコードの値でプレースホルダを置換する
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "速報クロスチェック設定"
  - name: "ParallelRunRecord"
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"

tables:
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
    operations:
      - type: "UPDATE"
        # 条件付き UPDATE(条件「依頼中止可否判定」の worker 側の競合規則)。更新件数 0(abort-rapid-crosscheck で ABORTED 済み / lease 失効で回収済み)なら比較ツールを起動せず終了コード 0
        columns:
          - name: "status"
            value: "RUNNING"
          - name: "started_at"
            value: "現在時刻(ローカル時刻)"
        where: "run_id = ? AND status = 'CLAIMED' AND worker_id = ?(0 件なら比較を開始しない)"
      - type: "SELECT"
        # 起動コマンドのプレースホルダ置換値を読む({job_id}={job_id}列 / {params}=parameters / {blue_exit_code} / {green_exit_code})。RUNNING 遷移 0 件のときの status / worker_id 再 SELECT も兼ねる
        columns:
          - name: "job_id"
            value: "{job_id} 置換に使う"
          - name: "parameters"
            value: "{params} 置換に使う"
          - name: "blue_exit_code"
            value: "{blue_exit_code} 置換に使う"
          - name: "green_exit_code"
            value: "{green_exit_code} 置換に使う"
          - name: "status"
            value: "RUNNING 遷移 0 件時の再 SELECT(ABORTED なら WARN comparison not started ... reason=request_aborted、それ以外は WARN request not owned)"
          - name: "worker_id"
            value: ""
        where: "run_id = ?"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "SUCCEEDED(exit_code=0) / FAILED(非 0・起動失敗)"
          - name: "exit_code"
            value: "比較ツールの終了コード(起動失敗は 6)"
          - name: "stdout"
            value: "比較ツール stdout 全文(そのまま保存)"
          - name: "stderr"
            value: "比較ツール stderr 全文(そのまま保存)"
          - name: "error_summary"
            value: "stderr 先頭 1 行 / 起動失敗は launch failed(SUCCEEDED は NULL)"
          - name: "completed_at"
            value: "比較ツール終了時刻(ローカル時刻)"
        where: "run_id = ? AND status = 'RUNNING' AND worker_id = ?"
    indexes_needed: []
  - name: "parallel_runs"
    rdra_info: "並行稼働実行(parallel_run)"
    operations:
      - type: "SELECT"
        columns:
          - name: "parent_run_id"
            value: ""
        where: "run_id = ?(リラン由来判定)"
      - type: "UPDATE"
        # 状態「並行稼働実行」RUNNING → COMPLETED。速報比較依頼だけを新規作成したリラン由来 run(parent_run_id IS NOT NULL かつ slot_executions 0 件)の依頼終端時のみ実行する。リラン由来判定は事前の SELECT(上記 parallel_runs.parent_run_id / 下記 slot_executions 件数)で行い、本 UPDATE の where には含めない(契約 U8 の SQL と同形)
        columns:
          - name: "status"
            value: "COMPLETED"
          - name: "completed_at"
            value: "依頼終端時刻(ローカル時刻)"
        where: "run_id = ? AND status = 'RUNNING'"
    indexes_needed: []
  - name: "slot_executions"
    rdra_info: "slot 実行"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?(件数 0 = 業務ジョブを再実行していないリラン由来 run)"
    indexes_needed: []

kvs: []
object_storage: []
