schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-002"
title: "同期/非同期境界: RDBのlease/claimポーリング+CronJobを非同期実行の唯一の機構とする"
status: "approved"
generated_at: "2026-08-17T15:58:17+09:00"
context: |
  RelayGateのアーキテクチャ（arch-design.yaml technology_context）にはメッセージキュー/イベントバス系技術
  （Kafka, SQS, EventBridge等）の記載がなく、エアーギャップ環境のためSaaS型の非同期連携サービスも利用できない。
  一方でBUC「速報クロスチェックフロー」「確報クロスチェックフロー」「ハング監視フロー」は非同期処理を前提とし、
  情報.tsvの速報比較依頼・確報比較依頼はREQUESTED/CLAIMED/RUNNING/SUCCEEDED/FAILED/ABORTEDの状態を持つ
  lease/claim機構を明記している。
decision: |
  非同期処理はすべてRDBのlease/claim機構（worker が REQUESTED 行を CLAIMED に更新し lease_expires_at を設定、
  未着手のままlease失効した場合はREQUESTEDへ差し戻す）とCronJobによる定期ポーリング（速報/確報クロスチェックworker、
  hang-detector）で実現する。パブリッシュ/サブスクライブ型のメッセージチャネルは導入せず、`_cross-cutting/api/asyncapi.yaml`
  は生成しない。tier-worker.md の「イベント処理仕様」節はすべて「トリガー: CronJob定期実行 or RDB lease/claim取得」
  として統一表現する。
consequences:
  positive:
    - "外部SaaS非同期基盤への依存を排除でき、エアーギャップ環境の制約（プロジェクト背景・technology_context）に完全準拠する"
    - "lease/claim機構により複数workerからの同時claimを状態遷移レベルで制御でき、CTP-006（冪等性方針）と整合する"
    - "実装がRDB+シェルスクリプトのみで完結し、追加ミドルウェア（メッセージブローカー）の運用負荷が発生しない"
  negative:
    - "ポーリング間隔に依存するレイテンシが発生する（CLI応答10秒以内という即時応答要件とは別に、非同期処理の完了検知には最大でCronJob周期分の遅延が生じる）"
    - "lease失効・楽観ロック競合（LR-008）などポーリング特有の競合制御ロジックを各tier-worker.mdで個別に実装する必要がある"
alternatives_considered:
  - name: "軽量メッセージキュー（RabbitMQ等）をオンプレミスに自前構築する"
    reason_rejected: "新規ミドルウェアの運用・監視・バックアップ対象が増え、SP-009バックアップ運用・SP-011インフラ冗長化前提の対象範囲が拡大する。RDRA/archにその設計判断の記載がなく推測での追加になるため不採用"
  - name: "ファイルシステムベースのメッセージパッシング（inotify等）"
    reason_rejected: "複数worker間の排他制御・lease管理をファイルシステムレベルで実装するのはRDBのトランザクション制御より複雑になり、AG-003の不変条件（lease失効差し戻し）を安全に実装しにくい"
