version: '1.0'
contract_type: cli-command-contract
description: RelayGate の CLI コマンド契約。HTTP APIは存在せず、CLI引数・環境変数・ファイル成果物・終了コードが正本のインターフェース契約である
system_name: RelayGate
audit_event_contract_ref: _cross-cutting/api/audit-event-contract.yaml
dispatch_contract_rule: dispatch を持つコマンドは、dispatch[] の各エントリに env_vars / stdout_contract
  / stderr_contract / exit_codes を必ず定義する。コマンドレベルの定義は dispatch 先共通の最大集合であり、実装は --target の値で選ばれた dispatch エントリの定義に従う
exit_code_convention:
- code: 0
  meaning: 正常終了
- code: 1
  meaning: 業務エラー
- code: 2
  meaning: バリデーションエラー
- code: 124
  meaning: タイムアウト
- code: 130
  meaning: SIGINT中断（対話確認プロンプトでの中断等）
commands:
- name: relaygate concurrent-run select-slot
  tier: tier-facade
  uc: feature flag設定に基づきslotを選択して起動する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: feature flag設定に基づきblue/greenのslotを選択し、run共通execution specとslot別実行設定を確定して起動する。run共通execution
    spec・slot別実行設定のINSERT、runner_results/runner_result_eventsのSTARTING記録、起動前監査イベント（slot_launch_accepted/slot_launch_attempted）の追記を同一transactionでcommitしてから外部slotを起動する
  args:
  - name: --job-id
    required: true
    description: ジョブスケジューラから渡されるJOB_ID
  - name: -- 追加引数
    required: false
    description: ジョブ定義に付随する追加引数
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列
  - name: RELAYGATE_JOB_MAP_PATH
    required: true
    description: ジョブマップファイルパス
  - name: BLUE_MODE
    required: true
    description: off/background/foreground のいずれか
  - name: GREEN_MODE
    required: true
    description: off/background/foreground のいずれか
  - name: RAPID_CROSSCHECK_MODE
    required: true
    description: on/off のいずれか
  - name: RELAYGATE_OPERATOR
    required: true
    description: 監査イベントのactorへ記録する操作者識別子。省略時はfacadeを既定値としない（起動前監査ゲートのため必須）
  stdin: なし
  stdout_contract: run_id・slot_type・role・attempt_id・status=STARTINGを選択slotごとに1行で出力する
  stderr_contract: feature flag違反（BLUE_MODEとGREEN_MODEの同時foreground）・ジョブマップ未解決・起動前監査の追記失敗時に原因と次アクションを1文ずつ出力する
  exit_codes:
  - code: 0
    meaning: 正常終了
  - code: 1
    meaning: 業務エラー（ジョブマップ未解決・接続失敗・起動前監査の追記失敗による起動中止）
  - code: 2
    meaning: バリデーションエラー（同時foreground・JOB_ID未指定）
  - code: 124
    meaning: タイムアウト（RDB接続タイムアウト）
  - code: 130
    meaning: SIGINT中断
  screens:
  - name: 起動slot選択画面
    route: /cli/concurrent-run/select-slot
    components:
    - ExecutionSpecCard
    - Banner
- name: relaygate concurrent-run start-background
  tier: tier-facade
  uc: background roleを起動する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: execution-spec.jsonで確定済みのbackground対象slotについてworkerへ起動トリガーを送出する
  args:
  - name: --run-id
    required: true
    description: 起動対象run_id
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列
  - name: RELAYGATE_WORKER_TRIGGER_ENDPOINT
    required: true
    description: tier-workerへの起動トリガー送出先
  - name: RELAYGATE_OPERATOR
    required: true
    description: 監査イベントのactorへ記録する操作者識別子
  stdin: なし
  stdout_contract: 'background起動: run_id/slot_type/attempt_id/attempt_no/status=STARTINGの1行'
  stderr_contract: background対象slotなし・接続失敗・起動前監査の追記失敗時に原因と次アクションを1文ずつ出力する
  exit_codes:
  - code: 0
    meaning: 正常終了
  - code: 1
    meaning: 業務エラー（background対象slotなし・接続失敗・起動前監査の追記失敗による起動中止）
  - code: 2
    meaning: バリデーションエラー（run_id未指定）
  - code: 124
    meaning: タイムアウト（RDB接続タイムアウト）
  - code: 130
    meaning: SIGINT中断
  screens:
  - name: background role起動画面
    route: /cli/concurrent-run/start-background
    components:
    - ExecutionSpecCard
    - RunnerResultPanel
- name: relaygate worker start-background-execution
  tier: tier-worker
  uc: background roleを起動する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: facadeからのトリガーを受けてbackground実行を開始しRunner実行結果を記録する
  args:
  - name: --run-id
    required: true
    description: facadeから引き継いだrun_id
  - name: --slot-type
    required: true
    description: 起動対象slot種別（blue/green）
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列
  - name: RELAYGATE_SSH_KEY_PATH
    required: true
    description: blue/green実装ホストへのSSH接続鍵パス
  - name: RELAYGATE_OPERATOR
    required: true
    description: 監査イベントのactorへ記録する操作者識別子
  stdin: なし
  stdout_contract: 'background実行開始: run_id/slot_type/attempt_id/attempt_no/statusの1行。statusはSTARTING（受付時）またはRUNNING（起動確認後）'
  stderr_contract: SSH接続失敗・RDB書込み失敗・起動前監査の追記失敗時に原因と次アクションを1文ずつ出力する
  exit_codes:
  - code: 0
    meaning: 正常終了
  - code: 1
    meaning: 業務エラー（起動先接続失敗・起動前監査の追記失敗による起動中止）
  - code: 2
    meaning: バリデーションエラー（run_id/slot-type未指定）
  - code: 124
    meaning: タイムアウト（SSH起動タイムアウト。起動試行はUNKNOWNとして記録し推測でFAILEDを確定しない）
  - code: 130
    meaning: SIGINT中断
  screens:
  - name: background role起動画面
    route: /cli/concurrent-run/start-background
    components:
    - ExecutionSpecCard
    - RunnerResultPanel
- name: relaygate concurrent-run respond-foreground
  tier: tier-facade
  uc: foreground roleの標準出力・標準エラー・終了コードを応答する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: foreground役割のRunner実行結果から標準出力・標準エラー・終了コードのみをジョブスケジューラへ応答する
  args:
  - name: --run-id
    required: true
    description: foreground役割のRunner実行結果を特定するrun_id
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列
  - name: RELAYGATE_LOG_ROOT
    required: true
    description: stdout.log/stderr.logの格納ルートディレクトリ
  stdin: なし
  stdout_contract: stdout.logの内容をそのまま出力（整形は行末改行以外加えない）
  stderr_contract: stderr.logの内容、または未確定時のエラーメッセージ
  exit_codes:
  - code: 0
    meaning: 正常終了（foreground実行結果のexit_code=0を反映）
  - code: 1
    meaning: 業務エラー（foreground実行結果未確定、または対象のexit_code非0を反映）
  - code: 2
    meaning: バリデーションエラー（run_id未指定）
  screens:
  - name: 実行結果応答管理画面
    route: /cli/concurrent-run/respond-foreground
    components:
    - RunnerResultPanel
- name: relaygate concurrent-run result
  tier: tier-facade
  uc: 並行稼働実行結果を確認する
  business: 並行稼働実行業務
  buc: 並行稼働実行フロー
  summary: job_idまたはrun_id指定でblue/green並行稼働の実行結果を参照する
  args:
  - name: --job-id
    required: false
    description: ジョブスケジューラのJOB_ID。job_id/run_idいずれか必須
  - name: --run-id
    required: false
    description: 単一実行結果を特定するrun_id。job_id/run_idいずれか必須
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB（ジョブキュー兼管理DB）接続文字列
  stdin: なし
  stdout_contract: slot_typeごとにセクション分割した実行結果一覧テキスト。各行はrun_id/parent_run_id/slot_type/role_type/attempt_id/attempt_no/status/accepted_at/exit_codeを含み、statusはSTARTING/RUNNING/SUCCEEDED/FAILED/UNKNOWN/ABORTEDのいずれかを明示する
  stderr_contract: 該当データなし・パラメータ不足時のエラーメッセージ
  exit_codes:
  - code: 0
    meaning: 正常終了
  - code: 1
    meaning: 業務エラー（該当データなし）
  - code: 2
    meaning: バリデーションエラー（job_id・run_id未指定）
  screens:
  - name: 並行稼働実行結果確認画面
    route: /cli/concurrent-run/result
    components:
    - RunnerResultPanel
    - StatusBadge
- name: relaygate rapid-crosscheck create
  tier: tier-worker
  uc: blue/green runnerの完了通知を受けて速報比較依頼を作成する
  business: クロスチェック業務
  buc: 速報クロスチェックフロー
  summary: job_id単位でblue/green双方の完了済みbackground実行が揃った未依頼ジョブを検知し速報比較依頼をREQUESTED状態で新規作成する（CronJob定期実行）
  args: []
  env_vars:
  - name: RAPID_CROSSCHECK_MODE
    required: true
    description: on/off。offの場合は速報比較依頼を作成しない
  stdin: なし
  stdout_contract: 処理件数・作成したjob_id一覧を構造化ログとして出力する
  stderr_contract: RDB接続エラー等の技術例外のみ出力する
  exit_codes:
  - code: 0
    meaning: 正常終了（0件処理を含む）
  - code: 1
    meaning: 業務エラー（RDB接続エラー等）
  screens:
  - name: 速報比較依頼作成画面
    route: /cli/rapid-crosscheck/create
    components:
    - CrossCheckRequestRow
    - Banner
- name: relaygate rapid-crosscheck run
  tier: tier-worker
  uc: 速報クロスチェックを実行し差分を検知する
  business: クロスチェック業務
  buc: 速報クロスチェックフロー
  summary: REQUESTED状態の速報比較依頼をlease取得しblue/green実行結果を比較、速報比較依頼状態を確定し速報比較結果を作成する（CronJob定期実行）
  args: []
  env_vars:
  - name: RAPID_CROSSCHECK_LEASE_MINUTES
    required: false
    description: lease期限（分）。未指定時は既定値5分を使用する
  stdin: なし
  stdout_contract: 処理したrun_id・comparison_result・diff_countを構造化ログとして出力する
  stderr_contract: 比較対象未確定・RDB接続エラー等の技術例外のみ出力する
  exit_codes:
  - code: 0
    meaning: 正常終了（対象なし・SUCCEEDED・FAILED判定いずれも含む）
  - code: 1
    meaning: 業務エラー（RDB接続エラー等）
  screens:
  - name: 速報クロスチェック実行画面
    route: /cli/rapid-crosscheck/run
    components:
    - RunnerResultPanel
    - StatusBadge
- name: relaygate rapid-crosscheck result
  tier: tier-worker
  uc: 速報クロスチェック結果を確認する
  business: クロスチェック業務
  buc: 速報クロスチェックフロー
  summary: job_idまたはrun_id指定で速報比較依頼・速報比較結果を参照し標準出力へ表示する
  args:
  - name: --job-id
    required: false
    description: 対象ジョブID（--run-idと排他的ではないがいずれか必須）
  - name: --run-id
    required: false
    description: 対象run_id（--job-idと排他的ではないがいずれか必須）
  env_vars: []
  stdin: なし
  stdout_contract: run_id/job_id/状態/comparison_result(OK-NG)/diff_count/diff_detail_uriを1行または表形式で出力する
  stderr_contract: 対象が見つからない場合・引数未指定の場合のエラーメッセージのみ出力する
  exit_codes:
  - code: 0
    meaning: 正常終了（結果取得成功）
  - code: 1
    meaning: 業務エラー（対象job_id/run_idの速報比較依頼が存在しない）
  - code: 2
    meaning: バリデーションエラー（job_id/run_idいずれも未指定）
  screens:
  - name: 速報クロスチェック結果確認画面
    route: /cli/rapid-crosscheck/result
    components:
    - CrossCheckRequestRow
    - StatusBadge
- name: relaygate final-crosscheck run
  tier: tier-worker
  uc: 全テーブル・全ファイルを対象に確報クロスチェックを実行する
  business: クロスチェック業務
  buc: 確報クロスチェックフロー
  summary: CronJobから起動され、REQUESTED状態の確報比較依頼をlease/claim取得し全テーブル・全ファイルの整合性比較を実行する
  args: []
  env_vars:
  - name: RELAYGATE_WORKER_ID
    required: true
    description: lease/claim取得時に記録するworker識別子
  - name: RELAYGATE_LEASE_TTL_SECONDS
    required: false
    description: lease有効期間（秒）。未指定時は600秒
  stdin: なし
  stdout_contract: 処理したrun_id/statusをログとして出力する（実行のたびに1行）
  stderr_contract: lease取得失敗・比較対象データ取得失敗時にエラー内容を出力する
  exit_codes:
  - code: 0
    meaning: 正常終了（対象依頼なし、または比較処理完了）
  - code: 1
    meaning: 業務エラー（比較対象データ取得失敗等）
  screens:
  - name: 確報クロスチェック実行画面
    route: /cli/final-crosscheck/run
    components:
    - CrossCheckRequestRow
    - RunnerResultPanel
- name: relaygate final-crosscheck result
  tier: tier-worker
  uc: 確報クロスチェック結果を確認する
  business: クロスチェック業務
  buc: 確報クロスチェックフロー
  summary: 対象日の確報比較依頼の状態（SUCCEEDED/FAILED等）を照会する
  args:
  - name: --target-date
    required: true
    description: 照会対象日（YYYY-MM-DD形式）
  env_vars: []
  stdin: なし
  stdout_contract: run_id/target_date/status/lease_expires_at/worker_idを整形出力する
  stderr_contract: 対象日の確報比較依頼が存在しない場合、またはtarget-date形式不正の場合にエラーメッセージを出力する
  exit_codes:
  - code: 0
    meaning: 正常終了（照会成功）
  - code: 1
    meaning: 業務エラー（対象日の確報比較依頼が存在しない）
  - code: 2
    meaning: バリデーションエラー（target-date形式不正）
  screens:
  - name: 確報クロスチェック結果確認画面
    route: /cli/final-crosscheck/result
    components:
    - CrossCheckRequestRow
    - StatusBadge
- name: relaygate final-crosscheck respond
  tier: tier-worker
  uc: 確報クロスチェック結果をstdout/stderr/exitcodeで応答する
  business: クロスチェック業務
  buc: 確報クロスチェックフロー
  summary: 確報比較依頼のstatus（SUCCEEDED/FAILED）を標準出力・標準エラー・終了コードのみでジョブスケジューラへ応答する
  args:
  - name: --run-id
    required: true
    description: 応答対象の確報比較依頼のrun_id
  env_vars: []
  stdin: なし
  stdout_contract: status=SUCCEEDEDの場合に固定文言のみを出力する（差分件数・レポートURIは含めない）
  stderr_contract: status=FAILEDまたは未確定の場合に固定文言のみを出力する（差分件数・レポートURIは含めない）
  exit_codes:
  - code: 0
    meaning: 正常終了（status=SUCCEEDED）
  - code: 1
    meaning: 業務エラー（status=FAILED、またはstatus未確定）
  screens:
  - name: 確報結果応答画面
    route: /cli/final-crosscheck/respond
    components:
    - RunnerResultPanel
- name: relaygate hang-watch detect
  tier: tier-worker
  uc: background実行の未完了・非0終了・速報比較異常を定期検知する
  business: 実行監視業務
  buc: ハング監視フロー
  summary: STARTINGまたはRUNNING状態かつrole_type='background'のRunner実行結果と速報比較結果NGを走査し、ハング疑い・background実行エラー・速報クロスチェック異常を検知してハング検知記録を作成する（未解消の同一run_id・同一detection_typeの検知記録が既にある場合は重複作成しない）。timeoutや結果取得不能時はUNKNOWNとして確定し、推測でFAILEDを確定しない。実行状態を自動でABORTEDへ変更しない
  args: []
  env_vars:
  - name: HANG_DETECT_INTERVAL_SECONDS
    required: false
    description: 'CronJobの実行間隔（秒）。未設定時はジョブマップのデフォルト値（例: 60秒）を使用する'
  stdin: なし
  stdout_contract: 検知件数・検知種別ごとのサマリ（detection_type別件数）を1行1件のプレーンテキストで出力する
  stderr_contract: RDB接続断・永続化失敗時のエラーメッセージを出力する
  exit_codes:
  - code: 0
    meaning: 正常終了（検知処理を完走。検知件数0件も含む）
  - code: 1
    meaning: 業務エラー（RDB接続断・永続化失敗）
  screens:
  - name: background実行異常検知画面
    route: /cli/hang-watch/detect
    components:
    - HangDetectionNotice
    - RunnerResultPanel
- name: relaygate hang-watch notify
  tier: tier-worker
  uc: ハング疑い・異常を運用者へ通知する
  business: 実行監視業務
  buc: ハング監視フロー
  summary: notified_at未設定のハング検知記録を対象に、HangDetectionNotice形式（banner）で運用者へ通知しnotified_atを更新する
  args: []
  env_vars:
  - name: HANG_NOTIFY_INTERVAL_SECONDS
    required: false
    description: 通知バッチの実行間隔（秒）。未設定時はジョブマップのデフォルト値を使用する
  stdin: なし
  stdout_contract: 通知件数と通知内容（run_id/異常検知種別/検知日時/しきい値/対象slot/通知先）をHangDetectionNotice形式で出力する
  stderr_contract: 通知送信失敗・RDB更新失敗時のエラーメッセージを出力する
  exit_codes:
  - code: 0
    meaning: 正常終了（通知対象0件の場合も含む）
  - code: 1
    meaning: 業務エラー（通知送信失敗・notified_at更新失敗）
  screens:
  - name: 異常通知発信画面
    route: /cli/hang-watch/notify
    components:
    - HangDetectionNotice
- name: relaygate hang-watch notice
  tier: tier-worker
  uc: ハング疑い・異常の通知を確認する
  business: 実行監視業務
  buc: ハング監視フロー
  summary: 通知済み（notified_at設定済み）のハング検知記録を検知日時降順で一覧表示する
  args:
  - name: --run-id
    required: false
    description: 指定した場合、当該run_idのハング検知記録のみに絞り込む
  env_vars: []
  stdin: なし
  stdout_contract: HangDetectionNotice形式（run_id/異常検知種別/検知日時/しきい値/対象slot/通知先）の一覧を検知日時降順で出力する。該当なしの場合は「該当するハング検知記録はありません」を出力する
  stderr_contract: RDB接続断時のエラーメッセージを出力する
  exit_codes:
  - code: 0
    meaning: 正常終了（該当なしも含む）
  - code: 1
    meaning: 業務エラー（RDB接続断等）
  - code: 2
    meaning: バリデーションエラー（--run-id形式不正）
  screens:
  - name: ハング異常通知確認画面
    route: /cli/hang-watch/notice
    components:
    - HangDetectionNotice
- name: relaygate abort blue request
  tier: tier-facade
  uc: blue background実行の中止を依頼する
  business: 実行制御業務
  buc: blue中止フロー
