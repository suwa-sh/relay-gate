- name: relaygate rerun select
  uc: 再実行対象のbackground実行・速報比較依頼を選択する
  business: 実行制御業務
  buc: background側リランフロー
  summary: 完了済み・中止済みのbackground実行（Runner実行結果）から再実行対象候補を一覧提示する（--target background指定時）／完了済み・中止済みの速報比較依頼から再実行対象候補を一覧提示する（--target
    rapid-crosscheck指定時）（--targetの値により内部でtier-facade/tier-workerいずれかの実装へディスパッチする単一コマンド）
  dispatch:
  - target: background
    tier: tier-facade
    summary: 完了済み・中止済みのbackground実行（Runner実行結果）から再実行対象候補を一覧提示する（--target background指定時）
    env_vars:
    - name: RELAYGATE_RDB_DSN
      required: true
      description: execution_specs / slot_execution_specs / runner_resultsへ接続するRDB接続文字列
    stdout_contract: 候補一覧を1候補1行で出力する（run_id/slot_type/role_type/attempt_id/attempt_no/status/accepted_at）。0件時は「該当するリラン候補はありません」
    stderr_contract: --target未指定、不正なenum値の場合に原因と次アクションを1文ずつ出力する
    exit_codes:
    - code: 0
      meaning: 正常終了（候補0件を含む）
    - code: 1
      meaning: 業務エラー（RDB接続失敗）
    - code: 2
      meaning: バリデーションエラー（--target未指定、--status/--slotの不正なenum値）
    - code: 124
      meaning: タイムアウト（RDB接続タイムアウト）
    - code: 130
      meaning: SIGINT中断
  - target: rapid-crosscheck
    tier: tier-worker
    summary: 完了済み・中止済みの速報比較依頼から再実行対象候補を一覧提示する（--target rapid-crosscheck指定時）
    env_vars:
    - name: RELAYGATE_RDB_DSN
      required: true
      description: rapid_crosscheck_requestsへ接続するRDB接続文字列
    stdout_contract: 候補一覧を1候補1行で出力する（run_id/parent_run_id/job_id/status/requested_at）。0件時は「該当するリラン候補はありません」
    stderr_contract: --target未指定、不正なenum値の場合、および--slotをrapid-crosscheckに指定した場合に原因と次アクションを1文ずつ出力する
    exit_codes:
    - code: 0
      meaning: 正常終了（候補0件を含む）
    - code: 1
      meaning: 業務エラー（RDB接続失敗）
    - code: 2
      meaning: バリデーションエラー（--target未指定、--statusの不正なenum値、rapid-crosscheckで--slot指定）
    - code: 124
      meaning: タイムアウト（RDB接続タイムアウト）
    - code: 130
      meaning: SIGINT中断
  args:
  - name: --target
    type: 'string(enum: background|rapid-crosscheck)'
    required: true
    description: リラン対象種別。dispatch先のtierを決定する
  - name: --status
    type: 'string(enum: SUCCEEDED|FAILED|UNKNOWN|ABORTED)'
    required: false
    description: 候補を絞り込む状態。--target rapid-crosscheck ではUNKNOWNを指定できない（速報比較依頼状態にUNKNOWNは存在しない）
  - name: --slot
    type: 'string(enum: blue|green)'
    required: false
    description: 候補を絞り込むslot種別。--target background でのみ指定できる
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列。参照先テーブルはdispatch先により異なる（dispatch[].env_vars を参照）
  stdin: なし
  stdout_contract: dispatch先ごとに異なる（dispatch[].stdout_contract を参照）
  stderr_contract: dispatch先ごとに異なる（dispatch[].stderr_contract を参照）
  exit_codes:
  - code: 0
    meaning: 正常終了（候補0件を含む）
  - code: 1
    meaning: 業務エラー（RDB接続失敗）
  - code: 2
    meaning: バリデーションエラー（--target未指定、不正なenum値）
  - code: 124
    meaning: タイムアウト（RDB接続タイムアウト）
  - code: 130
    meaning: SIGINT中断
  screens:
  - name: リラン対象選定画面
    route: /cli/rerun/select
    components:
    - CrossCheckRequestRow
    - RunnerResultPanel
- name: relaygate rerun run
  uc: execution-spec.jsonの実行設定を保ったまま再実行する
  business: 実行制御業務
  buc: background側リランフロー
  summary: 元のexecution-spec.json（run共通execution spec + slot別実行設定）の実行設定を保ったまま新規run_id（parent_run_id=元run_id）でbackground
    roleを再実行する（--target background指定時）／新しいrun_idの速報比較依頼をparent_run_id=元依頼run_idで新規作成する（--target rapid-crosscheck指定時）。いずれも元のレコード・状態・履歴は上書きしない（--targetの値により内部でtier-facade/tier-workerいずれかの実装へディスパッチする単一コマンド）
  dispatch:
  - target: background
    tier: tier-facade
    summary: 元のexecution-spec.json（run共通execution spec + slot別実行設定）の実行設定を保ったまま新規run_id（parent_run_id=元run_id）でbackground
      roleを再実行する（--target background指定時）。元runのレコード・履歴は変更しない
    env_vars:
    - name: RELAYGATE_RDB_DSN
      required: true
      description: execution_specs / slot_execution_specs / runner_result_events / runner_results / audit_logs / audit_chain_headsへ接続するRDB接続文字列
    - name: RELAYGATE_OPERATOR
      required: true
      description: 監査イベントのactorへ記録する操作者識別子
    - name: RELAYGATE_SSH_KEY_PATH
      required: true
      description: blue/green実装への起動に用いるSSH秘密鍵のパス
    stdout_contract: 再実行受理時のみ新規run_id・parent_run_id・slot_type・attempt_id・attempt_no・status=STARTINGを1行で出力する
    stderr_contract: 対象run_id未存在、元のslot modeがforegroundまたはoff、対象がSTARTING/RUNNING中、起動前監査の追記失敗、SSH起動失敗の場合に原因と次アクションを1文ずつ出力する
    exit_codes:
    - code: 0
      meaning: 正常終了（新規run_idでの再実行を開始）
    - code: 1
      meaning: 業務エラー（元のexecution spec未存在、元のslot modeがforeground/off、対象がSTARTING/RUNNING中、起動前監査の追記失敗による起動中止、SSH起動失敗）
    - code: 2
      meaning: バリデーションエラー（--target未指定、--run-id未指定、--run-idがUUID形式でない）
    - code: 124
      meaning: タイムアウト（SSH起動タイムアウト。起動試行はUNKNOWNとして記録し推測でFAILEDを確定しない）
    - code: 130
      meaning: SIGINT中断
  - target: rapid-crosscheck
    tier: tier-worker
    summary: 新しいrun_idの速報比較依頼をREQUESTED状態で新規作成し、parent_run_idで元依頼へ関連付ける（--target rapid-crosscheck指定時）。業務ジョブは再実行せず、元依頼のレコード・状態・履歴は変更しない
    env_vars:
    - name: RELAYGATE_RDB_DSN
      required: true
      description: rapid_crosscheck_requests / audit_logs / audit_chain_headsへ接続するRDB接続文字列
    - name: RELAYGATE_OPERATOR
      required: true
      description: 監査イベントのactorへ記録する操作者識別子
    stdout_contract: 新規作成完了時のみ新規run_id・parent_run_id・job_id・status=REQUESTEDを1行で出力する
    stderr_contract: 対象未存在、対象がREQUESTED/CLAIMED/RUNNING中、監査イベントの追記失敗の場合に原因と次アクションを1文ずつ出力する
    exit_codes:
    - code: 0
      meaning: 正常終了（新規run_idの速報比較依頼を作成）
    - code: 1
      meaning: 業務エラー（対象未存在、対象がREQUESTED/CLAIMED/RUNNING中、監査イベントの追記失敗による作成中止）
    - code: 2
      meaning: バリデーションエラー（--target未指定、--run-id未指定、--run-idがUUID形式でない）
    - code: 124
      meaning: タイムアウト（RDB接続タイムアウト）
    - code: 130
      meaning: SIGINT中断
  args:
  - name: --target
    type: 'string(enum: background|rapid-crosscheck)'
    required: true
    description: リラン対象種別。dispatch先のtierを決定する
  - name: --run-id
    type: string
    required: true
    description: リラン元となる完了済み・中止済みのbackground実行、または速報比較依頼のrun_id
  env_vars:
  - name: RELAYGATE_RDB_DSN
    required: true
    description: RDB接続文字列。参照先テーブルはdispatch先により異なる（dispatch[].env_vars を参照）
  - name: RELAYGATE_OPERATOR
    required: true
    description: 監査イベントのactorへ記録する操作者識別子（両dispatch先で必須）
  - name: RELAYGATE_SSH_KEY_PATH
    required: false
    description: blue/green実装への起動に用いるSSH秘密鍵のパス。--target background でのみ必須で、--target rapid-crosscheck では参照しない
  stdin: なし
  stdout_contract: dispatch先ごとに異なる（dispatch[].stdout_contract を参照）
  stderr_contract: dispatch先ごとに異なる（dispatch[].stderr_contract を参照）
  exit_codes:
  - code: 0
    meaning: 正常終了（新規run_idでの再実行を開始、または新規run_idの速報比較依頼を作成）
  - code: 1
    meaning: 業務エラー（対象未存在、状態不一致、監査追記失敗、SSH起動失敗）
  - code: 2
    meaning: バリデーションエラー（--target未指定、--run-id未指定、--run-idがUUID形式でない）
  - code: 124
    meaning: タイムアウト
  - code: 130
    meaning: SIGINT中断
  screens:
  - name: リラン実行画面
    route: /cli/rerun/run
    components:
    - ExecutionSpecCard
    - RunnerResultPanel
