      spec.md:163-168 の関連 USDM 表は REQ-006 / SPEC-006-02・REQ-007 / SPEC-007-01・
      REQ-007 / SPEC-007-03・REQ-003 / SPEC-003-03 の 4 行のみで REQ-011 / SPEC-011-03 行が無い
      (git diff 上、旧 stale 行「REQ-011 | SPEC-011-03 | 対象一覧を成果物に記録する(SPEC-011-03)」は
      削除されたが、是正行は再追加されていない)。
      spec.md:170 に「機械可読の正本は spec-event.yaml の use_cases[].usdm(本表と同内容)」。
      spec-event.yaml:113-116 は同 UC に REQ-011 / SPEC-011-03 →
      scenario「exit_code=0 で SUCCEEDED になる(SPEC-006-02)」を保持。
      usdm-acceptance-matrix.md:84 / :137 は SPEC-011-03 を UC-15 でも covered とし、
      UC-15 の受け入れを「確報の起動コマンドをそのまま起動し stdout / stderr / exit_code を
      依頼レコードへ保存する」と記す。表(spec.md)だけが SPEC-011-03 を欠く。
    suggested_fix: >-
      UC-15 の spec.md「関連 USDM」表に行
      「| REQ-011 | SPEC-011-03 | exit_code=0 で SUCCEEDED になる(SPEC-006-02) |」を追加し、
      spec-event.yaml usdm[] および usdm-acceptance-matrix.md と三者一致させる
      (round-1 resolved note が記述した状態に実ファイルを合わせる)。
      なお scenario 名「exit_code=0 で SUCCEEDED になる(SPEC-006-02)」は spec.md:179 の
