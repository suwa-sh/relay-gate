    viewpoint: 4
    severity: major
    target: "クロスチェック業務/確報クロスチェックフロー/比較ツールで日次全量比較を実行して結果を保存する/spec.md"
    claim: >-
      R-1 は未解消。確報 UC「比較ツールで日次全量比較を実行して結果を保存する」(UC-15)の
      spec.md「関連 USDM」表に REQ-011 / SPEC-011-03 行が存在しない。
