schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-022"
title: "env 形式の設定値のキーと値の取り出し方を「最初の = で分割 → キーの前後の空白を除く → 値の前後の空白を除く → 引用符を外す」の順序つき規則として CLI 契約に書く"
status: "approved"
generated_at: "2026-11-01T12:50:00Z"
context: |
  - CLI 契約の env 形式の入力規則(config_input_rules.env_files)は、値の先頭末尾の引用符の外し方(spec-decision-019)を定めていたが、値の前後の空白と = の前後の空白の扱いを書いていなかった。`KEY= "abc" ` のような値で、仕様の字面と実装の結果が変わり得た。
  - 実装の 2 か所(feature flag 設定と速報クロスチェック設定の読み込み)は、行を最初の = で分け、キーの前後の空白を除き、値の前後の空白を除いてから、値の先頭・末尾の引用符を外す。
  - 2026-11-01 の仕様の更新でこの隙間を確認推奨として報告し、利用者は別の変更要求として扱うことに同意した。要求・RDRA は空白の扱いを持たないため、仕様(CLI 契約)だけの変更とする。
decision: |
  1. config_input_rules.env_files に、引用符の外し方と同じ節で次の順序つき規則を書く: (1) 行を最初の = でキーと値に分ける(値の中の = はそのまま値に残る)、(2) キーの前後の空白を除く、(3) 値の前後の空白を除く、(4) 値の先頭の 1 文字が " か ' なら外し、それとは別に末尾の 1 文字が " か ' なら外す(引用符の内側の空白は残す)。
  2. 空白は半角空白(0x20)とタブ(0x09)だけとする。CR は既存のバイト検査(CR の拒否)で拒否する規則のまま変えない。
  3. 例を規則に添える: `KEY= "abc" ` → キー KEY・値 abc、` KEY = 'a b' ` → キー KEY・値 `a b`、`KEY="  a  "` → 値 `  a  `、`KEY=a=b` → 値 `a=b`。
  4. shared_rules.compare_command_argv.split の再掲にも同じ順序(値の前後の空白を除いてから引用符を外す)を反映する。= の無い行とコメント行の扱いは各設定契約の今の規則のまま変えない。
  5. UC 側(feature flag を設定する / クロスチェックのジョブマップと比較定義を定義する)は規則を複写せず契約 env_files を参照する(spec-decision-019 の参照の向きを維持)。
  6. 実装は変えない。実装との差分を記録する: 実装の空白の除去は bash の文字クラス [:space:] を使うため、仕様の空白(半角空白・タブ)に加えて VT(0x0B)と FF(0x0C)も除く(UTF-8 ロケールではロケールが空白とみなす文字も除き得る)。CR は実装でも読み込み前のバイト検査で拒否され(feature flag 設定は行末の CR を落としてから読む)、LF は行の区切りのため値に現れない。VT / FF を値の前後に置いた設定は通常の運用では現れないため、実装を変えずに差分として記録する。
consequences:
  positive:
    - "前後に空白を含む値の取り出し結果が、規則から推測なしに 1 つに決まる"
    - "新しい設定ファイル(housekeep.env など)の読み込みを実装する人が、同じ順序で値を取り出せる"
  negative:
    - "VT / FF の扱いだけ仕様と実装が一致しない。値の前後に VT / FF を置いた場合、実装は除き、仕様は値に残す"
alternatives_considered:
  - name: "空白を bash の [:space:] と同じ集合(VT / FF を含む)にする"
    reason_rejected: "要求は空白を半角空白とタブと定めている。ロケール依存の集合を仕様の正本にすると、実装言語・ロケールによって結果が変わる"
  - name: "引用符を外してから空白を除く"
    reason_rejected: "今の実装と順序が変わり、`KEY=\"  a  \"` の結果(内側の空白を残す)が変わる"
