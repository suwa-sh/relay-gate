findings:
  - id: R-003
    viewpoint: 4
    severity: major
    target: "docs/specs/events/20260907_024000_feedback_todo_followup/_cross-cutting/api/cli-command-contract.yaml"
    claim: "D4-2 の「dispatcher が parallel_runs を FOR UPDATE で読めば abort-blue / abort-green と直列化される」は、abort 側の parallel_runs UPDATE が行にマッチする(STARTED / RUNNING)場合にしか成り立たない。D4-1 で「典型経路」と定義した parallel_runs=COMPLETED(foreground 中継済み)の run では、abort の `UPDATE parallel_runs ... WHERE status IN ('STARTED','RUNNING')` はスナップショット上で 0 件のため行ロック待ちが発生せず(PostgreSQL 系の READ COMMITTED では非マッチ行はロックしない)、続く `UPDATE rapid_crosscheck_requests ... WHERE status='REQUESTED'` が dispatcher の未 COMMIT INSERT を見ずに 0 件で終わる。同時に dispatcher は slot_executions をロック無し SELECT で読むため abort の未 COMMIT の ABORTED も見えず、依頼を INSERT して COMMIT する。結果、round-1 R-003 と同じ「中止済み run に REQUESTED の依頼が残る」が、今回の修正で主経路と位置づけた COMPLETED ケースでそのまま残る。契約 / UC-09 / UC-23 / rdb-schema _review_notes / buc-spec は「dispatcher が先なら abort の parallel_runs UPDATE が dispatcher の COMMIT を待つ」を無条件の事実として 5 箇所以上に記述しており、実装がそれを前提にすると競合窓が閉じない"
    evidence: "cli-command-contract.yaml rapid-crosscheck-runner.sh idempotency / abort-blue.sh notes(競合窓の保険): 「本コマンドが先なら abort の parallel_runs UPDATE が待った後に … REQUESTED を 1 件 ABORTED にする」。abort-blue.sh exit_codes[0] / UC-23 tier-ops.md 表「共通(併更新)」: parallel_runs の UPDATE は `WHERE run_id = ? AND status IN ('STARTED','RUNNING')` で「COMPLETED は更新しない。0 件で可」。abort 側に無条件の行ロック(SELECT ... FOR UPDATE)は無い。UC-09 spec.md 108 行 / tier-rapid-crosscheck.md「abort との直列化」/ rdb-schema.yaml _review_notes 45 / UC-23 spec.md 条件表 155 行 / 速報クロスチェックフロー buc-spec.md 136 行: いずれも parallel_runs の状態を問わず直列化されると記述。UC-09 tier-rapid-crosscheck.md の BDD「parallel_runs の行ロックで abort-green.sh と直列化される」は Given が parallel_runs=RUNNING のみで、COMPLETED ケース(D4-1 の典型経路)を検証しない。dispatcher の slot_executions 参照は「ロックしない」(_model-summary.yaml / tier)と明記されており、abort の slot_executions UPDATE(先頭)が未 COMMIT の間は RUNNING に見える"
    suggested_fix: "abort-blue / abort-green のトランザクション先頭(slot_executions UPDATE の前でも後でも可。ロック順は slot_executions → parallel_runs のまま)に `SELECT 1 FROM parallel_runs WHERE run_id = ? FOR UPDATE`(無条件の行ロック)を追加し、その後に条件付き UPDATE(parallel_runs / rapid_crosscheck_requests)を行う旨を契約 abort-blue.sh idempotency / notes(競合窓の保険)、UC-23 spec.md 処理フロー・条件表・tier-ops.md 表「共通(併更新)」、rdb-schema.yaml _review_notes 45 に反映する。これで parallel_runs が COMPLETED でも dispatcher の FOR UPDATE と待ち合わせ、dispatcher が先なら abort は COMMIT 済みの REQUESTED を 1 件 ABORTED にし、abort が先なら dispatcher は COMMIT 済みの slot_executions=ABORTED を読んで INSERT しない(dispatcher の slot_executions 読み取りは parallel_runs ロック取得後なので追加ロック不要)。UC-09 tier-rapid-crosscheck.md の直列化 BDD に Given parallel_runs=COMPLETED(slot_executions green=RUNNING)の派生シナリオを 1 件追加する。UC-09 / buc-spec / UC-23 の「dispatcher が先なら abort の parallel_runs UPDATE が待つ」の文言を「abort の parallel_runs 行ロック(FOR UPDATE)が待つ」に改める"

