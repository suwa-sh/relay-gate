findings:
  - id: R-010
    viewpoint: 4
    severity: minor
    target: "docs/specs/events/20260907_024000_feedback_todo_followup/実行復旧業務/実行中止フロー/実行を ABORTED へ遷移させる/_model-summary.yaml"
    claim: "D4-8 で追加した parallel_runs の無条件行ロック(`SELECT 1 FROM parallel_runs WHERE run_id = ? FOR UPDATE`)が、同 UC のデータアクセス定義 _model-summary.yaml の tables.parallel_runs.operations に無い(条件付き UPDATE のみ)。同じ操作を UC「両系成功時に速報比較依頼を作成する」の _model-summary.yaml は SELECT 操作(where に FOR UPDATE)として列挙しており、契約 / spec.md / tier-ops.md と _model-summary.yaml の間でデータアクセス定義が食い違う"
    evidence: "_model-summary.yaml tables[3](parallel_runs).operations は type UPDATE(where: run_id = ? AND status IN ('STARTED', 'RUNNING'))の 1 件のみ。同 UC spec.md 49 行 / 91 行、tier-ops.md 28 / 31 行、契約 abort-blue.sh idempotency は無条件 FOR UPDATE を処理順の一部として定義。比較対象: 両系成功時に速報比較依頼を作成する/_model-summary.yaml 86-92 行は parallel_runs に type SELECT + where \"run_id = ? FOR UPDATE(...)\" を持つ"
    suggested_fix: "実行を ABORTED へ遷移させる/_model-summary.yaml の parallel_runs に operations: type SELECT(columns: なし or 定数 1、where: \"run_id = ? FOR UPDATE(無条件の行ロック。slot 系のみ。RAPID_CROSSCHECK_MODE が off 以外。COMPLETED でも取る。条件付き UPDATE の前に実行し dispatcher(rapid-crosscheck-runner.sh)の FOR UPDATE と直列化する)\")を条件付き UPDATE の前に 1 件追加する"

