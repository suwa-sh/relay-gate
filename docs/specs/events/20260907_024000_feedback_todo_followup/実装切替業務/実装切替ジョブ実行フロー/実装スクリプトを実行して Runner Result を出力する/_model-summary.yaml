uc: "実装スクリプトを実行して Runner Result を出力する"
business: "実装切替業務"
buc: "実装切替ジョブ実行フロー"
bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "ExecuteImplementationCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "slot 実行"
  - name: "SlotExecution"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "slot 実行"
  - name: "RunnerResult"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "Runner Result"
  - name: "ExecutionSpecRepository"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "実行設定(execution-spec)"
  - name: "SlotExecutionRepository"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "slot 実行"
  - name: "SshAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"
  - name: "FilesystemAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"
  - name: "RdbClientAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "slot 実行"

tables:
  - name: "slot_executions"
    rdra_info: "slot 実行"
    operations:
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "SUCCEEDED(exit_code=0)/ FAILED(非 0)"
          - name: "exit_code"
            value: "exitcode.txt の値"
          - name: "completed_at"
            value: "now(ローカル時刻)"
        where: "run_id = ? AND slot = ? AND status = 'RUNNING'"
        note: "RAPID_CROSSCHECK_MODE が off 以外のみ。status はファイル正本(条件「slot 実行の状態導出規則」: exitcode.txt / aborted.txt)と同じ値を保持する二重マッピング。更新件数 0(行なし・既に ABORTED)は実行ログ `WARN management db not updated run_id=... role=...` のみ(ERROR ではない。INSERT しない。行の作成主体は facade で runner 起動前に INSERT 済み)。終了コードは exitcode.txt の値を維持"
    indexes_needed:
      - columns: ["run_id", "slot"]
        reason: "主キー。run_id + slot での更新"
        access_pattern: "run_id = ? AND slot = ?"
  - name: "parallel_runs"
    rdra_info: "並行稼働実行(parallel_run)"
    operations:
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "COMPLETED"
          - name: "completed_at"
            value: "now(ローカル時刻)"
        where: "run_id = ? AND status = 'RUNNING'"
        note: "RAPID_CROSSCHECK_MODE が off 以外、かつ execution-spec.json の parent_run_id が非 null(background slot リラン由来 run)で自 slot が background のときだけ、exitcode.txt 公開後に実行する。通常起動では facade の中継 UC が行う"
    indexes_needed: []

kvs: []
object_storage: []
