# CLI コマンド契約(正本。Contract First 開発用)
# HTTP API は無い(arch CTP-001)。openapi.yaml はバリデータ互換スタブであり、本ファイルが CLI 契約の正本。
# 横断規約(終了コード・出力形式・環境変数)の説明は _cross-cutting/ux-ui/ui-design.md を正とし、本ファイルはそれを機械可読に転記する。
version: "1.0"
system_name: "relay-gate 並行稼働実行基盤"
generated_from: "20260830_202851_spec_generation"

conventions:
  option_style: "--kebab-case。値は `--key value` 形式(`--key=value` は不可)。短縮形は提供しない。未知のオプションは `error: unknown option option=--foo` で終了コード 2"
  runtime_prerequisites:
    bash_minimum_version: "5.0"
    bash_note: "全スクリプトが前提にしてよい bash の最低版は 5.0(インフラ設計 docs/infra/latest の shell: bash 5 と同じ値。2026-09-22 に利用者が確定)。連想配列・`mapfile`・`${var@Q}` など bash 4.x〜5.0 で使える構文を前提にしてよい。5.0 より古い bash での動作は保証しない(実装はバージョンを起動時に検査しなくてよい)"
    external_commands: "セルの解析(CSV のクォート状態機械・fixed_params の JSON 配列)は bash 単独で行う(config_files の csv_rules)。これは『外部 CSV パーサに依存しない形式に限る』という形式の制約で、行単位の外部コマンド利用を禁じない。ジョブ起動時の 1 行取り出しで `grep` などにより候補行を絞ってから該当行だけを bash で解析すること、重複検査に `sort` を使うことは許容する(NFR B.2.1.1 の応答時間を満たす手段として)。使ってよい外部コマンドは POSIX 標準コマンド(grep / sed / awk / sort / tr / cat / mktemp 等)に限り、jq など追加パッケージは使わない"
  exit_codes:
    - code: 0
      class: "成功"
      condition: "処理が完了した。参照系は対象が見つかり出力できた"
    - code: 2
      class: "入力・引数・設定検証エラー"
      condition: "引数不足・不正な値・未知のオプション、feature flag / ジョブマップ / 比較ツール起動コマンド設定の検証 NG、非対話で --yes なし、環境変数・設定ファイルの未設定、読んだ設定ファイルの入力の守備範囲の違反(config_input_rules。env の invalid line・同じキーの重複を含む。設定ファイルを読む全コマンドに共通で、各コマンドの exit_codes の condition に列挙が無くても終了コード 2 とする。runner は exitcode.txt=2)"
    - code: 3
      class: "業務エラー"
      condition: "事前検証 NG(rerun)、中止不可(abort)、停止確認 no、参照系で対象が存在しない、hang-detector.sh が新たに知らせる異常がハング疑い(warning)だけ(警告終了。確報の比較 NG=3 と同じくジョブステータスが警告終了になる値。shared_rules.hang_alert)、RAPID_CROSSCHECK_MODE=off で管理 DB が無い(依頼レコード・系譜・集計を管理 DB にしか持たないコマンド。abort-blue / abort-green と background-rerun --role blue|green は off でも成果物ファイルだけで成立するため該当しない)"
    - code: 6
      class: "実行エラー"
      condition: "SSH 接続・実行失敗、管理 DB 接続・SQL 失敗、比較ツールの起動失敗、成果物ファイルの書き込み失敗・移動・削除の失敗、polling 上限超過、内部エラー。hang-detector.sh が background 実行エラー・速報クロスチェック異常(error)を新たに知らせた場合も 6(失敗。shared_rules.hang_alert)"
  exit_code_notes:
    - "1 は使わない(set -euo pipefail の予期しない終了を 1 として区別する。1 を観測したら内部バグ)"
    - "中継系(facade.sh foreground 中継 / final-crosscheck-runner.sh 確報中継)は保存済み exitcode をそのまま返し、4 分類を適用しない"
    - "worker(rapid-crosscheck-worker.sh / final-crosscheck-worker.sh)は比較ツールの終了コードを依頼レコードに保存するだけで、worker 自身の終了コードには反映しない"
    - "hang-detector.sh は終了コードそのものが運用者への通知になる: 0 = 新たな異常なし、3 = ハング疑いだけ(警告終了)、6 = background 実行エラー・速報クロスチェック異常を新たに知らせた、または hang-detector 自身の実行エラー(RAPID_CROSSCHECK_MODE が off 以外で管理 DB に接続・SELECT できない回は alert 行を出さずに 6、通知済みの印の不正を含む)。同じ回に複数あれば 6 > 3 > 0。2 は走査前の入力・設定エラー(shared_rules.hang_alert / commands の hang-detector.sh)"
  output_format:
    stdout: "plain。1 行 1 事実。`key=value`(値に空白を含まない)または `key: value`(値に空白・パスを含む)。キーは snake_case。出力順はコマンドごとに固定(各 commands[].stdout に記載)。末尾は改行。成功時に出力が無ければ 0 行"
    tsv: "複数行の参照系は TSV(タブ区切り、1 行目ヘッダー、列名 snake_case、列数 8 以内)。値にタブ・改行を含めない(control_chars の可視表記 `\\t` / `\\n` へ置き換える。旧規則の『半角空白へ置換』は使わない)。列定義は _cross-cutting/ux-ui/data-visualization.md を正とする"
    stderr: "`error: {原因} key=value...` を 1 回だけ。続けて `hint: {対処}`(対処が明確な場合のみ)。`warn:` は継続、`info:` は --verbose 時のみ(例外: rapid-crosscheck-result.sh の投資調査注意は常時)。例外: hang-detector.sh はその回に新たに知らせる異常を `alert: level=... kind=... run_id=... role=... job_id=... elapsed_minutes=...` の 1 件 1 行で出す(error: / warn: とは別の接頭辞。書式の正本は shared_rules.hang_alert)。hang-detector.sh は対象ごとの失敗、つまり保存失敗(`error: monitor record save failed ...` / `error: notified mark save failed ...`)と通知済みの印の不正(`error: notified mark invalid ...`)を、1 対象 1 行で複数出してよい(並び順は shared_rules.hang_alert.order)。housekeep.sh は単位ごと・エントリごとの失敗を `error:` で 1 件 1 行出す(並び順は shared_rules.housekeep_rules.processing_sequence。commands の housekeep.sh)。設定ファイルの入力の守備範囲の違反は全コマンド共通で config_input_rules に従い、該当行ごとに 1 行(バイト・改行の違反は 1 行 1 種類 1 行、duplicate key は重複したキーごとに 1 行)を出す。報告の順は config_input_rules.byte_checks(バイト・改行の検査。CSV・env 共通)と config_input_rules.env_files(env の検査の段)に従う(CSV の第 2 段以降の検査の順は今の規則のまま。UC「slot ごとのジョブマップを定義する」の tier-facade.md のバリデーション)。上記の例外以外の error 行は 1 回だけ"
    control_chars: "任意入力(設定ファイルのセルの値・列名・キー名・パス・引数)を stdout / stderr に出すときは、制御文字を可視表記へ置き換える(正本は _cross-cutting/ux-ui/ui-design.md「出力フォーマット」の『制御文字の表記』。全コマンド共通。実行ログにも適用する)。置き換え: 改行(U+000A)→ `\\n`、タブ(U+0009)→ `\\t`、その他の U+0001〜U+001F と U+007F、および UTF-8 で符号化した C1 制御文字 U+0080〜U+009F → `\\u00XX`(16 進小文字 4 桁。例: ESC は `\\u001b`、CR は `\\u000d`)。バックスラッシュ(`\\`)は置き換えない(方針資料の Windows パス例 `G:\\scripts` の表示を変えないため。生のタブと 2 文字 `\\t` を表示上区別しないことを許容する)。制御文字以外のバイト(UTF-8 として不正なバイトを含む)はそのまま出す。`key=value` / `key: value` の選択は置き換え前の元の値で判定する(元の値に空白・パスを含めば `key: value`)。例外: `--verbose` の fixed_params の JSON 配列表記は JSON の文字列規則(`\"` と `\\` もエスケープし、制御文字は同じ `\\n` / `\\t` / `\\u00XX`)を優先する。制御文字を含まない値の出力は 1 バイトも変わらない"
    json: "採用しない(--format json は将来拡張としても採用しない。jq 非依存)"
    color: "使わない。ANSI エスケープを出さない。TTY 判定を行わない(任意入力に含まれる ESC は control_chars により `\\u001b` になる)"
    empty_value: "`key=-`(TSV も `-`)。null / 空文字を区別しない"
    boolean: "true / false"
    path_uri: "絶対パスまたは URI をクォートせずそのまま出す"
    pagination: "`--limit N`(既定 100)。上限超過時は stderr に `warn: output truncated limit=N`"
    progress: "進捗表示は行わない。長時間処理は実行ログにのみ残す"
  datetime: "ホストのローカルタイムゾーン(プロセスの TZ 環境変数に従う)、ISO 8601 秒精度、タイムゾーン指示子(Z / オフセット)なし(例 2026-08-30T11:30:00)。run_id の時刻部と同じ時刻軸。UTC や Z 付き・オフセット表記は使わない(利用者決定 2026-09-07。arch CLP-002)。例外: started-at.txt / aborted.txt の中身は UTC Z 付き(artifact_layout)、RELAY_GATE_NOW は UTC Z 付きで受け取りローカルへ変換する。経過時間は分単位の整数(elapsed_minutes=75)。経過時間・lease 失効・走査窓(--since)の判定は epoch 秒で計算し、表記の比較では行わない。DST のあるタイムゾーンでは切替前後の表記が一意でないことを許容する。UTC → ローカルの変換は 1 箇所の共通関数に置き、全スクリプトが同じ変換を使う"
  run_id_format: "{ローカル yyyymmddThhmmss}-{job_id}-{8 桁 hex 乱数}(例 20260830T113000-JOB001-3f9a1c2e。時刻部はホストのローカルタイムゾーンで、タイムゾーン指示子(Z / オフセット)は付けない。詳細は shared_rules.run_id)"
  message_grammar: "英語、小文字始まり、句点なし、現在形。動詞は not found / is not / failed / required / rejected を優先。日本語は運用者向け対話プロンプトのみ"
  interactive_prompt:
    text: "対象ジョブのプロセスは強制終了してありますか？ [yes/no]: "
    channel: "stderr(改行せず入力待ち)"
    affirmative: "yes(小文字完全一致)のみ。y / YES / 空 Enter は no 扱い"
    negative_result: "stdout に status={現在状態}、stderr に `info: aborted by operator; status not changed`、終了コード 3"
    non_tty_without_yes: "`error: interactive confirmation required (use --yes for non-interactive)`、終了コード 2"
  execution_log:
    path: "$RELAY_GATE_LOG_DIR/{script}.log(1 スクリプト 1 ファイル、追記。relay-gate は実行ログを整理しない。設置環境の logrotate に任せる(arch CTR-006。保管期間 3 ヶ月は NFR C.6.1.1))"
    line_format: "{script} {run_id} {ローカル日時} {LEVEL} {message}(run_id 未確定は `-`。確報系は final_crosscheck_id を run_id 欄に置く)"
    datetime: "ホストのローカルタイムゾーン(プロセスの TZ 環境変数に従う)。ISO 8601 秒精度、タイムゾーン指示子(Z / オフセット)なし(例 2026-08-30T12:40:00)。run_id の時刻部と同じ時刻軸。UTC への統一は行わない(arch CLP-002 / CTP-003)"
    levels: ["DEBUG", "INFO", "WARN", "ERROR"]
    audit_fields: "中止・リランは operator=(OS ユーザー名)と answer= を必ず含める。gateway の外部呼び出しは開始・終了・duration_ms・成否を記録"
  datetime_generation: "日時はすべてホスト側で生成し(RELAY_GATE_NOW 設定時はその変換値)、SQL にはバインド値で渡す。SQL 内の now() / CURRENT_TIMESTAMP / DEFAULT now() は使わない(DB セッションの TimeZone 設定に依存させない)。spec の擬似 SQL に現れる now は「ホストで生成した現在時刻のバインド値」を意味する"
  common_options:
    - name: "--help"
      applies_to: "全コマンド"
      behavior: "usage を stdout に出して終了コード 0。1 行目は `usage: {script} ...`"
    - name: "--verbose"
      applies_to: "全コマンド"
      behavior: "info: を stderr に出す。中継系(facade.sh / final-crosscheck-runner.sh)と runner IF は実行ログにのみ出す"
    - name: "--yes"
      applies_to: "abort-blue.sh / abort-green.sh / abort-rapid-crosscheck.sh / abort-final-crosscheck.sh"
      behavior: "停止確認プロンプトを省略して yes とみなす。ログに answer=yes(--yes) と記録"
    - name: "--once"
      applies_to: "rapid-crosscheck-worker.sh / final-crosscheck-worker.sh"
      behavior: "1 回だけ poll / claim / 実行して終了する(定期ジョブ運転用)"
    - name: "--limit N"
      applies_to: "run-lineage.sh / hang-detect-trend.sh"
      behavior: "出力行数の上限(既定 100)"
    - name: "--show-output"
      applies_to: "rapid-crosscheck-result.sh"
      behavior: "比較ツールの stdout / stderr 本文を末尾に出す"
  environment_variables:
    - name: "RELAY_GATE_HOME"
      purpose: "relay-gate の配置ディレクトリ(スクリプトの所在)。内部呼び出しの解決に使う"
      default: "スクリプト自身のディレクトリ($(dirname \"$0\"))"
    - name: "RELAY_GATE_CONFIG_DIR"
      purpose: "設定ファイル置き場(feature-flag.env / <slot>-job-map.csv / rapid-crosscheck.env / hang-detector.env / final-crosscheck.env / housekeep.env)"
      default: "$RELAY_GATE_HOME/config"
      on_missing: "未設定かつ既定パスが無い場合は終了コード 2"
    - name: "RELAY_GATE_ARTIFACT_ROOT"
      purpose: "成果物ルート。$RELAY_GATE_ARTIFACT_ROOT/facade/<run_id>/ に Runner Result を置く。同じ成果物ルート直下に通知済みの印の置き場 hang-detector-notified/ と削除待ちの置き場 housekeep-pending/ を置く(shared_rules.artifact_root_entries)"
      default: "$RELAY_GATE_HOME/var"
      on_missing: "書き込み不可は終了コード 6"
    - name: "RELAY_GATE_LOG_DIR"
      purpose: "実行ログの出力先({script}.log)"
      default: "$RELAY_GATE_HOME/log"
      on_missing: "書き込み不可は stderr に warn: を出して処理は継続"
    - name: "RELAY_GATE_NOW"
      purpose: "テスト専用の現在時刻注入。設定時はすべてのスクリプトが「現在時刻」をこの値で扱う(hang-detector.sh の経過時間・judged_at・alerted_at、rapid / final worker の lease_until・started_at・completed_at、abort-* の aborted_at、background-rerun.sh の restored_at と新 run_id の時刻部、facade.sh / slot runner の run_id 時刻部・requested_at・started-at.txt、housekeep.sh の cutoff を含む時刻取得すべて)。すべての日時はホストで生成して SQL にバインド値で渡す(設定時はその変換値。DB の now() は使わない。conventions.datetime_generation)"
      format: "UTC ISO 8601 秒精度、Z 付き(例 2026-08-30T12:45:00Z)。形式不正は終了コード 2(error: invalid value env=RELAY_GATE_NOW value=...)"
      run_id_relation: "run_id / final_crosscheck_id の時刻部は RELAY_GATE_NOW をプロセスのローカルタイムゾーン(TZ 環境変数)へ変換した値。実行ログ・管理 DB の *_at 列・stdout の日時も同じくこの UTC 値をローカルへ変換した値(指示子なし)。started-at.txt / aborted.txt の中身だけは UTC Z 付きの値そのまま。spec の BDD シナリオと例示値は TZ=UTC を前提にしている(RELAY_GATE_NOW=2026-08-30T11:30:00Z → run_id 時刻部 20260830T113000、ログ・stdout の日時 2026-08-30T11:30:00)"
      default: "未設定(ホストの実時刻を使う)"
      on_missing: "未設定が正常。本番では設定しない(設定されていれば起動時に実行ログへ WARN test clock injected now=... を 1 行残す)"
      runner_inheritance: "facade.sh / background-rerun.sh は設定されていれば runner にも引き継ぐ(値を変えない)"
  credentials: "認証情報(SSH 鍵パス・DB パスワード)は環境変数・設定の値として扱わず、参照名(credential_ref / *_DB_CONN_REF)のみを置く(arch CTP-002)。管理 DB 接続の参照名は config_files の RAPID_DB_CONN_REF(rapid-crosscheck.env)/ HANG_DB_CONN_REF(hang-detector.env)/ FINAL_DB_CONN_REF(final-crosscheck.env)/ HOUSEKEEP_DB_CONN_REF(housekeep.env。ハウスキープ専用 DB ロール housekeep_del)で定義する。管理 DB は 1 つで、これらの参照名(final-crosscheck.env は実行ホストの置き場と DB セグメントの置き場の両方のファイルの FINAL_DB_CONN_REF)はすべて同じ 1 つの管理 DB に解決されることを前提とする(確報 runner が登録した確報比較依頼を確報 worker が同じキューから取得するため。2026-11-05 のインフラ設計)。条件は参照名の文字列が同じことではなく、解決先(接続先の DB)が同じこと。HOUSEKEEP_DB_CONN_REF はハウスキープ専用 DB ロール housekeep_del の参照名で業務用ロールの参照名とは別のロールを指すが、解決先の DB は同じ。参照名から接続情報への解決は適用側の運用手順(DB クライアントの接続設定)に委ね、解決先が同じことは導入する側が確かめる。構築手順の配置時の検査は設定ファイルの存在確認だけで、relay-gate のコマンド(validate-config.sh と各読み手の起動時の検査)も参照名の解決先を検査しない(解決先が違う設置でも起動時の検査は通る。そのための error 文言・終了コードは無い)。relay-gate は値を保存・出力しない。ジョブマップの credential_ref の値(参照名そのもの)は診断行に一切出さない。対象は validate-config.sh の stdout と stderr(error: / warn: / info:(--verbose を含む)/ hint:。validate-config.sh は実行ログを持たない)と、ジョブマップを読む slot runner の stderr と実行ログ(execution_log)。形式の扱いで報告するときも位置は line=N と job_id=<v> だけで示し、value= を付けない(形式に合わない値は秘密やパスを含み得るため。形式の扱いの正本は config_files の <slot>-job-map.csv columns.credential_ref)"

# 複数 tier が共有する算出規則。契約に定義されるまで実装で確定してはならない項目(CLAUDE.md)を集約する。
shared_rules:
  run_id:
    format: "{ローカル yyyymmddThhmmss}-{job_id}-{8 桁 hex 乱数}"
    example: "20260830T113000-JOB001-3f9a1c2e"
    issuer: "facade.sh(通常起動)/ background-rerun.sh(リラン。新 run_id を発行し parent_run_id に元 run_id を置く)"
    job_id_charset: "英数字・_・- のみ(区切り文字 - と衝突するため、解析は先頭 15 文字(時刻)と末尾 8 文字(hex)で行い、中央を job_id とする)"
    random_source: "8 桁 hex(4 バイト乱数。管理 DB なし(off)でも facade 単独で発行できる)"
    test_verification: "乱数部は注入しない。テスト(BDD の Then)では run_id を固定値で照合せず、形式パターン `^[0-9]{8}T[0-9]{6}-{job_id}-[0-9a-f]{8}$` と時刻部(RELAY_GATE_NOW 設定時はその値をローカルタイムゾーンへ変換した値)で検証する。シナリオに書かれた固定 run_id の末尾 8 桁は例示であり、照合対象は時刻部と job_id のみ"
    timezone: "時刻部はホストのローカルタイムゾーン(プロセスの TZ 環境変数に従う)で、タイムゾーン指示子(Z / オフセット)は付けない。RELAY_GATE_NOW(UTC)設定時はその値をローカルタイムゾーンへ変換して時刻部にする(spec の例示値は TZ=UTC 前提)。実行ログ・管理 DB の *_at 列・CLI の stdout / stderr の日時も同じローカルタイムゾーン(指示子なし)で表す。started-at.txt / aborted.txt の中身だけは UTC ISO 8601 Z 付きのまま(Runner Result Contract。表示・DB 転記時はローカルへ変換する)"
    scope: "成果物ディレクトリ名と管理 DB(parallel_runs / slot_executions 等)の run_id は同じ値。RAPID_CROSSCHECK_MODE=off でも facade 単独で発行する(モードによらず常に発行)"
  final_crosscheck_id:
    format: "{ローカル yyyymmddThhmmss}-final-{8 桁 hex 乱数}"
    example: "20260830T210000-final-7b2c9e1f"
    timezone: "run_id と同じ(ローカルタイムゾーン、Z 無し。RELAY_GATE_NOW 設定時はローカルタイムゾーンへ変換した値)"
    issuer: "final-crosscheck-runner.sh(起動のたびに新規発行)"
    note: "abort-final-crosscheck.sh の --run-id はこの値を受け取る(canonical C7)。確報 worker は成果物ディレクトリを作らず、比較結果を依頼レコードの stdout / stderr / exit_code 列に保存する"
  argument_concatenation:
    rule: "実装スクリプトへ渡す引数 = ジョブマップの fixed_params(JSON 配列 of string)を順序どおり展開 + runner IF の `--` 以降の PARAM... を順序保持で後置"
    fixed_params: "JSON 配列(要素は string のみ)。空は `[]`。bash 単独で解析できる範囲(ネスト不可)"
    execution_spec: "確定時に slots.<role>.fixed_params(配列)と run 単位の params(配列)へ分けて保存する。復元起動(--execution-spec)では spec の fixed_params + params で再構成し、PARAM の併用は受け付けない(終了コード 2)"
  exitcode_to_status:
    slot_execution: "条件「slot 実行の状態導出規則」(ファイル正本): exitcode.txt があれば 0 = SUCCEEDED / 非 0 = FAILED。exitcode.txt が無く aborted.txt があれば ABORTED。どちらも無ければ RUNNING。exitcode.txt と aborted.txt が両方あるときは exitcode.txt を優先する(中止後に実装が終了した場合)。同条件の管理 DB 側の規則: 管理 DB の slot_executions.status(RAPID_CROSSCHECK_MODE が off 以外のときだけ存在)には runner / abort-* が aborted.txt または exitcode.txt の公開時点の状態を条件付き UPDATE(WHERE status='RUNNING')で一度だけ書く。abort-blue / abort-green が ABORTED にした後に実装が走り切って exitcode.txt を公開した場合、ファイル正本の導出値は exitcode.txt 優先で SUCCEEDED / FAILED になるが、DB 列は runner の終端 UPDATE が 0 件のため ABORTED のまま残す(再同期しない)。この ABORTED は aborted.txt 公開済みのミラーとして dispatcher(rapid-crosscheck-runner.sh)の条件「中止済み run の比較依頼作成除外」の判定材料に使う(USDM SPEC-005-02 AC6 / AC9)。ファイル正本と一致しないのはこの経路だけで、slot 実行の状態判定(abort / rerun / hang-detector)は引き続きファイル正本で行う"
    slot_execution_readers: "abort-blue.sh / abort-green.sh(中止可否の判定)、background-rerun.sh --role blue|green(リラン事前検証。off でも off 以外でも常にファイル正本)、hang-detector.sh(ハング検知判定。aborted.txt がある対象は判定 COMPLETED で終端)"
    ssh_failure: "SSH 接続・実行失敗は exitcode.txt=6(仮採用)"
    runner_result_incomplete: "facade.sh は foreground の exitcode.txt が無い / 非数値のとき終了コード 6"
  compare_tool_exit_code:
    contract: "0:OK,3:NG,6:ERROR(比較ツール終了コード契約。比較ツールは適用側が用意し、relay-gate は値を変換しない)"
    mapping:
      - exit_code: 0
        request_status: "SUCCEEDED"
        final_runner_relay: 0
        rapid_notification: "なし"
      - exit_code: 3
        request_status: "FAILED"
        final_runner_relay: 3
        rapid_notification: "hang-detector が alert 行(kind=rapid-crosscheck-error、level=error)を出して終了コード 6"
      - exit_code: 6
        request_status: "FAILED"
        final_runner_relay: 6
        rapid_notification: "同上"
      - exit_code: "その他の非 0"
        request_status: "FAILED"
        final_runner_relay: "その値(無加工)"
        rapid_notification: "同上"
    launch_failure: "比較ツールの起動自体に失敗した場合は依頼を FAILED / exit_code=6 で保存し、worker は終了コード 6"
  compare_command_argv:
    summary: "比較ツール起動コマンド(RAPID_COMPARE_COMMAND / FINAL_COMPARE_COMMAND)を引数の並び(argv)として解釈・起動する共通規則。速報 worker(rapid-crosscheck-worker.sh)・確報 worker(final-crosscheck-worker.sh)・validate-config.sh(--rapid-crosscheck / --final-crosscheck)はこの 1 か所だけを参照する(他の節に同じ規則を書かない。ただし split の引用符の外し方は config_input_rules.env_files が正本で、読み手が 1 か所で規則を読めるよう同じ文を再掲する)"
    split: "設定を読み込んだ時点で値を空白(スペースまたはタブの 1 個以上の連続)で区切って引数の並びに分ける。ここでいう値は env 解析後の値 = 行を最初の `=` で分けた VALUE の前後の空白(半角空白とタブ)を除き、そのあと先頭末尾の引用符を外したもの(`source` せず、シェル変数展開・コマンド置換は行わない)。取り出し方は config_input_rules.env_files と同じ順序つき規則(正本は config_input_rules.env_files。変えるときはこの節と同時に直す。キーの前後の空白を除いた結果キーが空になる行は `error: invalid line line=N path: ...`(2)で、値を取り出さない(例: ` =abc` / `=abc` / ` = ` はいずれも invalid line)。コメント行(行の前後の空白を除いた結果が `#` で始まる行。例 `  # RAPID_COMPARE_COMMAND=/opt/cmp`)からも値を取り出さない。同じキーが 2 行以上あるファイル(config_input_rules.env_files の同じキーの重複。`error: duplicate key key=<KEY> lines=<n1,n2,...> path: ...`(2))からは値を 1 つも取り出さない(後の行の値も先の行の値も使わない)。例 `RAPID_COMPARE_COMMAND= \"/opt/cmp {job_id}\" ` の値は `/opt/cmp {job_id}`): 引用符は先頭の 1 文字が `\"` か `'` ならその 1 文字を外し、それとは別に(先頭を外した後の)末尾の 1 文字が `\"` か `'` ならその 1 文字を外す。先頭と末尾の引用符の種類の一致や、対になっていることは求めない(例: `\"abc\"` → `abc`、`\"abc` → `abc`、`abc'` → `abc`、`\"abc'` → `abc`)。分割では引用符・エスケープ・`$`・バッククォート・`;` / `|` / `&` / `*` などのシェルの記法を一切解釈せず、すべて引数の中の 1 文字として扱う。空白の連続は 1 つの区切りとして扱い、空の引数は作らない"
    command_part: "先頭の引数(この規則で分けた argv の 1 番目)をコマンド部分とする。validate-config.sh の『コマンド部分(先頭の語)』はこの先頭の引数と同一で、worker が実際に起動するコマンドと一致する"
    placeholder_substitution: "プレースホルダの置換は分けた引数 1 つの中だけで行い、置換の結果で引数の数や区切りは変わらない。`{job_id}` / `{run_id}` / `{blue_exit_code}` / `{green_exit_code}` は引数の一部としても置換できる(例 `--job={job_id}` は置換後も 1 引数)。`{params}` は引数 1 つ全体がちょうど `{params}` のときだけ使え、parameters の JSON 配列の各項目を順序どおりに 1 項目 1 引数へ展開する(`[]` なら 0 個)。それ以外の位置の `{params}`(引数の一部に `{params}` を含む)は設定の違反とする(違反文言は下記 validate-config.sh の『比較ツール起動コマンド』。--rapid-crosscheck のみ)。確報の FINAL_COMPARE_COMMAND はプレースホルダを持たず置換しない"
    pre_substitution_check: "速報 worker は置換の前に置換値を検査する: job_id は shared_rules.run_id.job_id_charset、run_id は shared_rules.run_id.format に合うこと、parameters は JSON 配列として読めること。いずれかに合わなければ比較ツールを起動せず依頼を FAILED / exit_code=6 / error_summary=`invalid request value: <field>`(field は job_id | run_id | parameters)で終端し、stderr に `error: compare request value is invalid run_id=... field=<job_id|run_id|parameters>` を出す(worker 自身は 6。launch_failure と同じ依頼状態・終了コードで、error_summary と stderr の文言だけを分けて診断できるようにする)。確報はプレースホルダ無しのため置換値の検査はしない"
    launch: "起動は分けた引数の並びをそのまま渡して行う(`\"${argv[@]}\"` 相当の argv 配列起動)。`eval` / `bash -c` / `sh -c` / 引用符なしの変数展開による起動を禁止する(文字列をシェルに解釈させない)。確報の FINAL_COMPARE_COMMAND も同じ規則で分けて argv として起動する"
  time_precision: "ISO 8601 秒精度。実行ログ / *_at 列 / stdout はホストのローカルタイムゾーン(指示子なし。conventions.datetime)、started-at.txt / aborted.txt の中身は UTC Z 付き(artifact_layout)。経過時間は floor((now - started_at) / 60) 分(started-at.txt の UTC 値と now を同じ時刻軸に揃えて計算する)"
  worker_id_default: "{hostname}-{pid}(canonical C4)。--worker-id の文字種は英数字・_・- のみ。既定値のホスト名に `.` が含まれる場合(FQDN)は `.` を `-` に置換して生成する(速報・確報 worker 共通。仮採用)"
  lease_and_poll:
    rapid:
      source: "速報クロスチェック設定(rapid-crosscheck.env。情報「速報クロスチェック設定」の属性「lease 期間(秒)」「worker の poll 間隔(秒)」。config_files.rapid-crosscheck.env)"
      RAPID_LEASE_SEC: 600
      RAPID_POLL_INTERVAL_SEC: 30
    final:
      FINAL_LEASE_MINUTES: 10
      FINAL_WORKER_POLL_INTERVAL_SEC: 30
      FINAL_POLL_INTERVAL_SEC: 60
      FINAL_POLL_LIMIT_SEC: 28800
    claim_rule: "status=REQUESTED を requested_at 昇順で 1 件、条件付き UPDATE(更新件数 1 のみ成功)で CLAIMED(worker_id, lease_until=now+lease)にする。lease 失効かつ未開始(started_at NULL)の CLAIMED は REQUESTED に戻す。RUNNING は戻さない"
    confidence: "low(既定値 600 / 30 秒は仮採用。出所(速報クロスチェック設定)は RDRA 確定)"
  artifact_root_entries:
    summary: "成果物ルート($RELAY_GATE_ARTIFACT_ROOT)直下の構成と、run ディレクトリの列挙規則。hang-detector.sh / housekeep.sh / background-rerun.sh はこの 1 か所を参照する"
    entries:
      - path: "$RELAY_GATE_ARTIFACT_ROOT/facade/<run_id>/"
        purpose: "run ディレクトリ(Runner Result と execution-spec.json。artifact_layout)"
      - path: "$RELAY_GATE_ARTIFACT_ROOT/hang-detector-notified/"
        purpose: "通知済みの印の置き場(RAPID_CROSSCHECK_MODE=off で hang-detector.sh が書く。shared_rules.hang_alert.notified_mark)"
      - path: "$RELAY_GATE_ARTIFACT_ROOT/housekeep-pending/"
        purpose: "削除待ちの置き場(housekeep.sh が削除対象の成果物を rename で移してから削除する。shared_rules.housekeep_rules)"
    run_dir_enumeration: "run ディレクトリとして扱うのは $RELAY_GATE_ARTIFACT_ROOT/facade/ 直下のディレクトリで、名前が run_id の形式(`^[0-9]{8}T[0-9]{6}-<job_id>-[0-9a-f]{8}$`。shared_rules.run_id)に合うものだけ。`.tmp` で終わる名前と形式に合わない名前は無視する。hang-detector-notified/ と housekeep-pending/ は facade/ の外にあり run ディレクトリとして列挙しない(housekeep.sh だけが別に走査する)"
    same_filesystem: "3 つのディレクトリは同じファイルシステム上に置く(housekeep.sh の rename が 1 回の操作で済むように。インフラ構築で stat のデバイス番号の一致を検査する)"
    missing_root: "『成果物ルートが無い』の定義(走査前の検査で `error: artifact root not found path: <RELAY_GATE_ARTIFACT_ROOT の値>`(2)を出すコマンド = hang-detector.sh / housekeep.sh に共通): 存在確認が ENOENT で終わったとき、存在確認そのものが失敗したとき(親ディレクトリの権限不足など)、存在するがディレクトリでないときのどれか。どれも同じ error 1 行(終了コード 2)で止め、何も走査・削除しない(2026-11-05)"
  hang_alert:
    summary: "hang-detector.sh が新たに見つけた background 異常を知らせる規則。知らせる手段は hang-detector.sh 自身の終了コード(0 / 3 / 6)と標準エラーの alert 行だけで、運用者へはジョブスケジューラの既存のジョブ監視・障害通知で届く。CLI の出力以外の通知送信手段は持たない"
    line_format: "`alert: level=<warning|error> kind=<hang-suspected|background-exec-error|rapid-crosscheck-error> run_id=<run_id> role=<blue|green|rapid-crosscheck> job_id=<job_id> elapsed_minutes=<n>`"
    line_example: "alert: level=warning kind=hang-suspected run_id=20260830T113000-JOB001-3f9a1c2e role=green job_id=JOB001 elapsed_minutes=75"
    fields: "level は kind から決まる(hang-suspected = warning、background-exec-error / rapid-crosscheck-error = error。state_codes.alert_kind)。対象は run_id + role(速報比較依頼は role=rapid-crosscheck)。elapsed_minutes は判定時点の started_at からの経過分(shared_rules.time_precision)。値は空白を含まないため key=value 形式で、control_chars の置き換えも適用する"
    order: "alert 行は run_id 昇順 → role(blue, green, rapid-crosscheck)の順に 1 件 1 行。対象ごとに出す行(通知済みの印の不正の error 行、alert 行、--verbose の info: alert skipped 行、保存失敗の error 行)はすべてこの対象の順に出し、1 つの対象の中では『`error: notified mark invalid ...` → `alert: ...` または `info: alert skipped ...` → `error: monitor record save failed ...` / `error: notified mark save failed ...`』の順とする。run_id の昇順はバイト順(LC_ALL=C の比較)。走査中の warn 行(execution-spec missing / invalid、started-at is invalid)と --verbose の info: judged 行は、対象ごとの行より前に出す。`error: artifact root is not readable path: ...`(成果物ルートの facade/ を列挙できない)は走査の最初に出し、対象ごとの行より前になる。走査した回の stderr 全体の順は『hang-detector.env の未知キーの warn 行(unknown_key_warn。走査を始めるときに出す)→ `error: artifact root is not readable ...` → 走査中の warn 行 → --verbose の info: judged 行 → 対象ごとの行』とする(未知キーの warn 行はどの alert 行・対象ごとの行よりも前)"
    unknown_key_warn: "hang-detector.env のキー表(HANG_DB_CONN_REF / RAPID_HANG_DETECT_LIMIT_MINUTES / HANG_SCAN_WINDOW_HOURS)に無いキーは、`warn: unknown key key=<KEY> path: <hang-detector.env のパス>` を出して続ける(終了コードに影響しない)。出す時点は走査を始めるとき: RAPID_CROSSCHECK_MODE が off 以外は管理 DB への接続と SELECT(db_unavailable)が通ったあと、off は印の置き場の検査(notified_mark.directory_unreadable)が通ったあと(facade/ を列挙する前)。キー表に無いキーごとに 1 行、ファイル内の出現順(物理行番号の昇順)に出す(同じキーの重複は config_input_rules.env_files で設定エラーになるため、1 つのキーは 1 行だけ)。stderr のどの行より前かは order のとおり。次の回は出さない: 走査前の入力・設定エラー(終了コード 2。commands の hang-detector.sh の走査前の検査の (a)〜(e) のどこで止まっても)、管理 DB に接続・SELECT できない回(db_unavailable。error 1 行だけ)、印の置き場を読めない回(notified_mark.directory_unreadable。error 1 行だけ)。こうして、どの入力・状態の組み合わせでも標準エラーの行数と内容を 1 つに決める(2026-11-05 利用者承認)"
    scope: "その回の見回りで新たに知らせる異常だけを出す。通知済みの異常は出さない(renotification)"
    exit_code: "alert 行 0 件 = 0、すべて level=warning = 3(警告終了)、level=error が 1 件以上 = 6(失敗)。hang-detector 自身の実行エラー(管理 DB に接続・SELECT できない、成果物ルートを読めない、監視記録・印の保存失敗、通知済みの印の不正)も 6。優先順位 6 > 3 > 0(commands の hang-detector.sh)"
    renotification: "判定結果を state_codes.hang_judgement_to_monitor_status で写した値 S と現在の通知済み状態 C を比べ、S が HANG_SUSPECTED_NOTIFIED / EXEC_ERROR_NOTIFIED / COMPARE_ERROR_NOTIFIED のいずれかで、S ≠ C かつ C が終端(EXEC_ERROR_NOTIFIED / COMPARE_ERROR_NOTIFIED / COMPLETED / NOT_MONITORED)でないときだけ alert 行を出す。C は RAPID_CROSSCHECK_MODE が off 以外では monitor_records.monitor_status(行が無ければ MONITORING)、off では通知済みの印の内容(印が無ければ MONITORING。印が不正・読めないときの扱いは notified_mark.invalid)。alert 行を出したあとで監視記録または印を保存し、保存に失敗した異常は通知済みにならないため次回も知らせる(知らせ漏れより重複を選ぶ)。管理 DB に接続できない回の扱いは db_unavailable"
    db_unavailable: "RAPID_CROSSCHECK_MODE が off 以外のとき、hang-detector.sh は走査前の設定の検査を通ったあと、成果物ルートを走査する前に管理 DB に接続し、走査に使う行(monitor_records と、未終端・未判定の rapid_crosscheck_requests)を SELECT する。接続に失敗した回は `error: management db connection failed conn_ref=...`、SELECT に失敗した回は `error: management db query failed ...` の 1 行だけを stderr に出し、成果物の走査・判定・alert 行の出力・監視記録の保存を行わずに終了コード 6 で終える(warn 行・info 行・alert 行を出さない。hang-detector.env の未知キーの warn 行(unknown_key_warn)も出さない。stdout は 0 行のまま)。現在の通知済み状態 C を読めない回に alert 行を出すと、通知済みの異常を管理 DB の障害が続くあいだ見回りのたびに知らせてしまうため(方針資料『通知済みの異常は、次回以降の監視で再び通知しません』)。異常は通知済みにならないので、管理 DB に接続できた最初の回に、通常の規則(renotification)でまだ通知済みでない異常を一度だけ知らせる。速報比較依頼はその回は判定しない。走査の途中(SELECT のあと)の監視記録の UPSERT 失敗はこの規則ではなく、対象ごとの `error: monitor record save failed ...`(次回も知らせる)とする。RAPID_CROSSCHECK_MODE=off では管理 DB に接続しないためこの規則は無い"
    notified_mark:
      written_when: "RAPID_CROSSCHECK_MODE=off のときだけ(off 以外では監視記録を使い、印は書かない)"
      directory: "$RELAY_GATE_ARTIFACT_ROOT/hang-detector-notified/(無ければ hang-detector.sh が作る)"
      file_name: "<run_id>.<role>(role は blue / green。off では速報比較依頼が無い)"
      content: "通知済み状態の英字コード 1 行 + LF(HANG_SUSPECTED_NOTIFIED / EXEC_ERROR_NOTIFIED / COMPLETED。state_codes.monitor_status の値。COMPLETED はハング疑いを知らせたあとで対象が正常終了・中止した終端)。規定の値 = ファイルの内容のバイト列が、この 3 つの英字コードのどれか + LF(0x0A)1 つと完全に一致すること(前後の空白・CR・2 行目以降・LF の欠落を許さない)"
      invalid: "印のファイル(確定名。.tmp は読まない)があるのに、内容が規定の値でない(空のファイル、末尾の LF が無い、CR や空白を含む、2 行以上、上記 3 つ以外の英字コード(例: MONITORING / COMPARE_ERROR_NOTIFIED)など)、または読めない(権限が無い、通常のファイルでない(ディレクトリなど)、読み取りの失敗)とき、その対象について `error: notified mark invalid run_id=<run_id> role=<role> path: <印の確定名の絶対パス>` を 1 行出し(内容が不正なときと読めないときで文言を分けない。内容は出さない)、その対象の現在の通知済み状態 C を印が無いもの(MONITORING)として判定を続ける(知らせ漏れより重複を選ぶ)。終了コードは 6(他の対象の判定・alert 行・保存は続ける)。印の扱い: (1) alert 行を出した対象は write_rule の手順で印を S の英字コードへ書き直す。(2) alert 行を出さず判定が COMPLETED(正常終了・中止済み)の対象は、同じ手順で印を COMPLETED へ書き直して終端する(書き直さないと見回りのたびに error 行と 6 が続くため)。(3) それ以外(判定が MONITORING / NOT_TARGET。C を MONITORING とみなすため、異常の判定はすべて (1) になる)は印を書き換えず、次の回も同じ error 行を出す。書き直しの失敗は `error: notified mark save failed run_id=... role=... path: ...`(6)。窓外の扱いは scan_window"
      write_rule: "同じディレクトリの `<run_id>.<role>.tmp` へ書いてから mv で確定名へ置き換える。読み手は .tmp を無視する。通知済み状態が変わったとき(HANG_SUSPECTED_NOTIFIED → EXEC_ERROR_NOTIFIED / COMPLETED。monitor_status_transitions と同じ)は同じ手順で書き換える。印が無い対象が正常終了・中止した場合は印を作らない。印が不正・読めない対象の書き直しは invalid のとおり。置き換え先(確定名)が既にあり通常のファイルでない(ディレクトリなど)ときは、その中へ移さずに(mv -T 相当。確定名のエントリを消さない)書き直しの失敗として `error: notified mark save failed run_id=... role=... path: ...`(6)を出し、.tmp を残さない(印は変わらないため、次の回も印の不正として扱い、異常は再び知らせる。保存失敗と同じく知らせ漏れより重複を選ぶ)"
      directory_unreadable: "RAPID_CROSSCHECK_MODE=off で印の置き場 hang-detector-notified/ があるのに列挙・読み取りできない(権限が無い、ディレクトリでない)回は(走査前の設定の検査を通ったあと、facade/ を列挙する前に検査する)、`error: notified mark dir is not readable path: <置き場の絶対パス>` の 1 行だけを出し、成果物の走査・判定・alert 行・印の書き込みを行わずに終了コード 6 で終える(hang-detector.env の未知キーの warn 行(unknown_key_warn)も出さない。db_unavailable と同じ考え方。通知済みかどうかを読めない回に alert 行を出さない)。置き場が無いときは印が 1 つも無いものとして通常どおり続ける(無ければ書くときに作る)。『無い』とみなすのは置き場の存在確認が「存在しない」(ENOENT)で終わったときだけとする。成果物ルートの権限が無いなどで存在確認そのものが失敗した(ENOENT 以外の失敗)ときは『あるのに読めない』として扱い、同じ error 1 行だけで終了コード 6 で終える(path: は置き場の絶対パス。未知キーの warn も出さない)。こうして、成果物ルートが読めない off の回の stderr を 1 つに決める"
      unjudged_targets: "判定しない対象(execution-spec.json が無い run、started-at.txt が不正な role、execution-spec.json にキーが無い role。いずれも warn を出す対象)の印は読まない。`error: notified mark invalid` を出さず、書き直さない"
      separation: "Runner Result の契約ファイル(stdout.log / stderr.log / exitcode.txt / execution-spec.json / started-at.txt / aborted.txt)とは別の場所・別のファイルにし、契約ファイルには触れない"
      scan_window: "HANG_SCAN_WINDOW_HOURS の窓外でも、印が規定の値の HANG_SUSPECTED_NOTIFIED の run は走査する(off 以外で監視記録が未終端の run を窓外でも走査するのと同じ)。印が EXEC_ERROR_NOTIFIED / COMPLETED の run は終端として窓外では走査しない。窓外の run の印が不正・読めないときは印が無いものとして扱い、窓外のため走査せず、`error: notified mark invalid ...` も出さない(印は通知したときにだけ作られるため、その run は少なくとも 1 回知らせてある。印はハウスキープが実行の単位とともに削除する)。窓内の run の印が不正・読めないときは invalid のとおり"
      deletion: "housekeep.sh が実行の単位とともに削除する(run ディレクトリを置き場へ移してから印を移す。shared_rules.housekeep_rules)。hang-detector.sh は印を削除しない"
  housekeep_rules:
    summary: "housekeep.sh の削除判定と削除順序の正本(RDRA 条件「ハウスキープの削除判定」「ハウスキープの削除順序と回復」)"
    retention: "保持日数 = housekeep.env の HOUSEKEEP_RETENTION_DAYS(既定 90)。cutoff = 現在時刻(RELAY_GATE_NOW 設定時はその値)− 保持日数 × 86400 秒(epoch 秒で計算。暦日では数えない)。単位の最も遅い終了日時 < cutoff のとき保持日数を過ぎたとする"
    db_requirement: "HOUSEKEEP_DB_CONN_REF(ハウスキープ設定の管理 DB 接続参照名)の要否の正本(RDRA 情報「ハウスキープ設定」、条件「ハウスキープの削除判定」)。管理 DB を使う機能が 1 つでもある設置では必須: (a) feature-flag.env の RAPID_CROSSCHECK_MODE が off 以外、または (b) 確報クロスチェックを使う設置(バリエーション「設定所有区分」の値「確報クロスチェック worker 設定」の設定がある設置)。(b) の判定は既存の確報系コマンドの判定(abort-final-crosscheck.sh の『final-crosscheck.env 不在または FINAL_DB_CONN_REF 欠落 = 管理 DB なし』)と揃え、$RELAY_GATE_CONFIG_DIR/final-crosscheck.env があり、その FINAL_DB_CONN_REF が欠落していない(キーがあり、config_input_rules.env_files で取り出した値が空でない)ときに確報クロスチェックを使う設置とする。ファイルが無い、キーが無い、値が空のどれかなら確報クロスチェックを使わない設置とする。(b) の判定に RAPID_CROSSCHECK_MODE は使わない(確報は速報のモードに依存しない)。判定の順: (1) HOUSEKEEP_DB_CONN_REF があれば (a) / (b) を問わず管理 DB に接続する(final-crosscheck.env は読まない)。(2) 無い・空で RAPID_CROSSCHECK_MODE が off 以外なら設定エラー。(3) 無い・空で off なら final-crosscheck.env を読んで (b) を判定し、確報クロスチェックを使う設置なら設定エラー、使わない設置(管理 DB を一切使わない設置)なら管理 DB に接続しない(member_source / final_request の『管理 DB に接続しないとき』)。設定エラーは `error: option required option=HOUSEKEEP_DB_CONN_REF path: <housekeep.env のパス>`(2)で、(a) / (b) のどちらで必須になったかは文言で区別しない。final-crosscheck.env の読み取り: あるのに読めないときは `error: config file is not readable path: <final-crosscheck.env のパス>`(2)、入力の守備範囲の違反(NUL / UTF-8 / BOM / CR / invalid line / 同じキーの重複)は config_input_rules の文言で 2(同じキーの重複は config_input_rules.env_files のとおりファイル全体の全キーで判定し、FINAL_DB_CONN_REF 以外のキーの重複も設定エラー)。FINAL_DB_CONN_REF 以外のキーの値は検査せず、未知キーの warn も出さない。housekeep.sh は FINAL_DB_CONN_REF で管理 DB に接続せず、その値(参照名)を stdout / stderr / 実行ログに出さない。この判定は起動時の設定の検査(commands の housekeep.sh processing_order の手順 0)で行い、設定エラーなら削除待ちの置き場の残りを含め何も削除しない"
    run_unit: "実行の単位 = parent_run_id でつながる実行(リランの親子)をまとめた 1 単位。つながりは管理 DB の parallel_runs.parent_run_id と、run ディレクトリの execution-spec.json の parent_run_id の両方から作る(RAPID_CROSSCHECK_MODE=off のリランは execution-spec.json だけがつながりを持つ)。親が既に無い実行は、残っている実行だけで 1 単位にする"
    member_source: "単位内の実行ごとに判定元を選ぶ。管理 DB に parallel_runs 行がある実行は管理 DB の行で判定し、行が無い実行(off で作られた実行。管理 DB に接続しないときはすべて)は成果物だけで判定する。ただし管理 DB に接続しないとき(管理 DB を一切使わない設置で HOUSEKEEP_DB_CONN_REF が無い・空。db_requirement)は、execution-spec.json の rapid_crosscheck_mode が off でない実行(foreground / background。off 以外の期間に作られ、管理 DB に終わっていない構成要素があり得る実行)を判定できないものとして単位ごと残し、`warn: run kept rapid crosscheck mode run_id=... mode=...` を出す。成果物だけで判定する実行(管理 DB に parallel_runs 行が無い実行)の判定の順は、(1) execution-spec.json の形式の検査(無い → execution-spec missing。読めない・解析できない・slots に role が無い・parent_run_id が不正、管理 DB に接続しないときは rapid_crosscheck_mode が無い・foreground / background / off のどれでもない → execution-spec invalid)、(2) この rapid crosscheck mode の判定(管理 DB に接続しないときだけ)、(3) slot のディレクトリと終了ファイルの確認(finished_artifact)とする(管理 DB に接続するときは rapid_crosscheck_mode を判定に使わない)。この (1)〜(3) は成果物だけで判定する実行にだけ適用する。管理 DB に parallel_runs 行がある実行は管理 DB の行だけで判定し(finished_db)、run ディレクトリ・execution-spec.json の有無と形式・slot のディレクトリと終了ファイルを判定に使わない(execution-spec missing / invalid、slot artifact missing の warn も出さない。execution-spec.json は読めた場合だけ run_unit のつながりに使う)。このため、成果物を削除したあとで管理 DB の行の削除に失敗した実行(成果物が無く parallel_runs 行だけが残った終了済みの実行)は、次回の実行で管理 DB の行で判定され、保持日数を過ぎていれば削除される(要求 SPEC-014-05。recovery)。速報比較依頼だけのリランで作られた run(成果物ディレクトリを持たない)も管理 DB の行だけで判定する"
    finished_db: "管理 DB で判定する実行は、parallel_runs.status が COMPLETED / ABORTED、その run_id の slot_executions がすべて SUCCEEDED / FAILED / ABORTED、rapid_crosscheck_requests が SUCCEEDED / FAILED / ABORTED(行が無ければ条件なし)のとき終わっている。終了日時 = これらの行の completed_at の最大。終端状態なのに completed_at が NULL の行があれば判定できないものとして単位ごと残し warn を出す"
    finished_artifact: "成果物だけで判定する実行(管理 DB に parallel_runs 行が無い実行)は、execution-spec.json の slots に載っている role(mode が off の slot は載らない)すべてで <run_dir>/<role>/ に exitcode.txt または aborted.txt があるとき終わっている。終了日時 = 各 slot の exitcode.txt(無ければ aborted.txt)の更新時刻の最大。execution-spec.json が無い・読めない・形式が不正(member_source の判定の順 (1))、または載っている role のディレクトリが無い実行は判定できないものとして単位ごと残し warn を出す(stderr は commands の housekeep.sh)。ディレクトリはあるが終了ファイルが無い slot は実行中として warn を出さずに残す"
    keep_rule: "単位内に 1 つでも終わっていない構成要素(RUNNING、CLAIMED、REQUESTED、STARTED、slot の終了ファイルが無い)があれば、経過日数にかかわらず単位ごと残す。すべて終わっていて、単位全体の最も遅い終了日時 < cutoff のときだけ単位ごと削除する。開始日時は使わない"
    final_request: "確報比較依頼は依頼 1 件を単位とし、status が SUCCEEDED / FAILED / ABORTED で completed_at < cutoff のものを 1 件 1 トランザクションで削除する。REQUESTED / CLAIMED / RUNNING は日数にかかわらず残す。RAPID_CROSSCHECK_MODE=off でも、確報クロスチェックを使う設置では HOUSEKEEP_DB_CONN_REF が必須のため(db_requirement)、同じ規則で削除する。管理 DB に接続しないとき(管理 DB を一切使わない設置)は扱わない"
    deletion_order:
      - "1. 単位内の各 run ディレクトリ facade/<run_id> を run_id の昇順に housekeep-pending/<run_id> へ rename する(同じファイルシステム内の 1 回の操作。既に無ければ削除済みとして飛ばす)"
      - "2. そのあとで、単位内の各 run_id の通知済みの印 hang-detector-notified/<run_id>.<role>(と <run_id>.<role>.tmp)を、元の名前の昇順に housekeep-pending/notified-<元の名前> へ rename する(run ディレクトリを先に移し、hang-detector が印の無い run ディレクトリを見て再通知しないようにする)"
      - "3. 置き場へ移したこの単位のものを、手順 1・2 で移した順に削除する。1 つのエントリの削除に失敗しても同じ単位の残りのエントリの削除を続け、失敗したエントリごとに `error: artifact delete failed path: ...` を 1 行出す。1 つでも失敗したら手順 4(管理 DB の行の削除)を行わない"
      - "4. 管理 DB の行がある実行の行を 1 トランザクションで削除する: monitor_records → rapid_crosscheck_requests → rapid_runs → slot_executions → parallel_runs(parallel_runs は子孫から順に。parent_run_id の自己参照 FK が RESTRICT のため)→ COMMIT。失敗はロールバックする"
    processing_sequence: "処理の順と error 行の順を 1 つに決める規則。名前・run_id・final_crosscheck_id の昇順はすべてバイト順(LC_ALL=C の比較。例: 数字 < 英大文字 < 英小文字のため `20260830T110000-...` は `notified-...` より前)。(a) 削除待ちの置き場の残り(processing_order の手順 1): housekeep-pending/ の直下のエントリを名前の昇順に 1 つずつ削除し、失敗した `error: pending entry delete failed path: ...` もその順に出す(1 エントリ 1 行。失敗しても次のエントリへ続ける)。(b) 実行の単位: root_run_id の昇順。単位内は deletion_order の順。(c) 確報比較依頼: completed_at の昇順、同時刻は final_crosscheck_id の昇順。(d) 孤立した通知済みの印: hang-detector-notified/ の直下のエントリを名前の昇順。error 行は処理した順に 1 件 1 行で出す"
    recovery: "手順 1〜3 のあとで失敗した場合、置き場に残ったものは、次回の実行が設定の検査(commands の housekeep.sh processing_order の手順 0)を通ったあと最初に判定せず削除される(設定エラーの実行では消さない)。手順 4 に失敗した場合は管理 DB の行が残るため、次回の走査で同じ単位を再び見つけ、既に無いファイルは削除済みとして扱って行の削除を続ける。1 つの単位の失敗は error を出して次の単位へ続け、最後に 6 で終える"
    race: "削除中に期限切れの実行がリランされた場合: --role blue|green は元の execution-spec.json が無ければ既存の execution-spec not found(3)で終わる。--role rapid-crosscheck で新しい run が作られた場合は、手順 4 の parallel_runs の削除が FK 違反で失敗してロールバックし(6)、次回の走査では新しい run を含む単位として判定する(新しい run が終わって保持日数を過ぎるまで残る)"
  hang_detect_limit:
    slot: "execution-spec.json の slots.<role>.hang_detect_limit_minutes(0 は監視対象外)"
    rapid_request: "hang-detector.env の RAPID_HANG_DETECT_LIMIT_MINUTES(既定 60)"
  state_codes:
    note: "列挙値の正本は _cross-cutting/datastore/rdb-schema.yaml の columns[].enum。DB 列に対応する項目(parallel_run_status / slot_execution_status / request_status / rapid_run_completion / monitor_status)は derived_from で正本の列を指し(derived_from は {table, column} の object。複数列が同一の値集合を共有する request_status だけは {table, column} の配列で、実装のドリフトテストは object / 配列の両形を配列として扱う)、values は rdb-schema.yaml の enum の複製。不一致は rdb-schema を正とし、実装フェーズのドリフトテストで一致を検証する(利用者決定 2026-09-08: 案 A = 値の複製 + derived_from)。DB 列に対応しない項目(slot_mode / role / hang_judgement / alert_level / alert_kind)はリテラルで持ち、source に出所を記す。遷移説明(*_transitions / *_labels / *_derivation / hang_judgement_to_monitor_status)は本ファイルが正本"
    parallel_run_status:
      derived_from:
        table: "parallel_runs"
        column: "status"
      values: ["STARTED", "RUNNING", "COMPLETED", "ABORTED"]
    parallel_run_transitions:
      - "STARTED → RUNNING(facade.sh / background-rerun.sh。全 slot 起動後(foreground の PID 待機開始前)。条件付き UPDATE status='STARTED'。UPDATE 失敗は runner 起動済みのため終了コードに反映せず実行ログ ERROR のみ)"
      - "RUNNING → COMPLETED(facade.sh。foreground 中継後)"
      - "RUNNING → COMPLETED(rapid-crosscheck-worker.sh。速報比較依頼だけを新規作成したリラン由来 run(background-rerun --role rapid-crosscheck)は、依頼が終端(SUCCEEDED / FAILED)した時点で worker が COMPLETED にする。判定規則: parallel_runs.parent_run_id IS NOT NULL かつ当該 run_id の slot_executions 行が 0 件。条件付き UPDATE status='RUNNING')"
      - "RUNNING → COMPLETED(slot runner。元の execution-spec.json から復元したリラン由来 run(background-rerun --role blue|green)は、background slot の終端(exitcode.txt 公開)時に slot runner が COMPLETED にする。判定規則: execution-spec.json の parent_run_id が非 null(restored_at あり)かつ自 slot が background。RAPID_CROSSCHECK_MODE=off では管理 DB に触れない)"
      - "STARTED / RUNNING → ABORTED(abort-blue.sh / abort-green.sh / abort-rapid-crosscheck.sh。条件付き UPDATE status IN ('STARTED','RUNNING')。COMPLETED は更新しない)"
    slot_execution_status:
      derived_from:
        table: "slot_executions"
        column: "status"
      values: ["RUNNING", "SUCCEEDED", "FAILED", "ABORTED"]
    slot_execution_derivation: "shared_rules.exitcode_to_status.slot_execution(ファイル正本。RUNNING → SUCCEEDED / FAILED は exitcode.txt 公開、RUNNING → ABORTED は aborted.txt 公開)"
    slot_mode:
      source: "RDRA バリエーション「slot 実行モード」(feature flag BLUE_MODE / GREEN_MODE の値。off は起動しないため slot_executions.mode の enum には含まれない)"
      values: ["foreground", "background", "off"]
    request_status:
      derived_from:
        - table: "rapid_crosscheck_requests"
          column: "status"
        - table: "final_crosscheck_requests"
          column: "status"
      values: ["REQUESTED", "CLAIMED", "RUNNING", "SUCCEEDED", "FAILED", "ABORTED"]
    request_status_transitions:
      - "(新規)→ REQUESTED(rapid-crosscheck-runner.sh の両系成功判定 / background-rerun.sh --role rapid-crosscheck / final-crosscheck-runner.sh の登録)"
      - "REQUESTED → CLAIMED(rapid-crosscheck-worker.sh / final-crosscheck-worker.sh の claim。条件付き UPDATE status='REQUESTED')"
      - "CLAIMED → REQUESTED(worker の lease 失効解放。lease_until < now かつ started_at IS NULL)"
      - "CLAIMED → RUNNING(rapid-crosscheck-worker.sh / final-crosscheck-worker.sh の比較開始。条件付き UPDATE status='CLAIMED' AND worker_id=自 worker。速報は 0 件(abort-rapid-crosscheck.sh で ABORTED 済み、または lease 失効で回収済み)なら比較ツールを起動しない)"
      - "RUNNING → SUCCEEDED / FAILED(worker の終端 UPDATE。速報は条件付き UPDATE status='RUNNING' AND worker_id=自 worker(rapid-crosscheck-worker.sh)、確報は `WHERE final_crosscheck_id=? AND status='RUNNING'`(final-crosscheck-worker.sh)。0 件は ABORTED 済み)"
      - "REQUESTED / CLAIMED / RUNNING → ABORTED(abort-rapid-crosscheck.sh。速報比較依頼のみ。停止確認 yes 後の条件付き UPDATE status IN ('REQUESTED','CLAIMED','RUNNING')。0 件 = 終端済みでエラー(3))"
      - "CLAIMED → ABORTED(abort-rapid-crosscheck.sh。claim 済み速報比較依頼の中止。claim 済み worker は RUNNING への条件付き UPDATE が 0 件になり比較を開始しない。状態「クロスチェック依頼」CLAIMED → ABORTED)"
      - "RUNNING → ABORTED(abort-final-crosscheck.sh。確報比較依頼のみ。条件付き UPDATE status='RUNNING'。REQUESTED / CLAIMED の確報比較依頼は中止できない)"
      - "REQUESTED → ABORTED(abort-blue.sh / abort-green.sh。対象 run の未着手の速報比較依頼だけ。条件付き UPDATE status='REQUESTED'。0 件は正常。両系の完了通知で依頼が作成された直後に slot を中止した場合の競合窓を塞ぐ保険で、dispatcher 側の中止済み run 判定(rapid-crosscheck-runner.sh request_creation_matrix)と併用する。確報比較依頼には適用しない)"
    rapid_run_completion:
      derived_from:
        table: "rapid_runs"
        column: "completion_status"
      values: ["PENDING", "ONE_COMPLETED", "BOTH_SUCCEEDED", "ANY_FAILED", "REQUEST_CREATED"]
    monitor_status:
      derived_from:
        table: "monitor_records"
        column: "monitor_status"
      values: ["NOT_MONITORED", "MONITORING", "HANG_SUSPECTED_NOTIFIED", "EXEC_ERROR_NOTIFIED", "COMPARE_ERROR_NOTIFIED", "COMPLETED"]
    hang_judgement:
      source: "RDRA バリエーション「ハング検知判定結果」(6 値の英字コード。DB 列には持たず hang_judgement_to_monitor_status で monitor_status へ写す)"
      values: ["NOT_TARGET", "COMPLETED", "MONITORING", "HANG_SUSPECTED", "EXEC_ERROR", "COMPARE_ERROR"]
    monitor_status_labels: "NOT_MONITORED = 監視対象外 / MONITORING = 監視中 / HANG_SUSPECTED_NOTIFIED = ハング疑い通知済み / EXEC_ERROR_NOTIFIED = 実行エラー通知済み / COMPARE_ERROR_NOTIFIED = 比較異常通知済み / COMPLETED = 正常終了(RDRA 状態モデル「監視状態」・バリエーション「監視状態」の 6 値と 1:1)"
    monitor_status_transitions:
      - "(初回判定)→ NOT_MONITORED / MONITORING / COMPLETED"
      - "MONITORING → HANG_SUSPECTED_NOTIFIED / EXEC_ERROR_NOTIFIED / COMPARE_ERROR_NOTIFIED(通知 UC)"
      - "MONITORING → COMPLETED(exitcode 0、依頼 SUCCEEDED、または監視対象が ABORTED(aborted.txt / 依頼 ABORTED)で中止済み終端)"
      - "HANG_SUSPECTED_NOTIFIED → EXEC_ERROR_NOTIFIED / COMPARE_ERROR_NOTIFIED(通知後に非 0 終了・比較異常が判明)"
      - "HANG_SUSPECTED_NOTIFIED → COMPLETED(通知後正常終了。通知後に exitcode 0 または ABORTED も含む)"
      - "EXEC_ERROR_NOTIFIED / COMPARE_ERROR_NOTIFIED / COMPLETED / NOT_MONITORED は終端(再判定しても遷移しない)"
    hang_judgement_labels: "NOT_TARGET = 監視対象外 / COMPLETED = 正常終了または中止済み / MONITORING = 監視中 / HANG_SUSPECTED = ハング疑い / EXEC_ERROR = 実行エラー / COMPARE_ERROR = 比較異常(RDRA バリエーション「ハング検知判定結果」の 6 値と 1:1)"
    hang_judgement_to_monitor_status: "NOT_TARGET → NOT_MONITORED(監視対象外。hang_detect_limit_minutes=0 / mode≠background)/ COMPLETED → COMPLETED(正常終了または中止済み。exitcode.txt=0、依頼 SUCCEEDED、または aborted.txt / 依頼 ABORTED の対象の終端)/ MONITORING → MONITORING / HANG_SUSPECTED → HANG_SUSPECTED_NOTIFIED / EXEC_ERROR → EXEC_ERROR_NOTIFIED / COMPARE_ERROR → COMPARE_ERROR_NOTIFIED(記録 UC は判定結果だけから monitor_status を決められる)"
    role:
      source: "RDRA バリエーション「run role(成果物ディレクトリ区分)」(4 値。監視対象の monitor_records.role はバリエーション「リラン対象 role」の 3 値で final-crosscheck を含まない)"
      values: ["blue", "green", "rapid-crosscheck", "final-crosscheck"]
    alert_level:
      source: "RDRA バリエーション「通知レベル」"
      values: ["warning", "error"]
    alert_kind:
      source: "hang-detector.sh の alert 行の kind(shared_rules.hang_alert。_cross-cutting/ux-ui/ui-design.md「ハング検知の通知出力」。RDRA バリエーション「ハング検知判定結果」のハング疑い / 実行エラー / 比較異常に対応し、通知レベルは hang-suspected = warning、それ以外 = error)"
      values: ["hang-suspected", "background-exec-error", "rapid-crosscheck-error"]

commands:
  - name: "facade.sh"
    tier: "tier-facade"
    synopsis: "facade.sh JOB_ID [PARAM...]"
    invoked_by: "ジョブスケジューラ(業務ジョブ定義)。運用モードによらず同一のジョブ定義"
    defined_in_uc: "実装切替業務/実装切替ジョブ実行フロー/slot 実行モードを選択して runner を起動する"
    used_by_ucs:
      - "実装切替業務/実装切替ジョブ実行フロー/foreground slot の結果をジョブスケジューラへ中継する"
      - "実装切替業務/実装切替ジョブ実行フロー/業務ジョブの実行結果を確認する"
      - "適用構成業務/適用構成定義フロー/切り替えた運用モードで業務ジョブを実行する"
      - "実行監視業務/background 実行監視フロー/hang_detect_limit_minutes をジョブごとに調整する"
      - "実装切替業務/実装切替ジョブ実行フロー/execution-spec.json を確定保存する(テストで起動: E2E の起動手段)"
      - "適用構成業務/適用構成定義フロー/slot runner の実体スクリプトを割り当てる(テストで起動: runner 差し替え後の E2E 確認)"
    args:
      - name: "JOB_ID"
        type: "string"
        required: true
        description: "業務ジョブ識別子。英数字・_・- のみ"
      - name: "PARAM..."
        type: "string[]"
        required: false
        description: "追加引数。順序を変えずに runner へ `--` の後ろに渡す。JOB_ID 以降の引数はすべて PARAM(`--` 始まりを含む。未知オプション判定を行わない)"
    options:
      - name: "--help"
        type: "boolean"
        required: false
        default: false
        description: "使い方を stdout に出して終了コード 0"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を実行ログに出す(stderr には出さない。中継経路を汚さない)"
    option_placement: "オプション(--help / --verbose)は JOB_ID より前にのみ置ける。JOB_ID(最初の `--` 始まりでない引数)以降はすべて PARAM として runner へ渡す。JOB_ID より前の未知の `--` 始まりは `error: unknown option option=--foo` で終了コード 2"
    stdin: "なし"
    stdout: "facade 自身は出力しない。foreground slot の stdout.log をバイト単位同一で無加工中継する(出力規約の適用外)"
    stderr: "foreground slot の stderr.log を無加工中継。中継に至る前の relay-gate 自身の検証・実行エラーのみ `error:` 1 行(+ `hint:` 1 行)。foreground 起動後は stderr を汚さない"
    exit_codes:
      - code: "foreground の exitcode.txt の値(0-255)"
        meaning: "foreground slot の終了コードをそのまま中継する"
        condition: "Runner Result 3 ファイルが揃った"
      - code: 2
        meaning: "入力・設定検証エラー(runner 未起動)"
        condition: "JOB_ID 欠落・形式不正 / mode 列挙外 / 両 slot foreground / foreground slot が 1 つも無い / runner 実体なし / off でない slot の BLUE_IMPL / GREEN_IMPL 欠落・空 / RAPID_CROSSCHECK_MODE が off 以外で RAPID_CROSSCHECK_RUNNER 欠落・実行不可 / RAPID_CROSSCHECK_MODE が off 以外で RAPID_CROSSCHECK_WORKER 欠落・空・絶対パスでない・実行不可(facade は WORKER を起動しないが feature-flag.env の必須キー(config_files.feature-flag.env.keys / validation_rules)として検証する) / 確報制御キー(キー名が `FINAL_` で始まる。config_files.feature-flag.env.validation_rules)あり / feature-flag.env なし / RAPID_CROSSCHECK_MODE が off 以外(foreground / background)で rapid-crosscheck.env 不在または RAPID_DB_CONN_REF 欠落(config_files.rapid-crosscheck.env.on_missing)。検証エラーの文言は config_files.feature-flag.env.error_messages"
      - code: 6
        meaning: "実行エラー(runner 起動前、または中継不能)。runner 起動失敗時は起動前に INSERT した slot_executions 行を status=FAILED / completed_at にベストエフォートで UPDATE する(UPDATE 失敗は実行ログ ERROR のみ。終了コード 6 は不変)"
        condition: "runner 起動前の parallel_runs / rapid_runs / slot_executions INSERT 失敗、runner 起動失敗、成果物ディレクトリ作成失敗、foreground の exitcode.txt なし・非数値。全 slot 起動後の parallel_runs STARTED→RUNNING UPDATE 失敗、中継後の parallel_runs COMPLETED UPDATE 失敗、slot_executions.pid UPDATE 失敗は終了コードに反映しない(runner 起動済みのため業務結果を優先。実行ログに ERROR)"
    idempotency: "起動のたびに新しい run_id を発行する(同一 run_id での再起動は無い。RAPID_CROSSCHECK_MODE=off でも発行する)。RAPID_CROSSCHECK_MODE が off 以外(foreground / background)では parallel_runs と rapid_runs(completion_status=PENDING)を同一トランザクションで INSERT する(canonical C3)。slot_executions は runner 起動前に pid=NULL / status=RUNNING で INSERT し、起動後に pid を UPDATE する(runner の終端 UPDATE より先に行が存在することを保証する)。off では管理 DB に触れず成果物だけで動く"
    execution_log:
      - "`INFO feature flag loaded blue_mode=... green_mode=... rapid_crosscheck_mode=... blue_impl=... green_impl=... operation_mode=...`(operation_mode は config_files.feature-flag.env.derived の英字コード parallel | green_only | next_gen_parallel | custom。off の slot の <slot>_impl は `-`)"
      - "`INFO slot started slot=... mode=... pid=...`"
      - "`ERROR management db update failed table=slot_executions run_id=...`(起動後の pid UPDATE 失敗。runner は起動済みのため終了コードは変えない。background-rerun.sh の復元起動も同文)"
      - "`INFO parallel_run status changed from=STARTED to=RUNNING run_id=...`(RAPID_CROSSCHECK_MODE が off 以外。全 slot 起動後・foreground の PID 待機開始前)"
      - "`ERROR management db update failed table=parallel_runs run_id=...`(全 slot 起動後の STARTED→RUNNING UPDATE 失敗。runner は起動済みのため終了コードは変えない。background-rerun.sh の復元起動も同文)"
      - "`INFO parallel_run status changed from=RUNNING to=COMPLETED run_id=...`(RAPID_CROSSCHECK_MODE が off 以外。foreground 中継後)"
      - "`ERROR management db update failed table=parallel_runs run_id=...`(中継後の COMPLETED UPDATE 失敗。終了コードは変えない)"
    notes:
      - "feature-flag.env を読むのは facade.sh(と background-rerun.sh)であり、runner は読まない。runner へ引き継ぐ環境変数: 常に RELAY_GATE_CONFIG_DIR / RELAY_GATE_ARTIFACT_ROOT / RELAY_GATE_LOG_DIR / RAPID_CROSSCHECK_MODE の 4 つ(値は facade が解決済みの実効値。RELAY_GATE_HOME は runner が自身の所在から再解決する)。RAPID_CROSSCHECK_MODE が off 以外のとき追加で RAPID_CROSSCHECK_RUNNER(完了通知の送信先実体の絶対パス)。通常起動では追加で BLUE_IMPL / GREEN_IMPL(自 slot の実装版。runner が execution-spec.json の slots.<role>.impl_version に転記する。off の slot の分は渡さなくてよい)。RELAY_GATE_NOW は設定時のみ追加で引き継ぐ。background-rerun.sh の復元起動(--execution-spec)は 4 つ + RAPID_CROSSCHECK_RUNNER(off 以外)+ RELAY_GATE_NOW(設定時)を引き継ぎ、impl_version は spec から読むため BLUE_IMPL / GREEN_IMPL は渡さない"
      - "RAPID_CROSSCHECK_MODE が off 以外のとき facade.sh と slot runner は $RELAY_GATE_CONFIG_DIR/rapid-crosscheck.env の RAPID_DB_CONN_REF を読む(parallel_runs / slot_executions / rapid_runs の INSERT / UPDATE)。不在は facade.sh が終了コード 2、runner は exitcode.txt=2(config_files.rapid-crosscheck.env.readers)"
      - "RAPID_CROSSCHECK_MODE の foreground と background は、完了通知の送信・速報管理 DB 書き込みの範囲で同じ挙動(判定はすべて「off か off 以外か」)。off では完了通知を送らず管理 DB に接続も書込みもしない(parallel_run も作らない)"

  - name: "$BLUE_RUNNER / $GREEN_RUNNER"
    tier: "tier-facade"
    synopsis: "<runner> --run-id <run_id> --job-id <JOB_ID> --role blue|green --mode foreground|background [--execution-spec <path>] [--help] -- [PARAM...]"
    invoked_by: "内部呼び出し(facade.sh / background-rerun.sh)。実体は feature-flag.env の BLUE_RUNNER / GREEN_RUNNER が指す絶対パス。runner IF version = 1"
    defined_in_uc: "適用構成業務/適用構成定義フロー/slot runner の実体スクリプトを割り当てる"
    used_by_ucs:
      - "実装切替業務/実装切替ジョブ実行フロー/slot 実行モードを選択して runner を起動する"
      - "実装切替業務/実装切替ジョブ実行フロー/ジョブマップで JOB_ID から実行先を解決する"
      - "実装切替業務/実装切替ジョブ実行フロー/execution-spec.json を確定保存する"
      - "実装切替業務/実装切替ジョブ実行フロー/実装スクリプトを実行して Runner Result を出力する"
      - "クロスチェック業務/速報クロスチェックフロー/速報クロスチェック runner へ完了通知を送信する"
      - "実行復旧業務/background 側リランフロー/元の execution-spec.json から復元して新しい run_id で起動する"
    args:
      - name: "-- PARAM..."
        type: "string[]"
        required: false
        description: "追加引数。固定引数の後ろに順序保持で連結(shared_rules.argument_concatenation)。--execution-spec 指定時は受け付けない"
    options:
      - name: "--run-id"
        type: "string"
        required: true
        description: "run_id。成果物ディレクトリ名。--execution-spec 指定時は spec の run_id と一致必須"
      - name: "--job-id"
        type: "string"
        required: true
        description: "JOB_ID。ジョブマップの検索キー。--execution-spec 指定時は spec の job_id と一致必須"
      - name: "--role"
        type: "enum"
        enum: ["blue", "green"]
        required: true
        description: "自 slot。<role>-job-map.csv を選び、facade/<run_id>/<role>/ に成果物を書く"
      - name: "--mode"
        type: "enum"
        enum: ["foreground", "background"]
        required: true
        description: "実行モード(リランでは background)"
      - name: "--execution-spec"
        type: "string"
        required: false
        description: "復元起動。指定時はジョブマップを読まず、既存 execution-spec.json の slots.<role> と run 単位の params で実行する。保存フェーズはスキップ"
      - name: "--help"
        type: "boolean"
        required: false
        default: false
        description: "使い方と `runner-if-version=1` を stdout に出して終了コード 0"
    stdin: "なし(SSH は -n で stdin を閉じる)"
    stdout: "なし(--help を除く)。実装の stdout は facade/<run_id>/<role>/stdout.log へ"
    stderr: "なし。実装の stderr は stderr.log へ。SSH 失敗・spec 不整合は stderr.log 末尾に `error:` 1 行(exitcode.txt 公開前のみ。公開後に stderr.log を変更しない。完了通知の失敗は stderr.log に書かず実行ログ WARN のみ)"
    exit_codes:
      - code: "exitcode.txt の値"
        meaning: "実装の終了コードをそのまま返す(0 → SUCCEEDED / 非 0 → FAILED)。完了通知の成否は反映しない"
        condition: "実装を実行し 3 ファイルを公開した"
      - code: 2
        meaning: "runner IF 引数不正・設定検証エラー(exitcode.txt=2 を公開)"
        condition: "引数不足 / job_id 未定義 / ジョブマップなし / ジョブマップの入力の守備範囲の違反(NUL バイト・UTF-8 として不正なバイト列・BOM・CR。config_input_rules)/ ジョブマップのヘッダー不一致(必須列欠落・host / user の片方だけ・列名の重複)/ CSV クォート不正 / host / user の片方だけ空 / work_dir / script が空(形式は検査しない)/ fixed_params 不正 / hang_detect_limit_minutes 不正 / 通常起動で自 slot の BLUE_IMPL / GREEN_IMPL 環境変数が未設定・空 / RAPID_CROSSCHECK_MODE が off 以外で RAPID_CROSSCHECK_RUNNER 環境変数が未設定・実行不可 / spec なし・run_id 不一致・欠落 / PARAM 併用 / started-at.txt 既存(復元起動の二重起動)/ RAPID_CROSSCHECK_MODE が off 以外で rapid-crosscheck.env 不在または RAPID_DB_CONN_REF 欠落"
      - code: 6
        meaning: "実行エラー"
        condition: "SSH 接続失敗(exitcode.txt=6。仮採用)/ ジョブマップ読み込みの補助コマンドの失敗(config_input_rules.internal_failure。stderr.log に `error: internal command failed commands=... path: ...`、exitcode.txt=6)/ Runner Result 3 ファイルを揃えられない書き込み失敗 / execution-spec.json の lock タイムアウト・書き込み失敗・既存ファイルの解析失敗(通常起動で他 slot が書いた JSON が不正。復元起動での spec 不正は 2)/ 中止済み slot での再起動(exitcode.txt なし・aborted.txt あり。exitcode.txt は書かない。idempotency 参照)"
    idempotency: "同じ run_id / role の exitcode.txt が既にあれば実装を再実行せず既存の値で終了(WARN ログ)。exitcode.txt が無く aborted.txt がある場合(中止済み slot での再起動)は実装を再実行せず、実行ログに `WARN slot already aborted run_id=... role=...` を残して exitcode.txt を書かずに終了コード 6(中止済み slot の再実行は background-rerun.sh --role blue|green で新 run_id を発行して行う)。started-at.txt だけがある場合は通常起動では上書き再実行、復元起動では 2。execution-spec.json への自 slot 節の追加は一度きり(既存なら何もしない)。RAPID_CROSSCHECK_MODE が off 以外のときの終端 UPDATE(`UPDATE slot_executions SET status=?, exit_code=?, completed_at=? WHERE run_id=? AND slot=? AND status='RUNNING'`)は facade / background-rerun が起動前に INSERT した行を更新する(ファイル正本 exitcode.txt と同じ値を保持する二重マッピング)。更新件数 0(行なし・既に ABORTED)は実行ログに `WARN management db not updated run_id=... role=...`(abort-blue / abort-green と同文。ERROR ではない)を残して終了コードは変えない(exitcode.txt の値のまま)。復元起動のリラン由来 run(execution-spec.json の parent_run_id が非 null かつ自 slot が background)では、終端 UPDATE に続けて parallel_runs を RUNNING → COMPLETED に条件付き UPDATE(status='RUNNING')する(shared_rules.state_codes.parallel_run_transitions。0 件は実行ログ WARN のみ。off では管理 DB に触れない)"
    environment: "facade.sh / background-rerun.sh から RELAY_GATE_CONFIG_DIR / RELAY_GATE_ARTIFACT_ROOT / RELAY_GATE_LOG_DIR / RAPID_CROSSCHECK_MODE の 4 つを受け取る(feature-flag.env は読まない)。RAPID_CROSSCHECK_MODE が off 以外のとき追加で RAPID_CROSSCHECK_RUNNER(完了通知の送信先実体の絶対パス。$RELAY_GATE_HOME 配下の固定パスでは解決しない)を受け取る。通常起動(--execution-spec 無し)では追加で自 slot の BLUE_IMPL / GREEN_IMPL を受け取り、execution-spec.json の slots.<role>.impl_version に転記する(復元起動では spec の値を使い、受け取らない)。RAPID_CROSSCHECK_MODE が off 以外のとき $RELAY_GATE_CONFIG_DIR/rapid-crosscheck.env の RAPID_DB_CONN_REF を読む(不在は exitcode.txt=2)"
    execution_log:
      - "`INFO ssh exec started run_id=... role=... host=... user=... work_dir=... script=...` / `INFO ssh exec finished run_id=... role=... exit_code=N`(SSH 実行。external_interfaces の SSH 実行の起動形式)"
      - "`INFO local exec started run_id=... role=... work_dir=... script=...` / `INFO local exec finished run_id=... role=... exit_code=N`(ローカル実行。ssh exec started / finished と対をなす)"
      - "`WARN slot already aborted run_id=... role=...`(exitcode.txt なし・aborted.txt ありでの再起動。実装を再実行せず exitcode.txt を書かずに終了コード 6)"
      - "`WARN management db not updated run_id=... role=...`(RAPID_CROSSCHECK_MODE が off 以外。終端 UPDATE の更新件数 0。終了コードは exitcode.txt の値のまま)"
      - "`WARN completion notice failed run_id=... role=... runner=<RAPID_CROSSCHECK_RUNNER> exit_code=N`(RAPID_CROSSCHECK_MODE が off 以外。完了通知の非 0 終了。起動できなかった場合は exit_code=127)"
    notes:
      - "ジョブマップ解決: <role>-job-map.csv(config_files)を CSV 規則で解析し、列はヘッダー名で対応付ける。host / user の両方が無い・両方空の行はローカル実行。execution-spec.json の slots.<role>.host / user は `null`。片方だけは exitcode.txt=2。入力の守備範囲(バイト・改行の異常は exitcode.txt=2、1 時点の内容だけで解決、補助コマンドの失敗は exitcode.txt=6)は config_input_rules に従う。work_dir / script は形式を検査せずそのまま実行先へ渡す(config_files.columns)"
      - "ローカル実行の起動形式(host / user が null の slot): SSH せず、runner のプロセスユーザーで `cd {work_dir} && {script} {fixed_params...} {PARAM...}` を直接起動する(stdin は `/dev/null`。stdout / stderr は SSH 実行と同じく stdout.log / stderr.log へ)。引数連結は shared_rules.argument_concatenation。ローカル実行は外部 IF ではないため external_interfaces には載せない。実行ログは `INFO local exec started ...` / `INFO local exec finished ...`(execution_log)"
      - "execution-spec.json の slots.<role>: impl_version = 環境変数 BLUE_IMPL / GREEN_IMPL の転記、map_version = ジョブマップの任意列 map_version の転記(列が無い・空なら null)、fixed_params = fixed_params セルの JSON 配列を解析した配列、credential_ref = 任意列(無ければ null)"
      - "完了通知(RAPID_CROSSCHECK_MODE が off 以外): exitcode.txt 公開後に `$RAPID_CROSSCHECK_RUNNER blue-completed|green-completed --run-id ... --job-id ... --exit-code ...` を同期起動する(成果物 URI は渡さない)。条件「完了通知失敗の扱い」: 送信失敗は自動検知しない。runner は実行ログに `WARN completion notice failed run_id=... role=... runner=<RAPID_CROSSCHECK_RUNNER> exit_code=...` を残し、Runner Result と終了コードは実装の exitcode のまま変えない。復旧は運用者が RAPID_CROSSCHECK_RUNNER を同一引数で再実行する(冪等・先勝ち)"

  - name: "rapid-crosscheck-runner.sh"
    tier: "tier-rapid-crosscheck"
    synopsis: "rapid-crosscheck-runner.sh blue-completed|green-completed --run-id <run_id> --job-id <job_id> --exit-code <n> [--verbose] [--help]"
    invoked_by: "内部呼び出し(slot runner の lib/runner-notify.sh が feature-flag.env の RAPID_CROSSCHECK_RUNNER(facade / background-rerun から環境変数で受領)が指す実体として起動する。RAPID_CROSSCHECK_MODE が off 以外(foreground / background)のときのみ、exitcode.txt 公開後に同期起動)/ 運用者(完了通知失敗時の復旧として同一引数で再実行)"
    defined_in_uc: "クロスチェック業務/速報クロスチェックフロー/速報クロスチェック runner へ完了通知を送信する"
    used_by_ucs:
      - "クロスチェック業務/速報クロスチェックフロー/両系成功時に速報比較依頼を作成する"
    args:
      - name: "subcommand"
        type: "enum"
        enum: ["blue-completed", "green-completed"]
        required: true
        description: "通知元の系統(公開 function)"
    options:
      - name: "--run-id"
        type: "string"
        required: true
        description: "run_id"
      - name: "--job-id"
        type: "string"
        required: true
        description: "JOB_ID。同じ run_id の parallel_runs.job_id と不一致なら warn を出して処理は継続(rapid_runs は job_id 列を持たない)"
      - name: "--exit-code"
        type: "integer"
        required: true
        description: "公開済み exitcode.txt の値(0〜255 の整数。範囲外・非整数は終了コード 2)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "なし"
    stdout: "固定順: run_id= / job_id= / role= / slot_status=(SUCCEEDED|FAILED) / completion_status=(PENDING|ONE_COMPLETED|BOTH_SUCCEEDED|ANY_FAILED|REQUEST_CREATED) / request_status=(REQUESTED|-) / requested_at=(ローカル日時|-)。中止済みの run(request_creation_matrix)では両系成功でも依頼を作らないため request_status=- / requested_at=-(completion_status=BOTH_SUCCEEDED)。slot runner は stdout に中継しない"
    stderr: "error: option required option=... / error: invalid exit_code value=... / error: unknown subcommand subcommand=... / error: config file not found path: ...(2。rapid-crosscheck.env 不在。config_files.rapid-crosscheck.env.on_missing の定型文)/ error: option required option=RAPID_DB_CONN_REF path: ...(2)/ error: rapid run not found run_id=... / error: management db connection failed run_id=... conn_ref=...(6)/ error: management db update failed run_id=... role=... / error: management db transaction failed run_id=... / warn: job_id mismatch run_id=... notified=... recorded=... / warn: rapid request not created run_id=... reason=parallel_run_aborted(0。継続。条件「中止済み run の比較依頼作成除外」。並行稼働実行 ABORTED)/ warn: rapid request not created run_id=... role=... reason=slot_execution_aborted(0。継続。完了通知の対象 slot の slot 実行 ABORTED)"
    exit_codes:
      - code: 0
        meaning: "自系統の完了結果を rapid_runs に登録し、両系成功なら依頼を作成した(依頼の作成有無を問わず 0。再通知も 0)。中止済みの run(parallel_runs が ABORTED、または完了通知の対象 slot の slot_executions が ABORTED。request_creation_matrix)では両系成功でも依頼を作成せず 0(条件「中止済み run の比較依頼作成除外」。completion_status は BOTH_SUCCEEDED のまま、実行ログ WARN と stderr `warn: rapid request not created run_id=... reason=parallel_run_aborted` / `warn: rapid request not created run_id=... role=... reason=slot_execution_aborted`)"
        condition: "トランザクション COMMIT"
      - code: 2
        meaning: "サブコマンド・オプションの検証エラー"
        condition: "未知のサブコマンド / 必須オプション欠落 / exit_code 非整数・0〜255 の範囲外 / rapid-crosscheck.env 不在または RAPID_DB_CONN_REF 欠落(`management db is not configured` は使わない。その文言は rapid-crosscheck-worker.sh の mode=off(3)専用)"
      - code: 3
        meaning: "業務エラー"
        condition: "rapid_runs に run_id の行が無い"
      - code: 6
        meaning: "実行エラー"
        condition: "管理 DB 接続・SQL 失敗、トランザクション失敗(ROLLBACK 済み)"
    idempotency: "同じ run_id / role の再通知は rapid_runs の自系統列を同値で更新するだけ(先勝ち。先に登録済みの値は変えない)。速報比較依頼は run_id を主キーに 1 件だけ INSERT(重複依頼を作らない。arch CTP-006)。処理順(1 トランザクション内): rapid_runs の自系統列を更新(先勝ち)→ `SELECT job_id, status FROM parallel_runs WHERE run_id = ? FOR UPDATE`(行ロック)→ 完了通知の対象 slot(通知元 role の slot)の slot_executions の status を読む(`SELECT status FROM slot_executions WHERE run_id = ? AND slot = ?`。SELECT のみ)→ 両系成功判定 → run が中止済み(parallel_runs.status = 'ABORTED'、または対象 slot の slot_executions.status = 'ABORTED')なら依頼を INSERT しない(completion_status は BOTH_SUCCEEDED のまま)、それ以外は従来どおり INSERT して REQUEST_CREATED → COMMIT。parallel_runs を FOR UPDATE で読むのは abort-blue / abort-green の無条件行ロック(`SELECT 1 FROM parallel_runs WHERE run_id = ? FOR UPDATE`。parallel_runs が COMPLETED でも取る)と直列化するため(abort が先なら本コマンドは COMMIT 後の状態(parallel_runs ABORTED または対象 slot の slot_executions ABORTED)を読んで INSERT せず、本コマンドが先なら abort の parallel_runs 行ロックが待った後に rapid_crosscheck_requests の UPDATE が REQUESTED を 1 件 ABORTED にする)。「abort が先なら INSERT しない」は abort の slot_executions UPDATE が 1 件(slot が RUNNING のまま中止できた)ときの保証で、0 件(runner の終端 UPDATE が先に COMMIT 済み)のときは slot はファイル正本でも SUCCEEDED / FAILED(exitcode.txt 優先)であり、完了通知で依頼が作成されるのは正しい振る舞い"
    execution_log:
      - "`WARN rapid request not created run_id=... reason=parallel_run_aborted`(並行稼働実行が ABORTED の run で両系成功を判定したが依頼を作らなかった。stderr は `warn: rapid request not created run_id=... reason=parallel_run_aborted`。完了事実(blue_status / green_status / 成果物 URI / 受信日時)は記録済み)"
      - "`WARN rapid request not created run_id=... role=... reason=slot_execution_aborted`(並行稼働実行は ABORTED でないが、完了通知の対象 slot(role)の slot 実行が ABORTED の run で両系成功を判定したが依頼を作らなかった。stderr は `warn: rapid request not created run_id=... role=... reason=slot_execution_aborted`。完了事実は記録済み)"
    request_creation_matrix:
      description: "依頼作成可否 = run の中止済み判定 × 両系成功判定(arch LP-010。判断主体は本コマンド = dispatcher)。run が中止済み = parallel_runs.status = 'ABORTED'、または完了通知の対象 slot(通知元 role の slot。blue-completed なら slot='blue' の行)の slot_executions.status = 'ABORTED'(aborted.txt 公開済みのミラー)。判定材料は同一トランザクションで読む(条件「中止済み run の比較依頼作成除外」。判定材料 = parallel_run.status と slot_executions.status)。縦軸 3 値 × 横軸 3 値のうち依頼を作成するのは「いずれでもない × 両系成功」だけ"
      rows:
        - abort_state: "いずれでもない(parallel_runs が STARTED / RUNNING / COMPLETED かつ対象 slot の slot_executions が ABORTED でない)"
          both_succeeded: "依頼を作成(REQUEST_CREATED)"
          any_failed: "作成しない(ANY_FAILED)"
          one_pending: "作成しない(ONE_COMPLETED)"
        - abort_state: "並行稼働実行 ABORTED(parallel_runs.status = 'ABORTED')"
          both_succeeded: "作成しない(BOTH_SUCCEEDED のまま。WARN rapid request not created ... reason=parallel_run_aborted)"
          any_failed: "作成しない(ANY_FAILED)"
          one_pending: "作成しない(ONE_COMPLETED)"
        - abort_state: "対象 slot の slot 実行 ABORTED(parallel_runs は ABORTED でないが、完了通知の対象 slot の slot_executions.status = 'ABORTED')"
          both_succeeded: "作成しない(BOTH_SUCCEEDED のまま。WARN rapid request not created ... role=... reason=slot_execution_aborted)"
          any_failed: "作成しない(ANY_FAILED)"
          one_pending: "作成しない(ONE_COMPLETED)"
    notes:
      - "条件「中止済み run の比較依頼作成除外」: 中止済みの run(parallel_runs.status が ABORTED、または完了通知の対象 slot の slot_executions.status が ABORTED)では、完了通知を受けても速報比較依頼を作成せず、完了事実だけを rapid_runs に記録して実行ログに WARN を残す(reason は判定キーで分ける: parallel_run_aborted / slot_execution_aborted)。典型経路 = 並行稼働実行は foreground slot の結果を中継した時点で COMPLETED になるため、foreground 完了後に background slot を abort-blue / abort-green で中止した run は「対象 slot の slot 実行 ABORTED」の側で除外される。判断主体は本コマンド(dispatcher)。slot runner は自 slot の中止状態(aborted.txt)を判断せず、中止後に実装が走り切って exitcode.txt を公開した場合も通常どおり完了通知を送る(条件「完了通知の系統独立」)。RAPID_CROSSCHECK_MODE=off では完了通知も依頼も存在しないため、速報有効時だけに適用する。中止した run を background-rerun.sh --role rapid-crosscheck でリランした場合は新 run_id(parallel_runs は RUNNING、slot_executions 行なし)で依頼が作成される"
      - "条件「完了通知失敗の扱い」(1): slot runner は本コマンドの非 0 終了(起動失敗を含む。$RAPID_CROSSCHECK_RUNNER を起動できなかった場合の exit_code は 127)を runner の実行ログに `WARN completion notice failed run_id=... role=... runner=<RAPID_CROSSCHECK_RUNNER> exit_code=N` として残すだけで、stderr.log には追記しない(exitcode.txt 公開後の 3 ファイルは変更しない。foreground の場合 facade が中継する stderr が変わらないため、ジョブスケジューラへの応答は速報クロスチェックの失敗で変わらない)。runner 自身の終了コードは実装の exitcode.txt の値のまま変えない(通知の成否を業務ジョブの成否に混ぜない)"
      - "条件「完了通知失敗の扱い」(2): 送信失敗は自動検知しない(hang-detector の対象外)。復旧は運用者が同一引数(subcommand / --run-id / --job-id / --exit-code)で本コマンド(RAPID_CROSSCHECK_RUNNER)を再実行する。冪等・先勝ちのため完了結果は一度だけ登録され、重複依頼は作られない"

  - name: "rapid-crosscheck-worker.sh"
    tier: "tier-rapid-crosscheck"
    synopsis: "rapid-crosscheck-worker.sh [--once] [--worker-id <id>] [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(定期起動 --once)または常駐プロセス"
    defined_in_uc: "クロスチェック業務/速報クロスチェックフロー/速報比較依頼を claim する"
    used_by_ucs:
      - "クロスチェック業務/速報クロスチェックフロー/比較ツールでジョブ単位比較を実行して結果を登録する"
      - "実行復旧業務/background 側リランフロー/速報比較依頼だけを新規作成する"
    args: []
    options:
      - name: "--once"
        type: "boolean"
        required: false
        default: false
        description: "1 回だけ poll / claim / 実行して終了する"
      - name: "--worker-id"
        type: "string"
        required: false
        default: "{hostname}-{pid}"
        description: "claim 時に記録する worker_id(英数字・_・- のみ)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "なし"
    stdout: "--once で claim できたとき固定順: run_id= / job_id= / worker_id= / lease_until= / request_status=(SUCCEEDED|FAILED|ABORTED。RUNNING 遷移 0 件のときは再 SELECT した現在の status をそのまま出す。ABORTED 以外(REQUESTED / 他 worker の CLAIMED / RUNNING / 別 worker が終端まで進めた SUCCEEDED / FAILED)は lease 失効で回収済み = WARN request not owned) / exit_code=(整数|-)。比較結果は依頼レコードの stdout / stderr / exit_code 列に保存するため別レコード・成果物ファイルを作らない。起動失敗のときは exit_code=6 を出す(request_status=FAILED)。終端 UPDATE が 0 件(比較中に abort-rapid-crosscheck.sh で ABORTED)のときは request_status=ABORTED / exit_code=-。claim 後の RUNNING 遷移(条件付き UPDATE `WHERE run_id=? AND status='CLAIMED' AND worker_id=?`)が 0 件(abort-rapid-crosscheck.sh で ABORTED 済み / lease 失効で別 worker に回収された)のときは比較ツールを起動せず、claim の 4 行に続けて request_status=<再 SELECT した現在の status> / exit_code=- を出して 0(実行ログは再 SELECT の status が ABORTED なら `WARN comparison not started run_id=... worker_id=... reason=request_aborted`、それ以外は `WARN request not owned run_id=... status=...`。条件「依頼中止可否判定」)。claim 0 件なら 0 行。常駐時は実行ログのみ"
    stderr: "error: management db is not configured mode=off(3)/ error: management db connection failed worker_id=... conn_ref=...(6)/ error: unknown option option=... / error: invalid worker_id value=... / error: config file not found path: ...(2。RAPID_CROSSCHECK_MODE が off 以外で rapid-crosscheck.env 不在)/ error: option required option=RAPID_DB_CONN_REF path: ...(2)/ error: option required option=RAPID_COMPARE_COMMAND path: ...(2)/ error: invalid value key=RAPID_LEASE_SEC|RAPID_POLL_INTERVAL_SEC value=... path: ... + hint: use a positive integer(2。検査の順は config_files.rapid-crosscheck.env note)/ error: config file is not readable path: ...(2)/ error: compare tool launch failed run_id=... command=... / error: management db update failed run_id=... 。終端 UPDATE 0 件(比較中に ABORTED)は stderr に出さず実行ログ `WARN request already terminal run_id=... status=ABORTED` のみ(継続。stdout は request_status=ABORTED)。比較開始前の RUNNING 遷移 0 件(CLAIMED 中に ABORTED / 回収済み)も stderr に出さず実行ログ(`WARN comparison not started ... reason=request_aborted` / `WARN request not owned ...`)のみ"
    exit_codes:
      - code: 0
        meaning: "--once で 1 件を終端状態まで処理した、または依頼が無かった(比較 NG / 実行エラーの 3 / 6 も 0)。比較ツールの起動自体に失敗した場合は依頼を FAILED / exit_code=6 / error_summary=`launch failed` で終端し 0(別レコード・成果物ファイルは作らない)。終端 UPDATE が 0 件(ABORTED 済み)の場合は実行ログに `WARN request already terminal run_id=... status=ABORTED` を残して 0(stderr には出さない。stdout は request_status=ABORTED)。claim 後・比較開始前の RUNNING 遷移(条件付き UPDATE status='CLAIMED' AND worker_id=?)が 0 件(abort-rapid-crosscheck.sh で ABORTED 済み、または lease 失効で回収済み)の場合は比較ツールを起動せず 0(条件「依頼中止可否判定」。arch LP-024)。常駐は SIGTERM で 0"
        condition: "1 サイクル完了"
      - code: 2
        meaning: "オプション・env の検証エラー"
        condition: "未知のオプション / worker_id の文字種不正 / RAPID_CROSSCHECK_MODE が off 以外で rapid-crosscheck.env 不在または RAPID_DB_CONN_REF / RAPID_COMPARE_COMMAND の欠落・空 / RAPID_LEASE_SEC / RAPID_POLL_INTERVAL_SEC の値が正の整数でない / rapid-crosscheck.env の入力の守備範囲の違反"
      - code: 3
        meaning: "業務エラー(管理 DB を使わない構成)"
        condition: "feature-flag.env の RAPID_CROSSCHECK_MODE=off(DB に接続せず `error: management db is not configured mode=off` で終了。rapid-crosscheck.env は読まない)"
      - code: 6
        meaning: "実行エラー"
        condition: "claim / DB 接続失敗(--once)、比較ツールの起動自体に失敗、成果物ディレクトリ作成不可、DB 更新失敗。常駐時は次 poll で再試行"
    idempotency: "条件付き UPDATE による claim(更新件数 1 のみ成功)で多重 worker の重複処理を防ぐ。CLAIMED → RUNNING(比較開始前。`UPDATE rapid_crosscheck_requests SET status='RUNNING', started_at=? WHERE run_id=? AND status='CLAIMED' AND worker_id=?`)と RUNNING → 終端はいずれも status と worker_id を条件にした条件付き UPDATE。前者 0 件 = 中止済み(abort-rapid-crosscheck.sh)または回収済み(lease 失効)で比較を開始しない(比較ツールを起動せず 0。0 件のとき依頼を再 SELECT し、status = ABORTED なら実行ログ `WARN comparison not started run_id=... worker_id=... reason=request_aborted`、それ以外(lease 失効で回収済み: REQUESTED / 他 worker の CLAIMED / RUNNING / 別 worker が終端まで進めた SUCCEEDED / FAILED)は `WARN request not owned run_id=... status=...`)、後者 0 件 = 比較中に中止済みで終端結果を保存しない。比較ツールの起動に成功し終了コード(0 / 3 / 6 / その他)を得たら stdout / stderr / exit_code を rapid_crosscheck_requests の列へ保存し status を SUCCEEDED(0)/ FAILED(非 0)にする。起動自体に失敗した依頼は FAILED / exit_code=6 / error_summary=`launch failed` で終端する。起動前に feature-flag.env の RAPID_CROSSCHECK_MODE を読み、off なら DB に接続しない"
    notes:
      - "worker が読む入力は DB の依頼レコード(rapid_crosscheck_requests)と自身の設定ファイル(rapid-crosscheck.env)だけ。runner と worker は別ネットワークセグメントで動き worker はファイルパスを読めないため、比較ツールへ渡す値は依頼レコードの値だけとし成果物 URI・対象カタログのパスを渡さない"
      - "起動コマンドの解決: rapid-crosscheck.env の RAPID_COMPARE_COMMAND(1 行の文字列)を shared_rules.compare_command_argv に従って引数の並びに分け、各引数の中でプレースホルダを依頼レコードの値へ置換する。`{job_id}`(必須)= job_id、`{run_id}` = run_id、`{params}` = parameters、`{blue_exit_code}` = blue_exit_code、`{green_exit_code}` = green_exit_code(任意。両系成功時のみ依頼が作られるため作成時はともに 0)。`{params}` は引数 1 つ全体のときだけ使え JSON 配列を 1 項目 1 引数へ展開する(`[]` は 0 個)。置換の前に job_id / run_id / parameters を検査し(shared_rules.compare_command_argv.pre_substitution_check)、不適合なら比較ツールを起動せず依頼を FAILED(exit_code=6 / error_summary=`invalid request value: <field>`)で終端する。起動は引数の並びをそのまま渡して行い、文字列をシェルに解釈させない(`eval` / `bash -c` / `sh -c` / 引用符なし展開で起動しない)。得た stdout / stderr / exit_code を依頼レコードの列へ保存する(別レコード・成果物ファイルを作らない)"
      - "条件「依頼中止可否判定」(worker 側の競合規則): claim 済みの依頼が abort-rapid-crosscheck.sh で ABORTED になった場合、CLAIMED → RUNNING の条件付き UPDATE(status='CLAIMED' AND worker_id=?)が 0 件になり、worker は比較を開始しない(shared_rules.state_codes.request_status_transitions の CLAIMED → RUNNING / CLAIMED → ABORTED)。実行ログ `WARN comparison not started run_id=... worker_id=... reason=request_aborted`。stdout(--once)は claim の 4 行 + request_status=ABORTED / exit_code=-。終了コード 0"
      - "リラン由来 run の COMPLETED(shared_rules.state_codes.parallel_run_transitions): 依頼を終端(SUCCEEDED / FAILED)にした後、parallel_runs.parent_run_id IS NOT NULL かつ当該 run_id の slot_executions 行が 0 件(background-rerun --role rapid-crosscheck で依頼だけを新規作成した run)なら、同一トランザクションで parallel_runs を RUNNING → COMPLETED に条件付き UPDATE する(SQL: `UPDATE parallel_runs SET status='COMPLETED', completed_at=? WHERE run_id=? AND status='RUNNING'`)。実行ログ `INFO parallel_run status changed from=RUNNING to=COMPLETED run_id=...`(UC 側もこの文言に揃える)。0 件(既に ABORTED)は WARN のみ。通常 run(slot_executions あり)は facade が COMPLETED にするため触れない"

