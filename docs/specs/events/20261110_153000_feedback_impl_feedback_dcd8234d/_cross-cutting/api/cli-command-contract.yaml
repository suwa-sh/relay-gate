  - name: "abort-rapid-crosscheck.sh"
    tier: "tier-ops"
    synopsis: "abort-rapid-crosscheck.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(直接起動。hang-detector の alert 行 kind=hang-suspected role=rapid-crosscheck を受けたときの推奨対処)/ ジョブスケジューラ(--yes 付き)"
    defined_in_uc: "実行復旧業務/実行中止フロー/現在状態を確認して停止確認に応答する"
    used_by_ucs:
      - "実行復旧業務/実行中止フロー/実行を ABORTED へ遷移させる"
      - "実行監視業務/background 実行監視フロー/ハング検知ジョブの異常終了を確認する"
      - "実行監視業務/background 実行監視フロー/ハング疑い・実行エラー・比較異常を通知する"
      - "実行復旧業務/background 側リランフロー/リラン対象を検証する"
    args: []
    options:
      - name: "--run-id"
        type: "string"
        required: true
        description: "対象 run_id(rapid_crosscheck_requests の主キー)。依頼が REQUESTED / CLAIMED / RUNNING のとき ABORTED へ"
      - name: "--yes"
        type: "boolean"
        required: false
        default: false
        description: "停止確認プロンプトを省略して yes とみなす"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "abort-blue.sh と同じ"
    stdout: "現在状態(固定順 7 行): run_id, job_id, role, status, worker_id, lease_until, started_at。未 claim(REQUESTED)では worker_id / lease_until / started_at は `-`(CLAIMED では started_at のみ `-`。rapid-crosscheck-worker.sh の `-` 規約と同じ)。肯定応答後に status=ABORTED / aborted_at={ローカル日時}。否定応答時は status={現在状態}"
    stderr: "プロンプト・info: aborted by operator; status not changed・error: interactive confirmation required は abort-blue.sh と同じ。error: request not found run_id=...(3)/ error: request is not abortable run_id=... role=rapid-crosscheck status=...(3。依頼が SUCCEEDED / FAILED / ABORTED の終端状態のときだけ。REQUESTED / CLAIMED / RUNNING は中止可)/ error: request is not abortable (state changed concurrently) run_id=... role=rapid-crosscheck status=<再 SELECT した status>(3。現在状態の表示後に依頼が終端して条件付き UPDATE が 0 件になった競合。abort-blue.sh の同名エラーに相当)/ error: management db is not configured (RAPID_CROSSCHECK_MODE=off) run_id=...(3。依頼レコードは管理 DB にしか無いため off では中止できない。abort-blue / abort-green とは異なる)/ error: management db connection failed run_id=... conn_ref=...(6)/ error: management db update failed run_id=...(6)"
    exit_codes:
      - code: 0
        meaning: "現在状態 7 行の表示 → 停止確認(REQUESTED の依頼には worker プロセスが無いが確認は省略しない)→ yes のときだけ `UPDATE rapid_crosscheck_requests SET status='ABORTED', completed_at=? WHERE run_id=? AND status IN ('REQUESTED','CLAIMED','RUNNING')` で依頼を ABORTED へ更新した(更新件数 1。REQUESTED / CLAIMED / RUNNING のいずれからでも ABORTED にする。条件「依頼中止可否判定」)。続けて parallel_runs は `WHERE status IN ('STARTED','RUNNING')` の条件付き UPDATE で併せて ABORTED にする。COMPLETED は更新しない(0 件で可。通常 run は foreground 中継完了で COMPLETED 済みのため 0 件、rerun --role rapid-crosscheck 由来の run は RUNNING のため ABORTED になる)"
        condition: "更新件数 1"
      - code: 2
        meaning: "入力検証エラー"
        condition: "引数不正 / 非 TTY で --yes なし"
      - code: 3
        meaning: "業務エラー"
        condition: "対象依頼が無い / 応答が yes 以外 / 管理 DB なし(RAPID_CROSSCHECK_MODE=off)/ 中止不可(SUCCEEDED / FAILED / ABORTED の終端状態。状態を変更せずエラー終了)/ 更新件数 0(表示後に終端した競合。stderr は `error: request is not abortable (state changed concurrently) ...`)"
      - code: 6
        meaning: "実行エラー"
        condition: "管理 DB 接続・SQL 失敗"
    idempotency: "条件付き UPDATE(status IN ('REQUESTED','CLAIMED','RUNNING'))。CLAIMED を中止すると claim 済み worker の RUNNING 遷移(条件付き UPDATE)が 0 件になり比較を開始しない(rapid-crosscheck-worker.sh)。CLAIMED を放置すると lease 失効で REQUESTED に戻り別 worker が再 claim して比較が実行されるため、中止済み run の依頼は本コマンドで止める。再実行は終端済みで 3"
    notes:
      - "中止可否判定表(条件「依頼中止可否判定」。arch LP-019。縦軸 = クロスチェック種別、横軸 = 依頼状態): 速報 × REQUESTED / CLAIMED / RUNNING = 可(本コマンド)/ 速報 × SUCCEEDED / FAILED / ABORTED = 不可(3)/ 確報 × RUNNING = 可(abort-final-crosscheck.sh)/ 確報 × REQUESTED / CLAIMED / SUCCEEDED / FAILED / ABORTED = 不可(3。abort-final-crosscheck.sh)"

