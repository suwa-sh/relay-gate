    args: []
    options:
      - name: "--run-id"
        type: "string"
        required: true
        description: "対象 final_crosscheck_id(引数名は 4 スクリプトで --run-id に揃える。canonical C7、仮採用)。依頼が RUNNING のとき ABORTED へ"
      - name: "--yes"
        type: "boolean"
        required: false
        default: false
        description: "停止確認プロンプトを省略して yes とみなす"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "abort-blue.sh と同じ"
    stdout: "現在状態(固定順 7 行): run_id(final_crosscheck_id), job_id(常に -), role, status, worker_id, lease_until, started_at。肯定応答後に status=ABORTED / aborted_at={ローカル日時}"
    stderr: "abort-blue.sh と同じ。ただし管理 DB なしの文言は error: management db is not configured run_id=...(final-crosscheck.env / FINAL_DB_CONN_REF の有無だけで判定。RAPID_CROSSCHECK_MODE は参照せず、off 付記も付けない)。中止不可は error: request is not abortable run_id=... role=final-crosscheck status=..."
    exit_codes:
      - code: 0
        meaning: "ABORTED へ更新した(parallel_runs は持たないため併更新なし)"
        condition: "更新件数 1"
      - code: 2
        meaning: "入力検証エラー"
        condition: "引数不正 / 非 TTY で --yes なし / final-crosscheck.env の入力の守備範囲の違反(NUL / UTF-8 / BOM / CR / invalid line / 同じキーの重複。config_input_rules.env_files。FINAL_DB_CONN_REF 以外のキーの重複も含む。重複は値を使わないが『FINAL_DB_CONN_REF 欠落』とは扱わない)"
      - code: 3
        meaning: "業務エラー"
        condition: "対象依頼が無い / 応答が yes 以外 / 管理 DB なし(final-crosscheck.env 不在または FINAL_DB_CONN_REF 欠落。欠落の判定は final-crosscheck.env が入力の守備範囲の検査を通った後に行う。欠落 = キーが無い、または値が空。housekeep.sh が確報クロスチェックを使う設置かを判定するときも同じ規則(shared_rules.housekeep_rules.db_requirement)。feature-flag.env の RAPID_CROSSCHECK_MODE は参照しない。確報は速報モードに依存しない)/ 中止不可(RUNNING でない = REQUESTED / CLAIMED / SUCCEEDED / FAILED / ABORTED。状態を変更せずエラー終了)/ 更新件数 0"
      - code: 6
        meaning: "実行エラー"
        condition: "管理 DB 接続・SQL 失敗"
    idempotency: "条件付き UPDATE(status='RUNNING')。ABORTED 後に final-crosscheck-runner.sh が polling 中なら exit_code NULL として 6 を返す"
    notes:
      - "確報比較依頼は RUNNING のみ中止できる(条件「依頼中止可否判定」)。確報の未着手(REQUESTED / CLAIMED)依頼はジョブスケジューラの正規ジョブが同期 polling 中であり、runner 側の polling 上限(FINAL_POLL_LIMIT_SEC)で扱う。速報比較依頼の REQUESTED / CLAIMED / RUNNING の中止は abort-rapid-crosscheck.sh(判定表は同コマンドの notes)"

