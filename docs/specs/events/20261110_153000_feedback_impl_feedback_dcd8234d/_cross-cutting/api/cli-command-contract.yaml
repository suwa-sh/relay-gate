    args: []
    options:
      - name: "--feature-flag"
        type: "string"
        required: false
        owner_tier: "tier-facade"
        description: "検証する feature flag env ファイルのパス。他の検証種別オプションと排他。runner 実体(絶対パス・実行可能・runner-if-version 応答)と対応ジョブマップの存在も検証する。runner-if-version 応答の問い合わせ規則は runner_help_probe"
      - name: "--job-map"
        type: "string"
        required: false
        owner_tier: "tier-facade"
        description: "検証する slot ジョブマップ CSV のパス。他の検証種別オプションと排他"
      - name: "--rapid-crosscheck"
        type: "string"
        required: false
        owner_tier: "tier-facade"
        description: "検証する速報クロスチェック設定ファイル(rapid-crosscheck.env)のパス。値必須(既定パス $RELAY_GATE_CONFIG_DIR/rapid-crosscheck.env を使う場合も明示的に渡す。conventions.option_style の `--key value` 固定に従う)。RAPID_COMPARE_COMMAND の起動コマンドを検証する(shared_rules.compare_command_argv で分けた先頭の引数 = コマンド部分が絶対パスで存在・実行可能、`{job_id}` を含む、`{params}` は引数 1 つ全体のときだけ)。他の検証種別オプションと排他"
      - name: "--final-crosscheck"
        type: "string"
        required: false
        owner_tier: "tier-facade"
        description: "検証する確報クロスチェック worker 設定ファイル(final-crosscheck.env)のパス。値必須(既定パス $RELAY_GATE_CONFIG_DIR/final-crosscheck.env を使う場合も明示的に渡す)。FINAL_COMPARE_COMMAND の起動コマンドを検証する(shared_rules.compare_command_argv で分けた先頭の引数 = コマンド部分が絶対パスで存在・実行可能。プレースホルダ無しのため `{job_id}` / `{params}` の検査はしない)。他の検証種別オプションと排他"
      - name: "--housekeep"
        type: "string"
        required: false
        owner_tier: "tier-facade"
        description: "検証するハウスキープ設定ファイル(housekeep.env)のパス。値必須(既定パス $RELAY_GATE_CONFIG_DIR/housekeep.env を使う場合も明示的に渡す)。HOUSEKEEP_RETENTION_DAYS がある場合に正の整数(`^[1-9][0-9]{0,8}$`)であることを検証する(キーが無ければ既定 90 で valid)。HOUSEKEEP_DB_CONN_REF の要否は RAPID_CROSSCHECK_MODE と確報クロスチェックを使う設置か(final-crosscheck.env の FINAL_DB_CONN_REF の有無)に依存するため検証せず、housekeep.sh の起動時に検査する(shared_rules.housekeep_rules.db_requirement)。定義 UC は「保持日数を過ぎた終了済みの実行と確報比較依頼を判定する」。他の検証種別オプションと排他"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "補助出力の info: 行を stderr に出す(終了コード・stdout・violations には影響しない)。info 行の文言・出す回・順の正本は検証種別ごとに次のとおり: --job-map は行ごとの解決結果で stderr の『補助出力』、--feature-flag / --rapid-crosscheck / --final-crosscheck / --housekeep は config_input_rules.env_files の『validate-config.sh の --verbose の info 行』(env 形式の 4 検証種別に同じ規則)"
    option_exclusivity: "検証種別オプション 5 つのうちちょうど 1 つを指定する。0 個または 2 個以上は終了コード 2"
    runner_help_probe:
      scope: "--feature-flag で、mode が off でない slot の <SLOT>_RUNNER(絶対パス・実行可能の検証を通過したもの)に `<runner> --help` を問い合わせ、runner IF の版(runner-if-version)を確認する。問い合わせの待機上限・実行順・未応答の判定・準備失敗の扱いはこの節が正本で、UC「slot runner の実体スクリプトを割り当てる」「feature flag を設定する」の tier md はここを参照し値を持たない"
      order: "blue → green の逐次(並列にしない)。前の slot の結果に関わらず次の slot も問い合わせる。mode=off の slot と、絶対パス・実行可能の検証に違反した slot は問い合わせない"
      timeout_seconds_per_slot: 4
      timeout_action: "待機上限に達したら runner のプロセスグループへ TERM を送り、0.2 秒後に KILL を送って停止する(runner を独立したプロセスグループで起動し、runner が起動した子プロセスも同じグループとして回収する)。停止後、その slot は『応答しない』として扱う"
      no_response_criteria:
        - "待機上限に達した(停止処理後)"
        - "終了コードが非 0(`runner-if-version=` 行の有無に関わらず)"
        - "終了コード 0 だが stdout に `runner-if-version=` で始まる行が無い"
        - "採用した `runner-if-version=` 行の値が `1`(現在の runner IF 版)でない"
      version_line_selection: "stdout の `runner-if-version=` で始まる行が複数ある場合は最初の 1 行を採用し、2 行目以降は無視する。採用行の `=` より右(前後の空白を除いた文字列)を版の値とする"
      no_response_result: "stderr に `warn: runner does not respond to --help slot=<blue|green> runner=<path>` を 1 行出し、stdout の `<slot>_runner_if_version` は `-`。検証は拒否しない(この warn だけなら終了コード 0。他の違反があれば 2)"
      response_result: "stdout の `<slot>_runner_if_version=1`"
      preparation_failure: "問い合わせの準備(応答を受ける一時ファイルの作成、プロセスグループでの起動)に失敗した場合は runner の未応答と区別し、stderr に `error: runner probe failed slot=<blue|green> reason=<reason>` を出して終了コード 6(conventions.exit_codes の実行エラー)で即時終了する。残りの検証と stdout の出力は行わない(利用者が設定の問題と検証器の障害を区別できるようにする)"
      per_slot_probe_budget_seconds: 4.6
      response_time_budget: "1 slot の問い合わせ全体(待機上限 4 秒 + TERM → KILL の 0.2 秒 + プロセスグループの回収と起動のオーバーヘッド 0.4 秒以内)を per_slot_probe_budget_seconds = 4.6 秒以内に収める。両 slot が未応答の場合の問い合わせ時間の上限は 2 slot × 4.6 秒 = 9.2 秒(現行実装の実測は約 9.1 秒)。問い合わせ以外の検証と出力を 0.8 秒以内に収めれば NFR B.2.1.1(CLI 応答 10 秒以内)を満たす。runner が応答すれば待機は応答までの時間だけ。オーバーヘッド 0.4 秒は実測からの導出(仮採用: docs/todo.md)"
    stdin: "なし"
    stdout: |-
      検証種別ごとに固定順の key=value:
      - --feature-flag: config_path, blue_mode, green_mode, blue_impl, green_impl, blue_runner, green_runner, rapid_crosscheck_mode, rapid_crosscheck_runner, rapid_crosscheck_worker, operation_mode, blue_job_map, green_job_map, blue_runner_if_version, green_runner_if_version(operation_mode は config_files.feature-flag.env.derived の英字コード parallel | green_only | next_gen_parallel | custom。off の slot は <slot>_impl / <slot>_runner / <slot>_job_map / <slot>_runner_if_version が `-`。RAPID_CROSSCHECK_MODE=off では rapid_crosscheck_runner / rapid_crosscheck_worker が `-`。runner が --help に「応答しない」と判定した場合(判定基準は runner_help_probe)も <slot>_runner_if_version=- で warn:)
      - --job-map: map_path, rows, map_version(任意列 map_version が無い・空なら `-`。impl_version は出さない)
      - --rapid-crosscheck: config=rapid-crosscheck, path: ..., command_path: <RAPID_COMPARE_COMMAND の先頭の語 = shared_rules.compare_command_argv で分けた先頭の引数>, has_job_id_placeholder=true|false|-, status=valid|invalid, violations=N(invalid 時)。command_path / has_job_id_placeholder は(invalid line・同じキーの重複、またはバイト・改行の違反で値を使わないときは `-`。config_input_rules.env_files)
      - --final-crosscheck: config=final-crosscheck, path: ..., command_path: <FINAL_COMPARE_COMMAND の先頭の語 = shared_rules.compare_command_argv で分けた先頭の引数>, status=valid|invalid, violations=N(invalid 時)。command_path は(invalid line・同じキーの重複、またはバイト・改行の違反で値を使わないときは `-`。config_input_rules.env_files)
      - --housekeep: config=housekeep, path: ..., retention_days=<N>(キーが無ければ 90。invalid 時は `-`), status=valid|invalid, violations=N(invalid 時)
    stderr: |-
      違反ごとに `error:` 1 行(全件)。同種の違反は検証種別(--feature-flag / --job-map / --rapid-crosscheck / --final-crosscheck / --housekeep)を問わず次の共通形式にする(各 UC の tier md はこれに揃える):
      - ファイル無し・読めない: `error: config file not found path: ...`(2)/ `error: config file is not readable path: ...`(2)
      - 入力の守備範囲(全設定ファイル共通。config_input_rules が正本。行番号は物理行番号、path は利用者が指定したパス): NUL バイト `error: nul byte is not allowed line=N path: ...`(2)/ UTF-8 として不正なバイト列(コメント行を含む)`error: encoding is not utf-8 line=N path: ...`(2)/ BOM `error: byte order mark is not allowed line=1 path: ...`(2)/ CR(CRLF を含む)`error: carriage return is not allowed line=N path: ...` + 次行 `hint: use LF line endings`(2)/ ヘッダー列名の重複(CSV)`error: duplicate column column=<name> path: ...`(2)/ env の `=` を含まない行・キーが空の行 `error: invalid line line=N path: ...`(2)/ env の同じキーの重複 `error: duplicate key key=<KEY> lines=<n1,n2,...> path: ...`(2。重複したキーごとに 1 行。lines= は下記「重複キー」と同じ規則)。いずれも同種の行が複数あれば行ごとに 1 行(全件。duplicate key だけは重複したキーごとに 1 行で、重複した行ごとには出さない)。バイト・改行の違反(NUL / UTF-8 / BOM / CR)は CSV・env とも、ファイル内の全件を行番号の昇順に、同じ行は NUL → UTF-8 → BOM → CR の順に 1 種類 1 行で出し、hint は最後の CR の error 行の次に 1 回だけ出して、以降の検査をせずに止める(config_input_rules.byte_checks)。env の検査の段と報告の順(バイト・改行 → invalid line → duplicate key → キーごとの検査)は config_input_rules.env_files
      - 検証器の内部障害(config_input_rules.internal_failure): 補助コマンドの失敗 `error: internal command failed commands=<name,...> path: ...`(6。commands= には実際に失敗したコマンド名だけを書く)/ 入力の複製の失敗 `error: config snapshot failed path: ...` + 次行 `hint: check TMPDIR is writable`(6)。内部障害では stdout を出さず、他の error / warn 行も出さない(検証 OK も違反も返さない)
      - ヘッダー不一致(slot ジョブマップ。列はヘッダー名で対応付ける): `error: job map header mismatch missing=<col,...> path: ...`(2。必須列の欠落、host / user の片方だけ。順序違いは違反にしない。未知列は `warn: unknown column column=<name> path: ...`。旧 `expected=... actual=...` 形式は使わない)
      - CSV クォート不正(slot ジョブマップ): `error: csv quote is invalid line=N path: ...`(2。閉じられていない二重引用符、囲みの外に二重引用符、囲み無しセルのカンマ等。config_files の csv_rules)
      - 比較ツール起動コマンド(--rapid-crosscheck / --final-crosscheck。コマンド部分(先頭の語)は shared_rules.compare_command_argv で分けた先頭の引数と定義する。検証はコマンド部分と `{job_id}` の有無・`{params}` の位置に行い、`{job_id}` の有無と `{params}` の位置のほかは、引数部分の内容を検査しない): 必須キー欠落・空 `error: option required option=<KEY> path: ...`(2)/ コマンド部分が絶対パスでない `error: path is not absolute key=<KEY> path=...`(2)/ コマンド部分が存在しない・実行不可 `error: file not executable key=<KEY> path=...`(2)/ 速報の起動コマンドに `{job_id}` が無い `error: placeholder {job_id} is missing key=<KEY> value=...`(2。--rapid-crosscheck のみ)/ 速報の `{params}` が引数 1 つ全体でない位置に現れる `error: placeholder {params} must be a whole argument key=<KEY> value=...`(2。--rapid-crosscheck のみ。shared_rules.compare_command_argv.placeholder_substitution)。確報(--final-crosscheck)はプレースホルダ無しのため `{job_id}` / `{params}` の検査はしない。<KEY> は RAPID_COMPARE_COMMAND / FINAL_COMPARE_COMMAND。記号(`;` / `|` / `$` / 空白を含む値)は検証で拒否しない(引数として渡せば文字として届くため。shared_rules.compare_command_argv)
      - 列数不一致: `error: column count mismatch line=N expected=<n> actual=<n>`(2)
      - ハウスキープ設定(--housekeep): 保持日数が正の整数でない `error: invalid value key=HOUSEKEEP_RETENTION_DAYS value=... path: ...` + 次行 `hint: use a positive integer`(2。値が空・0・負・小数・先頭 0・`+` 付き・10 桁以上)/ 未知キー `warn: unknown key key=<KEY> path: ...`(継続)
      - feature flag(--feature-flag): 必須キー欠落・空 `error: option required option=<KEY> path: ...`(2)/ enum 外 `error: invalid value key=<KEY> value=...`(2。RAPID_CROSSCHECK_MODE / BLUE_MODE / GREEN_MODE では次行に `hint: use foreground, background or off` を続ける)/ 絶対パスでない `error: path is not absolute key=<KEY> path=...`(2)/ 実体が無い・実行不可 `error: file not executable key=<KEY> path=...`(2)/ foreground 重複・無し `error: foreground slot must be exactly one blue_mode=... green_mode=...`(2)/ 確報制御キーあり(キー名が `FINAL_` で始まる。範囲は config_files.feature-flag.env.validation_rules)`error: final crosscheck key is not allowed key=<KEY>`(2)/ job map 実体無し `error: job map not found slot=<blue|green> map=<path>`(2)/ 未知キー `warn: unknown key key=<KEY> path: ...`(継続)。文言は config_files.feature-flag.env.error_messages が正で、facade.sh の起動時検証も同文
      - 重複キー(slot ジョブマップ): `error: duplicate job_id job_id=... lines=<n1,n2,...>`(2)。`lines=` の規則: そのキーが現れた全行の物理行番号を、初出行を含めて出現順(昇順)にカンマ区切り・空白なしで並べる。重複したキー 1 つにつき error 行は 1 行。例: 2 行目と 5 行目に同じ job_id がある入力は `lines=2,5`、2・3・4 行目にある入力は `lines=2,3,4`(`lines=5` のように初出行を省かない)。env 形式の設定ファイル(--feature-flag / --rapid-crosscheck / --final-crosscheck / --housekeep)の同じキーの重複は `error: duplicate key key=<KEY> lines=<n1,n2,...> path: ...`(2)で、lines= は同じ規則(重複したキーの初出行の昇順に 1 キー 1 行。正本は config_input_rules.env_files)
      - 行の値不正(slot ジョブマップ): `error: <column> is <reason> line=N job_id=... value=...`(例: `error: hang_detect_limit_minutes is not a non-negative integer line=N job_id=... value=...` / `error: host is empty line=N job_id=... value=`(user だけ値があり host が空)/ `error: user is empty line=N job_id=... value=`(host だけ値があり user が空。両方空はローカル実行で正常)/ `error: work_dir is empty line=N job_id=... value=` / `error: script is empty line=N job_id=... value=`(work_dir / script は空でなければ受理する。絶対パス・相対パス・Windows 形式(ドライブ文字 + バックスラッシュ)のどれでもよく、形式の検査はしない。config_files の columns.work_dir / script。旧 `is not absolute` 形式は使わない)/ `error: fixed_params is not a json array of strings line=N job_id=... value=...` / `error: <column> is empty line=N job_id=... value=`)
      未知キー(`warn: unknown key key=<KEY> path: ...`)・未知列(`warn: unknown column column=<name> path: ...`。slot ジョブマップの impl_version 列を含む)・credential_ref の形式の扱い(参照名の形式 `^[A-Za-z0-9_.-]*$` に合わない値、または `BEGIN` を含む値。`/` を含むか・空白や非 ASCII 文字を含むか等の理由を問わず同じ `warn: credential_ref looks like a secret or path line=N job_id=<v>` を 1 行出して受理し、終了コードに影響しない。値は出さない。正本は config_files の <slot>-job-map.csv columns.credential_ref)・版の混在(`warn: mixed map_version values=<a>,<b>`)・runner-if-version 未応答(`warn: runner does not respond to --help slot=... runner=...`。待機上限・判定基準は runner_help_probe)は `warn:`。runner --help 問い合わせの準備失敗は `error: runner probe failed slot=... reason=...`(6。runner_help_probe.preparation_failure)。対処が明確なら `hint:`
      補助出力(--verbose、stderr): `--job-map --verbose` は解決結果を 1 行 1 job_id で `info: resolved job_id=... host=<host|-> user=<user|-> exec=<ssh|local> work_dir=... script=... fixed_params=[...] hang_detect_limit_minutes=N`(host / user が無い・空の行は host=- user=- exec=local。fixed_params は解析後の配列を JSON 配列表記(conventions.output_format.control_chars の例外規則: JSON の文字列規則でエスケープ)。work_dir / script の値はそのまま(バックスラッシュも置き換えない。例 `work_dir=G:\\scripts`))。`--feature-flag --verbose` / `--rapid-crosscheck --verbose` / `--final-crosscheck --verbose` / `--housekeep --verbose` は、読み取ったキーごとに `info: key loaded key=<KEY> path: <path>` を 1 行出す(env の検査の段の (iii) へ進んだ回だけ。(i)(ii) で止めた回は出さない。(iii) の中では info 行をすべて → 未知キーの warn 行をすべて → キーごとの検査の error 行(と hint)の順。正本は config_input_rules.env_files の『validate-config.sh の --verbose の info 行』)。終了コードには影響しない
      任意入力の表示: error / warn / info 行の value= / column= / key= / path: に出す任意入力は conventions.output_format.control_chars の可視表記にする(例: 列名が `abc<ESC>` なら `warn: unknown column column=abc\\u001b path: ...`)
    exit_codes:
      - code: 0
        meaning: "検証 OK(違反 0 件)"
        condition: "全ルール通過。データ行 0 件(ヘッダーだけ)の CSV も検証 OK(`rows=0`。config_input_rules の例外)"
      - code: 2
        meaning: "入力・設定検証エラー"
        condition: "検証種別オプションの指定数不正 / 未知のオプション / ファイル不在・読み取り不可 / 入力の守備範囲の違反(NUL バイト、UTF-8 として不正なバイト列、BOM、CR、env の invalid line・同じキーの重複。config_input_rules)/ ヘッダー不一致(slot ジョブマップの必須列欠落、host / user の片方だけ)/ ヘッダー列名の重複 / CSV クォート不正 / 列数不一致(空白だけの行を含む)/ 行の違反 1 件以上(job_id 不正・重複、必須列が空(work_dir / script を含む)、host / user の片方だけ空、fixed_params 不正、hang_detect_limit_minutes 不正、mode 列挙外、両 slot foreground、foreground 無し、off でない slot の BLUE_IMPL / GREEN_IMPL 欠落・空、BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER の絶対パス違反・実行不可、確報制御キー(`FINAL_` で始まるキー)あり、比較ツール起動コマンド(RAPID_COMPARE_COMMAND / FINAL_COMPARE_COMMAND)のコマンド部分(先頭の引数)の絶対パス違反・存在しない・実行不可、速報の起動コマンドに `{job_id}` が無い、速報の `{params}` が引数全体でない位置にある、HOUSEKEEP_RETENTION_DAYS が正の整数でない)。ジョブマップの work_dir / script の形式(絶対 / 相対 / Windows 形式)は違反にしない"
      - code: 6
        meaning: "実行エラー"
        condition: "検証器の内部障害(config_input_rules.internal_failure): 入力の複製(単一スナップショット)の失敗、バイト点検・重複検査などの補助コマンドの失敗。--feature-flag では加えて runner --help 問い合わせの準備(一時ファイルの作成・プロセスグループでの起動)に失敗した場合(runner_help_probe.preparation_failure。runner の未応答は 6 ではなく warn で継続)。6 のときは検証 OK も違反も返さず(stdout なし)、error 行 1 つ(+ hint)だけを出す"
    idempotency: "参照のみ(設定ファイルを変更しない。入力の複製は TMPDIR 配下の一時ファイルで、終了時に削除する。config_input_rules.snapshot)"

# 比較ツールは外部システム(適用側が用意)。commands には含めず、relay-gate から見た起動契約と終了コード契約だけを書く。
external_interfaces:
  - name: "比較ツール(速報)"
    invoked_by: "rapid-crosscheck-worker.sh"
    launch: "rapid-crosscheck.env の RAPID_COMPARE_COMMAND(1 行の文字列)を shared_rules.compare_command_argv に従って引数の並びに分け、各引数の中でプレースホルダを依頼レコード(rapid_crosscheck_requests)の値へ置換してから、引数の並びをそのまま渡して起動する(文字列をシェルに解釈させない)。`{job_id}`(必須)= job_id、`{run_id}` = run_id、`{params}` = parameters(引数 1 つ全体のときだけ 1 項目 1 引数へ展開)、`{blue_exit_code}` = blue_exit_code、`{green_exit_code}` = green_exit_code(任意)。ファイルパス(成果物 URI)は渡さない(worker は別ネットワークセグメントで動きファイルパスを読めない)"
    stdout_stderr: "依頼レコード(rapid_crosscheck_requests)の stdout / stderr 列へ保存する(成果物ファイルには保存しない)"
    exit_code_contract: "0 = 比較 OK / 3 = 比較 NG(警告終了)/ 6 = 実行エラー / その他の非 0 = 比較ツール実装の契約に従う。relay-gate は値を変換しない(shared_rules.compare_tool_exit_code)"
    result_registration: "別レコードを作らない。exit_code を依頼レコードの exit_code 列に保存し status を SUCCEEDED(0)/ FAILED(非 0)にする。起動自体に失敗した場合は依頼を FAILED / exit_code=6 / error_summary=`launch failed` で終端する"
  - name: "比較ツール(確報)"
    invoked_by: "final-crosscheck-worker.sh"
    launch: "final-crosscheck.env の FINAL_COMPARE_COMMAND(1 行の文字列。プレースホルダ無し)を shared_rules.compare_command_argv に従って引数の並びに分け、その並びをそのまま渡して起動する(置換はしない。文字列をシェルに解釈させない)。ファイルパス(対象カタログ)は渡さない"
    stdout_stderr: "依頼レコード(final_crosscheck_requests)の stdout / stderr 列へ保存する(final-crosscheck-runner.sh が無加工中継する。成果物ファイルには保存しない)"
    exit_code_contract: "速報と同じ(0 / 3 / 6 / その他)。依頼レコードの exit_code に保存し、確報 runner がジョブスケジューラへそのまま返す"
  - name: "SSH(実装スクリプトの実行)"
    invoked_by: "slot runner"
    launch: "`ssh -n {user}@{host} 'cd {work_dir} && {script} {fixed_params...} {params...}'`。credential_ref は参照名のみ(鍵の所在は適用側の SSH 設定)。ジョブマップの host / user が両方無い・両方空の slot は SSH せず、runner のプロセスユーザーでローカルに `cd {work_dir} && {script} {fixed_params...} {params...}` を実行する(execution-spec.json の host / user は null)"
    exit_code_contract: "リモート実装の終了コードを exitcode.txt に保存。SSH 自体の接続・実行失敗は 6(仮採用)"
  - name: "ジョブスケジューラ"
    role: "facade.sh / final-crosscheck-runner.sh / hang-detector.sh / housekeep.sh / background-rerun.sh / worker(--once)/ abort-*(--yes)を同期起動し、stdout / stderr / 終了コードを実行履歴として保管する(監査の正本)。hang-detector.sh の終了コード 3(警告終了)と 6(失敗)、housekeep.sh の 6 を既存のジョブ監視・障害通知の対象にし、運用者へ届ける(relay-gate は CLI の出力以外の通知送信手段を持たない)"

# 管理 DB(RDB)は relay-gate 内部のジョブキュー兼管理 DB(内部データストア)であり、外部システムではない(RDRA 外部システムは上記 5 種: ジョブスケジューラ / 現行実装(blue) / 新実装(green) / 比較ツール / リモート実行ホスト(SSH))。
internal_datastores:
  - name: "ジョブキュー兼管理 DB(RDB)"
    schema: "_cross-cutting/datastore/rdb-schema.yaml"
    used_when: "RAPID_CROSSCHECK_MODE が off 以外(速報系・監視記録・中止の二重マッピング・リラン系譜)。確報系は FINAL_DB_CONN_REF で常に使う。housekeep.sh は HOUSEKEEP_DB_CONN_REF があるとき(RAPID_CROSSCHECK_MODE が off 以外、または確報クロスチェックを使う設置では必須。shared_rules.housekeep_rules.db_requirement)に行の削除だけを行う。off では速報系・監視記録・abort-blue / abort-green・background-rerun --role blue|green は管理 DB に触れず成果物ファイルだけで動く"
    access: "gateway 層の RDB クライアントアダプタ経由。接続情報は参照名(RAPID_DB_CONN_REF / HANG_DB_CONN_REF / FINAL_DB_CONN_REF / HOUSEKEEP_DB_CONN_REF)でのみ扱う。行の削除はハウスキープ専用 DB ロール housekeep_del(HOUSEKEEP_DB_CONN_REF)だけが行い、業務用ロールは削除しない(rdb-schema.yaml db_roles)"

# 設定ファイルの入力の守備範囲(全設定ファイル共通の正本。2026-09-22 に利用者が確定。方針資料に記載の無い新規の決定)
config_input_rules:
  scope: "config_files の全ファイル(CSV 2 ファイル: blue-job-map.csv / green-job-map.csv、env 5 ファイル: feature-flag.env / hang-detector.env / final-crosscheck.env / rapid-crosscheck.env / housekeep.env)を読むすべてのコマンド(validate-config.sh の 5 検証種別 --feature-flag / --job-map / --rapid-crosscheck / --final-crosscheck / --housekeep、facade.sh / slot runner / worker / runner / hang-detector / housekeep / 運用系の起動時読み込み)に適用する。各 UC の tier md は値を複写せず本節を参照する"
  principle: "形式(文字コード UTF-8、改行 LF、1 行目ヘッダー(CSV)、KEY=VALUE(env))の定義から外れた入力は拒否する(検証コマンドは終了コード 2、runner は exitcode.txt=2、その他の読み手は終了コード 2)。形式の内側にある値はそのまま受理する。『警告して受理』の区分は設けない(warn は未知列・未知キー・版の混在・認証情報らしい値など既存の規則にだけ使う)。例外は下表の 2 件(最終行の改行なし、データ行 0 件)"
  rules:
    - topic: "NUL バイト(0x00)"
      handling: "拒否。コメント行にあっても拒否(ファイル全体の形式のため)"
      error: "`error: nul byte is not allowed line=N path: ...`(2)"
    - topic: "UTF-8 として不正なバイト列(過長形式・サロゲート・U+10FFFF 超・孤立した継続バイトを含む)"
      handling: "拒否。コメント行にあっても拒否(文字コードの検査はコメント行を含む)"
      error: "`error: encoding is not utf-8 line=N path: ...`(2)"
    - topic: "BOM(先頭の EF BB BF)"
      handling: "拒否(取り除いて受理しない)"
      error: "`error: byte order mark is not allowed line=1 path: ...`(2)"
    - topic: "CR(0x0D。CRLF 改行・行末の CR・セル内の CR)"
      handling: "拒否(取り除いて受理しない。CR を値の一部として受理もしない)"
      error: "`error: carriage return is not allowed line=N path: ...`(2。該当行ごとに 1 行)+ `hint: use LF line endings`(hint は最後の CR の error 行の次に 1 回だけ)。NUL / UTF-8 / BOM / CR の 4 種類の報告の順・止め方は byte_checks"
    - topic: "最終行の改行なし"
      handling: "受理(例外)。最終行を通常の行として読む"
      error: "なし"
    - topic: "空白だけの行(半角空白・タブだけ)"
      handling: "拒否。空行として無視するのは 0 バイトの行だけ。空白だけの行は 1 セルのデータ行として列数不一致になる(env では KEY=VALUE でない行として拒否。`=` を含んでもキーの前後の空白を除いた結果キーが空になる行(` = ` など)も同じ invalid line。config_input_rules.env_files)"
      error: "CSV: 既存の `error: column count mismatch line=N expected=<n> actual=1`(2)/ env: `error: invalid line line=N path: ...`(2)"
    - topic: "空のファイル・コメントだけのファイル(CSV)"
      handling: "拒否(ヘッダー行が無い)"
      error: "既存の `error: job map header mismatch missing=<全必須列> path: ...`(slot ジョブマップ)/ `error: header mismatch expected=<...> actual= path: ...`(列順固定の CSV)(2)"
    - topic: "データ行 0 件(ヘッダーだけ、またはヘッダーとコメント行だけ)"
      handling: "受理(例外)。導入直後の空のマップは正当。`rows=0`"
      error: "なし"
    - topic: "ヘッダー列名の重複(CSV)"
      handling: "拒否(どちらの列を使うか決められないため)"
      error: "`error: duplicate column column=<name> path: ...`(2。重複した列名ごとに 1 行)"
    - topic: "同じキーの重複(env)"
      handling: "拒否(どちらの値を使うか決められないため。先の行・後の行のどちらの値も採らず、そのファイルの値を使わない)。キーの前後の空白を除いて大文字小文字を区別した完全一致で判定し、値が同じ・値が空・未知キーの行も数える。判定・検査の段・報告の順の正本は config_input_rules.env_files"
      error: "`error: duplicate key key=<KEY> lines=<n1,n2,...> path: ...`(2。重複したキーごとに 1 行。lines= は初出行を含む全行番号を出現順に)"
    - topic: "行・セルの長さの上限"
      handling: "上限なし(値として受理)。処理時間は NFR B.1.1.2 の共通前提(1 ファイル最大 5,000 行)の範囲で保証する"
      error: "なし"
    - topic: "5,000 行を超えるファイル"
      handling: "対象外(拒否しない)。NFR B.1.1.2 / B.2.1.1 の性能保証の範囲外であることを明記するだけ"
      error: "なし"
    - topic: "非 ASCII 文字の値(例: ホスト名の日本語)、空白・カンマを含む fixed_params の要素、Windows 形式のパス(`G:\\scripts`)、相対パス(`./beam-batches`)"
      handling: "値として受理(形式の内側)。方針資料のジョブマップ CSV 例はすべて検証 OK になる。出力の表示も変えない(control_chars でバックスラッシュを置き換えないため)"
      error: "なし"
  byte_checks:
    summary: "第 1 段 = バイト・改行の検査(上表の NUL バイト / UTF-8 として不正なバイト列 / BOM / CR の 4 種類)の報告の規則。CSV(blue-job-map.csv / green-job-map.csv)と env(5 ファイル)の全設定ファイル、validate-config.sh の全検証種別と実行時の全読み手に共通"
    scope_of_report: "第 1 段の違反は最初の 1 件で止めず、ファイル全体を検査してから全件を出す"
    order: "物理行番号の昇順に出す。同じ行に種類の違う違反が複数あれば、上表の順(NUL → UTF-8 → BOM → CR)に 1 種類 1 行ずつ出す。同じ行に同じ種類の違反が何個あってもその種類は 1 行(例: 1 行に CR が 2 個あっても `carriage return is not allowed` は 1 行)。BOM はファイル先頭の 3 バイトだけを対象とし、常に line=1"
    line_number: "行番号は LF(0x0A)だけを区切りとして数えた物理行番号(1 始まり)。CR は区切りにしない(CR を含む行はその CR がある物理行)。コメント行(CSV の行頭 `#`、env の前後の空白を除いて `#` で始まる行)も検査し、行番号を数える"
    hint: "`hint: use LF line endings` は、CR の error 行が 1 行以上あるとき、最後の CR の error 行の直後に 1 回だけ出す(最後の CR の行より後ろの行に別の種類の違反があれば、hint はそれらの error 行より前に出る)"
    stop: "第 1 段の違反が 1 件以上あれば、第 1 段の error 行(と hint)だけを出して止め、以降の検査を行わない(CSV のヘッダー・列名の重複・クォート・列数・行の値・job_id の重複、env の invalid line・duplicate key・キーごとの検査と未知キーの warn)。終了コード 2(runner は exitcode.txt=2)"
    violations: "validate-config.sh の stdout の violations(--rapid-crosscheck / --final-crosscheck / --housekeep)は、第 1 段で止めたとき第 1 段で出した error 行の数とする(hint 行は数えない)"
    example: "1 行目が BOM 付きで CRLF 改行、2 行目に NUL バイトと UTF-8 として不正なバイト列と行末の CR、3 行目に行末の CR、4 行目に NUL バイトがある ff.env では、stderr に `error: byte order mark is not allowed line=1 path: ff.env` / `error: carriage return is not allowed line=1 path: ff.env` / `error: nul byte is not allowed line=2 path: ff.env` / `error: encoding is not utf-8 line=2 path: ff.env` / `error: carriage return is not allowed line=2 path: ff.env` / `error: carriage return is not allowed line=3 path: ff.env` / `hint: use LF line endings` / `error: nul byte is not allowed line=4 path: ff.env` の 8 行をこの順に出し、終了コード 2。同じ内容の rapid-crosscheck.env なら validate-config.sh --rapid-crosscheck の stdout は violations=7"
  snapshot:
    guarantee: "検証結果と実行時の解決結果は、ある 1 時点のファイル内容(単一のスナップショット)だけに基づく。読み込み中にファイルが差し替わっても、旧内容と新内容を混ぜた結果を返さない。差し替えは検知も報告もしない(edit_rule の『一時ファイルへ書いて mv で置き換える』運用と両立する)"
    validate_config: "validate-config.sh は検証開始時に入力を一時ファイルへ 1 回だけ複製し、バイト点検と解析は複製だけを読む。置き場所は環境変数 TMPDIR のディレクトリ(未設定なら `/tmp`)。ファイル名は `relay-gate-` で始まる(mktemp のテンプレート。テストが出現を監視するための識別子)。複製は作業名(最終名 + `.part`)へ書き終えてから最終名へ rename する(同一ディレクトリ内の rename。最終名の `relay-gate-*` が現れた時点で内容は複製済みで、テストはこれを待機条件にできる)。mktemp で作るのは作業名(例 `mktemp \"${TMPDIR:-/tmp}/relay-gate-XXXXXX.part\"`)で、最終名は rename までディレクトリに存在させない(最終名を先に mktemp で確保しない)。権限は所有者だけが読み書きできる 0600(作業名も同じ)。読み込みを終えたら成功・失敗を問わず削除する。HUP / INT / TERM を受けたら複製を削除して終了コード 129 / 130 / 143 で終える。出力(path: / map_path:)には利用者が指定したパスを出し、一時ファイルのパスは出さない。複製には設定ファイルの内容(credential_ref の参照名を含む。認証情報の値は設定に置かれないため入らない)がそのまま入る"
    runtime_readers: "facade.sh / slot runner / worker などの実行時の読み手も同じ保証(1 時点の内容だけで判定)を負う。実現手段は縛らない(ファイルを 1 回だけ open して読み切れば一時ファイルは不要)"
    out_of_scope: "SIGKILL で複製が残り得ること、TMPDIR のディスク満杯、意図的な関数・コマンドの差し替え(PATH の改変等)の**後の結果の正しさ**などの異常環境は守備範囲の対象外とする(仕様として保証しない)。補助コマンドの失敗を検知して終了コード 6 で終えること(internal_failure)自体は守備範囲に含め、テストは PATH の先頭に失敗する代替コマンドを置いて確認してよい"
  internal_failure:
    handling: "検証・読み込みの内部障害は守備範囲に含める。工程で 2 つに切り分ける: (1) 複製の工程(一時ファイルの作成・複製先への書き込み・最終名への rename・置き場所に書き込めない)で起きた失敗は、失敗したコマンド名を問わず『入力の複製の失敗』。(2) 複製完了後の補助コマンド(tr / sed / sort / cat 等。実装が使うもの)の失敗・想定外の出力は『補助コマンドの失敗』。発生時は検証 OK も検証違反も返さず、終了コード 6(runner は exitcode.txt=6)で終える。stdout は出さない。他の error / warn 行も出さない。どの補助コマンドを使うかは実装の自由(runtime_prerequisites.external_commands)で、仕様は特定のコマンドの使用を要求しない"
    errors:
      - "補助コマンドの失敗: `error: internal command failed commands=<name,...> path: ...`(6。commands= は実際に失敗したコマンド名だけ。例 `commands=sort`)"
      - "入力の複製の失敗: `error: config snapshot failed path: ...` + 次行 `hint: check TMPDIR is writable`(6。path は利用者が指定したパス。mktemp の失敗もこちら)"
  env_files: "env 形式(KEY=VALUE、1 行 1 キー、コメント行と空行は無視)にも上表のバイト・改行の規則(NUL / UTF-8 / BOM / CR の拒否、最終行の改行なしの受理)を同じ文言・終了コードで適用する(コメント行にも適用する)。コメント行の定義: 行の前後の空白(半角空白とタブ)を除いた結果が `#` で始まる行はコメント行とし、キーと値を取り出さない。この判定は下記 (1) の `=` での分割より先に行い、コメント行の中に `=` があってもコメント行のまま。例: `# x` / `  # x`(先頭が半角空白)/ タブ + `# x` / `  # A=B` はいずれもコメント行。前後の空白を除いた結果が空になる行(空白だけの行)はコメント行ではなく、下記の invalid line のまま。`KEY=#abc` は前後の空白を除いた結果が `#` で始まらないためコメント行ではなく、キー KEY・値 `#abc`(値の先頭の `#` もそのまま値に残す。行の途中の `#` を行末コメントとして扱う規則は無い)。空行として無視するのは 0 バイトの行だけ。`=` を含まない非空・非コメント行(空白だけの行を含む)は `error: invalid line line=N path: ...`(2)。キーと値の取り出し方(次の順序で 1 回ずつ行う): (1) 行を最初の `=` でキーと値に分ける(値の中の `=` はそのまま値に残る)。(2) キーの前後の空白を除く。キーの前後の空白を除いた結果キーが空になる行は `error: invalid line line=N path: ...`(2)とし、(3) 以降へ進まない(例: ` =abc` / `=abc` / ` = ` はいずれも invalid line)。(3) 値の前後の空白を除く。(4) 値の先頭末尾の引用符を外す: 先頭の 1 文字が `\"` か `'` ならその 1 文字を外し、それとは別に(先頭を外した後の)末尾の 1 文字が `\"` か `'` ならその 1 文字を外す。先頭と末尾の引用符の種類の一致や、対になっていることは求めない。引用符の内側の空白は残す。ここでいう空白は半角空白(0x20)とタブ(0x09)だけ。CR は上表のバイト検査(CR の拒否)で拒否するため値に残らない。例: `KEY= \"abc\" ` → キー KEY・値 `abc`、` KEY = 'a b' ` → キー KEY・値 `a b`、`KEY=\"  a  \"` → 値 `  a  `、`KEY=a=b` → 値 `a=b`、`\"abc\"` → `abc`、`\"abc` → `abc`、`abc'` → `abc`、`\"abc'` → `abc`(最後の 4 つは値の部分だけを示す)。`=` の無い行とコメント行の扱いは上記のとおりで、各設定ファイルの契約は独自の規則を持たない。コメント行の定義とこの取り出し方は env 形式の全設定ファイル(feature-flag.env / rapid-crosscheck.env / hang-detector.env / final-crosscheck.env / housekeep.env)に共通で、shared_rules.compare_command_argv.split が分ける前の値も同じ規則で取り出す(split は同じ文を再掲する。変えるときは同時に直す)。同じキーの重複: コメント行・0 バイトの空行・invalid line を除いた行について、取り出し方 (2) でキーの前後の空白を除いた結果が同じキーになる行が 2 行以上あれば設定エラー `error: duplicate key key=<KEY> lines=<n1,n2,...> path: ...`(2)とし、そのファイルの値を 1 つも使わない(先の行・後の行のどちらの値も採らない)。キーの比較は大文字小文字を区別した完全一致(例: `BLUE_MODE` と ` BLUE_MODE `(キーの前後に空白)は同じキーで重複、`BLUE_MODE` と `blue_mode` は別のキーで重複ではない)。値が同じ行(例: `BLUE_MODE=off` が 2 行)、値が空の行(例: `BLUE_MODE=`)、各設定ファイルの契約で未知キー(warn)になるキーの行、その読み手が使わないキーの行も数える(判定はファイル全体の全キーに対して行う。読み手が一部のキーだけを読む場合も同じで、読み手によって結果を変えない)。key= には (2) で前後の空白を除いたキーを conventions.output_format.control_chars の可視表記で出す(warn: unknown key の key= と同じ)。lines= の規則は slot ジョブマップの重複 job_id(commands の validate-config.sh の stderr の重複キーの項)と同じ: そのキーが現れた全行の物理行番号を、初出行を含めて出現順(昇順)にカンマ区切り・空白なしで並べ、重複したキー 1 つにつき error 行は 1 行。例: 2 行目と 5 行目に BLUE_MODE があれば `error: duplicate key key=BLUE_MODE lines=2,5 path: ff.env`、2・3・4 行目にあれば `lines=2,3,4`(初出行を省かない)。検査の段と報告の順(1 つの env ファイルについて。validate-config.sh と実行時の読み手で同じ): (i) バイト・改行の検査(上表の NUL / UTF-8 / BOM / CR)。違反があれば byte_checks の規則(ファイル内の全件を行番号の昇順、同じ行は NUL → UTF-8 → BOM → CR の順、hint は最後の CR の error 行の次に 1 回)で error 行(と hint)だけを出して止め、(ii) 以降を行わない。(ii) 行の構造の検査。全行を見てから、invalid line を行番号の昇順に全件出し、続けて duplicate key を重複したキーの初出行の昇順に全件出す。(ii) の違反が 1 件以上あれば、そのファイルの値を使わず、(iii) を行わない(終了コード 2)。(iii) 各設定ファイルの契約のキーごとの検査(必須キーの欠落・空、enum、絶対パス・実行可能、`FINAL_` で始まるキー、保持日数、プレースホルダ、foreground の組合せなど)と未知キーの warn(未知キーの warn を出す時点と出さない回、検査するキーの範囲を各設定ファイルの契約または読み手のコマンドの契約が別に決めているときはそれに従う。feature-flag.env を一部のキーだけ読む読み手の検査の範囲は config_files の feature-flag.env の reader_scope。hang-detector.env は shared_rules.hang_alert.unknown_key_warn で、走査を始めるときに出し、(iii) の設定エラーで止まる回は出さない)。例: 1 行目 `BLUE_MODE=foreground`、2 行目 `GREEN_MODE=background`、3 行目 `BLUE_MODE`、4 行目 `BLUE_MODE=off`、5 行目 `GREEN_MODE=background` の ff.env では、stderr に `error: invalid line line=3 path: ff.env`、`error: duplicate key key=BLUE_MODE lines=1,4 path: ff.env`、`error: duplicate key key=GREEN_MODE lines=2,5 path: ff.env` の 3 行をこの順に出して終了コード 2 (3 行目は invalid line でキーを持たないため BLUE_MODE の重複に数えない。(iii) を行わないため option required などの error 行は出ない)。validate-config.sh の stdout: --feature-flag は検証 OK のときだけ出す既存の規則のまま(出さない)。--rapid-crosscheck / --final-crosscheck / --housekeep は (i) または (ii) で止まったときも固定順の行を出し、値から決まる行(command_path / has_job_id_placeholder / retention_days)は `-`、status=invalid、violations=<その段で出した error 行の数(hint 行は数えない)>とする。実行時の読み手(facade.sh / background-rerun.sh / 各 worker / hang-detector.sh / housekeep.sh / 運用系コマンドなど)は (i) と (ii) の error 行(と (i) の hint)を validate-config.sh と同じ順・同じ件数で各コマンドの既存の error 出力先へ出し、そのファイルの値に依存する処理を行わず、各コマンドの入力・設定エラーの終了コード(2)で終える。validate-config.sh の --verbose の info 行(--feature-flag / --rapid-crosscheck / --final-crosscheck / --housekeep の env 形式の 4 検証種別に、同じ規則を同じ書き方で適用する。2026-11-10 利用者決定。--feature-flag は 2026-11-11 に同じ規則へそろえると利用者が決定): (a) 文言: 読み取ったキーごとに 1 行 `info: key loaded key=<KEY> path: <path>`。対象のキーは、コメント行と 0 バイトの空行を除く全行のキーで、未知キー・値が空のキー・その検証種別が検査しないキー(例: rapid-crosscheck.env の RAPID_DB_CONN_REF)も含む((ii) を通ったファイルでは同じキーは 1 行だけのため、1 キー 1 行)。key= には取り出し方 (2) で前後の空白を除いたキーを、path: には利用者が指定したパス(入力の複製の一時ファイルのパスではない)を、どちらも conventions.output_format.control_chars の可視表記で出す(warn: unknown key の key= / path: と同じ)。値は出さない。(b) 出す回: (iii) へ進んだ回だけ出す。(i) で止めた回と (ii) で止めた回は info 行を出さず、止めた段の error 行(と (i) の hint)だけを出す(値を使わない回に、キーを読み込んだと示さないため)。ファイルが無い・読めない回(error 1 行)と、検証器の内部障害の回(internal_failure。終了コード 6)も出さない。--feature-flag の runner --help 問い合わせの準備失敗(runner_help_probe.preparation_failure。終了コード 6)の回も、その error 行だけを出し、info 行を出さない。(c) (iii) の中の順: info 行をすべて(キーがファイルに初めて出た順 = 物理行番号の昇順)→ 未知キーの warn 行をすべて(同じ順)→ キーごとの検査の error 行(と hint。error 行どうしの順は各検証種別の契約のとおり。--rapid-crosscheck は UC「クロスチェックのジョブマップと比較定義を定義する」の検証ルールの表の順)。--feature-flag では、キーごとの検査の error 行に組合せ検証・`FINAL_` で始まるキー・対応ジョブマップの error 行を含み、runner --help 問い合わせ(runner_help_probe。キーごとの検査のあとに blue → green の順で行う)の `warn: runner does not respond ...` 行はそのあとに出す。info 行と warn 行は終了コードと violations に数えず、stdout を変えない。--verbose が無いときは info 行だけが無くなり、ほかの行とその順は変わらない。(d) この規則は validate-config.sh の上記 4 検証種別の --verbose のもの。実行時の読み手の --verbose の info 行は各コマンドの契約のとおり。例 1: 1 行目 `ZZ=x`、2 行目 `RAPID_COMPARE_COMMAND=relative`、3 行目 `AA=x` の rc.env を `validate-config.sh --rapid-crosscheck rc.env --verbose` で検証すると、stderr に `info: key loaded key=ZZ path: rc.env` / `info: key loaded key=RAPID_COMPARE_COMMAND path: rc.env` / `info: key loaded key=AA path: rc.env` / `warn: unknown key key=ZZ path: rc.env` / `warn: unknown key key=AA path: rc.env` / `error: path is not absolute key=RAPID_COMPARE_COMMAND path=relative` / `error: placeholder {job_id} is missing key=RAPID_COMPARE_COMMAND value=relative` の 7 行をこの順に出し、終了コード 2(stdout は violations=2)。例 2: 1 行目 `ZZ=x`、2 行目 `broken`、3 行目に正しい RAPID_COMPARE_COMMAND を置いた rc.env を同じく --verbose で検証すると、stderr は `error: invalid line line=2 path: rc.env` の 1 行だけで、終了コード 2(stdout は command_path: - / has_job_id_placeholder=- / violations=1)。例 3: 1 行目 `ZZ=x`、2 行目 `BLUE_MODE=off`、3 行目 `GREEN_MODE=off`、4 行目 `RAPID_CROSSCHECK_MODE=off` の ff.env を `validate-config.sh --feature-flag ff.env --verbose` で検証すると、stderr に `info: key loaded key=ZZ path: ff.env` / `info: key loaded key=BLUE_MODE path: ff.env` / `info: key loaded key=GREEN_MODE path: ff.env` / `info: key loaded key=RAPID_CROSSCHECK_MODE path: ff.env` / `warn: unknown key key=ZZ path: ff.env` / `error: foreground slot must be exactly one blue_mode=off green_mode=off` の 6 行をこの順に出し、終了コード 2(stdout は 0 行)。こうして、この 4 検証種別の --verbose は、どの入力・状態の組み合わせでも標準エラーの行数と内容を 1 つに決める"

config_files:
  - file: "feature-flag.env"
    path: "$RELAY_GATE_CONFIG_DIR/feature-flag.env"
    format: "env(KEY=VALUE、1 行 1 キー。コメント行可(前後の空白を除いて `#` で始まる行。定義は config_input_rules(env_files))。入力の守備範囲は config_input_rules(env_files))"
    owner: "基盤適用設計者(設定所有区分: feature flag)"
    defined_in_uc: "適用構成業務/適用構成定義フロー/feature flag を設定する"
    readers: ["facade.sh(全キー。runner へは環境変数で渡す。slot runner は読まない)", "background-rerun.sh(RAPID_CROSSCHECK_MODE / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER)", "hang-detector.sh(RAPID_CROSSCHECK_MODE のみ)", "housekeep.sh(RAPID_CROSSCHECK_MODE のみ。HOUSEKEEP_DB_CONN_REF の要否の判定に使う。shared_rules.housekeep_rules.db_requirement)", "rapid-crosscheck-worker.sh / rapid-crosscheck-result.sh / run-lineage.sh / hang-detect-trend.sh / abort-blue.sh / abort-green.sh / abort-rapid-crosscheck.sh(RAPID_CROSSCHECK_MODE のみ。abort-final-crosscheck.sh と確報系は読まない)", "validate-config.sh --feature-flag"]
    reader_scope: "読み手ごとの検査の範囲。facade.sh・background-rerun.sh・validate-config.sh --feature-flag は validation_rules / error_messages のとおりに検査する(未知キーの warn、`FINAL_` で始まるキーの error を含む。従来どおり)。readers で『RAPID_CROSSCHECK_MODE のみ』とある読み手(hang-detector.sh / housekeep.sh / rapid-crosscheck-worker.sh / rapid-crosscheck-result.sh / run-lineage.sh / hang-detect-trend.sh / abort-blue.sh / abort-green.sh / abort-rapid-crosscheck.sh)は、存在・読み取り・入力の守備範囲(config_input_rules.env_files の (i)(ii)。同じキーの重複を含み、読み手によって結果を変えない)と RAPID_CROSSCHECK_MODE(扱いは各コマンドの契約のとおり)だけを検査し、他のキーの欠落・値、未知キー、`FINAL_` で始まるキーは検査せず、warn も error も出さない(2026-11-05。各コマンドの stderr の `warn: unknown key` はそのコマンド自身の設定ファイルのもので、feature-flag.env のものではない)"
    keys:
      - name: "BLUE_MODE"
        type: "enum"
        enum: ["foreground", "background", "off"]
        required: true
        description: "blue slot の実行モード"
      - name: "GREEN_MODE"
        type: "enum"
        enum: ["foreground", "background", "off"]
        required: true
        description: "green slot の実行モード"
      - name: "RAPID_CROSSCHECK_MODE"
        type: "enum"
        enum: ["foreground", "background", "off"]
        required: true
        description: "速報クロスチェックの制御。foreground / background は slot runner が完了通知を送信し速報管理 DB へ書き込む(両値の挙動は RDRA / USDM が定める範囲で同じ。判定はすべて「off か off 以外か」)。off は完了通知を送信せず速報管理 DB へ接続も書込みもしない(parallel_runs / slot_executions / rapid_runs を作らず成果物だけで動く)"
      - name: "BLUE_IMPL"
        type: "string(非空)"
        required: "BLUE_MODE が off でないとき Yes"
        description: "blue の実装版。execution-spec.json の slots.blue.impl_version の出所(facade が環境変数 BLUE_IMPL で runner へ渡す)"
      - name: "GREEN_IMPL"
        type: "string(非空)"
        required: "GREEN_MODE が off でないとき Yes"
        description: "green の実装版。slots.green.impl_version の出所(環境変数 GREEN_IMPL)"
      - name: "BLUE_RUNNER"
        type: "string(absolute path)"
        required: "BLUE_MODE が off でないとき Yes"
        description: "blue slot runner 実体の絶対パス。存在・実行可能"
      - name: "GREEN_RUNNER"
        type: "string(absolute path)"
        required: "GREEN_MODE が off でないとき Yes"
        description: "green slot runner 実体の絶対パス。存在・実行可能"
      - name: "RAPID_CROSSCHECK_RUNNER"
        type: "string(absolute path)"
        required: "RAPID_CROSSCHECK_MODE が off でないとき Yes"
        description: "slot runner が完了通知(blue-completed / green-completed)を送る速報クロスチェック runner の実体パス。存在・実行可能(facade / background-rerun が環境変数 RAPID_CROSSCHECK_RUNNER で runner へ渡す。$RELAY_GATE_HOME 配下の固定パス解決はしない)"
      - name: "RAPID_CROSSCHECK_WORKER"
        type: "string(absolute path)"
        required: "RAPID_CROSSCHECK_MODE が off でないとき Yes"
        description: "速報クロスチェック worker の実体パス(ジョブスケジューラの worker ジョブ定義 / 常駐起動が参照する実体)。存在・実行可能"
    validation_rules:
      - "mode の組合せ: foreground はちょうど 1 slot(両 foreground / foreground 無しは違反)"
      - "確報の制御キーは置かない(あれば違反。確報はジョブ定義と final-crosscheck.env で制御する)。確報の制御キーの範囲は『キー名が `FINAL_` で始まるすべてのキー』(判定は接頭辞。キー名の列挙ではない。大文字小文字を区別する)。`FINAL_CROSSCHECK_MODE` のような制御キーも、final-crosscheck.env のキー(FINAL_DB_CONN_REF / FINAL_POLL_INTERVAL_SEC / FINAL_POLL_LIMIT_SEC / FINAL_LEASE_MINUTES / FINAL_WORKER_POLL_INTERVAL_SEC)を feature-flag.env に誤って置いた場合も同じ違反(終了コード 2)。`FINAL_` で始まるキーは未知キー(warn)として扱わない。この範囲の正本は本項で、UC「feature flag を設定する」の spec.md / tier-facade.md はここと同じ表記(`FINAL_` で始まるキー)を使う"
      - "未知キーは warn(上記 9 キーは未知キーではない。`FINAL_` で始まるキーは未知キーではなく上記の違反。上記 9 キー以外に必須キーは無い。設定版 CONFIG_VERSION は持たない)"
      - "off でない slot の <SLOT>_IMPL は非空、<SLOT>_RUNNER は絶対パスかつ存在・実行可能。RAPID_CROSSCHECK_MODE が off 以外なら RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER も同じ"
      - "off でない slot の <slot>-job-map.csv が存在し読める(無ければ違反)"
      - "上記の検査はキーごとの検査で、invalid line と同じキーの重複(入力の守備範囲。config_input_rules.env_files)が 1 件も無いときだけ行う。同じキーが 2 行以上あれば `error: duplicate key key=<KEY> lines=<n1,n2,...> path: ...`(2)で、どちらの行の値も使わない(facade.sh の起動時検証も同じ)"
    error_messages:
      - "必須キー欠落・空: `error: option required option=<KEY> path: ...`(2)"
      - "enum 外: `error: invalid value key=<KEY> value=...`(2)。KEY が RAPID_CROSSCHECK_MODE / BLUE_MODE / GREEN_MODE のときは次行に `hint: use foreground, background or off` を続ける"
      - "絶対パスでない: `error: path is not absolute key=<KEY> path=...`(2)"
      - "実体が無い・実行不可: `error: file not executable key=<KEY> path=...`(2)"
      - "foreground 重複・無し: `error: foreground slot must be exactly one blue_mode=... green_mode=...`(2)"
      - "確報制御キーあり(キー名が `FINAL_` で始まる。validation_rules): `error: final crosscheck key is not allowed key=<KEY>`(2。該当キーごとに 1 行。同じキーに `warn: unknown key` は出さない)"
      - "job map 実体無し: `error: job map not found slot=<blue|green> map=<path>`(2)"
      - "未知キー: `warn: unknown key key=<KEY> path: ...`(継続)"
    derived: |-
      operation_mode = (BLUE_MODE, GREEN_MODE, RAPID_CROSSCHECK_MODE) の組合せから導出した運用モードの英字コード(RDRA バリエーション「運用モード」との対応):
      - `parallel` = 並行稼働(blue foreground / green background / 速報 background)
      - `green_only` = 新実装の単独本番(blue off / green foreground / 速報 off)
      - `next_gen_parallel` = 次世代実装との並行稼働(blue background / green foreground / 速報 background)
      - `custom` = その他(上記 3 組合せ以外)
      出力に現れる値は英字コードのみ(日本語名は出さない)。validate-config.sh --feature-flag の stdout(operation_mode=)と facade.sh の実行ログ `INFO feature flag loaded ... operation_mode=...` 行に現れる(stderr / 管理 DB には出さない)
  - file: "<slot>-job-map.csv(blue-job-map.csv / green-job-map.csv)"
    path: "$RELAY_GATE_CONFIG_DIR/<role>-job-map.csv"
    format: "CSV(1 行目ヘッダー、1 行 1 job_id。行頭 `#` の行はコメント。文字コード UTF-8、改行コード LF。セル内に改行は置けない。csv_rules 参照。バイト・行・構造の異常の扱い、読み込み中の差し替えに対する保証、検証器の内部障害は config_input_rules が正本)"
    owner: "基盤適用設計者(設定所有区分: slot ジョブマップ)"
    defined_in_uc: "適用構成業務/適用構成定義フロー/slot ごとのジョブマップを定義する"
    readers: ["slot runner(--execution-spec 無しの通常起動)", "validate-config.sh --job-map / --feature-flag"]
    csv_rules:
      - "セルはカンマ区切り。セルは二重引用符で囲める(囲まない場合はカンマ・二重引用符を含められない)。囲んだセル内の二重引用符は `\"\"` と二重化する"
      - "fixed_params は JSON 配列文字列を格納するセルで、必ず二重引用符で囲む(例: `\"[\"\"p1\"\",\"\"p2 p3\"\"]\"` → 固定引数 `p1` と `p2 p3` の 2 要素。空は `\"[]\"` または `[]`)"
      - "bash 単独(外部 CSV パーサ非依存)で 1 文字ずつ状態機械で解析できる範囲に限定する(ネスト・複数行セル不可)。違反は `error: csv quote is invalid line=N path: ...`(2)。これは形式の制約で、行単位の外部コマンド利用(候補行の絞り込みや重複検査)を禁じない(conventions.runtime_prerequisites.external_commands)"
      - "セルの値に含まれる制御文字(タブ・ESC 等。改行と CR と NUL は形式の違反)は値の一部として受理する。出力するときは conventions.output_format.control_chars の可視表記にする"
    column_matching: "列はヘッダー名で対応付ける(順序は job_id,host,user,work_dir,script,fixed_params,hang_detect_limit_minutes[,credential_ref][,map_version] を推奨するが検証は名前で行う)。必須列 5: job_id / work_dir / script / fixed_params / hang_detect_limit_minutes。任意列: host / user(両方あるか両方無いか。両方無い、または両方の値が空 = ローカル実行。片方だけある = `error: job map header mismatch missing=<host|user> path: ...`、片方だけ空 = `error: host is empty ...` / `error: user is empty ...`)、credential_ref / map_version(末尾の任意列。ヘッダーに無ければ無いものとして扱い、値が空も可)。未知列(impl_version を含む)は `warn: unknown column column=<name> path: ...`。必須列の欠落は `error: job map header mismatch missing=<col,...> path: ...`(2)"
    columns:
      - name: "job_id"
        type: "string"
        required: true
        description: "英数字・_・- のみ。ファイル内で一意。重複は `error: duplicate job_id job_id=<v> lines=<n1,n2,...>`(2。lines= は初出行を含む全行番号を出現順に。規則は commands の validate-config.sh の stderr)"
      - name: "host"
        type: "string"
        required: false
        description: "実行ホスト。列が無い・値が空(user も空)ならローカル実行(SSH しない)。execution-spec.json では null"
      - name: "user"
        type: "string"
        required: false
        description: "実行 OS ユーザー。列が無い・値が空(host も空)ならローカル実行(runner のプロセスユーザー)。execution-spec.json では null"
      - name: "work_dir"
        type: "string(非空)"
        required: true
        description: "作業ディレクトリ(実行先側のパス。リモートまたはローカル)。空でなければ受理し、パスの形式は検査しない: Linux 形式(`/var/app/work`)/ Windows 形式(`G:\\scripts`。ドライブ文字 + バックスラッシュ)/ 相対パス(`./beam-batches`。実行先のカレントディレクトリ基準)のどれでもよい。理由: ジョブマップは Windows / Linux 両対応のフルパス / 相対パス指定を受け取れる必要がある(利用者決定 2026-09-22。方針資料のジョブマップ例は `G:\\scripts` と `./beam-batches`)。relay-gate はパスを解釈も正規化もせず、実行先へそのまま渡す(存在確認もしない)。空は `error: work_dir is empty line=N job_id=... value=`(2)"
      - name: "script"
        type: "string(非空)"
        required: true
        description: "実装スクリプトのパス(実行先側。リモートまたはローカル)。work_dir と同じく空でなければ受理し、形式(絶対 / 相対 / Windows 形式)は検査しない。実行先の OS・シェルが解釈する。空は `error: script is empty line=N job_id=... value=`(2)"
      - name: "fixed_params"
        type: "string(JSON array of strings)"
        required: true
        description: "固定引数。JSON 配列文字列(要素は string のみ)。空は `[]`。セルは二重引用符で囲む(csv_rules)。解析結果を execution-spec.json の slots.<role>.fixed_params に保存"
      - name: "hang_detect_limit_minutes"
        type: "integer(>=0)"
        required: true
        description: "ハング疑い上限(分)。0 は監視対象外。運用者の調整記録(調整日時・調整根拠となる警告時経過時間)は適用構成文書またはそのコミット履歴に置き、この列には持たない"
      - name: "credential_ref"
        type: "string"
        required: false
        description: "末尾の任意列。認証情報の参照名(値は置かない)。列が無い・空なら execution-spec.json では null"
        format: "参照名 `^[A-Za-z0-9_.-]*$`(空も可)"
        on_format_violation: "正規表現に合わない値(`/` を含む、空白・記号・非 ASCII 文字を含む等、理由を問わない)と `BEGIN` を含む値は、すべて同じ `warn: credential_ref looks like a secret or path line=N job_id=<v>` を 1 行出して受理する(拒否しない。終了コードに影響しない。1 行に複数の理由が重なっても warn は 1 行)。理由: 参照名の形式は適用側の認証情報ストアの運用に依存するため、relay-gate 側で拒否しない(2026-09-22 に利用者が確定)。warn は秘密やパスの混入に気づかせるためのもので、参照名として解決できるかは検査しない。受理した値は、正規の参照名と同じく execution-spec.json の slots.<role>.credential_ref へそのまま転記される(転記規則は変えない)。ジョブマップに認証情報の値そのもの(鍵の中身・パスワード等)を置かないのは適用側の責任で、warn はその見落としに気づかせる唯一の検査である"
        output_rule: "credential_ref の値(参照名そのもの)は診断行に一切出さない。対象は validate-config.sh の stdout と stderr(error: / warn: / info:(--verbose を含む)/ hint:。validate-config.sh は実行ログを持たない)と、ジョブマップを読む slot runner の stderr と実行ログ(execution_log)。warn も含め value= を付けず、位置は line=N と job_id=<v> で示す(conventions.credentials と同じ規則)。execution-spec.json への転記は診断行ではない"
      - name: "map_version"
        type: "string"
        required: false
        description: "末尾の任意列。マップ版(execution-spec.json の slots.<role>.map_version に転記。列が無い・空なら null。validate-config.sh --job-map では `map_version=-`)。実装版(impl_version)の列は無い(実装版は feature-flag.env の BLUE_IMPL / GREEN_IMPL)"
    edit_rule: "一時ファイルへ書いて mv で置き換える(編集途中を runner が読まないため。運用ガイド)。読み手側は config_input_rules.snapshot の保証(1 時点の内容だけで判定)で置き換えと両立する"
  - file: "hang-detector.env"
    path: "$RELAY_GATE_CONFIG_DIR/hang-detector.env"
    format: "env(入力の守備範囲は config_input_rules(env_files))"
    owner: "基盤適用設計者(設定所有区分: ハング検知定期ジョブ設定。RDRA 情報「ハング検知定期ジョブ設定」)"
    defined_in_uc: "実行監視業務/background 実行監視フロー/background 実行の経過時間と終了状態を判定する / ハング疑い・実行エラー・比較異常を通知する"
    readers: ["hang-detector.sh"]
    note: "異常はハング検知ジョブ自身の終了コードと標準エラーの alert 行で知らせるため、通知の宛先・送信コマンド・件名などの項目は持たない(SPEC-008-06)。中身の検査(キーの許可・必須の判定・値の形・行の形)は hang-detector.sh が起動時の走査前の検査で行う(commands の hang-detector.sh。validate-config.sh に hang-detector.env の検証種別は無い)。構築手順の配置時の検査はファイルがあることの確認だけで、中身の検査はこの契約に任せる(インフラ設計)。未知のキーは `warn: unknown key key=<KEY> path: ...`(継続。出す時点・順・出さない回は shared_rules.hang_alert.unknown_key_warn)"
    keys:
      - name: "HANG_DB_CONN_REF"
        type: "string"
        required: "RAPID_CROSSCHECK_MODE が off でないとき Yes"
        description: "管理 DB 接続情報の参照名(値は置かない)。監視記録の保存と速報比較依頼の走査に使う。解決先は他の *_DB_CONN_REF と同じ 1 つの管理 DB(conventions.credentials)"
      - name: "RAPID_HANG_DETECT_LIMIT_MINUTES"
        type: "integer(>=1)"
        required: false
        default: 60
        description: "速報比較依頼(role=rapid-crosscheck)のハング疑い上限(運用チューニング値)。キーがあれば値は正の整数 `^[1-9][0-9]{0,8}$`。違反は hang-detector.sh の走査前の設定エラー `error: invalid value key=RAPID_HANG_DETECT_LIMIT_MINUTES value=... path: ...` + `hint: use a positive integer`(2。commands の hang-detector.sh)"
      - name: "HANG_SCAN_WINDOW_HOURS"
        type: "integer(>=1)"
        required: false
        default: 72
        description: "started-at.txt がこの時間より古い run は走査しない(監視記録が未終端の run は窓外でも走査。off では通知済みの印の中身が HANG_SUSPECTED_NOTIFIED の run を窓外でも走査する(shared_rules.hang_alert.notified_mark.scan_window)。運用チューニング値)。キーがあれば値は正の整数 `^[1-9][0-9]{0,8}$`。違反は hang-detector.sh の走査前の設定エラー `error: invalid value key=HANG_SCAN_WINDOW_HOURS value=... path: ...` + `hint: use a positive integer`(2)"
  - file: "final-crosscheck.env"
    path: "$RELAY_GATE_CONFIG_DIR/final-crosscheck.env"
    format: "env(入力の守備範囲は config_input_rules(env_files))"
    owner: "基盤適用設計者(設定所有区分: 確報クロスチェック worker 設定。FINAL_COMPARE_COMMAND の設定・検証)/ 運用者(接続・polling の運用チューニング値。仮採用: _inference.md #6)"
    defined_in_uc: "クロスチェック業務/確報クロスチェックフロー/比較ツールで日次全量比較を実行して結果を保存する(FINAL_COMPARE_COMMAND の設定と validate-config.sh --final-crosscheck 検証)/ 確報比較依頼を登録して終端状態まで待機する / 確報比較依頼を claim する"
    readers:
      - "final-crosscheck-runner.sh(実行ホスト。必須 FINAL_DB_CONN_REF、任意 FINAL_POLL_INTERVAL_SEC / FINAL_POLL_LIMIT_SEC。FINAL_COMPARE_COMMAND / FINAL_LEASE_MINUTES / FINAL_WORKER_POLL_INTERVAL_SEC は読まず、欠落も値も検査しない)"
      - "final-crosscheck-worker.sh(DB セグメント。必須 FINAL_DB_CONN_REF / FINAL_COMPARE_COMMAND(起動する)、任意 FINAL_LEASE_MINUTES / FINAL_WORKER_POLL_INTERVAL_SEC。FINAL_POLL_INTERVAL_SEC / FINAL_POLL_LIMIT_SEC は読まず、値も検査しない)"
      - "abort-final-crosscheck.sh(FINAL_DB_CONN_REF のみ)"
      - "housekeep.sh(FINAL_DB_CONN_REF の有無のみ。RAPID_CROSSCHECK_MODE=off で HOUSEKEEP_DB_CONN_REF が無い・空のときだけ読み、確報クロスチェックを使う設置かの判定に使う。接続には使わず、値を出力しない。判定は abort-final-crosscheck.sh の管理 DB なしの判定と同じ。shared_rules.housekeep_rules.db_requirement)"
      - "validate-config.sh --final-crosscheck(FINAL_COMPARE_COMMAND の検証。worker が読む置き場のファイルを、worker が動くホストで検証する)"
    on_missing: "ファイルが無い、または FINAL_DB_CONN_REF が無い・空の設置を『確報クロスチェックを使わない設置』とする(判定の正本は commands の abort-final-crosscheck.sh と shared_rules.housekeep_rules.db_requirement)。abort-final-crosscheck.sh は `error: management db is not configured run_id=...`(3)、housekeep.sh は確報の管理 DB の要否に数えない。final-crosscheck-runner.sh / final-crosscheck-worker.sh は `error: config file not found path: ...` / `error: option required option=<KEY> path: ...`(2)。確報を使わない設置では確報クロスチェックジョブ定義と worker を登録しない"
    note: "各読み手は自分のホストの置き場($RELAY_GATE_CONFIG_DIR/final-crosscheck.env)にあるファイルだけを読む。runner(実行ホスト)と worker(DB セグメント)はそれぞれ自分の置き場のファイルを読み、他方のファイルを読まない。どちらの置き場のファイルも構築手順が配置し、確報を使わない設置では両方に置かない(前提: 全ホストが構築手順でデプロイされている。2026-11-04 利用者決定)。配置先のファイル名はどちらも $RELAY_GATE_CONFIG_DIR/final-crosscheck.env だが、中身は置き場ごとに違う(2026-11-05 のインフラ設計): 実行ホストの置き場のファイルは FINAL_DB_CONN_REF(必須)と FINAL_POLL_INTERVAL_SEC / FINAL_POLL_LIMIT_SEC(任意)だけを持ち、FINAL_COMPARE_COMMAND / FINAL_LEASE_MINUTES / FINAL_WORKER_POLL_INTERVAL_SEC を置かない。DB セグメントの置き場のファイルは FINAL_DB_CONN_REF / FINAL_COMPARE_COMMAND(必須)と FINAL_LEASE_MINUTES / FINAL_WORKER_POLL_INTERVAL_SEC(任意)を持つ。どちらの読み手も自分が使うキーだけを読むため(readers)、この分け方で起動時の検査は通る。abort-final-crosscheck.sh と housekeep.sh は動くホストの置き場のファイルの FINAL_DB_CONN_REF だけを使い、どちらの置き場のファイルにも FINAL_DB_CONN_REF がある。2 つの置き場の FINAL_DB_CONN_REF は、参照名の文字列が違ってもよいが、同じ 1 つの管理 DB に解決されること(runner が登録した依頼を worker が同じキューから取得するため。前提・確かめる人・relay-gate が検査しないことの正本は conventions.credentials)。実行ホストの置き場のファイルに FINAL_COMPARE_COMMAND などの worker のキーが残っていても、runner はそれを読まず、エラーにも warn にもしない(未知キーではない)。validate-config.sh --final-crosscheck は DB セグメントで、DB セグメントの置き場のファイルを検証する。relay-gate の処理の中からは設定ファイルを配らない。確報の比較ツール起動コマンドは worker 側のファイルの FINAL_COMPARE_COMMAND だけが持ち、確報比較依頼(final_crosscheck_requests)には載せない。変えるときは構築手順で配り直す。構築手順の配置時の検査はファイルがあることの確認だけで、中身の検査(必須キーの欠落・空、値の形)はこの契約(validate-config.sh --final-crosscheck と各読み手の起動時の検査)が持つ(インフラ設計)。読み手は自分が使うキーだけを必須の判定と値の検査の対象にする(readers)。同じキーの重複は config_input_rules.env_files のとおりファイル全体の全キーで判定する。起動時の検査の順: (1) ファイルの存在(不在は `error: config file not found path: ...`)・読み取り(読めないときは `error: config file is not readable path: ...`) → (2) 入力の守備範囲(config_input_rules.env_files の (i)(ii)。違反があればその段の error 行を env_files の規則どおり全件(と (i) の hint)出して止める) → (3) 自分が使う必須キーの欠落・空(キー表の順) → (4) 自分が使う任意キーの値(キー表の順)。(1)(3)(4) は最初の違反の error 行(と hint)1 件だけを出して止める。どの段で止まっても終了コード 2 で、管理 DB には接続しない。実行時の読み手は、未知キー(キー表に無いキー)を検査せず warn も出さない(validate-config.sh の検証種別は、validate-config.sh の stderr 規約どおり `warn: unknown key key=<KEY> path: ...` を出して継続する)。他の読み手が使うキー(例: runner から見た FINAL_LEASE_MINUTES)は未知キーではなく、値を検査しないだけ"
    keys:
      - name: "FINAL_DB_CONN_REF"
        type: "string"
        required: true
        description: "管理 DB 接続情報の参照名(値は置かない)。実行ホストと DB セグメントのどちらの置き場の値も、他の *_DB_CONN_REF と同じ 1 つの管理 DB に解決されること(conventions.credentials)"
      - name: "FINAL_COMPARE_COMMAND"
        type: "string"
        required: "final-crosscheck-worker.sh と validate-config.sh --final-crosscheck で Yes(DB セグメントの置き場のファイルに置く。final-crosscheck-runner.sh は読まず、欠落を検査しない。実行ホストの置き場のファイルには置かない(note))"
        description: "確報の比較ツール起動コマンド 1 行の文字列。プレースホルダ無し。確報 worker は値を shared_rules.compare_command_argv に従って空白区切りで引数の並びに分け、その並びをそのまま渡して起動する(置換なし。文字列をシェルに解釈させない)。検証(validate-config.sh --final-crosscheck)はコマンド部分(先頭の語 = 先頭の引数)が絶対パスで存在・実行可能であることだけを見る(引数部分の内容は検査しない)。情報「確報クロスチェック worker 設定」の属性「確報比較ツール起動コマンド」"
      - name: "FINAL_POLL_INTERVAL_SEC"
        type: "integer(>=1)"
        required: false
        default: 60
        description: "runner の終端待機 polling 間隔(秒)。キーがあれば値は正の整数 `^[1-9][0-9]{0,8}$`。違反はこのキーを使う読み手の起動時の設定エラー `error: invalid value key=FINAL_POLL_INTERVAL_SEC value=... path: ...` + `hint: use a positive integer`(2)。このキーを使わない読み手は値を検査しない(config_files.final-crosscheck.env readers)"
      - name: "FINAL_POLL_LIMIT_SEC"
        type: "integer(>=1)"
        required: false
        default: 28800
        description: "runner の polling 上限(秒。超過で終了コード 6、依頼は変更しない)。NFR B.2.2.1。キーがあれば値は正の整数 `^[1-9][0-9]{0,8}$`。違反はこのキーを使う読み手の起動時の設定エラー `error: invalid value key=FINAL_POLL_LIMIT_SEC value=... path: ...` + `hint: use a positive integer`(2)。このキーを使わない読み手は値を検査しない(config_files.final-crosscheck.env readers)"
      - name: "FINAL_LEASE_MINUTES"
        type: "integer(>=1)"
        required: false
        default: 10
        description: "worker の claim lease(分)。キーがあれば値は正の整数 `^[1-9][0-9]{0,8}$`。違反はこのキーを使う読み手の起動時の設定エラー `error: invalid value key=FINAL_LEASE_MINUTES value=... path: ...` + `hint: use a positive integer`(2)。このキーを使わない読み手は値を検査しない(config_files.final-crosscheck.env readers)"
      - name: "FINAL_WORKER_POLL_INTERVAL_SEC"
        type: "integer(>=1)"
        required: false
        default: 30
        description: "worker 常駐時の poll 間隔(秒)。キーがあれば値は正の整数 `^[1-9][0-9]{0,8}$`。違反はこのキーを使う読み手の起動時の設定エラー `error: invalid value key=FINAL_WORKER_POLL_INTERVAL_SEC value=... path: ...` + `hint: use a positive integer`(2)。このキーを使わない読み手は値を検査しない(config_files.final-crosscheck.env readers)"
  - file: "rapid-crosscheck.env"
    path: "$RELAY_GATE_CONFIG_DIR/rapid-crosscheck.env"
    format: "env(入力の守備範囲は config_input_rules(env_files))"
    owner: "基盤適用設計者(設定所有区分: 速報クロスチェック設定。RDRA 情報「速報クロスチェック設定」。RAPID_COMPARE_COMMAND の設定・検証を含む)"
    defined_in_uc: "適用構成業務/適用構成定義フロー/クロスチェックのジョブマップと比較定義を定義する(RAPID_COMPARE_COMMAND の設定と validate-config.sh --rapid-crosscheck 検証)/ 実装切替業務/実装切替ジョブ実行フロー/slot 実行モードを選択して runner を起動する / クロスチェック業務/速報クロスチェックフロー/速報クロスチェック runner へ完了通知を送信する / クロスチェック業務/速報クロスチェックフロー/両系成功時に速報比較依頼を作成する / クロスチェック業務/速報クロスチェックフロー/速報比較依頼を claim する / クロスチェック業務/速報クロスチェックフロー/比較ツールでジョブ単位比較を実行して結果を登録する(RAPID_COMPARE_COMMAND を起動)"
    readers:
      - "rapid-crosscheck-runner.sh(RAPID_DB_CONN_REF)"
      - "rapid-crosscheck-worker.sh(全キー。RAPID_COMPARE_COMMAND を起動)"
      - "rapid-crosscheck-result.sh(RAPID_DB_CONN_REF)"
      - "validate-config.sh --rapid-crosscheck(RAPID_COMPARE_COMMAND の検証)"
      - "abort-blue.sh / abort-green.sh / abort-rapid-crosscheck.sh(RAPID_DB_CONN_REF。RAPID_CROSSCHECK_MODE が off 以外のときのみ)"
      - "run-lineage.sh / hang-detect-trend.sh(RAPID_DB_CONN_REF。off 以外のときのみ)"
      - "background-rerun.sh(RAPID_DB_CONN_REF。off 以外のときのみ)"
      - "facade.sh / slot runner(RAPID_DB_CONN_REF。off 以外のときの parallel_runs / slot_executions / rapid_runs の INSERT / UPDATE)"
    on_missing: "RAPID_CROSSCHECK_MODE が off 以外(foreground / background)でファイル不在または RAPID_DB_CONN_REF 欠落は終了コード 2(slot runner は exitcode.txt=2。stderr は `error: config file not found path: ...` / `error: option required option=RAPID_DB_CONN_REF path: ...`)。rapid-crosscheck-worker.sh は RAPID_COMPARE_COMMAND の欠落・空も終了コード 2(`error: option required option=RAPID_COMPARE_COMMAND path: ...`)で、他の読み手は RAPID_COMPARE_COMMAND を検査しない。off では読まない(rapid-crosscheck-worker.sh は off で 3、参照系・abort-rapid-crosscheck・background-rerun --role rapid-crosscheck は off で 3、abort-blue / abort-green・background-rerun --role blue|green は off で管理 DB に触れず成果物ファイルだけで完了、facade / slot runner / hang-detector は off で管理 DB に触れず 0 系で継続)"
    note: "構築手順の配置時の検査はファイルがあることの確認だけ(RAPID_CROSSCHECK_MODE が off 以外の設置)で、中身の検査(必須キーの欠落・空、RAPID_COMPARE_COMMAND の形、任意キーの値の形)はこの契約(validate-config.sh --rapid-crosscheck と各読み手の起動時の検査)が持つ(インフラ設計)。読み手は自分が使うキーだけを必須の判定と値の検査の対象にする(readers。RAPID_LEASE_SEC / RAPID_POLL_INTERVAL_SEC の値を検査するのは rapid-crosscheck-worker.sh だけ)。任意キーを省いた設定、行の前後の空白・値を囲む引用符を含む設定も、config_input_rules.env_files の取り出し方で受理する。rapid-crosscheck-worker.sh の起動時の検査の順: (1) ファイルの存在(不在は `error: config file not found path: ...`)・読み取り(読めないときは `error: config file is not readable path: ...`) → (2) 入力の守備範囲(config_input_rules.env_files の (i)(ii)。違反があればその段の error 行を env_files の規則どおり全件(と (i) の hint)出して止める) → (3) 自分が使う必須キーの欠落・空(キー表の順) → (4) 自分が使う任意キーの値(キー表の順)。(1)(3)(4) は最初の違反の error 行(と hint)1 件だけを出して止める。どの段で止まっても終了コード 2 で、管理 DB には接続しない(必須キーは RAPID_DB_CONN_REF → RAPID_COMPARE_COMMAND、任意キーは RAPID_LEASE_SEC → RAPID_POLL_INTERVAL_SEC)。実行時の読み手は、未知キー(キー表に無いキー)を検査せず warn も出さない(validate-config.sh の検証種別は、validate-config.sh の stderr 規約どおり `warn: unknown key key=<KEY> path: ...` を出して継続する)。他の読み手が使うキー(例: rapid-crosscheck-runner.sh から見た RAPID_LEASE_SEC)は未知キーではなく、値を検査しないだけ。各ホストの置き場のファイルは構築手順が配置し、relay-gate の処理の中からは配らない(2026-11-04 利用者決定)"
    keys:
      - name: "RAPID_DB_CONN_REF"
        type: "string"
        required: "RAPID_CROSSCHECK_MODE が off でないとき Yes"
        description: "管理 DB 接続情報の参照名(値は置かない。認証情報の値は含めない)。情報「速報クロスチェック設定」の属性「管理 DB 接続参照名」。hang-detector.env の HANG_DB_CONN_REF と同じ参照名を指してよい。参照名が違っても、解決先は他の *_DB_CONN_REF と同じ 1 つの管理 DB(conventions.credentials)"
      - name: "RAPID_COMPARE_COMMAND"
        type: "string"
        required: "RAPID_CROSSCHECK_MODE が off でないとき、rapid-crosscheck-worker.sh と validate-config.sh --rapid-crosscheck で Yes(他の読み手は読まず、欠落を検査しない)"
        description: "速報の比較ツール起動コマンド 1 行の文字列。プレースホルダ `{job_id}` 必須、`{run_id}` / `{params}` / `{blue_exit_code}` / `{green_exit_code}` 任意。値は shared_rules.compare_command_argv に従って空白区切りで引数の並びに分け、各引数の中でプレースホルダを依頼レコード(rapid_crosscheck_requests)の run_id / job_id / parameters / blue_exit_code / green_exit_code へ置換し、引数の並びをそのまま渡して起動する(文字列をシェルに解釈させない)。`{params}` は引数 1 つ全体のときだけ使え JSON 配列を 1 項目 1 引数へ展開する。検証(validate-config.sh --rapid-crosscheck)はコマンド部分(先頭の語 = 先頭の引数)が絶対パスで存在・実行可能であること・`{job_id}` を含むこと・`{params}` が引数全体のときだけ使われていることの 3 点を見る(`{job_id}` の有無と `{params}` の位置のほかは、引数部分の内容を検査しない)。情報「速報クロスチェック設定」の属性「速報比較ツール起動コマンド」"
      - name: "RAPID_LEASE_SEC"
        type: "integer(>=1)"
        required: false
        default: 600
        description: "claim lease(秒)。lease_until = claim 時刻 + RAPID_LEASE_SEC。情報「速報クロスチェック設定」の属性「lease 期間(秒)」(shared_rules.lease_and_poll.rapid)。キーがあれば値は正の整数 `^[1-9][0-9]{0,8}$`。違反はこのキーを使う読み手(rapid-crosscheck-worker.sh)の起動時の設定エラー `error: invalid value key=RAPID_LEASE_SEC value=... path: ...` + `hint: use a positive integer`(2)。このキーを使わない読み手は値を検査しない"
      - name: "RAPID_POLL_INTERVAL_SEC"
        type: "integer(>=1)"
        required: false
        default: 30
        description: "worker 常駐時の poll 間隔(秒)。情報「速報クロスチェック設定」の属性「worker の poll 間隔(秒)」(shared_rules.lease_and_poll.rapid)。キーがあれば値は正の整数 `^[1-9][0-9]{0,8}$`。違反はこのキーを使う読み手(rapid-crosscheck-worker.sh)の起動時の設定エラー `error: invalid value key=RAPID_POLL_INTERVAL_SEC value=... path: ...` + `hint: use a positive integer`(2)。このキーを使わない読み手は値を検査しない"

  - file: "housekeep.env"
    path: "$RELAY_GATE_CONFIG_DIR/housekeep.env"
    format: "env(入力の守備範囲は config_input_rules(env_files))"
    owner: "基盤適用設計者(設定所有区分: ハウスキープ設定。RDRA 情報「ハウスキープ設定」)"
    defined_in_uc: "ハウスキープ業務/ハウスキープフロー/保持日数を過ぎた終了済みの実行と確報比較依頼を判定する"
    readers: ["housekeep.sh(全キー)", "validate-config.sh --housekeep(HOUSEKEEP_RETENTION_DAYS の検証)"]
    on_missing: "ファイル不在は housekeep.sh が `error: config file not found path: ...`(2)。削除したくない場合はファイルを置かないのではなく、ハウスキープ定期ジョブを登録しない"
    keys:
      - name: "HOUSEKEEP_RETENTION_DAYS"
        type: "integer(>=1)"
        required: false
        default: 90
        description: "保持日数。単位の最も遅い終了日時からこの日数(× 86400 秒)を過ぎた終了済みの実行の単位と確報比較依頼を削除する(shared_rules.housekeep_rules.retention)。値は `^[1-9][0-9]{0,8}$`(正の 10 進整数、先頭 0 なし、9 桁まで)。キーがあって値が空・0・負・小数・先頭 0・`+` 付き・10 桁以上は `error: invalid value key=HOUSEKEEP_RETENTION_DAYS value=... path: ...` + `hint: use a positive integer`(2)。キーが無ければ 90。情報「ハウスキープ設定」の属性「保持日数」"
      - name: "HOUSEKEEP_DB_CONN_REF"
        type: "string"
        required: "管理 DB を使う設置で Yes: RAPID_CROSSCHECK_MODE が off でないとき、または確報クロスチェックを使う設置(final-crosscheck.env があり FINAL_DB_CONN_REF が欠落していない)のとき。省略できるのは管理 DB を一切使わない設置だけ(shared_rules.housekeep_rules.db_requirement)"
        description: "ハウスキープ専用 DB ロール housekeep_del(_cross-cutting/datastore/rdb-schema.yaml db_roles)の管理 DB 接続情報の参照名(値は置かない。認証情報の値は含めない)。管理 DB を使う設置(RAPID_CROSSCHECK_MODE が off 以外、または確報クロスチェックを使う設置)で欠落・空は `error: option required option=HOUSEKEEP_DB_CONN_REF path: ...`(2。削除待ちの置き場の残りを含め何も削除しない)。設定されていれば、off でも管理 DB の行(確報比較依頼と、off 以外の期間に作られた実行の行)も削除する。管理 DB を一切使わない設置(off で確報クロスチェックを使わない設置)では任意で、未設定なら管理 DB に接続せず成果物だけを処理して、起動のたびに `warn: management db is not configured; database rows are not deleted (HOUSEKEEP_DB_CONN_REF not set)` を 1 行出す。要否の判定の正本は shared_rules.housekeep_rules.db_requirement。業務用ロールの参照名(RAPID_DB_CONN_REF / HANG_DB_CONN_REF / FINAL_DB_CONN_REF)とは別のロールを指すが、解決先はそれらと同じ 1 つの管理 DB(conventions.credentials)。情報「ハウスキープ設定」の属性「管理 DB 接続参照名」"
    unknown_keys: "`warn: unknown key key=<KEY> path: ...`(継続)"

# Runner Result Contract(外部 IF の正本)
artifact_layout:
  root: "$RELAY_GATE_ARTIFACT_ROOT/facade/<run_id>/"
  root_siblings: "成果物ルート直下には facade/ のほかに通知済みの印の置き場 hang-detector-notified/ と削除待ちの置き場 housekeep-pending/ がある(Runner Result の契約ファイルではない。run ディレクトリの列挙規則と合わせて shared_rules.artifact_root_entries)"
  publish_rule: "書き込みは一時ファイル(<name>.tmp)へ行い、確定名へ mv で公開する。確定名の存在で完了を判定する(条件: 成果物公開判定)。読み手は .tmp を無視する"
  tree: |-
    $RELAY_GATE_ARTIFACT_ROOT/facade/<run_id>/
      execution-spec.json              run 単位 1 ファイル(slots.<role> 節を各 runner が追加)
      execution-spec.json.tmp          一時(mv 前)
      execution-spec.lock/             mkdir による排他 lock(mtime 60 秒超は残留とみなし強制取得)
      <role>/                          role = blue | green(slot runner が実装の Runner Result を書く。速報・確報 worker は成果物ディレクトリを作らず、比較結果を依頼レコードの stdout / stderr / exit_code 列に保存する)
        started-at.txt                 UTC ISO 8601 秒精度 Z 付き 1 行(例 2026-08-30T11:30:05Z。起動時刻。SSH 実行直前。RELAY_GATE_NOW 設定時はその値。表示・実行ログ・DB 転記時はローカルへ変換する)
        stdout.log                     実装の stdout
        stderr.log                     実装の stderr(relay-gate 自身のエラーは exitcode.txt 公開前に末尾へ error: 1 行。公開後は変更しない。完了通知失敗の warn は書かない)
        exitcode.txt                   数値 1 行(0-255)
        aborted.txt                    中止日時 1 行(UTC ISO 8601 秒精度 Z 付き)。abort-blue.sh / abort-green.sh が中止時のみ生成(role = blue | green)
  files:
    - name: "started-at.txt"
      writer: "slot runner"
      when: "実装実行(SSH)の直前"
      content: "UTC ISO 8601 秒精度 Z 付き 1 行(例 2026-08-30T11:30:05Z。RELAY_GATE_NOW 設定時はその値。表示・実行ログ・DB 転記時はローカルへ変換する)"
      readers: "hang-detector.sh(経過時間の起点)。background-rerun.sh --role blue|green(元状態の導出: started-at.txt なし=未起動で 3。以降は shared_rules.exitcode_to_status.slot_execution。中身の時刻は読まない。off でも off 以外でも同じ)。abort-blue.sh / abort-green.sh(なし=未起動で 3。stdout の started_at にこの値を表示)"
    - name: "stdout.log / stderr.log"
      writer: "slot runner"
      when: "実行終了後に .tmp → mv"
      content: "実装の出力バイト列そのまま"
      readers: "facade.sh(foreground 中継)、運用者"
    - name: "exitcode.txt"
      writer: "同上"
      when: "stdout.log / stderr.log の後に最後に公開する(3 ファイル契約の完了マーカー)"
      content: "終了コード(数値 1 行)。2 = runner 側検証エラー、6 = SSH / 書き込み失敗 / runner 起動失敗(復元起動で runner 実体を起動できないときは background-rerun.sh の gateway が started-at.txt / 空の stdout.log / `error: runner failed to start ...` の stderr.log / exitcode.txt=6 の 3 ファイルを書く)"
      readers: "facade.sh(終了コード中継)、hang-detector.sh / background-rerun.sh / abort-blue.sh / abort-green.sh(shared_rules.exitcode_to_status.slot_execution: あり 0=SUCCEEDED / 非 0=FAILED、なしは aborted.txt の有無で ABORTED / RUNNING。off でも off 以外でも同じ)、rapid-crosscheck-runner.sh(--exit-code)"
    - name: "aborted.txt"
      writer: "abort-blue.sh / abort-green.sh(facade/<run_id>/<role>/aborted.txt。.tmp → mv で公開)"
      when: "運用者の yes 応答(または --yes)後、管理 DB の UPDATE より前。中止時のみ生成(RAPID_CROSSCHECK_MODE=off でも生成する)"
      content: "中止日時 1 行(UTC ISO 8601 秒精度 Z 付き。RELAY_GATE_NOW 設定時はその値)。abort-* の stdout aborted_at の中止時刻と同時刻(stdout の表記はローカルタイムゾーン・指示子なし)"
      readers: "hang-detector.sh(exitcode.txt が無く aborted.txt があれば判定 COMPLETED(中止済み)で監視記録を終端し通知しない)、background-rerun.sh --role blue|green(ABORTED = リラン可)、abort-blue.sh / abort-green.sh(中止済み判定と再適用。既にあれば書き直さない)、slot runner(起動時の二重起動判定のみ: exitcode.txt が無く aborted.txt があれば実装を再実行せず `WARN slot already aborted` で終了コード 6。実行中は読まず、中止後に実装が終了すれば exitcode.txt を公開し、状態導出では exitcode.txt が優先)"
    - name: "execution-spec.json"
      writer: "各 slot runner(自 slot 節のみ追加。run 単位キーは最初の runner)/ background-rerun.sh(新 run へコピーし run_id / parent_run_id / restored_at を書き換え)"
      when: "ジョブマップ解決直後・実装実行前に一度だけ。復元起動では書かない"
      content: "下記 execution_spec_example(canonical C1)。UTF-8、末尾改行、パーミッション 0640(仮採用)"
      readers: "hang-detector.sh(slots.<role>.mode / hang_detect_limit_minutes / job_id。無い run は warn: execution-spec missing で判定対象外)、background-rerun.sh --role blue|green(slots.<role>.*、params。--role rapid-crosscheck は読まない)、slot runner(--execution-spec 復元起動)、UC「hang_detect_limit_minutes をジョブごとに調整する」(調整後の値が次回 run の slots.<role>.hang_detect_limit_minutes に反映されたことの確認。hang-detect-trend.sh 自体は monitor_records の転記値を読む)"
  execution_spec_example: |-
    {
      "schema_version": "1",
      "run_id": "20260830T113000-JOB001-3f9a1c2e",
      "parent_run_id": null,
      "job_id": "JOB001",
      "params": ["20260830"],
      "rapid_crosscheck_mode": "background",
      "slots": {
        "blue":  { "mode": "foreground", "host": "...", "user": "...", "script": "...", "work_dir": "...", "fixed_params": [], "hang_detect_limit_minutes": 0,  "credential_ref": "...", "map_version": "...", "impl_version": "...", "finalized_at": "2026-08-30T11:30:00Z" },
        "green": { "mode": "background", "host": "...", "user": "...", "script": "...", "work_dir": "...", "fixed_params": [], "hang_detect_limit_minutes": 60, "credential_ref": "...", "map_version": "...", "impl_version": "...", "finalized_at": "2026-08-30T11:30:00Z" }
      }
    }
  execution_spec_rules:
    - "run 単位のキー(run_id / job_id / params / rapid_crosscheck_mode / parent_run_id)は最初に書いた runner が書き、以後変更しない"
    - "mode が off の slot は節を持たない。読み手は slots.{role} 節が無い slot を mode=off とみなす(background-rerun.sh のリラン対象検証の判定元。`slots.{role}.mode` に `off` が書かれることは無い)"
    - "各 runner は execution-spec.lock を mkdir で取得し、既存ファイルを読んで自 slot 節を追加(既にあれば何もしない)、.tmp へ全体を書いて mv で置換する。他 slot の節は変更しない"
    - "リラン時は background-rerun.sh が新 run ディレクトリへコピーし run_id / parent_run_id / restored_at を書き換える。復元起動の runner は読むだけで書かない"
    - "restored_at はリラン時のみ存在する run 単位キー(UTC ISO 8601 秒精度。例: \"restored_at\": \"2026-08-30T12:00:00Z\"、parent_run_id は元 run_id)。通常起動の execution-spec.json(上の execution_spec_example)は restored_at 節を持たない"
    - "schema_version は \"1\"。credential_ref は参照名のみ(認証情報の値を保存しない)"
    - "slots.<role>.impl_version は feature-flag.env の BLUE_IMPL / GREEN_IMPL(facade / background-rerun から runner へ環境変数で渡された値)の転記。slots.<role>.map_version はジョブマップの任意列 map_version の転記で、列が無い・空なら null。credential_ref も列が無い・空なら null"
    - "slots.<role>.host / user は、ジョブマップに host / user 列が無い、または両方の値が空のとき null(ローカル実行)。復元起動は null をそのまま読み、SSH せずローカル実行する"
    - "slots.<role>.fixed_params はジョブマップの fixed_params セル(CSV クォート規則で取り出した JSON 配列文字列)を解析した配列。run 単位の params は facade の PARAM... をそのまま配列化したもの"
    - "run_id はモードによらず常に発行する(RAPID_CROSSCHECK_MODE=off でも同じ)。rapid_crosscheck_mode は feature-flag.env の RAPID_CROSSCHECK_MODE の値(foreground / background / off)をそのまま転記する"
