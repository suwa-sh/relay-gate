  - name: "final-crosscheck-runner.sh"
    tier: "tier-final-crosscheck"
    synopsis: "final-crosscheck-runner.sh [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(確報クロスチェックジョブ定義)。引数なしで起動する。結果は運用者がジョブスケジューラの実行履歴で読む"
    defined_in_uc: "クロスチェック業務/確報クロスチェックフロー/確報比較依頼を登録して終端状態まで待機する"
    used_by_ucs:
      - "クロスチェック業務/確報クロスチェックフロー/保存済みの確報結果をジョブスケジューラへ返す"
      - "クロスチェック業務/確報クロスチェックフロー/確報クロスチェック結果を確認する"
    args: []
    options:
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を実行ログに出す(stderr には出さない)"
    stdin: "なし"
    stdout: "待機中は出力しない。終端到達後は依頼に保存された stdout をバイト列のまま出す(NULL は 0 バイト)。状態名・final_crosscheck_id を追加しない"
    stderr: "終端到達後は依頼に保存された stderr をバイト列のまま出す。中継に至る前の relay-gate 自身のエラーのみ `error:`(+ `hint:`): error: unknown option option=... / error: config file not found path: ...(final-crosscheck.env 不在)/ error: config file is not readable path: ... / error: option required option=FINAL_DB_CONN_REF path: ... / error: invalid value key=FINAL_POLL_INTERVAL_SEC|FINAL_POLL_LIMIT_SEC value=... path: ... + hint: use a positive integer(検査の順は config_files.final-crosscheck.env note)/ error: management db connection failed conn_ref=... / error: management db query failed final_crosscheck_id=... / error: polling limit exceeded final_crosscheck_id=... status=... limit_sec=...(status は超過時点の依頼 status)/ error: request aborted before completion final_crosscheck_id=...(exit_code NULL)。待機中の進捗は実行ログにのみ(`INFO polling final_crosscheck_id=... status=... elapsed_minutes=...`)"
    exit_codes:
      - code: "依頼に保存された exit_code(0 / 3 / 6 / その他)"
        meaning: "無加工中継。0 = 比較 OK(リリース判断の正本)/ 3 = 比較 NG / 6 = 実行エラー"
        condition: "依頼が SUCCEEDED / FAILED に到達し exit_code が 0〜255"
      - code: 2
        meaning: "入力・設定検証エラー(中継に至る前)"
        condition: "未知のオプション、final-crosscheck.env 不在または runner が使う必須キー(FINAL_DB_CONN_REF)の欠落・空、FINAL_POLL_INTERVAL_SEC / FINAL_POLL_LIMIT_SEC の値が正の整数でない(FINAL_COMPARE_COMMAND など worker だけが使うキーは検査しない)"
      - code: 6
        meaning: "実行エラー(中継に至る前、または中継不能)"
        condition: "管理 DB 接続・INSERT・SELECT 失敗、polling 上限 FINAL_POLL_LIMIT_SEC 超過(依頼は変更しない)、exit_code が NULL(ABORTED で比較未完了)、exit_code が 0〜255 の範囲外"
    idempotency: "起動のたびに新しい final_crosscheck_id で依頼を 1 件登録する(引数なしで起動され、複数回起動すれば依頼は複数件)。polling 中は状態を UPDATE しない。再実行はジョブスケジューラの正規ジョブで行う"

