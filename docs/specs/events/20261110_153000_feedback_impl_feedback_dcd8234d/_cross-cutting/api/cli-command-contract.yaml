    stdin: "abort-blue.sh と同じ"
    stdout: "abort-blue.sh と同じ(role=green)"
    stderr: "abort-blue.sh と同じ(role=green。hint は `rerun abort-green.sh --run-id ... to reapply`)"
    exit_codes:
      - code: 0
        meaning: "aborted.txt を公開した(RAPID_CROSSCHECK_MODE が off 以外なら slot_executions / parallel_runs / rapid_crosscheck_requests(REQUESTED のみ ABORTED。0 件は正常。競合窓の保険)の併更新も abort-blue.sh と同じ。COMPLETED は更新しない。off では aborted.txt だけで完了)"
        condition: "aborted.txt を公開した"
      - code: 2
        meaning: "入力検証エラー"
        condition: "引数不正 / 非 TTY で --yes なし"
      - code: 3
