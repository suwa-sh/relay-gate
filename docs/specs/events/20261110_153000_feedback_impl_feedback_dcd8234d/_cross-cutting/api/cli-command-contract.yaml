        default: false
        description: "info を stderr にも出す(info: claimed ... / info: no request to claim ...)"
    stdin: "なし"
    stdout: "出力しない(常駐ログは実行ログ final-crosscheck-worker.sh.log へ。比較ツールの stdout は依頼レコードの stdout 列に保存)"
    stderr: "error: management db connection failed worker_id=... conn_ref=...(6。速報 worker と同文)/ error: management db query failed ...(6)/ error: management db update failed final_crosscheck_id=...(6)/ error: compare tool launch failed final_crosscheck_id=... command=...(6。依頼は FAILED exit_code=6 error_summary=`launch failed`。速報 worker と同じ値)/ error: config file not found path: ... / error: config file is not readable path: ... / error: option required option=FINAL_DB_CONN_REF path: ... / error: option required option=FINAL_COMPARE_COMMAND path: ... / error: invalid value key=FINAL_LEASE_MINUTES|FINAL_WORKER_POLL_INTERVAL_SEC value=... path: ... + hint: use a positive integer(2。検査の順は config_files.final-crosscheck.env note)/ hint:。終端 UPDATE 0 件(比較中に ABORTED)は stderr に出さず実行ログ `WARN request already terminal final_crosscheck_id=... status=ABORTED` のみ(継続、終了コード 0)。比較ツールの stderr は流さない"
    exit_codes:
      - code: 0
        meaning: "1 サイクル完了(claim して終端まで保存した / 依頼が無かった、のどちらも 0)。比較ツールの非 0 は反映しない。終端 UPDATE が 0 件(比較中に abort-final-crosscheck.sh で ABORTED)の場合は実行ログに `WARN request already terminal final_crosscheck_id=... status=ABORTED` を残して 0(stderr には出さない)。常駐は SIGTERM で 0"
        condition: "1 サイクル完了"
      - code: 2
        meaning: "入力・設定検証エラー"
        condition: "未知のオプション、--worker-id の文字種不正、final-crosscheck.env 不在または worker が使う必須キー(FINAL_DB_CONN_REF / FINAL_COMPARE_COMMAND)の欠落・空、FINAL_LEASE_MINUTES / FINAL_WORKER_POLL_INTERVAL_SEC の値が正の整数でない"
      - code: 6
        meaning: "実行エラー"
        condition: "管理 DB 接続・SQL 失敗、比較ツール起動失敗(依頼は FAILED exit_code=6 を保存)、内部エラー"
    idempotency: "条件付き UPDATE による claim。RUNNING 到達後(started_at あり)は lease 失効でも戻さない(中止は abort-final-crosscheck.sh)。終端 UPDATE は `WHERE final_crosscheck_id=? AND status='RUNNING'`(0 件 = 中止済み)。runner の polling は status 列のみを読み、終端検知後に 1 回だけ status / exit_code / stdout / stderr の 4 列を SELECT する"
    notes:
      - "worker が読む入力は DB の依頼レコード(final_crosscheck_requests)と自身の設定ファイル(final-crosscheck.env)だけ。runner と worker は別ネットワークセグメントで動く"
      - "前提(2026-11-04 利用者決定): worker が読む final-crosscheck.env は、worker が動くホスト(DB セグメント)の置き場に構築手順が配置したもの。relay-gate は runner 側のファイルを worker へ配らず、比較ツール起動コマンドを依頼レコードで渡さない。FINAL_COMPARE_COMMAND を変えるときは構築手順で配り直し、validate-config.sh --final-crosscheck は worker が動くホストでそのファイルに対して実行する(config_files.final-crosscheck.env note)"
      - "起動コマンドの解決: final-crosscheck.env の FINAL_COMPARE_COMMAND(1 行の文字列。プレースホルダ無し)を shared_rules.compare_command_argv に従って引数の並びに分け、その並びをそのまま渡して起動する(置換はしない。文字列をシェルに解釈させない = `eval` / `bash -c` / `sh -c` / 引用符なし展開で起動しない)。得た stdout / stderr / exit_code を依頼レコードの列へ保存する(別レコード・成果物ファイル・対象カタログの抜き出しを行わない)。状態 = exit_code 0 → SUCCEEDED / 非 0 または起動失敗 → FAILED"

  - name: "hang-detector.sh"
    tier: "tier-ops"
    synopsis: "hang-detector.sh [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(ハング検知定期ジョブ、5 分ごと)。終了コード 3(警告終了)と 6(失敗)をジョブスケジューラの既存のジョブ監視・障害通知の対象にする"
    defined_in_uc: "実行監視業務/background 実行監視フロー/background 実行の経過時間と終了状態を判定する"
    used_by_ucs:
      - "実行監視業務/background 実行監視フロー/ハング疑い・実行エラー・比較異常を通知する"
      - "実行監視業務/background 実行監視フロー/監視記録を保存する"
      - "実行監視業務/background 実行監視フロー/ハング検知ジョブの異常終了を確認する"
      - "適用構成業務/適用構成定義フロー/切り替えた運用モードで業務ジョブを実行する"
    args: []
    options:
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "対象ごとの `info: judged run_id=... role=... judgement=... elapsed_minutes=... limit_minutes=...` / `info: alert skipped already notified run_id=... role=... status=...` を stderr にも出す"
    stdin: "なし"
    stdout: "出力しない(0 行)。判定結果は実行ログ hang-detector.sh.log にも残す"
    stderr: |-
      その回の見回りで新たに知らせる異常を 1 件 1 行の alert 行で出す(shared_rules.hang_alert。conventions.output_format.stderr の例外):
      - `alert: level=<warning|error> kind=<hang-suspected|background-exec-error|rapid-crosscheck-error> run_id=<run_id> role=<blue|green|rapid-crosscheck> job_id=<job_id> elapsed_minutes=<n>`
      走査前の入力・設定エラー(2。何も走査しない。管理 DB にも接続しない):
      - `error: unknown option option=...` / `error: unexpected argument value=...`
      - `error: config file not found path: ...`(hang-detector.env 不在。全コマンド共通の定型文)/ `error: config file is not readable path: ...`(hang-detector.env が読めない)
      - 入力の守備範囲の違反(hang-detector.env / feature-flag.env。NUL / UTF-8 / BOM / CR / invalid line / 同じキーの重複。文言と報告の順は config_input_rules)
      - `error: config file not found path: ...` / `error: config file is not readable path: ...`(feature-flag.env が無い・読めない)
      - `error: option required option=RAPID_CROSSCHECK_MODE path: ...` / `error: invalid value key=RAPID_CROSSCHECK_MODE value=...` + 次行 `hint: use foreground, background or off`(feature-flag.env の RAPID_CROSSCHECK_MODE が無い・空・列挙外。文言は config_files.feature-flag.env.error_messages)
      - `error: option required option=HANG_DB_CONN_REF path: ...`(RAPID_CROSSCHECK_MODE が off 以外で欠落・空)
      - `error: invalid value key=RAPID_HANG_DETECT_LIMIT_MINUTES value=... path: ...` / `error: invalid value key=HANG_SCAN_WINDOW_HOURS value=... path: ...` + 次行 `hint: use a positive integer`(キーがあり、値が正の整数 `^[1-9][0-9]{0,8}$` でない。値が空・0・負・小数・先頭 0・`+` 付き・10 桁以上。キーが無ければ既定値)
      - `error: artifact root not found path: ...`(RELAY_GATE_ARTIFACT_ROOT が無い。『無い』の定義は shared_rules.artifact_root_entries.missing_root)
      走査前の検査の順は、(a) 引数 → (b) hang-detector.env(存在・読み取り・入力の守備範囲)→ (c) feature-flag.env(存在・読み取り・入力の守備範囲・RAPID_CROSSCHECK_MODE)→ (d) hang-detector.env のキー(HANG_DB_CONN_REF(off 以外のときだけ)→ RAPID_HANG_DETECT_LIMIT_MINUTES → HANG_SCAN_WINDOW_HOURS)→ (e) RELAY_GATE_ARTIFACT_ROOT とし、最初に設定エラーを見つけたところで止めて、その error 行(と hint)だけを出す(入力の守備範囲の違反が複数行あるときの出し方は config_input_rules)。(c) で hang-detector.sh が feature-flag.env について検査するのは存在・読み取り・入力の守備範囲と RAPID_CROSSCHECK_MODE だけで、feature-flag.env の他のキーの欠落・値、未知キー、`FINAL_` で始まるキーは検査せず、warn も error も出さない(feature-flag.env のそれらの検査は facade.sh・background-rerun.sh・validate-config.sh --feature-flag が持つ。config_files の feature-flag.env の reader_scope)。(e) の『無い』は、成果物ルートの存在確認が ENOENT で終わったとき、存在確認そのものが失敗したとき(親ディレクトリの権限不足など)、またはディレクトリでないときとし、どれも `error: artifact root not found path: ...`(2)で止める(shared_rules.artifact_root_entries.missing_root)。走査前の設定エラーで止まる回は、hang-detector.env の未知キーの warn 行を出さない((a)〜(e) のどこで止まっても)
      管理 DB に接続・SELECT できない回(6。RAPID_CROSSCHECK_MODE が off 以外。shared_rules.hang_alert.db_unavailable):
      - `error: management db connection failed conn_ref=...` / `error: management db query failed ...` の 1 行だけを出し、成果物の走査・判定・alert 行・監視記録の保存を行わない(warn / info / alert 行を出さない。hang-detector.env の未知キーの warn 行も出さない)
      印の置き場を読めない回(6。RAPID_CROSSCHECK_MODE=off。走査前の検査を通ったあと、facade/ を列挙する前に検査する。shared_rules.hang_alert.notified_mark.directory_unreadable):
      - `error: notified mark dir is not readable path: ...` の 1 行だけを出し、走査・判定・alert 行・印の書き込みを行わない(`error: artifact root is not readable` も、hang-detector.env の未知キーの warn 行も出さない)
      走査を始めるとき(warn。終了コードに影響しない。shared_rules.hang_alert.unknown_key_warn):
      - `warn: unknown key key=<KEY> path: ...`(hang-detector.env のキー表に無いキーごとに 1 行、ファイル内の出現順(物理行番号の昇順)。off 以外は管理 DB への接続と SELECT が通ったあと、off は印の置き場の検査が通ったあと(facade/ を列挙する前)に出す。stderr のどの行(`error: artifact root is not readable`、走査中の warn 行、info 行、alert 行、対象ごとの error 行)よりも前)
      判定の継続(warn。終了コードに影響しない):
      - `warn: execution-spec missing run_id=... path: ...`(execution-spec.json が無い run は判定対象外。監視記録・印も書かない)
      - `warn: execution-spec invalid run_id=... key=...`(execution-spec.json にキーが無い role は判定対象外)
      - `warn: started-at is invalid run_id=... role=... value=...`
      走査の途中の実行エラー(6。他の対象の判定・通知は続ける):
      - `error: artifact root is not readable path: ...`
      - `error: notified mark invalid run_id=... role=... path: ...`(RAPID_CROSSCHECK_MODE=off。窓内の判定する対象の印が規定の値でない・読めない。その対象は印が無いものとして判定する。shared_rules.hang_alert.notified_mark.invalid。判定しない対象の印は読まない)
      - `error: monitor record save failed run_id=... role=...`(RAPID_CROSSCHECK_MODE が off 以外。その異常は次回も知らせる)
      - `error: notified mark save failed run_id=... role=... path: ...`(RAPID_CROSSCHECK_MODE=off。その異常は次回も知らせる)
      対象ごとの error 行(印の不正・保存失敗)は 1 対象 1 行で複数出してよい(conventions.output_format.stderr の例外)。行の並び順は shared_rules.hang_alert.order(未知キーの warn 行 → `error: artifact root is not readable` → 走査の warn 行 → --verbose の info: judged 行 → 対象ごとの行を run_id 昇順 → role の blue, green, rapid-crosscheck 順。1 対象の中は 印の不正 → alert / info: alert skipped → 保存失敗)
    exit_codes:
      - code: 0
        meaning: "その回の見回りで新たに知らせる異常が無く、走査・判定・記録がすべて成功した(通知済みの異常だけが残っている場合も 0)"
        condition: "alert 行 0 件かつ実行エラー 0 件"
      - code: 2
        meaning: "入力・設定検証エラー(走査前に検出。何も走査しない)"
        condition: "未知のオプション・余分な引数、hang-detector.env 不在・読み取り不可、読んだ設定ファイルの入力の守備範囲の違反、feature-flag.env が無い・読めない・RAPID_CROSSCHECK_MODE が無い・空・列挙外、RAPID_CROSSCHECK_MODE が off 以外で HANG_DB_CONN_REF 欠落・空、RAPID_HANG_DETECT_LIMIT_MINUTES / HANG_SCAN_WINDOW_HOURS の値が正の整数でない、RELAY_GATE_ARTIFACT_ROOT が無い(存在確認の失敗・ディレクトリでないを含む)"
      - code: 3
        meaning: "警告終了。新たに知らせる異常がハング疑い(level=warning)だけ(確報の比較 NG=3 と同じく、ジョブステータスが警告終了になる値)"
        condition: "alert 行が 1 件以上ですべて level=warning、かつ実行エラー 0 件"
      - code: 6
        meaning: "失敗。background 実行エラー・速報クロスチェック異常(level=error)を新たに 1 件以上知らせた、または hang-detector 自身の実行エラーがあった(他の対象の判定・通知は続けたうえで 6)"
        condition: "level=error の alert 行が 1 件以上、または RAPID_CROSSCHECK_MODE が off 以外で管理 DB 接続・SELECT 失敗(alert 行を出さず error 1 行だけで終える。shared_rules.hang_alert.db_unavailable)、成果物ルート読み取り失敗、monitor_records の UPSERT 失敗 1 件以上、RAPID_CROSSCHECK_MODE=off で通知済みの印の不正(規定の値でない・読めない)1 件以上、印の置き場を読めない(error 1 行だけで終える)、通知済みの印の保存失敗 1 件以上。ハング疑いとエラーを同じ回に見つけた場合も 6(優先順位 6 > 3 > 0)"
    idempotency: "通知済みの異常は再び知らせない(shared_rules.hang_alert.renotification)。判定結果に対応する monitor_status(shared_rules.state_codes.hang_judgement_to_monitor_status)が通知の対象(HANG_SUSPECTED_NOTIFIED / EXEC_ERROR_NOTIFIED / COMPARE_ERROR_NOTIFIED)で、現在の通知済み状態と異なり、現在の通知済み状態が終端でないときだけ alert 行を出す。現在の通知済み状態は、RAPID_CROSSCHECK_MODE が off 以外では monitor_records.monitor_status(行が無ければ MONITORING)、off では通知済みの印の内容(印が無ければ MONITORING。印が不正・読めなければ error 行を出して MONITORING。shared_rules.hang_alert.notified_mark.invalid)。off 以外で管理 DB に接続・SELECT できない回は C を読めないため alert 行を出さず、error 1 行と終了コード 6 だけで終える(shared_rules.hang_alert.db_unavailable)。alert 行を出したあとで監視記録を UPSERT(alerted_at = 判定時刻)、off では印を書く。保存に失敗した異常は通知済みにならないため次回も知らせる(知らせ漏れより重複を選ぶ)。監視記録は UPSERT。状態は参照のみで依頼・slot の状態を変更せず、プロセスを停止せず、新しい実行依頼を作成しない(自動中止・自動再実行をしない)。background slot の終端判定は成果物(exitcode.txt / aborted.txt)のみで行い、slot_executions.status は読まない。RAPID_CROSSCHECK_MODE が off 以外のときは速報比較依頼の判定に rapid_crosscheck_requests.status(ABORTED を含む)を読む"
    scan_rules: "execution-spec.json が無い run は `warn: execution-spec missing` を出して判定対象外(mode / job_id を確定できないため既定値で判定しない)。background slot の状態は成果物ファイルから導出する(shared_rules.exitcode_to_status.slot_execution): exitcode.txt が無く aborted.txt がある対象は判定 COMPLETED(中止済み)として監視記録を終端し、alert 行を出さない(運用者が中止済み)。RAPID_CROSSCHECK_MODE が off 以外のときは rapid_crosscheck_requests.status=ABORTED(速報比較依頼)の対象も同じく判定 COMPLETED で終端する(未終端の監視記録(monitor_status IN ('MONITORING','HANG_SUSPECTED_NOTIFIED'))が残っていれば終端し、alert 行は出さない)。速報比較依頼は ABORTED 済みで監視記録が無いものを走査しない(依頼テーブルを起点に列挙するため)。background slot は成果物(started-at.txt)を起点に走査するため、走査窓内の中止済み slot は監視記録の有無によらず判定 COMPLETED とし、記録 UC が COMPLETED の監視記録を UPSERT する。run ディレクトリの列挙は shared_rules.artifact_root_entries に従う(facade/ 直下の run_id 形式のディレクトリだけ。通知済みの印の置き場・削除待ちの置き場は列挙しない)。完了通知の送信失敗は監視対象外(条件「完了通知失敗の扱い」)"
    notes:
      - "hang_judgement は 6 値(shared_rules.state_codes.hang_judgement / hang_judgement_labels): NOT_TARGET / COMPLETED(正常終了または中止済み)/ MONITORING / HANG_SUSPECTED / EXEC_ERROR / COMPARE_ERROR。monitor_status は 6 値(monitor_status_labels)で、遷移は monitor_status_transitions に従う(ハング疑い通知済み → 正常終了 = 通知後正常終了。通知済み対象も再判定し、非 0 終了・比較異常が判明すれば EXEC_ERROR_NOTIFIED / COMPARE_ERROR_NOTIFIED へ遷移して alert 行を出す)"
      - "HANG_DB_CONN_REF の出所は hang-detector.env(情報「ハング検知定期ジョブ設定」)。RAPID_CROSSCHECK_MODE=off では読まず、監視記録は保存できないため、判定結果は実行ログに残し、通知済みかどうかは通知済みの印(shared_rules.hang_alert.notified_mark)で判定する"
      - "hang-detector は CLI の出力(標準エラーの alert 行と終了コード)以外の通知送信手段を持たない。運用者へはジョブスケジューラの既存のジョブ監視・障害通知で届く(UC「ハング検知ジョブの異常終了を確認する」)"

  - name: "hang-detect-trend.sh"
    tier: "tier-ops"
    synopsis: "hang-detect-trend.sh [--job-id JOB_ID] [--role blue|green|rapid-crosscheck] [--since LOCAL_DATETIME] [--limit N] [--all] [--verbose] [--help]"
    invoked_by: "運用者(直接起動)"
    defined_in_uc: "実行監視業務/background 実行監視フロー/hang_detect_limit_minutes をジョブごとに調整する"
    used_by_ucs: []
    args: []
    options:
      - name: "--job-id"
        type: "string"
        required: false
        description: "絞り込む job_id(英数字・_・- のみ)"
      - name: "--role"
        type: "enum"
        enum: ["blue", "green", "rapid-crosscheck"]
        required: false
        description: "絞り込む監視対象 role"
      - name: "--since"
        type: "string"
        required: false
        default: "実行時刻(ローカル時刻)の 3 ヶ月前"
        description: "集計期間の開始(ホストのローカルタイムゾーンの ISO 8601 秒精度、タイムゾーン指示子なし。例 2026-06-01T00:00:00。monitor_records.judged_at と同じ時刻軸で比較する。Z / オフセット付きは形式不正)"
      - name: "--limit"
        type: "integer"
        required: false
        default: 100
        description: "出力行数の上限(1 以上)"
      - name: "--all"
        type: "boolean"
        required: false
        default: false
        description: "hang_suspected_count=0 の行も出す"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "なし"
    stdout: "TSV(ヘッダー行あり): job_id, role, run_count, hang_suspected_count, completed_after_alert_count, max_elapsed_minutes_at_alert, last_elapsed_minutes_at_alert, current_limit_minutes(列定義は data-visualization.md 2. が正。current_limit_minutes は job_id × role で集計期間内の `judged_at` が最大の監視記録行の hang_detect_limit_minutes。started_at では選ばない)"
    stderr: "error: unknown option option=... / error: invalid value option=--role|--since|--limit|--job-id value=... / error: config file not found path: ...(2。feature-flag.env / rapid-crosscheck.env 不在)/ error: option required option=RAPID_DB_CONN_REF path: ...(2)/ error: management db is not configured (RAPID_CROSSCHECK_MODE=off)(3)/ error: management db query failed ... / warn: output truncated limit=N / info:(--verbose)"
    exit_codes:
      - code: 0
        meaning: "集計して出力した(0 行でも 0)"
        condition: "集計完了"
      - code: 2
        meaning: "引数不正"
        condition: "未知オプション / role 列挙外 / since 形式不正(ローカル ISO 8601 秒精度・指示子なし `yyyy-mm-ddThh:mm:ss` でない。Z / オフセット付きも不正)/ limit 1 未満または非整数 / job_id 形式不正(英数字・_・- 以外)/ feature-flag.env・rapid-crosscheck.env 不在・RAPID_DB_CONN_REF 欠落(config_files.on_missing の定型文)"
      - code: 3
        meaning: "業務エラー"
        condition: "RAPID_CROSSCHECK_MODE=off(management db is not configured)"
      - code: 6
        meaning: "実行エラー"
        condition: "管理 DB 接続・SQL 失敗(management db query failed)"
    idempotency: "参照のみ(monitor_records を集計。parallel_runs と JOIN しない)"

  - name: "housekeep.sh"
    tier: "tier-ops"
    synopsis: "housekeep.sh [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(ハウスキープ定期ジョブ、1 日 1 回)。業務ジョブ(facade.sh)からは呼ばない。削除したくない場合は定期ジョブを登録しない"
    defined_in_uc: "ハウスキープ業務/ハウスキープフロー/保持日数を過ぎた終了済みの実行と確報比較依頼を判定する"
    used_by_ucs:
      - "ハウスキープ業務/ハウスキープフロー/成果物と管理 DB の履歴を削除する"
    args: []
    options:
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "単位ごとの `info: unit kept root_run_id=... reason=unfinished|within_retention|undeterminable` / `info: unit deleted root_run_id=... run_ids=N latest_completed_at=...` を stderr にも出す"
    stdin: "なし"
    config: "housekeep.env(config_files.housekeep.env)。feature-flag.env の RAPID_CROSSCHECK_MODE も読む。RAPID_CROSSCHECK_MODE=off で HOUSEKEEP_DB_CONN_REF が無い・空のときだけ、確報クロスチェックを使う設置かを判定するために final-crosscheck.env の FINAL_DB_CONN_REF の有無も読む(接続には使わない。HOUSEKEEP_DB_CONN_REF の要否の正本は shared_rules.housekeep_rules.db_requirement)"
    stdout: "固定順の key=value 8 行(終了コード 0 と 6 で出す。2 では出さない): retention_days=<N>, cutoff=<ローカル日時>, purged_pending_entries=<N>, deleted_run_units=<N>, deleted_runs=<N>, deleted_final_crosscheck_requests=<N>, deleted_orphan_marks=<N>, kept_units=<N>。cutoff = 現在時刻(RELAY_GATE_NOW 設定時はその値)− 保持日数 × 86400 秒。purged_pending_entries は手順 1 で削除した置き場の残り、deleted_run_units / deleted_runs は削除し終えた実行の単位とその run_id の数、deleted_final_crosscheck_requests は削除した確報比較依頼の件数、deleted_orphan_marks は削除した孤立した印の数、kept_units は残した実行の単位の数(終わっていない・保持日数内・判定できない)"
    stderr: |-
      走査前の入力・設定エラー(2。processing_order の手順 0 で検出し、削除待ちの置き場の残りを含め何も削除しない。stdout なし):
      - `error: config file not found path: ...`(housekeep.env 不在)
      - `error: invalid value key=HOUSEKEEP_RETENTION_DAYS value=... path: ...` + `hint: use a positive integer`
      - `error: option required option=HOUSEKEEP_DB_CONN_REF path: ...`(管理 DB を使う設置で欠落・空。管理 DB を使う設置 = RAPID_CROSSCHECK_MODE が off 以外、または確報クロスチェックを使う設置(final-crosscheck.env があり FINAL_DB_CONN_REF が欠落していない)。どちらで必須になったかは文言で区別しない。判定は shared_rules.housekeep_rules.db_requirement)
      - `error: config file is not readable path: ...`(housekeep.env / feature-flag.env が読めない。RAPID_CROSSCHECK_MODE=off で HOUSEKEEP_DB_CONN_REF が無い・空のときは、final-crosscheck.env があるのに読めない場合も。feature-flag.env 不在は `error: config file not found path: ...`。final-crosscheck.env 不在はエラーにせず、確報クロスチェックを使わない設置とする)
      - 入力の守備範囲の違反(housekeep.env / feature-flag.env と、読んだときの final-crosscheck.env。NUL / UTF-8 / BOM / CR / invalid line / 同じキーの重複(duplicate key)。文言と報告の順は config_input_rules(env_files))
      - `error: artifact root not found path: ...`(RELAY_GATE_ARTIFACT_ROOT が無い。『無い』の定義は shared_rules.artifact_root_entries.missing_root = 存在しない・存在確認の失敗・ディレクトリでない)
      - `error: unknown option option=...` / `error: unexpected argument value=...`
      判定の継続(warn。終了コードに影響しない。その実行の単位は残す):
      - `warn: unknown key key=<KEY> path: ...`(housekeep.env のキー表に無いキー。feature-flag.env と final-crosscheck.env の未知キーは検査しない。config_files の feature-flag.env の reader_scope、shared_rules.housekeep_rules.db_requirement)
      - `warn: management db is not configured; database rows are not deleted (HOUSEKEEP_DB_CONN_REF not set)`(管理 DB を一切使わない設置 = RAPID_CROSSCHECK_MODE=off で確報クロスチェックを使わない設置で、HOUSEKEEP_DB_CONN_REF が無い・空のときだけ、起動のたびに 1 行。確報比較依頼と管理 DB の行は削除しない。管理 DB を使う設置で無い・空なら warn ではなく設定エラー(2))
      - `warn: run kept completed_at missing run_id=<run_id> table=<table>`(管理 DB で判定する実行で、終端状態の行の completed_at が NULL)
      - `warn: run kept rapid crosscheck mode run_id=... mode=<foreground|background>`(管理 DB に接続しないとき、execution-spec.json の rapid_crosscheck_mode が off でない実行。shared_rules.housekeep_rules.member_source)
      - `warn: run kept execution-spec missing run_id=... path: ...`(成果物だけで判定する実行 = 管理 DB に parallel_runs 行が無い実行だけ。parallel_runs 行がある実行は execution-spec.json が無くても出さない。shared_rules.housekeep_rules.member_source)
      - `warn: run kept execution-spec invalid run_id=... path: ...`(成果物だけで判定する実行だけ。読めない・解析できない・slots に role が無い・parent_run_id が不正。管理 DB に接続しないときは rapid_crosscheck_mode が無い・foreground / background / off のどれでもない場合も)
      - `warn: run kept slot artifact missing run_id=... role=... path: ...`(成果物だけで判定する実行だけ)
      失敗(6。1 つの単位の失敗は次の単位へ続ける。単位ごと・エントリごとに 1 件 1 行で複数出してよく、並び順は shared_rules.housekeep_rules.processing_sequence):
      - `error: management db connection failed conn_ref=...`(実行の単位の判定・削除と確報比較依頼の削除を一切行わない)
      - `error: management db query failed ...`
      - `error: artifact root is not readable path: $RELAY_GATE_ARTIFACT_ROOT/facade`(実行の単位・確報比較依頼・孤立した印を処理しない)
      - `error: pending dir create failed path: $RELAY_GATE_ARTIFACT_ROOT/housekeep-pending`(実行の単位・確報比較依頼・孤立した印を処理しない)
      - `error: pending entry delete failed path: ...`
      - `error: artifact move failed run_id=... path: ...`
      - `error: artifact delete failed path: ...`
      - `error: management db delete failed run_ids=<run_id,...>`(ロールバック済み)
      - `error: management db delete failed final_crosscheck_id=...`
    exit_codes:
      - code: 0
        meaning: "失敗なく終えた(削除件数 0 を含む。warn があっても 0)"
        condition: "失敗 0 件"
      - code: 2
        meaning: "入力・設定検証エラー(走査前。削除待ちの置き場の残りを含め何も削除しない)"
        condition: "未知のオプション・余分な引数、housekeep.env 不在・読み取り不可、HOUSEKEEP_RETENTION_DAYS の値が正の整数でない、管理 DB を使う設置(RAPID_CROSSCHECK_MODE が off 以外、または確報クロスチェックを使う設置)で HOUSEKEEP_DB_CONN_REF 欠落・空、feature-flag.env が読めない、off で HOUSEKEEP_DB_CONN_REF が無い・空のときに final-crosscheck.env があるのに読めない、読んだ設定ファイルの入力の守備範囲の違反、RELAY_GATE_ARTIFACT_ROOT が無い(存在確認の失敗・ディレクトリでないを含む。shared_rules.artifact_root_entries.missing_root)"
      - code: 6
        meaning: "実行エラー(削除できたものは削除したうえで 6)"
        condition: "管理 DB 接続・SELECT 失敗、成果物ルート(facade/)の読み取り失敗、置き場の作成失敗、置き場の残りの削除失敗、成果物の移動・削除失敗、管理 DB の行の削除失敗(ロールバック)が 1 件以上"
    processing_order:
      - "0. 入力と設定を検査する: 引数、housekeep.env(HOUSEKEEP_RETENTION_DAYS)、feature-flag.env の RAPID_CROSSCHECK_MODE、HOUSEKEEP_DB_CONN_REF の要否(RAPID_CROSSCHECK_MODE=off で無い・空なら final-crosscheck.env の FINAL_DB_CONN_REF の有無も。shared_rules.housekeep_rules.db_requirement)、RELAY_GATE_ARTIFACT_ROOT の存在。検査の順は (a) 引数 → (b) housekeep.env(存在・読み取り・入力の守備範囲・HOUSEKEEP_RETENTION_DAYS)→ (c) feature-flag.env(存在・読み取り・入力の守備範囲・RAPID_CROSSCHECK_MODE)→ (d) HOUSEKEEP_DB_CONN_REF の要否(必要なときだけ final-crosscheck.env の存在・読み取り・入力の守備範囲・FINAL_DB_CONN_REF)→ (e) RELAY_GATE_ARTIFACT_ROOT とし、最初に設定エラーを見つけた段で検査を止める(以降の段は検査せず、その error 行(と hint)だけを出す。conventions.output_format.stderr。1 つのファイルの入力の守備範囲の違反が複数行あるときの出し方は config_input_rules に従う)。ここでの失敗は終了コード 2 で終え、手順 1 以降を行わない(削除待ちの置き場の残りも消さない)"
      - "1. 削除待ちの置き場 $RELAY_GATE_ARTIFACT_ROOT/housekeep-pending/ に残っているものを判定せず無条件に削除する(無ければ作る)。直下のエントリを名前の昇順(バイト順)に 1 つずつ削除し、失敗した `error: pending entry delete failed path: ...` もその順に出す(shared_rules.housekeep_rules.processing_sequence)。手順 0 を通ったときだけ行う"
      - "2. HOUSEKEEP_DB_CONN_REF があれば管理 DB に housekeep_del で接続する。接続失敗は error を出し、手順 3〜6 を行わず 6。HOUSEKEEP_DB_CONN_REF が無い・空なら(手順 0 を通ったので、管理 DB を一切使わない設置に限られる)、この時点で warn(management db is not configured ...)を 1 行出して接続しない"
      - "3. 成果物ルート(shared_rules.artifact_root_entries)を毎回走査し、管理 DB の parallel_runs 全行と合わせて実行の単位を作る"
      - "4. 実行の単位ごとに判定して削除する(shared_rules.housekeep_rules)"
      - "5. 管理 DB に接続したときだけ、確報比較依頼を依頼ごとに判定して削除する"
      - "6. 孤立した通知済みの印(印の置き場にあり、run ディレクトリも parallel_runs 行も無い run_id の印)を名前の昇順に置き場へ移して削除する"
    idempotency: "何度実行しても結果が同じ。直前の実行で削除し終えた状態のまま再実行すると、削除件数がすべて 0 で終了コード 0。置き場へ移したあとで失敗した成果物は次回の手順 1 で消え、管理 DB の行の削除に失敗した単位は次回の走査で再び見つかり、既に無いファイルは削除済みとして扱って行の削除を続ける。状態を更新せず、依頼を作成せず、プロセスを停止しない"
    notes:
      - "判定と削除の規則の正本は shared_rules.housekeep_rules。業務条件は RDRA 条件「ハウスキープの削除判定」「ハウスキープの削除順序と回復」"
      - "管理 DB の行の削除はハウスキープ専用 DB ロール housekeep_del(_cross-cutting/datastore/rdb-schema.yaml db_roles)だけで行う。他のコマンドは行と成果物を削除しない"
      - "実行ログ $RELAY_GATE_LOG_DIR/housekeep.sh.log に、削除した run_id と final_crosscheck_id を 1 件 1 行で残す。実行ログ自体はハウスキープの対象外(relay-gate は整理せず、設置環境の logrotate に任せる。arch CTR-006)"
      - "削除後のリラン: 成果物が消えて管理 DB の行だけが残った期限切れの実行を background-rerun.sh --role blue|green に指定すると、既存の `error: execution-spec not found run_id=... path: ...`(3)で終わる。--role rapid-crosscheck は execution-spec.json を読まないため、管理 DB の行が残っている間は依頼の再作成に成功し、新しい run が同じ単位に加わる(その run が終わって保持日数を過ぎるまで単位ごと残る)"

  - name: "background-rerun.sh"
    tier: "tier-ops"
    synopsis: "background-rerun.sh --source-run-id <RUN_ID> --role blue|green|rapid-crosscheck [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(background リラン専用ジョブ。hang-detector の alert 行 kind=background-exec-error を受けたときの推奨対処)/ 運用者(直接起動)"
    defined_in_uc: "実行復旧業務/background 側リランフロー/リラン対象を検証する"
    used_by_ucs:
      - "実行復旧業務/background 側リランフロー/元の execution-spec.json から復元して新しい run_id で起動する"
      - "実行復旧業務/background 側リランフロー/速報比較依頼だけを新規作成する"
      - "実行監視業務/background 実行監視フロー/ハング検知ジョブの異常終了を確認する"
      - "実行監視業務/background 実行監視フロー/ハング疑い・実行エラー・比較異常を通知する"
    args: []
    options:
      - name: "--source-run-id"
        type: "string"
        required: true
        description: "リラン元の run_id(新 run の parent_run_id になる)"
      - name: "--role"
        type: "enum"
        enum: ["blue", "green", "rapid-crosscheck"]
        required: true
        description: "リラン対象 role。blue / green は復元起動(UC『元の execution-spec.json から復元して新しい run_id で起動する』)、rapid-crosscheck は依頼の再作成のみ(UC『速報比較依頼だけを新規作成する』)。final-crosscheck を含む列挙外の値は `error: invalid value option=--role value=...` で終了コード 2(確報は正規ジョブで再実行する。synopsis と enum は一致させる)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "なし"
    stdout: "blue / green: 固定順 role, mode=background, pid, artifact_dir: ..., execution_spec: ..., run_id={新 run_id}, parent_run_id={元 run_id}。rapid-crosscheck: 固定順 role=rapid-crosscheck, job_id, request_status=REQUESTED, run_id={新 run_id}, parent_run_id={元 run_id}(元の依頼の job_id / parameters / blue_exit_code / green_exit_code を引き継ぐ。成果物 URI は持たない)。検証 NG 時は出さない"
    stderr: |-
      各 UC の tier-ops.md 出力契約表を転記(機械可読な正本)。`error:` 1 行 + 対処が明確なら `hint:` 1 行。
      事前検証(UC「リラン対象を検証する」):
      - `error: option required option=--source-run-id|--role`(2)
      - `error: invalid value option=--role value=...` / `error: invalid value option=--source-run-id value=...` / `error: unknown option option=...`(2)
      - `error: source run is not rerunnable run_id=... role=... mode=foreground status=...` + `hint: rerun the scheduler job instead (foreground slot / final crosscheck are not handled by background-rerun.sh)`(3)
      - `error: source run is not rerunnable run_id=... role=... mode=off status=-` + 同上 hint(3)
      - `error: source run is not rerunnable run_id=... role=... mode=background status=-` + `hint: source run has not started; rerun the scheduler job instead`(3。元 slot の started-at.txt が無い = 未起動。理由コード source_not_started。off でも off 以外でも同じ)
      - `error: source run is not rerunnable run_id=... role=... status=RUNNING` + `hint: abort the run with abort-{role}.sh --run-id {run_id} before rerun`(3。exitcode.txt も aborted.txt も無い。shared_rules.exitcode_to_status.slot_execution)
      - `error: source request is not rerunnable run_id=... role=rapid-crosscheck status=RUNNING` + `hint: abort the request with abort-rapid-crosscheck.sh --run-id {run_id} before rerun`(3)
      - `error: source request is not rerunnable run_id=... role=rapid-crosscheck status=REQUESTED|CLAIMED` + `hint: request is still queued; wait for the worker or abort it with abort-rapid-crosscheck.sh --run-id {run_id} before rerun`(3)
      - `error: source request not found run_id=... role=rapid-crosscheck` + `hint: rapid crosscheck request is created only when both slots succeeded`(3。RAPID_CROSSCHECK_MODE が off 以外のときのみ)
      - `error: management db is not configured (RAPID_CROSSCHECK_MODE=off) run_id=... role=rapid-crosscheck`(3。off 時の --role rapid-crosscheck は管理 DB 接続前にこの 1 行で終了。abort 系と同じ文言)
      - `error: execution-spec not found run_id=... path: ...`(3。--role blue|green のみ。--role rapid-crosscheck は execution-spec.json を読まない)
      - `error: execution-spec is not readable run_id=... path: ...`(6。存在するが読めない / JSON 不正 / 必須キー欠落は末尾に ` missing=...`)
      - `error: management db connection failed run_id=... role=... conn_ref=...`(6。RAPID_CROSSCHECK_MODE が off 以外での接続失敗。ui-design.md の管理 DB 障害の定型文)
      - `error: management db query failed run_id=...`(6。RAPID_CROSSCHECK_MODE が off 以外での SELECT 失敗。--role rapid-crosscheck の依頼・rapid_runs の参照)
      復元起動(UC「元の execution-spec.json から復元して新しい run_id で起動する」):
      - `error: runner failed to start run_id=... role=... runner=...`(6。起動前に INSERT した slot_executions 行は status=FAILED / completed_at にベストエフォートで UPDATE する。facade.sh の exit 6 と同じ扱い)
      - `error: artifact dir is not writable path: ...`(6)
      - `error: management db insert failed table=... run_id=...`(6)
      依頼再作成(UC「速報比較依頼だけを新規作成する」):
      - `error: management db insert failed table=... run_id=...`(6)
    exit_codes:
      - code: 0
        meaning: "検証を通過し、新 run_id で runner を起動して管理レコードを RUNNING にした(runner の完了は待たない)、または速報比較依頼を REQUESTED で作成し COMMIT した"
        condition: "後続処理完了"
      - code: 2
        meaning: "入力検証エラー(状態を読まない)"
        condition: "--source-run-id / --role 欠落、role が列挙外(final-crosscheck を含む)、run_id 形式不正、未知オプション"
      - code: 3
        meaning: "事前検証 NG(状態を変更しない)"
        condition: "--role blue|green: 元 mode が foreground / off(execution-spec.json に slots.{role} 節が無い = off)、元 slot が RUNNING(exitcode.txt も aborted.txt も無い)、元 slot が未起動(started-at.txt なし。status=-)、execution-spec.json なし。元 slot の状態は off でも off 以外でも常にファイル正本(shared_rules.exitcode_to_status.slot_execution)で判定し、ABORTED(aborted.txt あり)/ SUCCEEDED / FAILED はリラン可。--role rapid-crosscheck: 依頼が REQUESTED / CLAIMED / RUNNING、依頼(rapid_crosscheck_requests)・rapid_runs なし、RAPID_CROSSCHECK_MODE=off(管理 DB 未設定)。rapid-crosscheck では execution-spec.json の有無を検証せず、成果物 URI の存在確認も行わない(元実行は管理 DB だけで特定する)"
      - code: 6
        meaning: "実行エラー"
        condition: "execution-spec.json 読み取り失敗(JSON 不正・必須キー欠落を含む)、成果物ディレクトリ作成・spec 保存失敗、runner 起動失敗、run_id 発行の再試行上限(3 回)超過、runner 起動前の管理 DB 接続・INSERT・COMMIT 失敗(起動後の slot_executions.pid UPDATE と parallel_runs STARTED→RUNNING UPDATE の失敗は runner 起動済みのため終了コードに反映せず実行ログ ERROR のみ)"
    idempotency: "起動のたびに新 run_id を発行する(同じ元 run_id から複数回リランすれば系譜が伸びる)。blue / green は新 run ディレクトリへ元 execution-spec.json をコピーし run_id / parent_run_id / restored_at を書き換える。RAPID_CROSSCHECK_MODE が off 以外のとき新 run の parallel_runs(status=STARTED)と slot_executions を facade.sh と同じく runner 起動前に pid=NULL / status=RUNNING で INSERT し、起動後に pid を UPDATE してから parallel_runs を STARTED → RUNNING に条件付き UPDATE する(runner の終端 UPDATE より先に行が存在することを保証する。起動失敗時は slot_executions を status=FAILED にベストエフォートで UPDATE。起動後の pid UPDATE / STARTED→RUNNING UPDATE の失敗は runner 起動済みのため終了コードに反映せず実行ログ ERROR のみ。shared_rules.state_codes.parallel_run_transitions)。この run の parallel_runs は background slot の終端時に slot runner が RUNNING → COMPLETED にする(shared_rules.state_codes.parallel_run_transitions)。rapid-crosscheck は execution-spec.json を必須とせず(元実行は rapid_crosscheck_requests / rapid_runs / parallel_runs から特定)、新 run の parallel_runs(execution_spec_uri は元 run の値を引き継ぐ)・rapid_runs と依頼を INSERT する(canonical C3)。rapid-crosscheck リランで作られた run(execution-spec.json を持たない)を再び --source-run-id に指定できる(数珠つなぎ可。SPEC-009-01)"
    notes:
      - "--role rapid-crosscheck の事前検証順: feature-flag.env の RAPID_CROSSCHECK_MODE(off なら 3)→ rapid_crosscheck_requests(run_id)の存在と status。新しい依頼には元の依頼の job_id / parameters / blue_exit_code / green_exit_code を引き継ぐ(成果物 URI は使わない)。ファイルシステム(facade/<source_run_id>/)は読まない"
      - "--role blue|green の事前検証順: facade/<source_run_id>/execution-spec.json の存在・可読 → slots.{role} 節の有無(無し = mode off で 3)→ mode → 元状態(off でも off 以外でも成果物ファイルから導出: started-at.txt なし=未起動(status=-、3)/ exitcode.txt あり 0=SUCCEEDED / 非 0=FAILED / exitcode.txt なし・aborted.txt あり=ABORTED / どちらも無し=RUNNING(3))。slot_executions は事前検証に使わない(管理 DB は新 run の INSERT にだけ使う)"
      - "復元起動で runner へ引き継ぐ環境変数は facade.sh の notes と同じ(4 つ + RAPID_CROSSCHECK_MODE が off 以外なら RAPID_CROSSCHECK_RUNNER + 設定時の RELAY_GATE_NOW)。impl_version は元 execution-spec.json の値を使うため BLUE_IMPL / GREEN_IMPL は渡さない"
      - "rapid-crosscheck リランで作られた run の parallel_runs は、依頼の終端時に rapid-crosscheck-worker.sh が RUNNING → COMPLETED にする(shared_rules.state_codes.parallel_run_transitions)"
      - "成果物ルートは shared_rules.artifact_root_entries に従い facade/<run_id>/ だけを読み書きする(通知済みの印の置き場・削除待ちの置き場は読まず、run として扱わない)。ハウスキープで成果物が消えて管理 DB の行だけ残った期限切れの実行は、--role blue|green では既存の execution-spec not found(3)になり、--role rapid-crosscheck は execution-spec.json を読まないため行が残っている間は成功する(shared_rules.housekeep_rules.race)"

  - name: "abort-blue.sh"
    tier: "tier-ops"
    synopsis: "abort-blue.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(直接起動。hang-detector の alert 行 kind=hang-suspected を受けたときの推奨対処)/ ジョブスケジューラ(--yes 付き)"
    defined_in_uc: "実行復旧業務/実行中止フロー/現在状態を確認して停止確認に応答する"
    used_by_ucs:
      - "実行復旧業務/実行中止フロー/実行を ABORTED へ遷移させる"
      - "実行監視業務/background 実行監視フロー/ハング検知ジョブの異常終了を確認する"
      - "実行監視業務/background 実行監視フロー/ハング疑い・実行エラー・比較異常を通知する"
      - "実行復旧業務/background 側リランフロー/リラン対象を検証する"
    args: []
    options:
      - name: "--run-id"
        type: "string"
        required: true
        description: "対象 run_id。facade/<run_id>/execution-spec.json の slots.blue.mode が background かつ成果物から導出した状態が RUNNING(started-at.txt あり・exitcode.txt なし・aborted.txt なし)のとき ABORTED へ(aborted.txt を書く。RAPID_CROSSCHECK_MODE が off 以外なら管理 DB も更新)。対象 run に REQUESTED で未着手の速報比較依頼があればそれも ABORTED にする(条件「slot 中止可否判定」)"
      - name: "--yes"
        type: "boolean"
        required: false
        default: false
        description: "停止確認プロンプトを省略して yes とみなす(非対話起動用)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "停止確認の応答 1 行(yes 完全一致のみ肯定。--yes 指定時は読まない)"
    stdout: "現在状態(固定順 8 行): run_id, job_id, role, mode, status, pid, started_at, artifact_dir: ...。肯定応答後に status=ABORTED / aborted_at={ローカル日時}。否定応答時は status={現在状態}。表示元は成果物ファイル(execution-spec.json / started-at.txt / exitcode.txt / aborted.txt)。pid は RAPID_CROSSCHECK_MODE が off 以外なら slot_executions.pid、off では `-`"
    stderr: "プロンプト『対象ジョブのプロセスは強制終了してありますか？ [yes/no]: 』/ info: aborted by operator; status not changed / error: run not found run_id=... role=blue(3。facade/<run_id>/execution-spec.json が無い)/ error: run is not abortable run_id=... role=blue mode=... status=...(3。slots.blue 節が無い = mode=off status=-、mode=background 以外(mode=off|foreground)、未起動(status=-)、終端済み(SUCCEEDED / FAILED)、中止済み(ABORTED)で管理 DB も更新済みまたは off)/ error: run is not abortable (state changed concurrently) ...(3。再確認時に exitcode.txt / aborted.txt が現れた)/ warn: aborted.txt already published; management db updated(0。再適用)/ error: management db update failed run_id=... role=blue conn_ref=... + hint: rerun abort-blue.sh --run-id ... to reapply(6)/ error: interactive confirmation required (use --yes for non-interactive)(2)"
    exit_codes:
      - code: 0
        meaning: "yes 応答後に aborted.txt を公開した(条件「slot 中止可否判定」。ファイル正本で ABORTED が成立)。RAPID_CROSSCHECK_MODE が off 以外なら加えて slot_executions(`WHERE run_id=? AND slot='blue' AND status='RUNNING'`)と parallel_runs(`WHERE status IN ('STARTED','RUNNING')`。COMPLETED は更新しない。0 件で可)を条件付き UPDATE で ABORTED にする。slot_executions の UPDATE が 0 件(管理 DB 側が既に終端・中止済み)でも実行ログに `WARN management db not updated run_id=... role=blue` を残して 0(runner の終端 UPDATE が先に COMMIT 済みの場合、aborted.txt は残るが状態導出は exitcode.txt を優先するため中止は成立していない。再確認: abort-<role>.sh の現在状態表示(ファイル正本から導出)。run-lineage.sh は run_status(parallel_runs 由来)のみで slot の状態は表示しない)。RAPID_CROSSCHECK_MODE が off 以外なら加えて rapid_crosscheck_requests を条件付き UPDATE(`WHERE run_id=? AND status='REQUESTED'`)で ABORTED(completed_at=now)にする。0 件は正常(依頼が無い、または CLAIMED / RUNNING / 終端済み)。この UPDATE は競合窓の保険であり、dispatcher 側の中止済み run 判定と併用する(notes)。CLAIMED / RUNNING の依頼は変更しない(REQUESTED / CLAIMED / RUNNING の明示中止は abort-rapid-crosscheck.sh)。確報比較依頼(final_crosscheck_requests)には適用しない。off では管理 DB に触れず aborted.txt だけで完了する"
        condition: "aborted.txt を .tmp → mv で公開した(off 以外は管理 DB の UPDATE も試行済み)"
      - code: 2
        meaning: "入力検証エラー"
        condition: "--run-id 欠落・形式不正 / 未知オプション / 非 TTY で --yes なし"
      - code: 3
        meaning: "業務エラー"
        condition: "対象 run が無い(execution-spec.json なし)/ 応答が yes 以外 / 中止不可(mode が background でない、started-at.txt なし = 未起動、exitcode.txt あり = 終端済み、aborted.txt あり = 中止済みで管理 DB も更新済みまたは off)"
      - code: 6
        meaning: "実行エラー"
        condition: "aborted.txt の書き込み失敗 / 管理 DB 接続・SQL 失敗(aborted.txt は公開済みのまま残す。stderr に `error: management db update failed ...` と `hint: rerun abort-blue.sh --run-id ... to reapply`)"
    idempotency: "順序: 成果物再確認(shared_rules.exitcode_to_status.slot_execution)→ aborted.txt を .tmp → mv で公開 → (RAPID_CROSSCHECK_MODE が off 以外)1 トランザクションで slot_executions を条件付き UPDATE → `SELECT 1 FROM parallel_runs WHERE run_id = ? FOR UPDATE`(無条件の行ロック。parallel_runs が COMPLETED(foreground 中継済み)でも行ロックを取り、rapid-crosscheck-runner.sh の FOR UPDATE と直列化する。条件付き UPDATE だけでは COMPLETED の run で 0 件となり行ロックを取らないため)→ parallel_runs / rapid_crosscheck_requests(REQUESTED のみ)を条件付き UPDATE。再適用(冪等): aborted.txt が既にあり、off 以外で管理 DB の slot_executions.status が RUNNING(または parallel_runs が STARTED / RUNNING)のままなら、プロンプト(または --yes)の後に aborted.txt を書き直さず管理 DB だけ更新し、stdout `status=ABORTED` / stderr `warn: aborted.txt already published; management db updated` で 0。再適用時も rapid_crosscheck_requests の同じ条件付き UPDATE を試みる(0 件で可)。aborted.txt があり管理 DB も更新済み(または off)なら 3(`error: run is not abortable ... status=ABORTED`)。実行ログに operator= と answer= を残す"
    execution_log:
      - "`INFO status changed from=RUNNING to=ABORTED operator=... answer=yes`(slot の中止。answer は yes または yes(--yes))"
      - "`WARN management db not updated run_id=... role=blue`(RAPID_CROSSCHECK_MODE が off 以外。slot_executions の UPDATE が 0 件)"
      - "`INFO rapid request aborted run_id=... from=REQUESTED to=ABORTED operator=... answer=yes`(RAPID_CROSSCHECK_MODE が off 以外。未着手の速報比較依頼を ABORTED にしたときだけ。0 件のときはログを出さない(正常)。--verbose 時は stderr に `info: rapid request aborted run_id=...`)"
    notes:
      - "対象の現在状態は成果物ファイルから導出する(条件「slot 実行の状態導出規則」): started-at.txt なし = 未起動で 3 / exitcode.txt あり = 終端済みで 3 / aborted.txt あり = 中止済み(再適用条件を除き 3)/ どちらも無し = RUNNING(中止可)。mode は execution-spec.json の slots.blue.mode(background 以外は 3)。RAPID_CROSSCHECK_MODE=off でも中止は成立する(管理 DB が無い旨のエラーは出さない)"
      - "aborted.txt の内容は中止日時 1 行(UTC ISO 8601 秒精度 Z 付き。RELAY_GATE_NOW 設定時はその値)。artifact_layout.files の aborted.txt を参照。stdout の `aborted_at=` はこの UTC 値をローカルタイムゾーンへ変換した同時刻(指示子なし)。`started_at=` も started-at.txt の値をローカルへ変換して表示する"
      - "未着手の速報比較依頼の中止(条件「slot 中止可否判定」): 対象 run の rapid_crosscheck_requests が REQUESTED(未 claim)なら同じ実行で ABORTED にする(shared_rules.state_codes.request_status_transitions の REQUESTED → ABORTED)。stdout の固定 8 行と status=ABORTED / aborted_at= は変えない(依頼の状態は出さない)。CLAIMED / RUNNING の依頼は本コマンドでは変更しない"
      - "REQUESTED → ABORTED は競合窓の保険(条件「slot 中止可否判定」/ 状態「クロスチェック依頼」REQUESTED → ABORTED): 両系の完了通知で速報比較依頼が REQUESTED で作成された直後に運用者が slot を中止した場合の競合窓を塞ぐ。dispatcher 側の中止済み run 判定(rapid-crosscheck-runner.sh request_creation_matrix。対象 slot の slot 実行 ABORTED を判定キーに含む)と併用する。ロック順: rapid-crosscheck-runner.sh は parallel_runs を FOR UPDATE で読み、本コマンドも parallel_runs の行を無条件に `SELECT 1 FROM parallel_runs WHERE run_id = ? FOR UPDATE` でロックしてから条件付き UPDATE に進むため、parallel_runs が COMPLETED でも両者は直列化される(runner が先なら本コマンドの行ロック取得が runner の COMMIT を待った後に requests UPDATE が到達する)"
      - "CLAIMED / RUNNING の依頼は本コマンドでは変更しない。REQUESTED / CLAIMED / RUNNING の速報比較依頼の明示中止は abort-rapid-crosscheck.sh(条件「依頼中止可否判定」。status IN 条件付き UPDATE)で行う。CLAIMED のまま残すと lease 失効で REQUESTED に戻り再 claim されるため、中止済み run の依頼は abort-rapid-crosscheck.sh で止める"

