uc: "保持日数を過ぎた終了済みの実行と確報比較依頼を判定する"
business: "ハウスキープ業務"
buc: "ハウスキープフロー"

bounded_context_id: "BC-006"

models:
  - name: "HousekeepArgs"
    tier: "tier-ops"
    layer: "presentation"
    type: "request"
    rdra_info: "ハウスキープ設定"
  - name: "HousekeepCommand"
    tier: "tier-ops"
    layer: "usecase"
    type: "command"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "RetentionCutoff"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "ハウスキープ設定"
  - name: "RunUnit"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "MemberJudgement"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "slot 実行"
  - name: "UnitJudgement"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "FinalRequestJudgement"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
  - name: "HousekeepConfigRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "ハウスキープ設定"
  - name: "feature flag 設定(RAPID_CROSSCHECK_MODE)"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "feature flag 設定"
  - name: "final-crosscheck.env(FINAL_DB_CONN_REF の有無だけ)"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "確報クロスチェック worker 設定(バリエーション「設定所有区分」の値。RDRA 情報に無い。接続参照名の要否の判定だけに使う)"
  - name: "ArtifactRunRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "Runner Result"
  - name: "ManagementDbRunRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "facade/<run_id>/execution-spec.json"
    tier: "tier-ops"
    layer: "gateway"
    type: "record"
    rdra_info: "実行設定(execution-spec)"
  - name: "facade/<run_id>/<role>/exitcode.txt / aborted.txt"
    tier: "tier-ops"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"
  - name: "ValidateHousekeepArgs"
    tier: "tier-facade"
    layer: "presentation"
    type: "request"
    rdra_info: "ハウスキープ設定"
  - name: "ValidateHousekeepCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "query"
    rdra_info: "ハウスキープ設定"
  - name: "RetentionDaysRule"
    tier: "tier-facade"
    layer: "domain"
    type: "value-object"
    rdra_info: "ハウスキープ設定"
  - name: "HousekeepEnvRecord"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "ハウスキープ設定"

tables:
  - name: "parallel_runs"
    rdra_info: "並行稼働実行(parallel_run)"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "parent_run_id"
            value: ""
          - name: "status"
            value: ""
          - name: "completed_at"
            value: ""
        where: "条件なし(全行)。実行の単位をリランの親子で組み立てるため、成果物ディレクトリの有無にかかわらず全行が必要。1 日 1 回の起動で、行数は保持日数分に限られる。HOUSEKEEP_DB_CONN_REF があるときだけ housekeep_del で実行する"
    indexes_needed: []
  - name: "slot_executions"
    rdra_info: "slot 実行"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "slot"
            value: ""
          - name: "status"
            value: ""
          - name: "completed_at"
            value: ""
        where: "条件なし(全行)。parallel_runs の全行と run_id で突き合わせて実行ごとの終端と終了日時を判定する。範囲と理由は parallel_runs と同じ"
    indexes_needed: []
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "status"
            value: ""
          - name: "completed_at"
            value: ""
        where: "条件なし(全行)。REQUESTED / CLAIMED / RUNNING の依頼を含む単位を残し、終端した依頼の completed_at を終了日時に含めるため。範囲と理由は parallel_runs と同じ"
    indexes_needed: []
  - name: "final_crosscheck_requests"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
    operations:
      - type: "SELECT"
        columns:
          - name: "final_crosscheck_id"
            value: ""
          - name: "completed_at"
            value: ""
        where: "status IN ('SUCCEEDED', 'FAILED', 'ABORTED') AND completed_at < ?(cutoff。ホストで生成したローカル日時のバインド値)ORDER BY completed_at, final_crosscheck_id。既存の idx_final_crosscheck_requests_status_requested_at の先頭列 status で絞れる"
    indexes_needed: []

kvs: []
object_storage: []
