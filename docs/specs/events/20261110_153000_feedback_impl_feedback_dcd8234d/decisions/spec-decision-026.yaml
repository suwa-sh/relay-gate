schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-026"
title: "env 形式の設定で、前後の空白(半角空白とタブ)を除いた結果が # で始まる行を、全 env 設定ファイル共通でコメント行にする"
status: "approved"
generated_at: "2026-11-03T13:50:00Z"
context: |
  - CLI 契約の env 形式の入力規則(config_input_rules.env_files)は、コメントを「行頭 `#`」の行と定めていた。
    先頭に空白がある `#` 行(例 `  # メモ`)は、`=` を含まなければ invalid line(終了コード 2)になり、`=` を含めばキーが `#` で始まる行として読まれ得た。
  - 実装は設定ファイルによって扱いが分かれていた。feature flag 設定の読み込みは行全体の前後の空白を除いてから判定するため、この行をコメントとして扱う。
    速報クロスチェック設定の読み込みは行頭の `#` だけをコメントとし、この行を invalid line にする。
  - 2026-11-03 の前回の仕様の更新(spec-decision-023)は、この違いを feature flag 設定の読み込みと契約の差分の一部として参考に記録していた。
  - 2026-11-03 に利用者が、契約を「前後の空白を除いて `#` で始まる行はコメント」に改めると決めた。字下げしたコメントは書かれやすく、エラーにすると不便なため。
    要求(SPEC-004-04 / REQ-004)と RDRA は行の形式を持たないため、仕様(CLI 契約)だけの変更とする。
decision: |
  1. config_input_rules.env_files のコメント行の定義を「行の前後の空白(半角空白とタブ)を除いた結果が `#` で始まる行はコメント行とし、キーと値を取り出さない」に改める。
     この判定は `=` での分割より先に行い、コメント行の中に `=` があってもコメント行のままとする。
     例: `# x` / `  # x` / タブ + `# x` / `  # A=B` はいずれもコメント行。
  2. 今の規則は変えない。
     - 空白だけの行は前後の空白を除くと空になるためコメント行ではなく、invalid line(終了コード 2)のまま。
     - キーが空の行と `=` を含まない行は invalid line のまま。
     - `KEY=#abc` はコメント行ではなく、キー KEY・値 `#abc` のまま。行の途中の `#` を行末コメントとして扱う規則は作らない。
     - バイト・改行の規則(NUL / UTF-8 / CR の拒否)はコメント行にも適用する。
  3. この定義は env 形式の全設定ファイル(feature-flag.env / rapid-crosscheck.env / hang-detector.env / final-crosscheck.env / housekeep.env)に共通とする。
     各設定契約は独自のコメントの規則を持たず、config_input_rules.env_files を参照する。
     独自に書いていた箇所を揃える: shared_rules.compare_command_argv.split の再掲、config_files の feature-flag.env の format、
     出力規約(ui-design.md)の入力の守備範囲の定型文、UC「feature flag を設定する」の tier-facade.md の形式の節、
     UC「比較ツールで日次全量比較を実行して結果を保存する」の tier-final-crosscheck.md の final-crosscheck.env の説明。
  4. CSV(ジョブマップ)のコメント行は行頭 `#` の行のまま変えない(今回の決定は env 形式だけが対象)。
  5. BDD を加える: UC「feature flag を設定する」の tier-facade.md に字下げしたコメント行を読み飛ばす例と `BLUE_IMPL=#v1` を値として読む例、
     UC「クロスチェックのジョブマップと比較定義を定義する」の tier-facade.md に速報クロスチェック設定で字下げしたコメント行を読み飛ばす例。
  6. 実装は変えない(実装を契約に合わせる対象として記録する)。実装との差分:
     - 速報クロスチェック設定の読み込み(facade の repository の rapid_crosscheck_env.sh)は、行頭の `#` だけをコメントとする。
       字下げした `#` 行は、`=` を含まなければ invalid line にし、`=` を含めば(例 `  # A=B`)キー `# A` の行として読んでキーの一覧に載せる。新しい契約ではどちらもコメント行。
       外から見える違いは前者(invalid line で終了コード 2)で、UC「クロスチェックのジョブマップと比較定義を定義する」の tier-facade.md の BDD(字下げした `# memo` の行)で検出できる。
       後者は、速報クロスチェック設定の検証が未知キーの warn を出さないため、今の契約の出力では違いが見えない(キーの一覧は契約に無い --verbose の補助出力にだけ現れる)。
     - 同じ読み込みは、キーと値の前後の空白を `[:space:]` で除くため、半角空白とタブ以外の空白類(垂直タブ・改ページ)も除く。契約の空白は半角空白とタブだけである(参考)。
     - feature flag 設定の読み込み(facade の repository の feature_flag_config.sh)は、行全体の前後の空白を除いてから `#` を判定するため、字下げしたコメント行の扱いは新しい契約どおり。
       ただし前後の空白を `[:space:]` で除くため、半角空白とタブ以外の空白類(垂直タブ・改ページ)も除く。契約の空白は半角空白とタブだけである(参考)。
     - hang-detector.env / final-crosscheck.env / housekeep.env の読み込みは未実装(実装済みの env の読み手は facade の上記 2 つだけ)のため、差分は無い。実装時に本決定の定義で作る。
     - spec-decision-023 の「行頭に空白がある `#` 始まりの行もコメントとして読み飛ばす(契約のコメントは行頭 `#`)」という差分の記録は、本決定で契約側が改まったため差分ではなくなった。
       spec-decision-023 は過去の判断の記録として書き換えない。同じ決定のほかの差分(キーが空の行の読み飛ばし、`=` の無い行の扱い、空白だけの行の読み飛ばし)は残る。
consequences:
  positive:
    - "字下げしたコメント行が、どの env 設定ファイルでも同じ結果(コメント行として読み飛ばす)になる"
    - "字下げしたコメントを書いても設定エラーにならず、設定ファイルを書きやすくなる"
  negative:
    - "速報クロスチェック設定の読み込みは、実装を契約に合わせるまで契約と一致しない(実装の変更が必要)"
    - "`  #KEY=VALUE` のように字下げしてキーをコメントアウトしたつもりの行は、今後は確実にコメントになる。これに依存して値を読ませていた設定は無い前提である(従来も invalid line かキーが # で始まる行で、正しい値としては読まれていなかった)"
alternatives_considered:
  - name: "コメントは行頭 # の行のままとし、字下げした # 行は invalid line に揃える"
    reason_rejected: "字下げしたコメントは書かれやすく、エラーにすると不便。利用者は前後の空白を除いて判定する方に揃えると決めた"
  - name: "行の途中の # 以降も行末コメントとして扱う"
    reason_rejected: "値に # を含む設定(パスや比較ツールの引数)を壊す。`KEY=#abc` を値 #abc のまま読む利用者の決定とも合わない"
