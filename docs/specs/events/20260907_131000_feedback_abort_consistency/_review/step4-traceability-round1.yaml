    claim: "残存 #16 の経路説明「blue(foreground)実行中に background の green を abort-green で中止 → … 後から blue が成功して完了通知を送る(parallel_runs も ABORTED ではない)→ 依頼が作成される」は Spec と矛盾する: foreground blue が実行中なら parallel_runs は RUNNING であり、abort-green は parallel_runs を `WHERE status IN ('STARTED','RUNNING')` で ABORTED に併更新する(契約 abort-blue.sh/abort-green.sh exit 0 meaning、状態.tsv L39「並行稼働実行 RUNNING → ABORTED」)ため、後続の blue の完了通知は reason=parallel_run_aborted で除外され依頼は作られない。同じ経路説明は L41「対応方針」にも書かれている(change-brief D4 の記述をそのまま写した結果で、経路そのものが成立しない)"
    fix: "経路を成立する順序に書き直す。例: 「foreground の blue が完了して parallel_runs が COMPLETED になったが blue の完了通知の送信に失敗した(条件「完了通知失敗の扱い」)→ 運用者が abort-green で green を中止(parallel_runs は COMPLETED のまま)→ green の実装が走り切って完了通知(対象 slot green が ABORTED なので依頼は作らず green_status=SUCCEEDED を記録)→ 運用者が blue 側の runner を同一引数で再実行(対象 slot blue は ABORTED でなく parallel_runs も COMPLETED)→ 両系成功で依頼が作成される」。L13 の理由列と L41 の対応方針の両方を同じ経路に揃え、「foreground 実行中に background を中止」の表現を外す。経路が成立しないと判断するなら #16 自体を取り下げる(仮採用は書かない)"
    source_refs:
