findings:
  - id: "S4-datastore-1"
    severity: "minor"
    artifact: "rdb-schema.yaml"
    file: "docs/specs/events/20260907_131000_feedback_abort_consistency/_cross-cutting/datastore/rdb-schema.yaml"
    viewpoint: 3
    location: "_review_notes「ロック順(デッドロック検討)」"
    title: "abort-blue / abort-green(parallel_runs → requests)と abort-rapid-crosscheck(requests → parallel_runs)の順序逆転が検討対象に入っていない"
    detail: "CR-017 で abort-rapid-crosscheck の requests UPDATE が REQUESTED を含むようになったため、abort-blue / abort-green の requests UPDATE(status='REQUESTED')と同じ行を対象にし得る。両コマンドの取得順は逆(abort-blue: parallel_runs 無条件 FOR UPDATE → requests / abort-rapid-crosscheck: requests → parallel_runs 条件付き UPDATE)だが、注記は「worker と同じ順のためデッドロックしない」と worker との比較しか書いていない。実際には (a) 通常 run は依頼が存在する時点で parallel_runs が COMPLETED(foreground 中継済み)であり abort-rapid-crosscheck の条件付き UPDATE(status IN ('STARTED','RUNNING'))は行ロックを待たず 0 件になる、(b) parallel_runs が RUNNING のまま依頼が存在するのは background-rerun --role rapid-crosscheck 由来の run だけで、その run には abort-blue / abort-green の対象となる slot 実行が無い(契約 abort-rapid-crosscheck.sh exit 0 meaning の記述と同じ根拠)ため、逆順でも相互待ちは起きない。この根拠が注記に無く、順序逆転を見た読者がデッドロック未検討と判断する"
    suggestion: "ロック順の注記に 1 文追加する: 「abort-blue / abort-green(parallel_runs → requests)と abort-rapid-crosscheck(requests → parallel_runs)は取得順が逆だが、依頼が存在する通常 run の parallel_runs は COMPLETED のため abort-rapid-crosscheck の条件付き UPDATE は行ロックを取らず(0 件)、parallel_runs が RUNNING のまま依頼を持つ rerun --role rapid-crosscheck 由来の run には abort-blue / abort-green の対象 slot 実行が無いため、両者が同時に両テーブルの行ロックを持つ組合せは生じない」。契約 abort-rapid-crosscheck.sh 側は変更不要"
    source_refs:
      - "docs/specs/events/20260907_131000_feedback_abort_consistency/_review/change-brief.md D2-1 / D2-5(ロック順)"
      - "docs/specs/events/20260907_131000_feedback_abort_consistency/_cross-cutting/api/cli-command-contract.yaml abort-rapid-crosscheck.sh exit_codes code 0 meaning(行 885)/ abort-blue.sh notes(行 802〜804)"
      - "docs/specs/events/20260907_131000_feedback_abort_consistency/実行復旧業務/実行中止フロー/実行を ABORTED へ遷移させる/_model-summary.yaml tables.parallel_runs / tables.rapid_crosscheck_requests"
      - "docs/rdra/latest/状態.tsv クロスチェック依頼 行 7 / 12 / 17"

