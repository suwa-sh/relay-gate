round: 2
# Step6.5 反証レビュー round 2。対象は round-1 findings(R-001〜R-005)の target とその修正で影響を受ける成果物のみ。
# 照合先: docs/rdra/latest/条件.tsv(9 / 18 / 19 / 42 / 43 行)、状態.tsv(slot 実行 21〜28 行)、docs/usdm/latest/requirements.yaml(SPEC-005-02 AC5 / AC6、SPEC-010-01 AC4 / AC8)、change-brief.md(D1〜D3)。
# 再検証結果(resolved に載った id):
#   R-001: 主要 target は修正済み(rdb-schema.yaml slot_executions.status 153 行 / 契約 shared_rules.exitcode_to_status.slot_execution 123 行 / UC-05 spec.md 141 行 / UC-09 tier-rapid-crosscheck.md 97 行)。
#          方針「条件付き UPDATE で一度だけ終端値を書き、abort 後に exitcode.txt が公開されても ABORTED のまま残す(aborted.txt のミラー)」は、RDRA 条件「中止済み run の比較依頼作成除外」(判定材料 = slot_executions.status はファイル正本 aborted.txt のミラー)・
#          USDM SPEC-005-02 AC6(中止後に走り切った green の完了通知でも依頼を作らない)・SPEC-010-01(中止後に実装が終了した場合は exitcode.txt 優先で導出)のいずれとも矛盾しない。UC-09 spec.md の AC5 / AC6 シナリオ(Given に slot_executions(run_id, green).status=ABORTED と exitcode.txt=0 の両方)も同方針で成立する。
#          ただし周辺の「ファイル正本と同じ値を保持する二重マッピング(ファイル正本が優先)」の旧表現が残っており、同 id を minor で再掲する。
#   R-002: 契約 rapid-crosscheck-runner.sh idempotency(394 行)/ abort-blue.sh exit 0 meaning(783 行。abort-green.sh は「abort-blue.sh と同じ」で参照)/ UC-09 spec.md 111 行・tier 50 行 / UC-23 tier-ops.md 32 行に限定文が入った。UC-23 spec.md 側の 0 件説明に限定が無いため minor で再掲する。
#   R-003: 修正済み(UC-23 spec.md 280 行 `--artifact-uri file:///...`)。再掲しない。
#   R-004: 契約 444 行・459 行 / UC-11 tier-rapid-crosscheck.md 23 行 / _api-summary.yaml 14 行は列挙が広がった。UC-11 spec.md の分岐条件一覧だけが旧列挙のまま(minor で再掲)。
#   R-005: 修正済み(tier-final-crosscheck.md 65 行。条件「依頼中止可否判定」と FINAL_POLL_LIMIT_SEC を参照)。再掲しない。
# 反証点(finding にしなかったもの):
#   (a) hang-detector / background-rerun --role blue|green / abort-blue・abort-green の現在状態表示は slot_executions.status を読まずファイル正本で判定する(契約 slot_execution_readers 124 行 / hang-detector idempotency 619 行 / UC-22 tier-ops.md 70 行)ため、DB 列が ABORTED のまま残っても中止済み slot のリラン・ハング検知の終端判定は変わらない。
#   (b) run-lineage.sh の run_status は parallel_runs 由来で slot_executions.status を表示しない(UC「リラン結果を parent_run_id で追跡する」tier-ops.md 60 行は role 導出にのみ slot_executions を使う)ため、DB 列の ABORTED 残存が系譜表示の値を変えることはない。
#   (c) 契約 329 行(runner の終端 UPDATE)の「ファイル正本 exitcode.txt と同じ値を保持する二重マッピング」は「更新件数 0(既に ABORTED)は WARN のみ」と併記されているため、R-001 方針(再同期しない)と両立する。
