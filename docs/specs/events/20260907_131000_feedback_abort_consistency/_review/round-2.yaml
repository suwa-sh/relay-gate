    claim: "R-001 の方針(abort 後に exitcode.txt が公開されても slot_executions.status は ABORTED のまま残す)は RDRA 条件「中止済み run の比較依頼作成除外」(19 行「slot_executions.status(ファイル正本 aborted.txt のミラー)」)と USDM SPEC-005-02 AC6 に整合する一方、RDRA 条件「slot 実行の状態導出規則」(条件.tsv 9 行)の「速報クロスチェック有効時は管理 DB にも同じ状態を保持する」とは、この 1 経路(導出値 SUCCEEDED / FAILED、DB 列 ABORTED)で文言上一致しない。spec 側は 153 行 / 123 行 / 141 行で「一致しないのはこの経路だけ」と明示して USDM AC6 を優先しており矛盾ではないが、RDRA 条件 9 行の文言を「aborted.txt のミラーとして保持する(中止後に実装が終了した経路では導出値と一致しない)」へ寄せる要否が rdra-feedback.md(残存は SR-001 / SR-002 のみ)に記録されていない"
    evidence: "docs/rdra/latest/条件.tsv 9 行 vs 19 行 / docs/usdm/latest/requirements.yaml SPEC-005-02 AC6(288 行)/ rdb-schema.yaml 153 行 / cli-command-contract.yaml 123 行 / UC-05 spec.md 141 行 / _cross-cutting/rdra-feedback.md 38 行「残存は SR-001 / SR-002 のみ」"
    suggested_fix: "rdra-feedback.md の残存表に文言確認項目を 1 行追加する: 対象 = 条件「slot 実行の状態導出規則」の「管理 DB にも同じ状態を保持する」。内容 = 「管理 DB の slot_executions.status は aborted.txt のミラーとして条件付き UPDATE で一度だけ書き、中止後に実装が終了した経路では導出値(exitcode.txt 優先)と一致しない」に寄せる要否の確認(Spec 側は条件「中止済み run の比較依頼作成除外」と SPEC-005-02 AC6 に従い ABORTED を残す)。RDRA 側を変えない判断なら、その旨を同表に記録して閉じる"
