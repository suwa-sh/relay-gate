    evidence: "rdb-schema.yaml 128 行 vs 153 行 / UC-05 tier-facade.md 75・97 行 / UC-05 _model-summary.yaml 62 行 / UC-04 tier-facade.md 133 行・spec.md 174 行 / UC-23 tier-ops.md 88 行 / ui-design.md 197 行 / 実装切替ジョブ実行フロー buc-spec.md 5 行 / datastore-schema.md 165 行(生成物)/ RDRA 条件.tsv 19 行「slot_executions.status(ファイル正本 aborted.txt のミラー)」"
    suggested_fix: "残存箇所の「同じ値を保持する二重マッピング(ファイル正本が優先)」を「runner / abort-* の条件付き UPDATE(WHERE status='RUNNING')で一度だけ終端値を書く列。abort 後に実装が走り切って exitcode.txt を公開した経路だけファイル正本の導出値(exitcode.txt 優先)と一致せず ABORTED のまま残る(再同期しない。正本: rdb-schema.yaml slot_executions.status / 契約 shared_rules.exitcode_to_status.slot_execution)」の 1 文に置き換えるか、少なくとも「(ファイル正本が優先)」「整合に使う」の語を外して 153 行への参照を添える。datastore-schema.md は rdb-schema.yaml から再生成する"
