    evidence: "UC-23 spec.md 49 行・176 行 / UC-23 tier-ops.md 32 行 / cli-command-contract.yaml 783 行 / cli-command-contract.yaml 944〜970 行(run-lineage.sh stdout: run_status)/ UC「リラン結果を parent_run_id で追跡する」tier-ops.md 60 行"
