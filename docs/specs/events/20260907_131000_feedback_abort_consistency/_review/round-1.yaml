# 照合先: docs/rdra/latest(条件.tsv / 状態.tsv / バリエーション.tsv)、docs/usdm/latest/requirements.yaml(SPEC-005-02 / 010-01 / 010-02)、
#         docs/arch/events/20260907_122000_feedback_abort_consistency/_changes.md、_inputs-digest.md(LP-010 / LP-019 / LP-021 / LP-023 / LP-024 / CLP-004 / E-016 / E-017 / E-024)。
# 検証パス(Step3 / Step4 round 2 で fixed とされた指摘): すべて修正済みを確認した。
#   S3-G1-008: buc-spec(速報クロスチェックフロー)163 行の「速報クロスチェックモード」適用 UC に UC-09 が入っている
#   S3-G1-009: UC-11 _api-summary.yaml exit_codes[0].meaning に RUNNING 遷移 0 件の 0 が追記され、stdout の列挙も契約 444 行と同文
#   S3-G2-006 / S4-api-8: UC-23 tier-ops.md 52 行(出力契約)・245 行(BDD)・_api-summary.yaml 94 行が `(state changed concurrently) ... status=<再 SELECT した status>` / `status=SUCCEEDED` に揃っている
#   S4-api-7: UC-11 tier-rapid-crosscheck.md 23 行・_api-summary.yaml 14 行の request_status 列挙が契約と同文
#   S4-api-9: UC-27 tier-ops.md 35 行(エラー表)・139 行(BDD)の hint が契約 718 行と同文
# 反証点(a)〜(c)の確認結果(finding にしなかったもの):
#   (a) foreground 実行中に background slot を中止した経路は abort-* の parallel_runs 条件付き UPDATE(status IN ('STARTED','RUNNING'))で ABORTED になり、facade の COMPLETED 遷移は `WHERE status='RUNNING'` の条件付き UPDATE(UC-06 spec.md 74 行)のため ABORTED を上書きしない。後続の完了通知は parallel_run_aborted で除外される(D4 訂正のとおり #16 の経路は成立しない)。
#       foreground 中継後(COMPLETED)に中止できるのは background slot のみで、その完了通知は対象 slot の slot_execution_aborted で除外される。--role rapid-crosscheck のリラン由来 run は slot_executions 行なし・parallel_runs RUNNING で依頼作成が正しい。
#   (b) lease 失効解放の SQL は `WHERE status='CLAIMED' AND lease_until < ? AND started_at IS NULL`(UC-10 tier 58 行)で status 条件を含むため、CLAIMED → ABORTED 後の行(lease_until 残存・started_at NULL)が REQUESTED に戻ることはない。
#       表示後の終端 / claim 直後の中止 / lease 失効直後の中止は、abort 側の status IN 条件付き UPDATE と worker 側の status='CLAIMED' AND worker_id 条件付き UPDATE の組で片方だけが 1 件になり、状態が二重に進む経路は無い。
