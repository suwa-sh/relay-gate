uc: "実装スクリプトを実行して Runner Result を出力する"
business: "実装切替業務"
buc: "実装切替ジョブ実行フロー"
paths: []
x_cli_commands:
  - name: "$BLUE_RUNNER / $GREEN_RUNNER"
    tier: "tier-facade"
    role: "uses"
    synopsis: "<runner> --run-id <run_id> --job-id <JOB_ID> --role blue|green --mode foreground|background [--execution-spec <path>] [--help] -- [PARAM...]"
    invoked_by: "facade.sh / background-rerun.sh(内部呼び出し。環境変数 RAPID_CROSSCHECK_MODE、off 以外なら RAPID_CROSSCHECK_RUNNER、通常起動なら BLUE_IMPL / GREEN_IMPL を渡す)"
    args: []
    options:
      - name: "--execution-spec"
        type: "string"
        required: false
        description: "復元起動。ジョブマップを再解決せず slots.<role> の実行先と run 単位の params で起動する。parent_run_id が非 null の background slot は終端時に parallel_runs を COMPLETED にする"
    stdin: "なし(SSH は -n で stdin を閉じる。ローカル実行は /dev/null)"
    stdout: "なし(実装の stdout は facade/<run_id>/<role>/stdout.log へ)"
    stderr: "なし(実装の stderr は stderr.log へ。SSH 失敗は stderr.log 末尾に error: 1 行)"
    exit_codes:
      - code: "exitcode.txt の値"
        meaning: "実装の終了コードをそのまま返す(SSH 接続失敗は 6。仮採用)。0 → SUCCEEDED / 非 0 → FAILED(状態導出規則: exitcode.txt が無く aborted.txt があれば ABORTED)"
      - code: 2
        meaning: "復元起動の spec 欠落・PARAM 併用・二重起動 / RAPID_CROSSCHECK_MODE が off 以外のとき rapid-crosscheck.env 不在・RAPID_DB_CONN_REF 欠落 / RAPID_CROSSCHECK_MODE が off 以外で RAPID_CROSSCHECK_RUNNER 未設定・実行不可(exitcode.txt=2)"
      - code: 6
        meaning: "3 ファイルを揃えられない書き込み失敗 / 中止済み slot(exitcode.txt 無し・aborted.txt あり)での再起動(実装を再実行せず実行ログ `WARN slot already aborted run_id=... role=...` を残し exitcode.txt は書かない)。終端 UPDATE 0 件は `WARN management db not updated run_id=... role=...` のみで終了コードは変えない"
async_events:
  - name: "slot-completed"
    channel: "slot-completed"
    direction: "publish"
    message: "SlotCompletedNotice"
    summary: "3 ファイル確定後、RAPID_CROSSCHECK_MODE が off 以外(foreground / background)のときだけ、環境変数 RAPID_CROSSCHECK_RUNNER が指す速報クロスチェック runner の公開 function(blue-completed / green-completed)へ run_id / job_id / exit_code / artifact_uri を通知する。送信失敗は条件「完了通知失敗の扱い」(WARN のみ、終了コード不変)。契約の定義は UC「速報クロスチェック runner へ完了通知を送信する」"
schemas: []
