uc: "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"

bounded_context_id: "BC-002"
aggregate_id: "AG-003"

models:
  - name: "CronJobエントリポイント（完了検知ポーリング）"
    tier: "tier-worker"
    layer: "presentation"
    type: "state"
    rdra_info: "速報比較依頼"
  - name: "CreateRapidCrosscheckRequestCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "速報比較依頼"
  - name: "速報比較依頼"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較依頼"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較依頼"
  - name: "RunnerResultRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "ExecutionSpecRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "execution-spec.json"

tables:
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "SELECT"
        columns: ["run_id", "slot_type", "status"]
        where: "role = 'background' AND status IN ('SUCCEEDED','FAILED') AND run_id IN (SELECT run_id FROM execution_specs WHERE job_id NOT IN (SELECT job_id FROM rapid_crosscheck_requests))"
    indexes_needed:
      - columns: ["role", "status"]
        reason: "未依頼の完了済みbackground実行を効率的に抽出するため"
        access_pattern: "role+status複合条件検索（CronJob毎回実行）"
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    operations:
      - type: "SELECT"
        columns: ["run_id", "job_id"]
        where: "run_id IN (SELECT run_id FROM runner_results WHERE role = 'background' AND status IN ('SUCCEEDED','FAILED'))"
    indexes_needed:
      - columns: ["job_id"]
        reason: "run_idをキーにjob_idを引き当て、job_id単位でblue/green双方の完了をペアリング判定するため（runner_resultsにはjob_id属性が存在しないためJOINが必須）"
        access_pattern: "run_id→job_id引当およびjob_id単位グルーピング"
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    operations:
      - type: "INSERT"
        columns:
          - name: "job_id"
            value: "execution_specs.job_id（runner_results.run_idをexecution_specsとJOINして取得）"
          - name: "blue_run_id"
            value: "同一job_idのslot_type='blue'のrunner_results.run_id"
          - name: "green_run_id"
            value: "同一job_idのslot_type='green'のrunner_results.run_id"
          - name: "requested_at"
            value: "CronJob実行時刻"
          - name: "status"
            value: "REQUESTED固定"
        where: "blue_run_id・green_run_idともにrunner_results.status IN ('SUCCEEDED','FAILED')で確定していること（ペアリング完了時のみINSERT）"
    indexes_needed:
      - columns: ["job_id"]
        reason: "ユニーク制約: 同一job_idへの重複依頼作成を防止するため（CTP-006冪等性方針）。blue/green双方の完了ペアリングが揃った時点でjob_id単位に1件のみ作成する"
        access_pattern: "job_idユニーク制約チェック"

kvs: []
object_storage: []
