round: 1
findings:
  - id: "S-001"
    viewpoint: "依存の宣言（cross-UC暗黙参照）"
    severity: "blocker"
    target: "並行稼働実行業務/並行稼働実行フロー/background roleを起動する/_model-summary.yaml と、実行監視業務/ハング監視フロー/background実行の未完了・非0終了・速報比較異常を定期検知する/_model-summary.yaml、クロスチェック業務/速報クロスチェックフロー/blue-green runnerの完了通知を受けて速報比較依頼を作成する/_model-summary.yaml、実行制御業務/background側リランフロー/再実行対象のbackground実行・速報比較依頼を選択する/_model-summary.yaml、_cross-cutting/datastore/rdb-schema.yaml"
    claim: "Runner実行結果を書き込む唯一のUC「background roleを起動する」がINSERT先を runner_execution_results としているのに対し、これを参照する主要3UC（ハング検知・速報比較依頼作成・リラン対象選定）はいずれも runner_results をSELECTしている。rdb-schema.yamlは runner_results への正規化を明言し、かつ「background roleを起動する」を runner_results のINSERT元としてused_byに列挙しているが、実際のUC側_model-summary.yamlは正規化されておらず、実装するとSELECTが常に0件になる。"
    evidence: "並行稼働実行業務/並行稼働実行フロー/background roleを起動する/_model-summary.yaml:53 は `name: \"runner_execution_results\"`。実行監視業務/ハング監視フロー/.../_model-summary.yaml:41、クロスチェック業務/速報クロスチェックフロー/blue-green runnerの完了通知を受けて速報比較依頼を作成する/_model-summary.yaml:41,56、実行制御業務/background側リランフロー/再実行対象のbackground実行・速報比較依頼を選択する/_model-summary.yaml:53 はいずれも `name: \"runner_results\"` でSELECT。_cross-cutting/datastore/rdb-schema.yaml:97 に『UC側では一部 runner_execution_results という表記揺れが見られたため runner_results に正規化した』とあるが、同ファイル line 67-90 の used_by ブロックは『background roleを起動する』をrunner_resultsのINSERT元として列挙しており、正規化がUC側の実ファイルへ反映されていない。同様の表記揺れは 並行稼働実行結果を確認する、foreground roleの標準出力・標準エラー・終了コードを応答する、blue/green中止フロー4UC の_model-summary.yamlにも残存（いずれもrunner_execution_results側）。"
    suggested_fix: "『background roleを起動する』を含む runner_execution_results 表記のUC群（背景起動・foreground応答・並行稼働実行結果確認・blue/green中止フロー4UC）の _model-summary.yaml / spec.md / tier-*.md 内のテーブル名を rdb-schema.yaml の正規名 runner_results に一括置換する。置換後、rdb-schema.yamlのused_by欄と実際の読み書きUCが一致することを再検証する。"

  - id: "S-002"
    viewpoint: "契約生成適性 / 依存の宣言"
    severity: "blocker"
    target: "クロスチェック業務/確報クロスチェックフロー/全テーブル・全ファイルを対象に確報クロスチェックを実行する/spec.md, tier-worker.md, _cross-cutting/datastore/rdb-schema.yaml"
    claim: "確報クロスチェック実行UCが `target_tables`/`target_files` を execution_specs テーブルからSELECTしているが、rdb-schema.yaml上この2カラムは final_crosscheck_requests に属し、execution_specs には存在しない。生成されるSQLは存在しないカラムを参照し実装不能。"
    evidence: "全テーブル・全ファイルを対象に確報クロスチェックを実行する/spec.md 21-25行目: `DB_Table2[(\"execution_specs\\ntarget_tables/target_files\")]` および `SELECT target_tables, target_files FROM execution_specs WHERE run_id=?`。_cross-cutting/datastore/rdb-schema.yaml の execution_specs 定義（5-60行目付近）にtarget_tables/target_filesカラムは無く、345行目・349行目の final_crosscheck_requests 定義にのみ存在する。tier-worker.mdにも同じ誤ったSELECTが記載されている。"
    suggested_fix: "spec.md・tier-worker.mdのデータフロー図／SQL／シーケンス図を `SELECT target_tables, target_files FROM final_crosscheck_requests WHERE run_id=?`（または適切なキー）に修正する。"

  - id: "S-003"
    viewpoint: "一貫性（audit_logsスキーマ整合）"
    severity: "blocker"
    target: "_cross-cutting/datastore/rdb-schema.yaml, 実行制御業務/blue中止フロー・green中止フロー/対話確認のうえ...ABORTEDへ遷移させる/spec.md, 実行制御業務/速報比較中止フロー・確報比較中止フロー/対話確認のうえ...ABORTEDへ遷移させる/spec.md"
    claim: "rdb-schema.yamlのaudit_logsはカラム operator/operated_at/run_id/action（action値: rerun, abort, abort_confirm）と定義するが、実際にaudit_logsへINSERTする4つの確認系UCの記述は3通りに分裂しており、スキーマ定義どおりに書き込むUCが1つも無い。blue/green中止フローはカラム名 `operation` に値 `'abort'`（スキーマは `action` のみ定義）、速報/確報比較中止フローはカラム名は `action` だが日時カラムを `aborted_at`（スキーマは `operated_at`）としている。"
    evidence: "_cross-cutting/datastore/rdb-schema.yaml:497-500『action: 値: rerun, abort, abort_confirm』『operated_at: 操作日時』。実行制御業務/blue中止フロー/対話確認のうえblue background実行をABORTEDへ遷移させる/spec.md:24,28,69,121『INSERT INTO audit_logs (operator, operated_at, run_id, operation) VALUES (..., 'abort')』（greenも同一パターン）。実行制御業務/速報比較中止フロー/対話確認のうえ速報比較依頼をABORTEDへ遷移させる/spec.md:22,26,75,137『INSERT INTO audit_logs (operator, aborted_at, run_id, action) VALUES (..., 'abort_confirm')』（確報比較も同一パターン）。唯一 execution-spec.jsonの実行設定を保ったまま再実行する/spec.md はaction='rerun'で正しい。"
    suggested_fix: "audit_logsの正カラム名・値をrdb-schema.yaml基準（action列、値はrerun/abort/abort_confirm）に統一し、4つの確認系UC（blue/green中止フロー・速報/確報比較中止フロー）のspec.md/tier-*.mdのカラム名（operation→action）・日時カラム名（aborted_at→operated_at）・action値（blue/greenは現状'abort'だが、確認済みABORTED遷移時点のvalueとして'abort_confirm'に統一するかを含め）を修正する。"

  - id: "S-004"
    viewpoint: "トレーサビリティ"
    severity: "major"
    target: "実行制御業務/background側リランフロー/再実行対象のbackground実行・速報比較依頼を選択する/, 実行制御業務/確報比較中止フロー/RUNNING中の確報比較依頼の中止を依頼する/, 実行制御業務/速報比較中止フロー/RUNNING中の速報比較依頼の中止を依頼する/ の各フォルダ名およびspec-event.yaml"
    claim: "3つのUCについて、フォルダ名およびspec-event.yamlの`uc`フィールドがBUC.tsvの『UC』列（6列目）ではなく『アクティビティ』列（4列目）の値になっている。フォルダ名一致でトレーサビリティ検証を行うと誤って合格判定されるが、正式なUC名としては不正確。"
    evidence: "docs/rdra/latest/BUC.tsv 65-67行目: アクティビティ='再実行対象のbackground実行・速報比較依頼を選択する', UC='再実行対象のbackground実行・速報比較依頼を選択する'。同61-62行目: アクティビティ='RUNNING中の確報比較依頼の中止を依頼する', UC='RUNNING中の確報比較依頼の中止を依頼する'。同57-58行目: アクティビティ='RUNNING中の速報比較依頼の中止を依頼する', UC='RUNNING中の速報比較依頼の中止を依頼する'。spec-event.yamlの該当use_cases要素（例: 146行目付近 `uc: \"再実行対象のbackground実行・速報比較依頼を選択する\"`）およびフォルダ名はいずれもアクティビティ名を採用している。他20UCはBUC.tsvのUC列と一致。"
    suggested_fix: "3UCのフォルダ名・spec-event.yaml・spec.md冒頭見出し等を、BUC.tsvのUC列の正式名（再実行対象のbackground実行・速報比較依頼を選択する／RUNNING中の確報比較依頼の中止を依頼する／RUNNING中の速報比較依頼の中止を依頼する）に統一する。"

  - id: "S-005"
    viewpoint: "依存の宣言（cross-UC暗黙参照）"
    severity: "major"
    target: "並行稼働実行業務/並行稼働実行フロー/foreground roleの標準出力・標準エラー・終了コードを応答する/spec.md, _model-summary.yaml"
    claim: "本UCは role_type='foreground' のRunner実行結果行をSELECTするが、23UC中どのUCも role_type='foreground' の行をINSERTしていない（唯一のINSERT元『background roleを起動する』はrole_type固定値'background'）。foreground側の実行結果を誰がどう書き込むのかが前提条件・関連RDRAモデルのいずれにも明示されておらず、暗黙の未解決依存になっている。"
    evidence: "foreground roleの標準出力・標準エラー・終了コードを応答する/spec.md:23,25『SELECT ... FROM runner_execution_results WHERE run_id = ? AND role_type = 'foreground''。並行稼働実行業務/並行稼働実行フロー/background roleを起動する/_model-summary.yaml:62-73『role_type: 固定値 background』。23UC全体をgrepしてもrole_type='foreground'をINSERTする箇所は無い。同spec.mdの『前提条件』（75,83行目付近）にもforeground結果の生成元についての言及はない。"
    suggested_fix: "foreground役割の実行結果がどのプロセス・UC（本パイプライン外の同期実行プロセス等）によって書き込まれるのかを前提条件として明記するか、該当UCを追加でモデル化する。"

  - id: "S-006"
    viewpoint: "契約生成適性"
    severity: "major"
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "コマンド名 \"relaygate rerun select\" と \"relaygate rerun run\" がそれぞれ2回定義されており（tier-facade用とtier-worker用）、引数構成（--slotの有無等）とenv_varsが異なる。コマンド名をキーとしたcodegenでは1つのコマンド名に対し複数の異なる関数シグネチャが衝突する。"
    evidence: "_cross-cutting/api/cli-command-contract.yaml 719行目と759行目に \"relaygate rerun select\" が重複定義（719行目は--slot引数を含むが759行目は含まない）。795行目と839行目に \"relaygate rerun run\" が重複定義（env_varsが異なる: facade側はRELAYGATE_SSH_KEY_PATH等含む）。"
    suggested_fix: "同一コマンド名の重複エントリを1つに統合し、--targetの値によって分岐する引数・env_varsをoneOf/条件付きスキーマとして表現するか、facade/worker別にコマンド名自体を分ける（例: rerun select-background / rerun select-rapid-crosscheck）。"

  - id: "S-007"
    viewpoint: "契約生成適性"
    severity: "major"
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "同一概念に対する環境変数名が表記揺れしている: RDB接続文字列が RELAYGATE_DB_DSN と RELAYGATE_RDB_DSN の2通り、操作者識別子が RELAYGATE_OPERATOR と RELAYGATE_OPERATOR_ID の2通りで混在している。codegenで単一の設定スキーマに正規化できない。"
    evidence: "RELAYGATE_DB_DSN は32,73,108,140,175,436,471,507,542行目、RELAYGATE_RDB_DSN は579行目以降（background側リランフロー等）に出現。RELAYGATE_OPERATOR_ID は477,548行目、RELAYGATE_OPERATOR は620,696,814,858行目付近に出現。"
    suggested_fix: "環境変数名を1つに統一する（RELAYGATE_RDB_DSN・RELAYGATE_OPERATORへの統一を推奨）。rdb-schema.yaml側の audit_logs.operator の説明（489行目付近）も『RELAYGATE_OPERATOR（または RELAYGATE_OPERATOR_ID）』という両論併記になっており、同時に一本化する。"

  - id: "S-008"
    viewpoint: "一貫性（Step3-Review audit_logsスコープの反映）"
    severity: "major"
    target: "実行制御業務/blue中止フロー/buc-spec.md, 実行制御業務/green中止フロー/buc-spec.md"
    claim: "速報比較中止フロー・確報比較中止フローのbuc-spec.mdは『対話確認のうえ...ABORTEDへ遷移させる』UCの主な操作欄に『audit_logsへ監査記録する』と明記し、情報CRUDマトリクスにもaudit_logs行・データフロー図を含めている。一方、同じ確認→ABORTED遷移パターンを持つblue中止フロー・green中止フローのbuc-spec.mdは主な操作欄に監査ログ記録の言及が無く、情報CRUDマトリクス・データフロー図にもaudit_logsが一切登場しない。UC単位のspec.md/tier-facade.md側では両者ともaudit_logsへのINSERTを実装しているため、BUCレベルの文書のみが4パターン中2パターンで抜け落ちている。"
    evidence: "実行制御業務/速報比較中止フロー/buc-spec.md:12『...RUNNING→ABORTEDへ明示的に遷移させ、audit_logsへ監査記録する』、25行目dataflow図`UC2 -.->|\"C: 監査記録\"| Info2[(\"audit_logs\")]`、33行目CRUDマトリクス`| audit_logs | | C |`。対して 実行制御業務/blue中止フロー/buc-spec.md 9-13行目のUC一覧・情報CRUDマトリクス（25-29行目付近）・データフロー図（18-22行目付近）にはaudit_logsの記載が一切ない（green中止フローも同型）。"
    suggested_fix: "blue中止フロー・green中止フローのbuc-spec.mdに、速報/確報比較中止フローと同じ形式でaudit_logsのCRUD行・データフロー図・UC一覧の操作説明を追記し、4パターンの文書粒度を揃える。"

  - id: "S-009"
    viewpoint: "一貫性（cross-cutting入力文書内の自己矛盾）"
    severity: "minor"
    target: "_inputs-digest.md"
    claim: "_inputs-digest.mdの90行目（L-facade-repository行）は execution-spec.json を AG-002、Runner実行結果 を AG-001 としているが、同ファイル52行目付近のaggregate_hypotheses転記（arch-design.yaml準拠）はAG-001=execution-spec.json、AG-002=Runner実行結果と正しく記載しており、同一ファイル内で矛盾している。過去のレビュー（round-1-groupC.yaml C-001）で修正されたUC側ファイルには波及済みだが、この入力ダイジェストファイルには未反映。"
    evidence: "_inputs-digest.md:90『execution-spec.json（AG-002）・Runner実行結果（AG-001）のaggregate rootと1:1で定義』。docs/arch/latest/arch-design.yaml 175-194行目のaggregate_hypothesesはAG-001: root_entity_id E-001（execution-spec.json）、AG-002: root_entity_id E-002（Runner実行結果）と定義しており、90行目の記載はこれと逆転している。"
    suggested_fix: "_inputs-digest.md:90のAG-001/AG-002を入れ替え、execution-spec.json（AG-001）・Runner実行結果（AG-002）に修正する。"

  - id: "S-010"
    viewpoint: "gherkin品質"
    severity: "minor"
    target: "クロスチェック業務/速報クロスチェックフロー/blue-green runnerの完了通知を受けて速報比較依頼を作成する/spec.md, 並行稼働実行業務/並行稼働実行フロー/background roleを起動する/spec.md"
    claim: "一部のThenステップが、その場で検証不能な未来時制の記述や、二者択一の曖昧な表現になっている。"
    evidence: "速報比較依頼を作成する/spec.md:148『Then job_id \"JOB-BATCH-13\" の速報比較依頼は作成されず、green側の完了後の次回CronJob実行時に再判定される』（次回実行の結果は本シナリオ内で検証されない）。同170行目『...次回CronJob実行時に再試行される』も同様。background roleを起動する/spec.md:154『And runner_execution_resultsのstatusは\"RUNNING\"のまま更新されない、もしくはレコード自体が作成されない』（「もしくは」で2つの異なる結果を許容しており、実行可能なアサーションとして一意に定まらない）。"
    suggested_fix: "未来の再試行に関する記述は当該Thenから削除するか、次回CronJob実行を別Whenステップとして明示的に実行して検証する。「もしくは」を含むThenは、実装が実際にどちらの挙動を取るかを確定させ、片方のみを記述する。"

  - id: "S-011"
    viewpoint: "依存の宣言（外部プロセス依存の明示）"
    severity: "minor"
    target: "クロスチェック業務/確報クロスチェックフロー/全テーブル・全ファイルを対象に確報クロスチェックを実行する/spec.md, _cross-cutting/datastore/rdb-schema.yaml"
    claim: "final_crosscheck_requestsへREQUESTED状態の行をINSERTするUCが23UC中に存在しない（rdb-schema.yamlのused_by欄もSELECT/UPDATEのみでINSERTが無い）。spec.md本文では『日次バッチで作成されたREQUESTED状態の確報比較依頼』と説明されており設計上意図的な外部境界と読めるが、前提条件・関連RDRAモデルの節としては明示的な外部依存として宣言されていない。"
    evidence: "_cross-cutting/datastore/rdb-schema.yaml 380-390行目付近のfinal_crosscheck_requests used_byにINSERT操作が存在しない。全テーブル・全ファイルを対象に確報クロスチェックを実行する/spec.md:5『日次バッチで作成されたREQUESTED状態の確報比較依頼をポーリングし』との記述はあるが、同spec.mdの『前提条件』節にこの外部バッチへの依存が明示されていない。"
    suggested_fix: "本UCの前提条件節に『final_crosscheck_requestsへのREQUESTED行の生成は本仕様群の対象外である日次バッチが担う』旨を明記し、関連RDRAモデル表または備考欄で外部依存として宣言する。"

