uc: "green background実行の中止を依頼する"
business: "実行制御業務"
buc: "green中止フロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-002"

models:
  - name: "RequestAbortGreenRequest"
    tier: "tier-facade"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RequestAbortGreenCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerExecutionResult"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerResultRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"

tables:
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = :run_id AND slot_type = 'green' AND role_type = 'background'"
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type"]
        reason: "中止依頼対象の一意特定と状態確認"
        access_pattern: "relaygate abort green request --run-id"

kvs: []
object_storage: []
