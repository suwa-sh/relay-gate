uc: "再実行対象のbackground実行・速報比較依頼を選択する"
business: "実行制御業務"
buc: "background側リランフロー"
commands:
  - name: "relaygate rerun select"
    tier: "tier-facade"
    summary: "完了済み・中止済みのbackground実行（Runner実行結果）から再実行対象候補を一覧提示する（--target background指定時）"
    args:
      - name: "--target"
        type: "string(enum: background|rapid-crosscheck)"
        required: true
        description: "リラン対象種別。facadeはbackground指定時のみ処理する"
      - name: "--status"
        type: "string(enum: SUCCEEDED|FAILED|ABORTED)"
        required: false
        description: "候補を絞り込む状態"
      - name: "--slot"
        type: "string(enum: blue|green)"
        required: false
        description: "候補を絞り込むslot種別"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "runner_resultsへ接続するRDB接続文字列"
    stdin: "なし"
    stdout_contract: "候補一覧を1候補1行で出力する（run_id/slot/status/started_at）。0件時は「該当するリラン候補はありません」"
    stderr_contract: "--target未指定、不正なenum値の場合に原因を1文で出力する"
    exit_codes:
      - code: 0
        meaning: "正常終了（候補0件を含む）"
      - code: 2
        meaning: "バリデーションエラー（--target未指定、不正なenum値）"
      - code: 124
        meaning: "タイムアウト（RDB接続タイムアウト）"
      - code: 130
        meaning: "SIGINT中断"
  - name: "relaygate rerun select"
    tier: "tier-worker"
    summary: "完了済み・中止済みの速報比較依頼から再実行対象候補を一覧提示する（--target rapid-crosscheck指定時）"
    args:
      - name: "--target"
        type: "string(enum: background|rapid-crosscheck)"
        required: true
        description: "リラン対象種別。workerはrapid-crosscheck指定時のみ処理する"
      - name: "--status"
        type: "string(enum: SUCCEEDED|FAILED|ABORTED)"
        required: false
        description: "候補を絞り込む状態"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "rapid_crosscheck_requestsへ接続するRDB接続文字列"
    stdin: "なし"
    stdout_contract: "候補一覧を1候補1行で出力する（run_id/job_id/status/requested_at）。0件時は「該当するリラン候補はありません」"
    stderr_contract: "--target未指定、不正なenum値の場合に原因を1文で出力する"
    exit_codes:
      - code: 0
        meaning: "正常終了（候補0件を含む）"
      - code: 2
        meaning: "バリデーションエラー（--target未指定、不正なenum値）"
      - code: 124
        meaning: "タイムアウト（RDB接続タイムアウト）"
      - code: 130
        meaning: "SIGINT中断"
screens:
  - name: "リラン対象選定画面"
    route: "/cli/rerun/select"
    components: ["CrossCheckRequestRow", "RunnerResultPanel"]
