uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
business: "実行制御業務"
buc: "background側リランフロー"

# facadeがexecution-spec.json(BC-001/AG-001)の複製・background実行再起動、
# workerが速報比較依頼(BC-002/AG-003)のREQUESTED差し戻しをそれぞれ担当するため、
# primary BC/aggregateは実行設定の主体であるfacade側（execution-spec.json）を採用する
bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "RerunRunBackground CLI"
    tier: "tier-facade"
    layer: "presentation"
    type: "request"
    rdra_info: "execution-spec.json"
  - name: "RerunBackgroundCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "execution-spec.json"
  - name: "execution-spec.json"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "execution-spec.json"
  - name: "ExecutionSpecRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "execution-spec.json"
  - name: "RunnerResultRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RerunRunRapidCrosscheck CLI"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: "速報比較依頼"
  - name: "RerunRapidCrosscheckCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "速報比較依頼"
  - name: "速報比較依頼"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較依頼"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較依頼"

tables:
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?（元run_id）"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新規発行するUUID"
          - name: "parent_run_id"
            value: "元run_id"
          - name: "host"
            value: "元レコードから複製"
          - name: "exec_user"
            value: "元レコードから複製"
          - name: "script_path"
            value: "元レコードから複製"
          - name: "work_dir"
            value: "元レコードから複製"
          - name: "fixed_args"
            value: "元レコードから複製"
          - name: "additional_args"
            value: "元レコードから複製"
          - name: "job_map_version"
            value: "元レコードから複製"
          - name: "impl_version"
            value: "元レコードから複製"
          - name: "hang_detect_limit_minutes"
            value: "元レコードから複製"
          - name: "credential_ref"
            value: "元レコードから複製（参照名のみ）"
        where: ""
    indexes_needed:
      - columns: ["run_id"]
        reason: "元run_idによる実行設定取得の一意特定"
        access_pattern: "run_id指定によるポイントルックアップ"
      - columns: ["parent_run_id"]
        reason: "実行系譜トレーサビリティ（CTP-004）。親run_idからの子run_id一覧参照"
        access_pattern: "parent_run_id指定による子run_id一覧参照"
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新規発行run_id"
          - name: "slot_type"
            value: "元のexecution-spec.jsonから引き継ぐslot種別"
          - name: "role_type"
            value: "'background'固定"
          - name: "status"
            value: "'RUNNING'固定"
        where: ""
    indexes_needed: []
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "'REQUESTED'"
          - name: "lease_expires_at"
            value: "NULL"
          - name: "worker_id"
            value: "NULL"
        where: "run_id = ? AND status IN ('SUCCEEDED', 'FAILED', 'ABORTED')"
    indexes_needed:
      - columns: ["run_id", "status"]
        reason: "楽観的競合検知のための条件付きUPDATE（WHERE run_id=? AND status IN (...)）を高速化する"
        access_pattern: "run_id指定+status条件によるUPDATE"
  - name: "audit_logs"
    rdra_info: "該当なし（RDRAに明示定義なし。CTP-005監査ログ要件・CTP-004実行系譜トレーサビリティから導出。列定義は_cross-cutting/datastore/rdb-schema.yamlのaudit_logsに正規化済み）"
    operations:
      - type: "INSERT"
        columns:
          - name: "log_id"
            value: "新規発行するUUID"
          - name: "operator"
            value: "RELAYGATE_OPERATOR環境変数の値"
          - name: "operated_at"
            value: "操作日時"
          - name: "run_id"
            value: "対象run_id（facade側は新規発行run_id、worker側は差し戻し対象run_id）"
          - name: "action"
            value: "'rerun'固定"
        where: ""
    indexes_needed:
      - columns: ["run_id"]
        reason: "run_id単位の監査ログ追跡（実行系譜トレーサビリティ CTP-004）"
        access_pattern: "run_id指定による監査ログ一覧参照"

kvs: []
object_storage: []
