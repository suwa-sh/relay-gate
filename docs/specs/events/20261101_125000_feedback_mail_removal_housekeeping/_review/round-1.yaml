    suggested_fix: "契約 commands housekeep.sh の stderr と exit_codes に tier-ops.md の 6 行を加え、housekeep_rules.finished_db に completed_at が NULL の扱い(判定できないとして単位を残し warn)を書く。tier-ops.md は契約を参照する形に揃える"
