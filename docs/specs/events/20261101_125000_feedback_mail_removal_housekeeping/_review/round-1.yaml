findings:
  - id: R-001
    viewpoint: 5
    severity: major
    target: "実行監視業務/background 実行監視フロー/ハング疑い・実行エラー・比較異常を通知する/spec.md"
    claim: "E2E の共通の前提に置いた run 20260830T114000-JOB002-5e6f7a8b の blue(started-at 11:40:05Z、limit 60)が、終了ファイルを指定しないシナリオでハング疑いとして判定され、alert 行を全件で照合する Then や「終了コード 0」の Then と矛盾する。テストが判定不能(または必ず失敗)になる"
    evidence: "spec.md:195 の共通の前提で JOB002 の blue を定義し、exitcode.txt の有無は書いていない。spec.md:217-226「実行エラーや比較異常を新たに見つけたら…」は RELAY_GATE_NOW=12:45(blue は 64 分 > 60)で「alert 行は次の 2 行」と全件照合し、blue の warning 行が 3 行目になる。spec.md:247-252「管理 DB を使う設定では通知済みの異常を 2 回目に知らせない」と spec.md:254-259「off では通知済みの異常を 2 回目に知らせない」は 12:50(blue は 69 分)で「alert 行は出ず、終了コード 0」としており、blue のハング疑い(監視記録・印なし)が新たに知らせる異常になる"
    suggested_fix: "共通の前提の JOB002 blue は「シナリオに記載が無ければ blue/exitcode.txt の中身が 0」と明記するか、JOB002 を使うシナリオ(ハング疑いだけ / 両方を同じ回に見つけた)の Given にだけ置く。全件照合・終了コード 0 の Then を持つシナリオで、対象以外の run が異常にならないことを Given で確定させる"
  - id: R-002
    viewpoint: 4
    severity: major
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "HOUSEKEEP_DB_CONN_REF を RAPID_CROSSCHECK_MODE=off では任意にしたため、off で確報クロスチェックを使う構成では確報比較依頼が一切削除されず、REQ-014(終端した確報比較依頼を自動で削除する)を満たさない。しかも何も出力されないため運用者が気づけない"
    evidence: "契約 internal_datastores.used_when(1257 行)は「確報系は FINAL_DB_CONN_REF で常に使う」。config_files housekeep.env の HOUSEKEEP_DB_CONN_REF(1542-1543 行)は off 以外でだけ必須で、housekeep_rules.final_request(208 行)は「管理 DB に接続しないときは扱わない」。decisions/spec-decision-021.yaml の context も「off でも確報比較依頼の行が増える」と認めている。USDM REQ-014 の requirement と SPEC-014-04 は確報比較依頼の削除を運用モードで限定していない。方針資料「RelayGateのしくみ.md」301 行も確報比較依頼を依頼ごとに削除するとしている"
    suggested_fix: "HOUSEKEEP_DB_CONN_REF の要否を「RAPID_CROSSCHECK_MODE が off 以外、または final-crosscheck.env がある(確報を使う構成)」に改めるか、少なくとも off で未設定のときは stderr に warn(例: `warn: final crosscheck requests are not handled (HOUSEKEEP_DB_CONN_REF not set)`)を出すと契約・tier-ops・BDD に定める。どちらにするかは spec-decision-021 の判断 2 を更新して記録する"
