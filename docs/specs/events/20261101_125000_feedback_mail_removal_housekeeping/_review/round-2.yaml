  - id: R-015
    viewpoint: 4
    severity: minor
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "off で HOUSEKEEP_DB_CONN_REF が無いとき、off 以外の期間に作られた実行(parallel_runs 行がある)も成果物だけで判定して run ディレクトリを消す。管理 DB 上で速報比較依頼が終わっていない実行の成果物を消し得るため、spec-decision-021 が接続失敗時に退けた理由(alternatives_considered 2 件目)と矛盾し、SPEC-014-03 の「1 つでも終わっていない構成要素があれば経過日数にかかわらず単位ごと残す」とも合わない"
    evidence: "契約 housekeep_rules.member_source(205 行)は「行が無い実行(off で作られた実行。管理 DB に接続しないときはすべて)は成果物だけで判定する」。spec-decision-021 の decision 6 は接続失敗時に「行の有無が分からない run ディレクトリを成果物だけで消さないよう」単位の処理を一切しないとし、alternatives_considered は「管理 DB に接続できないときも成果物だけの判定で run ディレクトリを削除する」を「管理 DB で終わっていない構成要素(速報比較依頼など)がある実行の成果物を消してしまう恐れ」で退けている。context は運用モードが期間で変わり、両方の実行が同じ成果物ルートに混在し得るとしている。未設定の warn(housekeep.sh stderr)は管理 DB の行を消さないことは知らせるが、成果物だけで判定することの危険は知らせない"
    suggested_fix: "どちらかに揃えて spec-decision-021 の判断 2 に記録する: (a) 管理 DB に接続しないときは、execution-spec.json の内容などで off 以外の期間に作られたと分かる実行を判定できないもの(undeterminable)として残す、(b) 混在は運用上起き得るが許容すると明記し、alternatives_considered の退け理由を「接続失敗は一時的なので待てる。未設定は構成の選択」と区別して書く。どちらの場合も UC-33 の tier-ops.md の判定元の表と BDD を揃える"
