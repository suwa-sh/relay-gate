schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-019"
title: "env 形式の設定値の引用符は先頭と末尾を別々に 1 文字ずつ外す規則で CLI 契約の 2 か所に同文で書き、速報の起動コマンドの検証を 3 点に揃える"
status: "approved"
generated_at: "2026-11-01T10:50:00Z"
context: |
  - CLI 契約の起動コマンドを引数ごとに分ける決まり(shared_rules.compare_command_argv.split)は、分ける前の値を「先頭末尾の " / ' を 1 組だけ除去したもの」と書いていた(spec-decision-018 の 2)。「1 組」は先頭と末尾が対になっているときだけ外すとも読め、その読み方では "abc や "abc' は外さないことになる。
  - 同じ契約の env 形式の入力規則(config_input_rules.env_files)は、外し方を UC「feature flag を設定する」の設定契約に預けていた。参照先も「先頭末尾の " / ' は除去する(仮採用)」とだけ書き、対になっていない場合を書いていなかった。2 か所から同じ規則を読み取れなかった。
  - 実装(速報クロスチェック設定と feature flag 設定の読み込み)は、先頭が " か ' なら 1 文字外し、それとは別に末尾が " か ' なら 1 文字外す。独立検証は対になっていない引用符の扱いが仕様から一意に定まらないと判定し、2026-10-27 のレビューで実装どおりの規則を仕様に明記する方針に決まった(実装は変えない)。
  - 速報の起動コマンドの検証は、spec-decision-017 の 3 で「2 点だけ・引数部分の内容は検査しない」とし、spec-decision-018 の 3 で {params} の位置違反を加えたため、要求(USDM)と仕様で点数が食い違っていた。上流の USDM は 2026-11-01 に 3 点目({params} を使うなら引数 1 つ全体がちょうど {params})を本文へ加え、「{job_id} の有無と {params} の位置のほかは引数部分の内容を検査しない」に改めた。
decision: |
  1. 引用符の外し方を次の規則とし、CLI 契約の config_input_rules.env_files に規則そのものを書く。shared_rules.compare_command_argv.split にも同じ文で書く: 先頭の 1 文字が " か ' ならその 1 文字を外し、それとは別に(先頭を外した後の)末尾の 1 文字が " か ' ならその 1 文字を外す。先頭と末尾の引用符の種類の一致や、対になっていることは求めない。例: "abc" → abc、"abc → abc、abc' → abc、"abc' → abc。
  2. この規則は env 形式の全設定ファイルの値に共通とする。UC「feature flag を設定する」の tier-facade.md は外し方を契約 config_input_rules.env_files へ参照させ、「仮採用」を外す(参照の向きを契約 → UC から UC → 契約に改め、循環をなくす)。spec-decision-018 の 2 の「1 組除去」はこの規則に読み替える。
  3. 速報の起動コマンドの検証は 3 点とする: (1) コマンド部分(先頭の引数)が絶対パスで存在し実行可能、(2) {job_id} を含む、(3) {params} を使うなら引数 1 つ全体がちょうど {params}。{job_id} の有無と {params} の位置のほかは、引数部分の内容を検査しない。CLI 契約(validate-config.sh の違反文言、config_files の RAPID_COMPARE_COMMAND)、UC「クロスチェックのジョブマップと比較定義を定義する」の spec.md / tier-facade.md / _api-summary.yaml を同じ 3 点に揃える。_api-summary.yaml の stderr と終了コード 2 の理由に {params} の位置違反を加える。spec-decision-017 の 3 の「2 点だけ」はこの 3 点に読み替える。確報の検証(コマンド部分の 1 点)は変えない。
  4. 受け入れ基準 10(引数部分の任意文字列。{params} を引数の一部に含まず、速報は {job_id} を含む)と受け入れ基準 11(クロスチェックジョブマップと対象カタログの検証種別は無い)に対応する BDD シナリオを同 UC に追加する。受け入れ基準 12({params} の位置違反)は既存のシナリオで覆う。
consequences:
  positive:
    - "対になっていない引用符を含む値(\"abc など)の外した結果が、契約のどちらの記述からも推測なしに同じに読める"
    - "別の設定ファイルの読み込みを実装する人が、異なる外し方を選ぶ余地がなくなる"
    - "要求・受け入れ基準・CLI 契約・UC の spec.md / tier-facade.md / API 要約が同じ 3 点の検証を記述し、API 要約だけを読んでも {params} の位置違反を見落とさない"
  negative:
    - "引用符の規則が契約の 2 か所に同じ文で書かれるため、変えるときは 2 か所を同時に直す必要がある"
    - "対になっていない引用符(\"abc)も外すため、値の一部として末尾や先頭に引用符を置きたい場合は表現できない"
alternatives_considered:
  - name: "先頭と末尾が同じ種類で対になっているときだけ外す"
    reason_rejected: "今の実装の結果と変わり、実装の変更が必要になる。レビューで実装どおりの規則を仕様に明記する方針に決まった"
  - name: "env_files は UC「feature flag を設定する」の設定契約への委譲のままにし、参照先にだけ規則を書く"
    reason_rejected: "契約の 2 か所から同じ規則を読み取れるという完了条件を満たさない。共通規則は契約側に置き、UC 側から参照する方が向きが一貫する"
  - name: "速報の起動コマンドの検証を 2 点に戻し、{params} の位置違反を検証しない"
    reason_rejected: "引数の一部の {params} は 1 項目 1 引数へ展開できず、起動時に初めて失敗する。上流の USDM が 3 点目を要求として採用した"
