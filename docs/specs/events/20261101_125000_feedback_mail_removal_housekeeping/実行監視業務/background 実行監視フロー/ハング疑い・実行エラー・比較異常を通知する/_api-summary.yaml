uc: "ハング疑い・実行エラー・比較異常を通知する"
business: "実行監視業務"
buc: "background 実行監視フロー"
paths: []
x_cli_commands:
  - name: "hang-detector.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "hang-detector.sh [--verbose] [--help](通知部分。コマンド契約の正本は UC「background 実行の経過時間と終了状態を判定する」)"
    invoked_by: "ジョブスケジューラ(ハング検知定期ジョブ、5 分ごと)"
    args: []
    options: []
    stdin: "なし"
    stdout: "出力しない"
    stderr: "alert: level=<warning|error> kind=<hang-suspected|background-exec-error|rapid-crosscheck-error> run_id=<run_id> role=<blue|green|rapid-crosscheck> job_id=<job_id> elapsed_minutes=<n>(その回に新たに知らせる異常 1 件につき 1 行。run_id 昇順 → role 順。通知済みは出さない)/ error: monitor record save failed run_id=... role=...(alert 行の直後)/ error: notified mark save failed run_id=... role=... path: ...(off。alert 行の直後)。--verbose 時 info: alert skipped already notified run_id=... role=... status=..."
    exit_codes:
      - code: 0
        meaning: "新たに知らせる異常が無い(通知済みの異常が続いていても 0)"
      - code: 3
        meaning: "新たに知らせた異常がハング疑い(warning)だけ。ジョブステータスが警告終了になる値"
      - code: 6
        meaning: "background 実行エラーまたは速報クロスチェック異常(error)を新たに 1 件以上知らせた、または alert 行を出した対象の監視記録・通知済みの印の保存に失敗した(次回同じ異常を再び知らせる)"
async_events: []
schemas:
  - name: "HangAlertLine"
    properties:
      - name: "level"
        type: "string"
        required: true
      - name: "kind"
        type: "string"
        required: true
      - name: "run_id"
        type: "string"
        required: true
      - name: "role"
        type: "string"
        required: true
      - name: "job_id"
        type: "string"
        required: true
      - name: "elapsed_minutes"
        type: "integer"
        required: true
