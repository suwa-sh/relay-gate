round: 2
# 前ラウンドの R-001〜R-004 は直っていることを確認した(再掲なし)。R-005 は今回の対象外。
findings:
  - id: R-006
    viewpoint: 4
    severity: major
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "条件 (b) は「作業用の領域を空にする」と、置いた値の種類を限定せずに書いている。現在の実装は、9 キーの値を一時的に受ける固定名の作業用の変数を、読み取りの後も空にしない。文字どおりに読むと実装は (b) に反し、「実装は変えない」「現在の実装は 3 条件を満たしている」(decisions/spec-decision-036.yaml の決定 7)と食い違う。"
    evidence: |
      - 契約の (b): 「読み終えたとき…と失敗したとき…のどちらでも、作業用の領域を空にする(変数・配列は空にするか、有効範囲を抜けて消える…)」。対象は作業用の領域の全体で、9 キー以外のキーの値を置いたものに限っていない。
      - 作業用の領域の定義は「読み取りの処理の中だけで使うシェルの変数・配列」。実装 facade/src/repository/feature_flag_config.sh の FEATURE_FLAG_CONFIG_UNQUOTED(44 行目で宣言するグローバル変数。72 行目で値を入れる)は、引用符を外した値を受け渡すためだけの変数で、この定義に当たる。
      - feature_flag_config_parse は 190〜191 行目で 9 キーの値をこの変数に入れてからキーと同じ名前の変数へ写す。194 行目で空にするのは行の配列(FEATURE_FLAG_CONFIG_SPLIT_LINES)だけで、FEATURE_FLAG_CONFIG_UNQUOTED は空にしない。feature_flag_config_reset(84〜94 行目)もこの変数を空にしない。
      - そのため、読み取りの後(キーごとの検査、runner への問い合わせの間)も、最後に読んだ 9 キーの値がこの変数に残る。(ii) の違反で 9 キーの変数を未設定に戻した回(207 行目)と、内部障害で打ち切った回(261 行目の reset)にも残る。
      - 入るのは 9 キーの値だけ(189 行目の判定の内側)で、9 キー以外のキーの値は入らない。規則の目的(9 キー以外のキーの値を残さない)は損なわれていないが、(b) の文面とは合わない。
    suggested_fix: "どちらかに決める。(1) 利用者の決定の対象(9 キー以外のキーの値)に合わせて (b) の対象を絞る。例: 「読み手が取り込まないキーの値(9 キー以外のキーの値と、読み手が使わないキーの値)を置いた作業用の領域を空にする。読み手が取り込むキーの値だけを置いた作業用の変数は、この条件の対象外」。tier-facade.md の項目 2、spec.md、README.md、decisions/spec-decision-036.yaml の同じ条件の書き方もそろえる。(2) (b) を今の文面のままにするなら、実装が (b) を満たしていない点(上記の変数)を判断記録の決定 7 に書き、実装の変更が要ることを明示する。「実装は変えない」前提からは (1) が合う。"
  - id: R-007
    viewpoint: 4
    severity: minor
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "9 キーの一部だけを扱う読み手について、既存の文は「読む」キー、追加した文は「使う」キー(検査に使うキーを含む)と書き分けており、background-rerun.sh が値を取り込むキーの範囲が 4 キーとも 9 キーとも読める。"
    evidence: |
      - 既存の文(「feature-flag.env から値を取り込むキーの範囲」の末尾): 「9 キーの一部だけを読む読み手は、自分が読むキーの値だけを取り込む」。
      - config_files の feature-flag.env の readers は、background-rerun.sh が読むキーを RAPID_CROSSCHECK_MODE / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER の 4 つと書く。この 2 つを合わせると、取り込むのは 4 キーの値だけ。
      - reader_scope は、background-rerun.sh が validation_rules のとおりに検査する(mode の組合せなど、4 キー以外の値も要る)と書く。
      - 追加した文: 「読み取り」は読み手が使うキーの値を変数へ載せ終えるまでで、(iii) のキーごとの検査は読み取りの後。「読み手が検査に使うキーは、その読み手が使うキーに含む」。この文からは、検査に使う BLUE_MODE などの値も変数へ載せる(取り込む)ことになり、9 キーになる。
      - 「読む」と「使う」が同じ意味かどうか、readers の括弧書きがどちらを示すのかが書かれていない。
    suggested_fix: "既存の文を「9 キーの一部だけを使う読み手は、自分が使うキー(検査に使うキーを含む)の値だけを取り込む」に直して語をそろえる。readers の background-rerun.sh の括弧書きには「処理に使うキー。検査の範囲は reader_scope」のように、挙げた 4 キーが何を示すかを足す。decisions/spec-decision-036.yaml の決定 3 が引く「自分が読むキーの値だけを取り込む」も同じ語にする。"
  - id: R-008
    viewpoint: 4
    severity: minor
    target: "適用構成業務/適用構成定義フロー/feature flag を設定する/tier-facade.md"
    claim: "設定契約の「読み取りの途中の一時的な保持」の項目が、読み取りの終わりを「9 キーの値をキーに対応する変数へ載せ終えるまで」と書いており、契約の「読み手が使うキーの値を…載せ終えるまで」と違う。同じ項目は「検証コマンドと実行時の読み手に同じく及ぶ」と続くため、一部のキーだけを使う読み手にも 9 キーすべての値を載せると読める。"
    evidence: |
      - tier-facade.md 30 行目: 「読み取りは、行・キー・値を取り出し、9 キーの値をキーに対応する変数へ載せ終えるまでを指す(キーごとの検査と runner への問い合わせは読み取りの後)。検証コマンドと実行時の読み手に同じく及ぶ」。
      - 契約: 「読み手が使うキーの値をキーに対応する変数へ載せ終えるまで」「9 キーの一部だけを使う読み手では、その読み手が検査にも処理にも使わないキーの値も、9 キー以外のキーの値と同じ扱い」。
      - 検証コマンドでは 9 キーすべてを使うため結果は同じだが、RAPID_CROSSCHECK_MODE だけを使う読み手に当てはめると契約と逆になる。
    suggested_fix: "tier-facade.md の文を契約と同じ「読み手が使うキーの値を」に直す(検証コマンドでは 9 キーすべて、と括弧で足してよい)。"
  - id: R-009
    viewpoint: 4
    severity: minor
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "作業用の領域の名前の括弧書き「9 キー以外のキーと同じ名前の変数は、有効範囲や残す時間によらず作業用の領域に当たらない」は、名前が一致したかどうかで書かれている。実装が固定で決めた作業用の変数の名前と同じ文字列をキーに持つ行がファイルにあると、その変数は文字どおりには作業用の領域に当たらなくなり、同じ実装が入力によって規則に反することになる。"
    evidence: |
      - 直前の文は「名前は実装が固定で決め、ファイルに書かれたキー名から決めない」で、名前の決め方を基準にしている。括弧書きは名前の一致を基準にしており、2 つの基準が入力によって分かれる。
      - 例: 実装の作業用の配列の名前と同じ文字列をキーにした行(未知キー)を feature-flag.env に書く。実装はその行の内容を固定名の配列に置く(キー名から名前を決めていない)が、括弧書きでは「9 キー以外のキーと同じ名前の変数」に当たる。
      - 違反の例(「9 キー以外のキーの値を、キーと同じ名前の変数へ代入する」)は、キー名から代入先を決める操作を指しており、意図は決め方の基準と読める。
    suggested_fix: "括弧書きを決め方の基準にそろえる。例: 「ファイルに書かれたキー名から名前を決めた変数(9 キー以外のキーの値を、そのキーと同じ名前の変数へ代入する場合)は、有効範囲や残す時間によらず作業用の領域に当たらない」。tier-facade.md と decisions/spec-decision-036.yaml の同じ括弧書きも合わせる。"
  - id: R-010
    viewpoint: 4
    severity: minor
    target: "decisions/"
    claim: "decisions/ の過去の判断記録に、変更要求の ID と feedback request の語が残っている。今回足した spec-decision-036.yaml と _review/round-1.yaml には無い。"
    evidence: |
      - 該当するファイル: spec-decision-005 / 006 / 007 / 009 / 017 / 018(変更要求の ID の形の文字列)。spec-decision-005 / 009 には「feedback request」の語もある。
      - これらは前のスナップショット(docs/specs/latest/decisions)と差分が無く、今回の変更で入ったものではない(今回のイベントで増えたのは spec-decision-036.yaml だけ)。
      - spec-decision-010 / 023 / 026 / 028 にある要求の ID の形の文字列は、変更要求の ID ではない可能性があるため、該当に数えていない。
    suggested_fix: "今回の変更の範囲では直さなくてよいかを判断する。過去の判断記録にも同じ決まりを適用するなら、該当の ID を平易な説明(いつ・何の変更か)に置き換える。"
resolved:
  - id: R-006
    resolution: fixed
    note: "空にする対象を、読み手が取り込まないキーの値(9 キー以外のキーの値と、読み手が使わないキーの値)を置いた作業用の領域に絞り、読み手が取り込むキーの値だけが入る作業用の変数は対象外と契約に書いた。tier-facade.md と判断記録もそろえ、判断記録の決定 7 に実装の該当の変数を書いた"
    by: orchestrator
  - id: R-007
    resolution: fixed
    note: "既存の文を「9 キーの一部だけを使う読み手は、自分が使うキー(検査に使うキーを含む)の値だけを取り込む」に直して語をそろえた。readers の括弧書きは今回より前からの記載で、今回の変更の範囲では変えていない"
    by: orchestrator
  - id: R-008
    resolution: fixed
    note: "tier-facade.md の文を「読み手が使うキーの値(検証コマンドでは 9 キーすべて)」に直した"
    by: orchestrator
  - id: R-009
    resolution: fixed
    note: "括弧書きを名前の決め方の基準(キー名から名前を決めた変数は作業用の領域に当たらない)にそろえた。tier-facade.md と判断記録も合わせた"
    by: orchestrator
  - id: R-010
    resolution: deferred
    note: "過去の判断記録の記載で、今回の変更で入ったものではない。今回の変更要求の範囲外のため変えていない"
    by: orchestrator
