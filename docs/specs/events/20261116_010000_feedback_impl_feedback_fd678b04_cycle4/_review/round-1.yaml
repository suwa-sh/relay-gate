round: 1
findings:
  - id: R-001
    viewpoint: 4
    severity: major
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "config_input_rules.env_files の『読み取りの途中の一時的な保持』で、『キーと同じ名前の変数へ代入する』の可否が 1 つに決まらない。冒頭の定義(『取り込む』= キーに対応する変数・環境変数へ値を載せること)では取り込みに当たるが、続く文(作業用の領域へ置くことは 3 条件をすべて満たせば取り込みに当たらない)では、環境変数にせず、読み終えたときに空にする同名の変数は取り込みに当たらないと読める。"
    evidence: |
      - 作業用の領域の定義は「読み取りの処理の中だけで使うシェルの変数・配列」で、変数の名前の決め方を限定していない。読み取りの関数の中だけで使う、キーと同じ名前の変数(例: 未知キー ZZ の値を関数内の変数 ZZ に入れ、関数を抜けると消える)は、この定義に当てはまり、条件 (a)(b)(c) をすべて満たす。
      - 一方、同じ節は「3 条件のどれかを満たさない保持は取り込みに当たり、上の規則に反する(例: 9 キー以外のキーの値を、キーと同じ名前の変数へ代入する。export する。読み取りの後も参照できる変数に残す)」と書く。「export する」は (a)、「読み取りの後も参照できる変数に残す」は (b)(c) に対応するが、「キーと同じ名前の変数へ代入する」は 3 条件のどれにも対応しない。
      - 同名の変数への一時的な代入は、3 条件を満たしていても規則の目的(同じ節の末尾「設定ファイルの内容で読み手のプロセスの環境は書き換わらない」)を損なう。PATH のように既に環境変数である名前へ代入すると環境が変わり、IFS へ代入すると読み取りの処理そのものの語の分け方が変わる。
      - 利用者の 2026-11-15 の決定は「『取り込まない』は、キーに対応する変数・環境変数へ値を載せないことを指す」であり、同名の変数への代入を許す意図は無い。tier-facade.md の設定契約の項目も 3 条件だけを並べており、同じ読み方ができる。
    suggested_fix: "作業用の領域の定義に「変数の名前は実装が固定で決め、ファイルに書かれたキー名から決めない(キーと同じ名前の変数は作業用の領域に当たらない)」を加える。違反の例の文は「作業用の領域に当たらない保持、または 3 条件のどれかを満たさない保持は取り込みに当たる」とし、「キーと同じ名前の変数へ代入する」を前者の例として分ける。tier-facade.md の項目にも同じ 1 点を足す。"
  - id: R-002
    viewpoint: 4
    severity: major
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "条件 (b) の「読み終えたとき(検査・読み込みを終えたとき)」と条件 (c) の「読み取りの後」が、同じ節の検査の段 (i)(ii)(iii) や子プロセスの起動(runner への --help の問い合わせ、runner の起動)のどこを指すかが決まらない。空にする時点は利用者の決定で仕様から読み取れることを求められた点で、出力から観測できずコードの確認に頼る(spec-decision-036 の negative)ため、判定の基準が 1 つに決まる必要がある。"
    evidence: |
      - validate-config.sh --feature-flag の「検査」は、(iii) のキーごとの検査、対応ジョブマップの検査、runner への --help の問い合わせ(キーごとの検査のあとに blue → green の順)まで続く。「検査を終えたとき」をプロセスの終了直前と読むと、全行を持つ変数を終了まで残す実装も (b) を満たし、(c) の「読み取りの後」が存在しなくなる。違反の例「読み取りの後も参照できる変数に残す」と両立しない。
      - 逆に「読み取り」を (ii) の行の構造の検査と値の取り出しまでと読むと、別の箇所と食い違う。readers は background-rerun.sh が読むキーを RAPID_CROSSCHECK_MODE / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER の 4 つとし、reader_scope は同じ background-rerun.sh が validation_rules のとおりに検査する(mode の組合せ、<SLOT>_IMPL の非空など)と定める。追加した文「9 キーの一部だけを読む読み手が読まないキーの値も、9 キー以外のキーの値と同じ扱い」により、BLUE_MODE / GREEN_MODE / BLUE_IMPL / GREEN_IMPL の値は読み取りの後に残せないため、(iii) の検査が読み取りの中に含まれないと検査できない。
      - 実行時の読み手(facade.sh など)では、「読み込みを終えたとき」が runner の起動より前かどうかが書かれていない。条件 (a) で子プロセスへは渡らないが、(b) を満たしたかどうかをコードで確認するときの基準が読み手ごとに分かれる(規則の趣旨「読み手ごとに可否を判断しない」に反する)。
    suggested_fix: "「読み取り」の終わりを検査の段で定める。例: 「読み取りは、(i)(ii) の検査と、その読み手が行う (iii) のキーごとの検査を終え、読み手が読むキーの値を対応する変数へ載せ終えるまで。作業用の領域は、その時点(runner への問い合わせ・runner の起動など、設定値を使う後続の処理を始める前)までに空にする」。あわせて、9 キーの一部だけを読む読み手が、読まないキーの値を (iii) の検査に使ってよいこと(検査は読み取りの中)を 1 文で書く。"
  - id: R-003
    viewpoint: 4
    severity: minor
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "条件 (a) の括弧書き「読み取りに使う補助コマンドへ行の内容を入力として渡すことは、読み取りそのものであり、この条件に反しない」は、渡し方を限定していない。補助コマンドの起動時だけ環境変数に載せて渡す方法(コマンドの前に変数の代入を置く書き方)や、コマンドライン引数で渡す方法が許されるかどうかが決まらない。"
    evidence: |
      - (a) の本文は「作業用の領域を環境変数にしない(export しない)」で、禁じる操作として export だけを挙げる。補助コマンド 1 回分の環境変数に載せる渡し方は export を使わないが、値は子プロセスの環境変数になる。括弧書きの例外が先に読まれると許されると読め、本文が先に読まれると禁じられると読める。
      - 作業用の領域の定義は「読み取りに使う補助コマンドの入出力」で、標準入力・ファイル・引数・環境変数のどれを指すかを書いていない。コマンドライン引数で渡すと、値がほかのプロセスから見える場所に出る。
      - 現在の実装は入力の複製を補助コマンドに読ませる方法(decisions/spec-decision-036 の context)で、この点は実装では問題になっていない。実行時の読み手を実装するときに判断が分かれる。
    suggested_fix: "括弧書きを「補助コマンドへは、標準入力か入力の複製の一時ファイルで行の内容を渡す。補助コマンド 1 回分の環境変数やコマンドライン引数では渡さない」のように、渡し方を挙げて書く(実装が使っている渡し方に合わせる)。"
  - id: R-004
    viewpoint: 4
    severity: minor
    target: "適用構成業務/適用構成定義フロー/feature flag を設定する/spec.md"
    claim: "分岐条件一覧の「設定所有区分」の行に足した文が、3 つ目の条件を「後に残すのはキー名だけ」と短くしており、契約の「9 キー以外のキーについては」が落ちている。文の対象は「行の内容」(9 キーの行を含む)のため、文字どおりに読むと 9 キーの値も後に残せないことになり、直前の「値を取り込むのは 9 キー」と食い違う。"
    evidence: |
      - spec.md 115 行目: 「読み取りの途中だけ作業用の領域に行の内容を置くことは、環境変数にしない・読み終えたときと失敗したときに空にする・後に残すのはキー名だけ、の 3 条件を満たせば取り込みに当たらない」。
      - 契約の (c): 「読み取りの後まで残すのは、9 キー以外のキーについてはキー名だけ」。tier-facade.md の 3 つ目の項目は「9 キー以外のキーについては」を持つ。
      - README.md 3 行目の要約も同じ短い書き方(「後に残すのはキー名だけ」)。
    suggested_fix: "spec.md の文を「後に残すのは、9 キー以外のキーについてはキー名だけ」に直す。README.md の要約も同じ語にそろえる。"
  - id: R-005
    viewpoint: 4
    severity: minor
    target: "spec-event.md"
    claim: "spec-event.md が前イベントの内容のままで、本イベントの spec-event.yaml と食い違う。spec-event.yaml の review の節も前イベントのレビューの記録のまま。"
    evidence: |
      - spec-event.md 7 行目の Event ID は前イベント(2026-11-15 の runner の相対パスの変更)の ID で、9 行目の Source も相対パスの変更の説明。前イベントのディレクトリの spec-event.md と差分が無い。
      - spec-event.yaml の冒頭(event_id / created_at / source / previous_event_ref)は本イベントの内容に更新済み。
      - spec-event.yaml の review(method / final_state / history の round 1 の event)は、前イベントのレビュー(minor 6 件)の記録のまま。本レビューの収束後に書き換える節であれば、その時点で直せばよい。
    suggested_fix: "spec-event.md を本イベントの spec-event.yaml から作り直す(生成スクリプトがあればそれで再生成する)。review の節は、本レビューの収束後に本イベントの結果へ書き換える。"
resolved:
  - id: R-001
    resolution: fixed
    note: "作業用の領域の変数の名前は実装が固定で決め、キー名から決めないと契約に書いた。違反の例を「作業用の領域に当たらない保持」と「3 条件を満たさない保持」に分けた。tier-facade.md にも同じ点を足した"
    by: orchestrator
  - id: R-002
    resolution: fixed
    note: "読み取りの範囲(行・キー・値を取り出し、読み手が使うキーの値を変数へ載せ終えるまで。設定値を使う処理は読み取りの後)と、空にする時点(設定値を使う処理を始める前)を契約に書いた。一部のキーだけを使う読み手の文は「検査にも処理にも使わないキー」に改め、検査に使うキーは使うキーに含むと書いた"
    by: orchestrator
  - id: R-003
    resolution: fixed
    note: "補助コマンドへは一時ファイルや標準入力で読ませることは反しない、補助コマンドの環境変数に載せて渡すことは反すると書いた。コマンドライン引数で渡すことの可否は利用者の決定に無いため定めず、判断記録にその旨を残した"
    by: orchestrator
  - id: R-004
    resolution: fixed
    note: "spec.md と README.md の 3 つ目の条件を「9 キー以外のキーについてはキー名だけ」にそろえた"
    by: orchestrator
  - id: R-005
    resolution: fixed
    note: "spec-event.md は本イベントの spec-event.yaml から生成スクリプトで作り直し、review の節は収束後に本イベントの結果へ書き換えた"
    by: orchestrator
