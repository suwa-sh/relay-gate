    by: "orchestrator"
  - id: "R-014"
    resolution: "fixed"
    note: "2 場面の Given に、速報クロスチェック設定が管理 DB 接続の参照名を持ち管理 DB が起動している前提を足した"
    by: "orchestrator"
  - id: "R-015"
    resolution: "fixed"
    note: "起動の失敗を、起動の時点で確かめられる 3 つ(何も無い、通常ファイルでない、実行権限が無い)に限った。それ以外は起動したものとして扱い、終了を待たずに終了コード 0 とした。契約 launch_failure、UC の処理順序 5 と API 要約、判断記録 040 を揃えた"
    by: "orchestrator"
