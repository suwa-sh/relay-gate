schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-036"
title: "feature-flag.env の 9 キー以外のキーの値を、読み取りの途中だけ作業用の領域に置いてよい条件を CLI 契約に定める"
status: "approved"
generated_at: "2026-11-16T01:00:00Z"
context: |
  - CLI 契約は 2026-11-15 に「feature-flag.env から値を取り込むのは 9 キーだけ。9 キー以外のキーの値はプロセスの変数・環境変数へ取り込まない」と定めた(spec-decision-034 の決定 6)。
  - 同じ契約は、検証コマンドが入力の全体を一時ファイルへ複製して読むことも定めている。
  - 「プロセスの変数へ取り込まない」が、読み取りの途中の作業用の変数を含むかどうかは書かれていなかった。
    - 文字どおりに読むと、作業用の変数に全行を受ける読み方は規則に反するとも読める。
    - 規則の目的(設定ファイルの内容で読み手のプロセスの環境を書き換えさせない)から読むと、反しない。
  - 現在の検証コマンドの実装は、入力の複製を補助コマンドで行の種類・キー・値に分け、その出力を作業用の変数で受ける。
    - 作業用の変数は環境変数にしない。読み終えたときと失敗したときに空になる。9 キー以外はキー名だけを一覧に残す。
    - 独立した検証は、目印の値が runner の環境変数に存在せず、キーと同じ名前の変数にも設定されないことを確認した。
  - 境界が決まっていないと、同じ規則が及ぶ実行時の読み手を実装するときに、読み方の可否を読み手ごとに判断することになる。
  - 元の方針資料(しくみ・利用イメージ)は 9 キーの設定例を示すだけで、読み取りの途中の値の持ち方の記載は無い。
  - 利用者は 2026-11-15 に、一時的な保持を許し、条件を仕様に書くことを選んだ。
decision: |
  1. 「取り込む」の意味を定めた(CLI 契約 config_input_rules.env_files の「読み取りの途中の一時的な保持」)。
     - キーに対応する変数・環境変数へ値を載せること(その値を設定値として後の処理で使える状態にすること)を指す。
  2. 読み取りの途中に、行の内容を作業用の領域へ置くことを許した。次の 3 条件をすべて満たせば取り込みに当たらない。
     - 作業用の領域を環境変数にしない(読み手が起動する子プロセスへ渡らない)。
     - 読み終えたときと失敗したときのどちらでも、読み手が取り込まないキーの値を置いた作業用の領域を空にする(読み手が取り込むキーの値だけが入る作業用の変数は対象外)。
     - 読み取りの後まで残すのは、9 キー以外のキーについてはキー名だけ。
  3. 細部を 1 つに決めた。
     - 作業用の領域は、読み取りの処理の中だけで使うシェルの変数・配列、入力の複製の一時ファイル、読み取りに使う補助コマンドの入出力。
     - 作業用の領域の変数の名前は実装が固定で決め、ファイルに書かれたキー名から決めない。キー名から名前を決めた変数(例: 9 キー以外のキーの値を、そのキーと同じ名前の変数へ代入する場合)は、有効範囲や残す時間によらず作業用の領域に当たらない。
     - 読み取りは、行・キー・値を取り出し、読み手が使うキーの値をキーに対応する変数へ載せ終えるまでを指す。キーごとの検査や runner への問い合わせなど、設定値を使う処理は読み取りの後。
     - 補助コマンドへ、入力の複製の一時ファイルや標準入力で行の内容を読ませることは条件に反しない。補助コマンドの環境変数に載せて渡すことは反する。
     - 「失敗したとき」は、設定エラーで止めたときと、内部障害で打ち切ったときの両方。
     - 取り込みに当たる保持の例を書いた(キーと同じ名前の変数への代入、export、読み取りの後も参照できる変数に残す)。
     - 9 キーの一部だけを使う読み手では、検査にも処理にも使わないキーの値は、9 キー以外のキーの値と同じ扱い。既存の文は「自分が使うキー(検査に使うキーを含む)の値だけを取り込む」に語をそろえた。
     - 補助コマンドへコマンドライン引数で行の内容を渡すことの可否は定めていない(利用者の決定に無いため)。
  4. 境界の及ぶ範囲を定めた。
     - 検証コマンドと実行時の読み手のすべてに同じく及ぶ。読み手ごとに可否を判断しない。
     - 実現手段(作業用の領域を使うかどうか、どの補助コマンドを使うか)は縛らない。
  5. 参照を足した。
     - 同じ契約の feature-flag.env の reader_scope と keys。
     - UC「feature flag を設定する」の spec.md(分岐条件一覧)と tier-facade.md(設定契約)。
  6. BDD は追加していない。
     - 出力・終了コードなど、観測できる挙動は変わらない。
     - 環境へ値が載らないことは、既存の場面「9 キー以外のキーの値をプロセスの環境へ取り込まない」が判定する。
  7. 実装との照合(2026-11-15 時点)
     - 現在の実装は 3 条件を満たしている。実装とテストの変更は要らない。
     - 実装には、9 キーの値だけを一時的に受ける固定名の変数があり、読み取りの後も最後の値が残る。入るのは読み手が取り込むキーの値だけのため、条件の対象外。
consequences:
  positive:
    - "9 キー以外のキーの値を読み取りの途中に作業用の領域へ置いてよいかどうかが、仕様から 1 つに決まる"
    - "実行時の読み手を実装するときに、読み方の可否を読み手ごとに判断しなくて済む"
    - "入力の全体を一時ファイルへ複製する既存の規則と考え方がそろう"
    - "いまの実装とテストを変えずに済む"
  negative:
    - "9 キー以外のキーの値が、読み取りの間だけ読み手のプロセスのメモリに存在する"
    - "3 条件のうち「空にする」「後に残すのはキー名だけ」は出力から観測できないため、実装の確認はコードの検証に頼る"
alternatives_considered:
  - name: "一時的な保持を許さない(9 キー以外のキーの値は、読み取りの途中でもシェルの変数に入れない)"
    reason_rejected: "実装の変更とテストの追加が要る。値は一時ファイルの複製と補助コマンドのメモリには引き続き存在するため、得られる安全上の差は小さい。利用者は一時的な保持を許すことを選んだ"
  - name: "境界を仕様に書かない"
    reason_rejected: "規則を文字どおりに読むか目的から読むかで可否が分かれ、読み手ごとに判断が要る。利用者は条件を仕様に書くことを選んだ"
