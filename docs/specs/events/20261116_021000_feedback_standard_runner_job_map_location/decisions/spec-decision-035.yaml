schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-035"
title: "feature flag の runner / worker の実体パスに相対パスを受け付け、基準を設定ファイルのあるディレクトリにする"
status: "approved"
generated_at: "2026-11-15T16:40:00Z"
context: |
  - 元の方針資料は、feature flag の設定例を 2 か所に示し、どちらも実体パスを相対パスで書いている。
    - しくみの資料: BLUE_RUNNER=./blue-runner.sh / GREEN_RUNNER=./green-runner.sh / RAPID_CROSSCHECK_RUNNER=./rapid-crosscheck-runner.sh / RAPID_CROSSCHECK_WORKER=./rapid-crosscheck-worker.sh
    - 利用イメージの資料: 同じ 4 キーを ./ で始まる相対パスで書いている。
  - これまでの仕様は、この 4 キーを絶対パス必須とし、相対パスを `error: path is not absolute key=<KEY> path=<v>`(終了コード 2)で拒否していた。
    - 方針資料の設定例は、これまでの仕様では検証を通らなかった(仕様が方針資料から離れていた)。
    - この規則は 2026-08-30 の仕様の初回生成時に足されたもので、要求(USDM)・方針資料・判断記録のどこにも理由の記載が無い。USDM に 4 キーの絶対パスの受け入れ基準は無い。
  - 同じ種類の規則(slot ジョブマップの work_dir と script の絶対パス検査)は、2026-09-22 の利用者決定でやめた。
    - そのときの判断記録(spec-decision-013 の決定 3)は「feature flag の runner パスの絶対パス検査は変えない」とだけ書き、理由を書いていない。
  - 相対パスを受け付けるだけでは、どこを基準に実体を探すかが決まらない。
    - ジョブスケジューラから起動されるときの作業ディレクトリは決まっていない。
    - 作業ディレクトリを基準にすると、起動する場所で指す先が変わる。
  - 利用者は 2026-11-15 に、次のとおり決定した: 「相対パスを受け付ける。基準は設定ファイルのあるディレクトリとし、仕様に明記する」。
    - 範囲は feature-flag.env の 4 キーだけ。比較ツール起動コマンドの絶対パス検査と、slot ジョブマップの所在は変えない。
decision: |
  1. feature-flag.env の BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER の 4 キーは、絶対パスと相対パスのどちらも受け付ける。
     - 規則の正本は CLI 契約 config_files.feature-flag.env.runner_path_resolution(新設)。UC 別仕様はここを参照する。
     - `error: path is not absolute` は、この 4 キーでは出さない(比較ツール起動コマンドの検証には残る)。
  2. 相対パスの判定: 値が `/` で始まらなければ相対パス。
     - `./x`・`x`・`../d/x` を同じ基準で解決する。
     - `~`・環境変数・コマンド置換は展開しない(値は文字のまま)。
  3. 基準のディレクトリ: その feature-flag.env のあるディレクトリ。プロセスの作業ディレクトリは基準にしない。
     - 検証コマンドは --feature-flag に渡されたパス、実行時の読み手は `$RELAY_GATE_CONFIG_DIR/feature-flag.env` のディレクトリ部分を使う。
     - 設定ファイルのパス自体が相対パスなら、作業ディレクトリ(論理パス)で絶対化してからディレクトリ部分を取る。作業ディレクトリを使うのはこの絶対化だけ。
     - シンボリックリンクは辿らない(渡されたパスの字面のディレクトリ)。
  4. 解決後のパスの形: 基準のディレクトリ + `/` + 値 を連結した絶対パス。絶対パスの値はそのまま。
     - `.`・`..`・連続する `/` を畳む正規化はしない。
     - 理由: 外部コマンドに頼らずに決まり、表示から設定の書き方を追える。
  5. 解決後のパスを使う場所を 1 つに定めた。
     - 存在・実行権限の検査、runner への --help の問い合わせ、runner の起動、slot runner へ環境変数で渡す速報クロスチェック runner の値。
     - 検証結果の stdout の 4 行(blue_runner / green_runner / rapid_crosscheck_runner / rapid_crosscheck_worker)。
     - 実行不可の error 行の path= と、runner を表示する warn / error 行・実行ログの runner=。
  6. error 行どうしの順(2026-11-15 に定めた順)の 1 キーの中の検査の順は、「欠落・空 → 実体が無い・実行不可」の 2 段になった。
     - キーどうしの順は変えていない。12 行の例は、相対パスの実体が無い場合の行に置き換えた。
  7. 同じ規則を、検証コマンドと、4 キーの値を使う実行時の読み手(ジョブを起動するコマンドと、background 側をリランするコマンド)に適用する。
     - 設定ファイルのパスの文字列が同じなら、検証と実行時で同じ実体が選ばれる。
  8. 2026-09-22 の判断記録(spec-decision-013)の決定 3「feature flag の runner パスの絶対パス検査は変えない」は、今回の利用者決定で上書きする。
     - spec-decision-013 のほかの決定(ジョブマップの work_dir / script の形式を検査しない など)は変えない。
  9. 実装との差分: 現在の実装は、この 4 キーの相対パスを `error: path is not absolute` で拒否する。
     - 新しい契約とは次の点が違う: 相対パスの受け付け、設定ファイルのあるディレクトリを基準にした解決、解決後のパスでの検査・問い合わせ・起動・受け渡し・表示。
     - 仕様を正とし、実装は次の実装の回で契約に合わせる。この判断記録では実装を変えていない。
  10. 判定する BDD を、該当する UC に追加・置換した。
      - feature flag を設定する: 相対パスの設定が通る場面、基準が作業ディレクトリでない場面、設定ファイルのパスが相対パスの場面、シンボリックリンクの場面、実体が無い場面、`~` を展開しない場面。
      - slot runner の実体スクリプトを割り当てる: 相対パスの runner を拒否する場面を、解決して問い合わせる場面と、解決後のパスで警告する場面に置き換えた。
      - slot 実行モードを選択して runner を起動する / 元の execution-spec.json から復元して新しい run_id で起動する: 作業ディレクトリを別の場所にして起動しても、設定ファイルのあるディレクトリの実体が起動される場面。
consequences:
  positive:
    - "方針資料の 2 つの設定例の 4 キーの書き方が、実体を設定ファイルと同じディレクトリに置けば検証を通る"
    - "設定検証を手元で試すサンプルを、展開先のパスを埋め込まずに、置いたままのファイルで検証できる"
    - "起動する場所(作業ディレクトリ)によって指す実体が変わらない"
    - "検証結果と error 行に解決後のパスが出るため、実際に使われる実体が読み手に分かる"
  negative:
    - "解決後のパスを正規化しないため、表示に `/./` や `/../` が残る"
    - "置き場と違う場所にあるファイルを検証すると、そのファイルのあるディレクトリを基準に解決するため、置き場のファイルとは別の実体を確かめることになる"
    - "現在の実装は新しい契約と違うため、実装の修正が要る"
alternatives_considered:
  - name: "絶対パス必須のままにする"
    reason_rejected: "方針資料の設定例が検証を通らない。USDM・方針資料・判断記録のどこにも絶対パス必須の理由が無い。利用者が 2026-11-15 に相対パスを受け付けると決定した"
  - name: "プロセスの作業ディレクトリを基準にする"
    reason_rejected: "ジョブスケジューラから起動されるときの作業ディレクトリは決まっておらず、起動する場所で指す先が変わる。利用者が基準を設定ファイルのあるディレクトリと決定した"
  - name: "解決後のパスを正規化する(`.`・`..` を畳む、シンボリックリンクを辿る)"
    reason_rejected: "正規化には外部コマンドか独自の文字列処理が要り、シンボリックリンクを辿るかどうかで結果が分かれる。連結だけの規則なら 1 つに決まり、表示から設定の書き方を追える"
  - name: "表示には設定に書いた値をそのまま出す"
    reason_rejected: "相対パスのままでは、どの実体が使われるかが表示から分からない。解決後の絶対パスなら実際に使われる実体が読み手に分かる"
  - name: "比較ツール起動コマンドとジョブマップの所在にも同じ規則を広げる"
    reason_rejected: "比較ツール起動コマンドの絶対パス検査は 2026-10 の利用者決定で USDM に受け入れ基準があり、方針資料に相対パスの例が無い。今回の利用者決定の範囲は 4 キーだけ"
