uc: "速報クロスチェック runner へ完了通知を送信する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"
bounded_context_id: "BC-002"
aggregate_id: "AG-002"

models:
  - name: "PublishRunnerResult"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "Runner Result"
  - name: "RapidModeGuard"
    tier: "tier-facade"
    layer: "domain"
    type: "value-object"
    rdra_info: "feature flag 設定"
  - name: "RunnerResultRecord"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "Runner Result"
  - name: "SlotCompletedNotice"
    tier: "tier-facade"
    layer: "gateway"
    type: "value-object"
    rdra_info: "完了通知"
  - name: "SlotCompletedArgs"
    tier: "tier-rapid-crosscheck"
    layer: "presentation"
    type: "request"
    rdra_info: "完了通知"
  - name: "RegisterCompletion"
    tier: "tier-rapid-crosscheck"
    layer: "usecase"
    type: "command"
    rdra_info: "完了通知"
  - name: "SlotResult"
    tier: "tier-rapid-crosscheck"
    layer: "domain"
    type: "value-object"
    rdra_info: "slot 実行"
  - name: "RapidRunRecord"
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "速報実行(rapid_run)"

tables:
  - name: "rapid_runs"
    rdra_info: "速報実行(rapid_run)"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?"
      - type: "UPDATE"
        columns:
          - name: "blue_status"
            value: "SUCCEEDED(exit_code=0) / FAILED(非 0)。blue-completed のとき"
          - name: "blue_artifact_uri"
            value: "--artifact-uri"
          - name: "blue_completed_at"
            value: "受信時刻 UTC"
          - name: "green_status"
            value: "SUCCEEDED / FAILED。green-completed のとき"
          - name: "green_artifact_uri"
            value: "--artifact-uri"
          - name: "green_completed_at"
            value: "受信時刻 UTC"
        where: "run_id = ? AND {role}_status IS NULL"
    indexes_needed: []

kvs: []
object_storage: []
