    stdin: "なし"
    stdout: "固定順 9 行: run_id / job_id / request_status / blue_status / green_status / exit_code / worker_id / requested_at / completed_at。続けて TSV(ヘッダー: comparison_result_id, comparison_type, status, difference_count, report_uri, compared_at。compared_at 昇順・同値は comparison_result_id 昇順、--limit まで。0 件でもヘッダー行は出す)。--show-output 時は TSV の後に空行 1 行、`--- stdout ---` 行、本文、`--- stderr ---` 行、本文(data-visualization.md 1. が正)"
    stderr: "info: rapid result is for investigation only; use final crosscheck for release decision(常時)/ warn: output truncated limit=N / error: option required option=--run-id(2)/ error: invalid value option=--run-id|--limit value=...(2)/ error: unknown option option=...(2)/ error: rapid crosscheck request not found run_id=... / error: rapid crosscheck is off; no management db to query mode=off / error: management db query failed run_id=..."
    exit_codes:
      - code: 0
