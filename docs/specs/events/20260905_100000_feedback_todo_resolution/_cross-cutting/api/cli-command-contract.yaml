  - name: "final-crosscheck-runner.sh"
    tier: "tier-final-crosscheck"
    synopsis: "final-crosscheck-runner.sh --business-date <YYYY-MM-DD> --catalog-version <ver> [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(確報クロスチェックジョブ定義)。結果は運用者がジョブスケジューラの実行履歴で読む"
    defined_in_uc: "クロスチェック業務/確報クロスチェックフロー/確報比較依頼を登録して終端状態まで待機する"
    used_by_ucs:
      - "クロスチェック業務/確報クロスチェックフロー/保存済みの確報結果をジョブスケジューラへ返す"
      - "クロスチェック業務/確報クロスチェックフロー/確報クロスチェック結果を確認する"
    args: []
    options:
      - name: "--business-date"
        type: "string"
        required: true
        description: "比較対象の業務日付(YYYY-MM-DD)"
      - name: "--catalog-version"
        type: "string"
        required: true
        description: "対象カタログの版。target-catalog.csv の catalog_version 列に存在する値。crosscheck-job-map.csv の `# catalog_version=` より優先"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を実行ログに出す(stderr には出さない)"
    stdin: "なし"
    stdout: "待機中は出力しない。終端到達後は依頼に保存された stdout をバイト列のまま出す(NULL は 0 バイト)。状態名・差分件数・レポート URI・final_crosscheck_id を追加しない"
    stderr: "終端到達後は依頼に保存された stderr をバイト列のまま出す。中継に至る前の relay-gate 自身のエラーのみ `error:`(+ `hint:`): error: option required option=--business-date|--catalog-version / error: invalid value option=--business-date value=... / error: unknown option option=... / error: config file not found path: ...(final-crosscheck.env 不在)/ error: option required option=FINAL_DB_CONN_REF path: ... / error: target_catalog_path declaration not found path: ...(crosscheck-job-map.csv に `# target_catalog_path=` なし)/ error: catalog version not found catalog_version=... path: ... / error: management db connection failed conn_ref=... / error: management db query failed final_crosscheck_id=... / error: polling limit exceeded final_crosscheck_id=... status=... limit_sec=...(status は超過時点の依頼 status)/ error: request aborted before completion final_crosscheck_id=...(exit_code NULL)。待機中の進捗は実行ログにのみ(`INFO polling final_crosscheck_id=... status=... elapsed_minutes=...`)"
    exit_codes:
      - code: "依頼に保存された exit_code(0 / 3 / 6 / その他)"
        meaning: "無加工中継。0 = 比較 OK(リリース判断の正本)/ 3 = 比較 NG / 6 = 実行エラー"
        condition: "依頼が SUCCEEDED / FAILED に到達し exit_code が 0〜255"
      - code: 2
        meaning: "入力・設定検証エラー(中継に至る前)"
        condition: "引数欠落、business_date 形式不正、未知のオプション、final-crosscheck.env 不在または必須キー欠落、`# target_catalog_path=` なし、対象カタログに catalog_version の行が無い"
      - code: 6
        meaning: "実行エラー(中継に至る前、または中継不能)"
        condition: "管理 DB 接続・INSERT・SELECT 失敗、polling 上限 FINAL_POLL_LIMIT_SEC 超過(依頼は変更しない)、exit_code が NULL(ABORTED で比較未完了)、exit_code が 0〜255 の範囲外"
    idempotency: "起動のたびに新しい final_crosscheck_id で依頼を 1 件登録する(同じ business_date / catalog_version で複数回起動すれば依頼は複数件)。polling 中は状態を UPDATE しない。再実行はジョブスケジューラの正規ジョブで行う"

