  - name: "validate-config.sh"
    tier: "tier-facade"
    tier_note: "エントリポイントの所有 tier は tier-facade(bin/ 配置先)。検証種別ごとの検証ロジックの所有 tier は options[].owner_tier に従う(--crosscheck-job-map = tier-rapid-crosscheck、--target-catalog = tier-final-crosscheck)"
    synopsis: "validate-config.sh (--feature-flag <path> | --job-map <path> | --crosscheck-job-map <path> | --target-catalog <path>) [--verbose] [--help]"
    invoked_by: "基盤適用設計者 / 運用者(直接起動)"
    defined_in_uc: "適用構成業務/適用構成定義フロー/feature flag を設定する"
    used_by_ucs:
      - "適用構成業務/適用構成定義フロー/slot ごとのジョブマップを定義する"
      - "適用構成業務/適用構成定義フロー/クロスチェックのジョブマップと比較定義を定義する"
      - "適用構成業務/適用構成定義フロー/slot runner の実体スクリプトを割り当てる"
      - "実行監視業務/background 実行監視フロー/hang_detect_limit_minutes をジョブごとに調整する"
      - "適用構成業務/適用構成定義フロー/切り替えた運用モードで業務ジョブを実行する"
    args: []
    options:
      - name: "--feature-flag"
        type: "string"
        required: false
        owner_tier: "tier-facade"
        description: "検証する feature flag env ファイルのパス。他の検証種別オプションと排他。runner 実体(絶対パス・実行可能・runner-if-version 応答)と対応ジョブマップの存在も検証する"
      - name: "--job-map"
        type: "string"
        required: false
        owner_tier: "tier-facade"
        description: "検証する slot ジョブマップ CSV のパス。他の検証種別オプションと排他"
      - name: "--crosscheck-job-map"
        type: "string"
        required: false
        owner_tier: "tier-rapid-crosscheck"
        description: "検証するクロスチェックジョブマップ CSV のパス。値必須(既定パス $RELAY_GATE_CONFIG_DIR/crosscheck-job-map.csv を使う場合も明示的に渡す。conventions.option_style の `--key value` 固定に従う)。他の検証種別オプションと排他"
      - name: "--target-catalog"
        type: "string"
        required: false
        owner_tier: "tier-final-crosscheck"
        description: "検証する対象カタログ CSV のパス。値必須(既定パス $RELAY_GATE_CONFIG_DIR/target-catalog.csv を使う場合も明示的に渡す)。他の検証種別オプションと排他"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "行ごとの解決結果を info: で stderr に出す"
    option_exclusivity: "検証種別オプション 4 つのうちちょうど 1 つを指定する。0 個または 2 個以上は終了コード 2"
    stdin: "なし"
    stdout: |-
      検証種別ごとに固定順の key=value:
      - --feature-flag: config_path, blue_mode, green_mode, blue_impl, green_impl, blue_runner, green_runner, rapid_crosscheck_mode, rapid_crosscheck_runner, rapid_crosscheck_worker, operation_mode, blue_job_map, green_job_map, blue_runner_if_version, green_runner_if_version(operation_mode は config_files.feature-flag.env.derived の英字コード parallel | green_only | next_gen_parallel | custom。off の slot は <slot>_impl / <slot>_runner / <slot>_job_map / <slot>_runner_if_version が `-`。RAPID_CROSSCHECK_MODE=off では rapid_crosscheck_runner / rapid_crosscheck_worker が `-`。runner が --help に応答しない・runner-if-version= 行を返さない場合も <slot>_runner_if_version=- で warn:)
      - --job-map: map_path, rows, map_version(任意列 map_version が無い・空なら `-`。impl_version は出さない)
      - --crosscheck-job-map: config=crosscheck-job-map, path: ..., rows=N, target_catalog_path: ..., catalog_version=, exit_code_contract=0:OK,3:NG,6:ERROR, status=valid|invalid, violations=N(invalid 時)
      - --target-catalog: config=target-catalog, path: ..., rows=N, catalog_versions=v1,v2, tables=N, files=N, status=valid|invalid, violations=N(invalid 時)
    stderr: |-
      違反ごとに `error:` 1 行(全件)。同種の違反は検証種別(--feature-flag / --job-map / --crosscheck-job-map / --target-catalog)を問わず次の共通形式にする(各 UC の tier md はこれに揃える):
      - ファイル無し・読めない: `error: config file not found path: ...`(2)/ `error: config file is not readable path: ...`(2)
      - ヘッダー不一致(slot ジョブマップ。列はヘッダー名で対応付ける): `error: job map header mismatch missing=<col,...> path: ...`(2。必須列の欠落、host / user の片方だけ。順序違いは違反にしない。未知列は `warn: unknown column column=<name> path: ...`。旧 `expected=... actual=...` 形式は使わない)
      - ヘッダー不一致(クロスチェックジョブマップ・対象カタログ。列順固定): `error: header mismatch expected=<col1,col2,...> actual=<col1,...> path: ...`(2)
      - CSV クォート不正(全 CSV 共通): `error: csv quote is invalid line=N path: ...`(2。閉じられていない二重引用符、囲みの外に二重引用符、囲み無しセルのカンマ等。config_files の csv_rules)
      - 列数不一致: `error: column count mismatch line=N expected=<n> actual=<n>`(2)
      - feature flag(--feature-flag): 必須キー欠落・空 `error: option required option=<KEY> path: ...`(2)/ enum 外 `error: invalid value key=<KEY> value=...`(2。RAPID_CROSSCHECK_MODE / BLUE_MODE / GREEN_MODE では次行に `hint: use foreground, background or off` を続ける)/ 絶対パスでない `error: path is not absolute key=<KEY> path=...`(2)/ 実体が無い・実行不可 `error: file not executable key=<KEY> path=...`(2)/ foreground 重複・無し `error: foreground slot must be exactly one blue_mode=... green_mode=...`(2)/ 確報制御キーあり `error: final crosscheck key is not allowed key=<KEY>`(2)/ job map 実体無し `error: job map not found slot=<blue|green> map=<path>`(2)/ 未知キー `warn: unknown key key=<KEY> path: ...`(継続)。文言は config_files.feature-flag.env.error_messages が正で、facade.sh の起動時検証も同文
      - 重複キー: `error: duplicate job_id job_id=... lines=<n1,n2,...>`(2。2 回目以降の行番号をカンマ区切りで全部)。対象カタログの重複は `error: duplicate target catalog_version=... target_type=... target_identifier=... lines=<n1,n2,...>`
      - 行の値不正: `error: <column> is <reason> line=N job_id=... value=...`(例: `error: hang_detect_limit_minutes is not a non-negative integer line=N job_id=... value=...` / `error: host is empty line=N job_id=... value=`(user だけ値があり host が空)/ `error: user is empty line=N job_id=... value=`(host だけ値があり user が空。両方空はローカル実行で正常)/ `error: script is not absolute line=N job_id=... value=...` / `error: work_dir is not absolute line=N job_id=... value=...` / `error: fixed_params is not a json array of strings line=N job_id=... value=...` / `error: compare_options is missing {blue} or {green} line=N job_id=... value=...` / `error: job_id is not final-crosscheck for comparison_type=full line=N job_id=... value=...` / `error: <column> is empty line=N job_id=... value=`。job_id 列を持たない対象カタログは `job_id=` を付けない: `error: target_type is not in table,file line=N value=...`)
      - 宣言不正: `error: <declaration> declaration not found path: ...` / `error: <declaration> declaration is invalid value=... path: ...`(2)
      未知キー(`warn: unknown key key=<KEY> path: ...`)・未知列(`warn: unknown column column=<name> path: ...`。slot ジョブマップの impl_version 列を含む)・credential_ref のパス形式(`warn: credential_ref looks like a secret or path line=N job_id=<v>`)・版の混在(`warn: mixed map_version values=<a>,<b>`)・runner-if-version 未応答(`warn: runner does not respond to --help slot=... runner=...`)は `warn:`。対処が明確なら `hint:`
      補助出力(--verbose、stderr): `--job-map --verbose` は解決結果を 1 行 1 job_id で `info: resolved job_id=... host=<host|-> user=<user|-> exec=<ssh|local> work_dir=... script=... fixed_params=[...] hang_detect_limit_minutes=N`(host / user が無い・空の行は host=- user=- exec=local。fixed_params は解析後の配列を JSON 配列表記)。終了コードには影響しない
    exit_codes:
      - code: 0
        meaning: "検証 OK(違反 0 件)"
        condition: "全ルール通過"
      - code: 2
        meaning: "入力・設定検証エラー"
        condition: "検証種別オプションの指定数不正 / 未知のオプション / ファイル不在・読み取り不可 / ヘッダー不一致(必須列欠落、host / user の片方だけ)/ CSV クォート不正 / 列数不一致 / 行の違反 1 件以上(job_id 不正・重複、絶対パス違反、host / user の片方だけ空、fixed_params 不正、hang_detect_limit_minutes 不正、mode 列挙外、両 slot foreground、foreground 無し、off でない slot の BLUE_IMPL / GREEN_IMPL 欠落・空、BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER の絶対パス違反・実行不可、確報制御キーあり、compare_command 実行不可、プレースホルダ欠落、exit_code_contract 宣言不正、対象カタログ参照未解決、target_type 不正、対象重複)"
    idempotency: "参照のみ(設定ファイルを変更しない)"

# 比較ツールは外部システム(適用側が用意)。commands には含めず、relay-gate から見た起動契約と終了コード契約だけを書く。
external_interfaces:
  - name: "比較ツール(速報。comparison_type=job)"
    invoked_by: "rapid-crosscheck-worker.sh"
    launch: "crosscheck-job-map.csv の該当 job_id 行: `compare_command` + `compare_options`(`{blue}` / `{green}` を成果物 URI に置換。空白区切り)"
    stdout_stderr: "facade/<run_id>/rapid-crosscheck/stdout.log / stderr.log へ保存(.tmp → mv)し、依頼レコードの stdout / stderr 列にも保存"
    exit_code_contract: "0 = 比較 OK / 3 = 比較 NG(警告終了)/ 6 = 実行エラー / その他の非 0 = 比較ツール実装の契約に従う。relay-gate は値を変換しない(shared_rules.compare_tool_exit_code)"
    result_registration: "comparison_results に comparison_type=job、status=OK|NG|FAILED、difference_count、report_uri を登録(difference_count / report_uri の取得方法は比較ツール契約に依存。方針資料に定めが無い)。crosscheck-job-map.csv に job_id の行が無い場合は起動せず、comparison_results を INSERT しないで依頼を FAILED / exit_code=6 / error_summary=`comparison definition not found job_id=...` で終端する"
  - name: "比較ツール(確報。comparison_type=full)"
    invoked_by: "final-crosscheck-worker.sh"
    launch: "crosscheck-job-map.csv の `job_id=final-crosscheck` / `comparison_type=full` 行: `compare_command` + `compare_options`(`{catalog_path}` / `{catalog_version}` / `{business_date}` を置換)。対象カタログの該当版の行だけを facade/<final_crosscheck_id>/final-crosscheck/input/target-catalog.csv に抜き出して渡す"
    stdout_stderr: "facade/<final_crosscheck_id>/final-crosscheck/stdout.log / stderr.log へ保存し、依頼レコードの stdout / stderr 列にも保存(final-crosscheck-runner.sh が無加工中継する)"
    exit_code_contract: "速報と同じ(0 / 3 / 6 / その他)。依頼レコードの exit_code に保存し、確報 runner がジョブスケジューラへそのまま返す"
  - name: "メール送信コマンド(OS 標準)"
    invoked_by: "hang-detector.sh"
    launch: "hang-detector.env の ALERT_MAIL_CMD。末尾が mail / mailx なら `-s \"$subject\" \"$ALERT_MAIL_TO\" < body.txt`、sendmail なら Subject / To / Content-Type ヘッダを本文先頭に付けて `-t < message.txt`。それ以外は mail 系として扱う(仮採用)。$subject の先頭は hang-detector.env の ALERT_SUBJECT_PREFIX(既定 `[relay-gate]`)"
    exit_code_contract: "非 0 は送信失敗。hang-detector は error: mail send failed ... を出し alerted_at を更新せず終了コード 6(次回再送)"
  - name: "SSH(実装スクリプトの実行)"
    invoked_by: "slot runner"
    launch: "`ssh -n {user}@{host} 'cd {work_dir} && {script} {fixed_params...} {params...}'`。credential_ref は参照名のみ(鍵の所在は適用側の SSH 設定)。ジョブマップの host / user が両方無い・両方空の slot は SSH せず、runner のプロセスユーザーでローカルに `cd {work_dir} && {script} {fixed_params...} {params...}` を実行する(execution-spec.json の host / user は null)"
    exit_code_contract: "リモート実装の終了コードを exitcode.txt に保存。SSH 自体の接続・実行失敗は 6(仮採用)"
  - name: "ジョブスケジューラ"
    role: "facade.sh / final-crosscheck-runner.sh / hang-detector.sh / background-rerun.sh / worker(--once)/ abort-*(--yes)を同期起動し、stdout / stderr / 終了コードを実行履歴として保管する(監査の正本)"

# 管理 DB(RDB)は relay-gate 内部のジョブキュー兼管理 DB(内部データストア)であり、外部システムではない(RDRA 外部システムは上記 6 種: ジョブスケジューラ / 現行実装(blue) / 新実装(green) / 比較ツール / メール通知 / リモート実行ホスト(SSH))。
internal_datastores:
  - name: "ジョブキュー兼管理 DB(RDB)"
    schema: "_cross-cutting/datastore/rdb-schema.yaml"
    used_when: "RAPID_CROSSCHECK_MODE が off 以外(速報系・監視記録・中止の二重マッピング・リラン系譜)。確報系は FINAL_DB_CONN_REF で常に使う。off では速報系・監視記録・abort-blue / abort-green・background-rerun --role blue|green は管理 DB に触れず成果物ファイルだけで動く"
    access: "gateway 層の RDB クライアントアダプタ経由。接続情報は参照名(RAPID_DB_CONN_REF / HANG_DB_CONN_REF / FINAL_DB_CONN_REF)でのみ扱う"

config_files:
  - file: "feature-flag.env"
    path: "$RELAY_GATE_CONFIG_DIR/feature-flag.env"
    format: "env(KEY=VALUE、1 行 1 キー。`#` コメント可)"
    owner: "基盤適用設計者(設定所有区分: feature flag)"
    defined_in_uc: "適用構成業務/適用構成定義フロー/feature flag を設定する"
    readers: ["facade.sh(全キー。runner へは環境変数で渡す。slot runner は読まない)", "background-rerun.sh(RAPID_CROSSCHECK_MODE / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER)", "hang-detector.sh(RAPID_CROSSCHECK_MODE のみ)", "rapid-crosscheck-worker.sh / rapid-crosscheck-result.sh / run-lineage.sh / hang-detect-trend.sh / abort-blue.sh / abort-green.sh / abort-rapid-crosscheck.sh(RAPID_CROSSCHECK_MODE のみ。abort-final-crosscheck.sh と確報系は読まない)", "validate-config.sh --feature-flag"]
    keys:
      - name: "BLUE_MODE"
        type: "enum"
        enum: ["foreground", "background", "off"]
        required: true
        description: "blue slot の実行モード"
      - name: "GREEN_MODE"
        type: "enum"
        enum: ["foreground", "background", "off"]
        required: true
        description: "green slot の実行モード"
      - name: "RAPID_CROSSCHECK_MODE"
        type: "enum"
        enum: ["foreground", "background", "off"]
        required: true
        description: "速報クロスチェックの制御。foreground / background は slot runner が完了通知を送信し速報管理 DB へ書き込む(両値の挙動は RDRA / USDM が定める範囲で同じ。判定はすべて「off か off 以外か」)。off は完了通知を送信せず速報管理 DB へ接続も書込みもしない(parallel_runs / slot_executions / rapid_runs を作らず成果物だけで動く)"
      - name: "BLUE_IMPL"
        type: "string(非空)"
        required: "BLUE_MODE が off でないとき Yes"
        description: "blue の実装版。execution-spec.json の slots.blue.impl_version の出所(facade が環境変数 BLUE_IMPL で runner へ渡す)"
      - name: "GREEN_IMPL"
        type: "string(非空)"
        required: "GREEN_MODE が off でないとき Yes"
        description: "green の実装版。slots.green.impl_version の出所(環境変数 GREEN_IMPL)"
      - name: "BLUE_RUNNER"
        type: "string(absolute path)"
        required: "BLUE_MODE が off でないとき Yes"
        description: "blue slot runner 実体の絶対パス。存在・実行可能"
      - name: "GREEN_RUNNER"
        type: "string(absolute path)"
        required: "GREEN_MODE が off でないとき Yes"
        description: "green slot runner 実体の絶対パス。存在・実行可能"
      - name: "RAPID_CROSSCHECK_RUNNER"
        type: "string(absolute path)"
        required: "RAPID_CROSSCHECK_MODE が off でないとき Yes"
        description: "slot runner が完了通知(blue-completed / green-completed)を送る速報クロスチェック runner の実体パス。存在・実行可能(facade / background-rerun が環境変数 RAPID_CROSSCHECK_RUNNER で runner へ渡す。$RELAY_GATE_HOME 配下の固定パス解決はしない)"
      - name: "RAPID_CROSSCHECK_WORKER"
        type: "string(absolute path)"
        required: "RAPID_CROSSCHECK_MODE が off でないとき Yes"
        description: "速報クロスチェック worker の実体パス(ジョブスケジューラの worker ジョブ定義 / 常駐起動が参照する実体)。存在・実行可能"
    validation_rules:
      - "mode の組合せ: foreground はちょうど 1 slot(両 foreground / foreground 無しは違反)"
      - "確報の制御キーは置かない(あれば違反。確報はジョブ定義で制御する)"
      - "未知キーは warn(上記 9 キーは未知キーではない。上記 9 キー以外に必須キーは無い。設定版 CONFIG_VERSION は持たない)"
      - "off でない slot の <SLOT>_IMPL は非空、<SLOT>_RUNNER は絶対パスかつ存在・実行可能。RAPID_CROSSCHECK_MODE が off 以外なら RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER も同じ"
      - "off でない slot の <slot>-job-map.csv が存在し読める(無ければ違反)"
    error_messages:
      - "必須キー欠落・空: `error: option required option=<KEY> path: ...`(2)"
      - "enum 外: `error: invalid value key=<KEY> value=...`(2)。KEY が RAPID_CROSSCHECK_MODE / BLUE_MODE / GREEN_MODE のときは次行に `hint: use foreground, background or off` を続ける"
      - "絶対パスでない: `error: path is not absolute key=<KEY> path=...`(2)"
      - "実体が無い・実行不可: `error: file not executable key=<KEY> path=...`(2)"
      - "foreground 重複・無し: `error: foreground slot must be exactly one blue_mode=... green_mode=...`(2)"
      - "確報制御キーあり: `error: final crosscheck key is not allowed key=<KEY>`(2)"
      - "job map 実体無し: `error: job map not found slot=<blue|green> map=<path>`(2)"
      - "未知キー: `warn: unknown key key=<KEY> path: ...`(継続)"
    derived: |-
      operation_mode = (BLUE_MODE, GREEN_MODE, RAPID_CROSSCHECK_MODE) の組合せから導出した運用モードの英字コード(RDRA バリエーション「運用モード」との対応):
      - `parallel` = 並行稼働(blue foreground / green background / 速報 background)
      - `green_only` = 新実装の単独本番(blue off / green foreground / 速報 off)
      - `next_gen_parallel` = 次世代実装との並行稼働(blue background / green foreground / 速報 background)
      - `custom` = その他(上記 3 組合せ以外)
      出力に現れる値は英字コードのみ(日本語名は出さない)。validate-config.sh --feature-flag の stdout(operation_mode=)と facade.sh の実行ログ `INFO feature flag loaded ... operation_mode=...` 行に現れる(stderr / 管理 DB には出さない)
  - file: "<slot>-job-map.csv(blue-job-map.csv / green-job-map.csv)"
    path: "$RELAY_GATE_CONFIG_DIR/<role>-job-map.csv"
    format: "CSV(1 行目ヘッダー、1 行 1 job_id。行頭 `#` の行はコメント。改行コード LF。セル内に改行は置けない。csv_rules 参照)"
    owner: "基盤適用設計者(設定所有区分: slot ジョブマップ)"
    defined_in_uc: "適用構成業務/適用構成定義フロー/slot ごとのジョブマップを定義する"
    readers: ["slot runner(--execution-spec 無しの通常起動)", "validate-config.sh --job-map / --feature-flag"]
    csv_rules:
      - "セルはカンマ区切り。セルは二重引用符で囲める(囲まない場合はカンマ・二重引用符を含められない)。囲んだセル内の二重引用符は `\"\"` と二重化する"
      - "fixed_params は JSON 配列文字列を格納するセルで、必ず二重引用符で囲む(例: `\"[\"\"p1\"\",\"\"p2 p3\"\"]\"` → 固定引数 `p1` と `p2 p3` の 2 要素。空は `\"[]\"` または `[]`)"
      - "bash 単独(外部 CSV パーサ非依存)で 1 文字ずつ状態機械で解析できる範囲に限定する(ネスト・複数行セル不可)。違反は `error: csv quote is invalid line=N path: ...`(2)"
      - "クロスチェックジョブマップ・対象カタログも同じ CSV 規則(列構成は各ファイルの columns。宣言行は行頭 `#` のコメント行に置く)"
    column_matching: "列はヘッダー名で対応付ける(順序は job_id,host,user,work_dir,script,fixed_params,hang_detect_limit_minutes[,credential_ref][,map_version] を推奨するが検証は名前で行う)。必須列 5: job_id / work_dir / script / fixed_params / hang_detect_limit_minutes。任意列: host / user(両方あるか両方無いか。両方無い、または両方の値が空 = ローカル実行。片方だけある = `error: job map header mismatch missing=<host|user> path: ...`、片方だけ空 = `error: host is empty ...` / `error: user is empty ...`)、credential_ref / map_version(末尾の任意列。ヘッダーに無ければ無いものとして扱い、値が空も可)。未知列(impl_version を含む)は `warn: unknown column column=<name> path: ...`。必須列の欠落は `error: job map header mismatch missing=<col,...> path: ...`(2)"
    columns:
      - name: "job_id"
        type: "string"
        required: true
        description: "英数字・_・- のみ。ファイル内で一意"
      - name: "host"
        type: "string"
        required: false
        description: "実行ホスト。列が無い・値が空(user も空)ならローカル実行(SSH しない)。execution-spec.json では null"
      - name: "user"
        type: "string"
        required: false
        description: "実行 OS ユーザー。列が無い・値が空(host も空)ならローカル実行(runner のプロセスユーザー)。execution-spec.json では null"
      - name: "work_dir"
        type: "string(absolute path)"
        required: true
        description: "作業ディレクトリの絶対パス(リモートまたはローカル)"
      - name: "script"
        type: "string(absolute path)"
        required: true
        description: "実装スクリプトの絶対パス(リモートまたはローカル)"
      - name: "fixed_params"
        type: "string(JSON array of strings)"
        required: true
        description: "固定引数。JSON 配列文字列(要素は string のみ)。空は `[]`。セルは二重引用符で囲む(csv_rules)。解析結果を execution-spec.json の slots.<role>.fixed_params に保存"
      - name: "hang_detect_limit_minutes"
        type: "integer(>=0)"
        required: true
        description: "ハング疑い上限(分)。0 は監視対象外。運用者の調整記録(調整日時・調整根拠となる警告時経過時間)は適用構成文書またはそのコミット履歴に置き、この列には持たない"
      - name: "credential_ref"
        type: "string"
        required: false
        description: "末尾の任意列。認証情報の参照名(値は置かない)。パス形式は warn。列が無い・空なら execution-spec.json では null"
      - name: "map_version"
        type: "string"
        required: false
        description: "末尾の任意列。マップ版(execution-spec.json の slots.<role>.map_version に転記。列が無い・空なら null。validate-config.sh --job-map では `map_version=-`)。実装版(impl_version)の列は無い(実装版は feature-flag.env の BLUE_IMPL / GREEN_IMPL)"
    edit_rule: "一時ファイルへ書いて mv で置き換える(編集途中を runner が読まないため。運用ガイド)"
  - file: "crosscheck-job-map.csv"
    path: "$RELAY_GATE_CONFIG_DIR/crosscheck-job-map.csv"
    format: "CSV(1 行目ヘッダー、列順固定。行頭 `#` のコメント行にファイル全体の宣言。セルのクォート規則は <slot>-job-map.csv の csv_rules と同じ)"
    owner: "基盤適用設計者(設定所有区分: クロスチェックジョブマップ)"
    defined_in_uc: "適用構成業務/適用構成定義フロー/クロスチェックのジョブマップと比較定義を定義する"
    readers: ["rapid-crosscheck-worker.sh(comparison_type=job 行)", "final-crosscheck-worker.sh / final-crosscheck-runner.sh(final-crosscheck 行とヘッダーコメント)", "validate-config.sh --crosscheck-job-map"]
    header_declarations:
      - name: "# exit_code_contract=0:OK,3:NG,6:ERROR"
        required: true
        description: "比較ツール終了コード契約への適合宣言(固定文字列)"
      - name: "# target_catalog_path=<path>"
        required: true
        description: "確報用の対象カタログ CSV の所在(設定所有区分: クロスチェックジョブマップ)"
      - name: "# catalog_version=<ver>"
        required: true
        description: "参照する対象カタログの既定版(runner の --catalog-version が優先)"
      - name: "# map_version=<ver>"
        required: false
        description: "マップ版(記録用)"
    columns:
      - name: "job_id"
        type: "string"
        required: true
        description: "英数字・_・- のみ。一意。`final-crosscheck` は確報用の予約値"
      - name: "comparison_type"
        type: "enum"
        enum: ["job", "full"]
        required: true
        description: "job = 速報(comparison_results.comparison_type に転記)/ full = 確報(job_id=final-crosscheck の行のみ、最大 1 行)"
      - name: "compare_targets"
        type: "string"
        required: true
        description: "比較対象識別子(複数はカンマ区切り。カンマを含むセルは csv_rules に従い二重引用符で囲む)。full 行は `catalog` 固定"
      - name: "compare_command"
        type: "string(absolute path)"
        required: true
        description: "比較ツールの絶対パス。存在・実行権限"
      - name: "compare_options"
        type: "string"
        required: true
        description: "空白区切り。job 行は `{blue}` `{green}` 必須。full 行は `{catalog_version}` `{business_date}` 必須(`{catalog_path}` 任意)"
      - name: "definition_version"
        type: "string"
        required: true
        description: "比較定義版(非空)"
  - file: "target-catalog.csv"
    path: "$RELAY_GATE_CONFIG_DIR/target-catalog.csv(crosscheck-job-map.csv の `# target_catalog_path=` が指す)"
    format: "CSV(1 行目ヘッダー、列順固定。行頭 `#` はコメント。複数の版を同一ファイルに持てる。セルのクォート規則は <slot>-job-map.csv の csv_rules と同じ)"
    owner: "基盤適用設計者(設定所有区分: クロスチェックジョブマップ。対象カタログはクロスチェックジョブマップが所有)"
    defined_in_uc: "適用構成業務/適用構成定義フロー/クロスチェックのジョブマップと比較定義を定義する(tier-final-crosscheck)"
    readers: ["final-crosscheck-runner.sh(catalog_version の存在検証)", "final-crosscheck-worker.sh(該当版の行を input/target-catalog.csv に抜き出す)", "validate-config.sh --target-catalog"]
    columns:
      - name: "catalog_version"
        type: "string"
        required: true
        description: "非空。英数字・.・_・-"
      - name: "target_type"
        type: "enum"
        enum: ["table", "file"]
        required: true
        description: "対象種別"
      - name: "target_identifier"
        type: "string"
        required: true
        description: "テーブル名またはファイルパスパターン。同一 catalog_version 内で target_type + target_identifier が一意"
      - name: "compare_condition"
        type: "string"
        required: false
        description: "比較条件(比較ツールへそのまま渡す。カンマ・二重引用符を含む場合は二重引用符で囲む)"
      - name: "business_date_handling"
        type: "string"
        required: false
        description: "業務日付の扱い(比較ツールへそのまま渡す。カンマ・二重引用符を含む場合は二重引用符で囲む)"
  - file: "hang-detector.env"
    path: "$RELAY_GATE_CONFIG_DIR/hang-detector.env"
    format: "env"
    owner: "基盤適用設計者(設定所有区分: ハング検知定期ジョブ設定。RDRA 情報「ハング検知定期ジョブ設定」)"
    defined_in_uc: "実行監視業務/background 実行監視フロー/background 実行の経過時間と終了状態を判定する / ハング疑い・実行エラー・比較異常を通知する"
    readers: ["hang-detector.sh"]
    keys:
      - name: "ALERT_MAIL_TO"
        type: "string"
        required: true
        description: "通知先メールアドレス。カンマ区切りで複数可。空は終了コード 2"
      - name: "ALERT_MAIL_CMD"
        type: "string(absolute path)"
        required: true
        description: "送信コマンドの絶対パス(/usr/bin/mail、/usr/sbin/sendmail 等)。実行可能でなければ終了コード 2"
      - name: "ALERT_SUBJECT_PREFIX"
        type: "string"
        required: false
        default: "[relay-gate]"
        description: "通知メール件名の先頭に付ける件名プレフィックス"
      - name: "HANG_DB_CONN_REF"
        type: "string"
        required: "RAPID_CROSSCHECK_MODE が off でないとき Yes"
        description: "管理 DB 接続情報の参照名(値は置かない)。監視記録の保存と速報比較依頼の走査に使う"
      - name: "RAPID_HANG_DETECT_LIMIT_MINUTES"
        type: "integer(>=1)"
        required: false
        default: 60
        description: "速報比較依頼(role=rapid-crosscheck)のハング疑い上限(運用チューニング値)"
      - name: "HANG_SCAN_WINDOW_HOURS"
        type: "integer(>=1)"
        required: false
        default: 72
        description: "started-at.txt がこの時間より古い run は走査しない(監視記録が未終端の run は窓外でも走査。運用チューニング値)"
  - file: "final-crosscheck.env"
    path: "$RELAY_GATE_CONFIG_DIR/final-crosscheck.env"
    format: "env"
    owner: "運用者(仮採用: _inference.md #6)"
    defined_in_uc: "クロスチェック業務/確報クロスチェックフロー/確報比較依頼を登録して終端状態まで待機する / 確報比較依頼を claim する"
    readers: ["final-crosscheck-runner.sh", "final-crosscheck-worker.sh", "abort-final-crosscheck.sh(FINAL_DB_CONN_REF のみ)"]
    keys:
      - name: "FINAL_DB_CONN_REF"
        type: "string"
        required: true
        description: "管理 DB 接続情報の参照名(値は置かない)"
      - name: "FINAL_POLL_INTERVAL_SEC"
        type: "integer(>=1)"
        required: false
        default: 60
        description: "runner の終端待機 polling 間隔"
      - name: "FINAL_POLL_LIMIT_SEC"
        type: "integer(>=1)"
        required: false
        default: 28800
        description: "runner の polling 上限(超過で終了コード 6、依頼は変更しない)。NFR B.2.2.1"
      - name: "FINAL_LEASE_MINUTES"
        type: "integer(>=1)"
        required: false
        default: 10
        description: "worker の claim lease"
      - name: "FINAL_WORKER_POLL_INTERVAL_SEC"
        type: "integer(>=1)"
        required: false
        default: 30
        description: "worker 常駐時の poll 間隔"
  - file: "rapid-crosscheck.env"
    path: "$RELAY_GATE_CONFIG_DIR/rapid-crosscheck.env"
    format: "env"
    owner: "運用者(仮採用: _inference.md #6。final-crosscheck.env と対称)"
    defined_in_uc: "クロスチェック業務/速報クロスチェックフロー/速報比較依頼を claim する"
    readers:
      - "rapid-crosscheck-runner.sh(RAPID_DB_CONN_REF)"
      - "rapid-crosscheck-worker.sh(全キー)"
      - "rapid-crosscheck-result.sh(RAPID_DB_CONN_REF)"
      - "abort-blue.sh / abort-green.sh / abort-rapid-crosscheck.sh(RAPID_DB_CONN_REF。RAPID_CROSSCHECK_MODE が off 以外のときのみ)"
      - "run-lineage.sh / hang-detect-trend.sh(RAPID_DB_CONN_REF。off 以外のときのみ)"
      - "background-rerun.sh(RAPID_DB_CONN_REF。off 以外のときのみ)"
      - "facade.sh / slot runner(RAPID_DB_CONN_REF。off 以外のときの parallel_runs / slot_executions / rapid_runs の INSERT / UPDATE)"
    on_missing: "RAPID_CROSSCHECK_MODE が off 以外(foreground / background)でファイル不在または RAPID_DB_CONN_REF 欠落は終了コード 2(slot runner は exitcode.txt=2。stderr は `error: config file not found path: ...` / `error: option required option=RAPID_DB_CONN_REF path: ...`)。off では読まない(rapid-crosscheck-worker.sh は off で 3、参照系・abort-rapid-crosscheck・background-rerun --role rapid-crosscheck は off で 3、abort-blue / abort-green・background-rerun --role blue|green は off で管理 DB に触れず成果物ファイルだけで完了、facade / slot runner / hang-detector は off で管理 DB に触れず 0 系で継続)"
    keys:
      - name: "RAPID_DB_CONN_REF"
        type: "string"
        required: "RAPID_CROSSCHECK_MODE が off でないとき Yes"
        description: "管理 DB 接続情報の参照名(値は置かない)。hang-detector.env の HANG_DB_CONN_REF と同じ参照名を指してよい"
      - name: "RAPID_LEASE_SEC"
        type: "integer(>=1)"
        required: false
        default: 600
        description: "claim lease(秒)。lease_until = claim 時刻 + RAPID_LEASE_SEC"
      - name: "RAPID_POLL_INTERVAL_SEC"
        type: "integer(>=1)"
        required: false
        default: 30
        description: "worker 常駐時の poll 間隔(秒)"

# Runner Result Contract(外部 IF の正本)
artifact_layout:
  root: "$RELAY_GATE_ARTIFACT_ROOT/facade/<run_id>/"
  publish_rule: "書き込みは一時ファイル(<name>.tmp)へ行い、確定名へ mv で公開する。確定名の存在で完了を判定する(条件: 成果物公開判定)。読み手は .tmp を無視する"
  tree: |-
    $RELAY_GATE_ARTIFACT_ROOT/facade/<run_id>/
      execution-spec.json              run 単位 1 ファイル(slots.<role> 節を各 runner が追加)
      execution-spec.json.tmp          一時(mv 前)
      execution-spec.lock/             mkdir による排他 lock(mtime 60 秒超は残留とみなし強制取得)
      <role>/                          role = blue | green | rapid-crosscheck
        started-at.txt                 UTC ISO 8601 秒精度 1 行(起動時刻。SSH 実行直前 / 比較開始時)
        stdout.log                     実装または比較ツールの stdout
        stderr.log                     実装または比較ツールの stderr(relay-gate 自身のエラーは exitcode.txt 公開前に末尾へ error: 1 行。公開後は変更しない。完了通知失敗の warn は書かない)
        exitcode.txt                   数値 1 行(0-255)
        aborted.txt                    中止日時 1 行(UTC ISO 8601 秒精度 Z 付き)。abort-blue.sh / abort-green.sh が中止時のみ生成(role = blue | green)
    $RELAY_GATE_ARTIFACT_ROOT/facade/<final_crosscheck_id>/
      final-crosscheck/
        input/target-catalog.csv       対象カタログの該当版の行だけを抜き出した入力(比較の再現性のため。仮採用)
        started-at.txt / stdout.log / stderr.log / exitcode.txt
  files:
    - name: "started-at.txt"
      writer: "slot runner / rapid-crosscheck-worker.sh / final-crosscheck-worker.sh"
      when: "実装実行(SSH)の直前 / 比較ツール起動の直前"
      content: "UTC ISO 8601 秒精度 1 行"
      readers: "hang-detector.sh(経過時間の起点)。background-rerun.sh --role blue|green(元状態の導出: started-at.txt なし=未起動で 3。以降は shared_rules.exitcode_to_status.slot_execution。中身の時刻は読まない。off でも off 以外でも同じ)。abort-blue.sh / abort-green.sh(なし=未起動で 3。stdout の started_at にこの値を表示)"
    - name: "stdout.log / stderr.log"
      writer: "同上"
      when: "実行終了後に .tmp → mv"
      content: "実装 / 比較ツールの出力バイト列そのまま"
      readers: "facade.sh(foreground 中継)、比較ツール(成果物 URI 経由)、運用者"
    - name: "exitcode.txt"
      writer: "同上"
      when: "stdout.log / stderr.log の後に最後に公開する(3 ファイル契約の完了マーカー)"
      content: "終了コード(数値 1 行)。2 = runner 側検証エラー、6 = SSH / 書き込み失敗 / runner 起動失敗(復元起動で runner 実体を起動できないときは background-rerun.sh の gateway が started-at.txt / 空の stdout.log / `error: runner failed to start ...` の stderr.log / exitcode.txt=6 の 3 ファイルを書く)"
      readers: "facade.sh(終了コード中継)、hang-detector.sh / background-rerun.sh / abort-blue.sh / abort-green.sh(shared_rules.exitcode_to_status.slot_execution: あり 0=SUCCEEDED / 非 0=FAILED、なしは aborted.txt の有無で ABORTED / RUNNING。off でも off 以外でも同じ)、rapid-crosscheck-runner.sh(--exit-code)"
    - name: "aborted.txt"
      writer: "abort-blue.sh / abort-green.sh(facade/<run_id>/<role>/aborted.txt。.tmp → mv で公開)"
      when: "運用者の yes 応答(または --yes)後、管理 DB の UPDATE より前。中止時のみ生成(RAPID_CROSSCHECK_MODE=off でも生成する)"
      content: "中止日時 1 行(UTC ISO 8601 秒精度 Z 付き。RELAY_GATE_NOW 設定時はその値)。abort-* の stdout aborted_at と同値"
      readers: "hang-detector.sh(exitcode.txt が無く aborted.txt があれば判定 COMPLETED(中止済み)で監視記録を終端し通知しない)、background-rerun.sh --role blue|green(ABORTED = リラン可)、abort-blue.sh / abort-green.sh(中止済み判定と再適用。既にあれば書き直さない)、slot runner(起動時の二重起動判定のみ: exitcode.txt が無く aborted.txt があれば実装を再実行せず `WARN slot already aborted` で終了コード 6。実行中は読まず、中止後に実装が終了すれば exitcode.txt を公開し、状態導出では exitcode.txt が優先)"
    - name: "execution-spec.json"
      writer: "各 slot runner(自 slot 節のみ追加。run 単位キーは最初の runner)/ background-rerun.sh(新 run へコピーし run_id / parent_run_id / restored_at を書き換え)"
      when: "ジョブマップ解決直後・実装実行前に一度だけ。復元起動では書かない"
      content: "下記 execution_spec_example(canonical C1)。UTF-8、末尾改行、パーミッション 0640(仮採用)"
      readers: "hang-detector.sh(slots.<role>.mode / hang_detect_limit_minutes / job_id。無い run は warn: execution-spec missing で判定対象外)、background-rerun.sh --role blue|green(slots.<role>.*、params。--role rapid-crosscheck は読まない)、slot runner(--execution-spec 復元起動)、UC「hang_detect_limit_minutes をジョブごとに調整する」(調整後の値が次回 run の slots.<role>.hang_detect_limit_minutes に反映されたことの確認。hang-detect-trend.sh 自体は monitor_records の転記値を読む)"
  artifact_uri: "file://<絶対パス>(rapid-crosscheck-runner.sh の --artifact-uri、比較ツールの {blue} / {green} 置換値、background-rerun の blue_artifact_uri / green_artifact_uri)"
  execution_spec_example: |-
    {
      "schema_version": "1",
      "run_id": "20260830T113000-JOB001-3f9a1c2e",
      "parent_run_id": null,
      "job_id": "JOB001",
      "params": ["20260830"],
      "rapid_crosscheck_mode": "background",
      "slots": {
        "blue":  { "mode": "foreground", "host": "...", "user": "...", "script": "...", "work_dir": "...", "fixed_params": [], "hang_detect_limit_minutes": 0,  "credential_ref": "...", "map_version": "...", "impl_version": "...", "finalized_at": "2026-08-30T11:30:00Z" },
        "green": { "mode": "background", "host": "...", "user": "...", "script": "...", "work_dir": "...", "fixed_params": [], "hang_detect_limit_minutes": 60, "credential_ref": "...", "map_version": "...", "impl_version": "...", "finalized_at": "2026-08-30T11:30:00Z" }
      }
    }
  execution_spec_rules:
    - "run 単位のキー(run_id / job_id / params / rapid_crosscheck_mode / parent_run_id)は最初に書いた runner が書き、以後変更しない"
    - "mode が off の slot は節を持たない。読み手は slots.{role} 節が無い slot を mode=off とみなす(background-rerun.sh のリラン対象検証の判定元。`slots.{role}.mode` に `off` が書かれることは無い)"
    - "各 runner は execution-spec.lock を mkdir で取得し、既存ファイルを読んで自 slot 節を追加(既にあれば何もしない)、.tmp へ全体を書いて mv で置換する。他 slot の節は変更しない"
    - "リラン時は background-rerun.sh が新 run ディレクトリへコピーし run_id / parent_run_id / restored_at を書き換える。復元起動の runner は読むだけで書かない"
    - "restored_at はリラン時のみ存在する run 単位キー(UTC ISO 8601 秒精度。例: \"restored_at\": \"2026-08-30T12:00:00Z\"、parent_run_id は元 run_id)。通常起動の execution-spec.json(上の execution_spec_example)は restored_at 節を持たない"
    - "schema_version は \"1\"。credential_ref は参照名のみ(認証情報の値を保存しない)"
    - "slots.<role>.impl_version は feature-flag.env の BLUE_IMPL / GREEN_IMPL(facade / background-rerun から runner へ環境変数で渡された値)の転記。slots.<role>.map_version はジョブマップの任意列 map_version の転記で、列が無い・空なら null。credential_ref も列が無い・空なら null"
    - "slots.<role>.host / user は、ジョブマップに host / user 列が無い、または両方の値が空のとき null(ローカル実行)。復元起動は null をそのまま読み、SSH せずローカル実行する"
    - "slots.<role>.fixed_params はジョブマップの fixed_params セル(CSV クォート規則で取り出した JSON 配列文字列)を解析した配列。run 単位の params は facade の PARAM... をそのまま配列化したもの"
    - "run_id はモードによらず常に発行する(RAPID_CROSSCHECK_MODE=off でも同じ)。rapid_crosscheck_mode は feature-flag.env の RAPID_CROSSCHECK_MODE の値(foreground / background / off)をそのまま転記する"
