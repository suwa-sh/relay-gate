uc: "比較ツールで日次全量比較を実行して結果を保存する"
business: "クロスチェック業務"
buc: "確報クロスチェックフロー"
paths: []
x_cli_commands:
  - name: "final-crosscheck-worker.sh"
    tier: "tier-final-crosscheck"
    role: "uses"
    synopsis: "final-crosscheck-worker.sh [--once] [--worker-id <id>](比較実行部分。コマンド契約の正本は UC「確報比較依頼を claim する」)"
    invoked_by: "ジョブスケジューラ(定期ジョブ)または DB セグメント上の常駐プロセス"
    args: []
    options: []
    stdin: "なし"
    stdout: "出力しない(比較ツールの stdout は依頼レコードの stdout 列に保存。成果物ファイルには保存しない)"
    stderr: "error: compare tool launch failed final_crosscheck_id=... command=...(6。依頼は FAILED exit_code=6 error_summary=launch failed)/ error: management db update failed final_crosscheck_id=...(6)。比較ツールの stderr は流さない"
    exit_codes:
      - code: 0
        meaning: "依頼を 1 件終端(SUCCEEDED / FAILED)まで保存できた。比較ツールの非 0 は worker の終了コードに反映しない。RUNNING 遷移 UPDATE 0 件(lease 失効で回収済み)・終端 UPDATE 0 件(比較中に ABORTED)も 0"
      - code: 6
        meaning: "比較ツール起動失敗(依頼は FAILED exit_code=6 error_summary=launch failed を保存)、管理 DB UPDATE 失敗(SQL エラー)"
  - name: "validate-config.sh"
    tier: "tier-facade"
    role: "uses"
    synopsis: "validate-config.sh --final-crosscheck <path>(確報の比較ツール起動コマンドを検証。本体の正本は UC「feature flag を設定する」)"
    invoked_by: "基盤適用設計者 / 運用者(直接起動)"
    args: []
    options:
      - name: "--final-crosscheck"
        type: "string"
        required: false
        description: "確報クロスチェック worker 設定ファイル(final-crosscheck.env)のパス。FINAL_COMPARE_COMMAND のコマンド部分(先頭の語)が絶対パスで存在・実行可能であることを検証する(プレースホルダ無しのため {job_id} 検査なし)。他の検証種別オプションと排他"
    stdin: "なし"
    stdout: "config=final-crosscheck, path: ..., command_path: <FINAL_COMPARE_COMMAND の先頭の語>, status=valid|invalid, violations=N(invalid 時)。入力の守備範囲の違反で値を使わないときは command_path: -(契約 config_input_rules.env_files)"
    stderr: "error: option required option=FINAL_COMPARE_COMMAND path: ...(2)/ error: path is not absolute key=FINAL_COMPARE_COMMAND path=...(2)/ error: file not executable key=FINAL_COMPARE_COMMAND path=...(2)/ 入力の守備範囲の違反(invalid line / error: duplicate key key=<KEY> lines=<n1,n2,...> path: ... など。文言と報告の順は契約 config_input_rules.env_files。2)"
    exit_codes:
      - code: 0
        meaning: "検証 OK(違反 0 件)"
      - code: 2
        meaning: "入力の守備範囲の違反(invalid line・同じキーの重複を含む)、FINAL_COMPARE_COMMAND のコマンド部分が絶対パスでない・存在しない・実行不可、必須キー欠落"
async_events:
  - name: "final-crosscheck-requests"
    channel: "final-crosscheck-requests"
    direction: "subscribe"
    message: "FinalCrosscheckRequestMessage"
    summary: "claim 済み依頼を RUNNING にして FINAL_COMPARE_COMMAND を shared_rules.compare_command_argv で引数の並びに分け(置換なし)argv 配列のまま起動し(文字列をシェルに解釈させない)、stdout / stderr / exit_code を依頼レコードへ保存して SUCCEEDED / FAILED にする(runner の polling が読む)"
schemas: []
