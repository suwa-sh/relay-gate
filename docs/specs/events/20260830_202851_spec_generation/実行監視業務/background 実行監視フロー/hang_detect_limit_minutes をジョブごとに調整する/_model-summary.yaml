tables:
  - name: "monitor_records"
    rdra_info: "監視記録"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "job_id"
            value: ""
          - name: "role"
            value: ""
          - name: "monitor_status"
            value: ""
          - name: "hang_detect_limit_minutes"
            value: ""
          - name: "hang_suspected_at"
            value: ""
          - name: "alerted_at"
            value: ""
          - name: "elapsed_minutes_at_alert"
            value: ""
          - name: "judged_at"
            value: ""
          - name: "started_at"
            value: ""
        where: "monitor_status <> 'NOT_MONITORED' AND judged_at >= ? [AND job_id = ?] [AND role = ?] (job_id, role で GROUP BY。parallel_runs と JOIN しない)"
    indexes_needed:
      - columns: ["job_id", "role", "judged_at"]
        reason: "警告傾向集計の job_id / role 絞り込みと期間絞り込み"
        access_pattern: "hang-detect-trend.sh の SELECT ... WHERE job_id = ? AND role = ? AND judged_at >= ? GROUP BY job_id, role"

kvs: []
object_storage: []
