uc: "監視記録を保存する"
business: "実行監視業務"
buc: "background 実行監視フロー"

bounded_context_id: "BC-004"
aggregate_id: "AG-004"

models:
  - name: "RecordCommand"
    tier: "tier-ops"
    layer: "usecase"
    type: "command"
    rdra_info: "監視記録"
  - name: "MonitorRecord"
    tier: "tier-ops"
    layer: "domain"
    type: "entity"
    rdra_info: "監視記録"
  - name: "MonitorRecordRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "監視記録"
  - name: "hang-detector.sh.log"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "実行ログ"

tables:
  - name: "monitor_records"
    rdra_info: "監視記録"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "監視対象の run_id"
          - name: "role"
            value: "blue / green / rapid-crosscheck"
          - name: "job_id"
            value: "execution-spec.json または依頼の job_id"
          - name: "target_type"
            value: "background_slot / rapid_request"
          - name: "monitor_status"
            value: "NOT_MONITORED / MONITORING / HANG_SUSPECTED_NOTIFIED / EXEC_ERROR_NOTIFIED / COMPARE_ERROR_NOTIFIED / COMPLETED(hang_judgement 6 値からの写像: NOT_TARGET → NOT_MONITORED、COMPLETED → COMPLETED、MONITORING → MONITORING、送信成功時に HANG_SUSPECTED / EXEC_ERROR / COMPARE_ERROR → *_NOTIFIED)"
          - name: "started_at"
            value: "started-at.txt または依頼の started_at(未開始は requested_at)"
          - name: "elapsed_minutes"
            value: "判定時点の経過時間(分)"
          - name: "hang_detect_limit_minutes"
            value: "background slot は execution-spec.json の slots.<role>.hang_detect_limit_minutes を転記(0 は対象外)、速報比較依頼(role=rapid-crosscheck)は hang-detector.env の RAPID_HANG_DETECT_LIMIT_MINUTES(既定 60)を転記(rdb-schema.yaml の列説明と同じ)"
          - name: "hang_suspected_at"
            value: "ハング疑い通知の送信成功時刻(それ以外は NULL。判定時刻ではない)"
          - name: "alerted_at"
            value: "通知送信時刻(それ以外は NULL)"
          - name: "elapsed_minutes_at_alert"
            value: "警告時の経過時間(通知時のみ)"
          - name: "judged_at"
            value: "now()(UTC)"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "monitor_status"
            value: "遷移結果(送信失敗・通知済みは既存値)"
          - name: "elapsed_minutes"
            value: "最新の判定値"
          - name: "hang_detect_limit_minutes"
            value: "最新の判定値"
          - name: "started_at"
            value: "最新の判定値"
          - name: "judged_at"
            value: "now()"
          - name: "hang_suspected_at"
            value: "COALESCE(既存, 新値)(NULL で上書きしない)"
          - name: "alerted_at"
            value: "COALESCE(新値, 既存)(送信成功時のみ更新)"
          - name: "elapsed_minutes_at_alert"
            value: "COALESCE(既存, 新値)(最初の警告時の値を保持)"
        where: "run_id = ? AND role = ?(INSERT ... ON CONFLICT (run_id, role) DO UPDATE の UPSERT。on のみ)"
    indexes_needed:
      - columns: ["run_id", "role"]
        reason: "主キー(UPSERT の衝突判定)。ユニーク制約: 監視対象 ID は run_id + role で一意"
        access_pattern: "5 分ごとに対象数分の UPSERT"
      - columns: ["job_id", "role", "judged_at"]
        reason: "hang-detect-trend.sh の job_id × role 集計(警告回数・最後の警告時経過時間)。--since の絞り込みが judged_at のため(rdb-schema.yaml idx_monitor_records_job_id_role_judged_at)"
        access_pattern: "運用者の参照時に範囲検索"
      - columns: ["monitor_status"]
        reason: "未終端の監視記録の走査(判定 UC)"
        access_pattern: "5 分ごとの走査"

kvs: []
object_storage: []
