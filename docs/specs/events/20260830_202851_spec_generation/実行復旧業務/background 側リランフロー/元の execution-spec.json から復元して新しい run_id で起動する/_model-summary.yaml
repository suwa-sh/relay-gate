uc: "元の execution-spec.json から復元して新しい run_id で起動する"
business: "実行復旧業務"
buc: "background 側リランフロー"
bounded_context_id: "BC-004"
aggregate_id: "AG-001"

models:
  - name: "RerunSlotCommand"
    tier: "tier-ops"
    layer: "usecase"
    type: "command"
    rdra_info: "リラン指示"
  - name: "RunIdGenerator"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "RestoredExecutionSpec"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "実行設定(execution-spec)"
  - name: "ParallelRunRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "SlotExecutionRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "slot 実行"
  - name: "ExecutionSpecRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "実行設定(execution-spec)"
  - name: "facade/<new_run_id>/execution-spec.json"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "実行設定(execution-spec)"
  - name: "facade/<new_run_id>/<role>/ (Runner Result)"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"
  - name: "slot runner (--execution-spec 入力モード)"
    tier: "tier-facade"
    layer: "presentation"
    type: "request"
    rdra_info: "リラン指示"

tables:
  - name: "parallel_runs"
    rdra_info: "並行稼働実行(parallel_run)"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新 run_id"
          - name: "parent_run_id"
            value: "--source-run-id の値"
          - name: "job_id"
            value: "元 execution-spec.json の job_id"
          - name: "parameters"
            value: "元 run の parameters(JSON)"
          - name: "execution_spec_uri"
            value: "facade/<new_run_id>/execution-spec.json のパス"
          - name: "status"
            value: "STARTED"
          - name: "requested_at"
            value: "作成日時(UTC。RELAY_GATE_NOW 設定時はその値)"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "RUNNING"
        where: "run_id = ? AND status = 'STARTED'"
      - type: "SELECT"
        columns:
          - name: "parameters"
            value: ""
        where: "run_id = ? (元 run の parameters を複製)"
    indexes_needed: []
  - name: "slot_executions"
    rdra_info: "slot 実行"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新 run_id"
          - name: "slot"
            value: "--role の値(blue / green)"
          - name: "mode"
            value: "background"
          - name: "pid"
            value: "NULL(runner 起動前に INSERT。起動後に UPDATE で設定)"
          - name: "artifact_dir"
            value: "facade/<new_run_id>/<role>"
          - name: "status"
            value: "RUNNING"
          - name: "started_at"
            value: "起動日時(UTC。RELAY_GATE_NOW 設定時はその値)"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "pid"
            value: "runner の PID(起動後)"
        where: "run_id = ? AND slot = ?"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "FAILED(runner 起動失敗時のベストエフォート)"
          - name: "completed_at"
            value: "now(UTC。RELAY_GATE_NOW 設定時はその値)"
        where: "run_id = ? AND slot = ? AND status = 'RUNNING'"
    indexes_needed: []

kvs: []
object_storage: []
