  - id: F-032
    viewpoint: 4
    severity: major
    target: "適用構成業務/適用構成定義フロー/クロスチェックのジョブマップと比較定義を定義する/tier-rapid-crosscheck.md L5 vs L18・L78-85 / tier-final-crosscheck.md L5 vs L18・L54・L57 / spec.md L45・L213・L218・L223 / slot runner の実体スクリプトを割り当てる/tier-facade.md L51・spec.md L162・_api-summary.yaml L70 / slot ごとのジョブマップを定義する/tier-facade.md L32-41"
    claim: |-
      契約は `--crosscheck-job-map` / `--target-catalog` を値必須に確定し _api-summary も追従したが、比較定義 UC の tier 2 ファイルの引数表と spec.md のレイヤー表は「必須 No / 既定値あり / 値省略時は既定パス」のまま(tier-rapid-crosscheck.md は L5 と L18 で自己矛盾)。行の値不正メッセージも契約の共通形式(`error: <column> is <reason> line=N job_id=... value=...`)に揃っておらず、runner-if-version 未応答の warn 文言は SR の 3 ファイルとも契約と別文言。
    evidence: |-
      - tier-rapid-crosscheck.md:5「`--crosscheck-job-map <path>`(値必須)」/ :18「| `--crosscheck-job-map` | string(path) | No | `$RELAY_GATE_CONFIG_DIR/crosscheck-job-map.tsv` | …(値省略時は既定パス) |」
      - tier-final-crosscheck.md:18「| `--target-catalog` | string(path) | No | `$RELAY_GATE_CONFIG_DIR/target-catalog.tsv` |」/ spec.md:45「パス解決(未指定なら `RELAY_GATE_CONFIG_DIR` の既定名)」
      - cli-command-contract.yaml:908「値必須(既定パス … を使う場合も明示的に渡す)」/ :936「行の値不正: `error: <column> is <reason> line=N job_id=... value=...`」/ :933「`error: header mismatch expected=… actual=… path: ...`」
      - tier-rapid-crosscheck.md:79「`error: compare_command is not executable job_id=... path=...`」(line= 無し・value= でなく path=)/ tier-final:54「`error: invalid target_type value=... line=N allowed=table,file`」/ spec.md:218 Then に `path:` 無し
      - 契約 L915「`warn: runner does not respond to --help slot=... runner=...`」vs SR/tier-facade.md:51・spec.md:162・_api-summary.yaml:70「`warn: runner does not report runner-if-version slot=<s> path=<p>`」
      - JM/tier-facade.md:32「`error: invalid job_id line=N value=<v>`」、:33「`error: host required line=N job_id=<v>`」(契約の `<column> is <reason>` 形でない)
    suggested_fix: |-
      比較定義 UC の引数表を「必須 Yes(値)/ 既定値 —」、spec.md:45 を「引数のパスを使う」に直す。行の値不正を `error: compare_command is not executable line=N job_id=... value=...` / `error: target_type is not in table,file line=N value=...` 形に、header mismatch の BDD に `path:` を追加。SR 3 ファイルと JM の文言を契約 L914-915 に揃える。

  - id: F-019
    viewpoint: 4
    severity: minor
    target: "クロスチェック業務/速報クロスチェックフロー/比較ツールでジョブ単位比較を実行して結果を登録する/tier-rapid-crosscheck.md L24 / spec.md L257 / tier BDD L162 vs cli-command-contract.yaml rapid-crosscheck-worker.sh stdout L373"
    claim: |-
      ABORTED 検出時の `exit_code=` が tier md は「比較ツールの終了コード」、契約は `-` で食い違う。BDD の Then は exit_code を検証しないため実装が割れても検出されない。
    evidence: |-
      - tier-rapid-crosscheck.md:24「終端 UPDATE 0 行(ABORTED 検出)→ `request_status=ABORTED` `result_status=-` `exit_code=<比較ツールの終了コード>` `comparison_result_id=-`」
      - cli-command-contract.yaml:373「終端 UPDATE が 0 件(…ABORTED)のときは request_status=ABORTED / result_status=- / exit_code=- / comparison_result_id=-」
    suggested_fix: |-
      tier L24 を `exit_code=-` に直し、spec.md:257 / tier BDD:162 の Then に `exit_code=-` を追加する。

  - id: F-031
    viewpoint: 2
    severity: minor
    target: "実装切替業務/実装切替ジョブ実行フロー/slot 実行モードを選択して runner を起動する/tier-facade.md L97・L182 / ジョブマップで JOB_ID から実行先を解決する/tier-facade.md / 実装スクリプトを実行して Runner Result を出力する/spec.md L38・L138 / foreground slot の結果をジョブスケジューラへ中継する/spec.md L80"
    claim: |-
      gherkin が期待する実行ログ文言の tier 宣言と SSH コマンド形式の統一が未対応。S tier の実行ログ一覧に `parallel_run status changed` が無く(契約 execution_log には有る)、J tier に `job map resolved` の宣言が無い。SSH は契約 `ssh -n {exec_user}@{host} '...'` に対し R spec 図・計算ルールが別形式(`-n` 無し)。
    evidence: |-
      - S/tier-facade.md:97 実行ログ一覧に `parallel_run status changed` 無し / :182 Then「実行ログに "parallel_run status changed from=STARTED to=RUNNING run_id=<run_id>" が出る」/ 契約 L223
      - J/spec.md:143「実行ログに "job map resolved job_id=JOB001 slot=green host=host-green-01 map_version=map-v3" が出る」— J/tier-facade.md に宣言行なし
      - R/spec.md:38「ssh -l exec_user host cd work_dir && …」/ R/spec.md:138「`ssh -o BatchMode=yes -l <exec_user> <host> -- "cd …"`」/ 契約 L967「`ssh -n {exec_user}@{host} 'cd {work_dir} && …'`」/ R/tier-facade.md:23「SSH は `-n` で stdin を閉じる」
      - M/spec.md:80 error 行に `artifact_dir: ...` を同一行で含む vs M/tier-facade.md:31 は別行
    suggested_fix: |-
      S tier L97 と J tier に該当ログ行を追加し、R spec の SSH 形式を契約に、M spec の error 行を tier と同じ 2 行に揃える。

  - id: F-041
    viewpoint: 4
    severity: minor
    target: "実行監視業務/background 実行監視フロー/hang_detect_limit_minutes をジョブごとに調整する/tier-ops.md L85-88 / 監視記録を保存する/tier-ops.md L69・_model-summary.yaml L50-51"
    claim: |-
      契約側(rdb-schema / 契約 idempotency / data-visualization)は直ったが、調整 UC の tier-ops.md は hang_suspected_at を「判定日時」のまま、hang_detect_limit_minutes / started_at の列説明が rapid-crosscheck(RAPID_HANG_DETECT_LIMIT_MINUTES / 依頼の started_at)を覆っていない。記録 UC の tier / _model-summary も同じ欠落。
    evidence: |-
      - 調整 tier-ops.md:88「| hang_suspected_at | datetime | ハング疑い判定日時(NULL 可) |」/ :87「execution-spec.json 由来の上限」
      - 記録 tier-ops.md:69「execution-spec.json の role ごとの値」/ 記録 _model-summary.yaml:51 同文
      - rdb-schema.yaml monitor_records.hang_suspected_at「ハング疑い通知(hang-suspected)の送信成功日時」、hang_detect_limit_minutes「速報比較依頼(role=rapid-crosscheck)は hang-detector.env の RAPID_HANG_DETECT_LIMIT_MINUTES(既定 60)を転記」
