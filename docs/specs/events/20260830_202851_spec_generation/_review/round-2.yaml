  - id: F-101
    viewpoint: 4
    severity: major
    target: "実行復旧業務/background 側リランフロー/元の execution-spec.json から復元して新しい run_id で起動する/spec.md 処理フロー L90-101・データフロー L28/L53・状態遷移 L145-146・E2E L222 / tier-ops.md 処理順序 L55-56・クラッシュ耐性 L67 / _model-summary.yaml slot_executions L100-101 vs rdb-schema.yaml L29・L136 / cli-command-contract.yaml runner IF idempotency L288"
    claim: |-
      F-004 の修正(runner 起動前に pid=NULL で INSERT → 起動後 pid UPDATE)は facade UC にしか入っておらず、復元起動 UC は spec / tier-ops / _model-summary のすべてで「runner 起動 → PID 取得 → INSERT(pid 入り)」の順のまま。rdb-schema と契約は facade / background-rerun の両方に起動前 INSERT を要求しており、即時終了 runner の終端 UPDATE 0 件競合(round-1 F-004)がリラン経路で再現する。起動失敗時の行の扱い(spec「slot_executions に行は無い」)も rdb-schema「起動失敗時は NULL のまま」と矛盾する。
    evidence: |-
      - rdb-schema.yaml:29「facade / background-rerun は runner 起動前に status=RUNNING / pid=NULL で INSERT し、起動直後に pid を UPDATE する」/ :136 同旨(起動失敗時は NULL のまま)
      - cli-command-contract.yaml:288「on 時の終端 UPDATE(…)は facade / background-rerun が起動前に INSERT した行を更新する」
