  - id: F-141
    viewpoint: 3
    severity: minor
    target: "_cross-cutting/api/cli-command-contract.yaml run-lineage.sh stderr L878 vs 実行復旧業務/background 側リランフロー/リラン結果を parent_run_id で追跡する/tier-ops.md L32 / _api-summary.yaml L30"
    claim: |-
      background-rerun.sh 契約と両 UC の _api-summary への管理 DB 障害 2 文言の転記は完了したが、追跡 UC が使う run-lineage.sh の契約 stderr には `error: management db connection failed run_id=... conn_ref=...`(6)が依然として無い。tier-ops / _api-summary は宣言済みで、契約 exit 6 condition は「管理 DB 接続・SQL 失敗」を含むのに stderr 一覧が接続失敗の文言を欠く(query failed も引数無しの `...` のまま)。
    evidence: |-
      - cli-command-contract.yaml:878 run-lineage.sh stderr「… / error: management db query failed ... / error: lineage cycle detected run_id=...(6)/ …」— connection failed の行なし
      - 追跡 tier-ops.md:32「`error: management db connection failed run_id=... conn_ref=...`(6。接続失敗)/ `error: management db query failed run_id=...`(6。SQL 失敗)」/ _api-summary.yaml:30 同文
    suggested_fix: |-
      契約 run-lineage.sh stderr に `error: management db connection failed run_id=... conn_ref=...(6)` を追加し、`management db query failed ...` を `management db query failed run_id=...` に揃える。
