  - id: F-201
    viewpoint: 4
    severity: major
    target: "実行監視業務/background 実行監視フロー/hang_detect_limit_minutes をジョブごとに調整する/tier-ops.md L35・L42(終了コード表)vs 同 L96-97(設定契約)/ _api-summary.yaml exit 3 / cli-command-contract.yaml hang-detect-trend.sh stderr L591・exit 3 condition L603 vs config_files.rapid-crosscheck.env.on_missing L1218"
    claim: |-
      F-132 の修正で調整 UC tier-ops に追加された設定契約節は「rapid-crosscheck.env 不在は `error: config file not found path: ...`(2)、RAPID_DB_CONN_REF 欠落は `error: option required option=RAPID_DB_CONN_REF path: ...`(2)」(config_files.on_missing と同じ規則)だが、同ファイルの終了コード表 L42 と stderr 一覧 L35、_api-summary の exit 3、契約 hang-detect-trend.sh の exit 3 condition は「RAPID_CROSSCHECK_MODE=off **または管理 DB 接続設定が無い**は `error: management db is not configured (RAPID_CROSSCHECK_MODE=off)` で 3」のままで、同じ欠落に 2(定型文)と 3(is not configured)の両方が宣言されている。契約 stderr にも定型文 2 種が無く、実装がどちらに従っても他方の宣言に違反する。
    evidence: |-
      - 調整 tier-ops.md:97「ファイル不在は `error: config file not found path: ...`(2)、キー欠落は `error: option required option=RAPID_DB_CONN_REF path: ...`(2)」
      - 調整 tier-ops.md:42(終了コード表)「| 3 | 業務エラー | RAPID_CROSSCHECK_MODE=off または管理 DB 接続設定が無い(`error: management db is not configured (RAPID_CROSSCHECK_MODE=off)`)|」/ :35 stderr 一覧に定型文 2 種なし
      - 調整 _api-summary.yaml exit_codes「code: 3 / meaning: "RAPID_CROSSCHECK_MODE=off または管理 DB 未設定(management db is not configured)"」
      - cli-command-contract.yaml:603 hang-detect-trend.sh exit 3 condition「RAPID_CROSSCHECK_MODE=off または管理 DB 接続設定(RAPID_DB_CONN_REF)が無い」/ :591 stderr に config file not found / option required なし
      - cli-command-contract.yaml:1218 config_files.rapid-crosscheck.env.on_missing「on でファイル不在または RAPID_DB_CONN_REF 欠落は終了コード 2(stderr は定型文 2 種)」— run-lineage.sh / hang-detect-trend.sh も readers(L1214)
    suggested_fix: |-
      F-103 で確立した規則(off = 3 の is not configured / on で env 不在・キー欠落 = 2 の定型文)に統一する: 調整 tier-ops L35・L42 と _api-summary exit 3 から「または管理 DB 接続設定が無い」を削り、契約 hang-detect-trend.sh の stderr に定型文 2 種(2)を追加、exit 3 condition を RAPID_CROSSCHECK_MODE=off のみにし、exit 2 condition に env 不在・キー欠落を追加する。同じ readers の run-lineage.sh 契約(exit 2/3 condition・stderr)にも同処置を行う。
