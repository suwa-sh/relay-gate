  - id: F-007
    viewpoint: 5
    severity: major
    target: "実行監視業務/background 実行監視フロー 判定・通知・記録 UC の全 Scenario(「現在時刻が 2026-08-30T12:45:00Z である」)/ クロスチェック業務/確報クロスチェックフロー/確報比較依頼を claim する/spec.md E2E 1・2(「2026-08-30T21:00:30Z に ... を実行する」)/ 実行復旧業務 復元起動 spec.md・実行を ABORTED へ遷移させる/spec.md 正常系 Then(固定 run_id 乱数・aborted_at 固定時刻)"
    claim: |-
      3 BUC にまたがる多数のシナリオが絶対時刻・乱数値を Given/Then に固定しているが、hang-detector.sh / worker / abort / background-rerun の現在時刻・乱数を注入する手段がどの契約にも宣言されておらず、実装者が契約外の env を発明するかテストが書けないかの二択になる。
    evidence: |-
      - 判定 spec: 「And 現在時刻が 2026-08-30T12:45:00Z である ... Then elapsed_minutes=74」。cli-command-contract.yaml hang-detector.sh options は --verbose / --help のみ。environment_variables / hang-detector.env に時刻上書きキー無し
      - 確報 claim spec: 「When 2026-08-30T21:00:30Z に final-crosscheck-worker.sh --once ... / Then 実行ログに lease_until=2026-08-30T21:10:30Z」。_model-summary の lease_until は DB の now()
      - 復元 spec: 「Then stdout の最終 2 行が run_id=20260830T124500Z-JOB001-7b2d9e01 と ...」(末尾 8 桁は shared_rules.run_id の乱数)。abort spec: 「aborted_at=2026-08-30T12:40:00Z」(計算式は now)
    suggested_fix: |-
      cli-command-contract.yaml の environment_variables にテスト専用の時刻注入(例 RELAY_GATE_NOW。本番未設定)を宣言するか、シナリオを相対表現(started-at.txt を now-74 分で生成、lease_until − claim 時刻 = FINAL_LEASE_MINUTES、run_id は形式 `^...-JOB001-[0-9a-f]{8}$`)に書き換える。

  - id: F-008
    viewpoint: 3
    severity: major
    target: "cli-command-contract.yaml shared_rules.state_codes.hang_judgement / 実行監視業務/.../background 実行の経過時間と終了状態を判定する/tier-ops.md 判定表 L68・L73・L79 / 監視記録を保存する/tier-ops.md 記録規則"
    claim: |-
      hang_judgement enum の NOT_TARGET 1 値に「監視対象外 → NOT_MONITORED」と「正常終了 → COMPLETED」の 2 つの遷移先が載っており、判定結果だけを受け取る記録 UC が monitor_status を決められない(bash 定数生成時にも区別できない)。
    evidence: |-
      - cli-command-contract.yaml L162: `hang_judgement: ["NOT_TARGET", "EXEC_ERROR", "MONITORING", "HANG_SUSPECTED", "COMPARE_ERROR"]`
      - 判定 tier-ops.md L68: 「あり・0 | — | NOT_TARGET(正常終了 → COMPLETED)」、L73: 「それ以外は NOT_TARGET(監視対象外 → NOT_MONITORED)」
      - 記録 tier: 「NOT_TARGET(対象外) → NOT_MONITORED」「NOT_TARGET(正常終了) → COMPLETED」と括弧書きでのみ区別
    suggested_fix: |-
      hang_judgement に COMPLETED(または NOT_MONITORED)を追加して 6 値にし、判定表・記録規則・contract state_codes・ui-design.md を揃える。

  - id: F-009
    viewpoint: 2
    severity: major
    target: "実行監視業務/.../background 実行の経過時間と終了状態を判定する/tier-ops.md ティア完了条件「execution-spec.json が無い run は既定 60 分で扱う」/ 計算ルール「上限の解決(background slot)」"
    claim: |-
      execution-spec.json 欠落時に「既定 60 分で判定を続行」するが、mode(background か否か)と job_id の出所が無く、monitor_records.job_id(NOT NULL)とメール件名の job_id= を埋められない。
    evidence: |-
      - 判定 tier: 「WARN execution-spec missing run_id=... limit defaulted=60 が残り終了コード 0」。設定契約「execution-spec.json から読むキー: job_id、slots.<role>.mode、hang_detect_limit_minutes」
      - rdb-schema.yaml monitor_records.job_id: nullable: false(execution-spec.json または依頼レコードから転記)
      - 契約 artifact_layout: execution-spec.json は「ジョブマップ解決直後・実装実行前に一度だけ」書く(started-at.txt あり・spec なしは契約違反状態)
    suggested_fix: |-
      spec 欠落は warn: を出して当該 run を判定対象外にする(NOT_MONITORED も記録しない)に変更するか、job_id を run_id から解析(先頭 16 / 末尾 8 文字規則)し mode=background とみなす旨を明記する。

  - id: F-010
    viewpoint: 2
    severity: major
    target: "実行監視業務/.../background 実行の経過時間と終了状態を判定する/tier-ops.md 異常判定表 ABORTED 行(L83)/ 同 _model-summary.yaml rapid_crosscheck_requests.where"
    claim: |-
      異常判定表の ABORTED 行は宣言された SELECT では到達不能で、HANG_SUSPECTED_NOTIFIED 後に abort-rapid-crosscheck.sh で ABORTED になった依頼の監視記録が未終端のまま残り、hang-detect-trend.sh の run_count に永続的に数えられる。
    evidence: |-
      - _model-summary where: 「status IN ('REQUESTED','CLAIMED','RUNNING') OR (status IN ('SUCCEEDED','FAILED') AND run_id NOT IN (...))」(ABORTED を含まない)
      - tier-ops L83: 「ABORTED | — | — | NOT_TARGET(運用者が中止済み。monitor_status は既存値を保持 ... 仮採用)」
    suggested_fix: |-
      where 句に「status='ABORTED' AND run_id IN (未終端の monitor_records)」を加えて到達可能にし、遷移先(COMPLETED 相当の終端値)を決めるか、ABORTED 行を削除して「中止済み依頼は走査しない」と明記する。

  - id: F-011
    viewpoint: 2
    severity: major
    target: "実行監視業務/.../background 実行の経過時間と終了状態を判定する/spec.md 走査対象 / buc-spec.md CRUD「slot 実行 | 判定: R」/ background 異常の通知メールを受け取る/spec.md 異常系 Then"
    claim: |-
      background slot の判定は成果物(started-at.txt / exitcode.txt)のみで slot_executions.status=ABORTED を読まないため、MONITORING 中に abort した run に上限超過の warning が送られ、受信 UC の「以後メールを送らない」Then が成立しない経路がある。
    evidence: |-
      - buc-spec CRUD「slot 実行 | 判定: R」だが判定 _model-summary の tables は rapid_crosscheck_requests / comparison_results / monitor_records のみ。判定表は exitcode.txt と経過時間のみ
      - 受信 spec 異常系: 「Then slot 実行は ABORTED になり、以後 hang-detector.sh は同じ run_id の green に対してメールを送らない」(HANG_SUSPECTED_NOTIFIED 済みの場合しか成立しない)
    suggested_fix: |-
      on 時は slot_executions.status=ABORTED を NOT_TARGET とする行を判定表と _model-summary に追加する(off 時は成果物のみと明記)か、CRUD の「slot 実行 R」を外し受信 UC の Then を「通知済みの run には再送しない」に限定する。

  - id: F-012
    viewpoint: 4
    severity: major
    target: "実行監視業務/.../ハング疑い・実行エラー・比較異常を通知する/tier-ops.md 出力契約「通知メール」(1 行 80 桁以内)/ background 異常の通知メールを受け取る/tier-ops.md ティア完了条件「14 行目は recommended_action: ... である」"
