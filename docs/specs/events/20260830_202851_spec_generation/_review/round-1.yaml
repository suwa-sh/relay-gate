  - id: F-001
    viewpoint: 5
    severity: blocker
    target: "クロスチェック業務/確報クロスチェックフロー/比較ツールで日次全量比較を実行して結果を保存する/spec.md E2E 正常系 4 本 + 異常系「起動失敗」 / 同 tier-final-crosscheck.md ティア完了条件 4 本(L118 付近)"
    claim: |-
      「Given status=CLAIMED worker_id=final-worker-01 の行がある → When final-crosscheck-worker.sh --once --worker-id final-worker-01」は到達不能で、この UC の受け入れテストが 1 本も実行できない。worker は自分がそのサイクルで claim した依頼しか比較実行に進まず、既に CLAIMED の行を拾い直す経路が無い。
    evidence: |-
      - UC3 tier BDD L118: 「Given final_crosscheck_requests に final_crosscheck_id=20260830T210000Z-final-7b2c9e1f status=CLAIMED worker_id=final-worker-01 ... がある / When `final-crosscheck-worker.sh --once --worker-id final-worker-01` を実行する / Then 終了コード 0 で該当行は status=SUCCEEDED」。spec.md L183 も同じ Given
      - UC2(確報比較依頼を claim する)tier「poll サイクル」: (1) lease 失効回収 → (2) REQUESTED を requested_at 昇順で 1 件 claim → (3) claim できたら次 UC → (4) --once なら終了
      - UC2 _model-summary claim UPDATE: `WHERE ... status = 'REQUESTED'`(CLAIMED は対象外。lease 有効中の CLAIMED は回収もされない)
    suggested_fix: |-
      Given を status=REQUESTED にし、claim → RUNNING → 終端までを 1 プロセスで検証する形に書き換える(同 UC の異常系「RUNNING 遷移前に依頼が ABORTED」も同様)。CLAIMED から再開させたいなら「自 worker_id の CLAIMED を再開する」規則を cli-command-contract.yaml の final-crosscheck-worker.sh idempotency に追加する。

