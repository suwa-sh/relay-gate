      - slot runner tier-facade.md L50: 「対応するジョブマップ <slot>-job-map.tsv が存在し読める | error: job map not found slot=<s> map=<p> | 2」。契約 L870: 「対応ジョブマップの存在も検証する」
      - feature flag tier 設定契約: 「BLUE_RUNNER | BLUE_MODE≠off のとき Yes」に対し L273 の Given は BLUE_MODE=background で BLUE_RUNNER 無し
    suggested_fix: |-
      正常系 Given に「両 runner は --help で runner-if-version=1 を返し、$RELAY_GATE_CONFIG_DIR/<slot>-job-map.tsv が存在する」と mode≠off の RUNNER 指定を追加する。

