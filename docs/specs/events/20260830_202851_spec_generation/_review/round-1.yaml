      「1 行 80 桁以内」と「14 行目 = recommended_action 定型文 1 行(199 桁)」は両立せず、折り返し規則もどこにも無い。
    evidence: |-
      - 通知 tier: 「本文: text/plain; charset=UTF-8、1 行 80 桁以内。... 14 行目以降 recommended_action: <定型文>」
      - 受信 tier BDD: 「Then 14 行目は "recommended_action: check the process ... abort-green.sh --run-id 20260830T113000Z-JOB001-3f9a1c2e" である / And 本文に 80 桁を超える行は無い」
      - ui-design.md 通知メール規約は「14〜 recommended_action ... 複数行可」だが継続行の書式が無い
    suggested_fix: |-
      ui-design.md で「80 桁制限は 1〜12 行目のみ。recommended_action は折り返さず 1 行」と決めるか、継続行の書式を定義して受信 tier の BDD を合わせる。

  - id: F-013
    viewpoint: 5
    severity: major
    target: "適用構成業務/適用構成定義フロー/feature flag を設定する/spec.md E2E 正常系 3 本(L260-273)/ tier-facade.md ティア BDD 1 本目"
    claim: |-
