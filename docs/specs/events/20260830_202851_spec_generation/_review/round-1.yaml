  - id: F-002
    viewpoint: 4
    severity: major
    target: "実行復旧業務/background 側リランフロー/リラン対象を検証する/spec.md 処理フロー(sequence L69 付近)/ tier-ops.md 事前検証表「任意 | execution-spec.json なし | 不可」 vs 速報比較依頼だけを新規作成する/tier-ops.md L5・tier-rapid-crosscheck.md L43"
    claim: |-
      rapid-crosscheck リランで作られた run(execution-spec.json を持たない)を再度 --source-run-id に指定すると `execution-spec not found` で拒否され、方針資料・USDM SPEC-009-01 の「parent_run_id を数珠つなぎに辿る複数回リラン」が rapid-crosscheck 系統で成立しない。
    evidence: |-
      - 検証 spec sequence は role を問わず最初に `facade/<source_run_id>/execution-spec.json` を読み、無ければ `error: execution-spec not found run_id=... path: ...` 終了コード 3(spec.md L69 / L217、tier-ops L36)
      - 依頼再作成 tier-ops.md L5: 「新 run_id の成果物ディレクトリを作らない ... execution-spec.json と blue / green 節は持たない」。tier-rapid-crosscheck.md L43 も同旨
      - rdb-schema.yaml parallel_runs.execution_spec_uri: 「rapid-crosscheck リランでは元 run の値を引き継ぐ」(DB 経由なら辿れるが、検証 UC はファイルパスを run_id から組み立てている)
      - 方針資料「複数回リランする場合、各新規実行の parent_run_id には直前にリラン元として指定した run_id を設定します」
    suggested_fix: |-
      --role rapid-crosscheck の事前検証は execution-spec.json ファイルを必須にせず、parallel_runs.execution_spec_uri(on 時)または rapid_crosscheck_requests / rapid_runs だけで元実行を特定するよう sequence と事前検証表を分岐させる。

  - id: F-003
    viewpoint: 4
    severity: major
    target: "クロスチェック業務/速報クロスチェックフロー/速報クロスチェック runner へ完了通知を送信する/tier-facade.md L28・L44、spec.md L114・L194、_api-summary.yaml L63、cli-command-contract.yaml rapid-crosscheck-runner.sh notes[0]"
    claim: |-
      通知失敗時に公開済み stderr.log の末尾へ `warn: completion notice failed ...` を追記する設計は、foreground slot では facade が中継する stderr の内容を変えるため、方針資料の受入条件「速報クロスチェックの失敗は foreground のジョブスケジューラへの応答を変更しない」と、artifact_layout「exitcode.txt は 3 ファイル契約の完了マーカー(最後に公開)」の両方に矛盾する。
    evidence: |-
      - tier-facade.md L28: 「通知失敗時のみ stderr.log の末尾に `warn: completion notice failed run_id=... role=... exit_code=N` を 1 行追記する」。spec.md L5: 通知は exitcode.txt 公開後に同期起動
      - 中継 UC tier-facade.md L41: runner の wait 後に `cat stdout.log >&1; cat stderr.log >&2; exit "$(cat exitcode.txt)"`(通知は runner 内で同期実行されるため追記行が stderr としてジョブスケジューラへ流れる)
      - cli-command-contract.yaml artifact_layout.files.exitcode.txt.when: 「stdout.log / stderr.log の後に最後に公開する(3 ファイル契約の完了マーカー)」/ tree: 「relay-gate 自身のエラーは末尾に error: 1 行」(warn: ではない)
      - 方針資料 受入条件: 「速報クロスチェックの失敗は、foreground のジョブスケジューラへの応答を変更しません」
    suggested_fix: |-
      通知失敗は実行ログ(WARN completion notice failed)のみに残し、stderr.log 追記をやめる。契約 rapid-crosscheck-runner.sh notes[0] と round-3 決定 #8 も併せて見直す。

  - id: F-004
    viewpoint: 4
    severity: major
    target: "実装切替業務/実装切替ジョブ実行フロー/slot 実行モードを選択して runner を起動する/spec.md 処理フロー(Runner-->>GW: PID → INSERT slot_executions) vs 実装スクリプトを実行して Runner Result を出力する/spec.md 終端 UPDATE"
    claim: |-
      slot_executions の INSERT が runner 起動「後」に行われるため、即時に終了する runner(ジョブマップ未定義・SSH 即失敗)では終端 UPDATE(WHERE status='RUNNING')が INSERT より先に走って 0 件になり、slot_executions が RUNNING のまま残る競合がある。更新 0 件時の扱いも未定義。
    evidence: |-
      - slot 選択 spec sequence: 「Runner-->>GW: PID」→「opt on: GW->>DB: INSERT slot_executions(status=RUNNING, mode=background, pid)」
      - Runner Result spec: 「UPDATE slot_executions SET status=?, exit_code=?, completed_at=now WHERE run_id=? AND slot=? AND status='RUNNING'」。tier-facade「slot_executions UPDATE 失敗(on): 実行ログに ERROR」(更新 0 件の扱いなし)
      - rdb-schema.yaml slot_executions.pid: nullable: true(起動前 INSERT を許容する列定義)
    suggested_fix: |-
      facade は runner 起動前に slot_executions を pid=NULL で INSERT し、起動後に pid を UPDATE する(または runner 側終端 UPDATE を「0 件なら INSERT」の UPSERT にする)。Runner Result tier に更新件数 0 の扱いを明記する。

  - id: F-005
    viewpoint: 4
    severity: major
    target: "cli-command-contract.yaml commands[facade.sh].exit_codes(code 6 condition)vs 実装切替業務/実装切替ジョブ実行フロー/foreground slot の結果をジョブスケジューラへ中継する/tier-facade.md 出力契約・ティア完了条件"
    claim: |-
      parallel_runs の UPDATE 失敗時の facade 終了コードが、契約(6)と中継 UC(exitcode.txt の値を維持、Then 終了コード 0)で矛盾している。
    evidence: |-
      - cli-command-contract.yaml facade.sh: `code: 6 / condition: "parallel_runs INSERT / UPDATE 失敗、runner 起動失敗、..."`
      - 中継 tier: 「parallel_runs の UPDATE 失敗は終了コードに反映しない(業務結果を優先。実行ログに ERROR)」、Scenario「facade_sh は parallel_runs の更新に失敗しても exitcode.txt の値で終了する ... Then 終了コード 0 で終了し」
    suggested_fix: |-
      契約の facade.sh exit 6 条件を「runner 起動前の parallel_runs INSERT / STARTED→RUNNING UPDATE 失敗」に限定し、「中継後の COMPLETED UPDATE 失敗は終了コードに反映しない」を契約側にも明記する。

  - id: F-006
    viewpoint: 2
    severity: major
    target: "実装切替業務/.../slot 実行モードを選択して runner を起動する/tier-facade.md「読み込む設定」「設定契約」/ 実装スクリプトを実行して Runner Result を出力する/tier-facade.md「環境変数」/ クロスチェック業務/速報クロスチェックフロー/速報クロスチェック runner へ完了通知を送信する/tier-rapid-crosscheck.md 終了コード表 L36"
    claim: |-
      on 時の管理 DB 接続に必要な rapid-crosscheck.env / RAPID_DB_CONN_REF の読み込みと不在時の終了コード 2 が、facade / slot runner / rapid-crosscheck-runner.sh の tier md に一切宣言されていない(契約 config_files では readers に含まれている暗黙参照)。runner に引き継ぐ環境変数リストも UC 間で不一致(RELAY_GATE_CONFIG_DIR の有無)。
    evidence: |-
      - 契約 config_files.rapid-crosscheck.env: readers に「rapid-crosscheck-runner.sh(RAPID_DB_CONN_REF)」「facade.sh / slot runner(RAPID_DB_CONN_REF。on 時の parallel_runs / slot_executions / rapid_runs の INSERT / UPDATE)」、on_missing 「on でファイル不在または RAPID_DB_CONN_REF 欠落は終了コード 2」
      - slot 選択 tier「読み込む設定」: BLUE_MODE / GREEN_MODE / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_MODE / CONFIG_VERSION のみ。exit 2 列挙にも無い
      - Runner Result tier 環境変数: 「RELAY_GATE_ARTIFACT_ROOT / RELAY_GATE_LOG_DIR / RAPID_CROSSCHECK_MODE」(slot 選択 tier は RELAY_GATE_CONFIG_DIR を含む 4 変数を引き継ぐと記述)
      - 完了通知 tier-rapid-crosscheck.md L36: 2 の条件は「サブコマンド不正、必須オプション欠落、形式不正、未知のオプション」のみ
