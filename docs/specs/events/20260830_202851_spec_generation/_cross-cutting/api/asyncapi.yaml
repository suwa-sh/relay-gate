asyncapi: "3.0.0"
id: "urn:relay-gate:async-events"
info:
  title: "relay-gate 並行稼働実行基盤 Async Events"
  version: "1.0.0"
  description: |-
    relay-gate の非同期連携を契約化する(_inference.md 採用値 #4)。
    メッセージブローカーは無く、実体は (1) 管理 DB の依頼テーブルを poll / claim / lease で回す RDB ジョブキュー、
    (2) slot runner から rapid-crosscheck-runner.sh への同期プロセス起動による完了通知、
    (3) hang-detector から OS メールコマンドで送る通知メール、の 3 種である。
    CLI コマンド契約は cli-command-contract.yaml を正本とする。エアーギャップ環境のため外部 SaaS・ネットワークブローカーは使わない。
  contact:
    name: "relay-gate"
  license:
    name: "MIT"

servers:
  management_db:
    host: "placeholder"
    protocol: "rdb-queue"
    description: "管理 DB(RDB)の依頼テーブルをジョブキューとして使う。接続先は *_DB_CONN_REF(参照名)で解決する。RAPID_CROSSCHECK_MODE=off では速報側のキューは存在しない"
  local_process:
    host: "localhost"
    protocol: "process"
    description: "同一ホスト上の同期プロセス起動(slot runner → rapid-crosscheck-runner.sh <role>-completed)。RAPID_CROSSCHECK_MODE=on のときのみ"
  mail:
    host: "placeholder"
    protocol: "smtp"
    description: "OS 標準のメール送信コマンド(hang-detector.env の ALERT_MAIL_CMD。mail / mailx / sendmail)経由。宛先は ALERT_MAIL_TO"

channels:
  slot-completed:
    address: "rapid-crosscheck-runner.sh {role}-completed"
    title: "slot 完了通知"
    summary: "slot runner が Runner Result 3 ファイル(exitcode.txt)公開後に、自系統の公開 function(blue-completed / green-completed)を同期起動して完了結果を送る"
    description: |-
      実体は CLI 引数(--run-id / --job-id / --exit-code / --artifact-uri)で渡す同期プロセス起動。
      RAPID_CROSSCHECK_MODE=off では publish しない。通知の成否は runner の終了コードに反映しない(exitcode.txt の値をそのまま返す)。
      受信側(rapid-crosscheck-runner.sh)は rapid_runs の自系統列を更新し、両系成功なら rapid-crosscheck-requests へ依頼を作成する。
    servers:
      - $ref: "#/servers/local_process"
    parameters:
      role:
        description: "通知元の系統"
        enum: ["blue", "green"]
    messages:
      SlotCompletedNotice:
        $ref: "#/components/messages/SlotCompletedNotice"
  rapid-crosscheck-requests:
    address: "rapid_crosscheck_requests"
    title: "速報比較依頼キュー"
    summary: "管理 DB の rapid_crosscheck_requests テーブル。run_id 主キーで 1 件だけ INSERT(重複依頼を作らない)"
    description: |-
      claim / lease の意味論:
      - publish = status=REQUESTED の行を INSERT(rapid-crosscheck-runner.sh の両系成功判定、background-rerun.sh --role rapid-crosscheck)
      - receive = worker が RAPID_POLL_INTERVAL_SEC(既定 30 秒)間隔で status=REQUESTED を requested_at 昇順に 1 件、
        条件付き UPDATE(更新件数 1 のみ成功)で CLAIMED(worker_id, lease_until=now+RAPID_LEASE_SEC(既定 600 秒))にする(設定は rapid-crosscheck.env)
      - lease 失効(lease_until < now)かつ未開始(started_at NULL)の CLAIMED は次の poll で REQUESTED に戻す。RUNNING は戻さない
      - 比較実行後に SUCCEEDED / FAILED で終端(exit_code / stdout / stderr / completed_at を保存)。ABORTED は abort-rapid-crosscheck.sh のみ
      - hang-detector.sh は未終端の依頼を SELECT して異常判定する(参照のみ。状態を変更しない)
    servers:
      - $ref: "#/servers/management_db"
    messages:
      RapidCrosscheckRequestMessage:
        $ref: "#/components/messages/RapidCrosscheckRequestMessage"
  final-crosscheck-requests:
    address: "final_crosscheck_requests"
    title: "確報比較依頼キュー"
    summary: "管理 DB の final_crosscheck_requests テーブル。final_crosscheck_id 主キー。runner が INSERT し、同じ runner が終端まで polling する"
    description: |-
      claim / lease の意味論:
      - publish = final-crosscheck-runner.sh が status=REQUESTED の行を INSERT(起動のたびに新 final_crosscheck_id)
      - receive = final-crosscheck-worker.sh が FINAL_WORKER_POLL_INTERVAL_SEC(既定 30 秒)間隔で status=REQUESTED を requested_at 昇順に 1 件、
        条件付き UPDATE で CLAIMED(worker_id, lease_until=now+FINAL_LEASE_MINUTES(既定 10 分))にする
      - lease 失効かつ未開始の CLAIMED は REQUESTED に戻す。RUNNING(started_at あり)は戻さない
      - 全量比較後に SUCCEEDED / FAILED で終端(exit_code / stdout / stderr を保存)。runner は FINAL_POLL_INTERVAL_SEC(既定 60 秒)で終端を待ち、
        FINAL_POLL_LIMIT_SEC(既定 28800 秒)超過で依頼を変更せず終了コード 6
    servers:
      - $ref: "#/servers/management_db"
    messages:
      FinalCrosscheckRequestMessage:
        $ref: "#/components/messages/FinalCrosscheckRequestMessage"
  hang-alert-mail:
    address: "{ALERT_MAIL_TO}"
    title: "ハング検知通知メール"
    summary: "hang-detector.sh が warning / error の通知メールを運用者へ送る。同じ run_id + role + kind は 1 回だけ"
    description: |-
      件名: [relay-gate][{level}] {kind} run_id={run_id} job_id={job_id} role={role}
      本文: text/plain; charset=UTF-8、1 行 1 事実(key=value / key: value)。80 桁制限は 1〜13 行目のみ(11 行目 artifact_dir は例外。折り返さない)。行順 1〜12 は
      kind / level / run_id / job_id / role / started_at / elapsed_minutes / hang_detect_limit_minutes / exit_code / request_status / artifact_dir / detected_at。
      13 行目は空行、14 行目は recommended_action(英語の定型文。折り返さず 1 行、80 桁超可)。15 行目以降なし。HTML・添付なし。
      冪等性: monitor_records の monitor_status の遷移有無で判定し 1 回だけ送る(alerted_at は送信成功の記録)。送信失敗時は alerted_at を更新せず終了コード 6(次回の定期実行で再送)。
    servers:
      - $ref: "#/servers/mail"
    parameters:
      ALERT_MAIL_TO:
        description: "hang-detector.env の宛先(カンマ区切り可)"
    messages:
      HangAlertMail:
        $ref: "#/components/messages/HangAlertMail"

operations:
  # slot-completed
  execute_impl_and_publish_runner_result_send:
    action: "send"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: 実装スクリプトを実行して Runner Result を出力する(tier-facade slot runner)"
    description: "3 ファイル確定後、RAPID_CROSSCHECK_MODE=on のときだけ自系統の公開 function へ run_id / job_id / exit_code / artifact_uri を通知する"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"
  send_completion_notice_to_rapid_runner_send:
    action: "send"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: 速報クロスチェック runner へ完了通知を送信する(tier-facade 送信側)"
    description: "契約を定義する UC。slot runner の lib/runner-notify.sh が rapid-crosscheck-runner.sh <role>-completed を同期起動する"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"
  assign_slot_runner_script_send:
    action: "send"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: slot runner の実体スクリプトを割り当てる(tier-facade runner IF)"
    description: "runner 実体が満たすべき IF 契約の一部として、完了通知の送信を要求する"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"
  restore_execution_spec_and_rerun_send:
    action: "send"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: 元の execution-spec.json から復元して新しい run_id で起動する(tier-facade 復元起動 runner)"
    description: "リランで起動した runner も完了時に blue-completed / green-completed を送る(RAPID_CROSSCHECK_MODE=on のみ)"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"
  send_completion_notice_to_rapid_runner_receive:
    action: "receive"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: 速報クロスチェック runner へ完了通知を送信する(tier-rapid-crosscheck 受信側)"
    description: "rapid-crosscheck-runner.sh が受信し rapid_runs の自系統列(blue_status / green_status)を更新する。再通知は同値更新で 0"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"

  # rapid-crosscheck-requests
  create_rapid_request_on_both_succeeded_send:
    action: "send"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: 両系成功時に速報比較依頼を作成する(tier-rapid-crosscheck dispatcher)"
    description: "両系 SUCCEEDED を判定したトランザクション内で status=REQUESTED の行を run_id 主キーで 1 件 INSERT し、rapid_runs.completion_status を REQUEST_CREATED にする"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"
  rerun_create_rapid_request_only_send:
    action: "send"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: 速報比較依頼だけを新規作成する(tier-ops background-rerun --role rapid-crosscheck)"
    description: "新 run_id(parent_run_id=元 run_id)で rapid_runs と依頼を REQUESTED で INSERT し、比較対象は元 run の blue / green 成果物 URI を使う。業務ジョブは再実行しない"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"
  claim_rapid_request_receive:
    action: "receive"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: 速報比較依頼を claim する(tier-rapid-crosscheck worker)"
    description: "poll / 条件付き UPDATE による claim / lease 失効の回収"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"
  run_job_comparison_and_register_result_receive:
    action: "receive"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: 比較ツールでジョブ単位比較を実行して結果を登録する(tier-rapid-crosscheck worker)"
    description: "claim した依頼を RUNNING にし、job_id の比較定義で比較ツールを起動、結果を依頼と comparison_results に保存して SUCCEEDED / FAILED で終端させる"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"
  judge_background_elapsed_and_exit_state_receive:
    action: "receive"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: background 実行の経過時間と終了状態を判定する(tier-ops hang-detector。参照のみ)"
    description: "RAPID_CROSSCHECK_MODE=on のとき未終端・未判定の速報比較依頼を SELECT して異常判定する。状態は変更しない(claim しない)"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"

  # final-crosscheck-requests
  register_final_request_and_wait_send:
    action: "send"
    channel:
      $ref: "#/channels/final-crosscheck-requests"
    summary: "UC: 確報比較依頼を登録して終端状態まで待機する(tier-final-crosscheck runner)"
    description: "final_crosscheck_requests に REQUESTED 行を INSERT し、worker の処理を polling で待つ。polling 中は状態を UPDATE しない"
    messages:
      - $ref: "#/channels/final-crosscheck-requests/messages/FinalCrosscheckRequestMessage"
  claim_final_request_receive:
    action: "receive"
    channel:
      $ref: "#/channels/final-crosscheck-requests"
    summary: "UC: 確報比較依頼を claim する(tier-final-crosscheck worker)"
    description: "poll / 条件付き UPDATE による claim / lease 失効の回収"
    messages:
      - $ref: "#/channels/final-crosscheck-requests/messages/FinalCrosscheckRequestMessage"
  run_full_comparison_and_store_result_receive:
    action: "receive"
    channel:
      $ref: "#/channels/final-crosscheck-requests"
    summary: "UC: 比較ツールで日次全量比較を実行して結果を保存する(tier-final-crosscheck worker)"
    description: "claim 済み依頼を RUNNING にして全量比較を実行し、stdout / stderr / exit_code を依頼レコードへ保存して SUCCEEDED / FAILED にする(runner の polling が読む)"
    messages:
      - $ref: "#/channels/final-crosscheck-requests/messages/FinalCrosscheckRequestMessage"

  # hang-alert-mail
  notify_hang_exec_error_compare_error_send:
    action: "send"
    channel:
      $ref: "#/channels/hang-alert-mail"
    summary: "UC: ハング疑い・実行エラー・比較異常を通知する(tier-ops hang-detector)"
    description: "hang-suspected(warning)/ background-exec-error(error)/ rapid-crosscheck-error(error)を OS メール送信コマンドで運用者へ送る。同じ run_id + role + kind は 1 回だけ"
    messages:
      - $ref: "#/channels/hang-alert-mail/messages/HangAlertMail"
  receive_background_alert_mail_receive:
    action: "receive"
    channel:
      $ref: "#/channels/hang-alert-mail"
    summary: "UC: background 異常の通知メールを受け取る(運用者)"
    description: "件名の level / kind / run_id と本文の recommended_action で静観 / 中止(abort-*)/ リラン(background-rerun.sh)/ 原因調査(rapid-crosscheck-result.sh)を判断する"
    messages:
      - $ref: "#/channels/hang-alert-mail/messages/HangAlertMail"
  run_business_job_in_switched_mode_receive:
    action: "receive"
    channel:
      $ref: "#/channels/hang-alert-mail"
    summary: "UC: 切り替えた運用モードで業務ジョブを実行する(運用者)"
    description: "並行稼働系の運用モードで background slot / 速報の異常メールを受け取る(publish 側は tier-ops の hang-detector)"
    messages:
      - $ref: "#/channels/hang-alert-mail/messages/HangAlertMail"

components:
  messages:
    SlotCompletedNotice:
      name: "SlotCompletedNotice"
      title: "slot 完了通知"
      summary: "slot runner が exitcode.txt 公開後に rapid-crosscheck-runner.sh <role>-completed へ渡す完了結果"
      contentType: "application/x-cli-arguments"
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/SlotCompletedNotice"
      examples:
        - name: "green-completed"
          summary: "green slot が終了コード 0 で完了"
          payload:
            run_id: "20260830T113000Z-JOB001-3f9a1c2e"
            job_id: "JOB001"
            role: "green"
            exit_code: 0
            artifact_uri: "file:///var/relay-gate/facade/20260830T113000Z-JOB001-3f9a1c2e/green"
    RapidCrosscheckRequestMessage:
      name: "RapidCrosscheckRequestMessage"
      title: "速報比較依頼"
      summary: "rapid_crosscheck_requests の 1 行。REQUESTED で作成され、claim / 実行 / 終端の各段階で列が埋まる"
      contentType: "application/x-rdb-row"
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/RapidCrosscheckRequest"
      examples:
        - name: "requested"
          summary: "両系成功直後の依頼"
          payload:
            run_id: "20260830T113000Z-JOB001-3f9a1c2e"
            job_id: "JOB001"
            status: "REQUESTED"
            requested_at: "2026-08-30T11:45:10Z"
    FinalCrosscheckRequestMessage:
      name: "FinalCrosscheckRequestMessage"
      title: "確報比較依頼"
      summary: "final_crosscheck_requests の 1 行。runner が REQUESTED で作成し、worker が終端まで更新する"
      contentType: "application/x-rdb-row"
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/FinalCrosscheckRequest"
      examples:
        - name: "requested"
          summary: "確報ジョブ起動直後の依頼"
          payload:
            final_crosscheck_id: "20260830T210000Z-final-7b2c9e1f"
            business_date: "2026-08-30"
            catalog_version: "v3"
            status: "REQUESTED"
            requested_at: "2026-08-30T21:00:00Z"
    HangAlertMail:
      name: "HangAlertMail"
      title: "ハング検知通知メール"
      summary: "hang-detector.sh が送る warning / error メール(件名 + 本文 12 キー + recommended_action)"
      contentType: "text/plain; charset=UTF-8"
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/HangAlertMail"
      examples:
        - name: "hang-suspected"
          summary: "green slot のハング疑い(warning)"
          payload:
            subject: "[relay-gate][warning] hang-suspected run_id=20260830T113000Z-JOB001-3f9a1c2e job_id=JOB001 role=green"
            kind: "hang-suspected"
            level: "warning"
            run_id: "20260830T113000Z-JOB001-3f9a1c2e"
            job_id: "JOB001"
            role: "green"
            started_at: "2026-08-30T11:30:05Z"
            elapsed_minutes: 74
            hang_detect_limit_minutes: 60
            exit_code: "-"
            request_status: "-"
            artifact_dir: "/var/relay-gate/facade/20260830T113000Z-JOB001-3f9a1c2e/green"
            detected_at: "2026-08-30T12:45:00Z"
            recommended_action: "check the process on the execution host; if it is still running normally, wait. if it is hung, stop the process, then run: abort-green.sh --run-id 20260830T113000Z-JOB001-3f9a1c2e"

  schemas:
    EventHeaders:
      title: "共通ヘッダー"
      type: object
      description: "全メッセージ共通の追跡情報(実体は CLI 引数 / DB 列 / メール件名に埋め込まれる)"
      required: [correlationId, timestamp, source]
      properties:
        correlationId:
          type: string
          description: "追跡 ID。run_id(確報は final_crosscheck_id)"
        timestamp:
          type: string
          format: date-time
          description: "イベント発生日時(UTC ISO 8601 秒精度、Z 付き)"
        source:
          type: string
          description: "イベント発生元スクリプト名"
          enum:
            - "slot-runner"
            - "rapid-crosscheck-runner.sh"
            - "rapid-crosscheck-worker.sh"
            - "final-crosscheck-runner.sh"
            - "final-crosscheck-worker.sh"
            - "background-rerun.sh"
            - "hang-detector.sh"
        eventType:
          type: string
          description: "イベント種別(チャネル名)"
          enum: ["slot-completed", "rapid-crosscheck-requests", "final-crosscheck-requests", "hang-alert-mail"]
        version:
          type: string
          description: "メッセージスキーマバージョン"
          const: "1"

    SlotCompletedNotice:
      title: "slot 完了通知ペイロード"
      type: object
      description: "rapid-crosscheck-runner.sh <role>-completed の引数と 1:1 に対応する"
      required: [run_id, job_id, role, exit_code, artifact_uri]
      properties:
        run_id:
          type: string
          description: "run_id({UTC yyyymmddThhmmssZ}-{job_id}-{8 hex})。--run-id"
          pattern: "^[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9_-]+-[0-9a-f]{8}$"
        job_id:
          type: string
          description: "業務ジョブ識別子。--job-id"
          pattern: "^[A-Za-z0-9_-]+$"
        role:
          type: string
          description: "通知元の系統(サブコマンド blue-completed / green-completed に対応)"
          enum: ["blue", "green"]
        exit_code:
          type: integer
          description: "公開済み exitcode.txt の値(0 以上)。0 → SUCCEEDED / 非 0 → FAILED。--exit-code"
          minimum: 0
          maximum: 255
        artifact_uri:
          type: string
          format: uri
          description: "成果物ディレクトリ URI(file:// 絶対パス)。--artifact-uri"
        completed_at:
          type: string
          format: date-time
          description: "通知の起動時刻(exitcode.txt 公開直後。UTC ISO 8601)。CLI 引数には無く headers.timestamp と同値。受信側は自系統列の更新時刻として記録する"

    RapidCrosscheckRequest:
      title: "速報比較依頼(rapid_crosscheck_requests 行)"
      type: object
      description: "管理 DB の rapid_crosscheck_requests テーブルの列(依頼レコードそのもの)。列定義の正本は _cross-cutting/datastore/rdb-schema.yaml。比較対象の成果物 URI(blue_artifact_uri / green_artifact_uri)は依頼の列ではなく rapid_runs(同じ run_id)を、リラン系譜(parent_run_id)は parallel_runs.parent_run_id を参照する"
      required: [run_id, job_id, status, requested_at]
      properties:
        run_id:
          type: string
          description: "主キー。並行稼働実行の run_id(リランでは新 run_id)"
          pattern: "^[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9_-]+-[0-9a-f]{8}$"
        job_id:
          type: string
          description: "業務ジョブ識別子(crosscheck-job-map.tsv の比較定義の検索キー)"
        status:
          type: string
          description: "依頼状態。REQUESTED → CLAIMED → RUNNING → SUCCEEDED / FAILED。ABORTED は abort-rapid-crosscheck.sh"
          enum: ["REQUESTED", "CLAIMED", "RUNNING", "SUCCEEDED", "FAILED", "ABORTED"]
        requested_at:
          type: string
          format: date-time
          description: "依頼作成日時(UTC)。claim の順序キー"
        worker_id:
          type: string
          description: "claim した worker({hostname}-{pid} または --worker-id)。未 claim は null"
        lease_until:
          type: string
          format: date-time
          description: "lease 期限(claim 時 now + RAPID_LEASE_SEC 秒)。失効かつ未開始なら REQUESTED に戻す。回収時 null"
        started_at:
          type: string
          format: date-time
          description: "比較開始日時(RUNNING 遷移時)。以降は lease 失効でも戻さない"
        completed_at:
          type: string
          format: date-time
          description: "終端日時(SUCCEEDED / FAILED / ABORTED)"
        exit_code:
          type: integer
          description: "比較ツールの終了コード(0 OK / 3 NG / 6 ERROR / その他)。起動失敗は 6。ABORTED は null"
          minimum: 0
          maximum: 255
        stdout:
          type: string
          description: "比較ツールの stdout(text)。rapid-crosscheck-result.sh --show-output で参照"
        stderr:
          type: string
          description: "比較ツールの stderr(text)"
        error_summary:
          type: string
          description: "FAILED 時の要約(stderr 先頭 1 行、起動失敗の理由、または `comparison definition not found job_id=...`)。SUCCEEDED は null"

    FinalCrosscheckRequest:
      title: "確報比較依頼(final_crosscheck_requests 行)"
      type: object
      description: "管理 DB の final_crosscheck_requests テーブルの列。列定義の正本は _cross-cutting/datastore/rdb-schema.yaml"
      required: [final_crosscheck_id, business_date, catalog_version, status, requested_at]
      properties:
        final_crosscheck_id:
          type: string
          description: "主キー({UTC yyyymmddThhmmssZ}-final-{8 hex})。abort-final-crosscheck.sh の --run-id に渡す値"
          pattern: "^[0-9]{8}T[0-9]{6}Z-final-[0-9a-f]{8}$"
        business_date:
          type: string
          format: date
          description: "比較対象の業務日付(YYYY-MM-DD)"
        catalog_version:
          type: string
          description: "対象カタログの版(target-catalog.tsv の catalog_version に存在する値)"
        status:
          type: string
          description: "依頼状態。REQUESTED → CLAIMED → RUNNING → SUCCEEDED / FAILED。ABORTED は abort-final-crosscheck.sh"
          enum: ["REQUESTED", "CLAIMED", "RUNNING", "SUCCEEDED", "FAILED", "ABORTED"]
        requested_at:
          type: string
          format: date-time
          description: "依頼作成日時(UTC)。claim の順序キー"
        worker_id:
          type: string
          description: "claim した worker。未 claim は null"
        lease_until:
          type: string
          format: date-time
          description: "lease 期限(now + FINAL_LEASE_MINUTES)。失効かつ未開始なら REQUESTED に戻す"
        started_at:
          type: string
          format: date-time
          description: "比較開始日時(RUNNING 遷移時)"
        completed_at:
          type: string
          format: date-time
          description: "終端日時"
        exit_code:
          type: integer
          description: "比較ツールの終了コード。runner がジョブスケジューラへ無加工中継する。null(ABORTED)は runner が 6 を返す"
          minimum: 0
          maximum: 255
        stdout:
          type: string
          description: "比較ツールの stdout(バイト列。runner が無加工中継)"
        stderr:
          type: string
          description: "比較ツールの stderr(バイト列。runner が無加工中継)"
        error_summary:
          type: string
          description: "起動失敗時の要約(例 no catalog rows catalog_version=...)。比較ツール由来の失敗では null"

    HangAlertMail:
      title: "ハング検知通知メール"
      type: object
      description: "件名と本文 12 キー + recommended_action(_cross-cutting/ux-ui/ui-design.md 通知メール規約)。本文の値が無い行は `-`"
      required:
        - subject
        - kind
        - level
        - run_id
        - job_id
        - role
        - started_at
        - elapsed_minutes
        - hang_detect_limit_minutes
        - exit_code
        - request_status
        - artifact_dir
        - detected_at
        - recommended_action
      properties:
        subject:
          type: string
          description: "件名。[relay-gate][{level}] {kind} run_id={run_id} job_id={job_id} role={role}"
        kind:
          type: string
          description: "通知種別(本文 1 行目。件名と同値)"
          enum: ["hang-suspected", "background-exec-error", "rapid-crosscheck-error"]
        level:
          type: string
          description: "通知レベル(本文 2 行目。hang-suspected は warning、他は error)"
          enum: ["warning", "error"]
        run_id:
          type: string
          description: "本文 3 行目。監視対象の run_id"
        job_id:
          type: string
          description: "本文 4 行目"
        role:
          type: string
          description: "本文 5 行目。監視対象 role"
          enum: ["blue", "green", "rapid-crosscheck"]
        started_at:
          type: string
          format: date-time
          description: "本文 6 行目。started-at.txt または依頼の started_at(UTC)"
        elapsed_minutes:
          type: integer
          description: "本文 7 行目。判定時点の経過時間(分)"
          minimum: 0
        hang_detect_limit_minutes:
          type: integer
          description: "本文 8 行目。execution-spec.json の slots.<role>.hang_detect_limit_minutes。依頼は RAPID_HANG_DETECT_LIMIT_MINUTES"
          minimum: 0
        exit_code:
          type: string
          description: "本文 9 行目。整数または `-`(hang-suspected は `-`)"
          pattern: "^([0-9]{1,3}|-)$"
        request_status:
          type: string
          description: "本文 10 行目。依頼状態または `-`(rapid-crosscheck-error のみ値あり)"
          enum: ["REQUESTED", "CLAIMED", "RUNNING", "SUCCEEDED", "FAILED", "ABORTED", "-"]
        artifact_dir:
          type: string
          description: "本文 11 行目。成果物ディレクトリの絶対パス(`key: value` 形式)。80 桁制限の例外(パスが長くても折り返さない)"
        detected_at:
          type: string
          format: date-time
          description: "本文 12 行目。hang-detector の判定日時(UTC)。monitor_records では judged_at 列に保存する(canonical C2)"
        recommended_action:
          type: string
          description: "本文 14 行目(1 行。折り返さず 80 桁超可。15 行目以降なし)。通知種別ごとの英語定型文(hang-suspected: abort-{role}.sh の案内 / background-exec-error: background-rerun.sh の案内 / rapid-crosscheck-error: rapid-crosscheck-result.sh の案内)"
