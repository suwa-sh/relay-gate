  - name: "background-rerun.sh"
    tier: "tier-ops"
    synopsis: "background-rerun.sh --source-run-id <RUN_ID> --role blue|green|rapid-crosscheck [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(background リラン専用ジョブ。background-exec-error メールの推奨対処)/ 運用者(直接起動)"
    defined_in_uc: "実行復旧業務/background 側リランフロー/リラン対象を検証する"
    used_by_ucs:
      - "実行復旧業務/background 側リランフロー/元の execution-spec.json から復元して新しい run_id で起動する"
      - "実行復旧業務/background 側リランフロー/速報比較依頼だけを新規作成する"
      - "実行監視業務/background 実行監視フロー/background 異常の通知メールを受け取る"
      - "実行監視業務/background 実行監視フロー/ハング疑い・実行エラー・比較異常を通知する"
    args: []
    options:
      - name: "--source-run-id"
        type: "string"
        required: true
        description: "リラン元の run_id(新 run の parent_run_id になる)"
      - name: "--role"
        type: "enum"
        enum: ["blue", "green", "rapid-crosscheck"]
        required: true
        description: "リラン対象 role。blue / green は復元起動(UC『元の execution-spec.json から復元して新しい run_id で起動する』)、rapid-crosscheck は依頼の再作成のみ(UC『速報比較依頼だけを新規作成する』)。final-crosscheck を含む列挙外の値は `error: invalid value option=--role value=...` で終了コード 2(確報は正規ジョブで再実行する。synopsis と enum は一致させる)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "なし"
    stdout: "blue / green: 固定順 role, mode=background, pid, artifact_dir: ..., execution_spec: ..., run_id={新 run_id}, parent_run_id={元 run_id}。rapid-crosscheck: 固定順 role=rapid-crosscheck, job_id, request_status=REQUESTED, blue_artifact_uri: ..., green_artifact_uri: ..., run_id={新 run_id}, parent_run_id={元 run_id}。検証 NG 時は出さない"
    stderr: |-
      各 UC の tier-ops.md 出力契約表を転記(機械可読な正本)。`error:` 1 行 + 対処が明確なら `hint:` 1 行。
      事前検証(UC「リラン対象を検証する」):
      - `error: option required option=--source-run-id|--role`(2)
      - `error: invalid value option=--role value=...` / `error: invalid value option=--source-run-id value=...` / `error: unknown option option=...`(2)
      - `error: source run is not rerunnable run_id=... role=... mode=foreground status=...` + `hint: rerun the scheduler job instead (foreground slot / final crosscheck are not handled by background-rerun.sh)`(3)
      - `error: source run is not rerunnable run_id=... role=... mode=off status=-` + 同上 hint(3)
      - `error: source run is not rerunnable run_id=... role=... mode=background status=-` + `hint: source run has not started; rerun the scheduler job instead`(3。off 時に元 slot の started-at.txt が無い = 未起動。理由コード source_not_started)
      - `error: source run is not rerunnable run_id=... role=... status=RUNNING` + `hint: abort the run with abort-{role}.sh --run-id {run_id} before rerun`(3)
      - `error: source request is not rerunnable run_id=... role=rapid-crosscheck status=RUNNING` + `hint: abort the request with abort-rapid-crosscheck.sh --run-id {run_id} before rerun`(3)
      - `error: source request is not rerunnable run_id=... role=rapid-crosscheck status=REQUESTED|CLAIMED` + `hint: request is still queued; wait for the worker`(3)
      - `error: source request not found run_id=... role=rapid-crosscheck` + `hint: rapid crosscheck request is created only when both slots succeeded`(3。on 時のみ)
      - `error: management db is not configured (RAPID_CROSSCHECK_MODE=off) run_id=... role=rapid-crosscheck`(3。off 時の --role rapid-crosscheck は管理 DB 接続前にこの 1 行で終了。abort 系と同じ文言)
      - `error: execution-spec not found run_id=... path: ...`(3。--role blue|green のみ。--role rapid-crosscheck は execution-spec.json を読まない)
      - `error: run not found run_id=... role=...`(3。on 時に slot_executions の行が無い)
      - `error: execution-spec is not readable run_id=... path: ...`(6。存在するが読めない / JSON 不正 / 必須キー欠落は末尾に ` missing=...`)
      - `warn: mode mismatch spec=... db=...`(継続。on 時に execution-spec.json と slot_executions の mode が食い違う場合は管理レコードを正とする)
      - `error: management db connection failed run_id=... role=... conn_ref=...`(6。on 時の接続失敗。ui-design.md の管理 DB 障害の定型文)
      - `error: management db query failed run_id=...`(6。on 時の SELECT 失敗)
      復元起動(UC「元の execution-spec.json から復元して新しい run_id で起動する」):
      - `error: runner failed to start run_id=... role=... runner=...`(6。起動前に INSERT した slot_executions 行は status=FAILED / completed_at にベストエフォートで UPDATE する。facade.sh の exit 6 と同じ扱い)
      - `error: artifact dir is not writable path: ...`(6)
      - `error: management db insert failed table=... run_id=...`(6)
      依頼再作成(UC「速報比較依頼だけを新規作成する」):
      - `error: source artifacts not found run_id=... role=rapid-crosscheck missing=blue_artifact_uri|green_artifact_uri`(3)
      - `error: management db insert failed table=... run_id=...`(6)
    exit_codes:
      - code: 0
        meaning: "検証を通過し、新 run_id で runner を起動して管理レコードを RUNNING にした(runner の完了は待たない)、または速報比較依頼を REQUESTED で作成し COMMIT した"
        condition: "後続処理完了"
      - code: 2
        meaning: "入力検証エラー(状態を読まない)"
        condition: "--source-run-id / --role 欠落、role が列挙外(final-crosscheck を含む)、run_id 形式不正、未知オプション"
      - code: 3
        meaning: "事前検証 NG(状態を変更しない)"
        condition: "--role blue|green: 元 mode が foreground / off(execution-spec.json に slots.{role} 節が無い = off)、元 slot が RUNNING、元 slot が未起動(off 時に started-at.txt なし。status=-)、元実行(slot_executions。on 時)・execution-spec.json なし。--role rapid-crosscheck: 依頼が REQUESTED / CLAIMED / RUNNING、依頼(rapid_crosscheck_requests)・rapid_runs なし、元 run の成果物 URI(rapid_runs.blue_artifact_uri / green_artifact_uri)が無い、RAPID_CROSSCHECK_MODE=off(管理 DB 未設定)。rapid-crosscheck では execution-spec.json の有無を検証しない(元実行は管理 DB だけで特定する)"
      - code: 6
        meaning: "実行エラー"
        condition: "execution-spec.json 読み取り失敗(JSON 不正・必須キー欠落を含む)、成果物ディレクトリ作成・spec 保存失敗、runner 起動失敗、run_id 発行の再試行上限(3 回)超過、管理 DB 接続・INSERT・UPDATE・COMMIT 失敗"
    idempotency: "起動のたびに新 run_id を発行する(同じ元 run_id から複数回リランすれば系譜が伸びる)。blue / green は新 run ディレクトリへ元 execution-spec.json をコピーし run_id / parent_run_id / restored_at を書き換える。on 時の slot_executions は facade.sh と同じく runner 起動前に pid=NULL / status=RUNNING で INSERT し、起動後に pid を UPDATE する(runner の終端 UPDATE より先に行が存在することを保証する。起動失敗時は status=FAILED にベストエフォートで UPDATE)。rapid-crosscheck は execution-spec.json を必須とせず(元実行は rapid_crosscheck_requests / rapid_runs / parallel_runs から特定)、新 run の parallel_runs(execution_spec_uri は元 run の値を引き継ぐ)・rapid_runs と依頼を INSERT する(canonical C3)。rapid-crosscheck リランで作られた run(execution-spec.json を持たない)を再び --source-run-id に指定できる(数珠つなぎ可。SPEC-009-01)"
    notes:
      - "--role rapid-crosscheck の事前検証順: feature-flag.env の RAPID_CROSSCHECK_MODE(off なら 3)→ rapid_crosscheck_requests(run_id)の存在と status → rapid_runs の blue_artifact_uri / green_artifact_uri。ファイルシステム(facade/<source_run_id>/)は読まない"
      - "--role blue|green の事前検証順: facade/<source_run_id>/execution-spec.json の存在・可読 → slots.{role} 節の有無(無し = mode off で 3)→ mode → 元状態(on 時は slot_executions、off 時は started-at.txt / exitcode.txt: started-at.txt なし=未起動(status=-、3)/ exitcode.txt なし=RUNNING / 0=SUCCEEDED / 非 0=FAILED)"

  - name: "abort-blue.sh"
    tier: "tier-ops"
    synopsis: "abort-blue.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(直接起動。hang-suspected メールの推奨対処)/ ジョブスケジューラ(--yes 付き)"
    defined_in_uc: "実行復旧業務/実行中止フロー/現在状態を確認して停止確認に応答する"
    used_by_ucs:
      - "実行復旧業務/実行中止フロー/実行を ABORTED へ遷移させる"
      - "実行監視業務/background 実行監視フロー/background 異常の通知メールを受け取る"
      - "実行監視業務/background 実行監視フロー/ハング疑い・実行エラー・比較異常を通知する"
      - "実行復旧業務/background 側リランフロー/リラン対象を検証する"
    args: []
    options:
      - name: "--run-id"
        type: "string"
        required: true
        description: "対象 run_id。slot_executions(run_id, slot='blue') が background かつ RUNNING のとき ABORTED へ"
      - name: "--yes"
        type: "boolean"
        required: false
        default: false
        description: "停止確認プロンプトを省略して yes とみなす(非対話起動用)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "停止確認の応答 1 行(yes 完全一致のみ肯定。--yes 指定時は読まない)"
    stdout: "現在状態(固定順 8 行): run_id, job_id, role, mode, status, pid, started_at, artifact_dir: ...。肯定応答後に status=ABORTED / aborted_at={UTC}。否定応答時は status={現在状態}"
    stderr: "プロンプト『対象ジョブのプロセスは強制終了してありますか？ [yes/no]: 』/ info: aborted by operator; status not changed / error: run not found run_id=... / error: run is not abortable run_id=... role=blue mode=... status=... / error: run is not abortable (state changed concurrently) ... / error: management db is not configured (RAPID_CROSSCHECK_MODE=off) run_id=... / error: interactive confirmation required (use --yes for non-interactive)"
    exit_codes:
      - code: 0
        meaning: "yes 応答後に ABORTED へ更新し COMMIT した。parallel_runs は `WHERE status IN ('STARTED','RUNNING')` の条件付き UPDATE で併せて ABORTED にする(COMPLETED は更新しない。0 件で可)"
        condition: "条件付き UPDATE の更新件数 1"
      - code: 2
        meaning: "入力検証エラー"
        condition: "--run-id 欠落・形式不正 / 未知オプション / 非 TTY で --yes なし"
      - code: 3
        meaning: "業務エラー"
        condition: "対象 run が無い / 応答が yes 以外 / RAPID_CROSSCHECK_MODE=off で管理 DB なし / 中止不可(background かつ RUNNING でない)/ 条件付き UPDATE の更新件数 0"
      - code: 6
        meaning: "実行エラー"
        condition: "管理 DB 接続・SQL 失敗"
    idempotency: "条件付き UPDATE(status='RUNNING' AND mode='background')。既に ABORTED / 終端なら 3 で状態を変更しない。実行ログに operator= と answer= を残す"

