# CLI コマンド契約(正本。Contract First 開発用)
# HTTP API は無い(arch CTP-001)。openapi.yaml はバリデータ互換スタブであり、本ファイルが CLI 契約の正本。
# 横断規約(終了コード・出力形式・環境変数)の説明は _cross-cutting/ux-ui/ui-design.md を正とし、本ファイルはそれを機械可読に転記する。
version: "1.0"
system_name: "relay-gate 並行稼働実行基盤"
generated_from: "20260830_202851_spec_generation"

conventions:
  option_style: "--kebab-case。値は `--key value` 形式(`--key=value` は不可)。短縮形は提供しない。未知のオプションは `error: unknown option option=--foo` で終了コード 2"
  exit_codes:
    - code: 0
      class: "成功"
      condition: "処理が完了した。参照系は対象が見つかり出力できた"
    - code: 2
      class: "入力・引数・設定検証エラー"
      condition: "引数不足・不正な値・未知のオプション、feature flag / ジョブマップ / クロスチェックジョブマップの検証 NG、非対話で --yes なし、環境変数・設定ファイルの未設定"
    - code: 3
      class: "業務エラー"
      condition: "事前検証 NG(rerun)、中止不可(abort)、停止確認 no、参照系で対象が存在しない、RAPID_CROSSCHECK_MODE=off で管理 DB が無い"
    - code: 6
      class: "実行エラー"
      condition: "SSH 接続・実行失敗、管理 DB 接続・SQL 失敗、比較ツールの起動失敗、メール送信失敗、成果物ファイルの書き込み失敗、polling 上限超過、内部エラー"
  exit_code_notes:
    - "1 は使わない(set -euo pipefail の予期しない終了を 1 として区別する。1 を観測したら内部バグ)"
    - "中継系(facade.sh foreground 中継 / final-crosscheck-runner.sh 確報中継)は保存済み exitcode をそのまま返し、4 分類を適用しない"
    - "worker(rapid-crosscheck-worker.sh / final-crosscheck-worker.sh)は比較ツールの終了コードを依頼レコードに保存するだけで、worker 自身の終了コードには反映しない"
  output_format:
    stdout: "plain。1 行 1 事実。`key=value`(値に空白を含まない)または `key: value`(値に空白・パスを含む)。キーは snake_case。出力順はコマンドごとに固定(各 commands[].stdout に記載)。末尾は改行。成功時に出力が無ければ 0 行"
    tsv: "複数行の参照系は TSV(タブ区切り、1 行目ヘッダー、列名 snake_case、列数 8 以内)。値にタブ・改行を含めない(半角空白へ置換)。列定義は _cross-cutting/ux-ui/data-visualization.md を正とする"
    stderr: "`error: {原因} key=value...` を 1 回だけ。続けて `hint: {対処}`(対処が明確な場合のみ)。`warn:` は継続、`info:` は --verbose 時のみ(例外: rapid-crosscheck-result.sh の投資調査注意は常時)"
    json: "採用しない(--format json は将来拡張としても採用しない。jq 非依存)"
    color: "使わない。ANSI エスケープを出さない。TTY 判定を行わない"
    empty_value: "`key=-`(TSV も `-`)。null / 空文字を区別しない"
    boolean: "true / false"
    path_uri: "絶対パスまたは URI をクォートせずそのまま出す"
    pagination: "`--limit N`(既定 100)。上限超過時は stderr に `warn: output truncated limit=N`"
    progress: "進捗表示は行わない。長時間処理は実行ログにのみ残す"
  datetime: "UTC ISO 8601 秒精度、Z 付き(例 2026-08-30T11:30:00Z)。経過時間は分単位の整数(elapsed_minutes=75)"
  run_id_format: "{UTC yyyymmddThhmmssZ}-{job_id}-{8 桁 hex 乱数}(例 20260830T113000Z-JOB001-3f9a1c2e。_inference.md #9 仮採用)"
  message_grammar: "英語、小文字始まり、句点なし、現在形。動詞は not found / is not / failed / required / rejected を優先。日本語は運用者向け対話プロンプトのみ"
  interactive_prompt:
    text: "対象ジョブのプロセスは強制終了してありますか？ [yes/no]: "
    channel: "stderr(改行せず入力待ち)"
    affirmative: "yes(小文字完全一致)のみ。y / YES / 空 Enter は no 扱い"
    negative_result: "stdout に status={現在状態}、stderr に `info: aborted by operator; status not changed`、終了コード 3"
    non_tty_without_yes: "`error: interactive confirmation required (use --yes for non-interactive)`、終了コード 2"
  execution_log:
    path: "$RELAY_GATE_LOG_DIR/{script}.log(1 スクリプト 1 ファイル、追記。ローテーションは手動)"
    line_format: "{script} {run_id} {UTC 日時} {LEVEL} {message}(run_id 未確定は `-`。確報系は final_crosscheck_id を run_id 欄に置く)"
    levels: ["DEBUG", "INFO", "WARN", "ERROR"]
    audit_fields: "中止・リランは operator=(OS ユーザー名)と answer= を必ず含める。gateway の外部呼び出しは開始・終了・duration_ms・成否を記録"
  common_options:
    - name: "--help"
      applies_to: "全コマンド"
      behavior: "usage を stdout に出して終了コード 0。1 行目は `usage: {script} ...`"
    - name: "--verbose"
      applies_to: "全コマンド"
      behavior: "info: を stderr に出す。中継系(facade.sh / final-crosscheck-runner.sh)と runner IF は実行ログにのみ出す"
    - name: "--yes"
      applies_to: "abort-blue.sh / abort-green.sh / abort-rapid-crosscheck.sh / abort-final-crosscheck.sh"
      behavior: "停止確認プロンプトを省略して yes とみなす。ログに answer=yes(--yes) と記録"
    - name: "--once"
      applies_to: "rapid-crosscheck-worker.sh / final-crosscheck-worker.sh"
      behavior: "1 回だけ poll / claim / 実行して終了する(定期ジョブ運転用)"
    - name: "--limit N"
      applies_to: "rapid-crosscheck-result.sh / run-lineage.sh / hang-detect-trend.sh"
      behavior: "出力行数の上限(既定 100)"
    - name: "--show-output"
      applies_to: "rapid-crosscheck-result.sh"
      behavior: "比較ツールの stdout / stderr 本文を末尾に出す"
  environment_variables:
    - name: "RELAY_GATE_HOME"
      purpose: "relay-gate の配置ディレクトリ(スクリプトの所在)。内部呼び出しの解決に使う"
      default: "スクリプト自身のディレクトリ($(dirname \"$0\"))"
    - name: "RELAY_GATE_CONFIG_DIR"
      purpose: "設定ファイル置き場(feature-flag.env / <slot>-job-map.tsv / crosscheck-job-map.tsv / target-catalog.tsv / rapid-crosscheck.env / hang-detector.env / final-crosscheck.env)"
      default: "$RELAY_GATE_HOME/config"
      on_missing: "未設定かつ既定パスが無い場合は終了コード 2"
    - name: "RELAY_GATE_ARTIFACT_ROOT"
      purpose: "成果物ルート。$RELAY_GATE_ARTIFACT_ROOT/facade/<run_id>/ に Runner Result を置く"
      default: "$RELAY_GATE_HOME/var"
      on_missing: "書き込み不可は終了コード 6"
    - name: "RELAY_GATE_LOG_DIR"
      purpose: "実行ログの出力先({script}.log)"
      default: "$RELAY_GATE_HOME/log"
      on_missing: "書き込み不可は stderr に warn: を出して処理は継続"
    - name: "RELAY_GATE_NOW"
      purpose: "テスト専用の現在時刻注入。設定時はすべてのスクリプトが「現在時刻」をこの値で扱う(hang-detector.sh の経過時間・judged_at・detected_at、rapid / final worker の lease_until・started_at・completed_at、abort-* の aborted_at、background-rerun.sh の restored_at と新 run_id の時刻部、facade.sh / slot runner の run_id 時刻部・requested_at・started-at.txt を含む時刻取得すべて)。DB の now() を使う UPDATE / INSERT も、この値を渡して同じ時刻にする"
      format: "UTC ISO 8601 秒精度、Z 付き(例 2026-08-30T12:45:00Z)。形式不正は終了コード 2(error: invalid value env=RELAY_GATE_NOW value=...)"
      default: "未設定(実時刻 now() を使う)"
      on_missing: "未設定が正常。本番では設定しない(設定されていれば起動時に実行ログへ WARN test clock injected now=... を 1 行残す)"
      runner_inheritance: "facade.sh / background-rerun.sh は設定されていれば runner にも引き継ぐ(値を変えない)"
  credentials: "認証情報(SSH 鍵パス・DB パスワード)は環境変数・設定の値として扱わず、参照名(credential_ref / *_DB_CONN_REF)のみを置く(arch CTP-002)。管理 DB 接続の参照名は config_files の RAPID_DB_CONN_REF(rapid-crosscheck.env)/ HANG_DB_CONN_REF(hang-detector.env)/ FINAL_DB_CONN_REF(final-crosscheck.env)で定義し、参照名から接続情報への解決は適用側の運用手順(DB クライアントの接続設定)に委ねる。relay-gate は値を保存・出力しない"

# 複数 tier が共有する算出規則。契約に定義されるまで実装で確定してはならない項目(CLAUDE.md)を集約する。
shared_rules:
  run_id:
    format: "{UTC yyyymmddThhmmssZ}-{job_id}-{8 桁 hex 乱数}"
    example: "20260830T113000Z-JOB001-3f9a1c2e"
    issuer: "facade.sh(通常起動)/ background-rerun.sh(リラン。新 run_id を発行し parent_run_id に元 run_id を置く)"
    job_id_charset: "英数字・_・- のみ(区切り文字 - と衝突するため、解析は先頭 16 文字(時刻)と末尾 8 文字(hex)で行い、中央を job_id とする)"
    random_source: "8 桁 hex(4 バイト乱数。管理 DB なし(off)でも facade 単独で発行できる)"
    test_verification: "乱数部は注入しない。テスト(BDD の Then)では run_id を固定値で照合せず、形式パターン `^[0-9]{8}T[0-9]{6}Z-{job_id}-[0-9a-f]{8}$` と時刻部(RELAY_GATE_NOW 設定時はその値)で検証する。シナリオに書かれた固定 run_id の末尾 8 桁は例示であり、照合対象は時刻部と job_id のみ"
    confidence: "low(_inference.md #9 仮採用。todo)"
  final_crosscheck_id:
    format: "{UTC yyyymmddThhmmssZ}-final-{8 桁 hex 乱数}"
    example: "20260830T210000Z-final-7b2c9e1f"
    issuer: "final-crosscheck-runner.sh(起動のたびに新規発行)"
    note: "abort-final-crosscheck.sh の --run-id はこの値を受け取る(canonical C7)。成果物ディレクトリ名にも使う(facade/<final_crosscheck_id>/final-crosscheck/)"
  comparison_result_id:
    format: "8 桁 hex"
    issuer: "rapid-crosscheck-worker.sh"
  argument_concatenation:
    rule: "実装スクリプトへ渡す引数 = ジョブマップの fixed_args_json(JSON 配列 of string)を順序どおり展開 + runner IF の `--` 以降の PARAM... を順序保持で後置"
    fixed_args_json: "JSON 配列(要素は string のみ)。空は `[]`。bash 単独で解析できる範囲(ネスト不可)"
    execution_spec: "確定時に slots.<role>.fixed_args(配列)と run 単位の params(配列)へ分けて保存する。復元起動(--execution-spec)では spec の fixed_args + params で再構成し、PARAM の併用は受け付けない(終了コード 2)"
  exitcode_to_status:
    slot_execution: "exitcode.txt なし = RUNNING / 0 = SUCCEEDED / 非 0 = FAILED。ABORTED は管理 DB の状態更新でのみ表現(成果物からは導出不可)"
    ssh_failure: "SSH 接続・実行失敗は exitcode.txt=6(仮採用)"
    runner_result_incomplete: "facade.sh は foreground の exitcode.txt が無い / 非数値のとき終了コード 6"
  compare_tool_exit_code:
    contract: "0:OK,3:NG,6:ERROR(crosscheck-job-map.tsv の宣言 `# exit_code_contract=0:OK,3:NG,6:ERROR` と一致)"
    mapping:
      - exit_code: 0
        request_status: "SUCCEEDED"
        comparison_result_status: "OK"
        final_runner_relay: 0
        rapid_notification: "なし"
      - exit_code: 3
        request_status: "FAILED"
        comparison_result_status: "NG"
        final_runner_relay: 3
        rapid_notification: "hang-detector が rapid-crosscheck-error(error)メール"
      - exit_code: 6
        request_status: "FAILED"
        comparison_result_status: "FAILED"
        final_runner_relay: 6
        rapid_notification: "同上"
      - exit_code: "その他の非 0"
        request_status: "FAILED"
        comparison_result_status: "FAILED"
        final_runner_relay: "その値(無加工)"
        rapid_notification: "同上"
    launch_failure: "比較ツールの起動自体に失敗した場合は依頼を FAILED / exit_code=6 で保存し、worker は終了コード 6"
  time_precision: "UTC 秒精度(ISO 8601 Z 付き)。started-at.txt / *_at 列 / メール本文 / ログすべて同一。経過時間は floor((now - started_at) / 60) 分"
  worker_id_default: "{hostname}-{pid}(canonical C4)。--worker-id の文字種は英数字・_・- のみ。既定値のホスト名に `.` が含まれる場合(FQDN)は `.` を `-` に置換して生成する(速報・確報 worker 共通。仮採用)"
  lease_and_poll:
    rapid:
      RAPID_LEASE_SEC: 600
      RAPID_POLL_INTERVAL_SEC: 30
    final:
      FINAL_LEASE_MINUTES: 10
      FINAL_WORKER_POLL_INTERVAL_SEC: 30
      FINAL_POLL_INTERVAL_SEC: 60
      FINAL_POLL_LIMIT_SEC: 28800
    claim_rule: "status=REQUESTED を requested_at 昇順で 1 件、条件付き UPDATE(更新件数 1 のみ成功)で CLAIMED(worker_id, lease_until=now+lease)にする。lease 失効かつ未開始(started_at NULL)の CLAIMED は REQUESTED に戻す。RUNNING は戻さない"
    confidence: "low(_inference.md #6 仮採用。todo)"
  hang_detect_limit:
    slot: "execution-spec.json の slots.<role>.hang_detect_limit_minutes(0 は監視対象外)"
    rapid_request: "hang-detector.env の RAPID_HANG_DETECT_LIMIT_MINUTES(既定 60)"
  state_codes:
    parallel_run_status: ["STARTED", "RUNNING", "COMPLETED", "ABORTED"]
    slot_execution_status: ["RUNNING", "SUCCEEDED", "FAILED", "ABORTED"]
    slot_mode: ["foreground", "background", "off"]
    request_status: ["REQUESTED", "CLAIMED", "RUNNING", "SUCCEEDED", "FAILED", "ABORTED"]
    rapid_run_completion: ["PENDING", "ONE_COMPLETED", "BOTH_SUCCEEDED", "ANY_FAILED", "REQUEST_CREATED"]
    monitor_status: ["NOT_MONITORED", "MONITORING", "HANG_SUSPECTED_NOTIFIED", "EXEC_ERROR_NOTIFIED", "COMPARE_ERROR_NOTIFIED", "COMPLETED"]
    comparison_result_status: ["OK", "NG", "FAILED"]
    hang_judgement: ["NOT_TARGET", "COMPLETED", "MONITORING", "HANG_SUSPECTED", "EXEC_ERROR", "COMPARE_ERROR"]
    hang_judgement_to_monitor_status: "NOT_TARGET → NOT_MONITORED(監視対象外。hang_detect_limit_minutes=0 / mode≠background)/ COMPLETED → COMPLETED(正常終了。exitcode.txt=0、依頼 SUCCEEDED、または ABORTED 済み対象の終端)/ MONITORING → MONITORING / HANG_SUSPECTED → HANG_SUSPECTED_NOTIFIED / EXEC_ERROR → EXEC_ERROR_NOTIFIED / COMPARE_ERROR → COMPARE_ERROR_NOTIFIED(記録 UC は判定結果だけから monitor_status を決められる)"
    role: ["blue", "green", "rapid-crosscheck", "final-crosscheck"]
    alert_level: ["warning", "error"]
    alert_kind: ["hang-suspected", "background-exec-error", "rapid-crosscheck-error"]

commands:
  - name: "facade.sh"
    tier: "tier-facade"
    synopsis: "facade.sh JOB_ID [PARAM...]"
    invoked_by: "ジョブスケジューラ(業務ジョブ定義)。運用モードによらず同一のジョブ定義"
    defined_in_uc: "実装切替業務/実装切替ジョブ実行フロー/slot 実行モードを選択して runner を起動する"
    used_by_ucs:
      - "実装切替業務/実装切替ジョブ実行フロー/foreground slot の結果をジョブスケジューラへ中継する"
      - "実装切替業務/実装切替ジョブ実行フロー/業務ジョブの実行結果を確認する"
      - "適用構成業務/適用構成定義フロー/切り替えた運用モードで業務ジョブを実行する"
      - "実行監視業務/background 実行監視フロー/hang_detect_limit_minutes をジョブごとに調整する"
      - "実装切替業務/実装切替ジョブ実行フロー/execution-spec.json を確定保存する(テストで起動: E2E の起動手段)"
      - "適用構成業務/適用構成定義フロー/feature flag を設定する(テストで起動: 運用モード切替の E2E 確認)"
      - "適用構成業務/適用構成定義フロー/slot runner の実体スクリプトを割り当てる(テストで起動: runner 差し替え後の E2E 確認)"
      - "適用構成業務/適用構成定義フロー/slot ごとのジョブマップを定義する(テストで起動: 次回 run への反映確認)"
    args:
      - name: "JOB_ID"
        type: "string"
        required: true
        description: "業務ジョブ識別子。英数字・_・- のみ"
      - name: "PARAM..."
        type: "string[]"
        required: false
        description: "追加引数。順序を変えずに runner へ `--` の後ろに渡す。JOB_ID 以降の引数はすべて PARAM(`--` 始まりを含む。未知オプション判定を行わない)"
    options:
      - name: "--help"
        type: "boolean"
        required: false
        default: false
        description: "使い方を stdout に出して終了コード 0"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を実行ログに出す(stderr には出さない。中継経路を汚さない)"
    option_placement: "オプション(--help / --verbose)は JOB_ID より前にのみ置ける。JOB_ID(最初の `--` 始まりでない引数)以降はすべて PARAM として runner へ渡す。JOB_ID より前の未知の `--` 始まりは `error: unknown option option=--foo` で終了コード 2"
    stdin: "なし"
    stdout: "facade 自身は出力しない。foreground slot の stdout.log をバイト単位同一で無加工中継する(出力規約の適用外)"
    stderr: "foreground slot の stderr.log を無加工中継。中継に至る前の relay-gate 自身の検証・実行エラーのみ `error:` 1 行(+ `hint:` 1 行)。foreground 起動後は stderr を汚さない"
    exit_codes:
      - code: "foreground の exitcode.txt の値(0-255)"
        meaning: "foreground slot の終了コードをそのまま中継する"
        condition: "Runner Result 3 ファイルが揃った"
      - code: 2
        meaning: "入力・設定検証エラー(runner 未起動)"
        condition: "JOB_ID 欠落・形式不正 / mode 列挙外 / 両 slot foreground / foreground slot が 1 つも無い / runner 実体なし / feature-flag.env なし / RAPID_CROSSCHECK_MODE=on で rapid-crosscheck.env 不在または RAPID_DB_CONN_REF 欠落(config_files.rapid-crosscheck.env.on_missing)"
      - code: 6
        meaning: "実行エラー(runner 起動前、または中継不能)。runner 起動失敗時は起動前に INSERT した slot_executions 行を status=FAILED / completed_at にベストエフォートで UPDATE する(UPDATE 失敗は実行ログ ERROR のみ。終了コード 6 は不変)"
        condition: "runner 起動前の parallel_runs / rapid_runs / slot_executions INSERT 失敗、runner 起動前の parallel_runs STARTED→RUNNING UPDATE 失敗、runner 起動失敗、成果物ディレクトリ作成失敗、foreground の exitcode.txt なし・非数値。中継後の parallel_runs COMPLETED UPDATE 失敗と slot_executions.pid UPDATE 失敗は終了コードに反映しない(業務結果を優先。実行ログに ERROR)"
    idempotency: "起動のたびに新しい run_id を発行する(同一 run_id での再起動は無い)。RAPID_CROSSCHECK_MODE=on では parallel_runs と rapid_runs(completion_status=PENDING)を同一トランザクションで INSERT する(canonical C3)。slot_executions は runner 起動前に pid=NULL / status=RUNNING で INSERT し、起動後に pid を UPDATE する(runner の終端 UPDATE より先に行が存在することを保証する)。off では管理 DB に触れず成果物だけで動く"
    execution_log:
      - "`INFO feature flag loaded blue_mode=... green_mode=... rapid_crosscheck_mode=... config_version=... operation_mode=...`(operation_mode は config_files.feature-flag.env.derived の運用モード名)"
      - "`INFO parallel_run status changed from=STARTED to=RUNNING run_id=...`(on)"
      - "`INFO slot started slot=... mode=... pid=...`"
      - "`ERROR management db update failed table=slot_executions run_id=...`(起動後の pid UPDATE 失敗。runner は起動済みのため終了コードは変えない。background-rerun.sh の復元起動も同文)"
      - "`INFO parallel_run status changed from=RUNNING to=COMPLETED run_id=...`(on。foreground 中継後)"
      - "`ERROR management db update failed table=parallel_runs run_id=...`(中継後の COMPLETED UPDATE 失敗。終了コードは変えない)"
    notes:
      - "runner へ引き継ぐ環境変数は RELAY_GATE_CONFIG_DIR / RELAY_GATE_ARTIFACT_ROOT / RELAY_GATE_LOG_DIR / RAPID_CROSSCHECK_MODE の 4 つ(値は facade が解決済みの実効値。RELAY_GATE_HOME は runner が自身の所在から再解決する。RELAY_GATE_NOW は設定時のみ追加で引き継ぐ)。background-rerun.sh の復元起動も同じ 4 つを引き継ぐ"
      - "RAPID_CROSSCHECK_MODE=on のとき facade.sh と slot runner は $RELAY_GATE_CONFIG_DIR/rapid-crosscheck.env の RAPID_DB_CONN_REF を読む(parallel_runs / slot_executions / rapid_runs の INSERT / UPDATE)。不在は facade.sh が終了コード 2、runner は exitcode.txt=2(config_files.rapid-crosscheck.env.readers)"

  - name: "$BLUE_RUNNER / $GREEN_RUNNER"
    tier: "tier-facade"
    synopsis: "<runner> --run-id <run_id> --job-id <JOB_ID> --role blue|green --mode foreground|background [--execution-spec <path>] [--help] -- [PARAM...]"
    invoked_by: "内部呼び出し(facade.sh / background-rerun.sh)。実体は feature-flag.env の BLUE_RUNNER / GREEN_RUNNER が指す絶対パス。runner IF version = 1"
    defined_in_uc: "適用構成業務/適用構成定義フロー/slot runner の実体スクリプトを割り当てる"
    used_by_ucs:
      - "実装切替業務/実装切替ジョブ実行フロー/slot 実行モードを選択して runner を起動する"
      - "実装切替業務/実装切替ジョブ実行フロー/ジョブマップで JOB_ID から実行先を解決する"
      - "実装切替業務/実装切替ジョブ実行フロー/execution-spec.json を確定保存する"
      - "実装切替業務/実装切替ジョブ実行フロー/実装スクリプトを実行して Runner Result を出力する"
      - "クロスチェック業務/速報クロスチェックフロー/速報クロスチェック runner へ完了通知を送信する"
      - "実行復旧業務/background 側リランフロー/元の execution-spec.json から復元して新しい run_id で起動する"
    args:
      - name: "-- PARAM..."
        type: "string[]"
        required: false
        description: "追加引数。固定引数の後ろに順序保持で連結(shared_rules.argument_concatenation)。--execution-spec 指定時は受け付けない"
    options:
      - name: "--run-id"
        type: "string"
        required: true
        description: "run_id。成果物ディレクトリ名。--execution-spec 指定時は spec の run_id と一致必須"
      - name: "--job-id"
        type: "string"
        required: true
        description: "JOB_ID。ジョブマップの検索キー。--execution-spec 指定時は spec の job_id と一致必須"
      - name: "--role"
        type: "enum"
        enum: ["blue", "green"]
        required: true
        description: "自 slot。<role>-job-map.tsv を選び、facade/<run_id>/<role>/ に成果物を書く"
      - name: "--mode"
        type: "enum"
        enum: ["foreground", "background"]
        required: true
        description: "実行モード(リランでは background)"
      - name: "--execution-spec"
        type: "string"
        required: false
        description: "復元起動。指定時はジョブマップを読まず、既存 execution-spec.json の slots.<role> と run 単位の params で実行する。保存フェーズはスキップ"
      - name: "--help"
        type: "boolean"
        required: false
        default: false
        description: "使い方と `runner-if-version=1` を stdout に出して終了コード 0"
    stdin: "なし(SSH は -n で stdin を閉じる)"
    stdout: "なし(--help を除く)。実装の stdout は facade/<run_id>/<role>/stdout.log へ"
    stderr: "なし。実装の stderr は stderr.log へ。SSH 失敗・spec 不整合は stderr.log 末尾に `error:` 1 行(exitcode.txt 公開前のみ。公開後に stderr.log を変更しない。完了通知の失敗は stderr.log に書かず実行ログ WARN のみ)"
    exit_codes:
      - code: "exitcode.txt の値"
        meaning: "実装の終了コードをそのまま返す(0 → SUCCEEDED / 非 0 → FAILED)。完了通知の成否は反映しない"
        condition: "実装を実行し 3 ファイルを公開した"
      - code: 2
        meaning: "runner IF 引数不正・設定検証エラー(exitcode.txt=2 を公開)"
        condition: "引数不足 / job_id 未定義 / ジョブマップなし / fixed_args_json 不正 / hang_detect_limit_minutes 不正 / spec なし・run_id 不一致・欠落 / PARAM 併用 / started-at.txt 既存(復元起動の二重起動)/ RAPID_CROSSCHECK_MODE=on で rapid-crosscheck.env 不在または RAPID_DB_CONN_REF 欠落"
      - code: 6
        meaning: "実行エラー"
        condition: "SSH 接続失敗(exitcode.txt=6。仮採用)/ Runner Result 3 ファイルを揃えられない書き込み失敗 / execution-spec.json の lock タイムアウト・書き込み失敗・既存ファイルの解析失敗(通常起動で他 slot が書いた JSON が不正。復元起動での spec 不正は 2)"
    idempotency: "同じ run_id / role の exitcode.txt が既にあれば実装を再実行せず既存の値で終了(WARN ログ)。started-at.txt だけがある場合は通常起動では上書き再実行、復元起動では 2。execution-spec.json への自 slot 節の追加は一度きり(既存なら何もしない)。on 時の終端 UPDATE(`UPDATE slot_executions SET status=?, exit_code=?, completed_at=? WHERE run_id=? AND slot=? AND status='RUNNING'`)は facade / background-rerun が起動前に INSERT した行を更新する。更新件数 0(行なし・既に ABORTED)は実行ログに `ERROR slot_executions update affected 0 rows run_id=... role=...` を残して終了コードは変えない(exitcode.txt の値のまま)"
    environment: "facade.sh / background-rerun.sh から RELAY_GATE_CONFIG_DIR / RELAY_GATE_ARTIFACT_ROOT / RELAY_GATE_LOG_DIR / RAPID_CROSSCHECK_MODE の 4 つを受け取る(feature-flag.env は読まない)。RAPID_CROSSCHECK_MODE=on のとき $RELAY_GATE_CONFIG_DIR/rapid-crosscheck.env の RAPID_DB_CONN_REF を読む(不在は exitcode.txt=2)"

  - name: "rapid-crosscheck-runner.sh"
    tier: "tier-rapid-crosscheck"
    synopsis: "rapid-crosscheck-runner.sh blue-completed|green-completed --run-id <run_id> --job-id <job_id> --exit-code <n> --artifact-uri <uri> [--verbose] [--help]"
    invoked_by: "内部呼び出し(slot runner の lib/runner-notify.sh。RAPID_CROSSCHECK_MODE=on のときのみ、exitcode.txt 公開後に同期起動)"
    defined_in_uc: "クロスチェック業務/速報クロスチェックフロー/速報クロスチェック runner へ完了通知を送信する"
    used_by_ucs:
      - "クロスチェック業務/速報クロスチェックフロー/両系成功時に速報比較依頼を作成する"
    args:
      - name: "subcommand"
        type: "enum"
        enum: ["blue-completed", "green-completed"]
        required: true
        description: "通知元の系統(公開 function)"
    options:
      - name: "--run-id"
        type: "string"
        required: true
        description: "run_id"
      - name: "--job-id"
        type: "string"
        required: true
        description: "JOB_ID。同じ run_id の parallel_runs.job_id と不一致なら warn を出して処理は継続(rapid_runs は job_id 列を持たない)"
      - name: "--exit-code"
        type: "integer"
        required: true
        description: "公開済み exitcode.txt の値(0〜255 の整数。範囲外・非整数は終了コード 2)"
      - name: "--artifact-uri"
        type: "string"
        required: true
        description: "成果物ディレクトリ URI(file:// 絶対パス)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "なし"
    stdout: "固定順: run_id= / job_id= / role= / slot_status=(SUCCEEDED|FAILED) / completion_status=(PENDING|ONE_COMPLETED|BOTH_SUCCEEDED|ANY_FAILED|REQUEST_CREATED) / request_status=(REQUESTED|-) / requested_at=(UTC|-)。slot runner は stdout に中継しない"
    stderr: "error: option required option=... / error: invalid exit_code value=... / error: unknown subcommand subcommand=... / error: config file not found path: ...(2。rapid-crosscheck.env 不在。config_files.rapid-crosscheck.env.on_missing の定型文)/ error: option required option=RAPID_DB_CONN_REF path: ...(2)/ error: rapid run not found run_id=... / error: management db connection failed run_id=... conn_ref=...(6)/ error: management db update failed run_id=... role=... / error: management db transaction failed run_id=... / warn: job_id mismatch run_id=... notified=... recorded=..."
    exit_codes:
      - code: 0
        meaning: "自系統の完了結果を rapid_runs に登録し、両系成功なら依頼を作成した(依頼の作成有無を問わず 0。再通知も 0)"
        condition: "トランザクション COMMIT"
      - code: 2
        meaning: "サブコマンド・オプションの検証エラー"
        condition: "未知のサブコマンド / 必須オプション欠落 / exit_code 非整数・0〜255 の範囲外 / rapid-crosscheck.env 不在または RAPID_DB_CONN_REF 欠落(`management db is not configured` は使わない。その文言は rapid-crosscheck-worker.sh の mode=off(3)専用)"
      - code: 3
        meaning: "業務エラー"
        condition: "rapid_runs に run_id の行が無い"
      - code: 6
        meaning: "実行エラー"
        condition: "管理 DB 接続・SQL 失敗、トランザクション失敗(ROLLBACK 済み)"
    idempotency: "同じ run_id / role の再通知は rapid_runs の自系統列を同値で更新するだけ(先勝ち。先に登録済みの値は変えない)。速報比較依頼は run_id を主キーに 1 件だけ INSERT(重複依頼を作らない。arch CTP-006)"
    notes:
      - "完了通知失敗時: slot runner は本コマンドの非 0 終了を runner の実行ログに `WARN completion notice failed run_id=... role=... exit_code=N` として残すだけで、stderr.log には追記しない(exitcode.txt 公開後の 3 ファイルは変更しない。foreground の場合 facade が中継する stderr が変わらないため、ジョブスケジューラへの応答は速報クロスチェックの失敗で変わらない)。runner 自身の終了コードは実装の exitcode.txt の値のまま変えない(通知の成否を業務ジョブの成否に混ぜない)"
      - "完了通知失敗の復旧: 運用者が同一引数(subcommand / --run-id / --job-id / --exit-code / --artifact-uri)で本コマンドを再実行する。冪等・先勝ちのため重複依頼は作られない。通知失敗の自動検知は RDRA に要件が無くスコープ外(rdra-feedback.md 参照)"

  - name: "rapid-crosscheck-worker.sh"
    tier: "tier-rapid-crosscheck"
    synopsis: "rapid-crosscheck-worker.sh [--once] [--worker-id <id>] [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(定期起動 --once)または常駐プロセス"
    defined_in_uc: "クロスチェック業務/速報クロスチェックフロー/速報比較依頼を claim する"
    used_by_ucs:
      - "クロスチェック業務/速報クロスチェックフロー/比較ツールでジョブ単位比較を実行して結果を登録する"
      - "実行復旧業務/background 側リランフロー/速報比較依頼だけを新規作成する"
    args: []
    options:
      - name: "--once"
        type: "boolean"
        required: false
        default: false
        description: "1 回だけ poll / claim / 実行して終了する"
      - name: "--worker-id"
        type: "string"
        required: false
        default: "{hostname}-{pid}"
        description: "claim 時に記録する worker_id(英数字・_・- のみ)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr に出す"
    stdin: "なし"
    stdout: "--once で claim できたとき固定順: run_id= / job_id= / worker_id= / lease_until= / request_status=(SUCCEEDED|FAILED|ABORTED) / result_status=(OK|NG|FAILED|-) / exit_code=(整数|-) / comparison_result_id=(8 桁 hex|-) / artifact_dir: <絶対パス>。comparison_results を作らないケース(比較定義なし・起動失敗)は result_status=- / comparison_result_id=-(exit_code=6 は出す)。終端 UPDATE が 0 件(比較中に abort-rapid-crosscheck.sh で ABORTED)のときは request_status=ABORTED / result_status=- / exit_code=- / comparison_result_id=-。claim 後の RUNNING 遷移(条件付き UPDATE)が 0 行(lease 失効で別 worker に回収された / 中止済み)のときは比較を行わず、claim の 4 行に続けて request_status=<再 SELECT した現在の status> / result_status=- / exit_code=- / comparison_result_id=- / artifact_dir: - を出して 0(実行ログ `WARN request not owned run_id=... status=...`)。claim 0 件なら 0 行。常駐時は実行ログのみ"
    stderr: "error: management db is not configured mode=off(3)/ error: management db connection failed worker_id=... conn_ref=...(6)/ error: unknown option option=... / error: invalid worker_id value=... / error: config file not found path: ...(2。on で rapid-crosscheck.env 不在)/ error: option required option=RAPID_DB_CONN_REF path: ...(2)/ error: compare tool launch failed run_id=... command=... / error: management db update failed run_id=... 。終端 UPDATE 0 件(比較中に ABORTED)は stderr に出さず実行ログ `WARN request already terminal run_id=... status=ABORTED` のみ(継続。stdout は request_status=ABORTED)"
    exit_codes:
      - code: 0
        meaning: "--once で 1 件を終端状態まで処理した、または依頼が無かった(比較 NG / 実行エラーの 3 / 6 も 0)。crosscheck-job-map.tsv に job_id の行が無い場合は比較ツールを起動せず、comparison_results を INSERT せずに依頼を FAILED / exit_code=6 / error_summary=`comparison definition not found job_id=...` で終端し 0。終端 UPDATE が 0 件(ABORTED 済み)の場合は成果物 3 ファイルを残し、実行ログに `WARN request already terminal run_id=... status=ABORTED` を残して 0(stderr には出さない。stdout は request_status=ABORTED)。常駐は SIGTERM で 0"
        condition: "1 サイクル完了"
      - code: 2
        meaning: "オプション・env の検証エラー"
        condition: "未知のオプション / worker_id の文字種不正 / RAPID_CROSSCHECK_MODE=on で rapid-crosscheck.env 不在または RAPID_DB_CONN_REF 欠落 / RAPID_* env 不正"
      - code: 3
        meaning: "業務エラー(管理 DB を使わない構成)"
        condition: "feature-flag.env の RAPID_CROSSCHECK_MODE=off(DB に接続せず `error: management db is not configured mode=off` で終了。rapid-crosscheck.env は読まない)"
      - code: 6
        meaning: "実行エラー"
        condition: "claim / DB 接続失敗(--once)、比較ツールの起動自体に失敗、成果物ディレクトリ作成不可、DB 更新失敗。常駐時は次 poll で再試行"
    idempotency: "条件付き UPDATE による claim(更新件数 1 のみ成功)で多重 worker の重複処理を防ぐ。比較実行後の終端 UPDATE は status=RUNNING かつ worker_id 一致を条件にする(0 件 = 中止済み。comparison_results も INSERT しない)。成果物は .tmp → mv。comparison_results は比較ツールを起動して終了コードを得たときだけ INSERT する(比較定義なし・起動失敗では INSERT しない)。起動前に feature-flag.env の RAPID_CROSSCHECK_MODE を読み、off なら DB に接続しない"

