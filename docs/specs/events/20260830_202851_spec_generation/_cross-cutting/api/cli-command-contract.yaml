    stderr: "終端到達後は依頼に保存された stderr をバイト列のまま出す。中継に至る前の relay-gate 自身のエラーのみ `error:`(+ `hint:`): error: option required option=--business-date|--catalog-version / error: invalid value option=--business-date value=... / error: unknown option option=... / error: config file not found path: ...(final-crosscheck.env 不在)/ error: option required option=FINAL_DB_CONN_REF path: ... / error: target_catalog_path declaration not found path: ...(crosscheck-job-map.tsv に `# target_catalog_path=` なし)/ error: catalog version not found catalog_version=... path: ... / error: management db connection failed conn_ref=... / error: management db query failed final_crosscheck_id=... / error: polling limit exceeded final_crosscheck_id=... status=... limit_sec=...(status は超過時点の依頼 status)/ error: request aborted before completion final_crosscheck_id=...(exit_code NULL)。待機中の進捗は実行ログにのみ(`INFO polling final_crosscheck_id=... status=... elapsed_minutes=...`)"
    exit_codes:
      - code: "依頼に保存された exit_code(0 / 3 / 6 / その他)"
        meaning: "無加工中継。0 = 比較 OK(リリース判断の正本)/ 3 = 比較 NG / 6 = 実行エラー"
        condition: "依頼が SUCCEEDED / FAILED に到達し exit_code が 0〜255"
      - code: 2
        meaning: "入力・設定検証エラー(中継に至る前)"
        condition: "引数欠落、business_date 形式不正、未知のオプション、final-crosscheck.env 不在または必須キー欠落、`# target_catalog_path=` なし、対象カタログに catalog_version の行が無い"
      - code: 6
        meaning: "実行エラー(中継に至る前、または中継不能)"
        condition: "管理 DB 接続・INSERT・SELECT 失敗、polling 上限 FINAL_POLL_LIMIT_SEC 超過(依頼は変更しない)、exit_code が NULL(ABORTED で比較未完了)、exit_code が 0〜255 の範囲外"
    idempotency: "起動のたびに新しい final_crosscheck_id で依頼を 1 件登録する(同じ business_date / catalog_version で複数回起動すれば依頼は複数件)。polling 中は状態を UPDATE しない。再実行はジョブスケジューラの正規ジョブで行う"

  - name: "final-crosscheck-worker.sh"
    tier: "tier-final-crosscheck"
    synopsis: "final-crosscheck-worker.sh [--once] [--worker-id <id>] [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(定期ジョブ --once)または DB セグメント上の常駐プロセス"
    defined_in_uc: "クロスチェック業務/確報クロスチェックフロー/確報比較依頼を claim する"
    used_by_ucs:
      - "クロスチェック業務/確報クロスチェックフロー/比較ツールで日次全量比較を実行して結果を保存する"
    args: []
    options:
      - name: "--once"
        type: "boolean"
        required: false
        default: false
        description: "1 回だけ poll / claim / 実行して終了する"
      - name: "--worker-id"
        type: "string"
        required: false
        default: "{hostname}-{pid}"
        description: "claim に記録する worker 識別子(英数字・_・- のみ)"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "info を stderr にも出す(info: claimed ... / info: no request to claim ...)"
    stdin: "なし"
    stdout: "出力しない(常駐ログは実行ログ final-crosscheck-worker.sh.log へ。比較ツールの stdout は依頼レコードと stdout.log に保存)"
    stderr: "error: management db connection failed worker_id=... conn_ref=...(6。速報 worker と同文)/ error: management db query failed ...(6)/ error: management db update failed final_crosscheck_id=...(6)/ error: compare tool launch failed final_crosscheck_id=... command=...(6。依頼は FAILED exit_code=6 error_summary=`launch failed`。速報 worker と同じ値)/ error: no catalog rows catalog_version=... path: ...(6。依頼は FAILED exit_code=6 error_summary=`no catalog rows catalog_version=...`)/ error: artifact dir is not writable path: ...(6)/ error: config file not found path: ... / error: option required option=FINAL_DB_CONN_REF path: ...(2)/ hint:。終端 UPDATE 0 件(比較中に ABORTED)は stderr に出さず実行ログ `WARN request already terminal final_crosscheck_id=... status=ABORTED` のみ(継続、終了コード 0)。比較ツールの stderr は流さない"
    exit_codes:
      - code: 0
        meaning: "1 サイクル完了(claim して終端まで保存した / 依頼が無かった、のどちらも 0)。比較ツールの非 0 は反映しない。終端 UPDATE が 0 件(比較中に abort-final-crosscheck.sh で ABORTED)の場合は成果物 3 ファイルを残し、実行ログに `WARN request already terminal final_crosscheck_id=... status=ABORTED` を残して 0(stderr には出さない)。常駐は SIGTERM で 0"
        condition: "1 サイクル完了"
      - code: 2
        meaning: "入力・設定検証エラー"
        condition: "未知のオプション、--worker-id の文字種不正、final-crosscheck.env 不在または必須キー欠落"
      - code: 6
        meaning: "実行エラー"
        condition: "管理 DB 接続・SQL 失敗、比較ツール起動失敗(依頼は FAILED exit_code=6 を保存)、対象カタログに catalog_version の行が 0 行(起動失敗と同じ扱い。依頼は FAILED exit_code=6)、成果物書き込み失敗、内部エラー"
    idempotency: "条件付き UPDATE による claim。RUNNING 到達後(started_at あり)は lease 失効でも戻さない(中止は abort-final-crosscheck.sh)。終端 UPDATE は `WHERE final_crosscheck_id=? AND status='RUNNING'`(0 件 = 中止済み)。DB の終端 UPDATE に失敗しても成果物 3 ファイルは残る。runner の polling は status 列のみを読み、終端検知後に 1 回だけ status / exit_code / stdout / stderr の 4 列を SELECT する"

  - name: "hang-detector.sh"
    tier: "tier-ops"
    synopsis: "hang-detector.sh [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(ハング検知定期ジョブ、5 分ごと)"
    defined_in_uc: "実行監視業務/background 実行監視フロー/background 実行の経過時間と終了状態を判定する"
    used_by_ucs:
      - "実行監視業務/background 実行監視フロー/ハング疑い・実行エラー・比較異常を通知する"
      - "実行監視業務/background 実行監視フロー/監視記録を保存する"
      - "適用構成業務/適用構成定義フロー/切り替えた運用モードで業務ジョブを実行する"
    args: []
    options:
      - name: "--verbose"
        type: "boolean"
        required: false
        default: false
        description: "対象ごとの `info: judged run_id=... role=... judgement=... elapsed_minutes=... limit_minutes=...` / `info: alert sent ...` / `info: alert skipped already notified ...` を stderr にも出す"
    stdin: "なし"
    stdout: "出力しない(0 行)。判定結果は実行ログ hang-detector.sh.log にのみ残す"
    stderr: "error: config file not found path: ...(2。hang-detector.env 不在。全コマンド共通の定型文)/ error: option required option=HANG_DB_CONN_REF|ALERT_MAIL_TO|ALERT_MAIL_CMD path: ...(2。on で HANG_DB_CONN_REF 欠落、ALERT_MAIL_TO 空、ALERT_MAIL_CMD 欠落)/ error: ALERT_MAIL_CMD is not executable value=... path: ...(2)/ error: unknown option option=...(2)/ hint: / warn:(不正な started-at.txt は warn で継続)/ warn: execution-spec missing run_id=... path: ...(execution-spec.json が無い run は判定対象外。monitor_records も書かず継続、終了コード 0)/ warn: started-at is invalid run_id=... role=... value=... / error: mail send failed run_id=... role=... kind=... cmd_exit_code=N / error: monitor record save failed run_id=... role=... / error: management db connection failed conn_ref=...(6)"
    exit_codes:
      - code: 0
        meaning: "走査と判定が完了した(異常を検出しても 0。異常はメールで伝える)。execution-spec.json が無い run は `warn: execution-spec missing` を出して判定対象外(mode / job_id を確定できないため既定値で判定しない)。on 時は slot_executions.status=ABORTED(background slot)または rapid_crosscheck_requests.status=ABORTED(速報比較依頼)で未終端の監視記録(monitor_status NOT IN ('NOT_MONITORED','COMPLETED', *_NOTIFIED の後の終端))が残っている対象を判定 COMPLETED で終端し、メールは送らない(運用者が中止済み)。速報比較依頼は ABORTED 済みで監視記録が無いものを走査しない(依頼テーブルを起点に列挙するため)。background slot は成果物(started-at.txt)を起点に走査するため、走査窓内の ABORTED slot は監視記録の有無によらず判定 COMPLETED とし、記録 UC が COMPLETED の監視記録を UPSERT する"
        condition: "全対象の判定・通知・記録が完了"
      - code: 2
        meaning: "入力・設定検証エラー(走査前に検出。何も走査しない)"
        condition: "未知のオプション、hang-detector.env 不在、on で HANG_DB_CONN_REF 欠落、ALERT_MAIL_TO 空、ALERT_MAIL_CMD 実行不可、feature-flag.env が読めない、RELAY_GATE_ARTIFACT_ROOT が無い"
      - code: 6
        meaning: "実行エラー(他の対象は継続したうえで 6)"
        condition: "on で管理 DB 接続・SELECT 失敗、成果物ルート読み取り失敗、メール送信失敗 1 件以上(alerted_at は更新せず次回再送)、monitor_records の UPSERT 失敗 1 件以上"
    idempotency: "同じ監視対象 ID(run_id + role)・同じ通知種別のメールは 1 回だけ(monitor_records の monitor_status の遷移有無で判定: 判定結果に対応する monitor_status(shared_rules.state_codes.hang_judgement_to_monitor_status)が現在値と同じなら送らない。alerted_at は送信成功の記録であり判定根拠ではない。off では実行ログのみ)。監視記録は UPSERT。状態は参照のみで依頼・slot の状態を変更しない。on 時は走査対象の判定に slot_executions.status(background slot)と rapid_crosscheck_requests.status(依頼)の ABORTED を読む(off 時は成果物のみ)"

