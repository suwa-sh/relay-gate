uc: "実装スクリプトを実行して Runner Result を出力する"
business: "実装切替業務"
buc: "実装切替ジョブ実行フロー"
bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "ExecuteImplementationCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "slot 実行"
  - name: "SlotExecution"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "slot 実行"
  - name: "RunnerResult"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "Runner Result"
  - name: "ExecutionSpecRepository"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "実行設定(execution-spec)"
  - name: "SlotExecutionRepository"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "slot 実行"
  - name: "SshAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"
  - name: "FilesystemAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"
  - name: "RdbClientAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "slot 実行"

tables:
  - name: "slot_executions"
    rdra_info: "slot 実行"
    operations:
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "SUCCEEDED(exit_code=0)/ FAILED(非 0)"
          - name: "exit_code"
            value: "exitcode.txt の値"
          - name: "completed_at"
            value: "now(UTC)"
        where: "run_id = ? AND slot = ? AND status = 'RUNNING'"
        note: "更新件数 0 は実行ログ `ERROR slot_executions update affected 0 rows run_id=... role=...` のみ(INSERT しない。行の作成主体は facade で runner 起動前に INSERT 済み)。終了コードは exitcode.txt の値を維持"
    indexes_needed:
      - columns: ["run_id", "slot"]
        reason: "主キー。run_id + slot での更新"
        access_pattern: "run_id = ? AND slot = ?"

kvs: []
object_storage: []
