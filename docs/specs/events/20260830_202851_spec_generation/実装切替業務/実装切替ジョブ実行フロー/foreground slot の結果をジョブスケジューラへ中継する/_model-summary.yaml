uc: "foreground slot の結果をジョブスケジューラへ中継する"
business: "実装切替業務"
buc: "実装切替ジョブ実行フロー"
bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "RelayForegroundResultCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "ジョブスケジューラ応答"
  - name: "ParallelRun"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "RunnerResult"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "Runner Result"
  - name: "ParallelRunRepository"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "SchedulerResponse"
    tier: "tier-facade"
    layer: "presentation"
    type: "record"
    rdra_info: "ジョブスケジューラ応答"
  - name: "RdbClientAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"

tables:
  - name: "parallel_runs"
    rdra_info: "並行稼働実行(parallel_run)"
    operations:
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "COMPLETED"
          - name: "completed_at"
            value: "now(UTC)"
        where: "run_id = ? AND status = 'RUNNING'"
    indexes_needed: []

kvs: []
object_storage: []
