uc: "比較ツールで日次全量比較を実行して結果を保存する"
business: "クロスチェック業務"
buc: "確報クロスチェックフロー"

bounded_context_id: "BC-003"
aggregate_id: "AG-003"

models:
  - name: "RunFullComparisonCommand"
    tier: "tier-final-crosscheck"
    layer: "usecase"
    type: "command"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
  - name: "FinalCrosscheckRequest"
    tier: "tier-final-crosscheck"
    layer: "domain"
    type: "entity"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
  - name: "CompareToolResult"
    tier: "tier-final-crosscheck"
    layer: "domain"
    type: "value-object"
    rdra_info: "比較ツール実行結果"
  - name: "FinalCrosscheckRequestRepository"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
  - name: "TargetCatalogRepository"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "対象カタログ"
  - name: "ArtifactRepository"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "Runner Result"
  - name: "target-catalog.tsv"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "対象カタログ"
  - name: "crosscheck-job-map.tsv(確報行 + ヘッダーコメント # target_catalog_path=)"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "クロスチェックジョブマップ"
  - name: "facade/<final_crosscheck_id>/final-crosscheck/input/target-catalog.tsv"
    tier: "tier-final-crosscheck"
    layer: "gateway"
    type: "record"
    rdra_info: "対象カタログ"
  - name: "facade/<final_crosscheck_id>/final-crosscheck/{started-at.txt,stdout.log,stderr.log,exitcode.txt}"
    tier: "tier-final-crosscheck"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"

tables:
  - name: "final_crosscheck_requests"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
    operations:
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "RUNNING"
          - name: "started_at"
            value: ":now(RELAY_GATE_NOW 設定時はその値、未設定はシステム時刻 UTC。worker がバインド値で渡す。契約 environment_variables.RELAY_GATE_NOW)"
        where: "final_crosscheck_id = ? AND status = 'CLAIMED' AND worker_id = ?(更新件数 1 のみ続行。0 = lease 失効で別 worker に回収済み)"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "SUCCEEDED(exit_code=0)/ FAILED(非 0 または起動失敗)"
          - name: "exit_code"
            value: "比較ツール終了コード(起動失敗は 6)"
          - name: "stdout"
            value: "比較ツール stdout 全文"
          - name: "stderr"
            value: "比較ツール stderr 全文"
          - name: "error_summary"
            value: "起動失敗・書き込み失敗の要約。それ以外は NULL"
          - name: "completed_at"
            value: ":now(RELAY_GATE_NOW 設定時はその値、未設定はシステム時刻 UTC。worker がバインド値で渡す。契約 environment_variables.RELAY_GATE_NOW)"
        where: "final_crosscheck_id = ? AND status = 'RUNNING'(更新件数 0 = 比較中に ABORTED。依頼は変更せず成果物を残して終了コード 0)"
    indexes_needed:
      - columns: ["final_crosscheck_id"]
        reason: "主キーによる条件付き UPDATE"
        access_pattern: "依頼 1 件につき 2 回の UPDATE"

kvs: []
object_storage: []
