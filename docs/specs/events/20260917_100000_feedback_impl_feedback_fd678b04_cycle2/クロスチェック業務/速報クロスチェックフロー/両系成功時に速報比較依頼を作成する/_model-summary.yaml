uc: "両系成功時に速報比較依頼を作成する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"
bounded_context_id: "BC-002"
aggregate_id: "AG-002"

models:
  - name: "SlotCompletedArgs"
    tier: "tier-rapid-crosscheck"
    layer: "presentation"
    type: "request"
    rdra_info: "完了通知"
  - name: "DispatchRapidRequest"
    tier: "tier-rapid-crosscheck"
    layer: "usecase"
    type: "command"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
  - name: "CompletionStatus"
    tier: "tier-rapid-crosscheck"
    layer: "domain"
    type: "value-object"
    rdra_info: "速報実行(rapid_run)"
  - name: "RapidRunRecord"
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "速報実行(rapid_run)"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
  - name: "ParallelRunRecord"
    # 同一トランザクションで parallel_runs.status を FOR UPDATE で読み(abort-blue / abort-green の parallel_runs 無条件行ロック(SELECT 1 ... FOR UPDATE)と直列化)、ABORTED なら依頼を作成しない(条件「中止済み run の比較依頼作成除外」)
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "SlotExecutionRecord"
    # 完了通知の対象 slot(通知元 role の slot)の slot_executions.status を同一トランザクションで読み(SELECT のみ)、ABORTED なら依頼を作成しない(条件「中止済み run の比較依頼作成除外」。aborted.txt 公開済みのミラー)
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "slot 実行"
  - name: "速報クロスチェック設定(rapid-crosscheck.env)"
    # 管理 DB 接続参照名(RAPID_DB_CONN_REF)の出所。受信 UC と同一起動で読む
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "速報クロスチェック設定"

tables:
  - name: "rapid_runs"
    rdra_info: "速報実行(rapid_run)"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ? FOR UPDATE(トランザクション内の行ロック)"
      - type: "UPDATE"
        columns:
          - name: "completion_status"
            value: "PENDING / ONE_COMPLETED / BOTH_SUCCEEDED / ANY_FAILED / REQUEST_CREATED(判定表の結果。中止済みの run(parallel_runs.status が ABORTED、または対象 slot の slot_executions.status が ABORTED)は両系成功でも BOTH_SUCCEEDED のまま)"
        where: "run_id = ?"
    indexes_needed: []
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "通知の run_id(主キー)"
          - name: "job_id"
            value: "parallel_runs.job_id(通知の --job-id は照合のみ。不一致は warn: job_id mismatch を出して parallel_runs の値を採用)"
          - name: "status"
            value: "REQUESTED"
          - name: "requested_at"
            value: "現在時刻(ローカル時刻)"
        where: "NOT EXISTS (SELECT 1 FROM rapid_crosscheck_requests WHERE run_id = ?)。中止済みの run(parallel_runs.status = 'ABORTED'、または完了通知の対象 slot の slot_executions.status = 'ABORTED')では INSERT を発行しない(条件「中止済み run の比較依頼作成除外」)"
    indexes_needed:
      - columns: ["run_id"]
        reason: "ユニーク制約: 1 run_id に 1 件の依頼(主キー)"
        access_pattern: "条件付き INSERT の存在確認"
  - name: "parallel_runs"
    rdra_info: "並行稼働実行(parallel_run)"
    operations:
      - type: "SELECT"
        columns:
          - name: "job_id"
            value: ""
          - name: "status"
            value: ""
        where: "run_id = ? FOR UPDATE(job_id の照合と status の参照。同一トランザクション内の行ロックで abort-blue / abort-green の parallel_runs 無条件行ロック(SELECT 1 ... FOR UPDATE)と直列化する。ABORTED なら依頼を作成しない。ロック順: rapid_runs → parallel_runs → slot_executions(対象 slot の行の SELECT)→ rapid_crosscheck_requests)"
    indexes_needed: []
  - name: "slot_executions"
    # 完了通知の対象 slot の状態参照(条件「中止済み run の比較依頼作成除外」の判定材料。aborted.txt 公開済みのミラー)
    rdra_info: "slot 実行"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "slot"
            value: ""
          - name: "status"
            value: ""
        where: "run_id = ? AND slot = ?(slot = 通知元 role。同一トランザクション内。SELECT のみ、ロックしない。対象 slot が ABORTED(aborted.txt 公開済み)なら依頼を作成しない。行なし(速報比較依頼だけのリラン由来 run)は ABORTED ではない)"
    indexes_needed: []

kvs: []
object_storage: []
