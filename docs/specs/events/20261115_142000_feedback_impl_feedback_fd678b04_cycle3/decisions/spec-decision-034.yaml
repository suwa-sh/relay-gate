schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-034"
title: "設定ファイルの検査の性能を目標値として書き直し、feature flag の検証の error 行の順・列挙外の mode の扱い・9 キー以外のキーの値の扱いを CLI 契約に定める"
status: "approved"
generated_at: "2026-11-15T14:20:00Z"
context: |
  - 設定ファイルの検査の性能(5,000 行・10 秒)は、CLI 契約では「保証する」「性能保証の範囲外」と書かれ、合否の検査とも入力の制限とも読めた。
    - 利用者は 2026-11-13 に「性能の目標値であって入力を制限する仕様ではない」、2026-11-15 に「目標であって合否の検査ではない」と決めた。
    - 非機能要求グレード(B.1.1.2 / B.2.1.1)は 2026-11-15 に目標値の記載へ改められた(大きさの条件は 5,000 行以内かつ 8 MB 以内、対象は 4 つの設定検証種別すべて)。
  - CLI 契約の runner への問い合わせの節は「問い合わせ以外の検証と出力を 0.8 秒以内に収めれば 10 秒以内を満たす」と書いていた。
    - 数 MB の設定では検査だけで数秒かかるため成り立たず、runner の応答待ち(最大 9.2 秒)を 10 秒に含めるかどうかが決まっていなかった。
  - feature flag の検証(validate-config.sh --feature-flag)は、次の 3 点が仕様から決まらなかった。
    1. キーごとの検査で error 行が 2 行以上出るときの、error 行どうしの順。
    2. mode の値が列挙外・欠落・空のとき、その slot の従属キー・対応ジョブマップを検査し、runner へ問い合わせるかどうか。
    3. 9 キー以外のキーの値を、読み手のプロセスの変数・環境変数へ取り込んでよいかどうか。
  - 元の方針資料(しくみ・利用イメージ)には、設定ファイルの規模と検査時間、error 行の順、列挙外の mode の扱い、9 キー以外のキーの値の扱いの記載が無い。
  - 利用者は 2026-11-15 に、上の 3 点をいずれも「いまの実装どおりを仕様に書く」と決めた。
decision: |
  1. 設定ファイルの検査の性能を目標値として書いた(CLI 契約 config_input_rules.performance_target を新設)。
     - 目標: 1 ファイルあたり 5,000 行以内かつ 8 MB 以内の設定ファイルを、内容によらず 10 秒以内に検査し終えることを目指す。
     - 対象: 4 つの設定検証種別(--feature-flag / --job-map / --rapid-crosscheck / --final-crosscheck)すべてと facade の設定読み込み。CSV 形式と env 形式の両方。
     - 入力の制限ではない: 大きさを理由に拒否・警告しない。大きさを超えるファイルも検証の結果は変わらない。
     - 合否の検査ではない: 目標の時間を超えても終了コード・stdout・stderr は変わらず、目標を超えたことを不合格の理由にしない。
     - 数値の出所は非機能要求グレードで、契約と UC 別仕様は数値を再決定しない。
     - 特定の入力で所要時間を確認する自動テスト・BDD シナリオは「この入力なら、この時間以内に終わる」の確認として残す。
  2. 入力の守備範囲の表の 2 項目を、目標値と分かる語に改めた。
     - 「行・セルの長さの上限」: 「共通前提の範囲で保証する」→「長さを理由に拒否・警告しない。処理時間は性能の目標値のとおり」。
     - 「5,000 行を超えるファイル」→「5,000 行または 8 MB を超えるファイル」: 「性能保証の範囲外」→「受理する。検証の結果は大きさによって変わらない。目標値の条件であって入力の制限ではない」。
  3. runner の応答待ちを、設定ファイルの検査の目標とは別に数えると書いた(runner_help_probe.response_time_budget)。
     - 「問い合わせ以外の検証と出力を 0.8 秒以内に収めれば 10 秒以内を満たす」を削除した。
     - 応答しない runner があるときの所要時間は、設定ファイルの検査の時間に応答待ち(最大 9.2 秒)を加えたものになり、合計が 10 秒を超えても検証の結果は変わらない。
     - 1 slot 4.6 秒・両 slot 9.2 秒の問い合わせの上限は変えていない。
  4. feature flag の検証の error 行どうしの順を、CLI 契約の feature-flag.env の節(error_order)に定めた。
     - 順: mode の必須・列挙(BLUE_MODE → GREEN_MODE → RAPID_CROSSCHECK_MODE)→ foreground の個数 →
       BLUE_IMPL → BLUE_RUNNER → GREEN_IMPL → GREEN_RUNNER → RAPID_CROSSCHECK_RUNNER → RAPID_CROSSCHECK_WORKER →
       `FINAL_` で始まるキー(ファイルに出た順)→ 対応ジョブマップ(blue → green)。
     - 1 つのキーの error 行は 1 行だけ(実体パスは 欠落・空 → 絶対パスでない → 実行不可 の順に最初の 1 つ)。列挙外の hint は、その error 行の次の行。
     - 12 行の例を、いまの実装で実走した出力と同じ文言で書いた。UC「feature flag を設定する」の tier 仕様は順を持たず、契約を参照する。
  5. mode の値が列挙外・欠落・空のときの扱いを、同じ節の validation_rules に定めた。
     - その mode は「off でない」として扱い、mode 自体の error 行に加えて、off でないときと同じ検査を行う
       (slot の実装版・runner、対応ジョブマップ、runner への --help の問い合わせ。RAPID_CROSSCHECK_MODE なら速報 runner / worker)。
     - foreground の個数は、値が foreground と完全一致する slot だけを数える。
  6. 9 キー以外のキーの値の扱いを、config_input_rules.env_files に定めた。
     - feature-flag.env から値を取り込むのは 9 キーだけ。9 キー以外のキーは、値をプロセスの変数・環境変数へ取り込まず、キー名を表示と重複の判定に使うだけ。
     - 検証コマンドだけでなく、feature-flag.env を読むすべての処理(実行時の読み手)に同じ規則が及ぶ。
  7. UC 別仕様を契約に揃えた。
     - feature flag を設定する: spec.md(処理フローの補足、分岐条件、E2E BDD 2 場面)、tier-facade.md(設定契約・性能・BDD 4 場面)、_api-summary.yaml。
     - slot ごとのジョブマップを定義する: tier-facade.md の性能の記載と、入力の守備範囲の表の「5,000 行超」の行。
     - slot runner の実体スクリプトを割り当てる: 応答しない runner の場面の「10 秒以内」の出所を、runner への問い合わせの上限に改めた(場面は残した)。
     - ジョブマップで JOB_ID から実行先を解決する、出力規約(ui-design.md)、UX 設計(ux-design.md): 「10 秒以内を満たす」の言い方を目標値に合わせた。
  8. 反証レビューの指摘で足した点と、範囲を限った点
     - foreground の個数の error 行の blue_mode= / green_mode= の値: 読み取った値をそのまま出し、キーが無い・値が空のときは `-` を出す(いまの実装どおり)。
       mode が欠落・空の slot を foreground に数えないと定めたことで、この行が必ず出る入力ができ、値の表記が決まっていなかったため。
     - error 行どうしの順(error_order)の対象は validate-config.sh --feature-flag の出力だけに限った。
       facade.sh / background-rerun.sh の起動時検証が、違反が 2 つ以上あるときにどの error 行を出すかは、利用者の決定にも元の方針資料にも無いため、ここでは定めない。
       UC「slot 実行モードを選択して runner を起動する」の tier 仕様は検査の項目を別の粗い順(列挙 → foreground → 必須キーの存在 → 実体パス)で書いており、
       同じ検証関数を使うという記載と合わせると、違反が 2 つ以上ある設定で出る 1 行が 1 つに決まらない。未決事項として docs/todo.md に記録し、確認推奨項目として返した。
  9. 実装との照合(2026-11-15 時点。読み取り専用)
     - feature flag の検証の実装を実走し、error 行の順の例(12 行)、mode が列挙外・空・欠落の 3 通り、RAPID_CROSSCHECK_MODE が列挙外の場面、
       9 キー以外のキー(PATH など)を置いた場面の出力が、追加した BDD の期待値と一致することを確認した。実装の変更は要らない。
consequences:
  positive:
    - "非機能要求グレードと CLI 契約のどちらを読んでも、設定ファイルの検査の性能が目標値で、入力の制限でも合否の検査でもないと分かる"
    - "runner の応答待ちと設定ファイルの検査の時間を分けて数えるため、数 MB の設定でも記載が成り立つ"
    - "feature flag の検証で error 行が 2 行以上出る入力でも、標準エラーの行数・内容・順が仕様から 1 つに決まる"
    - "設定ファイルの内容で読み手のプロセスの環境を書き換えられないことが、実行時の読み手にも及ぶ"
    - "いまの実装とテストを変えずに済む"
  negative:
    - "feature flag の検証の error 行の順は、キー表の並び(mode → 実装版 2 つ → runner 2 つ)と違うため、順を契約で別に確かめる必要がある"
    - "mode の書き間違いだけのときも、従属キーの error 行と runner への問い合わせが出る"
    - "目標との差が大きい入力(数 MB のジョブマップ・速報クロスチェック設定)があっても、仕様上は不合格にならない。差は差として記録する"
    - "facade.sh / background-rerun.sh の起動時検証が、違反 2 つ以上のときに出す error 行は未決のまま残る(利用者の確認が要る)"
alternatives_considered:
  - name: "性能の目標を CSV 形式(slot ジョブマップ)と feature flag だけに適用する"
    reason_rejected: "速報・確報クロスチェック設定の目標が無いままになり、機能ごとに再び決める必要が出る。利用者は 4 つの検証種別すべてに同じ目標を適用することを選んだ"
  - name: "runner の応答待ちを 10 秒の目標に含める"
    reason_rejected: "応答しない runner を待つ時間は設定ファイルの検査とは別の待ち時間で、設定の大きさと無関係に最大 9.2 秒かかる。利用者は別に数えることを選んだ"
  - name: "error 行どうしの順をキー表の順にする"
    reason_rejected: "実装の並べ替えが要り、利用者に見える順が変わる。利用者はいまの順を仕様に書くことを選んだ"
  - name: "mode が列挙外・欠落・空のとき、その slot の従属キーを検査しない"
    reason_rejected: "実装の変更が要り、mode を直した後に従属キーの error が初めて出る。利用者は違反を全件まとめて報告する方針に合ういまの扱いを選んだ"
  - name: "9 キー以外のキーの値の扱いを仕様に書かない"
    reason_rejected: "読み手ごとに扱いが分かれる余地が残り、設定ファイルでプロセスの環境を書き換える実装も仕様に反しなくなる。利用者は仕様に書くことを選んだ"
