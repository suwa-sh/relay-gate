schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-011"
title: "設定ファイル共通の「入力の守備範囲」を CLI 契約 config_input_rules に 1 か所で定め、原則「形式から外れた入力は拒否する」と例外 2 件・単一スナップショット・内部障害の終了コード 6 を確定する"
status: "approved"
generated_at: "2026-09-21T10:00:00Z"
context: |
  実装フェーズ(UC「slot ごとのジョブマップを定義する」)の 2026-09-19 の実装フィードバックで、blocker 1 件と spec-gap 1 件が還流した。
  - `validate-config.sh --job-map` の独立検証で、異常な入力・異常な環境に対する堅牢性の指摘が 4 回続いた(fixed_params 内の未エスケープ制御文字、
    CSV 内の NUL バイト、制御文字の生出力と補助コマンドの失敗の見逃しと不正な UTF-8 の受理、検証中のファイル差し替え)。
  - 設定契約が定める入力形式(CSV、1 行目ヘッダー、`#` コメント、LF、UTF-8、bash 単独で解析)には、NUL バイト・不正な文字コード・BOM・CR・
    最終行の改行なし・空白だけの行・長さの上限・データ行 0 件・ヘッダー列名の重複・検証中の差し替え・補助コマンドの失敗の扱いが無かった。
  - 守る範囲が決まらないまま実装と独立検証が異常系を 1 つずつ見つけ続け、検証が収束しなかった。同じ論点は設定ファイルを読む他の機能
    (feature flag、クロスチェックジョブマップ、対象カタログ、env 3 種)にもある。
  - 実装は既に、単一スナップショット(TMPDIR、0600、成功・失敗・HUP / INT / TERM で削除)、補助コマンドの失敗は終了コード 6、
    既存文言の流用による拒否、を採用済みだった。
  - 方針資料(RelayGateのしくみ / 利用イメージ)には文字コード・バイト異常・差し替え・一時ファイルの記載が無い(新規の決定)。方針資料の
    ジョブマップ CSV 例は非 ASCII の値・空白とカンマを含む固定引数を含み、これが受理されることは制約。
  - 利用者は 2026-09-22 に、第 1 段階の質問(原則 / 実装済み判断の確定 / error 行の作り方 / パス形式)へ A / A / A / A で回答し、一覧表に異議なしと確定した。
decision: |
  1. 正本は cli-command-contract.yaml のトップレベル `config_input_rules` に置く。config_files の全ファイル(CSV 4 ファイル・env 4 ファイル)と
     全読み手(validate-config.sh の 4 検証種別、facade / runner / worker / hang-detector / 運用系の起動時読み込み)に適用する。各 UC の tier md は
     値を複写せず本節を参照し、判定する BDD は UC「slot ごとのジョブマップを定義する」に置く(適用先 12 UC)。
  2. 原則: 形式(UTF-8 / LF / 1 行目ヘッダー(CSV)/ KEY=VALUE(env))から外れた入力は拒否する(終了コード 2、runner は exitcode.txt=2)。
     形式の内側にある値はそのまま受理する。「警告して受理」の区分は設けない。例外は 2 件: 最終行の改行なしは受理、データ行 0 件は受理(`rows=0`)。
  3. 論点ごとの扱い: NUL バイト(コメント行を含む)・UTF-8 として不正なバイト列(コメント行を含む)・BOM・CR(CRLF を含む)・ヘッダー列名の重複は拒否。
     空白だけの行は 1 セルのデータ行として列数不一致で拒否(空行は 0 バイトの行だけ)。空のファイル・コメントだけのファイルはヘッダー無しとして拒否。
     行・セルの長さは上限なし。5,000 行超は対象外(拒否しない。NFR B.1.1.2 / B.2.1.1 の性能保証の範囲外と明記するだけ)。
     非 ASCII の値・空白とカンマを含む固定引数・Windows 形式や相対パスの work_dir / script は値として受理する。
  4. 読み込み中の差し替えに対する保証: 検証結果と実行時の解決結果は、ある 1 時点のファイル内容(単一スナップショット)だけに基づき、旧内容と新内容を
     混ぜた結果を返さない。差し替えは検知も報告もしない。validate-config.sh は検証開始時に入力を一時ファイルへ 1 回だけ複製する
     (TMPDIR、未設定なら /tmp。権限 0600。成功・失敗を問わず削除。HUP / INT / TERM で削除して 129 / 130 / 143。出力には利用者が指定したパスだけを出す)。
     実行時の読み手は同じ保証を負うが実現手段は縛らない。SIGKILL での残存・意図的な関数の差し替え等の異常環境は対象外と明記する。
  5. 検証器の内部障害: 補助コマンドの失敗と入力の複製の失敗は守備範囲に含め、検証 OK も違反も返さず終了コード 6(runner は exitcode.txt=6)。
     stdout は出さない。他の error / warn 行も出さない。validate-config.sh の終了コード 6 の条件に加える(runner --help 問い合わせの準備失敗と並記)。
  6. 実装済みの判断(単一スナップショットの置き場所・権限・削除時期、補助コマンド失敗の終了コード 6)はそのまま仕様として確定し、実装の変更を要求しない。
     文言の変更(原因ごとの専用文言)は spec-decision-012 で定める。
  7. USDM / RDRA / 方針資料は変更しない。SPEC-004-04 が定める CSV 形式(ヘッダー、列名、fixed_params の引用規則)は文脈参照のまま。
consequences:
  positive:
    - "異常な入力・異常な環境の扱いが 1 か所に決まり、実装と独立検証が異常系を 1 つずつ見つけ続ける状態が終わる(完了と判定できる)"
    - "設定ファイルを読む 12 UC が同じ守備範囲を参照し、機能ごとに再決定しない"
    - "方針資料の CSV 例(非 ASCII の値、空白とカンマを含む固定引数)は形式の内側にあり、検証 OK のまま"
    - "現行実装の単一スナップショット・終了コード 6 の判断は変更不要"
  negative:
    - "BOM 付き・CRLF のファイル(Windows のエディタで保存したもの)は拒否される。利用者は LF・BOM なしで保存する必要がある(hint 行で対処を示す)"
    - "検証コマンドは TMPDIR に書き込める環境を要求する(書き込めなければ正しい設定でも終了コード 6)。複製には credential_ref の参照名が入る(値は入らない)"
    - "現行実装との差 5 点(コメント行の NUL の拒否、BOM の専用文言、CR の拒否、ヘッダー列名の重複の拒否、複製失敗の専用文言)は実装の修正が必要"
alternatives_considered:
  - name: "よくある差(BOM・CRLF)は取り除いて受理し warn を出す"
    reason_rejected: "検証コマンドと実行時の読み手(runner)で同じ吸収処理を二重に保つ必要があり、片方だけ吸収すると検証 OK のファイルが実行時に失敗する。利用者の方針「仕様に無い壊れた入力は拒否する」とも合わない"
  - name: "NUL と不正な文字コードだけ拒否し、BOM・CRLF・列名の重複は対象外と明記する"
    reason_rejected: "CRLF の値が map_version などの末尾列に黙って入り(実測: `v1<CR>` を受理して終了コード 0)、実行時に別の値として扱われる穴が残る"
  - name: "検証中の差し替えを検知して warn を出す(複製の前後でファイルの同一性を比べる)"
    reason_rejected: "比較と複製の間に新しい競合の窓ができ、検知できないケースが残る。単一スナップショットだけで『混ぜた結果を返さない』保証は満たせる"
  - name: "複製の置き場所を TMPDIR ではなく設定ディレクトリ配下の専用ディレクトリにする"
    reason_rejected: "設定ディレクトリは読み取り専用の運用が想定され、検証コマンドに書き込み権限を要求することになる。0600 の権限で参照名の保護は足りる"
