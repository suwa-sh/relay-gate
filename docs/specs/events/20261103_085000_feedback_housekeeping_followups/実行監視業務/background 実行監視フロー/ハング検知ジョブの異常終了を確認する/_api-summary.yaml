uc: "ハング検知ジョブの異常終了を確認する"
business: "実行監視業務"
buc: "background 実行監視フロー"
paths: []
x_cli_commands:
  - name: "hang-detector.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "hang-detector.sh [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(ハング検知定期ジョブ)。運用者は実行履歴で結果を読む"
    args: []
    options: []
    stdin: "なし"
    stdout: "出力しない(契約は UC「background 実行の経過時間と終了状態を判定する」)"
    stderr: "alert: level=<warning|error> kind=<hang-suspected|background-exec-error|rapid-crosscheck-error> run_id=<run_id> role=<blue|green|rapid-crosscheck> job_id=<job_id> elapsed_minutes=<n>(1 件 1 行)と error: 行。運用者は alert 行の run_id と role を対処コマンドの引数に使う"
    exit_codes:
      - code: 0
        meaning: "新たな異常なし(障害通知なし)"
      - code: 3
        meaning: "警告終了。ハング疑い(warning)だけ。静観候補"
      - code: 6
        meaning: "失敗。background 実行エラー・速報クロスチェック異常(error)、またはハング検知ジョブ自身の実行エラー"
      - code: 2
        meaning: "失敗。設定・入力エラーで走査していない"
  - name: "abort-blue.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "abort-blue.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(hang-suspected の alert 行への対処)"
    args: []
    options: []
    stdin: "停止確認応答(yes / no)"
    stdout: "現在状態と更新後状態(契約は実行中止フローの UC)"
    stderr: "停止確認プロンプト"
    exit_codes: []
  - name: "abort-green.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "abort-green.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(hang-suspected の alert 行への対処)"
    args: []
    options: []
    stdin: "停止確認応答(yes / no)"
    stdout: "現在状態と更新後状態(契約は実行中止フローの UC)"
    stderr: "停止確認プロンプト"
    exit_codes: []
  - name: "abort-rapid-crosscheck.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "abort-rapid-crosscheck.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(role=rapid-crosscheck の hang-suspected の alert 行への対処)"
    args: []
    options: []
    stdin: "停止確認応答(yes / no)"
    stdout: "現在状態と更新後状態(契約は実行中止フローの UC)"
    stderr: "停止確認プロンプト"
    exit_codes: []
  - name: "background-rerun.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "background-rerun.sh --source-run-id <RUN_ID> --role blue|green|rapid-crosscheck [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(background リラン専用ジョブ。background-exec-error の alert 行への対処)"
    args: []
    options: []
    stdin: "なし"
    stdout: "run_id / parent_run_id(契約は background 側リランフローの UC)"
    stderr: "事前検証 NG の理由"
    exit_codes: []
  - name: "rapid-crosscheck-result.sh"
    tier: "tier-rapid-crosscheck"
    role: "uses"
    synopsis: "rapid-crosscheck-result.sh --run-id <run_id> [--show-output] [--verbose] [--help]"
    invoked_by: "運用者(rapid-crosscheck-error の alert 行への対処)"
    args: []
    options: []
    stdin: "なし"
    stdout: "依頼レコードの固定行(status / exit_code 等)と --show-output 時の比較ツール stdout / stderr(契約は UC「速報比較結果を参照する」)"
    stderr: "info: rapid result is for investigation only"
    exit_codes: []
async_events: []
schemas: []
