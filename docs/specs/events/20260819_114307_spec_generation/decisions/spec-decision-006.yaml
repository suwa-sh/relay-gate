  work_unit_ids: ["CR-6078c4ed-008#1","CR-6078c4ed-009#1","CR-6078c4ed-010#1"]
context: |
  CLI コマンド契約の `relaygate concurrent-run respond-foreground` は、終了コードを
  「exit_code=0 → 0、非 0 → 一律 1、未確定 / UNKNOWN / ABORTED → 1、run_id 未指定 → 2」へ写像していた。
  一方で USDM SPEC-002-01 と UC spec の図は「プロセス終了コード = exitcode.txt 値」と透過を記述しており、
  契約と仕様が矛盾していた。

  写像のままでは、業務ジョブの終了コードの具体値（例: 3）が 1 に潰れ、ジョブスケジューラ側の終了コード分岐が
  既存ジョブ直接実行時と互換にならない。またこの場合、業務ジョブの失敗（非 0）と relay-gate 自身のエラー
  （実行結果未確定等）が同じ終了コード 1 になり、ストラングラーファサードとしてスケジューラから見た挙動を
  既存ジョブと揃えられない。

  CLI 契約の全体規約は 0=正常 / 1=業務エラー / 2=バリデーションエラー / 124=タイムアウト / 130=SIGINT であり、
  透過契約とは値の意味が衝突する。
decision: |
  `relaygate concurrent-run respond-foreground` の終了コードを透過契約へ改める。

  1. 実行状態が SUCCEEDED / FAILED のとき、foreground の exitcode.txt の値を 0 を含む全値そのまま
     プロセス終了コードとして返す。丸め・再割り当てをしない。
  2. relay-gate 自身のエラーだけを、業務ジョブが通常使用しない退避終了コードへ分離する。
     実行結果未確定（STARTING / RUNNING）・取得不能（UNKNOWN）・中止済み（ABORTED）は 125、
     relay-gate のバリデーションエラーは 124 とする。UNKNOWN を推測で FAILED 相当の業務終了コードへ変換しない。
  3. bash が自動生成する 126（実行不可）・127（コマンド未検出）は退避コードに使わない。
  4. relay-gate エラーで応答する場合の標準エラーは、取得可能な場合の foreground stderr.log の内容と
     relay-gate 自身のエラー内容（原因と次アクション）を併記する。

  CLI 契約全体の終了コード規約（0/1/2/124/130）は運用者向けコマンドに対して維持し、本コマンドだけを
  `exit_code_convention_exception` として明示的に除外する。この文脈での 124 はタイムアウトではなく
  relay-gate のバリデーションエラーを意味することを契約に明記する。
consequences:
  positive:
    - "ジョブスケジューラから見た終了コード分岐が、既存ジョブを直接実行した場合と互換になる"
    - "業務ジョブの失敗と relay-gate 自身の異常を終了コードの値域で区別できる"
    - "UNKNOWN の推測確定を禁じる実行状態方針（arch AG-002 / SR-006）と整合する"
    - "relay-gate エラー時も foreground の stderr が失われず、障害調査の初動情報が欠けない"
  negative:
    - "同一 CLI 内で 2 種類の終了コード規約が併存し、実装・テストで取り違えるリスクがある"
    - "124 の意味がコマンドによって異なる（運用者向け = タイムアウト、respond-foreground = バリデーションエラー）"
    - "業務ジョブが 124 / 125 を使う場合に値が衝突しうる（業務ジョブ側で使用しない前提を運用で担保する必要がある）"
alternatives_considered:
  - name: "従来どおり 0/1/2 へ写像する"
    reason_rejected: "業務ジョブの終了コード具体値が 1 に潰れ、既存ジョブ直接実行時との互換性を失う。USDM SPEC-002-01 の acceptance criterion（非 0 の値が一律の値へ丸められない）を満たせない"
  - name: "退避コードに 126 / 127 を使う"
    reason_rejected: "bash が実行不可・コマンド未検出で自動生成する値であり、relay-gate 起因かシェル起因かを区別できなくなる"
  - name: "終了コードを常に透過し、relay-gate のエラーも業務ジョブと同じ値域で返す"
    reason_rejected: "relay-gate 自身の異常と業務ジョブの失敗が同値になり、ジョブスケジューラ側で切り分けられない。SR-006 の分離要求を満たせない"
  - name: "CLI 契約全体の終了コード規約を透過契約へ統一する"
    reason_rejected: "運用者向けコマンド（result / abort / rerun 等）はジョブスケジューラが終了コードを解釈する対象ではなく、0/1/2 の運用規約のほうが利用者にとって明快である。全体統一は不要な破壊的変更になる"
