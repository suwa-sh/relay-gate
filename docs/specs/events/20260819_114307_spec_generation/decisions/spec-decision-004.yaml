schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-004"
title: "横断関心事の解決方針: 終了コード規約によるエラーハンドリング、監査ログのスコープ限定、対話確認の二段階パターン統一"
status: "approved"
generated_at: "2026-08-17T15:58:17+09:00"
context: |
  23UCのSpec生成・レビューを通じて、以下3つの横断関心事について繰り返し判断が必要になった:
  (1) エラーハンドリング戦略。arch-design.yaml CLP-002は「domain例外はusecaseで集約キャッチし1回だけログ出力、
  presentationでCLI終了コードに変換」と定めるが、具体的な終了コードの割当は未定義だった。
  (2) 監査ログの適用範囲。CTP-005は「対話確認を経た中止操作（ABORTEDへの遷移）・リラン操作」を対象と明記するが、
  Step3の初回生成では中止「依頼」ステップ（状態遷移を伴わない）にも監査ログを実装するUCが4件あり、
  Step3-Reviewでスコープ超過として指摘・修正した（A-002, C-002）。
  (3) 中止操作のUXパターン。blue中止/green中止/速報比較中止/確報比較中止の4フローが、
  いずれも「依頼→対話確認」の二段階UCで構成されていることがcommon-components.md生成時に判明した。
decision: |
  (1) 終了コード規約を契約として確定する: 0=正常, 1=業務エラー, 2=バリデーションエラー, 124=タイムアウト,
  130=SIGINT中断（対話確認プロンプトでの中断等）。`_cross-cutting/api/cli-command-contract.yaml` の
  `exit_code_convention` に記録し、全26コマンドで統一適用する。
  (2) 監査ログ（audit_logsテーブルへのINSERT）は「対話確認のうえABORTEDへ遷移させる」「execution-spec.jsonの
  実行設定を保ったまま再実行する」の状態遷移を伴うUCのみに限定する。状態遷移を伴わない「依頼する」UCには
  実装しない（CTP-005の文言どおりのスコープを厳格適用する）。
  (3) 中止操作は「依頼画面（対象・現在状態の確認）→対話確認画面（AbortConfirmDialog、y/nの二択、取消不可の明示）」
  の二段階パターンを4フロー共通の設計として common-components.md に集約し、直接遷移（対話確認のスキップ）を
  禁止する制約を全UCのtier-*.mdに反映した（Step4e）。
consequences:
  positive:
    - "終了コードの意味がジョブスケジューラ運用者・実装者間で一意に定まり、監視・アラート設定の基準にできる"
    - "監査ログの対象を状態遷移操作のみに限定することで、audit_logsテーブルの書き込み量を必要最小限に抑え、CTP-005の趣旨（操作記録としての完全性）を過不足なく満たす"
    - "二段階中止確認パターンの統一により、4フロー間でUXの一貫性が保たれ、誤操作防止の効果が均等に及ぶ"
  negative:
    - "終了コード124（タイムアウト）・130（SIGINT中断）は今回のUC Specでは概念定義のみで、実際のタイムアウト検知ロジック（何秒でタイムアウトと判定するか）は個別UCでは未確定。実装フェーズでの具体化が必要"
    - "監査ログ対象を限定した結果、中止「依頼」の操作履歴（誰がいつ依頼を出したか）はRDB上に残らない。将来的に依頼段階の操作履歴が必要になった場合はCTP-005のスコープ再定義（RDRA feedback経由）が必要"
alternatives_considered:
  - name: "全CLIコマンド実行を無条件にaudit_logsへ記録する"
    reason_rejected: "CTP-005の明文規定（対話確認を経たABORTED遷移・リラン操作に限定）を超える実装になり、Step3-Reviewで実際に指摘・差し戻しが発生した設計"
  - name: "終了コードをUC・コマンドごとに個別定義する（統一規約を設けない）"
    reason_rejected: "26コマンド間で終了コードの意味が食い違うと、ジョブスケジューラ側の異常検知ロジックが複雑化し、CTP-009の運用効率目標に反する"
