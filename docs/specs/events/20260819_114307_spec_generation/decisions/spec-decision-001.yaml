schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-001"
title: "API契約表現方式: CLIコマンド契約を正本としopenapi.yaml/asyncapi.yamlを生成しない"
status: "approved"
generated_at: "2026-08-17T15:58:17+09:00"
context: |
  RelayGate はエアーギャップ環境のオンプレミスLinuxサーバで稼働するCLI/バッチ運用基盤であり、Web UI・HTTP APIを持たない。
  インターフェースはCLI引数・環境変数・ファイル成果物（started-at.txt/stdout.log/stderr.log/exitcode.txt/execution-spec.json）・
  RDB（ジョブキュー兼管理DB）である。dist-specスキルの標準出力は`_cross-cutting/api/openapi.yaml`（OpenAPI 3.1）だが、
  本システムには表現すべきHTTPエンドポイントが実在しない。23UC全てについてtier-facade.md/tier-worker.mdのCLIコマンド仕様/
  イベント処理仕様として個別に記述したが、Contract First開発のための統合契約が別途必要である。
decision: |
  `_cross-cutting/api/openapi.yaml` は生成せず、代わりに独自スキーマの `_cross-cutting/api/cli-command-contract.yaml`
  （26コマンド、23UC分を集約）を正本のAPI契約として生成する。コマンド名・引数・環境変数・標準入力/出力/エラー契約・
  終了コード規約（0=正常, 1=業務エラー, 2=バリデーションエラー, 124=タイムアウト, 130=SIGINT中断）を機械可読な形で定義する。
  非同期メッセージング技術（Kafka/SQS等）も存在しないため `_cross-cutting/api/asyncapi.yaml` も生成しない。
  Step6のOpenAPI/AsyncAPIリント（redocly/asyncapi cli）は対象ファイルが存在しないため適用対象外として扱う。
  なお、dist-specスキルの構造バリデータ（validateSpecEvent.js）が `_cross-cutting/api/openapi.yaml` の存在を
  機械的に必須としているため、実装対象のpathsを持たない互換スタブ（`paths: {}`、infoにcli-command-contract.yamlへの
  誘導説明を記載）を1点のみ生成し、構造バリデーションを通過させる。このスタブはAPI契約として参照してはならない。
consequences:
  positive:
    - "プロジェクト背景（HTTP API不在）と仕様書の内容が完全に一致し、実装時の誤解を防ぐ"
    - "終了コード規約を契約として明文化することで、ジョブスケジューラとの応答契約（stdout/stderr/exitcodeのみ）の一貫性を保証できる"
    - "CLIコマンド階層とdesign-event.yamlのroute構造を1:1対応させたことで、将来ダッシュボード化した際もURLとコマンドの対応が明確"
  negative:
    - "redocly/asyncapi等の既存OpenAPIツールチェーンによる自動検証が使えず、cli-command-contract.yaml独自の検証は今回スクリプト化していない（将来的にJSON Schemaでの検証整備が望ましい）"
    - "dist-specスキルの標準パイプライン（Step6b/6c）から外れるため、後続スキル（distillery-impl等）がopenapi.yaml前提で動作する場合は追加対応が必要"
alternatives_considered:
  - name: "従来通りHTTP OpenAPI 3.1で仮想的なREST APIとして表現する"
    reason_rejected: "実在しないHTTPエンドポイントを記述することになり、実装者に誤った実装（HTTPサーバの実装等）を促すリスクがある"
  - name: "OpenAPI構文（path/operationId）を流用しCLIコマンドを表現するハイブリッド"
    reason_rejected: "redocly lint等ツールチェーン互換性は保てるが、pathフィールドにCLIコマンドを詰め込むことで読み手に「HTTP APIである」という誤解を与える"
