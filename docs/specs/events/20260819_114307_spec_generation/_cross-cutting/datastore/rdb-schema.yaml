    columns:
      - name: "detection_id"
        type: "uuid"
        nullable: false
        description: "ハング検知記録を一意に識別するUUID"
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "検知対象のrun_id。execution_specs.run_idを参照する"
      - name: "detection_type"
        type: "string"
        nullable: false
        description: "異常検知種別。値: ハング疑い, background実行エラー, 速報クロスチェック異常"
      - name: "detected_at"
        type: "datetime"
        nullable: false
        description: "検知処理実行時刻"
      - name: "threshold_minutes"
        type: "integer"
        nullable: true
        description: "ハング疑い検知時のみ設定されるしきい値（execution_specs.hang_detect_limit_minutesの値）"
      - name: "slot_type"
        type: "string"
        nullable: true
        description: "検知対象のslot種別。値: blue, green"
      - name: "attempt_id"
        type: "string"
        nullable: true
        description: "検知対象の起動試行のattempt_id。runner_resultsの起動試行identityと対応付けるために保持する。速報クロスチェック異常など起動試行に紐づかない検知ではNULL"
      - name: "notify_target"
        type: "string"
        nullable: false
        description: "通知先。固定値「運用者」"
      - name: "resolved_at"
        type: "datetime"
        nullable: true
