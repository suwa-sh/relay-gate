version: "1.0"
datastore: "rdb"

tables:
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    description: "run共通のexecution spec（アーキテクチャE-001）。run_id・parent_run_id・job_id・追加引数・ジョブマップ版・hang_detect_limit_minutesなど、slotに依存しないrun単位の実行設定を起動時に一度だけ確定して保存する。slotごとに異なるhost/exec_user/script_path/work_dir/固定引数/実装版/認証情報参照名はslot_execution_specsへ分離する。再実行は新しいrun_idの新規runとして作成し、parent_run_idで元runへ関連付ける（元runのレコード・履歴は変更しない）"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "実行を一意に識別するUUID。起動時に新規発番される。slot_execution_specs・runner_results・runner_result_events・rapid_crosscheck_requests・final_crosscheck_requests・hang_detections・audit_logsから参照される"
      - name: "parent_run_id"
        type: "uuid"
        nullable: true
        description: "リラン元となった元のrun_id。リラン実行でない通常起動の場合はNULL。CTP-004実行系譜トレーサビリティで最新run_idから元runまで数珠つなぎに追跡する（自己参照）"
      - name: "job_id"
        type: "string"
        nullable: false
        description: "ジョブマップ上のジョブ識別子（CLI引数 --job-id の値）。同一job_idに紐づくblue/greenの実行結果を相関取得するために用いる"
      - name: "additional_args"
        type: "text"
        nullable: true
        description: "ジョブスケジューラから渡されたrun共通の追加引数。slot固有の固定引数はslot_execution_specs.fixed_argsに保持する"
      - name: "job_map_version"
        type: "string"
        nullable: false
        description: "実行先解決に使用したジョブマップのバージョン"
      - name: "hang_detect_limit_minutes"
        type: "integer"
        nullable: false
        description: "ハング疑い判定のしきい値（分）。hang_detections.threshold_minutesに引き継がれる"
    primary_key: ["run_id"]
    foreign_keys:
      - columns: ["parent_run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "SET NULL"
    indexes:
      - name: "idx_execution_specs_parent_run_id"
        columns: ["parent_run_id"]
        unique: false
        reason: "CTP-004実行系譜トレーサビリティ。親run_idからの子run_id一覧参照を高速化する"
        used_by: ["execution-spec.jsonの実行設定を保ったまま再実行する"]
      - name: "idx_execution_specs_job_id"
        columns: ["job_id"]
        unique: false
        reason: "同一job_idに紐づくblue/green双方の実行結果・依頼を相関取得するため"
        used_by:
          - "feature flag設定に基づきslotを選択して起動する"
          - "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
          - "並行稼働実行結果を確認する"
    used_by:
      - uc: "feature flag設定に基づきslotを選択して起動する"
        operations: ["INSERT"]
      - uc: "background roleを起動する"
        operations: ["SELECT"]
      - uc: "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
        operations: ["SELECT"]
      - uc: "全テーブル・全ファイルを対象に確報クロスチェックを実行する"
        operations: ["SELECT"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["SELECT", "INSERT"]
    _review_notes: "ユニーク制約: run_idはUUID発番により一意性が保証されるため自然キーの追加ユニーク制約は不要。CR-6078c4ed-005によりslot別実行設定をslot_execution_specsへ分離した（blue/greenでhost・impl_versionが異なる並行稼働を単一値前提のexecution specで表現できない問題の解消）"

  - name: "slot_execution_specs"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
    description: "slotごとに解決したexecution spec（アーキテクチャE-007）。同一runでもblue/greenでhost・exec_user・script_path・work_dir・固定引数・実装版・認証情報参照名が異なりうるため、run共通のexecution_specsから分離して保持する。slot別実行設定はrun起動時にslotごとに一度だけ確定し、以後変更しない（AG-001）。認証情報は参照名のみを保存し実値は保存しない"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "対応するrun共通実行設定のrun_id。execution_specs.run_idを参照する複合主キーの一部"
      - name: "slot_type"
        type: "string"
        nullable: false
        description: "slot種別。値: blue, green。複合主キーの一部"
      - name: "host"
        type: "string"
        nullable: false
        description: "起動時に解決済みの実行ホスト。ジョブマップ解決結果（slotごとに異なりうる）"
      - name: "exec_user"
        type: "string"
        nullable: false
        description: "起動時に解決済みの実行ユーザー。ジョブマップ解決結果（slotごとに異なりうる）"
      - name: "script_path"
        type: "string"
        nullable: false
        description: "起動時に解決済みの実行スクリプトパス。ジョブマップ解決結果（slotごとに異なりうる）"
      - name: "work_dir"
        type: "string"
        nullable: false
        description: "起動時に解決済みの作業ディレクトリ。ジョブマップ解決結果（slotごとに異なりうる）"
      - name: "fixed_args"
        type: "text"
        nullable: true
        description: "ジョブマップに固定された起動引数。ジョブスケジューラからの追加引数（execution_specs.additional_args）はこの後ろに順序を変えず連結する"
      - name: "impl_version"
        type: "string"
        nullable: false
        description: "当該slotの起動対象実装バージョン（slotごとに異なりうる）"
      - name: "credential_ref"
        type: "string"
        nullable: true
        description: "認証情報の参照名のみを保存する（実値は保存しない）"
    primary_key: ["run_id", "slot_type"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "CASCADE"
    indexes:
      - name: "idx_slot_execution_specs_slot_type"
        columns: ["slot_type"]
        unique: false
        reason: "slot種別単位でのリラン候補絞り込み・並行稼働結果参照を高速化するため"
        used_by:
          - "再実行対象のbackground実行・速報比較依頼を選択する"
          - "並行稼働実行結果を確認する"
    used_by:
      - uc: "feature flag設定に基づきslotを選択して起動する"
        operations: ["INSERT"]
      - uc: "background roleを起動する"
        operations: ["SELECT"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["SELECT", "INSERT"]
      - uc: "並行稼働実行結果を確認する"
        operations: ["SELECT"]
      - uc: "再実行対象のbackground実行・速報比較依頼を選択する"
        operations: ["SELECT"]
    _review_notes: "ユニーク制約: 主キー(run_id, slot_type)により同一runに対する同一slotの実行設定重複を防止する。リランでは新run_idの行を新規INSERTし、元runのslot_execution_specsは更新しない"

  - name: "runner_result_events"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    description: "Runner実行結果の状態遷移をappend-onlyで記録する履歴テーブル（アーキテクチャLR-002 Event/Snapshot併用パターンのEvent側）。起動試行の各状態遷移をINSERTし、同一transaction内でrunner_resultsのsnapshotをUPSERTする。UPDATE/DELETEは行わず、訂正も新しいイベントとして追記する"
    columns:
      - name: "event_id"
        type: "uuid"
        nullable: false
        description: "履歴イベントを一意に識別するUUID"
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "対象実行のrun_id。execution_specs.run_idに対応する"
      - name: "slot_type"
        type: "string"
        nullable: false
        description: "slot種別。値: blue, green"
      - name: "role_type"
        type: "string"
        nullable: false
        description: "実行役割区分。値: foreground, background, rapid-crosscheck"
      - name: "attempt_id"
        type: "string"
        nullable: false
        description: "起動試行の一意識別子。同一runで同一slot・roleを複数回起動しても試行を識別できる"
      - name: "attempt_no"
        type: "integer"
        nullable: false
        description: "同一（run_id, slot_type, role_type）内の起動試行連番。1から始まる"
      - name: "event_name"
        type: "string"
        nullable: false
        description: "遷移イベント名。値: attempt_started, attempt_running, attempt_succeeded, attempt_failed, attempt_unknown, attempt_aborted。(run_id, slot_type, role_type, attempt_id, event_name)の一意制約により再試行を冪等化する"
      - name: "status"
        type: "string"
        nullable: false
        description: "遷移後の実行状態。値: STARTING, RUNNING, SUCCEEDED, FAILED, UNKNOWN, ABORTED"
      - name: "occurred_at"
        type: "datetime"
        nullable: false
        description: "イベント発生時刻。履歴の時系列順序の基準とする"
      - name: "started_at"
        type: "datetime"
        nullable: true
        description: "実行開始時刻（started-at.txt由来）。プロセス起動確認前はNULL"
      - name: "stdout_path"
        type: "string"
        nullable: true
        description: "標準出力ログ（stdout.log）のパス参照。ログ本体はファイルシステム上に保持し本カラムはパスのみを保存する"
      - name: "stderr_path"
        type: "string"
        nullable: true
        description: "標準エラーログ（stderr.log）のパス参照。ログ本体はファイルシステム上に保持し本カラムはパスのみを保存する"
      - name: "exit_code"
        type: "integer"
        nullable: true
        description: "プロセス終了コード（exitcode.txtの内容）。exitcode.txt出力前およびUNKNOWN時はNULL"
    primary_key: ["event_id"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "CASCADE"
    indexes:
      - name: "uq_runner_result_events_attempt_event_name"
        columns: ["run_id", "slot_type", "role_type", "attempt_id", "event_name"]
        unique: true
        reason: "ユニーク制約: 同一起動試行に対する同一遷移イベントの重複追記を防止し、クラッシュ後の再試行を冪等化する（CTP-006冪等性方針）"
        used_by:
          - "background roleを起動する"
          - "execution-spec.jsonの実行設定を保ったまま再実行する"
      - name: "idx_runner_result_events_run_id_occurred_at"
        columns: ["run_id", "occurred_at"]
        unique: false
        reason: "run_id単位で起動試行の経過を時系列に追跡するため（障害調査・実行系譜照会）"
        used_by:
          - "並行稼働実行結果を確認する"
          - "background実行の未完了・非0終了・速報比較異常を定期検知する"
    used_by:
      - uc: "feature flag設定に基づきslotを選択して起動する"
        operations: ["INSERT"]
      - uc: "background roleを起動する"
        operations: ["INSERT"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["INSERT"]
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["SELECT", "INSERT"]
      - uc: "対話確認のうえblue background実行をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "対話確認のうえgreen background実行をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "並行稼働実行結果を確認する"
        operations: ["SELECT"]
    _review_notes: "CR-6078c4ed-006: データストア設計判断をsnapshot-onlyから履歴INSERT+snapshot UPSERTの併用へ更新した。履歴INSERTとsnapshot UPSERTは必ず同一transactionで実行する（アーキテクチャLR-002、infra validation_rules）"

  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    description: "Runner実行結果の現在状態を保持するsnapshotテーブル（アーキテクチャLR-002 Event/Snapshot併用パターンのSnapshot側）。起動試行は（run_id, slot_type, role_type, attempt_id）で一意に識別する。runner_result_eventsへの履歴INSERTと同一transactionでUPSERTし、履歴と現在状態の乖離を防ぐ"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "対象実行のrun_id。execution_specs.run_idを参照する複合主キーの一部"
      - name: "slot_type"
        type: "string"
        nullable: false
        description: "実行slot種別。値: blue, green。複合主キーの一部。同一runでblueとgreenを同時起動しても試行を識別できるようにする"
      - name: "role_type"
        type: "string"
        nullable: false
        description: "実行役割区分。値: foreground, background, rapid-crosscheck。複合主キーの一部"
      - name: "attempt_id"
        type: "string"
        nullable: false
        description: "起動試行の一意識別子。複合主キーの一部。同一（run_id, slot_type, role_type）を複数回起動しても試行を識別できる"
      - name: "attempt_no"
        type: "integer"
        nullable: false
        description: "同一（run_id, slot_type, role_type）内の起動試行連番。1から始まる"
      - name: "accepted_at"
        type: "datetime"
        nullable: false
        description: "起動受付時刻（STARTING遷移時点のイベント発生時刻）。プロセス起動前でも必ず記録する"
      - name: "started_at"
        type: "datetime"
        nullable: true
        description: "実行開始時刻（started-at.txt由来）。プロセス起動確認前（STARTING）はNULL"
      - name: "stdout_path"
        type: "string"
        nullable: true
        description: "標準出力ログ（stdout.log）のパス参照。ログ本体はファイルシステム上に保持し、本カラムはパスのみを保存する"
      - name: "stderr_path"
        type: "string"
        nullable: true
        description: "標準エラーログ（stderr.log）のパス参照。ログ本体はファイルシステム上に保持し、本カラムはパスのみを保存する"
      - name: "exit_code"
        type: "integer"
        nullable: true
        description: "プロセス終了コード（exitcode.txtの内容）。未完了（STARTING/RUNNING）および結果取得不能（UNKNOWN）時はNULL"
      - name: "status"
        type: "string"
        nullable: false
        description: "実行状態。値: STARTING, RUNNING, SUCCEEDED, FAILED, UNKNOWN, ABORTED。exitcode.txtの有無と終了コードの値からSUCCEEDED/FAILEDを判定する。timeoutや結果取得不能時はUNKNOWNとし推測でFAILEDを確定しない。ABORTEDへの遷移は対話確認による明示的操作でのみ発生する"
      - name: "updated_at"
        type: "datetime"
        nullable: false
        description: "snapshot最終更新時刻。対応するrunner_result_events.occurred_atと一致させる"
    primary_key: ["run_id", "slot_type", "role_type", "attempt_id"]
    foreign_keys:
      - columns: ["run_id", "slot_type"]
        references:
          table: "slot_execution_specs"
          columns: ["run_id", "slot_type"]
        on_delete: "CASCADE"
    indexes:
      - name: "uq_runner_results_attempt_no"
        columns: ["run_id", "slot_type", "role_type", "attempt_no"]
        unique: true
        reason: "ユニーク制約: 同一（run_id, slot_type, role_type）内でattempt_noが重複しないことを保証し、起動試行連番の一意性を担保する"
        used_by:
          - "background roleを起動する"
          - "execution-spec.jsonの実行設定を保ったまま再実行する"
      - name: "idx_runner_results_role_type_status"
        columns: ["role_type", "status"]
        unique: false
        reason: "hang-detectorがSTARTING/RUNNING状態かつrole_type='background'のレコードを高頻度でポーリングするため、また速報比較依頼作成・リラン候補選定でも同条件検索を行うため"
        used_by:
          - "background実行の未完了・非0終了・速報比較異常を定期検知する"
          - "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
          - "再実行対象のbackground実行・速報比較依頼を選択する"
      - name: "idx_runner_results_slot_type_status"
        columns: ["slot_type", "status"]
        unique: false
        reason: "--slotフィルタによるblue/green絞り込みと状態絞り込みを高速化するため"
        used_by:
          - "再実行対象のbackground実行・速報比較依頼を選択する"
          - "blue background実行の中止を依頼する"
          - "green background実行の中止を依頼する"
    used_by:
      - uc: "feature flag設定に基づきslotを選択して起動する"
        operations: ["INSERT"]
      - uc: "background roleを起動する"
        operations: ["INSERT", "UPDATE"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["INSERT"]
      - uc: "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
        operations: ["SELECT"]
      - uc: "速報クロスチェックを実行し差分を検知する"
        operations: ["SELECT"]
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["SELECT", "UPDATE"]
      - uc: "再実行対象のbackground実行・速報比較依頼を選択する"
        operations: ["SELECT"]
      - uc: "blue background実行の中止を依頼する"
        operations: ["SELECT"]
      - uc: "対話確認のうえblue background実行をABORTEDへ遷移させる"
        operations: ["SELECT", "UPDATE"]
      - uc: "green background実行の中止を依頼する"
        operations: ["SELECT"]
      - uc: "対話確認のうえgreen background実行をABORTEDへ遷移させる"
        operations: ["SELECT", "UPDATE"]
      - uc: "foreground roleの標準出力・標準エラー・終了コードを応答する"
        operations: ["SELECT"]
      - uc: "並行稼働実行結果を確認する"
        operations: ["SELECT"]
    _review_notes: "CR-6078c4ed-005: 主キーを(run_id, role_type)から(run_id, slot_type, role_type, attempt_id)へ変更し、attempt_no・accepted_atを追加、statusをSTARTING/UNKNOWNを含む6値へ拡張した。同一runでblueとgreenを同時起動した場合に同一roleの起動試行を別試行として識別できないという欠落を解消する"

  - name: "comparison_definitions"
    rdra_info: "比較定義"
    description: "job_idごとの比較対象（テーブル・ファイル）と比較実装を保持し、速報クロスチェック・確報クロスチェックの実行時に適用する比較定義を解決するためのテーブル。同一job_idに複数世代の定義を持てるようSCD2型で有効期間（valid_from/valid_to）を保持し、実行時点に該当する世代を1件だけ適用する。世代は追記のみで管理し、既存世代のtarget_tables/target_files/comparator_idは更新しない"
    columns:
      - name: "job_id"
        type: "string"
        nullable: false
        description: "比較定義が適用される対象ジョブのJOB_ID（execution_specs.job_idに対応）。複合主キーの第1要素"
      - name: "valid_from"
        type: "datetime"
        nullable: false
        description: "この世代の有効期間の開始日時（この値を含む）。複合主キーの第2要素であり、同一job_idの世代を一意に識別する"
      - name: "valid_to"
        type: "datetime"
        nullable: true
        description: "この世代の有効期間の終了日時（この値を含まない）。現行世代はNULL。世代交代時に旧世代へ設定する"
      - name: "target_tables"
        type: "text"
        nullable: false
        description: "この世代の比較対象テーブル一覧。確報クロスチェックの全テーブル比較および速報クロスチェックの比較範囲を決定する"
      - name: "target_files"
        type: "text"
        nullable: false
        description: "この世代の比較対象ファイル一覧。確報クロスチェックの全ファイル比較および速報クロスチェックの比較範囲を決定する"
      - name: "comparator_id"
        type: "string"
        nullable: false
        description: "この世代で使用する比較実装の識別子。job_idごとに異なる比較ツール・比較ロジックへ差し替えるために用いる（SPEC-012-03）"
      - name: "registered_at"
        type: "datetime"
        nullable: false
        description: "この世代を登録した日時。世代の追記順を追跡するために保持する"
    primary_key: ["job_id", "valid_from"]
    indexes:
      - name: "uq_comparison_definitions_job_id_current"
        columns: ["job_id"]
        unique: true
        reason: "ユニーク制約（部分一意索引: valid_to IS NULL の行のみ対象）: 同一job_idの現行世代を1件に限定し、実行時点の比較定義解決が2件以上に一致しないことを保証する"
        used_by:
          - "速報クロスチェックを実行し差分を検知する"
          - "全テーブル・全ファイルを対象に確報クロスチェックを実行する"
      - name: "ex_comparison_definitions_job_id_period"
        columns: ["job_id", "valid_from", "valid_to"]
        unique: false
        reason: "排他制約: 同一job_id内で有効期間［valid_from, valid_to）が重複する世代の登録を禁止する。実行時点に該当する世代が常に1件以下であることをDB側で保証する"
        used_by:
          - "速報クロスチェックを実行し差分を検知する"
          - "全テーブル・全ファイルを対象に確報クロスチェックを実行する"
    used_by:
      - uc: "速報クロスチェックを実行し差分を検知する"
        operations: ["SELECT"]
      - uc: "全テーブル・全ファイルを対象に確報クロスチェックを実行する"
        operations: ["SELECT"]
    _review_notes: "CR-6078c4ed-009: RDRA情報モデルへ追加された「比較定義」（job_id / 比較対象テーブル / 比較対象ファイル / 比較実装識別子 / 有効期間）に対応するテーブル。infra product-impl-onpremのcomparison_definition_versioning（(job_id, valid_from)複合主キー、現行世代の部分一意索引、有効期間の排他制約、世代追記のみ）と一致させた"

  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    description: "blueとgreenの完了通知を受けて作成する、ジョブ単位で非同期に行う速報クロスチェックの比較実行依頼。run_idで相関付けて実行状態を一意に管理する。CLAIMED状態でlease失効かつ未着手の場合はREQUESTEDへ戻す。再実行では同一run_idを差し戻さず、新しいrun_idの依頼を新規作成しparent_run_idで元依頼へ関連付ける（元依頼のレコード・状態・履歴は変更しない）"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "速報比較依頼を一意に識別するUUID。rapid_crosscheck_resultsから1:1で参照される"
      - name: "parent_run_id"
        type: "uuid"
        nullable: true
        description: "再実行で新規作成した依頼のリラン元依頼のrun_id。通常作成時はNULL。最新run_idからparent_run_idをたどって元依頼まで追跡する（SPEC-008-03, SPEC-010-03）"
      - name: "job_id"
        type: "string"
        nullable: false
        description: "対象ジョブのjob_id（execution_specs.job_idに対応）。同一job_idへの重複依頼作成防止に用いる"
      - name: "blue_run_id"
        type: "uuid"
        nullable: false
        description: "比較対象のblue slot側background実行のrun_id。execution_specs.run_idを参照する。blueとgreenを同一runの2 slotとして起動した場合はgreen_run_idと同値になる"
      - name: "green_run_id"
        type: "uuid"
        nullable: false
        description: "比較対象のgreen slot側background実行のrun_id。execution_specs.run_idを参照する。blueとgreenを同一runの2 slotとして起動した場合はblue_run_idと同値になる"
      - name: "blue_attempt_id"
        type: "string"
        nullable: false
        description: "比較対象としたblue slot側background起動試行のattempt_id。runner_resultsの（blue_run_id, 'blue', 'background', blue_attempt_id）を指す。同一runで複数回起動した場合にどの試行を比較したかを一意に特定する"
      - name: "green_attempt_id"
        type: "string"
        nullable: false
        description: "比較対象としたgreen slot側background起動試行のattempt_id。runner_resultsの（green_run_id, 'green', 'background', green_attempt_id）を指す。同一runで複数回起動した場合にどの試行を比較したかを一意に特定する"
      - name: "comparison_definition_valid_from"
        type: "datetime"
        nullable: false
        description: "依頼時点で解決した比較定義世代のvalid_from。comparison_definitions（job_id, valid_from）を指し、比較実行時に適用する比較対象・比較実装をこの世代へ固定する。世代は追記のみで更新されないため、依頼作成後に定義が差し替わっても当該依頼の比較内容は変わらない（SPEC-012-03）"
      - name: "requested_at"
        type: "datetime"
        nullable: false
        description: "依頼作成日時（CronJob実行時刻）"
      - name: "status"
        type: "string"
        nullable: false
        description: "依頼状態。値: REQUESTED, CLAIMED, RUNNING, SUCCEEDED, FAILED, ABORTED"
      - name: "lease_expires_at"
        type: "datetime"
        nullable: true
        description: "workerがCLAIMEDにした際のlease期限（claim時刻+約10分）。lease失効かつ未着手の場合はREQUESTEDへ差し戻され、その際本カラムはNULLに戻る"
      - name: "worker_id"
        type: "string"
        nullable: true
        description: "leaseを取得したworkerの識別子。REQUESTEDへの差し戻し時はNULL"
    primary_key: ["run_id"]
    foreign_keys:
      - columns: ["parent_run_id"]
        references:
          table: "rapid_crosscheck_requests"
          columns: ["run_id"]
        on_delete: "SET NULL"
      - columns: ["blue_run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "RESTRICT"
      - columns: ["green_run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "RESTRICT"
      - columns: ["job_id", "comparison_definition_valid_from"]
        references:
          table: "comparison_definitions"
          columns: ["job_id", "valid_from"]
        on_delete: "RESTRICT"
    indexes:
      - name: "fk_rapid_crosscheck_requests_comparison_definitions"
        columns: ["job_id", "comparison_definition_valid_from"]
        unique: false
        reason: "外部キーインデックス: 依頼から適用済み比較定義世代への参照整合性チェックと、比較実行時の定義解決を高速化する"
        used_by: ["速報クロスチェックを実行し差分を検知する"]
      - name: "uq_rapid_crosscheck_requests_job_id_blue_green"
        columns: ["job_id", "blue_run_id", "blue_attempt_id", "green_run_id", "green_attempt_id"]
        unique: true
        reason: "ユニーク制約: 同一job_id・同一の比較対象起動試行ペアに対する重複依頼作成を防止する（CTP-006冪等性方針）。blue/greenの完了順に依存せず1件だけ作成されることを保証する。再実行では新しいrun_idの依頼を作成するため、job_id単独のユニーク制約では再実行を表現できず、比較対象試行の組で一意化する"
        used_by: ["blue/green runnerの完了通知を受けて速報比較依頼を作成する"]
      - name: "idx_rapid_crosscheck_requests_status_lease_expires_at"
        columns: ["status", "lease_expires_at"]
        unique: false
        reason: "REQUESTED取得およびCLAIMEDのlease失効判定の双方で高頻度に参照するため。リラン対象選定でもstatus絞り込みに使用する"
        used_by:
          - "速報クロスチェックを実行し差分を検知する"
          - "再実行対象のbackground実行・速報比較依頼を選択する"
      - name: "idx_rapid_crosscheck_requests_parent_run_id"
        columns: ["parent_run_id"]
        unique: false
        reason: "CTP-004実行系譜トレーサビリティ。元依頼から再実行依頼の系譜をたどるため"
        used_by: ["execution-spec.jsonの実行設定を保ったまま再実行する"]
      - name: "fk_rapid_crosscheck_requests_execution_specs_blue_run_id"
        columns: ["blue_run_id"]
        unique: false
        reason: "外部キーインデックス: blue_run_idからexecution_specs.run_idへの参照整合性チェックを高速化する"
        used_by: ["blue/green runnerの完了通知を受けて速報比較依頼を作成する"]
      - name: "fk_rapid_crosscheck_requests_execution_specs_green_run_id"
        columns: ["green_run_id"]
        unique: false
        reason: "外部キーインデックス: green_run_idからexecution_specs.run_idへの参照整合性チェックを高速化する"
        used_by: ["blue/green runnerの完了通知を受けて速報比較依頼を作成する"]
    used_by:
      - uc: "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
        operations: ["INSERT"]
      - uc: "速報クロスチェックを実行し差分を検知する"
        operations: ["SELECT", "UPDATE"]
      - uc: "速報クロスチェック結果を確認する"
        operations: ["SELECT"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["SELECT", "INSERT"]
      - uc: "再実行対象のbackground実行・速報比較依頼を選択する"
        operations: ["SELECT"]
      - uc: "RUNNING中の速報比較依頼の中止を依頼する"
        operations: ["SELECT"]
      - uc: "対話確認のうえ速報比較依頼をABORTEDへ遷移させる"
        operations: ["SELECT", "UPDATE"]
    _review_notes: "CR-6078c4ed-003: 再実行を同一run_idの差し戻しから新run_id発行+parent_run_id関連付けへ変更したため、parent_run_idカラムと系譜索引を追加し、job_id単独のユニーク制約を(job_id, blue_run_id, green_run_id)へ拡張した"

  - name: "rapid_crosscheck_results"
    rdra_info: "速報比較結果"
    description: "速報クロスチェックの比較結果を保持し、hang-detectorによる速報クロスチェック異常の検知・運用者への通知に用いる"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "対応する速報比較依頼のrun_id。rapid_crosscheck_requestsと1:1関係"
      - name: "comparison_result"
        type: "string"
        nullable: false
        description: "比較判定結果。値: OK, NG。diff_count=0なら'OK'、1件以上なら'NG'"
      - name: "diff_count"
        type: "integer"
        nullable: false
        description: "blue/green比較の不一致行数"
      - name: "diff_detail_uri"
        type: "string"
        nullable: true
        description: "NG時のみ設定される差分詳細レポートのURI"
      - name: "completed_at"
        type: "datetime"
        nullable: false
        description: "比較完了日時"
    primary_key: ["run_id"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "rapid_crosscheck_requests"
          columns: ["run_id"]
        on_delete: "CASCADE"
    indexes:
      - name: "idx_rapid_crosscheck_results_comparison_result"
        columns: ["comparison_result"]
        unique: false
        reason: "hang-detectorがNG判定のレコードを高頻度でポーリングするため"
        used_by: ["background実行の未完了・非0終了・速報比較異常を定期検知する"]
    used_by:
      - uc: "速報クロスチェックを実行し差分を検知する"
        operations: ["INSERT"]
      - uc: "速報クロスチェック結果を確認する"
        operations: ["SELECT"]
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["SELECT"]
    _review_notes: "ユニーク制約: 主キーrun_idにより「1つの速報比較依頼に対し速報比較結果は1件のみ」という1:1制約を充足するため、追加のユニークインデックスは不要と判断"

  - name: "final_crosscheck_requests"
    rdra_info: "確報比較依頼"
    description: "日次で全テーブル・全ファイルを対象に行う確報クロスチェックの比較実行依頼。速報側のエンティティと独立してrun_idで相関付け、リリース判断の正本とする実行状態を管理する。応答はstdout/stderr/exitcodeの3項目のみに限定する"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "確報比較依頼を一意に識別するUUID"
      - name: "job_id"
        type: "string"
        nullable: false
        description: "確報専用ジョブ定義のJOB_ID。適用する比較定義（comparison_definitions）をjob_idで解決するために保持する（SPEC-012-03）"
      - name: "comparison_definition_valid_from"
        type: "datetime"
        nullable: false
        description: "依頼時点で解決した比較定義世代のvalid_from。comparison_definitions（job_id, valid_from）を指す。target_tables/target_filesはこの世代から複写した解決済みの値である"
      - name: "target_date"
        type: "date"
        nullable: false
        description: "確報クロスチェックの対象日"
      - name: "status"
        type: "string"
        nullable: false
        description: "依頼状態。値: REQUESTED, CLAIMED, RUNNING, SUCCEEDED, FAILED, ABORTED"
      - name: "lease_expires_at"
        type: "datetime"
        nullable: true
        description: "claim時刻+lease期限。lease失効時はREQUESTEDへ差し戻され本カラムはNULLに戻る"
      - name: "worker_id"
        type: "string"
        nullable: true
        description: "claimを実行したworkerの識別子。差し戻し時はNULL"
      - name: "target_tables"
        type: "text"
        nullable: false
        description: "確報クロスチェックの対象テーブル一覧。依頼作成時にcomparison_definitionsの該当世代から複写する"
      - name: "target_files"
        type: "text"
        nullable: false
        description: "確報クロスチェックの対象ファイル一覧。依頼作成時にcomparison_definitionsの該当世代から複写する"
      - name: "completed_at"
        type: "datetime"
        nullable: true
        description: "SUCCEEDED/FAILED確定時刻。未完了時はNULL"
    primary_key: ["run_id"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "RESTRICT"
      - columns: ["job_id", "comparison_definition_valid_from"]
        references:
          table: "comparison_definitions"
          columns: ["job_id", "valid_from"]
        on_delete: "RESTRICT"
    indexes:
