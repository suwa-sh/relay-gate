        used_by: ["ハング疑い・異常の通知を確認する"]
      - name: "idx_hang_detections_notified_at"
        columns: ["notified_at"]
        unique: false
        reason: "通知バッチが未通知レコード（notified_at IS NULL）を高頻度でポーリングするため"
        used_by: ["ハング疑い・異常を運用者へ通知する"]
    used_by:
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["SELECT", "INSERT"]
      - uc: "ハング疑い・異常の通知を確認する"
        operations: ["SELECT"]
      - uc: "ハング疑い・異常を運用者へ通知する"
        operations: ["SELECT", "UPDATE"]
    _review_notes: "状態遷移の整合性: 同一run_id・detection_typeの未解消（resolved_at IS NULL）レコードは1件のみとするビジネスルールがある。RDB製品非依存のYAML定義であるためWHERE付き部分インデックスは記述せず、複合インデックス+アプリケーション側チェックで担保する方針を明記した"

  - name: "audit_logs"
    rdra_info: "該当なし（RDRAに明示定義なし。CTP-005監査ログ要件・CTR-008失敗時契約・CTP-004実行系譜トレーサビリティから導出）"
    description: "slot起動の操作受付・起動試行・成功・失敗・timeout・最終状態、および対話確認を経た中止・リラン操作を同一schemaで記録する追記専用の監査イベントテーブル。非partitionのテーブルとし、event_id単独主キーと（run_id, slot, attempt_id, event_name）一意制約を実PostgreSQLでそのままCREATE TABLEできる構成とする（partitioned tableは主キー・一意制約にpartition keyの包含を要求し、冪等一意性の契約と両立しないため）。INSERTのみを許可しUPDATE/DELETE権限はアプリケーションロールへ付与しない。訂正も新しいイベントとして追記する。認証情報・起動引数の実値・stdout/stderr本文は記録しない。保持期間は6ヶ月とし、専用保守権限ロールがハッシュチェーン検証結果を記録したうえで保持境界超過分を削除する"
    columns:
      - name: "event_id"
        type: "uuid"
        nullable: false
        description: "監査イベントを一意に識別するUUID。単独主キーとする"
      - name: "event_name"
        type: "string"
        nullable: false
        description: "監査イベント名。値: slot_launch_accepted, slot_launch_attempted, slot_launch_succeeded, slot_launch_failed, slot_launch_timeout, slot_final_status, abort_requested, abort_confirmed, rerun_requested, rerun_accepted。(run_id, slot, attempt_id, event_name)の一意制約で再試行を冪等化する"
      - name: "schema_version"
        type: "string"
        nullable: false
        description: "監査イベントschemaのバージョン。フィールド追加時の互換判定に用いる"
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "操作対象のrun_id。実行系譜の一元照会キー。リランでは新規発行したrun_idを記録する"
      - name: "parent_run_id"
        type: "uuid"
        nullable: true
        description: "リラン元のrun_id。通常起動時はNULL。run_id/parent_run_idで実行系譜を一元照会する"
      - name: "slot"
        type: "string"
        nullable: false
        description: "対象slot種別。値: blue, green、およびslotに紐づかないrun単位イベントを表す '-'。一意制約をNULLで無効化しないため、非該当時はNULLではなく '-' を格納する"
      - name: "attempt_id"
        type: "string"
        nullable: false
        description: "対象の起動試行のattempt_id。起動試行に紐づかないイベント（中止・リラン受付など）では '-' を格納する。一意制約をNULLで無効化しないため非該当時もNULLとしない"
      - name: "occurred_at"
        type: "datetime"
        nullable: false
        description: "監査イベントの発生時刻。保持期間6ヶ月の境界判定と時系列照合に用いる"
      - name: "actor"
        type: "string"
        nullable: false
        description: "操作主体の識別子。運用者操作ではRELAYGATE_OPERATORの値、システム自動処理では実行コンポーネント名（facade / worker / hang-detector）を格納する"
      - name: "operation"
        type: "string"
        nullable: false
        description: "実施した操作。値: slot_launch, abort, rerun, status_finalize。何をしたかを表すフィールドとしてevent_nameから独立に保持する"
      - name: "outcome"
        type: "string"
        nullable: false
        description: "操作の結果。値: accepted, succeeded, failed, timeout, rejected, unknown。成否をどのイベントでも同一フィールド名で判定できるようにする"
      - name: "final_status"
        type: "string"
        nullable: true
        description: "最終状態イベント（event_name=slot_final_status）でのみ設定する確定状態。値: SUCCEEDED, FAILED, UNKNOWN, ABORTED。それ以外のイベントではNULL"
      - name: "error_code"
        type: "string"
        nullable: true
        description: "失敗・timeout時のエラー種別コード。正常イベントではNULL。認証情報・起動引数の実値・stdout/stderr本文は含めない"
      - name: "previous_hash"
        type: "string"
        nullable: true
        description: "同一run_idのハッシュチェーンにおける直前イベントのevent_hash。run_id内の最初のイベントではNULL"
      - name: "event_hash"
        type: "string"
        nullable: false
        description: "正規化済みイベント本体とprevious_hashから算出するハッシュ値。定期検証ジョブがチェーンを照合して欠損・改ざんを検知する"
    primary_key: ["event_id"]
    foreign_keys: []
    indexes:
      - name: "uq_audit_logs_run_slot_attempt_event_name"
        columns: ["run_id", "slot", "attempt_id", "event_name"]
        unique: true
        reason: "ユニーク制約: CTR-008の失敗時契約における再試行追記を冪等化する。slot・attempt_idは非該当時も '-' を格納し、NULLによる一意制約の無効化を避ける"
        used_by:
          - "feature flag設定に基づきslotを選択して起動する"
          - "background roleを起動する"
          - "execution-spec.jsonの実行設定を保ったまま再実行する"
      - name: "idx_audit_logs_occurred_at"
        columns: ["occurred_at"]
        unique: false
        reason: "保持期間6ヶ月の境界判定と時系列でのハッシュチェーン定期検証で走査するため"
        used_by: ["execution-spec.jsonの実行設定を保ったまま再実行する"]
      - name: "idx_audit_logs_run_id_occurred_at"
        columns: ["run_id", "occurred_at"]
        unique: false
        reason: "run_id単位で監査イベントを時系列に照会し、ハッシュチェーンを順序どおり検証するため（CTP-004実行系譜トレーサビリティ）"
        used_by:
          - "並行稼働実行結果を確認する"
          - "execution-spec.jsonの実行設定を保ったまま再実行する"
      - name: "idx_audit_logs_parent_run_id_occurred_at"
        columns: ["parent_run_id", "occurred_at"]
        unique: false
        reason: "リラン元run_idから再実行系譜の監査イベントを横断照会するため"
        used_by: ["execution-spec.jsonの実行設定を保ったまま再実行する"]
    used_by:
      - uc: "feature flag設定に基づきslotを選択して起動する"
        operations: ["INSERT"]
      - uc: "background roleを起動する"
        operations: ["INSERT"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["INSERT"]
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["INSERT"]
      - uc: "blue background実行の中止を依頼する"
        operations: ["INSERT"]
      - uc: "green background実行の中止を依頼する"
        operations: ["INSERT"]
      - uc: "RUNNING中の速報比較依頼の中止を依頼する"
        operations: ["INSERT"]
      - uc: "RUNNING中の確報比較依頼の中止を依頼する"
        operations: ["INSERT"]
      - uc: "対話確認のうえblue background実行をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "対話確認のうえgreen background実行をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "対話確認のうえ確報比較依頼をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "対話確認のうえ速報比較依頼をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "並行稼働実行結果を確認する"
        operations: ["SELECT"]
    _review_notes: "CR-6078c4ed-004: 監査テーブルをCTP-005の15フィールドschemaへ拡張し、非partition・event_id単独主キー・(run_id, slot, attempt_id, event_name)一意制約・3索引・6ヶ月保持・追記専用権限・ハッシュチェーンをインフラ確定内容と一致させた。execution_specsへのFKは設けない（監査は追記専用で対象runのライフサイクルから独立して保持し、起動前監査を含む記録順序をFK制約で拘束しないため）。フィールド意味はactor / operation / outcomeへ統一し、詳細は _cross-cutting/api/audit-event-contract.yaml を正本とする"

  - name: "audit_chain_heads"
    rdra_info: "該当なし（CTP-005ハッシュチェーン要件から導出）"
    description: "run_id単位のハッシュチェーンの先頭（最新イベント）を保持し、監査イベント追記の直列化ロックの対象とする。監査イベントを追記する処理は、まず対象run_idの本テーブル行を排他ロック（SELECT ... FOR UPDATE）で取得し、previous_hashを確定してからaudit_logsへINSERTし、同一transaction内で本テーブルを更新する。これによりrun_id内でチェーンが分岐・欠損しないことを保証する"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "ハッシュチェーンを直列化する対象のrun_id。監査イベント追記時の排他ロック単位とする"
      - name: "head_event_id"
        type: "uuid"
        nullable: false
        description: "当該run_idのチェーン先頭（最新）監査イベントのevent_id。audit_logs.event_idに対応する"
      - name: "head_hash"
        type: "string"
        nullable: false
        description: "チェーン先頭イベントのevent_hash。次に追記する監査イベントのprevious_hashとして使用する"
      - name: "chain_length"
        type: "integer"
        nullable: false
        description: "当該run_idのチェーンに連なる監査イベント件数。定期検証ジョブが件数照合で欠損を検知するために保持する"
      - name: "updated_at"
        type: "datetime"
        nullable: false
        description: "チェーン先頭を更新した時刻。対応するaudit_logs.occurred_atと一致させる"
    primary_key: ["run_id"]
    foreign_keys: []
    indexes:
      - name: "idx_audit_chain_heads_updated_at"
        columns: ["updated_at"]
        unique: false
        reason: "ハッシュチェーンの定期検証ジョブが最終更新順にrun_idを走査するため"
        used_by: ["並行稼働実行結果を確認する"]
    used_by:
      - uc: "feature flag設定に基づきslotを選択して起動する"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "background roleを起動する"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "blue background実行の中止を依頼する"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "green background実行の中止を依頼する"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "RUNNING中の速報比較依頼の中止を依頼する"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "RUNNING中の確報比較依頼の中止を依頼する"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "対話確認のうえblue background実行をABORTEDへ遷移させる"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "対話確認のうえgreen background実行をABORTEDへ遷移させる"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "対話確認のうえ速報比較依頼をABORTEDへ遷移させる"
        operations: ["SELECT", "INSERT", "UPDATE"]
      - uc: "対話確認のうえ確報比較依頼をABORTEDへ遷移させる"
        operations: ["SELECT", "INSERT", "UPDATE"]
    _review_notes: "CR-6078c4ed-007項目6: run_id単位のhash-chain headを直列化するlock契約を明示するために追加した。audit_logsは追記専用でUPDATE/DELETEを許可しないが、本テーブルは現在のチェーン先頭を保持するsnapshotのためUPDATEを許可する（監査証跡そのものではなくチェーン検証の索引）"

transaction_rules:
  - name: "slot起動トランザクション"
    description: "slot起動では、run共通execution spec（execution_specs）とslot別実行設定（slot_execution_specs）のINSERT、runner_result_events/runner_resultsのSTARTING記録、および起動前監査イベント（event_name=slot_launch_accepted / slot_launch_attempted）のaudit_logsへのINSERTとaudit_chain_headsの更新を、すべて同一transaction内で実行する。このtransactionがcommitできない場合は外部slot起動を行わない（CTR-008の起動前監査ゲート）"
    tables: ["execution_specs", "slot_execution_specs", "runner_result_events", "runner_results", "audit_logs", "audit_chain_heads"]
    applies_to:
      - "feature flag設定に基づきslotを選択して起動する"
      - "background roleを起動する"
      - "execution-spec.jsonの実行設定を保ったまま再実行する"
  - name: "Runner実行結果の履歴・snapshot同時更新"
    description: "Runner実行結果の状態遷移では、runner_result_eventsへの履歴INSERTとrunner_resultsのsnapshot UPSERTを同一transactionで実行する（LR-002 Event/Snapshot併用パターン）。片方だけがcommitされる状態を許容しない"
    tables: ["runner_result_events", "runner_results"]
    applies_to:
      - "background roleを起動する"
      - "background実行の未完了・非0終了・速報比較異常を定期検知する"
      - "対話確認のうえblue background実行をABORTEDへ遷移させる"
      - "対話確認のうえgreen background実行をABORTEDへ遷移させる"
  - name: "監査イベント追記の直列化"
    description: "audit_logsへの追記は、対象run_idのaudit_chain_heads行を排他ロック（SELECT ... FOR UPDATE）で取得してprevious_hashを確定し、audit_logsのINSERTとaudit_chain_headsの更新を同一transactionで完了する。run_id単位のロックにより、同一runへの並行追記でチェーンが分岐しないことを保証する"
    tables: ["audit_logs", "audit_chain_heads"]
    applies_to:
      - "feature flag設定に基づきslotを選択して起動する"
      - "background roleを起動する"
      - "execution-spec.jsonの実行設定を保ったまま再実行する"
      - "対話確認のうえblue background実行をABORTEDへ遷移させる"
      - "対話確認のうえgreen background実行をABORTEDへ遷移させる"
      - "対話確認のうえ速報比較依頼をABORTEDへ遷移させる"
      - "対話確認のうえ確報比較依頼をABORTEDへ遷移させる"

er_diagram: |
  erDiagram
    execution_specs ||--o{ execution_specs : "リラン元 (parent_run_id)"
    execution_specs ||--o{ slot_execution_specs : "slot別実行設定 (run_id)"
    slot_execution_specs ||--o{ runner_results : "起動試行snapshot (run_id, slot_type)"
    execution_specs ||--o{ runner_result_events : "起動試行履歴 (run_id)"
    execution_specs ||--o{ rapid_crosscheck_requests : "速報比較依頼-blue (blue_run_id)"
    execution_specs ||--o{ rapid_crosscheck_requests : "速報比較依頼-green (green_run_id)"
    rapid_crosscheck_requests ||--o{ rapid_crosscheck_requests : "リラン元依頼 (parent_run_id)"
    rapid_crosscheck_requests ||--o| rapid_crosscheck_results : "速報比較結果 (run_id)"
    execution_specs ||--o{ final_crosscheck_requests : "確報比較依頼 (run_id)"
    comparison_definitions ||--o{ rapid_crosscheck_requests : "適用比較定義世代 (job_id, comparison_definition_valid_from)"
    comparison_definitions ||--o{ final_crosscheck_requests : "適用比較定義世代 (job_id, comparison_definition_valid_from)"
    execution_specs ||--o{ hang_detections : "ハング検知記録 (run_id)"
    execution_specs ||--o{ audit_logs : "監査イベント (run_id、FKなし)"
    execution_specs ||--o| audit_chain_heads : "ハッシュチェーン先頭 (run_id、FKなし)"

    execution_specs {
      uuid run_id PK
      uuid parent_run_id FK
      string job_id
      text additional_args
      string job_map_version
      integer hang_detect_limit_minutes
    }
    slot_execution_specs {
      uuid run_id PK "FK"
      string slot_type PK
      string host
      string exec_user
      string script_path
      string work_dir
      text fixed_args
      string impl_version
      string credential_ref
    }
    runner_result_events {
      uuid event_id PK
      uuid run_id FK
      string slot_type
      string role_type
      string attempt_id
      integer attempt_no
      string event_name
      string status
      datetime occurred_at
      datetime started_at
      string stdout_path
      string stderr_path
      integer exit_code
    }
    runner_results {
      uuid run_id PK "FK"
      string slot_type PK "FK"
      string role_type PK
      string attempt_id PK
      integer attempt_no
      datetime accepted_at
      datetime started_at
      string stdout_path
      string stderr_path
      integer exit_code
      string status
      datetime updated_at
    }
    comparison_definitions {
      string job_id PK
      datetime valid_from PK
      datetime valid_to
      text target_tables
      text target_files
      string comparator_id
      datetime registered_at
    }
    rapid_crosscheck_requests {
      uuid run_id PK
      uuid parent_run_id FK
      string job_id FK
      uuid blue_run_id FK
      uuid green_run_id FK
      string blue_attempt_id
      string green_attempt_id
      datetime comparison_definition_valid_from FK
      datetime requested_at
      string status
      datetime lease_expires_at
      string worker_id
    }
    rapid_crosscheck_results {
      uuid run_id PK "FK"
      string comparison_result
      integer diff_count
      string diff_detail_uri
      datetime completed_at
    }
    final_crosscheck_requests {
      uuid run_id PK "FK"
      string job_id FK
      datetime comparison_definition_valid_from FK
      date target_date
      string status
      datetime lease_expires_at
      string worker_id
      text target_tables
      text target_files
      datetime completed_at
    }
    hang_detections {
      uuid detection_id PK
      uuid run_id FK
      string detection_type
      datetime detected_at
      integer threshold_minutes
      string slot_type
      string attempt_id
      string notify_target
      datetime resolved_at
      datetime notified_at
    }
    audit_logs {
      uuid event_id PK
      string event_name
      string schema_version
      uuid run_id
      uuid parent_run_id
      string slot
      string attempt_id
      datetime occurred_at
      string actor
      string operation
      string outcome
      string final_status
      string error_code
      string previous_hash
      string event_hash
    }
    audit_chain_heads {
      uuid run_id PK
      uuid head_event_id
      string head_hash
      integer chain_length
      datetime updated_at
    }
