uc: "速報クロスチェックを実行し差分を検知する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"

bounded_context_id: "BC-002"
aggregate_id: "AG-003"

models:
  - name: "CronJobエントリポイント（lease/claim取得）"
    tier: "tier-worker"
    layer: "presentation"
    type: "state"
    rdra_info: "速報比較依頼"
  - name: "RunRapidCrosscheckCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "速報比較依頼"
  - name: "速報比較依頼"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較依頼"
  - name: "速報比較結果"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較結果"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較依頼"
  - name: "RapidCrosscheckResultRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較結果"
  - name: "RunnerResultRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "ComparisonDefinitionRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "比較定義"

tables:
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    operations:
      - type: "SELECT"
        columns: ["run_id", "job_id", "blue_run_id", "blue_attempt_id", "green_run_id", "green_attempt_id", "comparison_definition_valid_from"]
        where: "status = 'REQUESTED' LIMIT 1 FOR UPDATE"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "CLAIMED → RUNNING → SUCCEEDED/FAILED の順に更新"
          - name: "worker_id"
            value: "lease取得worker識別子"
          - name: "lease_expires_at"
            value: "claim時刻+5分等のlease期限"
        where: "run_id = :run_id"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "REQUESTED（差し戻し）"
          - name: "worker_id"
            value: "NULL"
          - name: "lease_expires_at"
            value: "NULL"
        where: "status = 'CLAIMED' AND lease_expires_at < now()"
    indexes_needed:
      - columns: ["status", "lease_expires_at"]
        reason: "REQUESTED取得およびCLAIMEDのlease失効判定の双方で高頻度に参照するため"
        access_pattern: "status条件検索+lease_expires_at範囲検索（CronJob毎回実行）"
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "SELECT"
        columns: ["stdout_path", "stderr_path", "exit_code", "status"]
        where: "(run_id, slot_type, role_type, attempt_id) IN ((:blue_run_id, 'blue', 'background', :blue_attempt_id), (:green_run_id, 'green', 'background', :green_attempt_id))"
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_id"]
        reason: "複合主キー。依頼の4項目（blue_run_id/blue_attempt_id/green_run_id/green_attempt_id）で比較対象の起動試行を一意に特定するため"
        access_pattern: "起動試行identityによる完全一致取得"
  - name: "comparison_definitions"
    rdra_info: "比較定義"
    operations:
      - type: "SELECT"
        columns: ["target_tables", "target_files", "comparator_id"]
        where: "job_id = :job_id AND valid_from = :comparison_definition_valid_from"
    indexes_needed:
      - columns: ["job_id", "valid_from"]
        reason: "複合主キー。依頼が保持する(job_id, comparison_definition_valid_from)で比較定義世代を1件に特定するため（実行時に最新世代を再解決しない世代固定）"
        access_pattern: "世代キーによる完全一致取得"
  - name: "rapid_crosscheck_results"
    rdra_info: "速報比較結果"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "rapid_crosscheck_requests.run_idを引き継ぐ"
          - name: "comparison_result"
            value: "diff_count=0なら'OK'、1件以上なら'NG'"
          - name: "diff_count"
            value: "blue/green比較の不一致行数"
          - name: "diff_detail_uri"
            value: "NG時のみ差分詳細レポートのURIを生成"
          - name: "completed_at"
            value: "比較完了時刻"
        where: ""
    indexes_needed:
      - columns: ["run_id"]
        reason: "ユニーク制約: 1つの速報比較依頼に対し速報比較結果は1件のみ（1:1関係）"
        access_pattern: "run_idユニーク制約"

kvs: []
object_storage: []
