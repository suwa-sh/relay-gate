uc: "速報クロスチェック結果を確認する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"

bounded_context_id: "BC-002"

models:
  - name: "RapidCrosscheckResultQuery"
    tier: "tier-worker"
    layer: "presentation"
    type: "query"
    rdra_info: "速報比較依頼"
  - name: "GetRapidCrosscheckResultQuery"
    tier: "tier-worker"
    layer: "usecase"
    type: "query"
    rdra_info: "速報比較依頼"
  - name: "速報比較依頼"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較依頼"
  - name: "速報比較結果"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較結果"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較依頼"
  - name: "RapidCrosscheckResultRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較結果"

tables:
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    operations:
      - type: "SELECT"
        columns: ["run_id", "parent_run_id", "job_id", "blue_run_id", "blue_attempt_id", "green_run_id", "green_attempt_id", "status", "lease_expires_at", "worker_id"]
        where: "job_id = :job_id OR run_id = :run_id"
    indexes_needed:
      - columns: ["job_id"]
        reason: "job_id指定での速報比較依頼検索が本UCの主アクセスパターンのため"
        access_pattern: "job_id完全一致検索"
  - name: "rapid_crosscheck_results"
    rdra_info: "速報比較結果"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = :run_id"
    indexes_needed:
      - columns: ["run_id"]
        reason: "rapid_crosscheck_requestsとのJOINキーとして必要"
        access_pattern: "run_id完全一致JOIN"

kvs: []
object_storage: []
