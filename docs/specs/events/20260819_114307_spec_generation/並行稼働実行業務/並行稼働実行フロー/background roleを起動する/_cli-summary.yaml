uc: "background roleを起動する"
business: "並行稼働実行業務"
buc: "並行稼働実行フロー"
commands:
  - name: "relaygate concurrent-run start-background"
    tier: "tier-facade"
    summary: "execution-spec.jsonで確定済みのbackground対象slotについてworkerへ起動トリガーを送出する"
    args:
      - name: "--run-id"
        required: true
        description: "起動対象run_id"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "RDB接続文字列"
      - name: "RELAYGATE_WORKER_TRIGGER_ENDPOINT"
        required: true
        description: "tier-workerへの起動トリガー送出先"
      - name: "RELAYGATE_OPERATOR"
        required: true
        description: "監査イベントのactorへ記録する操作者識別子"
    stdin: "なし"
    stdout_contract: "background起動: run_id/slot_type/attempt_id/attempt_no/status=STARTINGの1行"
    stderr_contract: "background対象slotなし・接続失敗・起動前監査の追記失敗時に原因と次アクションを1文ずつ出力する"
    exit_codes:
      - code: 0
        meaning: "正常終了"
      - code: 1
        meaning: "業務エラー（background対象slotなし・接続失敗・起動前監査の追記失敗による起動中止）"
      - code: 2
        meaning: "バリデーションエラー（run_id未指定）"
      - code: 124
        meaning: "タイムアウト（RDB接続タイムアウト）"
      - code: 130
        meaning: "SIGINT中断"
  - name: "relaygate worker start-background-execution"
    tier: "tier-worker"
    summary: "facadeからのトリガーを受けてbackground実行を開始しRunner実行結果を記録する"
    args:
      - name: "--run-id"
        required: true
        description: "facadeから引き継いだrun_id"
      - name: "--slot-type"
        required: true
        description: "起動対象slot種別（blue/green）"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "RDB接続文字列"
      - name: "RELAYGATE_SSH_KEY_PATH"
        required: true
        description: "blue/green実装ホストへのSSH接続鍵パス"
      - name: "RELAYGATE_OPERATOR"
        required: true
        description: "監査イベントのactorへ記録する操作者識別子"
    stdin: "なし"
    stdout_contract: "background実行開始: run_id/slot_type/attempt_id/attempt_no/statusの1行。statusはSTARTING（受付時）またはRUNNING（起動確認後）"
    stderr_contract: "SSH接続失敗・RDB書込み失敗・起動前監査の追記失敗時に原因と次アクションを1文ずつ出力する"
    exit_codes:
      - code: 0
        meaning: "正常終了"
      - code: 1
        meaning: "業務エラー（起動先接続失敗・起動前監査の追記失敗による起動中止）"
      - code: 2
        meaning: "バリデーションエラー（run_id/slot-type未指定）"
      - code: 124
        meaning: "タイムアウト（SSH起動タイムアウト。起動試行はUNKNOWNとして記録し推測でFAILEDを確定しない）"
      - code: 130
        meaning: "SIGINT中断"
screens:
  - name: "background role起動画面"
    route: "/cli/concurrent-run/start-background"
    components: ["ExecutionSpecCard", "RunnerResultPanel"]
