uc: "feature flag設定に基づきslotを選択して起動する"
business: "並行稼働実行業務"
buc: "並行稼働実行フロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "SelectSlotRequest"
    tier: "tier-facade"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "execution-spec.json"
  - name: "SelectAndStartSlotCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "execution-spec.json"
  - name: "ExecutionSpec"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "execution-spec.json"
  - name: "SlotExecutionSpec"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
  - name: "ExecutionSpecRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "execution-spec.json"
  - name: "AuditEventRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "該当なし（CTP-005監査ログ要件から導出）"

tables:
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "起動時に新規発番するUUID"
          - name: "parent_run_id"
            value: "通常起動時はNULL（リラン時のみ元run_id）"
          - name: "job_id"
            value: "CLI引数 --job-id の値"
          - name: "additional_args"
            value: "CLI追加引数（run共通、nullable）"
          - name: "job_map_version"
            value: "ジョブマップのバージョン"
          - name: "hang_detect_limit_minutes"
            value: "ジョブマップ解決結果"
        where: ""
    indexes_needed:
      - columns: ["job_id"]
        reason: "同一JOB_IDに紐づくblue/green実行結果の相関取得に使用"
        access_pattern: "並行稼働実行結果を確認するUCからのjob_id検索"
  - name: "slot_execution_specs"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "本UCで新規発番したrun_id"
          - name: "slot_type"
            value: "選択されたslot（blue/green）。選択slotごとに1行"
          - name: "host"
            value: "ジョブマップ解決結果（slotごとに異なりうる）"
          - name: "exec_user"
            value: "ジョブマップ解決結果"
          - name: "script_path"
            value: "ジョブマップ解決結果"
          - name: "work_dir"
            value: "ジョブマップ解決結果"
          - name: "fixed_args"
            value: "ジョブマップ解決結果（nullable）"
          - name: "impl_version"
            value: "当該slotの実装バージョン"
          - name: "credential_ref"
            value: "認証情報参照名のみ（実値は保存しない、nullable）"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type"]
        reason: "複合主キー。同一runに対する同一slotの実行設定重複を防止する"
        access_pattern: "background起動・結果確認UCからの(run_id, slot_type)参照"
  - name: "runner_result_events"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "新規発番するUUID"
          - name: "run_id"
            value: "本UCで新規発番したrun_id"
          - name: "slot_type"
            value: "選択されたslot（blue/green）"
          - name: "role_type"
            value: "feature flagで決定した役割（foreground/background）"
          - name: "attempt_id"
            value: "起動試行の一意識別子"
          - name: "attempt_no"
            value: "固定値 1（初回起動）"
          - name: "event_name"
            value: "固定値 attempt_started"
          - name: "status"
            value: "固定値 STARTING"
          - name: "occurred_at"
            value: "起動受付時刻"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_id", "event_name"]
        reason: "ユニーク制約。同一起動試行への同一遷移イベントの重複追記を防止し再試行を冪等化する"
        access_pattern: "クラッシュ後再試行時の冪等INSERT"
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "本UCで新規発番したrun_id"
          - name: "slot_type"
            value: "選択されたslot（blue/green）"
          - name: "role_type"
            value: "feature flagで決定した役割（foreground/background）"
          - name: "attempt_id"
            value: "起動試行の一意識別子"
          - name: "attempt_no"
            value: "固定値 1（初回起動）"
          - name: "accepted_at"
            value: "起動受付時刻（STARTING遷移時点）"
          - name: "status"
            value: "固定値 STARTING"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_no"]
        reason: "ユニーク制約。同一（run_id, slot_type, role_type）内の起動試行連番の一意性を担保する。runner_result_eventsへの履歴INSERTと同一transactionでsnapshotをINSERTする（LR-002）"
        access_pattern: "起動受付の冪等性チェックおよび後続UCからの起動試行identity参照"
  - name: "audit_logs"
    rdra_info: "該当なし（CTP-005監査ログ要件・CTR-008失敗時契約から導出）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_name"
            value: "slot_launch_accepted（slot='-', attempt_id='-'）/ slot_launch_attempted（選択slotごと）"
          - name: "run_id"
            value: "本UCで新規発番したrun_id"
          - name: "actor"
            value: "RELAYGATE_OPERATORの値"
          - name: "operation"
            value: "固定値 slot_launch"
          - name: "outcome"
            value: "固定値 accepted"
          - name: "previous_hash"
            value: "audit_chain_heads排他ロックで確定したhead_hash"
          - name: "event_hash"
            value: "正規化済みイベント本体とprevious_hashから算出"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot", "attempt_id", "event_name"]
        reason: "ユニーク制約（冪等キー）。再試行時の重複追記を防止する"
        access_pattern: "起動前監査ゲートの冪等INSERT"
  - name: "audit_chain_heads"
    rdra_info: "該当なし（CTP-005ハッシュチェーン要件から導出）"
    operations:
      - type: "SELECT"
        columns:
          - name: "head_hash"
            value: "previous_hash確定のためSELECT ... FOR UPDATEで排他ロック取得"
        where: "run_id = 本UCで新規発番したrun_id"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "当該run_idの最初の監査イベント時に新規作成"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "head_event_id"
            value: "追記した監査イベントのevent_id"
          - name: "head_hash"
            value: "追記した監査イベントのevent_hash"
          - name: "chain_length"
            value: "インクリメント"
          - name: "updated_at"
            value: "audit_logs.occurred_atと一致"
        where: "run_id = 本UCで新規発番したrun_id"
    indexes_needed:
      - columns: ["run_id"]
        reason: "主キー。run_id単位でhash-chain追記を直列化する排他ロック対象"
        access_pattern: "監査イベント追記時のSELECT ... FOR UPDATE"

kvs: []
object_storage: []
