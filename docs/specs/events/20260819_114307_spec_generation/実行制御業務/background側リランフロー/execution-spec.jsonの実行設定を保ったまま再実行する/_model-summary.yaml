uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
business: "実行制御業務"
buc: "background側リランフロー"

# facadeがexecution-spec.json(BC-001/AG-001)の複製・background実行再起動、
# workerが速報比較依頼(BC-002/AG-003)の新規依頼作成をそれぞれ担当するため、
# primary BC/aggregateは実行設定の主体であるfacade側（execution-spec.json）を採用する
bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "RerunRunBackground CLI"
    tier: "tier-facade"
    layer: "presentation"
    type: "request"
    rdra_info: "execution-spec.json"
  - name: "RerunBackgroundCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "execution-spec.json"
  - name: "execution-spec.json"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "execution-spec.json"
  - name: "ExecutionSpecRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "execution-spec.json"
  - name: "SlotExecutionSpecRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
  - name: "RunnerResultRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "AuditLogRecord"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "該当なし（CTP-005監査ログ要件から導出）"
  - name: "RerunRunRapidCrosscheck CLI"
    tier: "tier-worker"
    layer: "presentation"
    type: "request"
    rdra_info: "速報比較依頼"
  - name: "RerunRapidCrosscheckCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "速報比較依頼"
  - name: "速報比較依頼"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較依頼"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較依頼"

tables:
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?（元run_id）"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新規発行するUUID"
          - name: "parent_run_id"
            value: "元run_id"
          - name: "job_id"
            value: "元レコードから複製"
          - name: "additional_args"
            value: "元レコードから複製"
          - name: "job_map_version"
            value: "元レコードから複製"
          - name: "hang_detect_limit_minutes"
            value: "元レコードから複製"
        where: ""
    indexes_needed:
      - columns: ["run_id"]
        reason: "元run_idによる実行設定取得の一意特定"
        access_pattern: "run_id指定によるポイントルックアップ"
      - columns: ["parent_run_id"]
        reason: "実行系譜トレーサビリティ（CTP-004）。親run_idからの子run_id一覧参照"
        access_pattern: "parent_run_id指定による子run_id一覧参照"
  - name: "slot_execution_specs"
    rdra_info: "execution-spec.json（slot別実行設定の分離）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?（元run_id） AND slot_type = ?"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新規発行run_id"
          - name: "slot_type"
            value: "元レコードから複製"
          - name: "host"
            value: "元レコードから複製"
          - name: "exec_user"
            value: "元レコードから複製"
          - name: "script_path"
            value: "元レコードから複製"
          - name: "work_dir"
            value: "元レコードから複製"
          - name: "fixed_args"
            value: "元レコードから複製"
          - name: "impl_version"
            value: "元レコードから複製"
          - name: "credential_ref"
            value: "元レコードから複製（参照名のみ。実値は保存しない）"
        where: ""
    indexes_needed: []
  - name: "runner_result_events"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "新規発行するUUID"
          - name: "run_id"
            value: "新規発行run_id"
          - name: "slot_type"
            value: "元のslot別実行設定から引き継ぐslot種別"
          - name: "role_type"
            value: "'background'固定"
          - name: "attempt_id"
            value: "新規発行する起動試行ID"
          - name: "attempt_no"
            value: "1（新規runの初回試行）"
          - name: "event_name"
            value: "'attempt_started'固定"
          - name: "status"
            value: "'STARTING'固定"
          - name: "occurred_at"
            value: "イベント発生時刻"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_id", "event_name"]
        reason: "ユニーク制約による再試行の冪等化（CTP-006。rdb-schema.yaml uq_runner_result_events_attempt_event_name）"
        access_pattern: "冪等キーによる重複追記防止"
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?（元run_id） AND slot_type = ? AND role_type = 'background'（リラン不可条件STARTING/RUNNING中の判定）"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新規発行run_id"
          - name: "slot_type"
            value: "元のslot別実行設定から引き継ぐslot種別"
          - name: "role_type"
            value: "'background'固定"
          - name: "attempt_id"
            value: "新規発行する起動試行ID"
          - name: "attempt_no"
            value: "1（新規runの初回試行）"
          - name: "accepted_at"
            value: "STARTING遷移時刻"
          - name: "status"
            value: "'STARTING'固定"
          - name: "updated_at"
            value: "runner_result_events.occurred_atと一致させる"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type", "attempt_no"]
        reason: "ユニーク制約により起動試行連番の一意性を担保する（rdb-schema.yaml uq_runner_results_attempt_no）"
        access_pattern: "attempt_no採番時の一意性検査"
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?（元依頼run_id）"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新規発行するUUID"
          - name: "parent_run_id"
            value: "元依頼run_id"
          - name: "job_id"
            value: "元依頼から複製"
          - name: "blue_run_id"
            value: "元依頼から複製"
          - name: "blue_attempt_id"
            value: "元依頼から複製"
          - name: "green_run_id"
            value: "元依頼から複製"
          - name: "green_attempt_id"
            value: "元依頼から複製"
          - name: "comparison_definition_valid_from"
            value: "元依頼から複製（適用比較定義世代を変更前のまま保持する。SPEC-009-04の変更前設定保持と同方針）"
          - name: "requested_at"
            value: "新規依頼作成時刻"
          - name: "status"
            value: "'REQUESTED'固定"
        where: ""
    indexes_needed:
      - columns: ["parent_run_id"]
        reason: "実行系譜トレーサビリティ（CTP-004）。元依頼から再実行依頼の系譜をたどる（rdb-schema.yaml idx_rapid_crosscheck_requests_parent_run_id）"
        access_pattern: "parent_run_id指定による系譜参照"
  - name: "audit_logs"
    rdra_info: "該当なし（RDRAに明示定義なし。CTP-005監査ログ要件・CTP-004実行系譜トレーサビリティから導出。列定義とイベント契約は_cross-cutting/datastore/rdb-schema.yamlと_cross-cutting/api/audit-event-contract.yamlを正本とする）"
    operations:
      - type: "INSERT"
        columns:
          - name: "event_id"
            value: "新規発行するUUID"
          - name: "event_name"
            value: "'rerun_requested' / 'slot_launch_attempted'（background、起動前・同一TX） / 'rerun_accepted'（起動・作成後）"
          - name: "schema_version"
            value: "'1.0'固定"
          - name: "run_id"
            value: "新規発行したrun_id"
          - name: "parent_run_id"
            value: "リラン元run_id（元依頼run_id）"
          - name: "slot"
            value: "対象slot種別（slotに紐づかないイベントは'-'）"
          - name: "attempt_id"
            value: "新attempt_id（起動試行に紐づかないイベントは'-'）"
          - name: "occurred_at"
            value: "イベント発生時刻"
          - name: "actor"
            value: "RELAYGATE_OPERATOR環境変数の値"
          - name: "operation"
            value: "'rerun' / 'slot_launch'"
          - name: "outcome"
            value: "'accepted' / 'succeeded' / 'failed' / 'rejected'"
          - name: "previous_hash"
            value: "audit_chain_heads.head_hash（run_id内の最初のイベントはNULL）"
          - name: "event_hash"
            value: "正規化済みイベント本体とprevious_hashから算出"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot", "attempt_id", "event_name"]
        reason: "冪等キーのユニーク制約（CTR-008。rdb-schema.yaml uq_audit_logs_run_slot_attempt_event_name）"
        access_pattern: "冪等キーによる重複追記防止"
      - columns: ["parent_run_id", "occurred_at"]
        reason: "リラン元run_idから再実行系譜の監査イベントを横断照会する（rdb-schema.yaml idx_audit_logs_parent_run_id_occurred_at）"
        access_pattern: "parent_run_id指定による系譜照会"
  - name: "audit_chain_heads"
    rdra_info: "該当なし（CTP-005ハッシュチェーン要件から導出）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = ?（新規run_id。SELECT ... FOR UPDATEで排他ロックしprevious_hashを確定する）"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新規run_id（当該run_idの最初のイベント時のみ）"
          - name: "head_event_id"
            value: "追記した監査イベントのevent_id"
          - name: "head_hash"
            value: "追記した監査イベントのevent_hash"
          - name: "chain_length"
            value: "1"
          - name: "updated_at"
            value: "audit_logs.occurred_atと一致させる"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "head_event_id"
            value: "追記した監査イベントのevent_id"
          - name: "head_hash"
            value: "追記した監査イベントのevent_hash"
          - name: "chain_length"
            value: "chain_length + 1"
          - name: "updated_at"
            value: "audit_logs.occurred_atと一致させる"
        where: "run_id = ?（audit_logs INSERTと同一transaction）"
    indexes_needed: []

kvs: []
object_storage: []
