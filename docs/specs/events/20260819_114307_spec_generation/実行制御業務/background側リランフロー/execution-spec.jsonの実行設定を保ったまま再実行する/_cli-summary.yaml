uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
business: "実行制御業務"
buc: "background側リランフロー"
# relaygate rerun run は --target の値で tier-facade / tier-worker へ dispatch する単一コマンド。
# dispatch 先別の環境変数・stdout/stderr 契約・終了コードは cli-command-contract.yaml の dispatch[] を正本とする
commands:
  - name: "relaygate rerun run"
    dispatch_target: "background"
    tier: "tier-facade"
    summary: "元のexecution-spec.json（run共通execution spec + slot別実行設定）の実行設定を保ったまま新規run_id（parent_run_id=元run_id）でbackground roleを再実行する（--target background指定時）。元runのレコード・履歴は変更しない"
    args:
      - name: "--target"
        type: "string(enum: background|rapid-crosscheck)"
        required: true
        description: "リラン対象種別。dispatch先のtierを決定する"
      - name: "--run-id"
        type: "string"
        required: true
        description: "リラン元となる完了済み・中止済みのbackground実行のrun_id"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "execution_specs / slot_execution_specs / runner_result_events / runner_results / audit_logs / audit_chain_headsへ接続するRDB接続文字列"
      - name: "RELAYGATE_OPERATOR"
        required: true
        description: "監査イベントのactorへ記録する操作者識別子"
      - name: "RELAYGATE_SSH_KEY_PATH"
        required: true
        description: "blue/green実装への起動に用いるSSH秘密鍵のパス"
    stdin: "なし"
    stdout_contract: "再実行受理時のみ新規run_id・parent_run_id・slot_type・attempt_id・attempt_no・status=STARTINGを1行で出力する"
    stderr_contract: "対象run_id未存在、元のslot modeがforegroundまたはoff、対象がSTARTING/RUNNING中、起動前監査の追記失敗、SSH起動失敗の場合に原因と次アクションを1文ずつ出力する"
    exit_codes:
      - code: 0
        meaning: "正常終了（新規run_idでの再実行を開始）"
      - code: 1
        meaning: "業務エラー（元のexecution spec未存在、元のslot modeがforeground/off、対象がSTARTING/RUNNING中、起動前監査の追記失敗による起動中止、SSH起動失敗）"
      - code: 2
        meaning: "バリデーションエラー（--target未指定、--run-id未指定、--run-idがUUID形式でない）"
      - code: 124
        meaning: "タイムアウト（SSH起動タイムアウト。起動試行はUNKNOWNとして記録し推測でFAILEDを確定しない）"
      - code: 130
        meaning: "SIGINT中断"
  - name: "relaygate rerun run"
    dispatch_target: "rapid-crosscheck"
    tier: "tier-worker"
    summary: "新しいrun_idの速報比較依頼をREQUESTED状態で新規作成し、parent_run_idで元依頼へ関連付ける（--target rapid-crosscheck指定時）。業務ジョブは再実行せず、元依頼のレコード・状態・履歴は変更しない"
    args:
      - name: "--target"
        type: "string(enum: background|rapid-crosscheck)"
        required: true
        description: "リラン対象種別。dispatch先のtierを決定する"
      - name: "--run-id"
        type: "string"
        required: true
        description: "リラン元となる完了済み・中止済みの速報比較依頼のrun_id"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "rapid_crosscheck_requests / audit_logs / audit_chain_headsへ接続するRDB接続文字列"
      - name: "RELAYGATE_OPERATOR"
        required: true
        description: "監査イベントのactorへ記録する操作者識別子"
    stdin: "なし"
    stdout_contract: "新規作成完了時のみ新規run_id・parent_run_id・job_id・status=REQUESTEDを1行で出力する"
    stderr_contract: "対象未存在、対象がREQUESTED/CLAIMED/RUNNING中、監査イベントの追記失敗の場合に原因と次アクションを1文ずつ出力する"
    exit_codes:
      - code: 0
        meaning: "正常終了（新規run_idの速報比較依頼を作成）"
      - code: 1
        meaning: "業務エラー（対象未存在、対象がREQUESTED/CLAIMED/RUNNING中、監査イベントの追記失敗による作成中止）"
      - code: 2
        meaning: "バリデーションエラー（--target未指定、--run-id未指定、--run-idがUUID形式でない）"
      - code: 124
        meaning: "タイムアウト（RDB接続タイムアウト）"
      - code: 130
        meaning: "SIGINT中断"
screens:
  - name: "リラン実行画面"
    route: "/cli/rerun/run"
    components: ["ExecutionSpecCard", "RunnerResultPanel"]
