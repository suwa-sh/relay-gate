    claim: "契約が新設した runtime_prerequisites.external_commands は『セルの解析(CSV のクォート状態機械・fixed_params の JSON 配列)は bash 単独で行う』と JSON 配列の解析も bash 単独に含めた。一方この tier md は『JSON 配列の解析は jq に依存せず、bash + sed / awk で文字列要素を抽出する』と外部コマンドの利用を書いており、同じ事項で矛盾する。UC「slot ごとのジョブマップを定義する」tier-facade は『runner の解決関数と同じ実装を共有する』としているため、実装者はどちらの規則で共有関数を書くか決められない"
    evidence: "契約 conventions.runtime_prerequisites.external_commands『セルの解析(CSV のクォート状態機械・fixed_params の JSON 配列)は bash 単独で行う』/ 解決 UC tier-facade.md UC ロジック『JSON 配列の解析は jq に依存せず、bash + `sed` / `awk` で文字列要素を抽出する(仮採用…)』"
    suggested_fix: "解決 UC tier-facade.md の当該文を『JSON 配列の判定・要素抽出は UC「slot ごとのジョブマップを定義する」tier-facade の「JSON 配列の判定」と同じ実装を共有し、bash 単独で行う(契約 runtime_prerequisites.external_commands)』に置き換える。sed / awk を認めたいなら契約側の external_commands から『fixed_params の JSON 配列』を外す"
