findings:
  - id: "R-004"
    viewpoint: 5
    severity: "major"
    target: "適用構成業務/適用構成定義フロー/slot ごとのジョブマップを定義する/tier-facade.md#ティア完了条件 Scenario「validate-config_sh_job-map は補助コマンドの失敗を検証結果にしない」"
    claim: "Given『PATH 上の sort が常に終了コード 1 で終わる』→ Then『commands=sort で終了コード 6』は、実装が job_id 重複検査に sort を使うことを前提にしている。契約は sort の利用を『許容』するだけで、同 tier md の「実装の前提」は bash 5.0 の連想配列も許している。連想配列で重複検査した正しい実装はこの Scenario で終了コード 0 になり fail する。また契約 snapshot.out_of_scope は『意図的な関数・コマンドの差し替え(PATH の改変等)は守備範囲の対象外』と書いており、PATH 改変で検証する Scenario と読み合わせると実装者がどちらを優先すべきか決められない"
    evidence: "契約 conventions.runtime_prerequisites.external_commands『重複検査に sort を使うことは許容する』/ 契約 config_input_rules.snapshot.out_of_scope『意図的な関数・コマンドの差し替え(PATH の改変等)などの異常環境は守備範囲の対象外』/ tier-facade.md「実装の前提」『連想配列などを使ってよい』/ 同 Scenario Given『PATH 上の sort が常に終了コード 1 で終わる』"
    suggested_fix: "どちらかに寄せる。(a) Scenario を実装非依存にする: Given を『検証器が使う補助コマンド(実装が使うもの。例: sort / tr)のうち 1 つが常に終了コード 1 で終わる』とし、Then の commands= は『失敗させたコマンド名』に置き換える(テストは実装が呼ぶコマンド名を fixture で差し替える)。(b) 契約で『job_id 重複検査は sort を使う』と実装を固定する。あわせて snapshot.out_of_scope の『PATH の改変』を『補助コマンドの失敗の検知(internal_failure)はテストで PATH を差し替えて確認してよい。ここで対象外とするのは差し替え後の結果の正しさ』と補足して矛盾を解く"
  - id: "R-005"
    viewpoint: 5
    severity: "major"
    target: "適用構成業務/適用構成定義フロー/slot ごとのジョブマップを定義する/spec.md#Scenario「検証中に差し替わったファイルは複製した時点の内容だけで判定される」(tier-facade.md の同旨 Scenario、契約 config_input_rules.snapshot.validate_config)"
    claim: "Given『TMPDIR 配下に relay-gate- の一時ファイルが現れたことを監視して置き換える』は、mktemp が空ファイルを作った時点と複製(cp)が終わった時点の間に置き換えが入り得る。この窓で置き換わると複製に新内容(NUL)が入り終了コード 2 となり、Then『終了コード 0 で work_dir=/old』が不安定に fail する。契約は『検証開始時に 1 回だけ複製』とだけ書き、一時ファイルの出現時点で内容が揃っていることを保証していないため、テスト実装者が待機条件を推測で決めることになる"
    evidence: "契約 snapshot.validate_config『ファイル名は relay-gate- で始まる(mktemp のテンプレート。テストが出現を監視するための識別子)』/ spec.md Given『TMPDIR 配下に relay-gate の一時ファイルが現れたことを監視して置き換えのタイミングを決める』/ tier-facade.md Given『接頭辞 relay-gate- が現れたことを監視して』"
    suggested_fix: "契約 snapshot.validate_config に『複製は relay-gate- で始まる作業名(例: 末尾 .part)へ書き終えてから最終名へ rename する。最終名の relay-gate- ファイルが現れた時点で内容は複製済み』を追加し、Scenario の Given を『最終名(.part の付かない relay-gate-*)が現れたことを監視して』に揃える。または Given に『一時ファイルのサイズが元ファイルと一致してから mv する』を明記する"
