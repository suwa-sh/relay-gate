    suggested_fix: "「POSIX 標準コマンドと、オンプレ Linux の coreutils に含まれる基本コマンド(mktemp / cp を含む)に限り、jq など追加パッケージは使わない」に言い換える(インフラ設計の前提 OS に coreutils があることの参照を添える)。"
