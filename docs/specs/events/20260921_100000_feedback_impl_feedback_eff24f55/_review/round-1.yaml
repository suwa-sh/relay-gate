    claim: "「使ってよい外部コマンドは POSIX 標準コマンド(grep / sed / awk / sort / tr / cat / mktemp 等)に限り」とあるが、mktemp は POSIX 標準ではなく(GNU coreutils / BSD)、snapshot の実現に必要な `cp` も列挙に無い。「POSIX 標準に限る」を字義どおり読むと snapshot の実装手段(mktemp)が使えず、契約内で矛盾する。"
