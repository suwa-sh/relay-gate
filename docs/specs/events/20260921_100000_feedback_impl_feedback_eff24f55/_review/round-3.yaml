findings:
  - id: "R-010"
    viewpoint: 5
    severity: "medium"
    target: "_cross-cutting/api/cli-command-contract.yaml#config_input_rules.snapshot.validate_config(適用構成業務/適用構成定義フロー/slot ごとのジョブマップを定義する/tier-facade.md「読み込み中の差し替えに対する保証」も同旨)"
    claim: "同じ文の中で『ファイル名は relay-gate- で始まる(mktemp のテンプレート)』と『作業名(最終名 + .part)へ書き終えてから最終名へ rename。最終名が現れた時点で内容は複製済み』が並ぶが、mktemp が作るのが最終名か作業名かを書いていない。素直に `mktemp relay-gate-XXXXXX` で最終名を確保してから .part へ書いて mv で上書きすると、空の最終名が複製前から存在し、R-005 で直した待機条件(最終名の出現 = 複製完了)が破れて Scenario「検証中に差し替わっても…」が不安定に fail する。保証文から逆算すれば『最終名は rename まで存在させない』と導けるが、mktemp の言及が逆の実装を誘導するため、実装者が推測で決める余地が残る"
    evidence: "契約 snapshot.validate_config『ファイル名は relay-gate- で始まる(mktemp のテンプレート。テストが出現を監視するための識別子)。複製は作業名(最終名 + .part)へ書き終えてから最終名へ rename する(…最終名の relay-gate-* が現れた時点で内容は複製済みで、テストはこれを待機条件にできる)』/ tier-facade.md L68『ファイル名は relay-gate- で始まり、作業名(末尾 .part)へ書き終えてから最終名へ rename する(最終名が現れた時点で複製は完了)』"
    suggested_fix: "契約の当該文に 1 句追加する: 『mktemp で作るのは作業名(例 `mktemp \"$TMPDIR/relay-gate-XXXXXX.part\"`)で、最終名は rename までディレクトリに存在させない(最終名を先に mktemp で確保しない)』。tier-facade.md L68 にも同じ 1 句を添える"
