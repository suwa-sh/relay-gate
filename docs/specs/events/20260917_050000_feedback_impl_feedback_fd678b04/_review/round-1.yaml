    severity: minor
    target: "適用構成業務/適用構成定義フロー/feature flag を設定する/spec.md"
    claim: "Scenario 末尾の「And ジョブスケジューラのジョブ定義は変更していない」は validate-config.sh の出力から判定できない不変条件で、直後の注記「終了コード・stdout・stderr だけで判定する」と字面がずれる"
