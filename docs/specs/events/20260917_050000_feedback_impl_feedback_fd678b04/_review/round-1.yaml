# 対象: git diff HEAD -- docs/specs/latest(feedback request(2026-09-17 01:41 発行)の CR-001 / CR-002 適用差分)
# 観点(閾値 medium): P1 CR 完了条件の充足 / P2 方針資料との整合 / P3 値の二重定義の残存 / P4 Scenario 名と spec-event.yaml の一致 / P5 NFR B.2.1.1 の計算可能性
# 観点 × ラウンド: P1 PASS/PASS/PASS、P2 PASS/PASS/PASS、P3 PASS/CONCERN/PASS、P4 PASS/PASS(全 32 UC 機械照合)/PASS、P5 CONCERN/PASS/PASS。round 3(検証パス)で指摘 0 件、収束
findings:
  - id: R-001
    viewpoint: 5
    severity: major
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "runner_help_probe.response_time_budget の 2 × (4 + 0.2) = 8.4 秒は停止処理を 0.2 秒ちょうどと置いた理論値で、CR-002 の実測 約 9.1 秒(同じ 4 秒 × 2 逐次)と 0.7 秒ずれる。残り 1.6 秒を他処理に使うと 10 秒超になりうる"
    evidence: "CR-002 観測事実「両 runner が応答しない場合に 2 回の問い合わせを逐次実行して約 9.1 秒で復帰した」。契約 timeout_action は TERM → 0.2 秒後 KILL までで、KILL 後の回収・起動オーバーヘッドが予算式に無い"
    suggested_fix: "1 slot あたりの問い合わせ全体(待機 + 停止・回収)の上限を契約値として持ち、両 slot 未応答の上限と残り予算を実測込みで明示する"
  - id: R-002
    viewpoint: 3
    severity: major
    target: "適用構成業務/適用構成定義フロー/slot runner の実体スクリプトを割り当てる/tier-facade.md"
    claim: "「応答しない」の判定基準が契約 runner_help_probe.no_response_criteria 以外の 2 箇所(tier-facade.md 検証表 / spec.md シーケンス図)に列挙として再掲され、spec.md 側は「版の値が 1 でない」が欠落して既に食い違っている(round 2 で検出)"
    evidence: "tier-facade.md 検証表: 4 項目を再掲。spec.md シーケンス図 else 分岐: 3 項目のみ。「blue → green の逐次」も両所に再掲"
    suggested_fix: "両箇所を runner_help_probe.no_response_criteria への参照に置き換え、実行順の再掲も参照化する"
  - id: R-003
