    suggested_fix: "注記を「判定する出力は…だけで、ジョブ定義の不変は前提条件」に改める"
  - id: R-004
    viewpoint: 3
    severity: minor
    target: "_cross-cutting/api/cli-command-contract.yaml"
    claim: "validate-config.sh stdout 説明の未応答条件「応答しない・runner-if-version= 行を返さない」が no_response_criteria の部分再掲(非 0 終了・版不一致が抜ける)"
    evidence: "stdout 説明と runner_help_probe.no_response_criteria の項目数の差"
    suggested_fix: "「(判定基準は runner_help_probe)」の参照に置き換える"
  - id: R-005
