uc: "background roleを起動する"
business: "並行稼働実行業務"
buc: "並行稼働実行フロー"

bounded_context_id: "BC-001"
aggregate_id: "AG-002"

models:
  - name: "StartBackgroundRequest"
    tier: "tier-facade"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "execution-spec.json"
  - name: "TriggerBackgroundStartCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "execution-spec.json"
  - name: "BackgroundStartTriggerClient"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "BackgroundStartJobEntry"
    tier: "tier-worker"
    layer: "presentation"
    type: "request-dto"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "StartBackgroundExecutionCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerExecutionResult"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "RunnerResultRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"

tables:
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = :run_id"
    indexes_needed: []
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "facadeから引き継いだrun_id"
          - name: "slot_type"
            value: "background対象slot（blue/green）"
          - name: "role_type"
            value: "固定値 background"
          - name: "started_at"
            value: "起動時刻"
          - name: "status"
            value: "固定値 RUNNING"
        where: ""
    indexes_needed:
      - columns: ["run_id", "slot_type", "role_type"]
        reason: "同一run_id・slot・roleの重複起動防止（ユニーク制約）"
        access_pattern: "background起動の冪等性チェック"

kvs: []
object_storage: []
