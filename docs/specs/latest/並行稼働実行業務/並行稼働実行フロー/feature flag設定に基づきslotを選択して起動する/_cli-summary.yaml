uc: "feature flag設定に基づきslotを選択して起動する"
business: "並行稼働実行業務"
buc: "並行稼働実行フロー"
commands:
  - name: "relaygate concurrent-run select-slot"
    tier: "tier-facade"
    summary: "feature flag設定に基づきblue/greenのslotを選択し、execution-spec.jsonを確定して起動する"
    args:
      - name: "--job-id"
        required: true
        description: "ジョブスケジューラから渡されるJOB_ID"
      - name: "-- 追加引数"
        required: false
        description: "ジョブ定義に付随する追加引数"
    env_vars:
      - name: "RELAYGATE_RDB_DSN"
        required: true
        description: "RDB接続文字列"
      - name: "RELAYGATE_JOB_MAP_PATH"
        required: true
        description: "ジョブマップファイルパス"
      - name: "BLUE_MODE"
        required: true
        description: "off/background/foreground のいずれか"
      - name: "GREEN_MODE"
        required: true
        description: "off/background/foreground のいずれか"
      - name: "RAPID_CROSSCHECK_MODE"
        required: true
        description: "on/off のいずれか"
    stdin: "なし"
    stdout_contract: "blue/green選択結果とrun_idの3行テキスト"
    stderr_contract: "feature flag違反・ジョブマップ未解決時のエラーメッセージ"
    exit_codes:
      - code: 0
        meaning: "正常終了"
      - code: 1
        meaning: "業務エラー（ジョブマップ未解決・接続失敗）"
      - code: 2
        meaning: "バリデーションエラー（同時foreground・JOB_ID未指定）"
screens:
  - name: "起動slot選択画面"
    route: "/cli/concurrent-run/select-slot"
    components: ["ExecutionSpecCard", "Banner"]
