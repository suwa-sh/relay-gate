uc: "slot 実行モードを選択して runner を起動する"
business: "実装切替業務"
buc: "実装切替ジョブ実行フロー"
bounded_context_id: "BC-001"
aggregate_id: "AG-001"

models:
  - name: "JobLaunchRequest"
    tier: "tier-facade"
    layer: "presentation"
    type: "request"
    rdra_info: "ジョブ起動要求"
  - name: "LaunchSlotsCommand"
    tier: "tier-facade"
    layer: "usecase"
    type: "command"
    rdra_info: "ジョブ起動要求"
  - name: "SlotLaunchPlan"
    tier: "tier-facade"
    layer: "domain"
    type: "value-object"
    rdra_info: "slot 実行"
  - name: "ParallelRun"
    tier: "tier-facade"
    layer: "domain"
    type: "entity"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "FeatureFlagConfig"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "feature flag 設定"
  - name: "ParallelRunRepository"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "SlotExecutionRepository"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "slot 実行"
  - name: "RapidRunRepository"
    tier: "tier-facade"
    layer: "repository"
    type: "record"
    rdra_info: "速報実行(rapid_run)"
  - name: "RunnerProcessAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "slot runner 割当"
  - name: "RdbClientAdapter"
    tier: "tier-facade"
    layer: "gateway"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"

tables:
  - name: "parallel_runs"
    rdra_info: "並行稼働実行(parallel_run)"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "発行した run_id"
          - name: "parent_run_id"
            value: "NULL"
          - name: "job_id"
            value: "JOB_ID"
          - name: "parameters"
            value: "PARAM... の JSON 配列文字列"
          - name: "execution_spec_uri"
            value: "<ARTIFACT_ROOT>/facade/<run_id>/execution-spec.json"
          - name: "status"
            value: "STARTED"
          - name: "requested_at"
            value: "now(UTC)"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "RUNNING"
        where: "run_id = ? AND status = 'STARTED'"
    indexes_needed:
      - columns: ["job_id", "requested_at"]
        reason: "job_id ごとの最新 run 参照(run-lineage / 運用者調査)"
        access_pattern: "job_id で絞り requested_at 降順"
  - name: "slot_executions"
    rdra_info: "slot 実行"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "run_id"
          - name: "slot"
            value: "blue / green"
          - name: "mode"
            value: "foreground / background"
          - name: "pid"
            value: "NULL(runner 起動前に INSERT。起動後に UPDATE で設定)"
          - name: "artifact_dir"
            value: "facade/<run_id>/<slot>/"
          - name: "status"
            value: "RUNNING"
          - name: "exit_code"
            value: "NULL(終了時に更新)"
          - name: "started_at"
            value: "now(UTC)"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "pid"
            value: "runner の PID(起動後)"
        where: "run_id = ? AND slot = ?"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "FAILED(runner 起動失敗時のベストエフォート)"
          - name: "completed_at"
            value: "now(UTC)"
        where: "run_id = ? AND slot = ? AND status = 'RUNNING'"
    indexes_needed:
      - columns: ["status", "mode"]
        reason: "hang-detector / abort が background かつ RUNNING の slot を走査する"
        access_pattern: "status = 'RUNNING' AND mode = 'background'"
  - name: "rapid_runs"
    rdra_info: "速報実行(rapid_run)"
    note: "parallel_runs の INSERT と同一トランザクションで実行する(canonical C3)"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "run_id"
          - name: "completion_status"
            value: "PENDING"
        where: ""
    indexes_needed: []

kvs: []
object_storage: []
