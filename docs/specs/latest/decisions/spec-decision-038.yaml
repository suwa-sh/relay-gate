schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-038"
title: "slot ジョブマップの場所を feature flag の任意の 2 キー BLUE_JOB_MAP_CSV / GREEN_JOB_MAP_CSV に書けるようにし、書かなければ固定の名前を使う"
status: "approved"
generated_at: "2026-11-16T02:10:00Z"
context: |
  - これまでの仕様は、slot ジョブマップの場所を、設定ファイル置き場の固定の名前($RELAY_GATE_CONFIG_DIR/blue-job-map.csv / green-job-map.csv)に決めていた。
    - 場所を設定で変える手段は無かった。固定の名前にした理由は、要求・方針資料・判断記録のどこにも無い。
  - 元の方針資料:
    - 利用イメージの資料は、feature flag の設定例に、ジョブマップの場所を書く行を blue 用と green 用に 1 つずつ置く。キー名は適用側が決めた名前(語尾は _JOB_MAP_CSV)で、値は相対パス。
    - しくみの資料の設定例(9 キー)には、ジョブマップの場所の行は無い。
  - 利用者は 2026-11-16 に、次のとおり決定した: 「設定ファイルに場所を書く項目を足し、書かなければいまの固定の名前を使う形にする。相対パスの基準は設定ファイルのあるディレクトリ」。
    - 要求・アーキテクチャ・インフラ設計は、feature flag を「9 キー + 任意の 2 キー」に改めた。キー名と runner へ渡す方法は仕様で確定する、とした。
  - feature flag の runner / worker の 4 キーは、2026-11-15 の利用者決定で相対パスを受け付け、基準を設定ファイルのあるディレクトリにした(spec-decision-035)。
  - slot runner は feature-flag.env を読まない契約である。リランは元の execution-spec.json から復元し、ジョブマップを再解決しない。
  - ジョブマップを読む処理を洗い出した結果、読み手は slot runner(通常起動)と設定の検証コマンド(feature flag の検証での所在の検査、ジョブマップ単体の検証)だけだった。運用系のコマンドはジョブマップを読まない。
decision: |
  1. キー名を BLUE_JOB_MAP_CSV / GREEN_JOB_MAP_CSV に確定した。
     - 方針資料の利用イメージの設定例と同じ語尾(_JOB_MAP_CSV)にし、slot の名前はほかのキー(BLUE_* / GREEN_*)に合わせた。
     - 方針資料のキー名(適用側が決めた名前で始まる)と違う点は、利用者決定(2026-11-16)による。
  2. 2 キーは任意。キーが無い、または値が空のときは、これまでの固定の名前を使う。
     - 9 キーだけの設定(しくみの資料の設定例)は、これまでと同じジョブマップを使い、そのまま通る。
     - 既定の場所は $RELAY_GATE_CONFIG_DIR 配下のまま(検証コマンドに置き場と違う場所のファイルを渡したときも変わらない。これまでと同じ)。
  3. 値は絶対パスと相対パスのどちらも受け付ける。解決の規則は、runner / worker の 4 キーと同じ 1 つの規則を適用する。
     - 規則の正本は CLI 契約 config_files.feature-flag.env.runner_path_resolution のまま。対象を 6 キーに広げた(節の名前は、参照を変えないため変えていない)。
     - ジョブマップの場所に固有のこと(既定、使い方、表示、読み手)は、新設した job_map_location に書いた。解決の規則は複写していない。
  4. 決めた場所を、ジョブマップを読むすべての処理で同じに使う。
     - feature flag の検証: 所在の検査、stdout の blue_job_map / green_job_map の行、error: job map not found の map=。
     - ジョブを起動するコマンド: 起動する slot ごとに場所を決め、runner へ環境変数 BLUE_JOB_MAP_CSV / GREEN_JOB_MAP_CSV(自 slot の分)で渡す。キーが無い・空のときも既定の場所を渡す。
     - slot runner: 受け取った値をそのまま使う。未設定・空のとき(ジョブを起動するコマンドを介さない起動)は既定の場所を使う。feature-flag.env は読まない。
     - リランのコマンドと復元起動の runner: ジョブマップを読まないため、2 キーを読まず、渡さない。
     - ジョブマップ単体の検証(--job-map)は、渡されたパスを検証する動きのまま変えていない。
  5. runner へ渡す方法を環境変数にした理由: 既存の引き継ぎ(実装版 BLUE_IMPL / GREEN_IMPL、速報クロスチェック runner の解決後のパス)と同じ形で、runner IF の引数を変えずに済む。
  6. 細部(利用者決定と要求より踏み込んで決めたこと。正本は CLI 契約の job_map_location):
     - mode が off の slot のキーは、値を解決せず、所在も検査しない(off の slot の実装版・runner のキーと同じ扱い)。mode の値が列挙外・欠落・空の slot は off でないとして検査する。
     - 値の内容(拡張子・ファイル名)は検査しない。blue と green に同じ場所を書いてもよい。
     - ジョブを起動するコマンドは、キーが無い・空のときも既定の場所を runner へ渡す(常に空でない値)。ジョブを起動するコマンドのプロセスの環境に同じ名前の変数があっても、その値は使わない。runner が読むのは自 slot の変数だけ。
     - runner は、環境変数が未設定・空のとき(ジョブを起動するコマンドを介さない起動)に既定の場所を使う。
     - 既定の場所は、検証コマンドに置き場と違う場所のファイルを渡したときも、設定ファイル置き場の配下とする(渡したファイルのあるディレクトリではない)。
     - ジョブマップを読む処理を足すときの規則(下の 8)。
  7. 「9 キー」と書いていた箇所を「9 キー + 任意の 2 キー」に揃えた。
     - 未知キーの warn の範囲(9 キーと任意の 2 キーのどちらでもなく、FINAL_ で始まらないキー)。
     - 値を取り込むキーの範囲と、読み取りの途中の一時的な保持の記述(2026-11-15 の決定。spec-decision-036)。
     - error 行の順での位置(対応ジョブマップは最後の 6 番目のまま)、検証ルール。
  8. ジョブマップを読む処理を足すときの規則を 1 つに決めた: 固定の名前を直接組み立てず、feature-flag.env の 2 キーを読んで同じ規則で場所を決める。
  9. 実装との差分(実装済みの feature flag の検証コマンド):
     - 現在の実装は 9 キーを前提にしており、BLUE_JOB_MAP_CSV / GREEN_JOB_MAP_CSV を書くと未知キーの warn を出す。
     - 所在の検査と表示は、固定の名前($RELAY_GATE_CONFIG_DIR 配下)のジョブマップだけを対象にする。2 キーの値を読まず、解決もしない。
     - 新しい契約では、2 キーを未知キーにせず、値を取り込み、解決した場所で所在を検査し、stdout と error 行にその場所を出す。
     - 仕様を正とし、実装は次の実装の回で契約に合わせる。この判断記録では実装を変えていない。
     - ジョブマップ単体の検証(--job-map)と、比較ツール起動コマンドの検証は、契約が変わらないため実装の変更は無い。
  10. 判定する BDD を、該当する UC に置いた。
      - feature flag を設定する: キーを書いた場合、書かない場合、値が空の場合、片方だけ書いた場合、相対パスの場合、書いた場所にジョブマップが無い場合、off の slot のキー、未知キーにならないこと。
      - ジョブマップで JOB_ID から実行先を解決する / slot 実行モードを選択して runner を起動する: ジョブを起動するコマンドが場所を渡し、runner が受け取った場所のジョブマップで解決する場面。
      - slot ごとのジョブマップを定義する: ジョブマップ単体の検証が、渡されたパスを検証する場面。
consequences:
  positive:
    - "方針資料の利用イメージの設定例(feature flag にジョブマップの場所を相対パスで書く)を表せる"
    - "ジョブマップを設定ファイル置き場以外に置ける。既存の設定(9 キーだけ)はそのまま動く"
    - "検証コマンドと実行時の読み手で、同じ設定から同じジョブマップが選ばれる"
    - "パスの解決の規則が 1 つで、runner のキーとジョブマップのキーで結果が食い違わない"
  negative:
    - "runner_path_resolution という節の名前が、ジョブマップのキーも対象にしていることを表さない"
    - "ジョブを起動するコマンドを介さずに runner を起動した場合、feature flag に書いた場所は使われず既定の場所になる"
alternatives_considered:
  - name: "キー名を方針資料の利用イメージのとおり適用側が決められるようにする"
    reason_rejected: "キー名が決まらないと、検証コマンドが未知キーと区別できない。利用者決定(2026-11-16)で slot の名前に合わせた"
  - name: "slot runner が feature-flag.env を読んで場所を決める"
    reason_rejected: "slot runner は feature-flag.env を読まない契約のまま、という要求に反する。自作の runner にも解決の規則を実装させることになる"
  - name: "runner IF に引数(--job-map)を足す"
    reason_rejected: "runner IF の版が変わり、自作の runner と検証の問い合わせに影響する。既存の引き継ぎと同じ環境変数で足りる"
  - name: "解決の規則をジョブマップ用に別の節へ書く"
    reason_rejected: "同じ規則を 2 か所に書くと、片方だけ直されて食い違う。1 つの規則を 6 キーに適用する書き方にした"
