  work_unit_ids: ["CR-6078c4ed-011#1","CR-6078c4ed-012#1","CR-6078c4ed-013#1","CR-6078c4ed-014#1","CR-6078c4ed-015#1","CR-6078c4ed-016#1","CR-6078c4ed-017#1","CR-6078c4ed-018#1"]
context: |
  実装フェーズ（distillery-impl、UC 6078c4ed）で、ジョブマップの形式（JSON / YAML、トップレベル構造、job ごとの
  必須フィールド、hang_detect_limit_minutes の位置）と credential_ref の解決方法がどの正本にも無いことが判明した
  （CR-6078c4ed-017 / CR-6078c4ed-018）。実装は限定検証境界として blue / green を 1 ファイルに持つ JSON を採用し、
  credential_ref は保存するだけで SSH 鍵の解決に使っていなかった。tier-facade と tier-worker で別の環境変数体系
  （RELAYGATE_JOB_MAP_PATH / RELAYGATE_SSH_KEY_PATH）になっており、同じ slot へ 2 通りの認証設定を運用する
  懸念があった。

  blue と green は別ライフサイクルでメンテナンスされる。1 ファイルを両 slot で共有すると片方の変更が他方の
  リリースと競合し、run 共通の job_map_version では「どちらの slot の変更か」を表せない。
decision: |
  ジョブマップは slot ごとの独立した JSON ファイルとし、cli-command-contract.yaml のトップレベル
  `job_map_contract` を正本とする。環境変数は RELAYGATE_JOB_MAP_PATH_BLUE / RELAYGATE_JOB_MAP_PATH_GREEN
  （起動対象 slot の分だけ必須。mode=off の slot は読まない）。旧 RELAYGATE_JOB_MAP_PATH は廃止する。
  各ファイルは job_map_version / slot_type / jobs を持ち、job ごとに host / exec_user / script_path / work_dir /
  impl_version / hang_detect_limit_minutes を必須、fixed_args / credential_ref を任意とする。未知フィールドは
  無視し、その値を RDB・監査・標準出力・標準エラー・起動イベントへ出さない。必須欠落・型不正・slot_type 不一致は
  exit 2、jobs に JOB_ID が無い場合は exit 1 とし、いずれも transaction 開始前に検証して RDB へ書かない。

  job_map_version は execution_specs（run 共通）から slot_execution_specs（slot 別）へ移動し「その slot の実行先
  解決に使用したジョブマップの版」とする。run 共通の execution_specs.hang_detect_limit_minutes には background
  role に選ばれた slot のジョブマップ値を採用し、両 slot が background の場合は大きい方（誤検知を避ける保守的な
  選び方）、background が無い場合は起動対象の唯一の slot の値を採用する。

  credential_ref は認証情報ディレクトリ方式で解決する（cli-command-contract.yaml `credential_resolution`）。
  RELAYGATE_CREDENTIAL_DIR/{credential_ref} を SSH 秘密鍵とし、credential_ref が null のときだけ
  RELAYGATE_SSH_KEY_PATH（既定鍵、任意）を用いる。credential_ref の書式は ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ に
  限定してディレクトリ外参照を防ぐ。facade（起動・中止・リラン）と worker（background 起動）で同じ契約を適用し、
  鍵の実値は RDB・監査・標準出力・標準エラー・起動イベントに現れない。
consequences:
  positive:
    - "片方の slot のジョブマップだけを差し替えて新世代実装を起動でき、版の記録が slot 単位で追跡できる"
    - "運用者が契約だけからジョブマップを作成でき、欠落時の終了コードと stderr 文言が E2E Scenario として書ける"
    - "facade / worker / リランが同じ認証情報解決契約を実装でき、認証情報の非露出を同じ方法で検証できる"
  negative:
    - "RDRA 情報.tsv の execution-spec.json 属性「マップ版」の配置と食い違うため、requirements 側の差分更新が必要（rdra-feedback.md #2）"
    - "ジョブマップを 2 ファイル管理する運用手順が増える"
alternatives_considered:
  - name: "1 ファイルに blue / green を併記する現行形式を契約化する"
    reason_rejected: "slot のライフサイクルが異なり、片方の変更が他方のリリースと競合する。版の記録も slot を表せない"
  - name: "ssh_config の Host エイリアス方式で credential_ref を解決する"
    reason_rejected: "認証設定がジョブマップ外の ssh_config に分散し、facade / worker で同一設定を保証できない。feedback request の採用案で不採用と明示された"
  - name: "両 slot が background の場合に小さい方の hang_detect_limit_minutes を採用する"
    reason_rejected: "並行稼働では blue / green の実行時間差が想定され、小さい方では正常な長時間実行をハング疑いとして誤検知しやすい"
