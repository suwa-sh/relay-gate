schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-003"
title: "RDB正規化レベル: 第3正規形を基本とし、event_snapshot型エンティティはhistory+snapshotの非正規化を許容"
status: "approved"
generated_at: "2026-08-17T15:58:17+09:00"
context: |
  arch-design.yaml のdata_architecture.entitiesでは、Runner実行結果(E-002)・速報比較依頼(E-003)・確報比較依頼(E-005)が
  model_type: event_snapshot と定義され、app_architecture.tier_layersのLR-002/LR-007（Event/Snapshot併用パターン）は
  「repository.save は historyAdapter.insert + snapshotAdapter.upsert を実行する」と明記している。
  一方、hang-detectorやクロスチェック結果確認等の読み取り系UCは、頻繁なポーリング（CronJob定期実行）で最新状態を
  参照する必要があり、CTP-009（CLI応答10秒以内、10TPS目安）の性能制約がある。
decision: |
  `_cross-cutting/datastore/rdb-schema.yaml` の全7テーブル（execution_specs, runner_results, rapid_crosscheck_requests,
  rapid_crosscheck_results, final_crosscheck_requests, hang_detections, audit_logs）は第3正規形を基本とする。
  ただしevent_snapshot型のエンティティ（runner_results, rapid_crosscheck_requests, final_crosscheck_requests）は、
  最新状態をそのままカラムに保持する「スナップショットキャッシュ」として設計し（別テーブルへの正規化された履歴分離は
  今回のSpecでは行わず、statusカラムの直接更新で表現する）、状態遷移の都度上書きすることで頻繁な参照系クエリの
  性能を優先する。この判断はLR-002/LR-007のEvent/Snapshot併用パターンの「スナップショット」側を採用し、
  「履歴（history）」側の別テーブル化は本Specの範囲外（実装フェーズでの追加検討事項）とする。
consequences:
  positive:
    - "hang-detector・クロスチェック結果確認等の高頻度な状態参照が単一行のSELECTで完結し、CTP-009の性能目標を満たしやすい"
    - "状態遷移の整合性検証（LP-003/LP-007）をアプリケーション層のドメインロジックに集約でき、DB設計をシンプルに保てる"
  negative:
    - "状態遷移の完全な履歴（いつ・誰が・どの状態からどの状態へ遷移したか）はRDBスキーマ上に残らず、監査ログ（audit_logs、CTP-005対象操作のみ）でしか追跡できない。全状態遷移の完全な監査証跡が必要になった場合は、別途history用テーブルの追加設計が必要"
    - "実装フェーズ（ddd-tactical-implementation）でrepository.saveのhistoryAdapter.insert部分を実装する際、本Specにはhistory用テーブル定義が無いため追加設計が必要になる"
alternatives_considered:
  - name: "第3正規形を厳格に維持し、状態遷移イベントをすべて別テーブル（event log）に追記専用で記録し、現在状態はビューで導出する"
    reason_rejected: "hang-detectorの1分間隔ポーリング等、頻繁な現在状態参照のたびにevent logの集計クエリが必要になり、CTP-009の性能目標（CLI応答10秒以内）を満たしにくい"
  - name: "execution-spec.jsonの内容もRunner実行結果テーブルに冗長保持する積極的非正規化"
    reason_rejected: "実行設定変更時の整合性維持コストが増し、SR-004（データ移行量は限定的）の前提とも整合しない過剰な非正規化"
