  request_ids: ["CR-6078c4ed-011","CR-6078c4ed-012","CR-6078c4ed-013","CR-6078c4ed-014","CR-6078c4ed-015","CR-6078c4ed-016","CR-6078c4ed-017","CR-6078c4ed-018"]
  work_unit_ids: ["CR-6078c4ed-011#1","CR-6078c4ed-012#1","CR-6078c4ed-013#1","CR-6078c4ed-014#1","CR-6078c4ed-015#1","CR-6078c4ed-016#1","CR-6078c4ed-017#1","CR-6078c4ed-018#1"]
context: |
  rdb-schema.yaml は論理型（uuid / string / text / integer / datetime）のみを定義し、PostgreSQL の物理型と
  datetime の精度を定義していなかった（CR-6078c4ed-015）。独立検証で、秒精度の occurred_at では同一秒内の
  イベント順序が定まらず履歴順序のテストが不安定に失敗した。migration の正本（worker/migrations/）は未整備で、
  他 tier がテスト用 DDL を rdb-schema.yaml から独自に生成しており、tier 間で型・精度が分岐する余地があった。

  additional_args / fixed_args の保存形式も未定義で、実装は bash の %q でクォート連結した 1 文字列を採用していた
  （CR-6078c4ed-014）。読み手（background 起動 UC、リラン UC）が別形式を採ると空白・引用符・改行を含む引数が壊れる。
decision: |
  rdb-schema.yaml のトップレベルに `physical_type_mapping`（uuid→uuid、string→text、text→text、integer→integer、
  datetime→timestamptz、date→date）を定義し、migration（datastore 所有 tier）とテスト fixture の DDL は
  この対応表を唯一の入力として生成する。

  `datetime_rules` として、精度はマイクロ秒（timestamptz の既定精度 6 を落とさない）、基準は UTC、表現は ISO 8601
  の `YYYY-MM-DDTHH:MM:SS.ffffffZ` とする。同一 transaction で記録する複数の時刻カラム（accepted_at / occurred_at /
  updated_at、audit_logs.occurred_at / audit_chain_heads.updated_at）は同一値にし、同一 transaction 内で連続して
  記録するイベントには単調増加する occurred_at を与えて同一秒内の順序を一意にする。`uuid_rules` として
  uuid 型カラムの識別子は RFC 4122 形式の文字列（run_id / event_id / detection_id は version 4 で発番）とする。

  `argument_serialization` として、execution_specs.additional_args と slot_execution_specs.fixed_args は
  JSON 配列（要素は文字列）で保存し、復元は要素順をそのまま argv とする。空白・引用符・改行・バックスラッシュを
  含む引数の往復が同一であることを要件に含め、bash %q などシェル専用の 1 文字列表現は採用しない。
consequences:
  positive:
    - "migration と各 tier のテスト DDL が同じ対応表から生成でき、型・精度の tier 間分岐が無くなる"
    - "同一秒内の履歴イベントの順序が occurred_at だけで一意に決まり、時刻カラム間の一致契約を実 PostgreSQL で検証できる"
    - "書き手と読み手が同じ復元規則を実装でき、空白・引用符・改行を含む引数の往復テストを仕様値で書ける"
  negative:
    - "既存の空白区切り文字列を前提にした E2E Scenario の期待値を JSON 配列へ書き換える必要がある（本イベントで実施）"
    - "JSON 配列の生成・解析に jq 等の依存が必要になる（エアーギャップ環境で配布可能な範囲に限定する）"
alternatives_considered:
  - name: "bash %q クォート連結の 1 文字列を保存形式として契約化する"
    reason_rejected: "bash 専用の表現であり、JavaScript 製のテストハーネスや将来の別実装から可逆に復元できない"
  - name: "datetime を秒精度（timestamp(0)）にする"
    reason_rejected: "同一秒内のイベント順序が定まらず、occurred_at を順序基準とする履歴契約が成立しない"
  - name: "物理型を migration 側だけで決め、rdb-schema.yaml は論理型のみとする"
    reason_rejected: "migration 未整備の間にテスト fixture を書く tier が独自に型を選び、正本が二重化する"
