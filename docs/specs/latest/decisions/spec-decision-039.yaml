schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-039"
title: "ジョブを起動するコマンドは、設定の違反が 2 つ以上あるとき、検証コマンドの error 行の順で最初の違反の 1 行だけを出す"
status: "approved"
generated_at: "2026-11-16T02:10:00Z"
context: |
  - feature flag の検証コマンド(validate-config.sh --feature-flag)の error 行どうしの順は、2026-11-15 に CLI 契約の error_order に定めた。対象は検証コマンドだけだった。
  - ジョブを起動するコマンド(facade.sh)は、設定の検証エラーを error 1 行で出す契約である。
    - 違反が 2 つ以上ある設定で、どの違反の 1 行を出すかが 1 つに決まっていなかった。
    - UC「slot 実行モードを選択して runner を起動する」は、検査を「列挙 → foreground → 必須キーの存在 → 実体パス」の順で書く一方、検証コマンドと同じ検証関数を使うとも書いていた。
    - たとえば BLUE_RUNNER の実体が無く GREEN_IMPL が欠落の設定で、出る 1 行が食い違った。
  - この未決は 2026-11-15 に課題一覧に記録した。元の方針資料に記載は無い。
  - 利用者は 2026-11-15 に、次のとおり決定した: 「検証コマンドと同じ順で、最初の違反を 1 行出す」。
decision: |
  1. ジョブを起動するコマンドは、feature flag の設定のキーごとの検査で違反が 2 つ以上あるとき、検証コマンドの error 行の順で最初に出る違反の error 行(その行に hint が続くときは hint も)だけを出し、runner を起動せずに終了コード 2 で終わる。
     - 正本は CLI 契約の commands「facade.sh」の config_violation_report(新設)。順そのものは error_order のまま(複写していない)。
     - 違反が 1 つのときも同じ規則で、その 1 行を出す。
  2. ジョブを起動するコマンドが検査する項目は、error_order の 1〜5(mode、foreground の個数、実装版と runner、速報クロスチェックの実体、FINAL_ で始まるキー)。
     - 6 番目の対応ジョブマップは、ジョブを起動するコマンドでは検査しない(これまでどおり、不在は slot runner が Runner Result で返す)。
  3. 細部(利用者決定より踏み込んで決めたこと):
     - 未知キーの warn 行は、error 行の有無によらず、error 行より前に全件出す(検証コマンドと同じ並び)。
     - 入力の守備範囲の違反(バイト・改行、invalid line、同じキーの重複)は、この規則の対象外で、これまでどおり検証コマンドと同じ順・同じ件数で全件出す。
     - 起動時の検査の順は、引数 → feature flag の存在・読み取り → 入力の守備範囲 → キーごとの検査 → 速報クロスチェック設定。先の検査で止まったら後の検査は行わない。
  4. UC「slot 実行モードを選択して runner を起動する」の検査の順の記述を、この規則を参照する形に直した。
     - 「列挙 → foreground → 必須キーの存在 → 実体パス」という独自の順は持たない。
  5. 課題一覧の該当の記録は、リランのコマンドの決定(spec-decision-040)と合わせて、決定済みとして閉じた。
  6. 判定する BDD を、UC「slot 実行モードを選択して runner を起動する」に置いた(違反が 2 つある設定で、順の先の違反の 1 行だけが出る場面)。
  7. 実装との関係: ジョブを起動するコマンドは、まだ実装していない。実装済みの設定の検証コマンドの出力は変わらない。
consequences:
  positive:
    - "違反が 2 つ以上ある設定で、ジョブを起動するコマンドの標準エラーが 1 つに決まる"
    - "検証コマンドの出力の先頭と同じ行が出るため、利用者が検証コマンドで続きを確かめられる"
  negative:
    - "ジョブを起動するコマンドだけでは、2 つ目以降の違反は分からない(検証コマンドで確かめる)"
alternatives_considered:
  - name: "ジョブを起動するコマンドも違反を全件出す"
    reason_rejected: "ジョブスケジューラへ中継する経路の標準エラーを error 1 行に保つ契約に反する。利用者決定は 1 行"
  - name: "UC の検査の順(列挙 → foreground → 必須キーの存在 → 実体パス)を正にする"
    reason_rejected: "検証コマンドと順が食い違い、同じ設定で先頭の行が変わる。利用者決定は検証コマンドと同じ順"
