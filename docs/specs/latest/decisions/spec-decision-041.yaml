artifact_id: "spec-decision-041"
title: "入力の複製の作業名は、プロセスの番号を含むテンプレートを mktemp に渡して作る"
status: "approved"
generated_at: "2026-11-23T20:10:00Z"
context: |
  - 設定ファイルを読む処理(検証コマンド、ジョブを起動する入口、slot runner)は、入力を一時ファイルへ 1 回複製してから読む(CLI 契約 config_input_rules.snapshot)。
  - これまでの契約の例は、X の並びが名前の末尾に無いテンプレート(`relay-gate-` + X の並び + `.part`)を mktemp に渡す形だった。
    - X の並びが末尾に無いと X を置き換えない mktemp(BSD 系)では、作業名が毎回同じになる。
    - 開発機では、blue と green の slot runner がほぼ同時に動いたとき、後から来たほうの複製が「既にある」で失敗した。
  - 「最終名を先に mktemp で確保しない」定めがあるため、X を末尾に置いて最終名を作る素直な回避ができず、`relay-gate-` と `.part` の間の名前の決め方は実装者が決めていた。
  - 実装は、テンプレートを `relay-gate-<プロセスの番号>-XXXXXX.part` に変えて回避し、同じシナリオを 20 回流して失敗 0 回だった。
  - 元の方針資料は「一時ファイルへ出力してから確定名へリネームできる」と書くだけで、名前の決め方の記載は無い。
  - 利用者は 2026-11-23 に案 A(いまの実装の形に直す)を選んだ。
decision: |
  1. 作業名は、テンプレート `relay-gate-<プロセスの番号>-XXXXXX.part` を mktemp に渡して作る。名前の確保とファイルの作成は mktemp の 1 回の操作のまま(既にある名前は作らずに失敗する)。
     - 正本は CLI 契約 config_input_rules.snapshot.work_name(新設)。validate_config からは参照だけにした。
     - 例は `pid=$BASHPID` の後に `work=$(mktemp "${TMPDIR:-/tmp}/relay-gate-${pid}-XXXXXX.part")`。
  2. プロセスの番号は、サブシェルでも別の値になるもの(bash の BASHPID)。コマンド置換の中で取らない(子プロセスの番号になる)。先に変数へ取り出す。
  3. X を置き換える mktemp(GNU)では X の部分も名前に加わる。X を置き換えない mktemp(BSD 系)では、名前はプロセスの番号だけで決まる。どちらでも、同時に動く別のプロセスの作業名は別々になる。
  4. 作った作業名は移し替えずにそのまま使い、書き終えたら末尾の `.part` を外した最終名へ同一ディレクトリ内で rename する。最終名は作業名から決まるので、「最終名を先に mktemp で確保しない」定めはそのまま残り、両立する。
  5. 1 つのプロセスが同時に持つ入力の複製は 1 つまでと書き添えた(作る → 読む → 消す を 1 つずつ行い、消してから次を作る)。
     - 理由: X を置き換えない mktemp では、同じプロセスの 2 つ目の作業名が 1 つ目と同じになり、「既にある」で失敗する。
     - いまの実装はこの順で動いている。
  6. 一時ファイルへの複製で 1 時点の内容を保証する実行時の読み手(slot runner など)にも、同じ規則を適用する(snapshot.runtime_readers)。衝突が起きたのは slot runner どうしだったため。
  7. X の並びが末尾に無く、プロセスの番号も含まないテンプレートの例は、仕様のどこにも残さない。
  8. 予測可能性の代償を受け入れる(snapshot.work_name.predictability)。
     - X を置き換えない mktemp では作業名を予測できる。同じ一時ディレクトリに書き込める別の利用者が先に同じ名前のファイルを置くと、複製は失敗する(入力の複製の失敗。終了コード 6)。
     - 影響は複製の失敗までで、内容を読まれたり、すり替えられたりはしない(作成は既にあれば失敗し、権限は所有者だけの 0600)。
     - 受け入れる理由: 実装とテストを変えずに、どの mktemp でも同時に動くプロセスの名前が分かれる。乱数の一時ディレクトリを作る案は、実装とテストの待ち方(最終名の出現の監視)の見直しが要る。利用者は、この代償を承知のうえで案 A を選んだ(2026-11-23)。
consequences:
  positive:
    - "どの mktemp でも、同時に動く複数のプロセスの作業名が別々になる"
    - "仕様の例をそのまま使っても、X を置き換えない mktemp で衝突しない"
    - "実装とテストを変えない"
  negative:
    - "X を置き換えない mktemp では作業名を予測でき、同じ一時ディレクトリに書き込める別の利用者が複製を失敗させられる(内容は守られる)"
    - "1 つのプロセスが同時に 2 つの複製を持てない(読み手の作りがこの順に縛られる)"
alternatives_considered:
  - name: "一時ディレクトリを mktemp で作り(テンプレートの末尾に X を置く)、その中に作業名と最終名を置く"
    reason_rejected: "名前は予測できなくなるが、実装とテストの変更が要る。「ファイル名が relay-gate- で始まる」「最終名が現れたら複製済み」というテストの待ち方も見直しになる。利用者決定(2026-11-23)は案 A"
  - name: "名前の決め方は実装に任せ、満たす条件だけを書く"
    reason_rejected: "条件を満たすかどうかの確認が読み手ごとに要り、仕様から名前の決め方が 1 つに決まらない"
