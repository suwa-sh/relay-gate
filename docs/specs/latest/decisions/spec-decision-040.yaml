artifact_type: "decision_record"
skill_type: "specification"
artifact_id: "spec-decision-040"
title: "リランのコマンドは、起動の前に runner / worker の実体を検査せず、起動に失敗したら終了コード 6 にする"
status: "approved"
generated_at: "2026-11-16T02:10:00Z"
context: |
  - リランのコマンド(background-rerun.sh)は、feature flag の設定から、速報クロスチェックのモードと、起動する runner、runner へ渡す速報クロスチェック runner を読む。
  - リランのコマンドが feature flag の設定の違反を見つけたときの扱い(検査するキーの範囲・終了コード・事前検証との前後)は、CLI 契約に無かった。
    - これまでの契約は、読み手ごとの検査の範囲の節で、リランのコマンドを「ジョブを起動するコマンド・検証コマンドと同じく、検証ルールのとおりに検査する」側に並べていた。
    - 一方、UC の仕様には、runner の起動に失敗したときの扱い(終了コード 6、成果物、管理 DB)が既にあった。
  - この未決は 2026-11-15 に課題一覧に記録した。元の方針資料に記載は無い。
  - 利用者は 2026-11-15 に、次のとおり決定した: 「起動の前に 4 項目(runner / worker の 4 キー)の実体を検査せず、起動に失敗したら終了コード 6 にする」。
  - 終了コード 6 の既存の意味は「実行エラー」で、runner の起動失敗を含む(ジョブを起動するコマンドも同じ)。利用者決定の「6」と矛盾しない。
decision: |
  1. リランのコマンドは、起動の前に runner / worker の 4 キーの実体(存在・実行権限・--help の応答)を検査しない。
     - 正本は CLI 契約の commands「background-rerun.sh」の feature_flag_reading(新設)。
     - 相対パスの解決は、runner / worker の 4 キーの規則どおりに行う(起動・受け渡し・表示に解決後のパスを使う)。
  2. runner の起動に失敗したとき(解決後のパスに何も無い、通常ファイルでない、実行権限が無い)は、終了コード 6 で終わる。
     - error 行は既存の文言のまま: `error: runner failed to start run_id=<新 run_id> role=<role> runner=<解決後のパス>`。
     - 残すものも既存の規則のまま: 新しい実行の execution-spec.json、slot の成果物ディレクトリの started-at.txt / 空の stdout.log / stderr.log(同じ error 行)/ exitcode.txt(6)。速報クロスチェックが off 以外なら、起動前に登録した slot 実行の行を FAILED に閉じ、並行稼働実行の行は STARTED のまま残す。
     - 新しい文言・新しい終了コードは足していない。
     - 細部(利用者決定より踏み込んで決めたこと): 「起動の前に検査しない」が指すのは、設定の検査の段で実体を調べ、新しい実行を作る前に終了コード 2 で止めること。起動の失敗は「解決後のパスの runner を OS が実行できなかったこと」と定め、起動の時点で確かめられる 3 つ(何も無い、通常ファイルでない、実行権限が無い)に限った。見分ける手段は縛らない(起動の時点でパスを確かめるのは、起動の失敗の検出に当たる)。3 つに当たらない runner は起動したものとして扱い、その後にプロセスが終了した場合(runner 自身がすぐ終了した場合、ファイルの形式やシバンのインタプリタの不備で終わった場合を含む)は起動の失敗に数えず、リランのコマンドは終了を待たずに終了コード 0 で終わる(結果は成果物とハング検知が扱う)。3 つに限った理由: 終了を待たない規則のもとで、追加の判断なしに見分けられる範囲にするため。
  3. リランのコマンドが feature flag の設定から読むキーの範囲を明記した。
     - blue / green のリラン: 速報クロスチェックのモード、リラン対象の slot の runner、速報クロスチェックが off 以外のときの速報クロスチェック runner。
     - 速報クロスチェックの依頼の再作成: 速報クロスチェックのモードだけ。
     - それ以外のキー(リラン対象でない slot の runner、slot のモード、実装版、速報クロスチェック worker、ジョブマップの場所)は使わず、値を取り込まない。
  4. 読めない・形式が不正なときの扱いを、ほかの実行時の読み手と揃えた(利用者決定より踏み込んで決めたこと)。
     - 設定ファイルが無い・読めない、入力の守備範囲の違反: ほかの読み手と同じ文言で終了コード 2。
     - 速報クロスチェックのモードが無い・空・列挙外: ハング検知など、モードだけを読む読み手と同じ文言で終了コード 2。
     - 読むキー(リラン対象の slot の runner、速報クロスチェック runner)が無い・値が空: `error: option required option=<KEY> path: ...` で終了コード 2。値の有無の検査であり、実体の検査ではない。
     - 速報クロスチェックが off 以外のときの速報クロスチェック設定(管理 DB 接続の参照名)が無い・読めない・参照名が無い: ジョブを起動するコマンドと同じ文言で終了コード 2。位置は feature flag の設定の検査の直後、事前検証の前(これまで順が書かれていなかった)。
     - 違反が 2 つ以上あるときは、モード → runner → 速報クロスチェック runner → 速報クロスチェック設定 の順で最初の 1 つだけを出す。
     - 検査しないもの: 実体、使わないキー、mode の組合せ、未知キー、FINAL_ で始まるキー。設定全体の検証は、検証コマンドとジョブを起動するコマンドが行う。
  5. 検査の順: 引数 → feature flag の設定の読み取りと検査(終了コード 2)→ 速報クロスチェックが off 以外のときの速報クロスチェック設定(終了コード 2)→ 事前検証(終了コード 3)→ 復元起動または依頼の再作成。
     - 設定の誤りは、元の実行の状態を読む前に終了コード 2 で止める(終了コード 2 は「状態を読まない」入力・設定の誤り、という既存の分類に合わせた)。
  6. 読み手ごとの検査の範囲の節から、リランのコマンドを「検証ルールのとおりに検査する」側から外し、自分が読むキーだけを検査する読み手として書き直した。
  7. 課題一覧の該当の記録は、ジョブを起動するコマンドの決定(spec-decision-039)と合わせて、決定済みとして閉じた。
  8. 判定する BDD を、UC「元の execution-spec.json から復元して新しい run_id で起動する」と UC「リラン対象を検証する」に置いた。
     - UC「リラン対象を検証する」: 検査の順を判定する場面(feature flag の設定が無い、設定の検査を通った後の事前検証、runner のキーが無い設定での速報クロスチェックの依頼の再作成、速報クロスチェック設定が無い、管理 DB 接続の参照名が無い)。
     - UC「元の execution-spec.json から復元して新しい run_id で起動する」(下の 3 場面に加えて): 解決後のパスがディレクトリの場面、起動した runner がすぐ非 0 で終わる場面、違反が 2 つある設定の場面。
     - 実体が無い runner を起動の前に検査せず、起動して失敗し終了コード 6 になる場面。
     - リラン対象でない slot の runner や速報クロスチェック worker の実体が無くても、リランが成功する場面。
     - 読むキーが無い設定を終了コード 2 で止める場面。
  9. 実装との関係: リランのコマンドは、まだ実装していない。
consequences:
  positive:
    - "リランのコマンドが起動の前に何を検査するかが 1 つに決まる"
    - "リラン対象でない slot の設定の不備で、リランが止まらない"
    - "起動失敗の扱いは既存の規則のままで、ハング検知が実行エラーとして拾える成果物が残る"
  negative:
    - "runner の実体の不備は、新しい実行の成果物と管理 DB の行を作った後に分かる(失敗した実行が系譜に 1 つ残る)"
    - "feature flag の設定全体の誤り(未知キーなど)は、リランのコマンドでは分からない(検証コマンドで確かめる)"
alternatives_considered:
  - name: "起動の前に 4 キーの実体を検査して終了コード 2 で止める"
    reason_rejected: "利用者決定(2026-11-15)に反する。リランに関係しないキー(速報クロスチェック worker、リラン対象でない slot の runner)の不備でリランが止まる"
  - name: "読むキーが無い・空のときも、起動してみて終了コード 6 にする"
    reason_rejected: "起動する実体のパスが決まらず、error 行の runner= と成果物に書く内容が定まらない。値の有無は設定の誤りとして、状態を作る前に終了コード 2 で止める"
