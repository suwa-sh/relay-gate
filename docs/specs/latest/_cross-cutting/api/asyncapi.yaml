asyncapi: "3.0.0"
id: "urn:relay-gate:async-events"
info:
  title: "relay-gate 並行稼働実行基盤 Async Events"
  version: "1.0.0"
  description: |-
    relay-gate の非同期連携を契約化する(_inference.md 採用値 #4)。
    メッセージブローカーは無く、実体は (1) relay-gate 内部のジョブキュー兼管理 DB(RDB)の依頼テーブルを poll / claim / lease で回す RDB ジョブキュー、
    (2) slot runner から速報クロスチェック runner(feature flag の RAPID_CROSSCHECK_RUNNER で解決する実体)への同期プロセス起動による完了通知、の 2 種である。
    ハング検知の通知は hang-detector.sh 自身の終了コードと標準エラーの alert 行(CLI の出力)で行い、非同期メッセージとしては扱わない(cli-command-contract.yaml shared_rules.hang_alert)。
    CLI コマンド契約は cli-command-contract.yaml を正本とする。エアーギャップ環境のため外部 SaaS・ネットワークブローカーは使わない。
  contact:
    name: "relay-gate"
  license:
    name: "MIT"

servers:
  management_db:
    host: "placeholder"
    protocol: "rdb-queue"
    description: "relay-gate 内部データストアのジョブキュー兼管理 DB(RDB)の依頼テーブルをジョブキューとして使う(外部システムではない)。接続先は *_DB_CONN_REF(参照名)で解決する。RAPID_CROSSCHECK_MODE=off では速報側のキューは存在しない"
  local_process:
    host: "localhost"
    protocol: "process"
    description: "同一ホスト上の同期プロセス起動(slot runner → RAPID_CROSSCHECK_RUNNER <role>-completed。実体パスは facade / background-rerun が環境変数 RAPID_CROSSCHECK_RUNNER で runner へ渡す)。RAPID_CROSSCHECK_MODE が off 以外(foreground / background)のときのみ"
channels:
  slot-completed:
    address: "rapid-crosscheck-runner.sh {role}-completed"
    title: "slot 完了通知"
    summary: "slot runner が Runner Result 3 ファイル(exitcode.txt)公開後に、自系統の公開 function(blue-completed / green-completed)を同期起動して完了結果を送る"
    description: |-
      実体は CLI 引数(--run-id / --job-id / --exit-code)で渡す同期プロセス起動。起動する実体は feature flag の RAPID_CROSSCHECK_RUNNER(runner は環境変数で受け取る)。
      RAPID_CROSSCHECK_MODE=off では publish しない(foreground / background は同じ挙動)。
      条件「完了通知失敗の扱い」: 送信失敗は自動検知しない。slot runner は実行ログに WARN completion notice failed を残し、Runner Result と終了コードは変更しない(exitcode.txt の値をそのまま返す)。
      復旧は運用者が RAPID_CROSSCHECK_RUNNER を同一引数で再実行する(冪等・先勝ちで完了結果は一度だけ登録)。
      受信側(速報クロスチェック runner)は rapid_runs の自系統列を更新し、両系成功なら rapid-crosscheck-requests へ依頼を作成する。
    servers:
      - $ref: "#/servers/local_process"
    parameters:
      role:
        description: "通知元の系統"
        enum: ["blue", "green"]
    messages:
      SlotCompletedNotice:
        $ref: "#/components/messages/SlotCompletedNotice"
  rapid-crosscheck-requests:
    address: "rapid_crosscheck_requests"
    title: "速報比較依頼キュー"
    summary: "管理 DB の rapid_crosscheck_requests テーブル。run_id 主キーで 1 件だけ INSERT(重複依頼を作らない)"
    description: |-
      claim / lease の意味論:
      - publish = status=REQUESTED の行を INSERT(rapid-crosscheck-runner.sh の両系成功判定、background-rerun.sh --role rapid-crosscheck)。
        条件「中止済み run の比較依頼作成除外」: 中止済み run(parallel_runs.status が ABORTED、または完了通知の対象 slot の slot_executions.status が ABORTED)では両系成功でも INSERT しない(完了事実の記録と実行ログ WARN のみ。判断主体は dispatcher)
      - receive = worker が RAPID_POLL_INTERVAL_SEC(既定 30 秒)間隔で status=REQUESTED を requested_at 昇順に 1 件、
        条件付き UPDATE(更新件数 1 のみ成功)で CLAIMED(worker_id, lease_until=now+RAPID_LEASE_SEC(既定 600 秒))にする(設定は rapid-crosscheck.env)
      - lease 失効(lease_until < now)かつ未開始(started_at NULL)の CLAIMED は次の poll で REQUESTED に戻す。RUNNING は戻さない
      - claim 後・比較開始前の CLAIMED → RUNNING は条件付き UPDATE(status='CLAIMED' AND worker_id=?)。0 件(abort-rapid-crosscheck.sh で ABORTED 済み / lease 失効で回収済み)なら比較ツールを起動せず結果(stdout / stderr / exit_code)を依頼レコードに保存しない(条件「依頼中止可否判定」)
      - 比較実行後に SUCCEEDED / FAILED で終端(exit_code / stdout / stderr / completed_at を保存)。REQUESTED / CLAIMED / RUNNING → ABORTED は abort-rapid-crosscheck.sh(条件付き UPDATE status IN ('REQUESTED','CLAIMED','RUNNING'))、
        REQUESTED → ABORTED(未着手依頼)は abort-blue.sh / abort-green.sh(対象 run の依頼だけ。条件付き UPDATE status='REQUESTED'。0 件は正常。競合窓の保険で dispatcher 側の中止済み run 判定と併用)
      - 日時列(requested_at / lease_until / started_at / completed_at)はホストのローカルタイムゾーン(ISO 8601 秒精度、指示子なし。run_id の時刻部と同じ時刻軸)
      - 条件「結果の保存」: worker は RAPID_COMPARE_COMMAND を依頼レコードの値で置換して起動し、結果(stdout / stderr / exit_code)を依頼レコードの列へ保存する。起動失敗(launch failed)では依頼だけ FAILED(exit_code=6、error_summary に理由)で終端する
      - リラン由来(background-rerun.sh --role rapid-crosscheck)の依頼が終端したとき、worker は当該 parallel_run(parent_run_id IS NOT NULL かつ slot_executions 行 0 件)を条件付き UPDATE(status='RUNNING')で COMPLETED にする
      - hang-detector.sh は未終端の依頼を SELECT して異常判定する(参照のみ。状態を変更しない)。ABORTED の依頼は判定 COMPLETED で監視記録を終端し通知しない
    servers:
      - $ref: "#/servers/management_db"
    messages:
      RapidCrosscheckRequestMessage:
        $ref: "#/components/messages/RapidCrosscheckRequestMessage"
  final-crosscheck-requests:
    address: "final_crosscheck_requests"
    title: "確報比較依頼キュー"
    summary: "管理 DB の final_crosscheck_requests テーブル。final_crosscheck_id 主キー。runner が INSERT し、同じ runner が終端まで polling する"
    description: |-
      claim / lease の意味論:
      - publish = final-crosscheck-runner.sh が status=REQUESTED の行を INSERT(起動のたびに新 final_crosscheck_id)
      - receive = final-crosscheck-worker.sh が FINAL_WORKER_POLL_INTERVAL_SEC(既定 30 秒)間隔で status=REQUESTED を requested_at 昇順に 1 件、
        条件付き UPDATE で CLAIMED(worker_id, lease_until=now+FINAL_LEASE_MINUTES(既定 10 分))にする
      - lease 失効かつ未開始の CLAIMED は REQUESTED に戻す。RUNNING(started_at あり)は戻さない
      - 全量比較後に SUCCEEDED / FAILED で終端(exit_code / stdout / stderr を保存)。runner は FINAL_POLL_INTERVAL_SEC(既定 60 秒)で終端を待ち、
        FINAL_POLL_LIMIT_SEC(既定 28800 秒)超過で依頼を変更せず終了コード 6
    servers:
      - $ref: "#/servers/management_db"
    messages:
      FinalCrosscheckRequestMessage:
        $ref: "#/components/messages/FinalCrosscheckRequestMessage"
operations:
  # slot-completed
  execute_impl_and_publish_runner_result_send:
    action: "send"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: 実装スクリプトを実行して Runner Result を出力する(tier-facade slot runner)"
    description: "3 ファイル確定後、RAPID_CROSSCHECK_MODE が off 以外(foreground / background)のときだけ RAPID_CROSSCHECK_RUNNER の自系統の公開 function へ run_id / job_id / exit_code を通知する。復元起動(execution-spec.json の parent_run_id 非 null)の background slot は exitcode.txt 公開時(終端 UPDATE に続けて)当該 parallel_run を COMPLETED にする"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"
  send_completion_notice_to_rapid_runner_send:
    action: "send"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: 速報クロスチェック runner へ完了通知を送信する(tier-facade 送信側)"
    description: "契約を定義する UC。slot runner の lib/runner-notify.sh が RAPID_CROSSCHECK_RUNNER <role>-completed を同期起動する。送信失敗は条件「完了通知失敗の扱い」に従う(警告ログのみ。終了コードは変えない)"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"
  assign_slot_runner_script_send:
    action: "send"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: slot runner の実体スクリプトを割り当てる(tier-facade runner IF)"
    description: "runner 実体が満たすべき IF 契約の一部として、完了通知の送信を要求する"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"
  restore_execution_spec_and_rerun_send:
    action: "send"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: 元の execution-spec.json から復元して新しい run_id で起動する(tier-facade 復元起動 runner)"
    description: "リランで起動した runner も完了時に blue-completed / green-completed を送る(RAPID_CROSSCHECK_MODE が off 以外のみ)。復元した run(execution-spec.json の parent_run_id 非 null)の background slot は exitcode.txt 公開時に parallel_run を COMPLETED にする"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"
  send_completion_notice_to_rapid_runner_receive:
    action: "receive"
    channel:
      $ref: "#/channels/slot-completed"
    summary: "UC: 速報クロスチェック runner へ完了通知を送信する(tier-rapid-crosscheck 受信側)"
    description: "速報クロスチェック runner(RAPID_CROSSCHECK_RUNNER)が受信し rapid_runs の自系統列(blue_status / green_status)を更新する。再通知(運用者の同一引数での再実行を含む)は同値更新で 0(冪等・先勝ち)"
    messages:
      - $ref: "#/channels/slot-completed/messages/SlotCompletedNotice"

  # rapid-crosscheck-requests
  create_rapid_request_on_both_succeeded_send:
    action: "send"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: 両系成功時に速報比較依頼を作成する(tier-rapid-crosscheck dispatcher)"
    description: "両系 SUCCEEDED を判定したトランザクション内で status=REQUESTED の行を run_id 主キーで 1 件 INSERT し、rapid_runs.completion_status を REQUEST_CREATED にする。同一トランザクションで読んだ parallel_runs.status が ABORTED、または完了通知の対象 slot の slot_executions.status が ABORTED なら INSERT せず completion_status は BOTH_SUCCEEDED のまま(条件「中止済み run の比較依頼作成除外」。実行ログ `WARN rapid request not created run_id=... reason=parallel_run_aborted` / `WARN rapid request not created run_id=... role=... reason=slot_execution_aborted`)"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"
  rerun_create_rapid_request_only_send:
    action: "send"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: 速報比較依頼だけを新規作成する(tier-ops background-rerun --role rapid-crosscheck)"
    description: "新 run_id(parent_run_id=元 run_id)で rapid_runs と依頼を REQUESTED で INSERT し、依頼の parameters / blue_exit_code / green_exit_code は元の依頼の値を引き継ぐ。業務ジョブは再実行しない(slot_executions 行を作らない)。この parallel_run は依頼が終端した時点で worker が COMPLETED にする"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"
  claim_rapid_request_receive:
    action: "receive"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: 速報比較依頼を claim する(tier-rapid-crosscheck worker)"
    description: "poll / 条件付き UPDATE による claim / lease 失効の回収"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"
  run_job_comparison_and_register_result_receive:
    action: "receive"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: 比較ツールでジョブ単位比較を実行して結果を保存する(tier-rapid-crosscheck worker)"
    description: "claim した依頼を RUNNING にし、RAPID_COMPARE_COMMAND を依頼レコードの値(run_id / job_id / parameters / blue_exit_code / green_exit_code)で置換して起動、stdout / stderr / exit_code を依頼レコードの列へ保存して SUCCEEDED / FAILED で終端させる(起動失敗(launch failed)は FAILED / exit_code=6)。リラン由来 run(parent_run_id IS NOT NULL かつ slot_executions 行 0 件)は終端時に parallel_run を COMPLETED にする"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"
  judge_background_elapsed_and_exit_state_receive:
    action: "receive"
    channel:
      $ref: "#/channels/rapid-crosscheck-requests"
    summary: "UC: background 実行の経過時間と終了状態を判定する(tier-ops hang-detector。参照のみ)"
    description: "RAPID_CROSSCHECK_MODE が off 以外のとき未終端・未判定の速報比較依頼を SELECT して異常判定する。状態は変更しない(claim しない)。接続先はハング検知定期ジョブ設定の HANG_DB_CONN_REF"
    messages:
      - $ref: "#/channels/rapid-crosscheck-requests/messages/RapidCrosscheckRequestMessage"

  # final-crosscheck-requests
  register_final_request_and_wait_send:
    action: "send"
    channel:
      $ref: "#/channels/final-crosscheck-requests"
    summary: "UC: 確報比較依頼を登録して終端状態まで待機する(tier-final-crosscheck runner)"
    description: "final_crosscheck_requests に REQUESTED 行を INSERT し、worker の処理を polling で待つ。polling 中は状態を UPDATE しない"
    messages:
      - $ref: "#/channels/final-crosscheck-requests/messages/FinalCrosscheckRequestMessage"
  claim_final_request_receive:
    action: "receive"
    channel:
      $ref: "#/channels/final-crosscheck-requests"
    summary: "UC: 確報比較依頼を claim する(tier-final-crosscheck worker)"
    description: "poll / 条件付き UPDATE による claim / lease 失効の回収"
    messages:
      - $ref: "#/channels/final-crosscheck-requests/messages/FinalCrosscheckRequestMessage"
  run_full_comparison_and_store_result_receive:
    action: "receive"
    channel:
      $ref: "#/channels/final-crosscheck-requests"
    summary: "UC: 比較ツールで日次全量比較を実行して結果を保存する(tier-final-crosscheck worker)"
    description: "claim 済み依頼を RUNNING にして全量比較を実行し、stdout / stderr / exit_code を依頼レコードへ保存して SUCCEEDED / FAILED にする(runner の polling が読む)"
    messages:
      - $ref: "#/channels/final-crosscheck-requests/messages/FinalCrosscheckRequestMessage"

components:
  messages:
    SlotCompletedNotice:
      name: "SlotCompletedNotice"
      title: "slot 完了通知"
      summary: "slot runner が exitcode.txt 公開後に速報クロスチェック runner(RAPID_CROSSCHECK_RUNNER)の <role>-completed へ渡す完了結果"
      contentType: "application/x-cli-arguments"
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/SlotCompletedNotice"
      examples:
        - name: "green-completed"
          summary: "green slot が終了コード 0 で完了"
          payload:
            run_id: "20260830T113000-JOB001-3f9a1c2e"
            job_id: "JOB001"
            role: "green"
            exit_code: 0
    RapidCrosscheckRequestMessage:
      name: "RapidCrosscheckRequestMessage"
      title: "速報比較依頼"
      summary: "rapid_crosscheck_requests の 1 行。REQUESTED で作成され、claim / 実行 / 終端の各段階で列が埋まる"
      contentType: "application/x-rdb-row"
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/RapidCrosscheckRequest"
      examples:
        - name: "requested"
          summary: "両系成功直後の依頼"
          payload:
            run_id: "20260830T113000-JOB001-3f9a1c2e"
            job_id: "JOB001"
            parameters: "[]"
            blue_exit_code: 0
            green_exit_code: 0
            status: "REQUESTED"
            requested_at: "2026-08-30T11:45:10"
    FinalCrosscheckRequestMessage:
      name: "FinalCrosscheckRequestMessage"
      title: "確報比較依頼"
      summary: "final_crosscheck_requests の 1 行。runner が REQUESTED で作成し、worker が終端まで更新する"
      contentType: "application/x-rdb-row"
      headers:
        $ref: "#/components/schemas/EventHeaders"
      payload:
        $ref: "#/components/schemas/FinalCrosscheckRequest"
      examples:
        - name: "requested"
          summary: "確報ジョブ起動直後の依頼"
          payload:
            final_crosscheck_id: "20260830T210000-final-7b2c9e1f"
            status: "REQUESTED"
            requested_at: "2026-08-30T21:00:00"
  schemas:
    EventHeaders:
      title: "共通ヘッダー"
      type: object
      description: "全メッセージ共通の追跡情報(実体は CLI 引数 / DB 列に埋め込まれる)"
      required: [correlationId, timestamp, source]
      properties:
        correlationId:
          type: string
          description: "追跡 ID。run_id(確報は final_crosscheck_id)"
        timestamp:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "イベント発生日時(ホストのローカルタイムゾーン。ISO 8601 秒精度、タイムゾーン指示子なし。run_id の時刻部と同じ時刻軸)"
        source:
          type: string
          description: "イベント発生元スクリプト名"
          enum:
            - "slot-runner"
            - "rapid-crosscheck-runner.sh"
            - "rapid-crosscheck-worker.sh"
            - "final-crosscheck-runner.sh"
            - "final-crosscheck-worker.sh"
            - "background-rerun.sh"
            - "hang-detector.sh"
        eventType:
          type: string
          description: "イベント種別(チャネル名)"
          enum: ["slot-completed", "rapid-crosscheck-requests", "final-crosscheck-requests"]
        version:
          type: string
          description: "メッセージスキーマバージョン"
          const: "1"

    SlotCompletedNotice:
      title: "slot 完了通知ペイロード"
      type: object
      description: "速報クロスチェック runner(RAPID_CROSSCHECK_RUNNER)の <role>-completed の引数と 1:1 に対応する"
      required: [run_id, job_id, role, exit_code]
      properties:
        run_id:
          type: string
          description: "run_id({ローカル yyyymmddThhmmss}-{job_id}-{8 桁 hex}。時刻部はホストのローカルタイムゾーンでタイムゾーン指示子なし。成果物ディレクトリ名と同値)。--run-id"
          pattern: "^[0-9]{8}T[0-9]{6}-[A-Za-z0-9_-]+-[0-9a-f]{8}$"
        job_id:
          type: string
          description: "業務ジョブ識別子。--job-id"
          pattern: "^[A-Za-z0-9_-]+$"
        role:
          type: string
          description: "通知元の系統(サブコマンド blue-completed / green-completed に対応)"
          enum: ["blue", "green"]
        exit_code:
          type: integer
          description: "公開済み exitcode.txt の値(0 以上)。0 → SUCCEEDED / 非 0 → FAILED。--exit-code"
          minimum: 0
          maximum: 255
        completed_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "通知の起動時刻(exitcode.txt 公開直後。ローカル ISO 8601、指示子なし)。CLI 引数には無く headers.timestamp と同値。受信側は自系統列の更新時刻として記録する。slot runner は自 slot の中止状態(aborted.txt)を判断せず、中止後に実装が走り切って exitcode.txt を公開した場合も通常どおり送る(条件「完了通知の系統独立」)"

    RapidCrosscheckRequest:
      title: "速報比較依頼(rapid_crosscheck_requests 行)"
      type: object
      description: "管理 DB の rapid_crosscheck_requests テーブルの列(依頼レコードそのもの)。列定義の正本は _cross-cutting/datastore/rdb-schema.yaml。worker は RAPID_COMPARE_COMMAND を run_id / job_id / parameters / blue_exit_code / green_exit_code で置換して起動し、結果(stdout / stderr / exit_code)を依頼レコードの列へ保存する。リラン系譜(parent_run_id)は parallel_runs.parent_run_id を参照する"
      required: [run_id, job_id, parameters, blue_exit_code, green_exit_code, status, requested_at]
      properties:
        run_id:
          type: string
          description: "主キー。並行稼働実行の run_id({ローカル yyyymmddThhmmss}-{job_id}-{8 桁 hex}。リランでは新 run_id)"
          pattern: "^[0-9]{8}T[0-9]{6}-[A-Za-z0-9_-]+-[0-9a-f]{8}$"
        job_id:
          type: string
          description: "業務ジョブ識別子(起動コマンドの {job_id} 置換に使う JOB_ID)"
        parameters:
          type: string
          description: "起動コマンドの {params} 置換に使う PARAM... の JSON 配列文字列(引数無しは [])。依頼作成時に parallel_runs.parameters を複製する"
        blue_exit_code:
          type: integer
          description: "起動コマンドの {blue_exit_code} 置換に使う blue の完了通知の終了コード。依頼は両系成功時のみ作成されるため作成時は 0(SUCCEEDED ⟺ 0)"
          minimum: 0
          maximum: 255
        green_exit_code:
          type: integer
          description: "起動コマンドの {green_exit_code} 置換に使う green の完了通知の終了コード。依頼は両系成功時のみ作成されるため作成時は 0(SUCCEEDED ⟺ 0)"
          minimum: 0
          maximum: 255
        status:
          type: string
          description: "依頼状態。REQUESTED → CLAIMED → RUNNING(条件付き UPDATE。0 件なら比較を開始しない)→ SUCCEEDED / FAILED。REQUESTED / CLAIMED / RUNNING → ABORTED は abort-rapid-crosscheck.sh、REQUESTED → ABORTED(未着手)は abort-blue.sh / abort-green.sh(競合窓の保険)"
          enum: ["REQUESTED", "CLAIMED", "RUNNING", "SUCCEEDED", "FAILED", "ABORTED"]
        requested_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "依頼作成日時(ローカル時刻)。claim の順序キー"
        worker_id:
          type: string
          description: "claim した worker({hostname}-{pid} または --worker-id)。未 claim は null"
        lease_until:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "lease 期限(claim 時 now + RAPID_LEASE_SEC 秒)。失効かつ未開始なら REQUESTED に戻す。回収時 null"
        started_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "比較開始日時(RUNNING 遷移時)。以降は lease 失効でも戻さない"
        completed_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "終端日時(SUCCEEDED / FAILED / ABORTED)"
        exit_code:
          type: integer
          description: "比較ツールの終了コード(0 OK / 3 NG / 6 ERROR / その他)。起動失敗は 6。ABORTED は null"
          minimum: 0
          maximum: 255
        stdout:
          type: string
          description: "比較ツールの stdout(text)。rapid-crosscheck-result.sh --show-output で参照"
        stderr:
          type: string
          description: "比較ツールの stderr(text)"
        error_summary:
          type: string
          description: "FAILED 時の要約(stderr 先頭 1 行、または起動失敗(launch failed)の理由)。SUCCEEDED は null"

    FinalCrosscheckRequest:
      title: "確報比較依頼(final_crosscheck_requests 行)"
      type: object
      description: "管理 DB の final_crosscheck_requests テーブルの列。列定義の正本は _cross-cutting/datastore/rdb-schema.yaml"
      required: [final_crosscheck_id, status, requested_at]
      properties:
        final_crosscheck_id:
          type: string
          description: "主キー({ローカル yyyymmddThhmmss}-final-{8 桁 hex}。時刻部はローカルタイムゾーンでタイムゾーン指示子なし)。abort-final-crosscheck.sh の --run-id に渡す値"
          pattern: "^[0-9]{8}T[0-9]{6}-final-[0-9a-f]{8}$"
        status:
          type: string
          description: "依頼状態。REQUESTED → CLAIMED → RUNNING → SUCCEEDED / FAILED。RUNNING → ABORTED は abort-final-crosscheck.sh(RUNNING のみ。REQUESTED / CLAIMED の確報比較依頼は中止できない)"
          enum: ["REQUESTED", "CLAIMED", "RUNNING", "SUCCEEDED", "FAILED", "ABORTED"]
        requested_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "依頼作成日時(ローカル時刻)。claim の順序キー"
        worker_id:
          type: string
          description: "claim した worker。未 claim は null"
        lease_until:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "lease 期限(now + FINAL_LEASE_MINUTES)。失効かつ未開始なら REQUESTED に戻す"
        started_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "比較開始日時(RUNNING 遷移時)"
        completed_at:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$'
          description: "終端日時"
        exit_code:
          type: integer
          description: "比較ツールの終了コード。runner がジョブスケジューラへ無加工中継する。null(ABORTED)は runner が 6 を返す"
          minimum: 0
          maximum: 255
        stdout:
          type: string
          description: "比較ツールの stdout(バイト列。runner が無加工中継)"
        stderr:
          type: string
          description: "比較ツールの stderr(バイト列。runner が無加工中継)"
        error_summary:
          type: string
          description: "起動失敗時の要約(例 launch failed)。比較ツール由来の失敗では null"
