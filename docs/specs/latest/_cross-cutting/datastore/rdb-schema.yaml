version: "1.0"
datastore: "rdb"

tables:
  - name: "execution_specs"
    rdra_info: "execution-spec.json"
    description: "起動時に解決済みのホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・追加引数・マップ版・実装版・hang_detect_limit_minutesなどrunの実行設定を一度だけ確定して保存する。リラン時の設定復元やparent_run_idによる実行系譜の追跡の基準となる。認証情報は参照名のみを保存し実値は保存しない"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "実行を一意に識別するUUID。起動時に新規発番される。runner_results・rapid_crosscheck_requests（blue_run_id/green_run_id経由）・final_crosscheck_requests・hang_detections・audit_logsから参照される"
      - name: "parent_run_id"
        type: "uuid"
        nullable: true
        description: "リラン元となった元のrun_id。リラン実行でない通常起動の場合はNULL。CTP-004実行系譜トレーサビリティの追跡に用いる（自己参照）"
      - name: "job_id"
        type: "string"
        nullable: false
        description: "ジョブマップ上のジョブ識別子（CLI引数 --job-id の値）。同一job_idに紐づくblue/greenの実行結果を相関取得するために用いる"
      - name: "host"
        type: "string"
        nullable: false
        description: "実行対象ホスト。ジョブマップ解決結果"
      - name: "exec_user"
        type: "string"
        nullable: false
        description: "実行ユーザー。ジョブマップ解決結果"
      - name: "script_path"
        type: "string"
        nullable: false
        description: "実行スクリプトのパス。ジョブマップ解決結果"
      - name: "work_dir"
        type: "string"
        nullable: false
        description: "実行時の作業ディレクトリ。ジョブマップ解決結果"
      - name: "fixed_args"
        type: "text"
        nullable: true
        description: "ジョブマップに固定された起動引数"
      - name: "additional_args"
        type: "text"
        nullable: true
        description: "CLI実行時に追加指定された引数"
      - name: "job_map_version"
        type: "string"
        nullable: false
        description: "解決に使用したジョブマップのバージョン"
      - name: "impl_version"
        type: "string"
        nullable: false
        description: "選択されたslotの実装バージョン"
      - name: "hang_detect_limit_minutes"
        type: "integer"
        nullable: false
        description: "ハング疑い判定のしきい値（分）。hang_detections.threshold_minutesに引き継がれる"
      - name: "credential_ref"
        type: "string"
        nullable: true
        description: "認証情報の参照名のみを保存する（実値は保存しない）"
    primary_key: ["run_id"]
    foreign_keys:
      - columns: ["parent_run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "SET NULL"
    indexes:
      - name: "idx_execution_specs_parent_run_id"
        columns: ["parent_run_id"]
        unique: false
        reason: "CTP-004実行系譜トレーサビリティ。親run_idからの子run_id一覧参照を高速化する"
        used_by: ["execution-spec.jsonの実行設定を保ったまま再実行する"]
      - name: "idx_execution_specs_job_id"
        columns: ["job_id"]
        unique: false
        reason: "同一job_idに紐づくblue/green双方の実行結果・依頼を相関取得するため"
        used_by:
          - "feature flag設定に基づきslotを選択して起動する"
          - "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
          - "並行稼働実行結果を確認する"
    used_by:
      - uc: "feature flag設定に基づきslotを選択して起動する"
        operations: ["INSERT"]
      - uc: "background roleを起動する"
        operations: ["SELECT"]
      - uc: "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
        operations: ["SELECT"]
      - uc: "全テーブル・全ファイルを対象に確報クロスチェックを実行する"
        operations: ["SELECT"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["SELECT", "INSERT"]
    _review_notes: "ユニーク制約: run_idはUUID発番により一意性が保証されるため自然キーの追加ユニーク制約は不要と判断"

  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    description: "blue/green runnerのforeground・background・rapid-crosscheck実行結果を共通形式で保持し、ジョブスケジューラへの応答・完了通知・障害調査の3用途に使い回す。exitcode.txtの有無と終了コードの値から実行状態（RUNNING/SUCCEEDED/FAILED）を判定し、対話確認を経た場合のみABORTEDへ遷移する。UC側では一部 runner_execution_results という表記揺れが見られたため runner_results に正規化した"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "対象実行のrun_id。execution_specs.run_idを参照する複合主キーの一部"
      - name: "slot_type"
        type: "string"
        nullable: false
        description: "実行slot種別。値: blue, green"
      - name: "role_type"
        type: "string"
        nullable: false
        description: "実行役割区分。値: foreground, background, rapid-crosscheck。複合主キーの一部"
      - name: "started_at"
        type: "datetime"
        nullable: false
        description: "実行開始時刻"
      - name: "stdout_path"
        type: "string"
        nullable: true
        description: "標準出力ログ（stdout.log）のパス参照。ログ本体はファイルシステム上に保持し、本カラムはパスのみを保存する"
      - name: "stderr_path"
        type: "string"
        nullable: true
        description: "標準エラーログ（stderr.log）のパス参照。ログ本体はファイルシステム上に保持し、本カラムはパスのみを保存する"
      - name: "exit_code"
        type: "integer"
        nullable: true
        description: "プロセス終了コード（exitcode.txtの内容）。未完了（RUNNING）時はNULL"
      - name: "status"
        type: "string"
        nullable: false
        description: "実行状態。値: RUNNING, SUCCEEDED, FAILED, ABORTED。exitcode.txtの有無と値から判定し、対話確認を経た場合のみABORTEDへ遷移する"
    primary_key: ["run_id", "role_type"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "CASCADE"
    indexes:
      - name: "idx_runner_results_role_type_status"
        columns: ["role_type", "status"]
        unique: false
        reason: "hang-detectorがRUNNING状態かつrole_type='background'のレコードを高頻度でポーリングするため、また速報比較依頼作成・リラン候補選定でも同条件検索を行うため"
        used_by:
          - "background実行の未完了・非0終了・速報比較異常を定期検知する"
          - "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
          - "再実行対象のbackground実行・速報比較依頼を選択する"
      - name: "idx_runner_results_slot_type"
        columns: ["slot_type"]
        unique: false
        reason: "--slotフィルタによるblue/green絞り込みを高速化するため"
        used_by: ["再実行対象のbackground実行・速報比較依頼を選択する"]
      - name: "idx_runner_results_run_id_slot_type_role_type"
        columns: ["run_id", "slot_type", "role_type"]
        unique: false
        reason: "blue/green中止フローにおけるrun_id+slot_type+role_type完全一致での対象一意特定を高速化する（主キーはrun_id+role_typeだが、slot_type条件を含む検索パターンが多いため複合インデックスとして保持）"
        used_by:
          - "blue background実行の中止を依頼する"
          - "対話確認のうえblue background実行をABORTEDへ遷移させる"
          - "green background実行の中止を依頼する"
          - "対話確認のうえgreen background実行をABORTEDへ遷移させる"
    used_by:
      - uc: "background roleを起動する"
        operations: ["INSERT"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["INSERT"]
      - uc: "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
        operations: ["SELECT"]
      - uc: "速報クロスチェックを実行し差分を検知する"
        operations: ["SELECT"]
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["SELECT", "UPDATE"]
      - uc: "再実行対象のbackground実行・速報比較依頼を選択する"
        operations: ["SELECT"]
      - uc: "blue background実行の中止を依頼する"
        operations: ["SELECT"]
      - uc: "対話確認のうえblue background実行をABORTEDへ遷移させる"
        operations: ["SELECT", "UPDATE"]
      - uc: "green background実行の中止を依頼する"
        operations: ["SELECT"]
      - uc: "対話確認のうえgreen background実行をABORTEDへ遷移させる"
        operations: ["SELECT", "UPDATE"]
      - uc: "foreground roleの標準出力・標準エラー・終了コードを応答する"
        operations: ["SELECT"]
      - uc: "並行稼働実行結果を確認する"
        operations: ["SELECT"]
    _review_notes: "ユニーク制約: 主キー(run_id, role_type)により同一run_id・role_typeの重複起動を防止する。background roleを起動するUCが挙げたrun_id+slot_type+role_typeの冪等性チェックは、この主キーで実質的に充足される（slot_typeは同一run_idに対し不変のため）"

  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    description: "blueとgreenの完了通知を受けて作成する、ジョブ単位で非同期に行う速報クロスチェックの比較実行依頼。run_idで相関付けて実行状態を一意に管理する。CLAIMED状態でlease失効かつ未着手の場合はREQUESTEDへ戻す。レビュー修正によりblue_run_id/green_run_idカラムが追加されており、本スキーマは最新のUC定義を正としている"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "速報比較依頼を一意に識別するUUID。rapid_crosscheck_resultsから1:1で参照される"
      - name: "job_id"
        type: "string"
        nullable: false
        description: "対象ジョブのjob_id（execution_specs.job_idに対応）。同一job_idへの重複依頼作成防止に用いる"
      - name: "blue_run_id"
        type: "uuid"
        nullable: false
        description: "比較対象のblue slot側runner_results.run_id（role_type=background）。execution_specs.run_idを参照する"
      - name: "green_run_id"
        type: "uuid"
        nullable: false
        description: "比較対象のgreen slot側runner_results.run_id（role_type=background）。execution_specs.run_idを参照する"
      - name: "requested_at"
        type: "datetime"
        nullable: false
        description: "依頼作成日時（CronJob実行時刻）"
      - name: "status"
        type: "string"
        nullable: false
        description: "依頼状態。値: REQUESTED, CLAIMED, RUNNING, SUCCEEDED, FAILED, ABORTED"
      - name: "lease_expires_at"
        type: "datetime"
        nullable: true
        description: "workerがCLAIMEDにした際のlease期限（claim時刻+約10分）。lease失効かつ未着手の場合はREQUESTEDへ差し戻され、その際本カラムはNULLに戻る"
      - name: "worker_id"
        type: "string"
        nullable: true
        description: "leaseを取得したworkerの識別子。REQUESTEDへの差し戻し時はNULL"
    primary_key: ["run_id"]
    foreign_keys:
      - columns: ["blue_run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "RESTRICT"
      - columns: ["green_run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "RESTRICT"
    indexes:
      - name: "uq_rapid_crosscheck_requests_job_id"
        columns: ["job_id"]
        unique: true
        reason: "ユニーク制約: 同一job_idへの重複依頼作成を防止するため（CTP-006冪等性方針）。blue/green双方の完了ペアリングが揃った時点でjob_id単位に1件のみ作成する"
        used_by: ["blue/green runnerの完了通知を受けて速報比較依頼を作成する"]
      - name: "idx_rapid_crosscheck_requests_status_lease_expires_at"
        columns: ["status", "lease_expires_at"]
        unique: false
        reason: "REQUESTED取得およびCLAIMEDのlease失効判定の双方で高頻度に参照するため。リラン対象選定でもstatus絞り込みに使用する"
        used_by:
          - "速報クロスチェックを実行し差分を検知する"
          - "再実行対象のbackground実行・速報比較依頼を選択する"
      - name: "fk_rapid_crosscheck_requests_execution_specs_blue_run_id"
        columns: ["blue_run_id"]
        unique: false
        reason: "外部キーインデックス: blue_run_idからexecution_specs.run_idへの参照整合性チェックを高速化する"
        used_by: ["blue/green runnerの完了通知を受けて速報比較依頼を作成する"]
      - name: "fk_rapid_crosscheck_requests_execution_specs_green_run_id"
        columns: ["green_run_id"]
        unique: false
        reason: "外部キーインデックス: green_run_idからexecution_specs.run_idへの参照整合性チェックを高速化する"
        used_by: ["blue/green runnerの完了通知を受けて速報比較依頼を作成する"]
    used_by:
      - uc: "blue/green runnerの完了通知を受けて速報比較依頼を作成する"
        operations: ["INSERT"]
      - uc: "速報クロスチェックを実行し差分を検知する"
        operations: ["SELECT", "UPDATE"]
      - uc: "速報クロスチェック結果を確認する"
        operations: ["SELECT"]
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["SELECT", "UPDATE"]
      - uc: "再実行対象のbackground実行・速報比較依頼を選択する"
        operations: ["SELECT"]
      - uc: "RUNNING中の速報比較依頼の中止を依頼する"
        operations: ["SELECT"]
      - uc: "対話確認のうえ速報比較依頼をABORTEDへ遷移させる"
        operations: ["SELECT", "UPDATE"]

  - name: "rapid_crosscheck_results"
    rdra_info: "速報比較結果"
    description: "速報クロスチェックの比較結果を保持し、hang-detectorによる速報クロスチェック異常の検知・運用者への通知に用いる"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "対応する速報比較依頼のrun_id。rapid_crosscheck_requestsと1:1関係"
      - name: "comparison_result"
        type: "string"
        nullable: false
        description: "比較判定結果。値: OK, NG。diff_count=0なら'OK'、1件以上なら'NG'"
      - name: "diff_count"
        type: "integer"
        nullable: false
        description: "blue/green比較の不一致行数"
      - name: "diff_detail_uri"
        type: "string"
        nullable: true
        description: "NG時のみ設定される差分詳細レポートのURI"
      - name: "completed_at"
        type: "datetime"
        nullable: false
        description: "比較完了日時"
    primary_key: ["run_id"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "rapid_crosscheck_requests"
          columns: ["run_id"]
        on_delete: "CASCADE"
    indexes:
      - name: "idx_rapid_crosscheck_results_comparison_result"
        columns: ["comparison_result"]
        unique: false
        reason: "hang-detectorがNG判定のレコードを高頻度でポーリングするため"
        used_by: ["background実行の未完了・非0終了・速報比較異常を定期検知する"]
    used_by:
      - uc: "速報クロスチェックを実行し差分を検知する"
        operations: ["INSERT"]
      - uc: "速報クロスチェック結果を確認する"
        operations: ["SELECT"]
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["SELECT"]
    _review_notes: "ユニーク制約: 主キーrun_idにより「1つの速報比較依頼に対し速報比較結果は1件のみ」という1:1制約を充足するため、追加のユニークインデックスは不要と判断"

  - name: "final_crosscheck_requests"
    rdra_info: "確報比較依頼"
    description: "日次で全テーブル・全ファイルを対象に行う確報クロスチェックの比較実行依頼。速報側のエンティティと独立してrun_idで相関付け、リリース判断の正本とする実行状態を管理する。応答はstdout/stderr/exitcodeの3項目のみに限定する"
    columns:
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "確報比較依頼を一意に識別するUUID"
      - name: "target_date"
        type: "date"
        nullable: false
        description: "確報クロスチェックの対象日"
      - name: "status"
        type: "string"
        nullable: false
        description: "依頼状態。値: REQUESTED, CLAIMED, RUNNING, SUCCEEDED, FAILED, ABORTED"
      - name: "lease_expires_at"
        type: "datetime"
        nullable: true
        description: "claim時刻+lease期限。lease失効時はREQUESTEDへ差し戻され本カラムはNULLに戻る"
      - name: "worker_id"
        type: "string"
        nullable: true
        description: "claimを実行したworkerの識別子。差し戻し時はNULL"
      - name: "target_tables"
        type: "text"
        nullable: false
        description: "確報クロスチェックの対象テーブル一覧"
      - name: "target_files"
        type: "text"
        nullable: false
        description: "確報クロスチェックの対象ファイル一覧"
      - name: "completed_at"
        type: "datetime"
        nullable: true
        description: "SUCCEEDED/FAILED確定時刻。未完了時はNULL"
    primary_key: ["run_id"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "RESTRICT"
    indexes:
      - name: "idx_final_crosscheck_requests_status_target_date"
        columns: ["status", "target_date"]
        unique: false
        reason: "workerがREQUESTED状態の依頼を対象日順にポーリングするため"
        used_by: ["全テーブル・全ファイルを対象に確報クロスチェックを実行する"]
      - name: "idx_final_crosscheck_requests_status_lease_expires_at"
        columns: ["status", "lease_expires_at"]
        unique: false
        reason: "lease失効かつ未着手の依頼を検出しREQUESTEDへ差し戻すため"
        used_by: ["全テーブル・全ファイルを対象に確報クロスチェックを実行する"]
      - name: "idx_final_crosscheck_requests_target_date"
        columns: ["target_date"]
        unique: false
        reason: "リリース判断者が対象日単位で確報比較依頼を照会するため"
        used_by: ["確報クロスチェック結果を確認する"]
    used_by:
      - uc: "全テーブル・全ファイルを対象に確報クロスチェックを実行する"
        operations: ["SELECT", "UPDATE"]
      - uc: "確報クロスチェック結果をstdout/stderr/exitcodeで応答する"
        operations: ["SELECT"]
      - uc: "確報クロスチェック結果を確認する"
        operations: ["SELECT"]
      - uc: "RUNNING中の確報比較依頼の中止を依頼する"
        operations: ["SELECT"]
      - uc: "対話確認のうえ確報比較依頼をABORTEDへ遷移させる"
        operations: ["SELECT", "UPDATE"]
    _review_notes: "ユニーク制約: run_idはUUID発番により一意性が保証される。target_date単位の重複依頼防止制約は情報.tsv・UC定義上明示されていないため未設定（1日1件を運用ルールで担保する前提。将来的にuq_final_crosscheck_requests_target_dateの検討余地あり）"

  - name: "hang_detections"
    rdra_info: "ハング検知記録"
    description: "background実行の未完了超過（ハング疑い）・非0終了エラー・速報クロスチェック異常を記録し、定期的な監視と運用者への通知に用いる"
    columns:
      - name: "detection_id"
        type: "uuid"
        nullable: false
        description: "ハング検知記録を一意に識別するUUID"
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "検知対象のrun_id。execution_specs.run_idを参照する"
      - name: "detection_type"
        type: "string"
        nullable: false
        description: "異常検知種別。値: ハング疑い, background実行エラー, 速報クロスチェック異常"
      - name: "detected_at"
        type: "datetime"
        nullable: false
        description: "検知処理実行時刻"
      - name: "threshold_minutes"
        type: "integer"
        nullable: true
        description: "ハング疑い検知時のみ設定されるしきい値（execution_specs.hang_detect_limit_minutesの値）"
      - name: "slot_type"
        type: "string"
        nullable: true
        description: "検知対象のslot種別。値: blue, green"
      - name: "notify_target"
        type: "string"
        nullable: false
        description: "通知先。固定値「運用者」"
      - name: "resolved_at"
        type: "datetime"
        nullable: true
        description: "検知内容が解消した日時。初期値NULL（未解消）。同一run_id・detection_typeの重複検知抑止判定に使用する"
      - name: "notified_at"
        type: "datetime"
        nullable: true
        description: "運用者への通知送信日時。初期値NULL（未通知）"
    primary_key: ["detection_id"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "CASCADE"
    indexes:
      - name: "fk_hang_detections_execution_specs"
        columns: ["run_id"]
        unique: false
        reason: "外部キーインデックス。ハング検知記録から対象run_idへの追跡（障害調査・後続通知UC）で参照するため"
        used_by:
          - "background実行の未完了・非0終了・速報比較異常を定期検知する"
          - "ハング疑い・異常の通知を確認する"
      - name: "idx_hang_detections_detected_at"
        columns: ["detected_at"]
        unique: false
        reason: "検知日時順スキャン・降順ソートに用いるため"
        used_by: ["ハング疑い・異常の通知を確認する"]
      - name: "idx_hang_detections_run_id_detection_type_resolved_at"
        columns: ["run_id", "detection_type", "resolved_at"]
        unique: false
        reason: "ユニーク制約検討: 同一run_id・同一detection_typeの未解消（resolved_at IS NULL）レコードが重複しないことをINSERT前に確認するため。厳密な部分ユニーク制約（WHERE resolved_at IS NULL）はRDB製品依存のため見送り、アプリケーション側の存在チェックで担保する"
        used_by: ["background実行の未完了・非0終了・速報比較異常を定期検知する"]
      - name: "idx_hang_detections_notified_at_detected_at"
        columns: ["notified_at", "detected_at"]
        unique: false
        reason: "通知済みレコードを検知日時降順で取得する照会UCの主要アクセスパターンのため"
        used_by: ["ハング疑い・異常の通知を確認する"]
      - name: "idx_hang_detections_notified_at"
        columns: ["notified_at"]
        unique: false
        reason: "通知バッチが未通知レコード（notified_at IS NULL）を高頻度でポーリングするため"
        used_by: ["ハング疑い・異常を運用者へ通知する"]
    used_by:
      - uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
        operations: ["SELECT", "INSERT"]
      - uc: "ハング疑い・異常の通知を確認する"
        operations: ["SELECT"]
      - uc: "ハング疑い・異常を運用者へ通知する"
        operations: ["SELECT", "UPDATE"]
    _review_notes: "状態遷移の整合性: 同一run_id・detection_typeの未解消（resolved_at IS NULL）レコードは1件のみとするビジネスルールがある。RDB製品非依存のYAML定義であるためWHERE付き部分インデックスは記述せず、複合インデックス+アプリケーション側チェックで担保する方針を明記した"

  - name: "audit_logs"
    rdra_info: "該当なし（RDRAに明示定義なし。CTP-005監査ログ要件・CTP-004実行系譜トレーサビリティから導出）"
    description: "リラン・中止（abort/abort_confirm）等、運用者による重要操作の監査証跡を記録する。RDRA情報モデルに明示エンティティはないが、CTP-005監査ログ要件から全UC横断で導出される"
    columns:
      - name: "log_id"
        type: "uuid"
        nullable: false
        description: "監査ログを一意に識別するUUID"
      - name: "operator"
        type: "string"
        nullable: false
        description: "操作者。RELAYGATE_OPERATOR（または RELAYGATE_OPERATOR）環境変数の値"
      - name: "operated_at"
        type: "datetime"
        nullable: false
        description: "操作日時"
      - name: "run_id"
        type: "uuid"
        nullable: false
        description: "操作対象のrun_id。execution_specs.run_idを参照する（rerun時はfacade側は新規発行run_id、worker側は差し戻し対象run_id）"
      - name: "action"
        type: "string"
        nullable: false
        description: "操作種別。値: rerun, abort, abort_confirm"
    primary_key: ["log_id"]
    foreign_keys:
      - columns: ["run_id"]
        references:
          table: "execution_specs"
          columns: ["run_id"]
        on_delete: "RESTRICT"
    indexes:
      - name: "fk_audit_logs_execution_specs"
        columns: ["run_id"]
        unique: false
        reason: "外部キーインデックス。run_id単位の操作履歴追跡（CTP-004実行系譜トレーサビリティ）で高頻度に参照するため"
        used_by:
          - "execution-spec.jsonの実行設定を保ったまま再実行する"
          - "対話確認のうえblue background実行をABORTEDへ遷移させる"
          - "対話確認のうえgreen background実行をABORTEDへ遷移させる"
          - "対話確認のうえ確報比較依頼をABORTEDへ遷移させる"
          - "対話確認のうえ速報比較依頼をABORTEDへ遷移させる"
    used_by:
      - uc: "execution-spec.jsonの実行設定を保ったまま再実行する"
        operations: ["INSERT"]
      - uc: "対話確認のうえblue background実行をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "対話確認のうえgreen background実行をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "対話確認のうえ確報比較依頼をABORTEDへ遷移させる"
        operations: ["INSERT"]
      - uc: "対話確認のうえ速報比較依頼をABORTEDへ遷移させる"
        operations: ["INSERT"]
    _review_notes: "ユニーク制約: 監査ログは追記専用（append-only）であり自然キー・複合ユニーク制約は不要と判断。log_idはUUID発番により一意性を担保する"

er_diagram: |
  erDiagram
    execution_specs ||--o{ execution_specs : "リラン元 (parent_run_id)"
    execution_specs ||--o{ runner_results : "実行結果 (run_id)"
    execution_specs ||--o{ rapid_crosscheck_requests : "速報比較依頼-blue (blue_run_id)"
    execution_specs ||--o{ rapid_crosscheck_requests : "速報比較依頼-green (green_run_id)"
    rapid_crosscheck_requests ||--o| rapid_crosscheck_results : "速報比較結果 (run_id)"
    execution_specs ||--o{ final_crosscheck_requests : "確報比較依頼 (run_id)"
    execution_specs ||--o{ hang_detections : "ハング検知記録 (run_id)"
    execution_specs ||--o{ audit_logs : "監査ログ (run_id)"

    execution_specs {
      uuid run_id PK
      uuid parent_run_id FK
      string job_id
      string host
      string exec_user
      string script_path
      string work_dir
      text fixed_args
      text additional_args
      string job_map_version
      string impl_version
      integer hang_detect_limit_minutes
      string credential_ref
    }
    runner_results {
      uuid run_id PK "FK"
      string role_type PK
      string slot_type
      datetime started_at
      string stdout_path
      string stderr_path
      integer exit_code
      string status
    }
    rapid_crosscheck_requests {
      uuid run_id PK
      string job_id
      uuid blue_run_id FK
      uuid green_run_id FK
      datetime requested_at
      string status
      datetime lease_expires_at
      string worker_id
    }
    rapid_crosscheck_results {
      uuid run_id PK "FK"
      string comparison_result
      integer diff_count
      string diff_detail_uri
      datetime completed_at
    }
    final_crosscheck_requests {
      uuid run_id PK "FK"
      date target_date
      string status
      datetime lease_expires_at
      string worker_id
      text target_tables
      text target_files
      datetime completed_at
    }
    hang_detections {
      uuid detection_id PK
      uuid run_id FK
      string detection_type
      datetime detected_at
      integer threshold_minutes
      string slot_type
      string notify_target
      datetime resolved_at
      datetime notified_at
    }
    audit_logs {
      uuid log_id PK
      string operator
      datetime operated_at
      uuid run_id FK
      string action
    }
