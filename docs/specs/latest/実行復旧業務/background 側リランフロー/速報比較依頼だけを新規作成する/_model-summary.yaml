uc: "速報比較依頼だけを新規作成する"
business: "実行復旧業務"
buc: "background 側リランフロー"
bounded_context_id: "BC-004"
aggregate_id: "AG-002"

models:
  - name: "RecreateRapidRequestCommand"
    tier: "tier-ops"
    layer: "usecase"
    type: "command"
    rdra_info: "リラン指示"
  - name: "RunIdGenerator"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "RapidRequestSeed"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
  - name: "ParallelRunRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "並行稼働実行(parallel_run)"
  - name: "RapidRunRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "速報実行(rapid_run)"
  - name: "CrosscheckRequestRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
  - name: "依頼レコード作成契約"
    tier: "tier-rapid-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
  - name: "RapidCrosscheckRequestMessage"
    tier: "tier-rapid-crosscheck"
    layer: "usecase"
    type: "entity"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"

tables:
  - name: "parallel_runs"
    rdra_info: "並行稼働実行(parallel_run)"
    operations:
      - type: "SELECT"
        columns:
          - name: "job_id"
            value: ""
          - name: "parameters"
            value: ""
          - name: "execution_spec_uri"
            value: ""
        where: "run_id = ? (元 run)"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新 run_id"
          - name: "parent_run_id"
            value: "--source-run-id の値"
          - name: "job_id"
            value: "元 run の job_id"
          - name: "parameters"
            value: "元 run の parameters"
          - name: "execution_spec_uri"
            value: "元 run の execution_spec_uri"
          - name: "status"
            value: "STARTED"
          - name: "requested_at"
            value: "作成日時(ローカル時刻。RELAY_GATE_NOW 設定時はその値)"
        where: ""
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "RUNNING"
        where: "run_id = ? AND status = 'STARTED'"
    indexes_needed: []
  - name: "rapid_runs"
    rdra_info: "速報実行(rapid_run)"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新 run_id"
          - name: "blue_status"
            value: "SUCCEEDED"
          - name: "green_status"
            value: "SUCCEEDED"
          - name: "blue_completed_at"
            value: "作成日時(now)"
          - name: "green_completed_at"
            value: "作成日時(now)"
          - name: "completion_status"
            value: "REQUEST_CREATED"
        where: ""
    indexes_needed: []
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
    operations:
      - type: "SELECT"
        columns:
          - name: "job_id"
            value: ""
          - name: "parameters"
            value: ""
          - name: "blue_exit_code"
            value: ""
          - name: "green_exit_code"
            value: ""
        where: "run_id = ? (元 run)"
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "新 run_id(PK。1 run_id に 1 件)"
          - name: "job_id"
            value: "元依頼の job_id"
          - name: "parameters"
            value: "元依頼の parameters(複製)"
          - name: "blue_exit_code"
            value: "元依頼の値(両系成功時に作成されたため 0)"
          - name: "green_exit_code"
            value: "元依頼の値(両系成功時に作成されたため 0)"
          - name: "status"
            value: "REQUESTED"
          - name: "requested_at"
            value: "作成日時(ローカル時刻。RELAY_GATE_NOW 設定時はその値)"
        where: ""
    indexes_needed: []

kvs: []
object_storage: []
