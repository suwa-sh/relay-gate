uc: "background 実行の経過時間と終了状態を判定する"
business: "実行監視業務"
buc: "background 実行監視フロー"
paths: []
x_cli_commands:
  - name: "hang-detector.sh"
    tier: "tier-ops"
    role: "defines"
    synopsis: "hang-detector.sh [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(ハング検知定期ジョブ、5 分ごと)"
    args: []
    options:
      - name: "--verbose"
        type: "boolean"
        required: false
        description: "対象ごとの info: judged ... を stderr にも出す"
      - name: "--help"
        type: "boolean"
        required: false
        description: "usage を stdout に出して終了コード 0"
    stdin: "なし"
    stdout: "出力しない(0 行)。判定結果は実行ログ hang-detector.sh.log にのみ残す"
    stderr: "alert: level=<warning|error> kind=<hang-suspected|background-exec-error|rapid-crosscheck-error> run_id=<run_id> role=<blue|green|rapid-crosscheck> job_id=<job_id> elapsed_minutes=<n>(その回に新たに知らせる異常 1 件につき 1 行。run_id 昇順 → role 順。出す条件は UC「ハング疑い・実行エラー・比較異常を通知する」)/ error: unknown option option=...(2)/ error: unexpected argument value=...(2)/ error: config file not found path: ...(2)/ error: config file is not readable path: ...(2。hang-detector.env / feature-flag.env が読めない)/ 入力の守備範囲の違反(2。config_input_rules)/ error: option required option=RAPID_CROSSCHECK_MODE path: ... / error: invalid value key=RAPID_CROSSCHECK_MODE value=... + hint: use foreground, background or off(2)/ error: option required option=HANG_DB_CONN_REF path: ...(2)/ error: invalid value key=RAPID_HANG_DETECT_LIMIT_MINUTES|HANG_SCAN_WINDOW_HOURS value=... path: ... + hint: use a positive integer(2)/ error: artifact root not found path: ...(2)。走査前の設定エラーは検査の順(引数 → hang-detector.env → feature-flag.env → hang-detector.env のキー → RELAY_GATE_ARTIFACT_ROOT)で最初の 1 件だけ(入力の守備範囲の違反は 1 つのファイルについて config_input_rules のとおり複数行。byte_checks / env_files)/ error: notified mark dir is not readable path: ...(6。off で印の置き場を読めない回はこの 1 行だけを出し、走査しない)/ error: management db connection failed conn_ref=... または error: management db query failed ...(6。off 以外で管理 DB に接続・SELECT できない回はこの 1 行だけを出し、走査・判定・alert 行・保存をしない)/ error: artifact root is not readable path: ...(6)/ error: notified mark invalid run_id=... role=... path: ...(6。off で窓内の対象の印が規定の値でない・読めない)/ error: monitor record save failed run_id=... role=...(6)/ error: notified mark save failed run_id=... role=... path: ...(6)/ warn: unknown key key=... path: ...(hang-detector.env。継続。走査を始めるとき = off 以外は管理 DB への接続と SELECT が通ったあと、off は印の置き場の検査が通ったあとに、キーごとに 1 行をファイル内の出現順で stderr の先頭に出す。走査前の設定エラー・管理 DB に接続・SELECT できない回・印の置き場を読めない回は出さない。shared_rules.hang_alert.unknown_key_warn)/ warn: execution-spec missing run_id=... path: ...(当該 run は判定対象外で継続)/ warn: started-at is invalid run_id=... role=... value=...(当該 role は判定せず継続)/ warn: execution-spec invalid run_id=... key=...(当該 role は判定せず継続)。--verbose 時は info: judged run_id=... role=... judgement=NOT_TARGET|COMPLETED|EXEC_ERROR|MONITORING|HANG_SUSPECTED|COMPARE_ERROR elapsed_minutes=... limit_minutes=...(hang_judgement 6 値)"
    exit_codes:
      - code: 0
        meaning: "その回の見回りで新たに知らせる異常が無く、走査・判定・記録がすべて成功した(通知済みの異常が続いていても 0)"
      - code: 3
        meaning: "新たに知らせる異常がハング疑い(warning)だけ。確報の比較 NG と同じく、ジョブステータスが警告終了になる値"
      - code: 6
        meaning: "background 実行エラーまたは速報クロスチェック異常(error)を新たに 1 件以上知らせた。または自身の実行エラー(RAPID_CROSSCHECK_MODE が off 以外で管理 DB 接続・SELECT 失敗(alert 行を出さず error 1 行だけ。走査しない)、RAPID_CROSSCHECK_MODE=off で印の置き場を読めない(error 1 行だけ。走査しない)、成果物ルート読み取り失敗、監視記録の保存失敗、通知済みの印の不正、通知済みの印の保存失敗)。走査した場合の優先順位は 6 > 3 > 0"
      - code: 2
        meaning: "走査前の入力・設定エラー(未知のオプション・余分な引数、hang-detector.env 不在・読み取り不可、入力の守備範囲の違反、feature flag 設定が無い・読めない・RAPID_CROSSCHECK_MODE が無い・空・列挙外、RAPID_CROSSCHECK_MODE が off 以外で HANG_DB_CONN_REF 欠落、RAPID_HANG_DETECT_LIMIT_MINUTES / HANG_SCAN_WINDOW_HOURS が正の整数でない、RELAY_GATE_ARTIFACT_ROOT が無い)。走査しない"
async_events:
  - name: "rapid-crosscheck-requests"
    channel: "rapid-crosscheck-requests"
    direction: "subscribe"
    message: "RapidCrosscheckRequestMessage"
    summary: "RAPID_CROSSCHECK_MODE が off 以外(foreground / background)のとき未終端・未判定の速報比較依頼(未終端の監視記録がある ABORTED を含む)を SELECT して異常判定する(状態は変更しない。参照のみ)。slot 実行の状態は成果物ファイル(exitcode.txt / aborted.txt)から導出し slot_executions は読まない"
schemas: []
