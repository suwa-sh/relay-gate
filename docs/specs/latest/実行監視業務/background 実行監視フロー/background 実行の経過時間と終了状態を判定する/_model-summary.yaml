uc: "background 実行の経過時間と終了状態を判定する"
business: "実行監視業務"
buc: "background 実行監視フロー"

bounded_context_id: "BC-004"
aggregate_id: "AG-004"

models:
  - name: "HangDetectorArgs"
    tier: "tier-ops"
    layer: "presentation"
    type: "request"
    rdra_info: "監視記録"
  - name: "ScanAndJudgeCommand"
    tier: "tier-ops"
    layer: "usecase"
    type: "command"
    rdra_info: "監視記録"
  - name: "MonitorTarget"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "slot 実行"
  - name: "HangJudgement"
    tier: "tier-ops"
    layer: "domain"
    type: "value-object"
    rdra_info: "監視記録"
  - name: "ArtifactScanRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "Runner Result"
  - name: "SlotExecutionRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "slot 実行"
  - name: "RapidRequestRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
  - name: "MonitorRecordRepository"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "監視記録"
  - name: "facade/<run_id>/execution-spec.json"
    tier: "tier-ops"
    layer: "gateway"
    type: "record"
    rdra_info: "実行設定(execution-spec)"
  - name: "facade/<run_id>/<role>/started-at.txt"
    tier: "tier-ops"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"
  - name: "facade/<run_id>/<role>/exitcode.txt"
    tier: "tier-ops"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner Result"
  - name: "hang-detector.env(RAPID_HANG_DETECT_LIMIT_MINUTES / HANG_SCAN_WINDOW_HOURS)"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "ハング検知上限設定"
  - name: "feature flag 設定(RAPID_CROSSCHECK_MODE)"
    tier: "tier-ops"
    layer: "repository"
    type: "record"
    rdra_info: "feature flag 設定"

tables:
  - name: "slot_executions"
    rdra_info: "slot 実行"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "slot"
            value: ""
          - name: "status"
            value: ""
        where: "run_id IN (走査対象の run_id) AND mode = 'background'(on のみ。status = 'ABORTED' なら中止済み → hang_judgement COMPLETED。ただし ABORTED で monitor_records に未終端の行が無い role は走査対象外(判定・記録しない)。off では slot_executions を読まず成果物ファイルのみで判定する)"
    indexes_needed:
      - columns: ["run_id", "slot"]
        reason: "主キーによる走査対象 run の status 取得"
        access_pattern: "5 分ごとに走査対象 run 数分の主キー SELECT"
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼(rapid_crosscheck_request)"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "job_id"
            value: ""
          - name: "status"
            value: ""
          - name: "requested_at"
            value: ""
          - name: "started_at"
            value: ""
          - name: "exit_code"
            value: ""
        where: "status IN ('REQUESTED', 'CLAIMED', 'RUNNING') OR (status IN ('SUCCEEDED', 'FAILED') AND run_id NOT IN (SELECT run_id FROM monitor_records WHERE role = 'rapid-crosscheck' AND monitor_status IN ('COMPLETED', 'COMPARE_ERROR_NOTIFIED', 'EXEC_ERROR_NOTIFIED'))) OR (status = 'ABORTED' AND run_id IN (SELECT run_id FROM monitor_records WHERE role = 'rapid-crosscheck' AND monitor_status IN ('MONITORING', 'HANG_SUSPECTED_NOTIFIED')))(on のみ。HANG_SUSPECTED_NOTIFIED は未終端として再判定するため除外しない。ABORTED は未終端の監視記録がある依頼だけを走査し COMPLETED で終端する)"
    indexes_needed:
      - columns: ["status", "requested_at"]
        reason: "未終端依頼の走査"
        access_pattern: "5 分ごとの範囲検索"
  - name: "comparison_results"
    rdra_info: "比較結果(comparison_result)"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "status"
            value: ""
        where: "run_id IN (走査対象の run_id)(on のみ)"
    indexes_needed:
      - columns: ["run_id"]
        reason: "依頼との結合"
        access_pattern: "run_id での結合"
  - name: "monitor_records"
    rdra_info: "監視記録"
    operations:
      - type: "SELECT"
        columns:
          - name: "run_id"
            value: ""
          - name: "role"
            value: ""
          - name: "monitor_status"
            value: ""
        where: "monitor_status NOT IN ('COMPLETED', 'NOT_MONITORED', 'EXEC_ERROR_NOTIFIED', 'COMPARE_ERROR_NOTIFIED')(未終端の対象を窓外でも走査するため。on のみ)"
    indexes_needed:
      - columns: ["monitor_status"]
        reason: "未終端の監視記録の列挙"
        access_pattern: "5 分ごとの走査"

kvs: []
object_storage: []
