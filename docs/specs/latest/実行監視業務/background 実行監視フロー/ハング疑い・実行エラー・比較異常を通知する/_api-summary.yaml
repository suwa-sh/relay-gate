uc: "ハング疑い・実行エラー・比較異常を通知する"
business: "実行監視業務"
buc: "background 実行監視フロー"
paths: []
x_cli_commands:
  - name: "hang-detector.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "hang-detector.sh [--verbose](通知部分。コマンド契約の正本は UC「background 実行の経過時間と終了状態を判定する」)"
    invoked_by: "ジョブスケジューラ(ハング検知定期ジョブ、5 分ごと)"
    args: []
    options: []
    stdin: "なし"
    stdout: "出力しない"
    stderr: "error: mail send failed run_id=... role=... kind=... cmd_exit_code=N。--verbose 時 info: alert sent ... / info: alert skipped already notified ..."
    exit_codes:
      - code: 6
        meaning: "メール送信失敗が 1 件以上(他の対象は継続したうえで 6)。alerted_at は更新せず次回再送"
      - code: 2
        meaning: "ALERT_MAIL_TO 空、ALERT_MAIL_CMD が実行不可(走査前に検出)"
  # 以下はメール本文 recommended_action に埋め込む定型文が参照するコマンド(synopsis のみ参照。本 UC は起動しない。監視は通知のみ)
  - name: "abort-blue.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "abort-blue.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(hang-suspected メールの recommended_action で案内。本 UC は起動しない)"
    args: []
    options: []
    stdin: "なし"
    stdout: "(参照のみ。契約は cli-command-contract.yaml)"
    stderr: "(参照のみ)"
    exit_codes: []
  - name: "abort-green.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "abort-green.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(hang-suspected メールの recommended_action で案内。本 UC は起動しない)"
    args: []
    options: []
    stdin: "なし"
    stdout: "(参照のみ。契約は cli-command-contract.yaml)"
    stderr: "(参照のみ)"
    exit_codes: []
  - name: "abort-rapid-crosscheck.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "abort-rapid-crosscheck.sh --run-id <RUN_ID> [--yes] [--verbose] [--help]"
    invoked_by: "運用者(role=rapid-crosscheck の hang-suspected メールの recommended_action で案内。本 UC は起動しない)"
    args: []
    options: []
    stdin: "なし"
    stdout: "(参照のみ。契約は cli-command-contract.yaml)"
    stderr: "(参照のみ)"
    exit_codes: []
  - name: "background-rerun.sh"
    tier: "tier-ops"
    role: "uses"
    synopsis: "background-rerun.sh --source-run-id <RUN_ID> --role blue|green|rapid-crosscheck [--verbose] [--help]"
    invoked_by: "運用者(background-exec-error メールの recommended_action で案内。本 UC は起動しない)"
    args: []
    options: []
    stdin: "なし"
    stdout: "(参照のみ。契約は cli-command-contract.yaml)"
    stderr: "(参照のみ)"
    exit_codes: []
  - name: "rapid-crosscheck-result.sh"
    tier: "tier-rapid-crosscheck"
    role: "uses"
    synopsis: "rapid-crosscheck-result.sh --run-id <run_id> [--limit N] [--show-output] [--verbose] [--help]"
    invoked_by: "運用者(rapid-crosscheck-error メールの recommended_action で案内。本 UC は起動しない)"
    args: []
    options: []
    stdin: "なし"
    stdout: "(参照のみ。契約は cli-command-contract.yaml)"
    stderr: "(参照のみ)"
    exit_codes: []
async_events:
  - name: "hang-alert-mail"
    channel: "hang-alert-mail"
    direction: "publish"
    message: "HangAlertMail"
    summary: "ハング疑い(warning)/ background 実行エラー(error)/ 速報クロスチェック異常(error)を OS メール送信コマンドで運用者へ送る。同じ run_id + role + kind は 1 回だけ"
schemas:
  - name: "HangAlertMail"
    properties:
      - name: "subject"
        type: "string"
        required: true
      - name: "kind"
        type: "string"
        required: true
      - name: "level"
        type: "string"
        required: true
      - name: "run_id"
        type: "string"
        required: true
      - name: "job_id"
        type: "string"
        required: true
      - name: "role"
        type: "string"
        required: true
      - name: "started_at"
        type: "string"
        required: true
      - name: "elapsed_minutes"
        type: "integer"
        required: true
      - name: "hang_detect_limit_minutes"
        type: "integer"
        required: true
      - name: "exit_code"
        type: "string"
        required: true
      - name: "request_status"
        type: "string"
        required: true
      - name: "artifact_dir"
        type: "string"
        required: true
      - name: "detected_at"
        type: "string"
        required: true
      - name: "recommended_action"
        type: "string"
        required: true
