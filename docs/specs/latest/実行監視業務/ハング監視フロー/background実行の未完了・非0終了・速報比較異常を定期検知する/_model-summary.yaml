uc: "background実行の未完了・非0終了・速報比較異常を定期検知する"
business: "実行監視業務"
buc: "ハング監視フロー"

bounded_context_id: "BC-004"
aggregate_id: "AG-005"

models:
  - name: "DetectAnomaliesCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "ハング検知記録"
  - name: "Runner実行結果"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "ハング検知記録"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "ハング検知記録"
  - name: "Runner実行結果Record"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
  - name: "速報比較結果Record"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較結果"
  - name: "ハング検知記録Record"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "ハング検知記録"

tables:
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "SELECT"
        columns: []
        where: "status = 'RUNNING' AND role_type = 'background'"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "SUCCEEDED または FAILED（exit_codeの値により判定）"
        where: "run_id = :run_id"
    indexes_needed:
      - columns: ["status", "role_type"]
        reason: "hang-detectorがRUNNING状態かつrole_type='background'のレコードを高頻度でポーリングするため（foreground/rapid-crosscheckは対象外）"
        access_pattern: "定期実行ごとのstatus='RUNNING' AND role_type='background'によるフィルタ検索"
  - name: "rapid_crosscheck_results"
    rdra_info: "速報比較結果"
    operations:
      - type: "SELECT"
        columns: []
        where: "comparison_result = 'NG'"
    indexes_needed:
      - columns: ["comparison_result"]
        reason: "hang-detectorがNG判定のレコードを高頻度でポーリングするため"
        access_pattern: "定期実行ごとのcomparison_result='NG'によるフィルタ検索"
  - name: "hang_detections"
    rdra_info: "ハング検知記録"
    operations:
      - type: "SELECT"
        columns: ["detection_id", "resolved_at"]
        where: "run_id = :run_id AND detection_type = :detection_type AND resolved_at IS NULL"
      - type: "INSERT"
        columns:
          - name: "detection_id"
            value: "検知処理内で生成する一意識別子"
          - name: "run_id"
            value: "検知対象のrun_id"
          - name: "detection_type"
            value: "ハング疑い / background実行エラー / 速報クロスチェック異常"
          - name: "detected_at"
            value: "検知処理実行時刻"
          - name: "threshold_minutes"
            value: "hang_detect_limit_minutes（ハング疑い検知時のみ）"
          - name: "slot_type"
            value: "検知対象のslot種別"
          - name: "notify_target"
            value: "運用者"
          - name: "resolved_at"
            value: "初期値NULL（未解消）"
        where: "同一run_id・同一detection_typeの未解消（resolved_at IS NULL）レコードが存在しない場合のみINSERTする（重複通知抑止）"
    indexes_needed:
      - columns: ["run_id"]
        reason: "ハング検知記録から対象run_idへの追跡（障害調査・後続通知UC）で参照するため"
        access_pattern: "run_id指定での検知記録一覧取得"
      - columns: ["detected_at"]
        reason: "異常通知発信UCが未通知の検知記録を検知日時順に取得するため"
        access_pattern: "detected_at範囲指定でのスキャン"
      - columns: ["run_id", "detection_type", "resolved_at"]
        reason: "同一run_id・同一detection_typeの未解消レコード存在確認による重複検知抑止のため"
        access_pattern: "INSERT前のrun_id+detection_type+resolved_at IS NULL存在チェック"

kvs: []
object_storage: []
