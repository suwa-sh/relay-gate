uc: "確報比較依頼を登録して終端状態まで待機する"
business: "クロスチェック業務"
buc: "確報クロスチェックフロー"
paths: []
x_cli_commands:
  - name: "final-crosscheck-runner.sh"
    tier: "tier-final-crosscheck"
    role: "defines"
    synopsis: "final-crosscheck-runner.sh [--verbose] [--help]"
    invoked_by: "ジョブスケジューラ(確報クロスチェックジョブ定義)。業務上の引数なしで起動する"
    args: []
    options:
      - name: "--verbose"
        type: "boolean"
        required: false
        description: "info を実行ログに出す(stderr には出さない)"
      - name: "--help"
        type: "boolean"
        required: false
        description: "usage を stdout に出して終了コード 0"
    stdin: "なし"
    stdout: "待機中は出力しない。終端到達後は依頼に保存された stdout を無加工で出す(UC「保存済みの確報結果をジョブスケジューラへ返す」)"
    stderr: "待機中は relay-gate 自身のエラーのみ(error: / hint:)。終端到達後は依頼に保存された stderr をバイト列のまま無加工で出す(UC「保存済みの確報結果をジョブスケジューラへ返す」)。待機中の進捗は実行ログにのみ残す"
    exit_codes:
      - code: 2
        meaning: "引数・設定検証エラー(未知のオプション・業務上の引数 error: unknown option option=--xxx、final-crosscheck.env 不在・読み取り不可・入力の守備範囲の違反、FINAL_DB_CONN_REF の欠落・空、FINAL_POLL_INTERVAL_SEC / FINAL_POLL_LIMIT_SEC が正の整数でない(error: invalid value key=... value=... path: ... + hint: use a positive integer)。FINAL_COMPARE_COMMAND など worker だけが使うキーは検査しない。検査の順は契約 config_files.final-crosscheck.env note)"
      - code: 6
        meaning: "実行エラー(管理 DB 接続・INSERT・SELECT 失敗、polling 上限 FINAL_POLL_LIMIT_SEC 超過。依頼は変更しない)。終端到達後は上記 4 分類を適用せず、依頼に保存された exit_code をそのまま返す(無加工中継)"
async_events:
  - name: "final-crosscheck-requests"
    channel: "final-crosscheck-requests"
    direction: "publish"
    message: "FinalCrosscheckRequestMessage"
    summary: "final_crosscheck_requests に REQUESTED 行を INSERT し、worker の claim を待つ(RDB ジョブキュー)"
schemas:
  - name: "FinalCrosscheckRequestMessage"
    properties:
      - name: "final_crosscheck_id"
        type: "string"
        required: true
      - name: "status"
        type: "string"
        required: true
      - name: "requested_at"
        type: "string"
        required: true
