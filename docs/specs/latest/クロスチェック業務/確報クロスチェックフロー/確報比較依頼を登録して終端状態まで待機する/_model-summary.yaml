uc: "確報比較依頼を登録して終端状態まで待機する"
business: "クロスチェック業務"
buc: "確報クロスチェックフロー"

bounded_context_id: "BC-003"
aggregate_id: "AG-003"

models:
  - name: "FinalRunnerArgs"
    tier: "tier-final-crosscheck"
    layer: "presentation"
    type: "request"
    rdra_info: "ジョブ起動要求"
  - name: "RegisterAndWaitCommand"
    tier: "tier-final-crosscheck"
    layer: "usecase"
    type: "command"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
  - name: "FinalCrosscheckRequest"
    tier: "tier-final-crosscheck"
    layer: "domain"
    type: "entity"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
  - name: "FinalCrosscheckRequestRepository"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
  - name: "TargetCatalogRepository"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "対象カタログ"
  - name: "target-catalog.tsv"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "対象カタログ"
  - name: "final-crosscheck.env"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "実行設定(polling 間隔・上限。RDRA 情報に無い)"
  - name: "crosscheck-job-map.tsv(ヘッダーコメント # target_catalog_path= / # catalog_version=)"
    tier: "tier-final-crosscheck"
    layer: "repository"
    type: "record"
    rdra_info: "クロスチェックジョブマップ"

tables:
  - name: "final_crosscheck_requests"
    rdra_info: "確報比較依頼(final_crosscheck_request)"
    operations:
      - type: "INSERT"
        columns:
          - name: "final_crosscheck_id"
            value: "{UTC yyyymmddThhmmssZ}-final-{8 hex}(runner が発行)"
          - name: "business_date"
            value: "--business-date の値"
          - name: "catalog_version"
            value: "--catalog-version の値"
          - name: "status"
            value: "REQUESTED"
          - name: "requested_at"
            value: ":now(RELAY_GATE_NOW 設定時はその値、未設定はシステム時刻 UTC。runner がバインド値で渡す。契約 environment_variables.RELAY_GATE_NOW)"
        where: ""
      - type: "SELECT"
        columns:
          - name: "status"
            value: ""
        where: "final_crosscheck_id = ?(FINAL_POLL_INTERVAL_SEC ごとに繰り返す。polling は status のみ。exit_code / stdout / stderr の 4 列 SELECT は終端到達後に UC「保存済みの確報結果をジョブスケジューラへ返す」が 1 回だけ行う)"
    indexes_needed:
      - columns: ["final_crosscheck_id"]
        reason: "主キー。polling の 1 件取得"
        access_pattern: "60 秒ごとの主キー SELECT"

kvs: []
object_storage: []
