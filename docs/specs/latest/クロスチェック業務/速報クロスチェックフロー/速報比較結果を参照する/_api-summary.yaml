uc: "速報比較結果を参照する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"
paths: []
x_cli_commands:
  - name: "rapid-crosscheck-result.sh"
    tier: "tier-rapid-crosscheck"
    role: "defines"
    synopsis: "rapid-crosscheck-result.sh --run-id <run_id> [--show-output] [--verbose] [--help]"
    invoked_by: "運用者(直接起動)"
    args: []
    options:
      - name: "--run-id"
        type: "string"
        required: true
        default: ""
        description: "参照する run_id"
      - name: "--show-output"
        type: "boolean"
        required: false
        default: "false"
        description: "依頼に保存された比較ツールの stdout / stderr 本文を末尾に出す"
      - name: "--verbose"
        type: "boolean"
        required: false
        default: "false"
        description: "info を stderr に出す"
    stdin: "なし"
    stdout: "run_id / job_id / request_status / blue_status / green_status / exit_code / worker_id / requested_at / completed_at の key=value 固定 9 行(速報比較の結果は依頼レコードの stdout / stderr / exit_code で参照する。別レコードの一覧は出さない)。--show-output 時は 9 行の後に空行 1 行を置き --- stdout --- / --- stderr --- 区切りで依頼に保存された本文"
    stderr: "info: rapid result is for investigation only; use final crosscheck for release decision(常時)。error: option required option=--run-id(2)/ error: invalid value option=--run-id value=...(2)/ error: unknown option option=...(2)/ error: rapid crosscheck request not found run_id=... / error: rapid crosscheck is off; no management db to query mode=off / error: management db query failed run_id=..."
    exit_codes:
      - code: 0
        meaning: "依頼が見つかり出力できた"
      - code: 2
        meaning: "引数・設定検証エラー(run_id 欠落・形式不正、未知のオプション)"
      - code: 3
        meaning: "依頼が存在しない、または RAPID_CROSSCHECK_MODE=off"
      - code: 6
        meaning: "管理 DB 接続・SQL 失敗"
async_events: []
schemas: []
