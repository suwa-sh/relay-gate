uc: "速報クロスチェックを実行し差分を検知する"
business: "クロスチェック業務"
buc: "速報クロスチェックフロー"

bounded_context_id: "BC-002"
aggregate_id: "AG-003"

models:
  - name: "CronJobエントリポイント（lease/claim取得）"
    tier: "tier-worker"
    layer: "presentation"
    type: "state"
    rdra_info: "速報比較依頼"
  - name: "RunRapidCrosscheckCommand"
    tier: "tier-worker"
    layer: "usecase"
    type: "command"
    rdra_info: "速報比較依頼"
  - name: "速報比較依頼"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較依頼"
  - name: "速報比較結果"
    tier: "tier-worker"
    layer: "domain"
    type: "entity"
    rdra_info: "速報比較結果"
  - name: "RapidCrosscheckRequestRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較依頼"
  - name: "RapidCrosscheckResultRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "速報比較結果"
  - name: "RunnerResultRecord"
    tier: "tier-worker"
    layer: "gateway"
    type: "record"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"

tables:
  - name: "rapid_crosscheck_requests"
    rdra_info: "速報比較依頼"
    operations:
      - type: "SELECT"
        columns: []
        where: "status = 'REQUESTED' LIMIT 1 FOR UPDATE"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "CLAIMED → RUNNING → SUCCEEDED/FAILED の順に更新"
          - name: "worker_id"
            value: "lease取得worker識別子"
          - name: "lease_expires_at"
            value: "claim時刻+5分等のlease期限"
        where: "run_id = :run_id"
      - type: "UPDATE"
        columns:
          - name: "status"
            value: "REQUESTED（差し戻し）"
          - name: "worker_id"
            value: "NULL"
          - name: "lease_expires_at"
            value: "NULL"
        where: "status = 'CLAIMED' AND lease_expires_at < now()"
    indexes_needed:
      - columns: ["status", "lease_expires_at"]
        reason: "REQUESTED取得およびCLAIMEDのlease失効判定の双方で高頻度に参照するため"
        access_pattern: "status条件検索+lease_expires_at範囲検索（CronJob毎回実行）"
  - name: "runner_results"
    rdra_info: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
    operations:
      - type: "SELECT"
        columns: []
        where: "run_id = :run_id"
    indexes_needed:
      - columns: ["run_id", "slot_type"]
        reason: "blue/green双方の実行結果をrun_id単位で取得し比較するため"
        access_pattern: "run_id完全一致+slot_type別取得"
  - name: "rapid_crosscheck_results"
    rdra_info: "速報比較結果"
    operations:
      - type: "INSERT"
        columns:
          - name: "run_id"
            value: "rapid_crosscheck_requests.run_idを引き継ぐ"
          - name: "comparison_result"
            value: "diff_count=0なら'OK'、1件以上なら'NG'"
          - name: "diff_count"
            value: "blue/green比較の不一致行数"
          - name: "diff_detail_uri"
            value: "NG時のみ差分詳細レポートのURIを生成"
          - name: "completed_at"
            value: "比較完了時刻"
        where: ""
    indexes_needed:
      - columns: ["run_id"]
        reason: "ユニーク制約: 1つの速報比較依頼に対し速報比較結果は1件のみ（1:1関係）"
        access_pattern: "run_idユニーク制約"

kvs: []
object_storage: []
