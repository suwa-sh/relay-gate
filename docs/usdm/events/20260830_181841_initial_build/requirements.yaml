version: "1.0"
event_id: "20260830_181841_initial_build"
created_at: "2026-08-30T18:18:41"
source: "docs/pipeline/inputs/20260830_rebuild_from_original_docs.md(方針資料「RelayGate のしくみ」を正本、「利用イメージ」を適用例として連結した作り直し入力)"
system_name: "relay-gate 並行稼働実行基盤"

requirements:
  - id: "REQ-001"
    requirement: "ジョブスケジューラの同一ジョブ定義から、feature flag の設定だけで現行実装(blue)と新実装(green)の並行稼働・単独本番を切り替えられること"
    reason: "実装を段階的に切り替えるため、ジョブスケジューラのジョブ定義を変更せずに blue / green の実行モードを設定で制御し、並行稼働から単独本番へ移行したい"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "facade は feature flag 設定(BLUE_MODE / GREEN_MODE / RAPID_CROSSCHECK_MODE、BLUE_IMPL / GREEN_IMPL、BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER)を読み込み、slot(blue / green)ごとの実行モード(foreground / background / off)を選択する"
        acceptance_criteria:
          - "Given feature flag 設定に BLUE_MODE=foreground, GREEN_MODE=background が定義されている When ジョブスケジューラが facade を起動する Then blue が foreground、green が background として起動される"
          - "Given slot の実行モードが off である When facade を起動する Then その slot の runner は起動されない"
          - "Given 確報クロスチェックの制御設定は feature flag に含まれない When facade を起動する Then facade は確報クロスチェックを起動しない"
        affected_models:
          - type: "information"
            action: "add"
            target: "feature flag 設定"
          - type: "variation"
            action: "add"
            target: "slot 実行モード"
          - type: "buc"
            action: "add"
            target: "実装切替ジョブ実行"
          - type: "external_system"
            action: "add"
            target: "ジョブスケジューラ"
      - id: "SPEC-001-02"
        specification: "blue と green の両方が foreground になる構成は許可せず、facade は入力検証でエラー終了する"
        acceptance_criteria:
          - "Given BLUE_MODE=foreground かつ GREEN_MODE=foreground When facade を起動する Then どの slot も起動せずエラー終了する"
        affected_models:
          - type: "condition"
            action: "add"
            target: "foreground slot 排他"
          - type: "buc"
            action: "modify"
            target: "実装切替ジョブ実行"
      - id: "SPEC-001-03"
        specification: "運用モード(並行稼働: blue foreground / green background / crosscheck background、新実装の単独本番: blue off / green foreground / crosscheck off、次世代実装との並行稼働: blue background / green foreground / crosscheck background)を feature flag の組み合わせだけで表現でき、ジョブスケジューラへ返す結果は foreground slot の結果となる"
        acceptance_criteria:
          - "Given 並行稼働モードの設定 When ジョブを実行する Then blue の結果がジョブスケジューラへ返る"
          - "Given 新実装の単独本番モードの設定 When ジョブを実行する Then green の結果がジョブスケジューラへ返り、速報クロスチェックは動作しない"
          - "Given ジョブスケジューラのジョブ定義を変更しない When feature flag だけを変更する Then 並行稼働と単独本番を切り替えられる"
        affected_models:
          - type: "variation"
            action: "add"
            target: "運用モード"
          - type: "business_policy"
            action: "add"
            target: "ジョブ定義非変更の原則"
      - id: "SPEC-001-04"
        specification: "blue / green の runner は設定で実体スクリプトを割り当て、実装固有の起動方式・ホスト・OS・プロトコルを slot の runner に閉じ込める。runner を差し替えることで異なる世代の実装を並行稼働できる"
        acceptance_criteria:
          - "Given BLUE_RUNNER / GREEN_RUNNER に実体スクリプトのパスが設定されている When facade が slot を起動する Then facade は実装固有の起動方式を判断せず、設定された runner を起動する"
          - "Given green runner を次世代実装用に差し替える When feature flag と runner 設定だけを変更する Then facade と比較規約を変更せずに並行稼働できる"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "現行実装"
          - type: "external_system"
            action: "add"
            target: "新実装"
          - type: "business_policy"
            action: "add"
            target: "実装固有事項の runner への閉じ込め"

  - id: "REQ-002"
    requirement: "facade は background slot を先に起動してから foreground slot を起動し、foreground の結果だけを待機してジョブスケジューラへ返すこと"
    reason: "foreground が長時間実行中でも background slot を同時に実行させ、並行稼働の実行時間を延ばさないため。またジョブスケジューラとの契約(標準出力・標準エラー・終了コード)を維持するため"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "facade は (1) background の blue・green slot をすべて起動して PID と成果物ディレクトリを確定し、(2) foreground slot を起動し(この時点では待機しない)、(3) すべての slot を起動してから foreground の PID だけを待機する、という順序を固定する"
        acceptance_criteria:
          - "Given BLUE_MODE=foreground, GREEN_MODE=background When facade を起動する Then green が先に background 起動され、その後 blue が起動され、facade は blue の終了のみを待機する"
          - "Given foreground slot が長時間実行中 When 実行状況を確認する Then background slot は foreground と同時に実行されている"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "実装切替ジョブ実行"
          - type: "business_policy"
            action: "add"
            target: "slot 起動順序の固定"
      - id: "SPEC-002-02"
        specification: "facade は foreground slot の Runner Result(stdout.log / stderr.log / exitcode.txt)を、そのまま標準出力・標準エラー・終了コードとしてジョブスケジューラへ中継する"
        acceptance_criteria:
          - "Given foreground slot が終了し 3 ファイルが揃った When facade が応答する Then stdout.log が標準出力、stderr.log が標準エラー、exitcode.txt の値が終了コードとしてジョブスケジューラへ返る"
          - "Given 速報クロスチェックが失敗した When foreground の結果を確認する Then ジョブスケジューラへの応答は変わらない"
        affected_models:
          - type: "information"
            action: "add"
            target: "Runner Result"
          - type: "buc"
            action: "modify"
            target: "実装切替ジョブ実行"
      - id: "SPEC-002-03"
        specification: "ジョブスケジューラは facade に JOB_ID [PARAM...] だけを渡す。facade は比較対象や実装固有の起動方式を判断せず、slot と mode の選択と foreground 結果の応答だけを行う"
        acceptance_criteria:
          - "Given ジョブスケジューラのジョブ定義が facade の呼び出しと JOB_ID・PARAM だけを持つ When ジョブを起動する Then facade は JOB_ID を runner に渡し、runner がジョブマップで実行先を解決する"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "facade の責務限定"

  - id: "REQ-003"
    requirement: "blue / green runner は foreground / background のどちらでも、実装の終了結果を Runner Result Contract(stdout.log / stderr.log / exitcode.txt)として出力すること"
    reason: "ジョブスケジューラへの応答、完了通知、障害調査で同じ 3 ファイルを共通に使用し、実装固有の差異を吸収するため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "runner は <FACADE_RUN_DIR>/<FACADE_RUN_ROLE>/ 配下に started-at.txt、stdout.log、stderr.log、exitcode.txt を出力する。exitcode.txt は数値だけを 1 行で保持し、runner の終了コードは exitcode.txt と一致する。3 ファイルは実行終了後に揃えて公開する"
        acceptance_criteria:
          - "Given slot 実行が終了した When 成果物ディレクトリを確認する Then stdout.log、stderr.log、exitcode.txt が揃って存在し、exitcode.txt は数値 1 行である"
          - "Given runner が終了した When runner の終了コードを確認する Then exitcode.txt の値と一致する"
          - "Given role の起動時 When 成果物ディレクトリを確認する Then started-at.txt に起動時刻が記録されている"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Runner Result"
          - type: "business_policy"
            action: "add"
            target: "Runner Result Contract"
      - id: "SPEC-003-02"
        specification: "起動失敗、ジョブマップ未定義、SSH 失敗などの異常でも、runner は可能な限り 3 ファイルを出力する"
        acceptance_criteria:
          - "Given JOB_ID がジョブマップに未定義 When runner を起動する Then 非 0 の exitcode.txt と原因を含む stderr.log が出力される"
        affected_models:
          - type: "business_policy"
            action: "modify"
            target: "Runner Result Contract"
      - id: "SPEC-003-03"
        specification: "後続処理が書き込み途中のファイルを読まないよう、成果物は一時ファイルへ出力してから確定名へリネームする"
        acceptance_criteria:
          - "Given 成果物の書き込み中 When ハング検知や比較処理が成果物を読む Then 書き込み途中の確定名ファイルは存在しない"
        affected_models:
          - type: "business_policy"
            action: "modify"
            target: "Runner Result Contract"
      - id: "SPEC-003-04"
        specification: "background 実行でも同じ 3 ファイルを残し、ハング検知は started-at.txt、exitcode.txt、hang_detect_limit_minutes を使って background 実行を判定する"
        acceptance_criteria:
          - "Given GREEN_MODE=background When green の実行が終了する Then green/ 配下に 3 ファイルが残る"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Runner Result"

  - id: "REQ-004"
    requirement: "ジョブスケジューラのジョブ定義に実行先(ホスト・実行ユーザー・スクリプトパス)を持たせず、slot runner が実装固有のジョブマップで JOB_ID から実行先を解決し、解決結果を execution-spec.json として保存すること"
    reason: "ジョブスケジューラ側の定義を実装非依存に保ち、実行設定の正本を成果物として残すことでリラン時の再現性を確保するため"
    priority: "must"
    specifications:
      - id: "SPEC-004-01"
        specification: "実装スロットと runner は feature flag が、ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・hang_detect_limit_minutes は該当 slot のジョブマップが、比較対象と対象カタログはクロスチェックのジョブマップが所有する"
        acceptance_criteria:
          - "Given slot のジョブマップに JOB_ID の行がある When runner が JOB_ID を解決する Then ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・hang_detect_limit_minutes が得られる"
        affected_models:
          - type: "information"
            action: "add"
            target: "ジョブマップ"
          - type: "business_policy"
            action: "add"
            target: "ジョブ解決契約"
      - id: "SPEC-004-02"
        specification: "ジョブマップの固定引数の後ろに、ジョブスケジューラから渡された PARAM... を順序を変えずに連結して実装へ渡す。固定引数は JSON 配列として保持し、引数の数と各引数内の空白・カンマを維持する。空の固定引数は [] とする"
        acceptance_criteria:
          - "Given 固定引数 [\"p1\",\"p2 p3\"] と追加引数 a b When 実装へ渡す引数を確認する Then p1, \"p2 p3\", a, b の順で 4 引数として渡される"
        affected_models:
          - type: "business_policy"
            action: "modify"
            target: "ジョブ解決契約"
      - id: "SPEC-004-03"
        specification: "run 開始時に、解決済みのホスト・スクリプト・作業ディレクトリ・固定引数・追加引数・マップ版・実装版・role ごとの hang_detect_limit_minutes を facade/<run_id>/execution-spec.json として一度だけ確定保存する。認証情報そのものは保存せず参照名だけを保存する"
        acceptance_criteria:
          - "Given run を開始した When facade/<run_id>/execution-spec.json を確認する Then 解決済みの実行設定・追加引数・マップ版・実装版・role ごとの hang_detect_limit_minutes が記録され、認証情報の値は含まれない"
          - "Given run 開始後にジョブマップを変更した When 同じ run の execution-spec.json を確認する Then 変更前の内容のまま上書きされていない"
        affected_models:
          - type: "information"
            action: "add"
            target: "実行設定(execution-spec)"
          - type: "business_policy"
            action: "modify"
            target: "ジョブ解決契約"

  - id: "REQ-005"
    requirement: "速報クロスチェックが、ジョブの実行ごとに blue と green の完了結果を非同期に比較し、差分を運用者へ提供すること"
    reason: "並行稼働中に両実装の整合性を早期に確認し、原因調査に使用するため。foreground の応答を遅らせずに比較するため非同期にする"
    priority: "must"
    specifications:
      - id: "SPEC-005-01"
        specification: "blue / green runner は完了時に速報クロスチェック runner(dispatcher)へ系統ごとの公開 function(blue-completed / green-completed)で run_id、job_id、結果(終了コード、成果物ディレクトリまたは artifact_uri)を通知する。runner は相手側の状態や比較依頼を判断しない"
        acceptance_criteria:
          - "Given blue が完了した When blue runner が完了通知を送る Then 速報クロスチェック runner に blue-completed(run_id, job_id, result) が届き、rapid_run の blue 側完了結果が登録される"
          - "Given green が未完了 When blue runner が完了通知を送る Then blue runner は green の状態を参照せず終了する"
        affected_models:
          - type: "buc"
            action: "add"
            target: "速報クロスチェック"
          - type: "information"
            action: "add"
            target: "速報実行(rapid_run)"
      - id: "SPEC-005-02"
        specification: "速報クロスチェック runner は、blue と green の両方が成功したときに限り比較依頼を一意に作成する。blue / green の完了順にかかわらず比較依頼は 1 件だけ作られる。いずれかが失敗した場合は比較依頼を作成せず終了する"
        acceptance_criteria:
          - "Given blue と green が両方成功で完了 When 後に完了した側の通知が届く Then 比較依頼が 1 件だけ作成される"
          - "Given green が先に完了し blue が後に完了 When 両通知が処理される Then 比較依頼は重複せず 1 件である"
          - "Given blue が非 0 で終了 When green が成功で完了する Then 比較依頼は作成されない"
        affected_models:
          - type: "information"
            action: "add"
            target: "速報比較依頼"
          - type: "condition"
            action: "add"
            target: "両系成功判定"
          - type: "business_policy"
            action: "add"
            target: "比較依頼の一意性"
      - id: "SPEC-005-03"
        specification: "速報クロスチェック worker は比較依頼を取得(poll / claim)し、job_id ごとの比較定義に従って比較ツールでジョブ単位の比較を実行し、stdout・stderr・exitcode と比較結果(comparison_result)を登録する"
        acceptance_criteria:
          - "Given REQUESTED の速報比較依頼がある When worker が poll する Then 依頼を claim して比較を実行し、stdout・stderr・exitcode と比較結果を登録する"
          - "Given job_id ごとに比較定義が差し替えられている When 比較を実行する Then その job_id の比較定義が使われる"
        affected_models:
          - type: "information"
            action: "add"
            target: "比較結果"
          - type: "external_system"
            action: "add"
            target: "比較ツール"
          - type: "buc"
            action: "modify"
            target: "速報クロスチェック"
      - id: "SPEC-005-04"
        specification: "RAPID_CROSSCHECK_MODE=off のとき、blue / green runner は完了通知を送信せず、速報管理 DB への接続・完了結果・比較依頼・比較結果の書き込みを行わない。このとき parallel_run も作成せず、slot 実行と background 側リランは成果物ファイルだけで動作する"
        acceptance_criteria:
          - "Given RAPID_CROSSCHECK_MODE=off When slot を実行する Then 速報管理 DB の接続設定なしで実行でき、DB へ何も書き込まれない"
          - "Given RAPID_CROSSCHECK_MODE=on When slot が完了する Then runner が完了通知を送信し、速報管理 DB に完了結果と比較依頼が書き込まれる"
        affected_models:
          - type: "variation"
            action: "add"
            target: "速報クロスチェックモード"
          - type: "condition"
            action: "add"
            target: "速報クロスチェック有効判定"
      - id: "SPEC-005-05"
        specification: "速報クロスチェックは background 処理であり、その exitcode や失敗を通常業務ジョブの結果としてジョブスケジューラへ返さない。速報の比較結果は原因調査に使用し、リリース判断の正本には日次全量比較(確報)を用いる"
        acceptance_criteria:
          - "Given 速報比較が比較 NG または FAILED When foreground ジョブの結果を確認する Then ジョブスケジューラへの応答は速報の結果に影響されない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "速報と確報の位置付け"

  - id: "REQ-006"
    requirement: "確報クロスチェックが、ジョブスケジューラの別ジョブ定義から起動され、全テーブル・全ファイルを対象に日次整合性を正式確認し、stdout・stderr・exitcode をジョブスケジューラへ返すこと"
    reason: "日次処理が落ち着いた時点での全量比較をリリース判断の正本とし、その結果をジョブスケジューラの標準的な仕組み(終了コード)で判定・運用するため"
    priority: "must"
    specifications:
      - id: "SPEC-006-01"
        specification: "確報クロスチェック runner はジョブスケジューラから起動され、確報比較依頼(business_date、対象カタログの版)を登録し、対象依頼が終端状態(SUCCEEDED / FAILED / ABORTED)になるまで同期 polling する"
        acceptance_criteria:
          - "Given ジョブスケジューラが確報ジョブを起動 When runner が起動する Then final_crosscheck_request が REQUESTED で登録され、runner は終端状態まで待機する"
        affected_models:
          - type: "buc"
            action: "add"
            target: "確報クロスチェック"
          - type: "information"
            action: "add"
            target: "確報比較依頼"
          - type: "information"
            action: "add"
            target: "対象カタログ"
      - id: "SPEC-006-02"
        specification: "確報クロスチェック worker は DB セグメントで依頼を poll / claim し、比較ツールで全テーブル・全ファイルの比較を起動し、起動した実装の stdout・stderr・exitcode を依頼レコードへ保存する。exitcode が 0 なら SUCCEEDED、非 0 または実行エラーなら FAILED とする"
        acceptance_criteria:
          - "Given REQUESTED の確報比較依頼 When worker が claim して比較を完了する Then 依頼に stdout・stderr・exitcode が保存され、exitcode=0 で SUCCEEDED、非 0 で FAILED になる"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "確報クロスチェック"
          - type: "state"
            action: "add"
            target: "クロスチェック依頼"
      - id: "SPEC-006-03"
        specification: "確報クロスチェック runner は、完了した依頼に保存された stdout・stderr・exitcode をそのまま標準出力・標準エラー・終了コードとしてジョブスケジューラへ返す。チェック結果・差分件数・レポート URI などを stdout・stderr・exitcode 以外の連携データとして追加せず、依頼の管理状態名(SUCCEEDED / FAILED / ABORTED)も返さない"
        acceptance_criteria:
          - "Given 依頼が exitcode=3 で FAILED になった When runner が応答する Then ジョブスケジューラは保存済み stdout・stderr と終了コード 3 を受け取り、それ以外の連携データを受け取らない"
          - "Given 依頼が ABORTED になった When runner が応答する Then 保存済み stdout・stderr・exitcode だけが返り、状態名は返らない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "確報結果の中継制約"
      - id: "SPEC-006-04"
        specification: "確報クロスチェックは速報と異なるデータモデル(final_crosscheck_request と対象カタログ)を持ち、rapid_run や rapid_crosscheck_request を再利用しない。確報の制御は feature flag に含めず、ジョブスケジューラから直接起動する"
        acceptance_criteria:
          - "Given 確報比較を実行する When 管理 DB を確認する Then rapid_run / rapid_crosscheck_request は変更されず final_crosscheck_request だけが作成される"
        affected_models:
          - type: "information"
            action: "modify"
            target: "確報比較依頼"
          - type: "business_policy"
            action: "add"
            target: "速報と確報のモデル分離"

  - id: "REQ-007"
    requirement: "速報・確報のクロスチェック依頼が同じライフサイクル(REQUESTED / CLAIMED / RUNNING / SUCCEEDED / FAILED / ABORTED)で管理され、worker の claim と lease で多重実行を防ぐこと"
    reason: "DB をジョブキュー兼管理 DB として用い、worker 障害時の再取得と、中止・リランの前提となる状態管理を統一するため"
    priority: "must"
    specifications:
      - id: "SPEC-007-01"
        specification: "依頼は REQUESTED で作成され、worker が取得すると CLAIMED、比較開始で RUNNING、exitcode 0 で SUCCEEDED、非 0 または実行エラーで FAILED、停止確認後の中止で ABORTED に遷移する。CLAIMED で lease が失効しかつ未開始なら REQUESTED に戻る"
        acceptance_criteria:
          - "Given CLAIMED の依頼の lease_until が経過し未開始 When 別の worker が poll する Then 依頼は REQUESTED に戻り再取得できる"
          - "Given RUNNING の依頼 When worker が exitcode=0 で完了する Then SUCCEEDED になる"
        affected_models:
          - type: "state"
            action: "modify"
            target: "クロスチェック依頼"
          - type: "condition"
            action: "add"
            target: "lease 失効判定"
      - id: "SPEC-007-02"
        specification: "依頼レコードは worker_id、lease_until、requested_at、started_at、completed_at、exit_code、stdout、stderr、error_summary を保持する。比較差分の詳細は comparison_result、stdout、stderr に保持し、依頼の状態は worker の exitcode に従う"
        acceptance_criteria:
          - "Given worker が依頼を claim した When 依頼レコードを確認する Then worker_id と lease_until が設定されている"
        affected_models:
          - type: "information"
            action: "modify"
            target: "速報比較依頼"
          - type: "information"
            action: "modify"
            target: "確報比較依頼"
      - id: "SPEC-007-03"
        specification: "比較ツールの終了コードと依頼状態の対応は比較ツールの契約に従う(例: 比較 OK=0→SUCCEEDED、比較 NG=3→FAILED(警告終了)、実行エラー=6→FAILED(エラー終了))。確報は worker が保存した exitcode をそのままジョブスケジューラへ中継する"
        acceptance_criteria:
          - "Given 比較ツールが 3 で終了 When 確報 runner が応答する Then 依頼は FAILED、ジョブスケジューラへの終了コードは 3"
        affected_models:
          - type: "variation"
            action: "add"
            target: "比較ツール終了コード"

  - id: "REQ-008"
    requirement: "ハング検知が background 実行(background slot と速報比較依頼)を定期監視し、ジョブスケジューラの実行結果に現れない background 異常を運用者へ通知すること"
    reason: "background slot と速報クロスチェックはジョブスケジューラのジョブステータスに現れないため、ハング・異常終了・比較 NG を別経路で検知して運用者に知らせる必要がある"
    priority: "must"
    specifications:
      - id: "SPEC-008-01"
        specification: "ハング検知スクリプトはジョブスケジューラの定期ジョブ(5 分ごとなど)として起動され、未完了の background role について started-at.txt と execution-spec.json の hang_detect_limit_minutes から経過時間を判定する。exitcode.txt があり終了コード 0 なら対象外、非 0 なら background 実行エラーとして通知、exitcode.txt がなく経過時間が上限以内なら継続監視、上限超過ならハング疑いとして通知する"
        acceptance_criteria:
          - "Given background role の exitcode.txt がなく経過時間が hang_detect_limit_minutes を超過 When 検知ジョブが実行される Then ハング疑いとして通知される"
          - "Given background role の exitcode.txt が非 0 When 検知ジョブが実行される Then background 実行エラーとして通知される"
          - "Given exitcode.txt が 0 When 検知ジョブが実行される Then 通知されない"
        affected_models:
          - type: "buc"
            action: "add"
            target: "background 実行監視"
          - type: "condition"
            action: "add"
            target: "ハング検知判定"
          - type: "actor"
            action: "add"
            target: "運用者"
      - id: "SPEC-008-02"
        specification: "速報比較依頼については依頼状態と終了コードを確認し、FAILED または比較 NG を速報クロスチェック異常として通知する。速報比較依頼が RUNNING のときは状態を変更せずハング疑いとして通知する"
        acceptance_criteria:
          - "Given 速報比較依頼が FAILED When 検知ジョブが実行される Then 速報クロスチェック異常として通知される"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "background 実行監視"
      - id: "SPEC-008-03"
        specification: "監視は monitor_status、hang_suspected_at、alerted_at を記録して運用者へ通知する。通知後に正常終了した実行についても警告した経過時間を記録し、通常処理の警告傾向を確認できるようにする。RAPID_CROSSCHECK_MODE=off の場合も slot 成果物だけで監視する"
        acceptance_criteria:
          - "Given ハング疑いを通知した実行がその後正常終了した When 監視記録を確認する Then 警告時の経過時間が記録されている"
          - "Given RAPID_CROSSCHECK_MODE=off When 検知ジョブが実行される Then 管理 DB なしで slot 成果物を走査して監視する"
        affected_models:
          - type: "information"
            action: "add"
            target: "監視記録"
          - type: "state"
            action: "add"
            target: "監視状態"
          - type: "external_system"
            action: "add"
            target: "メール通知"
      - id: "SPEC-008-04"
        specification: "ハング検知は RUNNING を ABORTED へ変更せず、実行プロセスを停止せず、新しい実行依頼を作成しない(自動中止・自動再実行をしない)"
        acceptance_criteria:
          - "Given ハング疑いを検知した When 検知ジョブが終了する Then 対象の状態は RUNNING のままで、プロセスは停止されず、新しい依頼も作られていない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "監視は通知のみ"
      - id: "SPEC-008-05"
        specification: "hang_detect_limit_minutes は導入時に全ジョブ 60 分に設定し、正常終了パターンの警告が出そろった時点でジョブごとに最後の警告の経過時間を基準に調整する。foreground role は 0 を設定して検知対象から除外できる"
        acceptance_criteria:
          - "Given ジョブマップの hang_detect_limit_minutes を変更した When 次回以降の run を実行する Then 新しい上限が execution-spec.json に反映され判定に使われる"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "ハング検知上限の調整運用"

  - id: "REQ-009"
    requirement: "background 側リランが、ジョブスケジューラの専用ジョブから、完了済みまたは明示中止済みの background slot 実行または速報比較依頼を、元の execution-spec.json を使って新しい run_id で再実行できること"
    reason: "background 実行はジョブスケジューラのジョブ再実行では復旧できないため、元の実行設定を正確に復元した選択リランの手段が必要"
    priority: "must"
    specifications:
      - id: "SPEC-009-01"
        specification: "background-rerun は --source-run-id と --role(blue / green / rapid-crosscheck)を受け取り、元の実行を参照して新しい run_id を発行する。新しい実行の parent_run_id には直前のリラン元 run_id を設定し、最新の run_id から parent_run_id をたどると元の実行まで数珠つなぎに追跡できる"
        acceptance_criteria:
          - "Given 完了済みの background green 実行 R1 When --source-run-id R1 --role green でリランする Then 新しい run_id R2 が発行され R2.parent_run_id = R1 となる"
          - "Given R2 をさらにリランして R3 を作った When R3 の parent_run_id をたどる Then R2 → R1 と追跡できる"
        affected_models:
          - type: "buc"
            action: "add"
            target: "background 側リラン"
          - type: "information"
            action: "add"
            target: "並行稼働実行(parallel_run)"
      - id: "SPEC-009-02"
        specification: "リランは最新のジョブマップを再解決せず、元の execution-spec.json から実行パラメータ・ホスト・実行ユーザー・スクリプト・作業ディレクトリを復元して起動する。ジョブマップの変更は実行済みまたはリラン対象の設定を上書きしない"
        acceptance_criteria:
          - "Given 元の run 以降にジョブマップが変更された When リランする Then 元の execution-spec.json の設定で起動される"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "リランは元の実行設定を正本とする"
      - id: "SPEC-009-03"
        specification: "事前検証: --role が blue / green で元の slot mode が background なら新しい run_id でリランする。元の slot mode が foreground または off ならリランせず呼び出し元の専用ジョブをエラー終了する。--role が rapid-crosscheck なら業務ジョブを再実行せず比較依頼だけを新規作成する。未対応の role、元の実行が見つからない、元の実行が RUNNING または中止未確認の場合はリランせずエラー終了する"
        acceptance_criteria:
          - "Given 元の実行で blue が foreground When --role blue でリランする Then リランせずエラー終了する"
          - "Given 元の green 実行が RUNNING When --role green でリランする Then 実行中である旨のエラーで終了し、中止を促す"
          - "Given 速報比較依頼が ABORTED When --role rapid-crosscheck でリランする Then 新しい比較依頼だけが作成され、業務ジョブは再実行されない"
        affected_models:
          - type: "condition"
            action: "add"
            target: "リラン事前検証"
          - type: "variation"
            action: "add"
            target: "リラン対象 role"
      - id: "SPEC-009-04"
        specification: "foreground slot 実行と確報クロスチェックは background-rerun を使用せず、ジョブスケジューラの正規ジョブを直接再実行する"
        acceptance_criteria:
          - "Given foreground がエラー終了した When 復旧する Then ジョブスケジューラの正規ジョブを再実行する"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "foreground と確報はジョブスケジューラで再実行"

  - id: "REQ-010"
    requirement: "運用者が、プロセス停止を確認した上で、background slot 実行・速報比較依頼・確報比較依頼を明示的に ABORTED へ遷移させられること"
    reason: "ハング検知は自動中止しないため、リラン前に RUNNING を ABORTED にする明示操作が必要。プロセス停止の確認を運用者に委ねることで二重実行を防ぐ"
    priority: "must"
    specifications:
      - id: "SPEC-010-01"
        specification: "abort-blue / abort-green は --run-id を受け取り、対象 slot が background かつ RUNNING のときだけ中止できる。foreground または off の場合は状態を変更せずエラー終了する"
        acceptance_criteria:
          - "Given green が background かつ RUNNING When abort-green --run-id を実行し yes と答える Then green slot が ABORTED になる"
          - "Given blue が foreground When abort-blue --run-id を実行する Then 状態を変更せずエラー終了する"
        affected_models:
          - type: "buc"
            action: "add"
            target: "実行中止"
          - type: "state"
            action: "add"
            target: "slot 実行"
      - id: "SPEC-010-02"
        specification: "abort-rapid-crosscheck / abort-final-crosscheck は --run-id を受け取り、対象の比較依頼が RUNNING のときだけ ABORTED へ遷移させる。RUNNING でない場合は状態を変更せずエラー終了する"
        acceptance_criteria:
          - "Given 速報比較依頼が RUNNING When abort-rapid-crosscheck --run-id を実行し yes と答える Then 依頼が ABORTED になる"
          - "Given 確報比較依頼が SUCCEEDED When abort-final-crosscheck --run-id を実行する Then 状態を変更せずエラー終了する"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "実行中止"
          - type: "state"
            action: "modify"
            target: "クロスチェック依頼"
      - id: "SPEC-010-03"
        specification: "各中止スクリプトは現在状態を表示後、「対象ジョブのプロセスは強制終了してありますか？ [yes/no]」と対話確認し、yes 以外なら状態を変更せず終了する。スクリプト自身はプロセス・Pod・SSH 接続先の処理を停止しない"
        acceptance_criteria:
          - "Given 中止スクリプトを起動 When 確認に no と答える Then 状態は変更されず終了する"
          - "Given 中止スクリプトを起動 When yes と答える Then スクリプトはプロセスを停止せず、状態だけを ABORTED に更新する"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "中止は停止確認後の状態更新のみ"
          - type: "condition"
            action: "add"
            target: "停止確認応答"

  - id: "REQ-011"
    requirement: "1 回の並行稼働を run_id で相関付け、速報側(parallel_run / rapid_run / rapid_crosscheck_request / comparison_result)と確報側(final_crosscheck_request / 対象カタログ)を別ドメインのデータモデルとして管理 DB に保持すること"
    reason: "速報と確報の比較規約を別ドメインが所有し、リラン・監視・中止の判断に必要な状態と結果を一貫して追跡するため"
    priority: "must"
    specifications:
      - id: "SPEC-011-01"
        specification: "parallel_run は run_id、parent_run_id、job_id、parameters、execution_spec_uri、status、requested_at、completed_at を保持する。速報クロスチェック有効時、execution_spec_uri は成果物の execution-spec.json を参照する"
        acceptance_criteria:
          - "Given RAPID_CROSSCHECK_MODE=on で run を開始 When parallel_run を確認する Then execution_spec_uri が facade/<run_id>/execution-spec.json を指す"
        affected_models:
          - type: "information"
            action: "modify"
            target: "並行稼働実行(parallel_run)"
      - id: "SPEC-011-02"
        specification: "rapid_run は run_id ごとに blue_status、green_status、blue_artifact_uri、green_artifact_uri、blue_completed_at、green_completed_at を保持する。rapid_crosscheck_request は run_id を主キーとし、comparison_result は comparison_result_id、run_id、comparison_type、status、difference_count、report_uri、compared_at を保持する"
        acceptance_criteria:
          - "Given 比較が完了した When comparison_result を確認する Then comparison_type・status・difference_count・report_uri・compared_at が記録されている"
        affected_models:
          - type: "information"
            action: "modify"
            target: "速報実行(rapid_run)"
          - type: "information"
            action: "modify"
            target: "比較結果"
      - id: "SPEC-011-03"
        specification: "final_crosscheck_request は final_crosscheck_id、business_date、対象カタログの版、status、worker_id、lease_until、requested_at / started_at / completed_at、exit_code、stdout、stderr、error_summary を保持し、対象カタログ(target_type、target_identifier)を紐付ける"
        acceptance_criteria:
          - "Given 確報依頼を登録した When final_crosscheck_request と対象カタログを確認する Then business_date と対象カタログの版、対象一覧が記録されている"
        affected_models:
          - type: "information"
            action: "modify"
            target: "確報比較依頼"
          - type: "information"
            action: "modify"
            target: "対象カタログ"

  - id: "REQ-012"
    requirement: "relay-gate は UI 画面を持たず、運用者への提示は CLI の標準出力・標準エラー・終了コードと通知メールで行い、実行履歴・監査はジョブスケジューラの責務としてログファイルだけを残すこと"
    reason: "エアーギャップ環境のオンプレミス Linux でシェルスクリプトと RDB だけで構成し、運用者の既存手段(ジョブスケジューラの実行履歴とメール)に統合するため"
    priority: "must"
    specifications:
      - id: "SPEC-012-01"
        specification: "すべてのスクリプトは CLI として起動され、結果を標準出力・標準エラー・終了コードで返す。ハング検知の通知は warning / error のメール送信で行い、運用者は静観または対処を判断する"
        acceptance_criteria:
          - "Given 任意のスクリプトを起動 When 結果を確認する Then GUI を必要とせず標準出力・標準エラー・終了コードで判定できる"
          - "Given background 異常を検知 When 通知を確認する Then warning / error のメールが運用者に届く"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "CLI とメールによる提示"
      - id: "SPEC-012-02"
        specification: "ジョブの実行履歴・監査はジョブスケジューラの責務とし、relay-gate は Runner Result Contract の成果物と各スクリプトの実行ログをファイルとして残す"
        acceptance_criteria:
          - "Given ジョブが実行された When 履歴を調べる Then ジョブスケジューラの実行履歴と relay-gate の成果物・実行ログで追跡できる"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "実行履歴はジョブスケジューラの責務"

  - id: "REQ-013"
    requirement: "外部 IF の送受信方針、比較対象の定義、個別製品のネットワーク制約、実装固有のホスト配置は relay-gate ではなく適用側で定義できること"
    reason: "relay-gate を案件非依存の基盤として保ち、案件固有の事項(特定製品の起動方式や DB セグメント経由の実行など)を runner・ジョブマップ・比較定義の差し替えで吸収するため"
    priority: "should"
    specifications:
      - id: "SPEC-013-01"
        specification: "比較対象と対象カタログはクロスチェックのジョブマップで適用側が定義し、job_id ごとに比較定義を差し替えられる。外部 IF の送受信方針・ネットワーク制約・ホスト配置は適用文書で定義し、relay-gate の仕組みには含めない"
        acceptance_criteria:
          - "Given 新しい案件に適用する When runner・ジョブマップ・比較定義だけを差し替える Then facade・クロスチェック runner / worker・ハング検知・リラン・中止のスクリプトは変更不要である"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "適用側で定義する事項"
          - type: "information"
            action: "add"
            target: "比較定義"
