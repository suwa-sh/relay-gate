  - id: "REQ-013"
    requirement: "外部 IF の送受信方針、比較対象の定義、個別製品のネットワーク制約、実装固有のホスト配置は relay-gate ではなく適用側で定義できること"
    reason: "relay-gate を案件非依存の基盤として保ち、案件固有の事項(特定製品の起動方式や DB セグメント経由の実行など)を runner・ジョブマップ・比較定義の差し替えで吸収するため。ローカル実行と SSH 実行で足りる適用は relay-gate が提供する標準の slot runner をそのまま割り当て、標準の slot runner が扱わない特殊な接続だけを、適用側が自作する runner で吸収する"
    priority: "should"
    specifications:
      - id: "SPEC-013-01"
        specification: "比較対象(テーブル・ファイル)の定義は relay-gate の設定に持たず、適用側が比較ツール側で定義する。relay-gate が持つクロスチェックの設定(比較定義)は、速報・確報の比較ツール起動コマンド各 1 行だけとし、速報の起動コマンドは依頼レコードの値({job_id} 必須。{run_id} / {params} / {blue_exit_code} / {green_exit_code} は任意)をプレースホルダで比較ツールに渡すことで、ジョブごとの比較対象の決定を比較ツール側に委ねる。ジョブ ID ごとの比較定義の差し替えや対象カタログは relay-gate では持たない。外部 IF の送受信方針・ネットワーク制約・ホスト配置は適用文書で定義し、relay-gate の仕組みには含めない。案件固有の接続のうち、ローカル実行と SSH 実行は relay-gate が提供する標準の slot runner が扱い(SPEC-001-04)、標準の slot runner が扱わない特殊な接続は、適用側が runner を自作して割り当てる"
        acceptance_criteria:
          - "Given 新しい案件に適用する When runner・ジョブマップ・比較ツール起動コマンドだけを差し替える Then facade・クロスチェック runner / worker・ハング検知・リラン・中止のスクリプトは変更不要である"
          - "Given 比較対象のテーブル・ファイルを追加した When relay-gate 側の作業を確認する Then relay-gate の設定変更は不要で、比較ツール側の定義変更だけで済む"
          - "Given ローカル実行と SSH 実行だけで足りる新しい案件に適用する When 標準の slot runner を割り当て、feature flag・slot ジョブマップ・比較ツール起動コマンドだけを用意する Then runner を含む relay-gate のスクリプトは、変更も自作も不要である"
          - "Given 標準の slot runner が扱わない起動方式・プロトコルを持つ新しい案件に適用する When 適用側が自作した runner を割り当てる Then facade・クロスチェック runner / worker・ハング検知・リラン・中止のスクリプトと標準の slot runner は変更不要である"
