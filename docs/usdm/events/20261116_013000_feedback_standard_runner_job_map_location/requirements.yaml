      - id: "SPEC-001-02"
        specification: "blue と green の両方が foreground になる構成は許可せず、facade は入力検証でエラー終了する"
        acceptance_criteria:
          - "Given BLUE_MODE=foreground かつ GREEN_MODE=foreground When facade を起動する Then どの slot も起動せずエラー終了する"
        affected_models:
          - type: "condition"
            action: "add"
            target: "foreground slot 排他"
          - type: "buc"
            action: "modify"
            target: "実装切替ジョブ実行"
      - id: "SPEC-001-03"
        specification: "運用モード(並行稼働: blue foreground / green background / crosscheck background、新実装の単独本番: blue off / green foreground / crosscheck off、次世代実装との並行稼働: blue background / green foreground / crosscheck background)を feature flag の組み合わせだけで表現でき、ジョブスケジューラへ返す結果は foreground slot の結果となる"
        acceptance_criteria:
          - "Given 並行稼働モードの設定 When ジョブを実行する Then blue の結果がジョブスケジューラへ返る"
          - "Given 新実装の単独本番モードの設定 When ジョブを実行する Then green の結果がジョブスケジューラへ返り、速報クロスチェックは動作しない"
          - "Given ジョブスケジューラのジョブ定義を変更しない When feature flag だけを変更する Then 並行稼働と単独本番を切り替えられる"
        affected_models:
          - type: "variation"
            action: "add"
            target: "運用モード"
          - type: "business_policy"
            action: "add"
            target: "ジョブ定義非変更の原則"
      - id: "SPEC-001-04"
        specification: "blue / green の runner は設定で実体スクリプトを割り当て、実装固有の起動方式・ホスト・OS・プロトコルを slot の runner に閉じ込める。runner を差し替えることで異なる世代の実装を並行稼働できる。relay-gate は、そのまま BLUE_RUNNER / GREEN_RUNNER に割り当てられる標準の slot runner を、正式な提供物として提供する。標準の slot runner は、slot ジョブマップの行に従い、ローカル実行(host と user が両方空の行)と SSH 実行(それ以外の行)の両方を扱い、runner の外部 IF(引数、--help の応答、Runner Result Contract の 3 ファイルと execution-spec.json、完了通知)を満たす。標準の slot runner を使う適用で利用者が用意するものは、feature flag と slot ジョブマップ(と実行先の実装)だけとし、runner のスクリプトを書く必要はない。標準の slot runner が扱わない起動方式・プロトコル(特殊な接続)は、これまでどおり利用者が runner を自作して割り当てられる。自作する runner のための共通ライブラリの提供と runner の外部 IF は残す。標準の slot runner を「参考実装(仮採用)」としては扱わない。標準の slot runner のファイル構成(blue 用と green 用を 1 つの実体で兼ねるか、ファイル名、置き場所、feature flag への書き方の例)は仕様で 1 つに確定する(推奨は、1 つの実体を blue と green の両方に割り当てられる形)。元の方針資料は「BLUE_RUNNER と GREEN_RUNNER は適用ごとに実体を割り当てる」とし、標準の runner の提供には触れていない。標準の slot runner の正式な提供は利用者決定(2026-11-16)であり、割り当てる実体として標準の slot runner を選べる形で方針資料の記述と両立させる"
        acceptance_criteria:
          - "Given BLUE_RUNNER / GREEN_RUNNER に実体スクリプトのパスが設定されている When facade が slot を起動する Then facade は実装固有の起動方式を判断せず、設定された runner を起動する"
          - "Given green runner を次世代実装用に差し替える When feature flag と runner 設定だけを変更する Then facade と比較規約を変更せずに並行稼働できる"
          - "Given BLUE_RUNNER と GREEN_RUNNER に relay-gate が提供する標準の slot runner を割り当て、blue と green の slot ジョブマップを置いた feature flag 設定 When 設定を検証する Then エラーにならず終了コード 0 で終わる"
          - "Given 標準の slot runner を割り当てた slot で、slot ジョブマップの JOB_ID の行の host と user が両方空である When facade がその slot を起動する Then ジョブマップの script が facade と同じホストでローカル実行され、その slot の成果物ディレクトリに stdout.log / stderr.log / exitcode.txt が揃い、execution-spec.json に解決した実行先が記録される"
          - "Given 標準の slot runner を割り当てた slot で、slot ジョブマップの JOB_ID の行に host と user がある When facade がその slot を起動する Then ジョブマップの script がその host でその user として SSH で実行され、その slot の成果物ディレクトリに stdout.log / stderr.log / exitcode.txt が揃う"
          - "Given ローカル実行と SSH 実行だけで足りる適用 When BLUE_RUNNER と GREEN_RUNNER に標準の slot runner を割り当てて並行稼働を構成する Then 利用者が用意するものは feature flag と slot ジョブマップ(と実行先の実装)だけで、runner のスクリプトを書かずに blue と green の実装が起動される"
          - "Given 標準の slot runner が扱わない起動方式・プロトコルで動く実装 When 利用者が共通ライブラリを使って runner の外部 IF を満たす runner を自作し、BLUE_RUNNER または GREEN_RUNNER に割り当てる Then facade を変更せずにその runner が起動され、その slot の成果物ディレクトリに stdout.log / stderr.log / exitcode.txt が揃う"
          - "Given relay-gate の提供物の一覧 When slot runner の位置づけを確認する Then 標準の slot runner は正式な提供物として載っており、参考実装(仮採用)という扱いの runner は無い"
        feedback_source:
          feedback_request_id: "20261116_standard_runner_job_map_location"
          work_unit_ids:
            - "CR-65b09d93-001#1"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "現行実装"
          - type: "external_system"
