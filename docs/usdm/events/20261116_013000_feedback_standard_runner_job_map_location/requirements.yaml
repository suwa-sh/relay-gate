requirements:
  - id: "REQ-001"
    requirement: "ジョブスケジューラの同一ジョブ定義から、feature flag の設定だけで現行実装(blue)と新実装(green)の並行稼働・単独本番を切り替えられること"
    reason: "実装を段階的に切り替えるため、ジョブスケジューラのジョブ定義を変更せずに blue / green の実行モードを設定で制御し、並行稼働から単独本番へ移行したい"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "facade は feature flag 設定を読み込み、slot(blue / green)ごとの実行モード(foreground / background / off)を選択する。feature flag 設定は、元の方針資料の設定契約の 9 キー(BLUE_MODE / GREEN_MODE / RAPID_CROSSCHECK_MODE、BLUE_IMPL / GREEN_IMPL、BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER。各キーの要否はこれまでの規則のまま)に、slot ジョブマップの場所を書く任意の 2 キー(blue 用と green 用に 1 つずつ。キー名は仕様で確定する。推奨は BLUE_JOB_MAP_CSV / GREEN_JOB_MAP_CSV)を加えた構成とする。任意の 2 キーを書かない設定(元の方針資料のしくみの資料にある 9 キーだけの設定例)は、そのまま通る。未知のキーとして扱うのは、9 キーと任意の 2 キーのどちらでもないキーとする。任意の 2 キーの値の扱いは SPEC-004-01 に従う"
        acceptance_criteria:
          - "Given feature flag 設定に BLUE_MODE=foreground, GREEN_MODE=background が定義されている When ジョブスケジューラが facade を起動する Then blue が foreground、green が background として起動される"
          - "Given slot の実行モードが off である When facade を起動する Then その slot の runner は起動されない"
          - "Given 確報クロスチェックの制御設定は feature flag に含まれない When facade を起動する Then facade は確報クロスチェックを起動しない"
          - "Given 元資料の 9 キー(BLUE_MODE / GREEN_MODE / RAPID_CROSSCHECK_MODE / BLUE_IMPL / GREEN_IMPL / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER)で feature flag 設定を書く When 設定を検証する Then 未知キーの警告は出ない"
          - "Given BLUE_IMPL / GREEN_IMPL が設定されている When run を開始する Then execution-spec.json の実装版は BLUE_IMPL / GREEN_IMPL の値を出所とし、ジョブマップに実装版の列を要求しない"
          - "Given RAPID_CROSSCHECK_RUNNER と RAPID_CROSSCHECK_WORKER が設定されている When slot が完了する Then slot runner は RAPID_CROSSCHECK_RUNNER へ完了通知(blue-completed / green-completed)を送り、速報クロスチェック worker の実体は RAPID_CROSSCHECK_WORKER で解決される"
          - "Given 元資料の 9 キーに加えて、slot ジョブマップの場所を書く任意の 2 キー(blue 用と green 用。キー名は仕様で確定する。推奨は BLUE_JOB_MAP_CSV / GREEN_JOB_MAP_CSV)を書いた feature flag 設定で、2 キーの値が指す場所にジョブマップがある When 設定を検証する Then 未知キーの警告は出ず、エラーにならない"
          - "Given 元資料の 9 キーだけを書き、slot ジョブマップの場所を書くキーが無い feature flag 設定 When 設定を検証する Then ジョブマップの場所を書くキーが無いことを理由とするエラーも警告も出ない"
          - "Given 元資料の 9 キーと任意の 2 キーのどちらでもないキーを書いた feature flag 設定 When 設定を検証する Then そのキーについて未知キーの警告が出る"
        feedback_source:
          feedback_request_id: "20261116_standard_runner_job_map_location"
          work_unit_ids:
            - "CR-65b09d93-002#1"
