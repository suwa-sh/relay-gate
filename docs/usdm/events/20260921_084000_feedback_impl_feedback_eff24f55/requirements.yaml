      - id: "SPEC-008-06"
        specification: "ハング検知定期ジョブの通知先メールアドレス・送信コマンド・件名プレフィックス・管理 DB 接続参照名は、基盤適用設計者が所有するハング検知定期ジョブ設定(hang-detector 用 env 設定ファイル)で定義する。認証情報は値を置かず参照名のみとする。通知 UC はこの設定を入力として通知メールを送る"
        acceptance_criteria:
          - "Given ハング検知定期ジョブ設定に通知先と送信コマンドが定義されている When 異常を通知する Then 設定された送信コマンドで設定された宛先へメールが送られる"
          - "Given 設定所有区分 When ハング検知定期ジョブ設定の所有者を確認する Then 基盤適用設計者である"
          - "Given ハング検知定期ジョブ設定 When 内容を確認する Then 認証情報の値は含まれず管理 DB 接続の参照名だけがある"
