      - id: "SPEC-005-03"
        specification: "速報クロスチェック worker は比較依頼を取得(poll / claim)し、job_id ごとの比較定義に従って比較ツールでジョブ単位の比較を実行し、stdout・stderr・exitcode と比較結果(comparison_result)を登録する"
        acceptance_criteria:
          - "Given REQUESTED の速報比較依頼がある When worker が poll する Then 依頼を claim して比較を実行し、stdout・stderr・exitcode と比較結果を登録する"
          - "Given job_id ごとに比較定義が差し替えられている When 比較を実行する Then その job_id の比較定義が使われる"
          - "Given job_id の比較定義が無い When worker が依頼を処理する Then comparison_result は登録されず、依頼だけが FAILED(exit_code=6 相当、error_summary に理由)で終端する"
          - "Given 比較ツールの起動に失敗した When worker が依頼を処理する Then comparison_result は登録されず、依頼だけが FAILED で終端する"
          - "Given 比較ツールが終了コードを返した When worker が結果を登録する Then comparison_result が登録される"
        feedback_source:
          feedback_request_id: "20260905_todo_resolution"
          work_unit_ids:
            - "CR-c770d8f0-011#1"
        affected_models:
          - type: "information"
            action: "add"
            target: "比較結果"
          - type: "external_system"
            action: "add"
            target: "比較ツール"
          - type: "buc"
            action: "modify"
            target: "速報クロスチェック"
          - type: "condition"
            action: "add"
            target: "比較結果の登録条件"
      - id: "SPEC-005-04"
        specification: "RAPID_CROSSCHECK_MODE=off のとき、blue / green runner は完了通知を送信せず、速報管理 DB への接続・完了結果・比較依頼・比較結果の書き込みを行わない。このとき parallel_run も作成せず、slot 実行と background 側リランは成果物ファイルだけで動作する"
        acceptance_criteria:
          - "Given RAPID_CROSSCHECK_MODE=off When slot を実行する Then 速報管理 DB の接続設定なしで実行でき、DB へ何も書き込まれない"
          - "Given RAPID_CROSSCHECK_MODE=background When slot が完了する Then runner が完了通知を送信し、速報管理 DB に完了結果と比較依頼が書き込まれる"
          - "Given RAPID_CROSSCHECK_MODE=foreground When slot が完了する Then background と同じく runner が完了通知を送信し、速報管理 DB に完了結果と比較依頼が書き込まれる"
        feedback_source:
          feedback_request_id: "20260905_todo_resolution"
          work_unit_ids:
            - "CR-c770d8f0-001#1"
        affected_models:
          - type: "variation"
            action: "add"
            target: "速報クロスチェックモード"
          - type: "condition"
            action: "add"
            target: "速報クロスチェック有効判定"
          - type: "variation"
            action: "modify"
            target: "速報クロスチェックモード"
          - type: "condition"
            action: "modify"
            target: "速報クロスチェック有効判定"
      - id: "SPEC-005-05"
        specification: "速報クロスチェックは background 処理であり、その exitcode や失敗を通常業務ジョブの結果としてジョブスケジューラへ返さない。速報の比較結果は原因調査に使用し、リリース判断の正本には日次全量比較(確報)を用いる"
        acceptance_criteria:
          - "Given 速報比較が比較 NG または FAILED When foreground ジョブの結果を確認する Then ジョブスケジューラへの応答は速報の結果に影響されない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "速報と確報の位置付け"
      - id: "SPEC-005-06"
        specification: "速報クロスチェックの管理 DB 接続参照名(RAPID_DB_CONN_REF)、依頼の lease 期間(秒。RAPID_LEASE_SEC)、worker の poll 間隔(秒。RAPID_POLL_INTERVAL_SEC)は、基盤適用設計者が所有する速報クロスチェック設定(速報クロスチェック用 env 設定ファイル)で定義する。認証情報は値を置かず参照名のみとする。facade・slot runner・速報クロスチェック runner・速報クロスチェック worker はこの設定を入力として管理 DB へ接続し、claim の lease と poll 間隔を決める。RAPID_CROSSCHECK_MODE=off のときはこの設定を必要としない"
        acceptance_criteria:
          - "Given 速報クロスチェック設定に管理 DB 接続参照名・lease 期間・poll 間隔が定義されている When RAPID_CROSSCHECK_MODE=background で slot runner が完了通知を送り worker が依頼を claim する Then 設定された参照名で管理 DB に接続し、設定された lease 期間と poll 間隔で claim と poll が行われる"
          - "Given 設定所有区分 When 速報クロスチェック設定の所有者を確認する Then 基盤適用設計者である"
          - "Given 速報クロスチェック設定 When 内容を確認する Then 認証情報の値は含まれず管理 DB 接続の参照名だけがある"
          - "Given RAPID_CROSSCHECK_MODE=off When 速報クロスチェック設定が存在しない Then slot 実行は設定なしで実行できる"
        feedback_source:
          feedback_request_id: "20260907_todo_followup"
          work_unit_ids:
            - "CR-c770d8f0-013#1"
        affected_models:
          - type: "information"
            action: "add"
            target: "速報クロスチェック設定"
          - type: "variation"
            action: "modify"
            target: "設定所有区分"
          - type: "condition"
