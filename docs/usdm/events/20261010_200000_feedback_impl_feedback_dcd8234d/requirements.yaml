        specification: "確報クロスチェック worker は DB セグメントで依頼を poll / claim し、自分の設定に 1 行で定義された確報の比較ツール起動コマンドをそのまま(プレースホルダ置換なしで)起動して全テーブル・全ファイルの比較を実行し、起動した実装の stdout・stderr・exit_code を依頼レコードの列へ保存する。worker が読む入力は管理 DB の依頼レコードと自分の設定ファイルだけとし、比較ツールにファイルパス(対象カタログのパスなど)を渡さず、worker 側で成果物ファイルを保存しない。exit_code が 0 なら SUCCEEDED、非 0 または起動失敗(実行エラー)なら FAILED とする"
