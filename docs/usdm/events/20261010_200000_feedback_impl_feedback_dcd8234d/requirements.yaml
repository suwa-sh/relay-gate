        specification: "確報クロスチェック runner はジョブスケジューラから業務上の引数なしで起動され(受け付けるのは実行補助のオプションだけ)、business_date や対象カタログの版などの業務パラメータを持たない確報比較依頼を 1 件登録し、対象依頼が終端状態(SUCCEEDED / FAILED / ABORTED)になるまで同期 polling する"
