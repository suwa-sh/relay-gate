    requirement: "外部 IF の送受信方針、比較対象の定義、個別製品のネットワーク制約、実装固有のホスト配置は relay-gate ではなく適用側で定義できること"
    reason: "relay-gate を案件非依存の基盤として保ち、案件固有の事項(特定製品の起動方式や DB セグメント経由の実行など)を runner・ジョブマップ・比較定義の差し替えで吸収するため"
    priority: "should"
    specifications:
      - id: "SPEC-013-01"
        specification: "比較対象(テーブル・ファイル)の定義は relay-gate の設定に持たず、適用側が比較ツール側で定義する。relay-gate が持つクロスチェックの設定(比較定義)は、速報・確報の比較ツール起動コマンド各 1 行だけとし、速報の起動コマンドは依頼レコードの値({job_id} 必須。{run_id} / {params} / {blue_exit_code} / {green_exit_code} は任意)をプレースホルダで比較ツールに渡すことで、ジョブごとの比較対象の決定を比較ツール側に委ねる。ジョブ ID ごとの比較定義の差し替えや対象カタログは relay-gate では持たない。外部 IF の送受信方針・ネットワーク制約・ホスト配置は適用文書で定義し、relay-gate の仕組みには含めない"
        acceptance_criteria:
          - "Given 新しい案件に適用する When runner・ジョブマップ・比較ツール起動コマンドだけを差し替える Then facade・クロスチェック runner / worker・ハング検知・リラン・中止のスクリプトは変更不要である"
