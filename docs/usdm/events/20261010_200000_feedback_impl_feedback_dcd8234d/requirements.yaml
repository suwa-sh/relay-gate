  - id: "REQ-007"
    requirement: "速報・確報のクロスチェック依頼が同じライフサイクル(REQUESTED / CLAIMED / RUNNING / SUCCEEDED / FAILED / ABORTED)で管理され、worker の claim と lease で多重実行を防ぐこと"
    reason: "DB をジョブキュー兼管理 DB として用い、worker 障害時の再取得と、中止・リランの前提となる状態管理を統一するため"
    priority: "must"
    specifications:
      - id: "SPEC-007-01"
        specification: "依頼は REQUESTED で作成され、worker が取得すると CLAIMED、比較開始で RUNNING、exitcode 0 で SUCCEEDED、非 0 または実行エラーで FAILED、停止確認後の中止で ABORTED に遷移する。CLAIMED で lease が失効しかつ未開始なら REQUESTED に戻る"
        acceptance_criteria:
          - "Given CLAIMED の依頼の lease_until が経過し未開始 When 別の worker が poll する Then 依頼は REQUESTED に戻り再取得できる"
          - "Given RUNNING の依頼 When worker が exitcode=0 で完了する Then SUCCEEDED になる"
        affected_models:
          - type: "state"
            action: "modify"
            target: "クロスチェック依頼"
          - type: "condition"
            action: "add"
            target: "lease 失効判定"
      - id: "SPEC-007-02"
        specification: "依頼レコードは worker_id、lease_until、requested_at、started_at、completed_at、exit_code、stdout、stderr、error_summary を保持する。比較差分の詳細は依頼レコードの stdout・stderr にそのまま保持し、差分件数やレポート URI を別レコードに抽出しない。依頼の状態は worker が保存した exit_code に従う"
        acceptance_criteria:
          - "Given worker が依頼を claim した When 依頼レコードを確認する Then worker_id と lease_until が設定されている"
          - "Given 比較ツールが差分の詳細を標準出力に出した When 依頼レコードを確認する Then その標準出力が加工されずに stdout 列に保存されている"
        feedback_source:
          feedback_request_id: "20261010_104636_impl_feedback_dcd8234d"
          work_unit_ids:
            - "CR-dcd8234d-007#1"
        affected_models:
          - type: "information"
            action: "modify"
            target: "速報比較依頼(rapid_crosscheck_request)"
          - type: "information"
            action: "modify"
            target: "確報比較依頼(final_crosscheck_request)"
          - type: "information"
            action: "modify"
            target: "比較ツール実行結果"
      - id: "SPEC-007-03"
        specification: "比較ツールの終了コードと依頼状態の対応は比較ツールの契約に従う(例: 比較 OK=0→SUCCEEDED、比較 NG=3→FAILED(警告終了)、実行エラー=6→FAILED(エラー終了))。確報は worker が保存した exitcode をそのままジョブスケジューラへ中継する"
        acceptance_criteria:
          - "Given 比較ツールが 3 で終了 When 確報 runner が応答する Then 依頼は FAILED、ジョブスケジューラへの終了コードは 3"
        affected_models:
