requirements:
  - id: "REQ-004"
    requirement: "ジョブスケジューラのジョブ定義に実行先(ホスト・実行ユーザー・スクリプトパス)を持たせず、slot runner が実装固有のジョブマップで JOB_ID から実行先を解決し、解決結果を execution-spec.json として保存すること"
    reason: "ジョブスケジューラ側の定義を実装非依存に保ち、実行設定の正本を成果物として残すことでリラン時の再現性を確保するため"
    priority: "must"
    specifications:
      - id: "SPEC-004-01"
        specification: "実装スロットと runner は feature flag が、ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・hang_detect_limit_minutes は該当 slot のジョブマップが、速報・確報の比較ツール起動コマンド(各 1 行)はそれぞれの worker が読む設定が所有する。比較対象(テーブル・ファイル)の定義は relay-gate の設定に持たず、適用側が比較ツール側で定義する"
        acceptance_criteria:
          - "Given slot のジョブマップに JOB_ID の行がある When runner が JOB_ID を解決する Then ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・hang_detect_limit_minutes が得られる"
          - "Given relay-gate の設定ファイル一式 When 比較対象(テーブル・ファイル)の一覧やジョブ ID ごとの比較定義を探す Then 存在せず、クロスチェックに関する設定は速報・確報の比較ツール起動コマンド各 1 行だけである"
        feedback_source:
          feedback_request_id: "20261010_104636_impl_feedback_dcd8234d"
          work_unit_ids:
            - "CR-dcd8234d-007#1"
        affected_models:
          - type: "information"
            action: "add"
            target: "ジョブマップ"
          - type: "business_policy"
            action: "add"
            target: "ジョブ解決契約"
          - type: "information"
            action: "modify"
            target: "比較定義"
          - type: "variation"
            action: "modify"
            target: "設定所有区分"
          - type: "condition"
            action: "modify"
            target: "設定所有区分"
          - type: "actor"
            action: "modify"
            target: "基盤適用設計者"
      - id: "SPEC-004-02"
        specification: "ジョブマップの固定引数の後ろに、ジョブスケジューラから渡された PARAM... を順序を変えずに連結して実装へ渡す。固定引数は JSON 配列として保持し、引数の数と各引数内の空白・カンマを維持する。空の固定引数は [] とする"
        acceptance_criteria:
          - "Given 固定引数 [\"p1\",\"p2 p3\"] と追加引数 a b When 実装へ渡す引数を確認する Then p1, \"p2 p3\", a, b の順で 4 引数として渡される"
        affected_models:
          - type: "business_policy"
            action: "modify"
            target: "ジョブ解決契約"
      - id: "SPEC-004-03"
        specification: "run 開始時に、解決済みのホスト・スクリプト・作業ディレクトリ・固定引数・追加引数・マップ版・実装版・role ごとの hang_detect_limit_minutes を facade/<run_id>/execution-spec.json として一度だけ確定保存する。認証情報そのものは保存せず参照名だけを保存する"
        acceptance_criteria:
          - "Given run を開始した When facade/<run_id>/execution-spec.json を確認する Then 解決済みの実行設定・追加引数・マップ版・実装版・role ごとの hang_detect_limit_minutes が記録され、認証情報の値は含まれない"
          - "Given run 開始後にジョブマップを変更した When 同じ run の execution-spec.json を確認する Then 変更前の内容のまま上書きされていない"
        affected_models:
          - type: "information"
            action: "add"
            target: "実行設定(execution-spec)"
          - type: "business_policy"
            action: "modify"
            target: "ジョブ解決契約"
      - id: "SPEC-004-04"
        specification: "slot ジョブマップは CSV ファイル(1 行目ヘッダー、1 行 1 job_id)とする。列は元資料の列名 job_id,host,user,work_dir,script,fixed_params,hang_detect_limit_minutes を用い、host と user はローカル実行の slot では省略できる。fixed_params は JSON 配列文字列を格納する CSV セルで、セルは二重引用符で囲み、セル内の二重引用符は二重化する。認証情報の参照名(credential_ref)とマップ版(map_version)は末尾の任意列として許容し必須にしない。実装版の列は持たず、実装版は feature flag(BLUE_IMPL / GREEN_IMPL)が所有する。クロスチェックの設定はジョブ ID ごとの行構造を持つ CSV(クロスチェックジョブマップ)や対象カタログにせず、速報・確報の比較ツール起動コマンドを 1 行の文字列として、それぞれの worker が読む設定ファイルに 1 つずつ定義する(ファイル名・キー名は仕様で確定する。推奨は既存の速報クロスチェック設定と確報クロスチェック worker の設定にキーを 1 つずつ追加する案)。設定検証(validate-config.sh)が起動コマンドに対して行う検証は次の 2 点だけとする: (1) コマンド部分(先頭の語)が絶対パスで、存在し、実行可能であること、(2) 速報の起動コマンドに {job_id} が含まれること。検証はコマンド部分に対して行い、引数部分の内容は検査しない。違反時の文言は CLI 契約(仕様)で確定する"
        acceptance_criteria:
          - "Given 元資料どおりの列名(job_id,host,user,work_dir,script,fixed_params,hang_detect_limit_minutes)の CSV ジョブマップ When runner が JOB_ID を解決する Then 列名の読み替えなしに host・user・script・work_dir・fixed_params・hang_detect_limit_minutes が得られる"
          - "Given fixed_params セルに p1 と p2 p3 の 2 要素の JSON 配列を、二重引用符で囲み内部の二重引用符を二重化して書いた When runner が固定引数を解析する Then 空白とカンマを維持した 2 引数として得られる"
          - "Given host と user の列を持たないローカル実行用の slot ジョブマップ When runner が JOB_ID を解決する Then ローカル実行として解決される"
          - "Given credential_ref と map_version の列を持たないジョブマップ When 設定を検証する Then エラーにならず、両列がある場合は末尾の任意列として読み込まれる"
          - "Given 速報の起動コマンドのコマンド部分(先頭の語)が絶対パスで、存在し、実行可能で、文字列に {job_id} を含む When validate-config.sh で速報の起動コマンドの設定を検証する Then 終了コード 0 で終了し、stderr に error 行が出ない"
          - "Given 起動コマンドのコマンド部分が絶対パスでない When validate-config.sh で検証する Then 非 0 の終了コードで終了し、stderr に絶対パスでない旨の error 行がキー名とパスつきで 1 行出る"
          - "Given 起動コマンドのコマンド部分のファイルが存在しない、または実行可能でない When validate-config.sh で検証する Then 非 0 の終了コードで終了し、stderr に実行可能でない旨の error 行がキー名とパスつきで 1 行出る"
          - "Given 速報の起動コマンドに {job_id} が含まれない When validate-config.sh で検証する Then 非 0 の終了コードで終了し、stderr に {job_id} が無い旨の error 行がキー名と値つきで 1 行出る"
          - "Given 確報の起動コマンドにプレースホルダが 1 つも無い When validate-config.sh で確報の起動コマンドの設定を検証する Then 終了コード 0 で終了する(確報の起動コマンドにプレースホルダは要求しない)"
          - "Given 起動コマンドの引数部分に任意の文字列(存在しないパスや未知の語を含む) When validate-config.sh で検証する Then 引数部分を理由とする error 行は出ず、終了コードは引数部分の内容に影響されない"
          - "Given relay-gate の設定ファイル置き場 When クロスチェックジョブマップ CSV や対象カタログ CSV を探す Then 存在せず、validate-config.sh にそれらを検証する種別も無い"
