          - "Given exitcode.txt が 0 When 検知ジョブが実行される Then 通知されない"
        affected_models:
          - type: "buc"
            action: "add"
            target: "background 実行監視"
          - type: "condition"
            action: "add"
            target: "ハング検知判定"
          - type: "actor"
            action: "add"
            target: "運用者"
      - id: "SPEC-008-02"
        specification: "速報比較依頼については依頼状態と終了コードを確認し、FAILED または比較 NG を速報クロスチェック異常として通知する。速報比較依頼が RUNNING のときは状態を変更せずハング疑いとして通知する"
        acceptance_criteria:
          - "Given 速報比較依頼が FAILED When 検知ジョブが実行される Then 速報クロスチェック異常として通知される"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "background 実行監視"
      - id: "SPEC-008-03"
        specification: "監視は monitor_status、hang_suspected_at、alerted_at を記録して運用者へ通知する。通知後に正常終了した実行についても警告した経過時間を記録し、通常処理の警告傾向を確認できるようにする。RAPID_CROSSCHECK_MODE=off の場合も slot 成果物だけで監視する。monitor_status の値は監視対象外 / 監視中 / ハング疑い通知済み / 実行エラー通知済み / 比較異常通知済み / 正常終了の 6 値とし、ハング疑い通知後に対象が終端した場合は再判定して比較異常通知済み / 実行エラー通知済み / 正常終了へ遷移する。監視対象が ABORTED になった場合は中止済みとして正常終了で終端する"
        acceptance_criteria:
          - "Given ハング疑いを通知した実行がその後正常終了した When 監視記録を確認する Then 警告時の経過時間が記録されている"
          - "Given RAPID_CROSSCHECK_MODE=off When 検知ジョブが実行される Then 管理 DB なしで slot 成果物を走査して監視する"
          - "Given ハング疑いを通知した速報比較依頼がその後 FAILED または比較 NG になった When 検知ジョブが実行される Then 監視状態は比較異常通知済みへ遷移し error メールが送られる"
          - "Given ハング疑いを通知した background slot がその後 ABORTED になった When 検知ジョブが実行される Then 監視記録は中止済みとして正常終了で終端し、以後再判定されない"
          - "Given バリエーション「監視状態」と状態モデル「監視状態」 When 値集合を比較する Then 同じ 6 値である"
