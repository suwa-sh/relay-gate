  - id: "REQ-008"
    requirement: "ハング検知が background 実行(background slot と速報比較依頼)を定期監視し、ジョブスケジューラの実行結果に現れない background 異常を運用者へ通知すること"
    reason: "background slot と速報クロスチェックはジョブスケジューラのジョブステータスに現れないため、ハング・異常終了・比較 NG を別経路で検知して運用者に知らせる必要がある"
    priority: "must"
    specifications:
      - id: "SPEC-008-01"
        specification: "ハング検知スクリプトはジョブスケジューラの定期ジョブ(5 分ごとなど)として起動され、未完了の background role について started-at.txt と execution-spec.json の hang_detect_limit_minutes から経過時間を判定する。exitcode.txt があり終了コード 0 なら対象外、非 0 なら background 実行エラーとして通知、exitcode.txt がなく経過時間が上限以内なら継続監視、上限超過ならハング疑いとして通知する"
        acceptance_criteria:
          - "Given background role の exitcode.txt がなく経過時間が hang_detect_limit_minutes を超過 When 検知ジョブが実行される Then ハング疑いとして通知される"
