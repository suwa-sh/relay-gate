          - type: "variation"
            action: "modify"
            target: "ハング検知判定結果"
          - type: "information"
            action: "modify"
            target: "監視記録"
      - id: "SPEC-008-04"
        specification: "ハング検知は RUNNING を ABORTED へ変更せず、実行プロセスを停止せず、新しい実行依頼を作成しない(自動中止・自動再実行をしない)"
