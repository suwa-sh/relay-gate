  request_ids: ["CR-6078c4ed-008","CR-6078c4ed-009","CR-6078c4ed-010"]
  work_unit_ids: ["CR-6078c4ed-008#1","CR-6078c4ed-009#1","CR-6078c4ed-010#1"]

requirements:
  - id: "REQ-002"
    requirement: "foreground実行結果だけをジョブスケジューラへ応答する"
    reason: "ジョブスケジューラは標準出力・標準エラー・終了コードの受け取りだけを契約とするため、その契約を維持する必要がある"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "facadeはforeground roleの標準出力・標準エラーをそのままジョブスケジューラへ中継し、プロセス終了コードとしてforegroundのexitcode.txtの値を0を含む全値そのまま透過する"
        acceptance_criteria:
          - "Given foreground roleの実行が完了する When facadeが応答を返す Then stdout.log/stderr.logの内容がそのままジョブスケジューラへ中継される"
          - "Given foreground roleのexitcode.txtが非0の値（例: 3）である When facadeがプロセスを終了する Then 同じ値がプロセス終了コードとしてジョブスケジューラへ透過され、一律の値へ丸められない"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-010#1"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "ジョブスケジューラ"
          - type: "buc"
            action: "add"
            target: "並行稼働実行"
      - id: "SPEC-002-02"
        specification: "実行順序は、background roleを先にすべて起動してPIDと成果物ディレクトリを確定した後、foreground roleを起動し、最後にforegroundのPIDだけを待機する固定順序とする"
        acceptance_criteria:
          - "Given background roleとforeground roleが両方設定されている When facadeがジョブを起動する Then background roleが先に起動し、foreground待機中もbackground roleは並走して実行される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "並行稼働実行"
      - id: "SPEC-002-03"
        specification: "relay-gate自身のエラーは、業務ジョブが通常使用しない専用の退避終了コードへ分離する。実行結果未確定・取得不能・中止済み（UNKNOWN/ABORTEDを含む）は125、relay-gateのバリデーションエラーは124とする。UNKNOWNを推測でFAILED相当の終了コードへ変換しない"
        acceptance_criteria:
          - "Given foregroundの実行結果が未確定または取得不能である When facadeが応答を返す Then 終了コードは125であり、業務ジョブの終了コードとして解釈されない"
          - "Given run_id未指定などrelay-gateのバリデーションエラーが発生する When facadeが応答を返す Then 終了コードは124である"
          - "Given foregroundの実行状態がUNKNOWNである When facadeが終了コードを決定する Then FAILED相当の業務終了コードへ推測で変換されず退避コード125が使われる"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-010#1"
        affected_models:
          - type: "condition"
            action: "add"
            target: "relay-gateエラーの退避終了コード"
          - type: "business_policy"
            action: "add"
            target: "relay-gateエラーの退避終了コード分離ポリシー"
      - id: "SPEC-002-04"
        specification: "relay-gateエラーで応答する場合の標準エラーは、foregroundのstderr.logの内容（取得可能な場合）とrelay-gate自身のエラー内容（原因と次アクション）を併記してジョブスケジューラへ返す"
        acceptance_criteria:
          - "Given relay-gateエラーが発生しforegroundのstderr.logを取得できる When facadeが応答を返す Then 標準エラーにstderr.logの内容とrelay-gateのエラー内容（原因と次アクション）の両方が含まれる"
          - "Given relay-gateエラーが発生しforegroundのstderr.logを取得できない When facadeが応答を返す Then 標準エラーにrelay-gateのエラー内容（原因と次アクション）が出力される"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-010#1"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
          - type: "buc"
            action: "add"
            target: "並行稼働実行"

  - id: "REQ-003"
    requirement: "blue/green runnerの実行結果を、共通形式の成果物（Runner Result Contract）として標準化する"
    reason: "ジョブスケジューラへの応答、完了通知、障害調査の3用途で共通の成果物形式を使い、実装ごとの差異を吸収するため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "blue runnerとgreen runnerは、foreground・backgroundのいずれでも、started-at.txt・stdout.log・stderr.log・exitcode.txtと、run単位のexecution-spec.jsonを出力する"
        acceptance_criteria:
          - "Given blue runnerまたはgreen runnerの実行が終了する When 成果物を確認する Then execution-spec.json、started-at.txt、stdout.log、stderr.log、exitcode.txtが揃っている"
        affected_models:
          - type: "information"
            action: "add"
            target: "execution-spec.json"
          - type: "information"
            action: "add"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
      - id: "SPEC-003-02"
        specification: "起動失敗・ジョブマップ未定義・SSH失敗が発生した場合でも、可能な限り3ファイル（stdout.log/stderr.log/exitcode.txt）を出力する"
        acceptance_criteria:
          - "Given 起動先ホストへのSSH接続が失敗する When runnerが異常終了する Then 可能な範囲でstdout.log/stderr.log/exitcode.txtが出力される"
        affected_models:
          - type: "information"
            action: "add"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
      - id: "SPEC-003-03"
        specification: "成果物は実行終了後に一時ファイルへ出力してから確定名へリネームし、揃った状態で公開する。後続処理は書き込み途中のファイルを読まない"
        acceptance_criteria:
          - "Given runnerが成果物を出力中である When 後続処理（hang-detectorや速報クロスチェック）が成果物を参照する Then 書き込み途中の不完全なファイルを読まない"
        affected_models:
          - type: "information"
            action: "add"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
      - id: "SPEC-003-04"
        specification: "Runner実行結果は起動試行（attempt）単位で識別し、attempt_id・attempt_no・accepted_atを保持する。実行状態はSTARTING/RUNNING/SUCCEEDED/FAILED/UNKNOWN/ABORTEDの6値とし、起動受付時点はSTARTING、timeoutや結果取得不能の場合はUNKNOWNとして推測でFAILEDを確定しない。UNKNOWNからの確定は実結果の回収または対話確認による回復でのみ行う"
        acceptance_criteria:
          - "Given 同一run_id・slot種別・role区分で複数回起動する When Runner実行結果を参照する Then attempt_idにより起動試行が一意に識別され、attempt_noが同一組内の連番になっている"
          - "Given 起動を受け付ける When Runner実行結果を参照する Then accepted_atが記録され実行状態がSTARTINGである"
          - "Given timeoutにより実行結果を取得できない When 実行状態を確定する Then 実行状態はUNKNOWNとなりFAILEDへ推測で確定されない"
          - "Given 実行状態がUNKNOWNである When 実結果を回収するまたは対話確認による回復を行う Then SUCCEEDED・FAILED・ABORTEDのいずれかへ確定する"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-008#1"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
          - type: "state"
            action: "modify"
            target: "background slot実行状態"

  - id: "REQ-009"
    requirement: "ジョブスケジューラのジョブ定義から実行先の詳細（ホスト・実行ユーザー・スクリプト・作業ディレクトリ）を分離し、slot runnerのジョブマップで解決する"
    reason: "ジョブスケジューラのジョブ定義を実装詳細から独立させ、実装固有の情報を変更してもジョブ定義自体を変更せずに済むようにするため"
    priority: "must"
    specifications:
      - id: "SPEC-009-01"
        specification: "ジョブスケジューラはJOB_IDと追加引数（PARAM...）だけをfacadeへ渡し、実行先ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・hang_detect_limit_minutesは該当slotのジョブマップが解決する"
        acceptance_criteria:
          - "Given ジョブスケジューラがJOB_IDと追加引数だけを渡す When slot runnerがジョブマップを参照する Then 実行先の詳細が解決される"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "ジョブスケジューラ"
          - type: "information"
            action: "add"
            target: "execution-spec.json"
      - id: "SPEC-009-02"
        specification: "job mapの固定引数の後ろに、ジョブスケジューラから渡された追加引数を順序を変えずに連結する"
        acceptance_criteria:
          - "Given job mapに固定引数が定義されている When ジョブスケジューラから追加引数が渡される Then 固定引数の後ろに追加引数が順序どおり連結される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "並行稼働実行"
      - id: "SPEC-009-03"
        specification: "起動時に解決済みのホスト・スクリプト・作業ディレクトリ・固定引数・追加引数・マップ版・実装版・roleごとのhang_detect_limit_minutesをexecution-spec.jsonとして保存する。認証情報そのものは保存せず、認証情報の参照名だけを保存する"
        acceptance_criteria:
          - "Given slot runnerが実行先を解決する When 起動する Then execution-spec.jsonに解決済み設定が一度だけ確定して保存され、認証情報そのものは含まれない"
        affected_models:
          - type: "information"
            action: "add"
            target: "execution-spec.json"
          - type: "business_policy"
            action: "add"
            target: "認証情報の参照名のみ保存ポリシー"
      - id: "SPEC-009-04"
        specification: "job mapを変更しても、実行済みまたはリラン対象の設定は上書きされない"
        acceptance_criteria:
          - "Given job mapを変更する When 既存run_idのexecution-spec.jsonを参照する Then 変更前の設定内容が保持される"
        affected_models:
          - type: "information"
            action: "add"
            target: "execution-spec.json"
      - id: "SPEC-009-05"
        specification: "実行設定は、run共通の実行設定（run_id・parent_run_id・JOB_ID・追加引数・マップ版・hang_detect_limit_minutes）と、slot別実行設定（ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・実装版・認証情報参照名）に分離して保存する。slot別実行設定はrun_idとslot種別で一意に識別する"
        acceptance_criteria:
          - "Given blueとgreenで異なるホスト・スクリプトが解決される When 起動時の実行設定を参照する Then run共通の実行設定とslot別実行設定が分離して保存され、slot別実行設定がrun_idとslot種別で一意に識別される"
          - "Given slot別実行設定を保存する When 内容を確認する Then 認証情報は参照名のみが保存され実値は含まれない"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-008#1"
        affected_models:
          - type: "information"
            action: "add"
            target: "slot別実行設定"
          - type: "information"
            action: "modify"
            target: "execution-spec.json"

  - id: "REQ-012"
    requirement: "runnerの差し替え、比較定義の切替、速報クロスチェックの無効化により、異なる世代の実装を段階的に導入・拡張できる"
    reason: "実装の世代交代が今後も発生することを見越し、facade本体や運用の仕組みを変えずに新しい世代の実装を追加・拡張できるようにするため"
    priority: "should"
    specifications:
      - id: "SPEC-012-01"
        specification: "blue/greenのrunnerを差し替えることで、異なる世代の実装を並行稼働できる"
        acceptance_criteria:
          - "Given 新しい世代の実装用runnerを追加する When BLUE_RUNNERまたはGREEN_RUNNERの設定を差し替える Then facade本体を変更せず新しい世代の実装を並行稼働できる"
        affected_models:
          - type: "variation"
            action: "add"
            target: "運用モード（並行稼働／新実装単独本番／次世代実装との並行稼働）"
      - id: "SPEC-012-02"
        specification: "RAPID_CROSSCHECK_MODE=offにより、facadeから起動する速報クロスチェックを停止できる"
        acceptance_criteria:
          - "Given RAPID_CROSSCHECK_MODE=offを設定する When facadeがジョブを起動する Then 速報クロスチェックの完了通知・DB接続・書込みが発生しない"
        affected_models:
          - type: "condition"
            action: "add"
            target: "feature flag設定（BLUE_MODE/GREEN_MODE/RAPID_CROSSCHECK_MODE）"
      - id: "SPEC-012-03"
        specification: "比較定義はjob_idごとに差し替えられる。比較定義はJOB_ID・比較対象テーブル・比較対象ファイル・比較実装識別子・有効期間を保持し、速報クロスチェックと確報クロスチェックの双方が実行時に参照する"
        acceptance_criteria:
          - "Given job_idごとに異なる比較対象・比較実装を定義する When 速報・確報クロスチェックが実行される Then job_idに応じた比較定義が適用される"
          - "Given 同一JOB_IDに対して有効期間の異なる比較定義が登録されている When 実行時点に対応する比較定義を解決する Then 有効期間に該当する比較定義が1件適用される"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-009#1"
        affected_models:
          - type: "information"
            action: "add"
            target: "比較定義"
          - type: "buc"
            action: "add"
            target: "速報クロスチェック"
          - type: "buc"
            action: "add"
            target: "確報クロスチェック"
