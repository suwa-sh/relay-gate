requirements:
  - id: "REQ-009"
    requirement: "ジョブスケジューラのジョブ定義から実行先の詳細（ホスト・実行ユーザー・スクリプト・作業ディレクトリ）を分離し、slot runnerのジョブマップで解決する"
    reason: "ジョブスケジューラのジョブ定義を実装詳細から独立させ、実装固有の情報を変更してもジョブ定義自体を変更せずに済むようにするため"
    priority: "must"
    specifications:
      - id: "SPEC-009-01"
        specification: "ジョブスケジューラはJOB_IDと追加引数（PARAM...）だけをfacadeへ渡し、実行先ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・hang_detect_limit_minutesは該当slotのジョブマップが解決する"
        acceptance_criteria:
          - "Given ジョブスケジューラがJOB_IDと追加引数だけを渡す When slot runnerがジョブマップを参照する Then 実行先の詳細が解決される"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "ジョブスケジューラ"
          - type: "information"
            action: "add"
            target: "execution-spec.json"
      - id: "SPEC-009-02"
        specification: "job mapの固定引数の後ろに、ジョブスケジューラから渡された追加引数を順序を変えずに連結する"
        acceptance_criteria:
          - "Given job mapに固定引数が定義されている When ジョブスケジューラから追加引数が渡される Then 固定引数の後ろに追加引数が順序どおり連結される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "並行稼働実行"
      - id: "SPEC-009-03"
        specification: "起動時に解決済みのホスト・スクリプト・作業ディレクトリ・固定引数・追加引数・マップ版・実装版・hang_detect_limit_minutesを、execution spec（run共通の実行設定execution_specsとslot別実行設定slot_execution_specs）としてRDBに保存する。hang_detect_limit_minutesはrun共通の1値として保存し、その値にはbackground roleに選ばれたslotのジョブマップのhang_detect_limit_minutesを採用する（role別・slot別の値は保存しない）。認証情報そのものは保存せず、認証情報の参照名だけを保存する"
        acceptance_criteria:
          - "Given slot runnerが実行先を解決する When 起動する Then run共通の実行設定（execution_specs）とslot別実行設定（slot_execution_specs）に解決済み設定が一度だけ確定してRDBへ保存され、認証情報そのものは含まれない"
          - "Given background roleに選ばれたslotのジョブマップにhang_detect_limit_minutesが定義されている When 起動時の実行設定を保存する Then hang_detect_limit_minutesはrun共通の実行設定（execution_specs）に1値として保存され、role別・slot別の値は保存されない"
        feedback_source:
          feedback_request_id: "20260822_085257_impl_feedback_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-016#1"
        affected_models:
          - type: "information"
            action: "modify"
            target: "execution-spec.json"
          - type: "condition"
            action: "modify"
            target: "hang_detect_limit_minutes"
          - type: "business_policy"
            action: "add"
            target: "認証情報の参照名のみ保存ポリシー"
      - id: "SPEC-009-04"
        specification: "job mapを変更しても、実行済みまたはリラン対象の設定は上書きされない"
        acceptance_criteria:
          - "Given job mapを変更する When 既存run_idのexecution-spec.jsonを参照する Then 変更前の設定内容が保持される"
        affected_models:
          - type: "information"
            action: "add"
            target: "execution-spec.json"
      - id: "SPEC-009-05"
        specification: "実行設定は、run共通の実行設定（run_id・parent_run_id・JOB_ID・追加引数・マップ版・hang_detect_limit_minutes）と、slot別実行設定（ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・実装版・認証情報参照名）に分離して保存する。slot別実行設定はrun_idとslot種別で一意に識別する"
        acceptance_criteria:
          - "Given blueとgreenで異なるホスト・スクリプトが解決される When 起動時の実行設定を参照する Then run共通の実行設定とslot別実行設定が分離して保存され、slot別実行設定がrun_idとslot種別で一意に識別される"
          - "Given slot別実行設定を保存する When 内容を確認する Then 認証情報は参照名のみが保存され実値は含まれない"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-008#1"
        affected_models:
          - type: "information"
            action: "add"
            target: "slot別実行設定"
          - type: "information"
            action: "modify"
            target: "execution-spec.json"
