requirements:
  - id: "REQ-008"
    requirement: "中止済み・完了済みのbackground実行や速報比較依頼を、元の実行設定を保ったまま選択的に再実行できる"
    reason: "background実行はジョブスケジューラの通常リランの対象外であり、元の実行設定（ホスト・スクリプト・引数）を保った再実行手段が必要なため"
    priority: "must"
    specifications:
      - id: "SPEC-008-01"
        specification: "background-rerun.shは、元のexecution-spec.jsonからホスト・実行ユーザー・スクリプト・作業ディレクトリ・実行パラメータを復元し、新しいrun_idを発行して再実行する。新しい実行のparent_run_idには直前のリラン元run_idを設定する。元の実行のレコードと履歴は上書きしない"
        acceptance_criteria:
          - "Given 元のbackground slot実行が完了済みまたは中止済みである When background-rerun.shを実行する Then 元のexecution-spec.jsonの設定で新しいrun_idの実行が開始され、parent_run_idが元のrun_idに設定される"
          - "Given background-rerun.shによる再実行が開始される When 元のbackground slot実行のレコードを参照する Then 元の実行の状態・履歴は変更されていない"
        feedback_source:
          feedback_request_id: "20260818_113601_impl_feedback_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-003#1"
        affected_models:
          - type: "buc"
            action: "add"
            target: "background側リラン"
          - type: "information"
            action: "add"
            target: "execution-spec.json"
          - type: "state"
            action: "modify"
            target: "background slot実行状態"
      - id: "SPEC-008-02"
        specification: "対象がRUNNINGの実行、元のslot modeがforegroundまたはoff、未対応role、または元の実行が見つからない場合は、リランせず呼び出し元の専用ジョブをエラー終了する"
        acceptance_criteria:
          - "Given 対象実行がRUNNING中である When background-rerun.shを実行する Then リランせずエラー終了する"
          - "Given 元のslot modeがforegroundまたはoffである When 該当roleを指定してbackground-rerun.shを実行する Then リランせずエラー終了する"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "RUNNING中の実行はリラン禁止ポリシー"
      - id: "SPEC-008-03"
        specification: "roleにrapid-crosscheckを指定した場合、業務ジョブを再実行せず、新しいrun_idを発行した速報比較依頼を新規作成する。新規依頼のparent_run_idには元依頼のrun_idを設定し、元依頼のレコード・状態・履歴は上書きしない"
        acceptance_criteria:
          - "Given roleにrapid-crosscheckを指定してbackground-rerun.shを実行する When 実行が成功する Then 業務ジョブは再実行されず、新しいrun_idの速報比較依頼がparent_run_idで元依頼に関連付けられて新規作成される"
          - "Given rapid-crosscheckの再実行が完了する When 元の速報比較依頼のレコードを参照する Then 元依頼の状態・履歴は変更されていない"
        feedback_source:
          feedback_request_id: "20260818_113601_impl_feedback_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-003#1"
        affected_models:
          - type: "buc"
            action: "add"
            target: "background側リラン"
          - type: "state"
            action: "modify"
            target: "速報比較依頼状態"
      - id: "SPEC-008-04"
        specification: "foreground slot実行と確報クロスチェックは、background-rerun.shを使用せず、ジョブスケジューラの正規ジョブを直接再実行する"
        acceptance_criteria:
          - "Given foreground slotまたは確報クロスチェックを再実行したい When 運用者が対応を行う Then background-rerun.shではなくジョブスケジューラの正規ジョブが再実行される"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "RUNNING中の実行はリラン禁止ポリシー"
