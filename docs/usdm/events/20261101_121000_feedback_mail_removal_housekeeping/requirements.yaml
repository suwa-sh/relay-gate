      - id: "SPEC-014-03"
        specification: "実行の単位を消す条件は、単位内のすべての構成要素(並行稼働実行、各 slot、速報比較依頼)が終端していることとする。管理 DB を使う設定では、並行稼働実行が COMPLETED / ABORTED、すべての slot 実行が SUCCEEDED / FAILED / ABORTED、すべての速報比較依頼が SUCCEEDED / FAILED / ABORTED であること。RAPID_CROSSCHECK_MODE=off で管理 DB の行が無い実行は成果物だけで判定し、execution-spec.json で起動対象になっている slot(mode が off の slot は含まない)のすべてで、成果物ディレクトリに exitcode.txt または aborted.txt があること。起動対象の slot の成果物ディレクトリが無い場合や execution-spec.json が無い実行は、終わっていないものとして残し、標準エラーに warn を出す。速報比較依頼だけのリランで作られた run は成果物を持たないため、管理 DB の行だけで判定する。1 つでも終わっていない構成要素(RUNNING、CLAIMED、REQUESTED、slot の終了ファイルが無い)があれば、経過日数にかかわらず単位ごと残す"
        acceptance_criteria:
          - "Given 並行稼働実行は COMPLETED(foreground の中継は終わった)だが background slot が RUNNING のまま、ほかの構成要素の終了日時から保持日数を過ぎた実行 When ハウスキープを実行する Then その実行の成果物と管理 DB の行は残る"
          - "Given 並行稼働実行は COMPLETED だが速報比較依頼が REQUESTED・CLAIMED・RUNNING のいずれかのまま、ほかの構成要素の終了日時から保持日数を過ぎた実行 When ハウスキープを実行する Then その実行の成果物と管理 DB の行は残る"
          - "Given RAPID_CROSSCHECK_MODE=off で管理 DB の行が無く、execution-spec.json で起動対象のすべての slot の成果物ディレクトリに exitcode.txt または aborted.txt があり、その更新時刻の最も遅いものから保持日数を過ぎた実行 When ハウスキープを実行する Then その実行の成果物ディレクトリと通知済みの印が無くなる"
          - "Given RAPID_CROSSCHECK_MODE=off で管理 DB の行が無く、起動対象のすべての slot が終了しているが、その最も遅い更新時刻から保持日数以内の実行 When ハウスキープを実行する Then その実行の成果物ディレクトリは残る"
          - "Given RAPID_CROSSCHECK_MODE=off で管理 DB の行が無く、起動対象の slot のいずれかの成果物ディレクトリに exitcode.txt も aborted.txt も無い実行 When ハウスキープを実行する Then 経過日数にかかわらずその実行の成果物ディレクトリは残る"
          - "Given execution-spec.json で mode が off の slot があり、その slot の成果物ディレクトリが無く、起動対象のほかの slot はすべて終了して保持日数を過ぎた実行 When ハウスキープを実行する Then その実行の成果物ディレクトリは無くなる"
          - "Given 管理 DB の行が無く、execution-spec.json が無いか、起動対象の slot の成果物ディレクトリが無い成果物ディレクトリ When ハウスキープを実行する Then その成果物ディレクトリは残り、標準エラーに warn の行が出る"
          - "Given 速報比較依頼だけのリランで作られた run を含むリランの親子で、すべての管理 DB の行が終端し、最も遅い終了日時から保持日数を過ぎた When ハウスキープを実行する Then その run を含む親子すべての管理 DB の行と成果物が無くなる"
          - "Given 速報比較依頼だけのリランで作られた run の速報比較依頼が RUNNING である When ハウスキープを実行する Then その run とリランの親子の管理 DB の行と成果物は、経過日数にかかわらず残る"
