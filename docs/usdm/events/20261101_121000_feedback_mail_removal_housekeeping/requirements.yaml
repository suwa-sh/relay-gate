          - type: "variation"
            action: "modify"
            target: "ハング検知判定結果"
          - type: "information"
            action: "modify"
            target: "監視記録"
      - id: "SPEC-008-04"
        specification: "ハング検知は RUNNING を ABORTED へ変更せず、実行プロセスを停止せず、新しい実行依頼を作成しない(自動中止・自動再実行をしない)"
        acceptance_criteria:
          - "Given ハング疑いを検知した When 検知ジョブが終了する Then 対象の状態は RUNNING のままで、プロセスは停止されず、新しい依頼も作られていない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "監視は通知のみ"
      - id: "SPEC-008-05"
        specification: "hang_detect_limit_minutes は導入時に全ジョブ 60 分に設定し、正常終了パターンの警告が出そろった時点でジョブごとに最後の警告の経過時間を基準に調整する。foreground role は 0 を設定して検知対象から除外できる"
        acceptance_criteria:
          - "Given ジョブマップの hang_detect_limit_minutes を変更した When 次回以降の run を実行する Then 新しい上限が execution-spec.json に反映され判定に使われる"
          - "Given slot ジョブマップが定義されている When ジョブマップの列を確認する Then hang_detect_limit_minutes の調整記録(調整日時・調整根拠)を保持する列は存在しない"
          - "[自動判定の対象外: 運用文書の記載] Given hang_detect_limit_minutes を調整した When 運用者が調整を記録する Then 調整日時と調整根拠(警告時経過時間)を適用構成文書に残す。適用構成文書は relay-gate が読まない文書のため、relay-gate の出力またはファイルによる自動判定の対象にしない"
        feedback_source:
          feedback_request_id: "20260919_213000_impl_feedback_eff24f55"
          work_unit_ids:
            - "CR-eff24f55-005#1"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "ハング検知上限の調整運用"
          - type: "information"
            action: "modify"
            target: "ハング検知上限設定"
          - type: "information"
            action: "modify"
            target: "適用構成文書"
      - id: "SPEC-008-06"
        specification: "ハング検知定期ジョブの管理 DB 接続参照名は、基盤適用設計者が所有するハング検知定期ジョブ設定(hang-detector 用 env 設定ファイル)で定義する。認証情報は値を置かず参照名のみとする。ハング検知定期ジョブ設定は、通知の宛先・送信コマンド・件名など、ハング検知ジョブの終了結果以外の手段で異常を送るための項目を持たない"
        acceptance_criteria:
          - "Given ハング検知定期ジョブ設定 When 設定項目を確認する Then 通知の宛先・送信コマンド・件名に関する項目は無く、管理 DB 接続参照名がある"
          - "Given 設定所有区分 When ハング検知定期ジョブ設定の所有者を確認する Then 基盤適用設計者である"
          - "Given ハング検知定期ジョブ設定 When 内容を確認する Then 認証情報の値は含まれず管理 DB 接続の参照名だけがある"
        feedback_source:
          feedback_request_id: "20261101_mail_removal_housekeeping"
          work_unit_ids:
            - "CR-e4ea8aaa-001#1"
        affected_models:
          - type: "information"
            action: "modify"
            target: "ハング検知定期ジョブ設定"
          - type: "variation"
            action: "modify"
            target: "設定所有区分"
          - type: "condition"
