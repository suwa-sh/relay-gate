      - id: "SPEC-014-07"
        specification: "管理 DB の行の削除には、ハウスキープ専用の DB ロールを使う。権限は対象テーブル(parallel_runs / slot_executions / rapid_runs / rapid_crosscheck_requests / final_crosscheck_requests / monitor_records)の SELECT と DELETE だけとし、業務用接続ロールには DELETE を足さない。接続はハング検知と同じく接続参照名で解決し、認証情報の値を設定に置かない。インフラ実装の正本と PostgreSQL 構築ロールに、このロールの作成と権限付与を加える。ロール名は仕様で確定する"
        acceptance_criteria:
          - "Given 構築済みの管理 DB When ハウスキープ専用の DB ロールの権限を確認する Then 対象 6 テーブル(parallel_runs / slot_executions / rapid_runs / rapid_crosscheck_requests / final_crosscheck_requests / monitor_records)の SELECT と DELETE だけを持つ"
          - "Given 構築済みの管理 DB When 業務用接続ロールの権限を確認する Then どのテーブルにも DELETE 権限を持たない"
          - "Given ハウスキープ設定 When 内容を確認する Then 認証情報の値は含まれず管理 DB 接続の参照名だけがある"
