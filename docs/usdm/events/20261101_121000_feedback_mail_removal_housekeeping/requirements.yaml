            target: "運用者"

  - id: "REQ-012"
    requirement: "relay-gate は UI 画面を持たず、運用者への提示は CLI の標準出力・標準エラー・終了コードだけで行い、実行履歴・監査はジョブスケジューラの責務としてログファイルだけを残すこと"
    reason: "エアーギャップ環境のオンプレミス Linux でシェルスクリプトと RDB だけで構成し、運用者の既存手段(ジョブスケジューラの実行履歴・ジョブ監視・障害通知)に統合するため"
    priority: "must"
    feedback_source:
      feedback_request_id: "20261101_mail_removal_housekeeping"
      work_unit_ids:
        - "CR-e4ea8aaa-001#1"
    specifications:
      - id: "SPEC-012-01"
        specification: "すべてのスクリプトは CLI として起動され、結果を標準出力・標準エラー・終了コードで返す。ハング検知の通知もハング検知ジョブの終了コードと標準エラーで行い(SPEC-008-07)、運用者はジョブスケジューラの障害通知を受けて静観または対処を判断する。relay-gate は CLI の出力以外の通知送信手段を持たない"
        acceptance_criteria:
          - "Given 任意のスクリプトを起動 When 結果を確認する Then GUI を必要とせず標準出力・標準エラー・終了コードで判定できる"
          - "Given background 異常を検知 When ジョブスケジューラでハング検知ジョブの結果を確認する Then 警告終了または失敗のジョブステータスと、標準エラーの warning / error の行で異常を判定できる"
          - "Given relay-gate の設定ファイル一式 When 通知の宛先・送信コマンドなど CLI の出力以外で運用者へ知らせるための設定項目を探す Then 存在しない"
        feedback_source:
          feedback_request_id: "20261101_mail_removal_housekeeping"
          work_unit_ids:
            - "CR-e4ea8aaa-001#1"
        affected_models:
          - type: "business_policy"
            action: "delete"
            target: "CLI とメールによる提示"
          - type: "business_policy"
            action: "add"
            target: "CLI による提示"
          - type: "external_system"
            action: "delete"
            target: "メール通知"
      - id: "SPEC-012-02"
        specification: "ジョブの実行履歴・監査はジョブスケジューラの責務とし、relay-gate は Runner Result Contract の成果物と各スクリプトの実行ログをファイルとして残す"
        acceptance_criteria:
          - "Given ジョブが実行された When 履歴を調べる Then ジョブスケジューラの実行履歴と relay-gate の成果物・実行ログで追跡できる"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "実行履歴はジョブスケジューラの責務"

  - id: "REQ-014"
    requirement: "ハウスキープが、ジョブスケジューラの定期ジョブ(1 日 1 回)から起動され、保持日数を過ぎた終了済みの実行の成果物と管理 DB の履歴、および終端した確報比較依頼を自動で削除すること"
    reason: "実行ごとに成果物ディレクトリと管理 DB の行が増え続け、ファイル領域と管理 DB の容量を圧迫する。手作業での削除は、消してよいもの(終了済みか、リランの親子か)の判断を運用者に負わせるため、終端と経過日数の規則で自動判定して削除する"
    priority: "must"
    feedback_source:
      feedback_request_id: "20261101_mail_removal_housekeeping"
      work_unit_ids:
        - "CR-e4ea8aaa-002#1"
    specifications:
      - id: "SPEC-014-01"
        specification: "ハウスキープ専用のスクリプト(housekeep.sh)を追加し、ジョブスケジューラの定期ジョブとして 1 日 1 回起動する想定とする。業務ジョブの起動時には削除しない。保持日数は基盤適用設計者が所有するハウスキープ設定で持ち、既定は 90 日とする。値は正の整数とし、設定検証で検査する。削除したくない場合は定期ジョブを登録しない。設定のファイル名・キー名・終了コード・接続する管理 DB は仕様(CLI 契約・設定契約)で確定する"
        acceptance_criteria:
          - "Given ハウスキープ設定で保持日数を指定していない When ハウスキープを実行する Then 最も遅い終了日時から 90 日を過ぎた終了済みの実行は削除され、90 日以内の終了済みの実行は残る"
          - "Given ハウスキープ設定の保持日数が 0・負の数・整数でない値のいずれかである When 設定検証を実行する Then 非 0 の終了コードで終わり、標準エラーに保持日数の値が不正である旨の行が出る"
          - "Given 保持日数を過ぎた終了済みの実行がある When 業務ジョブ(facade)を起動する Then その実行の成果物と管理 DB の行は削除されずに残る"
          - "Given 設定所有区分 When ハウスキープ設定の所有者を確認する Then 基盤適用設計者である"
        feedback_source:
