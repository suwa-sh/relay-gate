  - id: "REQ-010"
    requirement: "運用者が、プロセス停止を確認した上で、background slot 実行・速報比較依頼・確報比較依頼を明示的に ABORTED へ遷移させられること"
    reason: "ハング検知は自動中止しないため、リラン前に RUNNING を ABORTED にする明示操作が必要。プロセス停止の確認を運用者に委ねることで二重実行を防ぐ"
    priority: "must"
    specifications:
      - id: "SPEC-010-01"
        specification: "abort-blue / abort-green は --run-id を受け取り、対象 slot が background かつ RUNNING のときだけ中止できる。foreground または off の場合は状態を変更せずエラー終了する。中止時は成果物ディレクトリに aborted.txt(中止日時 1 行)を書き、RAPID_CROSSCHECK_MODE が off 以外なら管理 DB の状態も ABORTED に更新する。slot 実行の状態はファイル正本(exitcode.txt があれば SUCCEEDED(0)/ FAILED(非 0)、無く aborted.txt があれば ABORTED、どちらも無ければ RUNNING)から導出する。対象 run に REQUESTED で未着手(worker が claim していない)の速報比較依頼があれば、それも ABORTED にする。これは両系の完了通知で速報比較依頼が REQUESTED で作成された後に運用者が slot を中止した場合の競合窓を塞ぐ保険であり、速報クロスチェック runner(dispatcher)側の中止済み run 判定と併用する。CLAIMED / RUNNING の依頼は abort-blue / abort-green では変更せず、REQUESTED / CLAIMED / RUNNING の速報比較依頼の明示中止は abort-rapid-crosscheck で行う"
        acceptance_criteria:
          - "Given green が background かつ RUNNING When abort-green --run-id を実行し yes と答える Then green slot が ABORTED になる"
          - "Given blue が foreground When abort-blue --run-id を実行する Then 状態を変更せずエラー終了する"
          - "Given RAPID_CROSSCHECK_MODE=off で background slot が RUNNING(exitcode.txt も aborted.txt も無い) When abort-blue を実行して yes と答える Then aborted.txt が書かれ、background-rerun で同じ run をリランできる"
          - "Given exitcode.txt が無く aborted.txt がある slot When 状態を導出する Then ABORTED と判定され、ハング検知は中止済みとして監視記録を終端する"
          - "Given RAPID_CROSSCHECK_MODE=background で background slot を中止した When 管理 DB を確認する Then aborted.txt の書き込みに加えて管理 DB の状態も ABORTED になっている"
          - "Given REQUESTED の速報比較依頼がある run When abort-blue または abort-green を実行して yes と答える Then その依頼も ABORTED になる"
          - "Given CLAIMED または RUNNING の速報比較依頼がある run When abort-blue または abort-green を実行して yes と答える Then slot は ABORTED になるが依頼の状態は変更されない"
          - "Given 両系の完了通知で速報比較依頼が REQUESTED で作成された直後 When 運用者が abort-blue または abort-green で slot を中止して yes と答える Then slot と依頼の両方が ABORTED になり、その後の完了通知でも速報比較依頼は再作成されない"
        feedback_source:
          feedback_request_id: "20260907_abort_consistency"
          work_unit_ids:
            - "CR-c770d8f0-017#1"
            - "CR-c770d8f0-018#1"
        affected_models:
          - type: "buc"
            action: "add"
            target: "実行中止"
          - type: "state"
            action: "add"
            target: "slot 実行"
          - type: "information"
            action: "modify"
            target: "Runner Result"
          - type: "state"
            action: "modify"
            target: "slot 実行"
          - type: "condition"
            action: "add"
            target: "slot 実行の状態導出規則"
          - type: "condition"
            action: "modify"
            target: "slot 中止可否判定"
          - type: "variation"
            action: "modify"
            target: "Runner Result 成果物種別"
          - type: "state"
            action: "add"
            target: "クロスチェック依頼"
          - type: "information"
            action: "modify"
            target: "中止指示"
          - type: "information"
            action: "modify"
            target: "速報比較依頼"
          - type: "buc"
            action: "modify"
            target: "実行中止"
          - type: "state"
            action: "modify"
            target: "クロスチェック依頼"
      - id: "SPEC-010-02"
        specification: "abort-rapid-crosscheck は --run-id を受け取り、対象の速報比較依頼が REQUESTED / CLAIMED / RUNNING のいずれかのとき ABORTED へ遷移させる。運用者に worker のプロセスを停止してあるかを対話確認し、yes のときだけ status IN (REQUESTED, CLAIMED, RUNNING) を条件とする条件付き UPDATE で ABORTED にする。中止できる状態でない(終端済み)場合は状態を変更せずエラー終了する。速報クロスチェック worker は claim 後・比較開始前に依頼が ABORTED になっていれば比較を開始しない(CLAIMED から RUNNING への遷移を条件付き UPDATE で行い、更新件数が 0 件なら終了する)。abort-final-crosscheck は --run-id を受け取り、対象の確報比較依頼が RUNNING のときだけ ABORTED へ遷移させ、RUNNING でない場合は状態を変更せずエラー終了する(確報の未着手依頼はジョブスケジューラの正規ジョブが同期 polling 中であり、runner 側の polling 上限で扱う)"
        acceptance_criteria:
          - "Given 速報比較依頼が RUNNING When abort-rapid-crosscheck --run-id を実行し yes と答える Then 依頼が ABORTED になる"
          - "Given 速報比較依頼が REQUESTED または CLAIMED When abort-rapid-crosscheck を実行して yes と答える Then その依頼は ABORTED になり、worker は比較を開始しない"
          - "Given CLAIMED の速報比較依頼が abort-rapid-crosscheck で ABORTED になった When claim 済みの worker が RUNNING への条件付き UPDATE を行う Then 更新件数は 0 件で、worker は比較を開始せず終了する"
          - "Given 速報比較依頼が SUCCEEDED / FAILED / ABORTED の終端状態 When abort-rapid-crosscheck を実行する Then 状態を変更せずエラー終了する"
          - "Given 確報比較依頼が RUNNING でない When abort-final-crosscheck を実行する Then 状態を変更せずエラー終了する"
        feedback_source:
          feedback_request_id: "20260907_abort_consistency"
          work_unit_ids:
            - "CR-c770d8f0-017#1"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "実行中止"
          - type: "state"
            action: "modify"
            target: "クロスチェック依頼"
          - type: "condition"
            action: "modify"
            target: "依頼中止可否判定"
          - type: "variation"
            action: "modify"
            target: "中止対象種別"
          - type: "information"
            action: "modify"
            target: "中止指示"
          - type: "information"
            action: "modify"
            target: "速報比較依頼"
          - type: "buc"
            action: "modify"
            target: "速報クロスチェック"
      - id: "SPEC-010-03"
        specification: "各中止スクリプトは現在状態を表示後、「対象ジョブのプロセスは強制終了してありますか？ [yes/no]」と対話確認し、yes 以外なら状態を変更せず終了する。スクリプト自身はプロセス・Pod・SSH 接続先の処理を停止しない"
        acceptance_criteria:
          - "Given 中止スクリプトを起動 When 確認に no と答える Then 状態は変更されず終了する"
          - "Given 中止スクリプトを起動 When yes と答える Then スクリプトはプロセスを停止せず、状態だけを ABORTED に更新する"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "中止は停止確認後の状態更新のみ"
          - type: "condition"
            action: "add"
            target: "停止確認応答"

