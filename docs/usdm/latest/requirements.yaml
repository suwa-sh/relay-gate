        acceptance_criteria:
          - "Given 並行稼働run_idが発行される When 速報クロスチェックの各エンティティを参照する Then すべて同一run_idで相関付けられている"
        affected_models:
          - type: "information"
            action: "add"
            target: "速報比較依頼"
          - type: "information"
            action: "add"
            target: "速報比較結果"
      - id: "SPEC-010-02"
        specification: "確報クロスチェックは、final_crosscheck_requestを速報側のrapid_runやrapid_crosscheck_requestとは独立したデータモデルとして保持する"
        acceptance_criteria:
          - "Given 確報比較依頼が作成される When データモデルを確認する Then 速報側のエンティティを参照・再利用していない"
        affected_models:
