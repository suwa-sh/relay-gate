  request_ids: ["CR-c770d8f0-019"]
  work_unit_ids: ["CR-c770d8f0-019#1"]

requirements:
  - id: "REQ-001"
    requirement: "ジョブスケジューラの同一ジョブ定義から、feature flag の設定だけで現行実装(blue)と新実装(green)の並行稼働・単独本番を切り替えられること"
    reason: "実装を段階的に切り替えるため、ジョブスケジューラのジョブ定義を変更せずに blue / green の実行モードを設定で制御し、並行稼働から単独本番へ移行したい"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "facade は feature flag 設定(BLUE_MODE / GREEN_MODE / RAPID_CROSSCHECK_MODE、BLUE_IMPL / GREEN_IMPL、BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER)を読み込み、slot(blue / green)ごとの実行モード(foreground / background / off)を選択する"
        acceptance_criteria:
          - "Given feature flag 設定に BLUE_MODE=foreground, GREEN_MODE=background が定義されている When ジョブスケジューラが facade を起動する Then blue が foreground、green が background として起動される"
          - "Given slot の実行モードが off である When facade を起動する Then その slot の runner は起動されない"
          - "Given 確報クロスチェックの制御設定は feature flag に含まれない When facade を起動する Then facade は確報クロスチェックを起動しない"
          - "Given 元資料の 9 キー(BLUE_MODE / GREEN_MODE / RAPID_CROSSCHECK_MODE / BLUE_IMPL / GREEN_IMPL / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER)で feature flag 設定を書く When 設定を検証する Then 未知キーの警告は出ない"
          - "Given BLUE_IMPL / GREEN_IMPL が設定されている When run を開始する Then execution-spec.json の実装版は BLUE_IMPL / GREEN_IMPL の値を出所とし、ジョブマップに実装版の列を要求しない"
          - "Given RAPID_CROSSCHECK_RUNNER と RAPID_CROSSCHECK_WORKER が設定されている When slot が完了する Then slot runner は RAPID_CROSSCHECK_RUNNER へ完了通知(blue-completed / green-completed)を送り、速報クロスチェック worker の実体は RAPID_CROSSCHECK_WORKER で解決される"
        feedback_source:
          feedback_request_id: "20260905_todo_resolution"
          work_unit_ids:
            - "CR-c770d8f0-001#1"
        affected_models:
          - type: "information"
            action: "add"
            target: "feature flag 設定"
          - type: "variation"
            action: "add"
            target: "slot 実行モード"
          - type: "buc"
            action: "add"
            target: "実装切替ジョブ実行"
          - type: "external_system"
            action: "add"
            target: "ジョブスケジューラ"
          - type: "information"
            action: "modify"
            target: "feature flag 設定"
          - type: "variation"
            action: "modify"
            target: "速報クロスチェックモード"
          - type: "information"
            action: "modify"
            target: "実行設定(execution-spec)"
      - id: "SPEC-001-02"
        specification: "blue と green の両方が foreground になる構成は許可せず、facade は入力検証でエラー終了する"
        acceptance_criteria:
          - "Given BLUE_MODE=foreground かつ GREEN_MODE=foreground When facade を起動する Then どの slot も起動せずエラー終了する"
        affected_models:
          - type: "condition"
            action: "add"
            target: "foreground slot 排他"
          - type: "buc"
            action: "modify"
            target: "実装切替ジョブ実行"
      - id: "SPEC-001-03"
        specification: "運用モード(並行稼働: blue foreground / green background / crosscheck background、新実装の単独本番: blue off / green foreground / crosscheck off、次世代実装との並行稼働: blue background / green foreground / crosscheck background)を feature flag の組み合わせだけで表現でき、ジョブスケジューラへ返す結果は foreground slot の結果となる"
        acceptance_criteria:
          - "Given 並行稼働モードの設定 When ジョブを実行する Then blue の結果がジョブスケジューラへ返る"
          - "Given 新実装の単独本番モードの設定 When ジョブを実行する Then green の結果がジョブスケジューラへ返り、速報クロスチェックは動作しない"
          - "Given ジョブスケジューラのジョブ定義を変更しない When feature flag だけを変更する Then 並行稼働と単独本番を切り替えられる"
        affected_models:
          - type: "variation"
            action: "add"
            target: "運用モード"
          - type: "business_policy"
            action: "add"
            target: "ジョブ定義非変更の原則"
      - id: "SPEC-001-04"
        specification: "blue / green の runner は設定で実体スクリプトを割り当て、実装固有の起動方式・ホスト・OS・プロトコルを slot の runner に閉じ込める。runner を差し替えることで異なる世代の実装を並行稼働できる"
        acceptance_criteria:
          - "Given BLUE_RUNNER / GREEN_RUNNER に実体スクリプトのパスが設定されている When facade が slot を起動する Then facade は実装固有の起動方式を判断せず、設定された runner を起動する"
          - "Given green runner を次世代実装用に差し替える When feature flag と runner 設定だけを変更する Then facade と比較規約を変更せずに並行稼働できる"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "現行実装"
          - type: "external_system"
            action: "add"
            target: "新実装"
          - type: "business_policy"
            action: "add"
            target: "実装固有事項の runner への閉じ込め"

  - id: "REQ-002"
    requirement: "facade は background slot を先に起動してから foreground slot を起動し、foreground の結果だけを待機してジョブスケジューラへ返すこと"
    reason: "foreground が長時間実行中でも background slot を同時に実行させ、並行稼働の実行時間を延ばさないため。またジョブスケジューラとの契約(標準出力・標準エラー・終了コード)を維持するため"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "facade は (1) background の blue・green slot をすべて起動して PID と成果物ディレクトリを確定し、(2) foreground slot を起動し(この時点では待機しない)、(3) すべての slot を起動してから foreground の PID だけを待機する、という順序を固定する"
        acceptance_criteria:
          - "Given BLUE_MODE=foreground, GREEN_MODE=background When facade を起動する Then green が先に background 起動され、その後 blue が起動され、facade は blue の終了のみを待機する"
          - "Given foreground slot が長時間実行中 When 実行状況を確認する Then background slot は foreground と同時に実行されている"
        affected_models:
          - type: "buc"
            action: "modify"
            target: "実装切替ジョブ実行"
          - type: "business_policy"
            action: "add"
            target: "slot 起動順序の固定"
      - id: "SPEC-002-02"
        specification: "facade は foreground slot の Runner Result(stdout.log / stderr.log / exitcode.txt)を、そのまま標準出力・標準エラー・終了コードとしてジョブスケジューラへ中継する"
        acceptance_criteria:
          - "Given foreground slot が終了し 3 ファイルが揃った When facade が応答する Then stdout.log が標準出力、stderr.log が標準エラー、exitcode.txt の値が終了コードとしてジョブスケジューラへ返る"
          - "Given 速報クロスチェックが失敗した When foreground の結果を確認する Then ジョブスケジューラへの応答は変わらない"
          - "Given facade が応答した When ジョブスケジューラ応答の内容を確認する Then 標準出力・標準エラー・終了コードだけで応答時刻を持たず、実行日時の履歴はジョブスケジューラが保持する"
        feedback_source:
          feedback_request_id: "20260905_todo_resolution"
          work_unit_ids:
            - "CR-c770d8f0-007#1"
        affected_models:
          - type: "information"
            action: "add"
            target: "Runner Result"
          - type: "buc"
            action: "modify"
            target: "実装切替ジョブ実行"
          - type: "information"
            action: "modify"
            target: "ジョブスケジューラ応答"
      - id: "SPEC-002-03"
        specification: "ジョブスケジューラは facade に JOB_ID [PARAM...] だけを渡す。facade は比較対象や実装固有の起動方式を判断せず、slot と mode の選択と foreground 結果の応答だけを行う"
        acceptance_criteria:
          - "Given ジョブスケジューラのジョブ定義が facade の呼び出しと JOB_ID・PARAM だけを持つ When ジョブを起動する Then facade は JOB_ID を runner に渡し、runner がジョブマップで実行先を解決する"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "facade の責務限定"

  - id: "REQ-003"
    requirement: "blue / green runner は foreground / background のどちらでも、実装の終了結果を Runner Result Contract(stdout.log / stderr.log / exitcode.txt)として出力すること"
    reason: "ジョブスケジューラへの応答、完了通知、障害調査で同じ 3 ファイルを共通に使用し、実装固有の差異を吸収するため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "runner は <FACADE_RUN_DIR>/<FACADE_RUN_ROLE>/ 配下に started-at.txt、stdout.log、stderr.log、exitcode.txt を出力する。exitcode.txt は数値だけを 1 行で保持し、runner の終了コードは exitcode.txt と一致する。3 ファイルは実行終了後に揃えて公開する"
        acceptance_criteria:
          - "Given slot 実行が終了した When 成果物ディレクトリを確認する Then stdout.log、stderr.log、exitcode.txt が揃って存在し、exitcode.txt は数値 1 行である"
          - "Given runner が終了した When runner の終了コードを確認する Then exitcode.txt の値と一致する"
          - "Given role の起動時 When 成果物ディレクトリを確認する Then started-at.txt に起動時刻が記録されている"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Runner Result"
          - type: "business_policy"
            action: "add"
            target: "Runner Result Contract"
      - id: "SPEC-003-02"
        specification: "起動失敗、ジョブマップ未定義、SSH 失敗などの異常でも、runner は可能な限り 3 ファイルを出力する"
        acceptance_criteria:
          - "Given JOB_ID がジョブマップに未定義 When runner を起動する Then 非 0 の exitcode.txt と原因を含む stderr.log が出力される"
        affected_models:
          - type: "business_policy"
            action: "modify"
            target: "Runner Result Contract"
      - id: "SPEC-003-03"
        specification: "後続処理が書き込み途中のファイルを読まないよう、成果物は一時ファイルへ出力してから確定名へリネームする"
        acceptance_criteria:
          - "Given 成果物の書き込み中 When ハング検知や比較処理が成果物を読む Then 書き込み途中の確定名ファイルは存在しない"
        affected_models:
          - type: "business_policy"
            action: "modify"
            target: "Runner Result Contract"
      - id: "SPEC-003-04"
        specification: "background 実行でも同じ 3 ファイルを残し、ハング検知は started-at.txt、exitcode.txt、hang_detect_limit_minutes を使って background 実行を判定する"
        acceptance_criteria:
          - "Given GREEN_MODE=background When green の実行が終了する Then green/ 配下に 3 ファイルが残る"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Runner Result"

  - id: "REQ-004"
    requirement: "ジョブスケジューラのジョブ定義に実行先(ホスト・実行ユーザー・スクリプトパス)を持たせず、slot runner が実装固有のジョブマップで JOB_ID から実行先を解決し、解決結果を execution-spec.json として保存すること"
    reason: "ジョブスケジューラ側の定義を実装非依存に保ち、実行設定の正本を成果物として残すことでリラン時の再現性を確保するため"
    priority: "must"
    specifications:
      - id: "SPEC-004-01"
        specification: "実装スロットと runner は feature flag が、ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・hang_detect_limit_minutes は該当 slot のジョブマップが、比較対象と対象カタログはクロスチェックのジョブマップが所有する"
        acceptance_criteria:
          - "Given slot のジョブマップに JOB_ID の行がある When runner が JOB_ID を解決する Then ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・hang_detect_limit_minutes が得られる"
        affected_models:
          - type: "information"
            action: "add"
            target: "ジョブマップ"
          - type: "business_policy"
            action: "add"
            target: "ジョブ解決契約"
      - id: "SPEC-004-02"
        specification: "ジョブマップの固定引数の後ろに、ジョブスケジューラから渡された PARAM... を順序を変えずに連結して実装へ渡す。固定引数は JSON 配列として保持し、引数の数と各引数内の空白・カンマを維持する。空の固定引数は [] とする"
        acceptance_criteria:
          - "Given 固定引数 [\"p1\",\"p2 p3\"] と追加引数 a b When 実装へ渡す引数を確認する Then p1, \"p2 p3\", a, b の順で 4 引数として渡される"
        affected_models:
          - type: "business_policy"
            action: "modify"
            target: "ジョブ解決契約"
      - id: "SPEC-004-03"
        specification: "run 開始時に、解決済みのホスト・スクリプト・作業ディレクトリ・固定引数・追加引数・マップ版・実装版・role ごとの hang_detect_limit_minutes を facade/<run_id>/execution-spec.json として一度だけ確定保存する。認証情報そのものは保存せず参照名だけを保存する"
        acceptance_criteria:
          - "Given run を開始した When facade/<run_id>/execution-spec.json を確認する Then 解決済みの実行設定・追加引数・マップ版・実装版・role ごとの hang_detect_limit_minutes が記録され、認証情報の値は含まれない"
          - "Given run 開始後にジョブマップを変更した When 同じ run の execution-spec.json を確認する Then 変更前の内容のまま上書きされていない"
        affected_models:
          - type: "information"
            action: "add"
            target: "実行設定(execution-spec)"
          - type: "business_policy"
            action: "modify"
            target: "ジョブ解決契約"
      - id: "SPEC-004-04"
        specification: "slot ジョブマップ・クロスチェックジョブマップ・対象カタログは CSV ファイル(1 行目ヘッダー、1 行 1 job_id)とする。slot ジョブマップの列は元資料の列名 job_id,host,user,work_dir,script,fixed_params,hang_detect_limit_minutes を用い、host と user はローカル実行の slot では省略できる。fixed_params は JSON 配列文字列を格納する CSV セルで、セルは二重引用符で囲み、セル内の二重引用符は二重化する。認証情報の参照名(credential_ref)とマップ版(map_version)は末尾の任意列として許容し必須にしない。実装版の列は持たず、実装版は feature flag(BLUE_IMPL / GREEN_IMPL)が所有する"
        acceptance_criteria:
          - "Given 元資料どおりの列名(job_id,host,user,work_dir,script,fixed_params,hang_detect_limit_minutes)の CSV ジョブマップ When runner が JOB_ID を解決する Then 列名の読み替えなしに host・user・script・work_dir・fixed_params・hang_detect_limit_minutes が得られる"
          - "Given fixed_params セルに p1 と p2 p3 の 2 要素の JSON 配列を、二重引用符で囲み内部の二重引用符を二重化して書いた When runner が固定引数を解析する Then 空白とカンマを維持した 2 引数として得られる"
          - "Given host と user の列を持たないローカル実行用の slot ジョブマップ When runner が JOB_ID を解決する Then ローカル実行として解決される"
          - "Given credential_ref と map_version の列を持たないジョブマップ When 設定を検証する Then エラーにならず、両列がある場合は末尾の任意列として読み込まれる"
          - "Given クロスチェックジョブマップと対象カタログ When ファイル形式を確認する Then slot ジョブマップと同じ CSV 形式である"
        feedback_source:
          feedback_request_id: "20260905_todo_resolution"
          work_unit_ids:
            - "CR-c770d8f0-002#1"
        affected_models:
          - type: "information"
            action: "modify"
            target: "ジョブマップ"
          - type: "information"
            action: "modify"
            target: "クロスチェックジョブマップ"
          - type: "information"
            action: "modify"
            target: "対象カタログ"
          - type: "condition"
            action: "modify"
            target: "ジョブマップ解決条件"

  - id: "REQ-005"
    requirement: "速報クロスチェックが、ジョブの実行ごとに blue と green の完了結果を非同期に比較し、差分を運用者へ提供すること"
    reason: "並行稼働中に両実装の整合性を早期に確認し、原因調査に使用するため。foreground の応答を遅らせずに比較するため非同期にする"
    priority: "must"
    specifications:
      - id: "SPEC-005-01"
        specification: "blue / green runner は完了時に速報クロスチェック runner(dispatcher)へ系統ごとの公開 function(blue-completed / green-completed)で run_id、job_id、結果(終了コード、成果物ディレクトリまたは artifact_uri)を通知する。runner は相手側の状態や比較依頼を判断しない。自 slot の中止状態(aborted.txt の有無)も判断せず、実装が走り切って exitcode.txt を公開したときは通常どおり完了通知を送る"
        acceptance_criteria:
          - "Given blue が完了した When blue runner が完了通知を送る Then 速報クロスチェック runner に blue-completed(run_id, job_id, result) が届き、rapid_run の blue 側完了結果が登録される"
          - "Given green が未完了 When blue runner が完了通知を送る Then blue runner は green の状態を参照せず終了する"
          - "Given 完了通知の送信が失敗した When slot runner が終了する Then 終了コードは実装スクリプトの exitcode のままで、Runner Result は変更されず、実行ログに警告が残る"
          - "Given 運用者が同一引数で速報クロスチェック runner を再実行して完了通知を再送した When 完了結果を確認する Then 完了結果は一度だけ登録される(冪等・先勝ち)"
          - "Given 完了通知の送信が失敗した When ハング検知が実行される Then 通知失敗は自動検知しない(スコープ外)"
          - "Given abort-blue で中止した後に実装が走り切り exitcode.txt が公開された When blue runner が終了する Then blue runner は中止状態を判断せず通常どおり完了通知(blue-completed)を送る"
        feedback_source:
          feedback_request_id: "20260907_todo_followup"
          work_unit_ids:
            - "CR-c770d8f0-014#1"
        affected_models:
          - type: "buc"
            action: "add"
            target: "速報クロスチェック"
          - type: "information"
            action: "add"
            target: "速報実行(rapid_run)"
          - type: "condition"
            action: "add"
            target: "完了通知失敗の扱い"
          - type: "buc"
            action: "modify"
            target: "速報クロスチェック"
          - type: "condition"
            action: "modify"
            target: "完了通知の系統独立"
      - id: "SPEC-005-02"
        specification: "速報クロスチェック runner は、blue と green の両方が成功したときに限り比較依頼を一意に作成する。blue / green の完了順にかかわらず比較依頼は 1 件だけ作られる。いずれかが失敗した場合は比較依頼を作成せず終了する。並行稼働実行(parallel_run)が ABORTED、または完了通知の対象 slot の slot 実行が ABORTED(成果物ディレクトリに aborted.txt が公開済み)のいずれかに該当する中止済み run では、後から完了通知を受けても速報比較依頼を作成しない。並行稼働実行は foreground slot の結果を中継した時点で COMPLETED になるため、foreground 完了後に background slot を abort-blue / abort-green で中止した run もこの判定で除外する。判定材料は管理 DB の parallel_run.status と slot_executions.status(ファイル正本 aborted.txt のミラー)とする。完了事実(blue_status / green_status と成果物 URI)は記録し、実行ログに警告を残す。この判断は速報クロスチェック runner(dispatcher)が行い、slot runner は行わない。RAPID_CROSSCHECK_MODE=off では完了通知も比較依頼も存在しないため、この規則は速報有効時だけに適用する"
        acceptance_criteria:
          - "Given blue と green が両方成功で完了 When 後に完了した側の通知が届く Then 比較依頼が 1 件だけ作成される"
          - "Given green が先に完了し blue が後に完了 When 両通知が処理される Then 比較依頼は重複せず 1 件である"
          - "Given blue が非 0 で終了 When green が成功で完了する Then 比較依頼は作成されない"
          - "Given 並行稼働実行が ABORTED When 後から完了通知を受ける Then 速報比較依頼は作成されず、完了事実だけが記録される"
          - "Given 並行稼働実行は COMPLETED だが対象 slot の slot 実行が ABORTED When 後から完了通知を受ける Then 速報比較依頼は作成されず、完了事実だけが記録される"
          - "Given foreground の blue が完了して並行稼働実行が COMPLETED になった後に background の green を abort-green で中止した When green の実装が走り切って完了通知を送る Then 速報比較依頼は作成されず、実行ログに警告が残る"
          - "Given 並行稼働実行が ABORTED で片系が成功済み When もう片系の完了通知を受ける Then 両系成功でも速報比較依頼は作成されず、実行ログに警告が残る"
          - "Given 中止した run を background-rerun でリランした When 新しい run の両系が成功する Then 新しい run_id で速報比較依頼が作成される"
          - "Given abort-blue で ABORTED にした slot の実装が走り切って exitcode.txt を公開した When 管理 DB を確認する Then slot_executions.status は ABORTED のままである"
