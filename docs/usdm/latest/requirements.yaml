        acceptance_criteria:
          - "Given background実行を複数回リランする When 最新run_idからparent_run_idを順にたどる Then 元の実行まで追跡できる"
        affected_models:
          - type: "information"
            action: "add"
            target: "execution-spec.json"

  - id: "REQ-011"
    requirement: "速報・確報クロスチェック依頼のライフサイクルを共通の状態遷移で管理し、worker実行結果をジョブスケジューラへ正しく伝播する"
    reason: "worker実行結果を一貫した状態管理のもとで扱い、確報の最終結果をジョブスケジューラへ正確に伝える必要があるため"
    priority: "must"
    specifications:
      - id: "SPEC-011-01"
        specification: "クロスチェック依頼はREQUESTED→CLAIMED→RUNNING→SUCCEEDED/FAILED/ABORTEDの状態遷移を持ち、CLAIMED状態でlease失効かつ未開始の場合はREQUESTEDへ戻る"
        acceptance_criteria:
          - "Given クロスチェック依頼がCLAIMED状態でleaseが失効し未開始である When workerが状態を確認する Then 依頼はREQUESTEDへ戻る"
        affected_models:
          - type: "state"
            action: "add"
            target: "速報比較依頼状態"
          - type: "state"
            action: "add"
            target: "確報比較依頼状態"
      - id: "SPEC-011-02"
        specification: "workerは終了時にexitcodeが0ならSUCCEEDED、非0または実行エラーならFAILEDとして依頼状態を更新する"
        acceptance_criteria:
          - "Given workerが比較を実行して終了する When exitcodeが0である Then 依頼状態はSUCCEEDEDになる"
          - "Given workerが比較を実行して終了する When exitcodeが非0または実行エラーである Then 依頼状態はFAILEDになる"
        affected_models:
          - type: "state"
            action: "add"
            target: "速報比較依頼状態"
          - type: "state"
            action: "add"
            target: "確報比較依頼状態"
      - id: "SPEC-011-03"
        specification: "確報クロスチェックのrunnerは、workerが保存したexitcodeをそのままジョブスケジューラへ中継する。依頼の状態名（SUCCEEDED/FAILED/ABORTED）自体はジョブスケジューラへ返さない"
        acceptance_criteria:
          - "Given 確報比較依頼がSUCCEEDEDまたはFAILEDで完了する When runnerがジョブスケジューラへ応答する Then 返す値はworkerが保存したexitcodeであり、状態名そのものは返さない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "確報応答をstdout/stderr/exitcodeのみに限定するポリシー"

