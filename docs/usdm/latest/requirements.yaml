        specification: "ハング検知スクリプトはジョブスケジューラの定期ジョブ(5 分ごとなど)として起動され、未完了の background role について started-at.txt と execution-spec.json の hang_detect_limit_minutes から経過時間を判定する。exitcode.txt があり終了コード 0 なら対象外、非 0 なら background 実行エラーとして通知、exitcode.txt がなく経過時間が上限以内なら継続監視、上限超過ならハング疑いとして通知する"
