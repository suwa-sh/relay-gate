  - id: "REQ-006"
    requirement: "確報クロスチェックが、ジョブスケジューラの別ジョブ定義から起動され、全テーブル・全ファイルを対象に日次整合性を正式確認し、stdout・stderr・exitcode をジョブスケジューラへ返すこと"
    reason: "日次処理が落ち着いた時点での全量比較をリリース判断の正本とし、その結果をジョブスケジューラの標準的な仕組み(終了コード)で判定・運用するため"
    priority: "must"
    specifications:
      - id: "SPEC-006-01"
        specification: "確報クロスチェック runner はジョブスケジューラから起動され、確報比較依頼(business_date、対象カタログの版)を登録し、対象依頼が終端状態(SUCCEEDED / FAILED / ABORTED)になるまで同期 polling する"
        acceptance_criteria:
          - "Given ジョブスケジューラが確報ジョブを起動 When runner が起動する Then final_crosscheck_request が REQUESTED で登録され、runner は終端状態まで待機する"
        affected_models:
          - type: "buc"
            action: "add"
            target: "確報クロスチェック"
          - type: "information"
            action: "add"
            target: "確報比較依頼"
          - type: "information"
            action: "add"
            target: "対象カタログ"
      - id: "SPEC-006-02"
        specification: "確報クロスチェック worker は DB セグメントで依頼を poll / claim し、比較ツールで全テーブル・全ファイルの比較を起動し、起動した実装の stdout・stderr・exitcode を依頼レコードへ保存する。exitcode が 0 なら SUCCEEDED、非 0 または実行エラーなら FAILED とする"
        acceptance_criteria:
          - "Given REQUESTED の確報比較依頼 When worker が claim して比較を完了する Then 依頼に stdout・stderr・exitcode が保存され、exitcode=0 で SUCCEEDED、非 0 で FAILED になる"
        affected_models:
          - type: "buc"
            action: "modify"
