version: "1.0"
event_id: "20260817_142258_initial_build"
created_at: "2026-08-17T14:22:58"
source: "tmp/RelayGateのしくみ.md"
system_name: "RelayGate"

requirements:
  - id: "REQ-001"
    requirement: "既存実装（blue）と新実装（green）を、ジョブスケジューラの同じジョブ定義から並行稼働・段階的に切り替えられる基盤を提供する"
    reason: "実装を段階的に切り替える際、ジョブスケジューラのジョブ定義を変更せずに安全に新旧実装を並行稼働・切替できるようにするため"
    priority: "must"
    specifications:
      - id: "SPEC-001-01"
        specification: "feature flag付きストラングラーファサード（facade）が、設定に基づきblueとgreenの実装（slot）を選択して起動する"
        acceptance_criteria:
          - "Given feature flag設定（BLUE_MODE/GREEN_MODE）が投入されている When facadeがJOB_IDを受け取る Then 設定に従いblue・greenの各slotが起動される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "並行稼働実行"
          - type: "condition"
            action: "add"
            target: "feature flag設定（BLUE_MODE/GREEN_MODE/RAPID_CROSSCHECK_MODE）"
          - type: "external_system"
            action: "add"
            target: "blue実装"
          - type: "external_system"
            action: "add"
            target: "green実装"
      - id: "SPEC-001-02"
        specification: "運用モード（並行稼働／新実装単独本番／次世代実装との並行稼働）を、ジョブ定義を変更せず設定だけで切り替えられる"
        acceptance_criteria:
          - "Given BLUE_MODE/GREEN_MODE/RAPID_CROSSCHECK_MODEの組み合わせを変更する When 同じジョブ定義でジョブを起動する Then ジョブ定義を変更せず運用モードが切り替わる"
        affected_models:
          - type: "variation"
            action: "add"
            target: "運用モード（並行稼働／新実装単独本番／次世代実装との並行稼働）"
      - id: "SPEC-001-03"
        specification: "blueとgreenの両方がforegroundになる構成は許可しない"
        acceptance_criteria:
          - "Given BLUE_MODEとGREEN_MODEの両方にforegroundを設定しようとする When facadeが設定を検証する Then 起動を許可しない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "blue/green同時foreground禁止ポリシー"
      - id: "SPEC-001-04"
        specification: "実装固有の起動方式・接続先ホスト・OS・プロトコルは、facade本体ではなくslotのrunnerに閉じ込める"
        acceptance_criteria:
          - "Given 新しい実装世代のrunnerを追加する When facade本体を変更せずrunnerだけを差し替える Then 実装固有の起動方式の差異がfacadeに影響しない"
        affected_models:
          - type: "buc"
            action: "add"
            target: "並行稼働実行"

  - id: "REQ-002"
    requirement: "foreground実行結果だけをジョブスケジューラへ応答する"
    reason: "ジョブスケジューラは標準出力・標準エラー・終了コードの受け取りだけを契約とするため、その契約を維持する必要がある"
    priority: "must"
    specifications:
      - id: "SPEC-002-01"
        specification: "facadeはforeground roleの標準出力・標準エラーをそのままジョブスケジューラへ中継し、プロセス終了コードとしてforegroundのexitcode.txtの値を0を含む全値そのまま透過する"
        acceptance_criteria:
          - "Given foreground roleの実行が完了する When facadeが応答を返す Then stdout.log/stderr.logの内容がそのままジョブスケジューラへ中継される"
          - "Given foreground roleのexitcode.txtが非0の値（例: 3）である When facadeがプロセスを終了する Then 同じ値がプロセス終了コードとしてジョブスケジューラへ透過され、一律の値へ丸められない"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-010#1"
        affected_models:
          - type: "external_system"
            action: "add"
            target: "ジョブスケジューラ"
          - type: "buc"
            action: "add"
            target: "並行稼働実行"
      - id: "SPEC-002-02"
        specification: "実行順序は、background roleを先にすべて起動してPIDと成果物ディレクトリを確定した後、foreground roleを起動し、最後にforegroundのPIDだけを待機する固定順序とする"
        acceptance_criteria:
          - "Given background roleとforeground roleが両方設定されている When facadeがジョブを起動する Then background roleが先に起動し、foreground待機中もbackground roleは並走して実行される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "並行稼働実行"
      - id: "SPEC-002-03"
        specification: "relay-gate自身のエラーは、業務ジョブが通常使用しない専用の退避終了コードへ分離する。実行結果未確定・取得不能・中止済み（UNKNOWN/ABORTEDを含む）は125、relay-gateのバリデーションエラーは124とする。UNKNOWNを推測でFAILED相当の終了コードへ変換しない"
        acceptance_criteria:
          - "Given foregroundの実行結果が未確定または取得不能である When facadeが応答を返す Then 終了コードは125であり、業務ジョブの終了コードとして解釈されない"
          - "Given run_id未指定などrelay-gateのバリデーションエラーが発生する When facadeが応答を返す Then 終了コードは124である"
          - "Given foregroundの実行状態がUNKNOWNである When facadeが終了コードを決定する Then FAILED相当の業務終了コードへ推測で変換されず退避コード125が使われる"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-010#1"
        affected_models:
          - type: "condition"
            action: "add"
            target: "relay-gateエラーの退避終了コード"
          - type: "business_policy"
            action: "add"
            target: "relay-gateエラーの退避終了コード分離ポリシー"
      - id: "SPEC-002-04"
        specification: "relay-gateエラーで応答する場合の標準エラーは、foregroundのstderr.logの内容（取得可能な場合）とrelay-gate自身のエラー内容（原因と次アクション）を併記してジョブスケジューラへ返す"
        acceptance_criteria:
          - "Given relay-gateエラーが発生しforegroundのstderr.logを取得できる When facadeが応答を返す Then 標準エラーにstderr.logの内容とrelay-gateのエラー内容（原因と次アクション）の両方が含まれる"
          - "Given relay-gateエラーが発生しforegroundのstderr.logを取得できない When facadeが応答を返す Then 標準エラーにrelay-gateのエラー内容（原因と次アクション）が出力される"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-010#1"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
          - type: "buc"
            action: "add"
            target: "並行稼働実行"

  - id: "REQ-003"
    requirement: "blue/green runnerの実行結果を、共通形式の成果物（Runner Result Contract）として標準化する"
    reason: "ジョブスケジューラへの応答、完了通知、障害調査の3用途で共通の成果物形式を使い、実装ごとの差異を吸収するため"
    priority: "must"
    specifications:
      - id: "SPEC-003-01"
        specification: "blue runnerとgreen runnerは、foreground・backgroundのいずれでも、started-at.txt・stdout.log・stderr.log・exitcode.txtと、run単位のexecution-spec.jsonを出力する"
        acceptance_criteria:
          - "Given blue runnerまたはgreen runnerの実行が終了する When 成果物を確認する Then execution-spec.json、started-at.txt、stdout.log、stderr.log、exitcode.txtが揃っている"
        affected_models:
          - type: "information"
            action: "add"
            target: "execution-spec.json"
          - type: "information"
            action: "add"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
      - id: "SPEC-003-02"
        specification: "起動失敗・ジョブマップ未定義・SSH失敗が発生した場合でも、可能な限り3ファイル（stdout.log/stderr.log/exitcode.txt）を出力する"
        acceptance_criteria:
          - "Given 起動先ホストへのSSH接続が失敗する When runnerが異常終了する Then 可能な範囲でstdout.log/stderr.log/exitcode.txtが出力される"
        affected_models:
          - type: "information"
            action: "add"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
      - id: "SPEC-003-03"
        specification: "成果物は実行終了後に一時ファイルへ出力してから確定名へリネームし、揃った状態で公開する。後続処理は書き込み途中のファイルを読まない"
        acceptance_criteria:
          - "Given runnerが成果物を出力中である When 後続処理（hang-detectorや速報クロスチェック）が成果物を参照する Then 書き込み途中の不完全なファイルを読まない"
        affected_models:
          - type: "information"
            action: "add"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
      - id: "SPEC-003-04"
        specification: "Runner実行結果は起動試行（attempt）単位で識別し、attempt_id・attempt_no・accepted_atを保持する。実行状態はSTARTING/RUNNING/SUCCEEDED/FAILED/UNKNOWN/ABORTEDの6値とし、起動受付時点はSTARTING、timeoutや結果取得不能の場合はUNKNOWNとして推測でFAILEDを確定しない。UNKNOWNからの確定は実結果の回収または対話確認による回復でのみ行う"
        acceptance_criteria:
          - "Given 同一run_id・slot種別・role区分で複数回起動する When Runner実行結果を参照する Then attempt_idにより起動試行が一意に識別され、attempt_noが同一組内の連番になっている"
          - "Given 起動を受け付ける When Runner実行結果を参照する Then accepted_atが記録され実行状態がSTARTINGである"
          - "Given timeoutにより実行結果を取得できない When 実行状態を確定する Then 実行状態はUNKNOWNとなりFAILEDへ推測で確定されない"
          - "Given 実行状態がUNKNOWNである When 実結果を回収するまたは対話確認による回復を行う Then SUCCEEDED・FAILED・ABORTEDのいずれかへ確定する"
        feedback_source:
          feedback_request_id: "20260818_164000_rdra_followup_6078c4ed"
          work_unit_ids:
            - "CR-6078c4ed-008#1"
        affected_models:
          - type: "information"
            action: "modify"
            target: "Runner実行結果（started-at.txt/stdout.log/stderr.log/exitcode.txt）"
          - type: "state"
            action: "modify"
            target: "background slot実行状態"

  - id: "REQ-004"
    requirement: "blueとgreenの実行結果を、ジョブ単位で非同期に比較する速報クロスチェックを提供する"
    reason: "日次の全量比較を待たずに、ジョブ実行ごとの差分を原因調査のために速やかに把握する必要があるため"
    priority: "must"
    specifications:
      - id: "SPEC-004-01"
        specification: "blue runnerとgreen runnerからの完了通知（blue-completed/green-completed）を受けて、両系が成功した場合にだけ比較依頼を一意に作成する。作成順序はblue/greenの完了順に依存しない"
        acceptance_criteria:
          - "Given blueとgreenがどちらの順序で完了しても When 両系の完了結果が登録される Then 比較依頼は重複なく1件だけ作成される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "速報クロスチェック"
          - type: "information"
            action: "add"
            target: "速報比較依頼"
      - id: "SPEC-004-02"
        specification: "RAPID_CROSSCHECK_MODE=offの場合、blue/green runnerは完了通知を送信せず、速報管理DBへの接続・書込みを行わない"
        acceptance_criteria:
          - "Given RAPID_CROSSCHECK_MODE=offが設定されている When blue/greenが完了する Then 速報管理DBへの接続や書込みが発生しない"
        affected_models:
          - type: "condition"
            action: "add"
            target: "feature flag設定（BLUE_MODE/GREEN_MODE/RAPID_CROSSCHECK_MODE）"
      - id: "SPEC-004-03"
        specification: "速報クロスチェックの失敗は、foreground結果としてジョブスケジューラへ返す応答を変更しない"
        acceptance_criteria:
          - "Given 速報クロスチェックの比較がFAILEDになる When foreground結果がジョブスケジューラへ返される Then foreground応答の内容は速報クロスチェックの失敗の影響を受けない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "速報クロスチェック失敗の非伝播ポリシー"

  - id: "REQ-005"
    requirement: "全テーブル・全ファイルを対象に日次で整合性を正式確認する確報クロスチェックを提供する"
    reason: "日次の全量比較をリリース判断の正本とするため、速報より広い範囲で正式な確認結果を確定させる必要があるため"
    priority: "must"
    specifications:
      - id: "SPEC-005-01"
        specification: "確報クロスチェックはジョブスケジューラの別ジョブ定義から起動し、全テーブルと全ファイルを比較対象とする"
        acceptance_criteria:
          - "Given ジョブスケジューラが確報クロスチェック専用ジョブ定義を起動する When 確報クロスチェックが実行される Then 全テーブル・全ファイルが比較対象になる"
        affected_models:
          - type: "buc"
            action: "add"
            target: "確報クロスチェック"
          - type: "information"
            action: "add"
            target: "確報比較依頼"
      - id: "SPEC-005-02"
        specification: "確報クロスチェックのrunnerは比較依頼の完了を同期pollingし、依頼に保存されたstdout・stderr・exitcodeだけをジョブスケジューラへ返す。比較結果・差分件数・レポートURIなどは連携データとして追加しない"
        acceptance_criteria:
          - "Given 確報比較依頼がSUCCEEDEDまたはFAILEDで完了する When runnerがジョブスケジューラへ応答する Then 応答内容はstdout・stderr・exitcodeだけである"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "確報応答をstdout/stderr/exitcodeのみに限定するポリシー"

  - id: "REQ-006"
    requirement: "background実行の異常（未完了・非0終了・速報比較異常）を定期的に検知し運用者へ通知する"
    reason: "background実行はジョブスケジューラの実行結果に現れないため、専用の監視がなければ異常やハングに気づけないため"
    priority: "must"
    specifications:
      - id: "SPEC-006-01"
        specification: "定期起動のhang-detectorが、未完了background roleの成果物についてstarted-at.txtとexecution-spec.jsonのhang_detect_limit_minutesから経過時間を判定し、超過をハング疑いとして記録・通知する"
        acceptance_criteria:
          - "Given background roleがexitcode.txtを出力していない When 経過時間がhang_detect_limit_minutesを超過する Then ハング疑いとして運用者へ通知される"
        affected_models:
          - type: "buc"
            action: "add"
            target: "ハング監視"
          - type: "condition"
            action: "add"
            target: "hang_detect_limit_minutes"
          - type: "information"
            action: "add"
            target: "ハング検知記録"
      - id: "SPEC-006-02"
        specification: "終了済みのbackground roleはexitcode.txtを確認し、非0終了をエラーとして通知する"
        acceptance_criteria:
          - "Given background roleのexitcode.txtが非0である When hang-detectorが走査する Then background実行エラーとして通知される"
        affected_models:
          - type: "information"
            action: "add"
            target: "ハング検知記録"
      - id: "SPEC-006-03"
        specification: "速報クロスチェックの依頼状態と終了コードを確認し、FAILEDまたは比較NGを異常として通知する"
        acceptance_criteria:
          - "Given 速報比較依頼がFAILEDまたは比較NGである When hang-detectorが走査する Then 速報クロスチェック異常として通知される"
        affected_models:
          - type: "information"
            action: "add"
            target: "速報比較結果"
      - id: "SPEC-006-04"
        specification: "hang-detectorは実行状態をRUNNINGのまま保持し、自動でABORTEDへ変更しない。新しい実行依頼も作成せず、プロセスも停止しない"
        acceptance_criteria:
          - "Given ハング疑いを通知する When hang-detectorの処理が完了する Then 対象の実行状態はRUNNINGのまま変更されず、新しい実行依頼も作成されない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "RUNNING中の実行はリラン禁止ポリシー"

  - id: "REQ-007"
    requirement: "停止確認済みのbackground実行・比較依頼を、対話確認のうえで明示的に中止状態へ遷移できる"
    reason: "実プロセスの停止操作と管理状態の遷移操作を分離し、プロセスが実際に止まっていない状態での誤った再実行を防ぐ必要があるため"
    priority: "must"
    specifications:
      - id: "SPEC-007-01"
        specification: "abort-blue.sh/abort-green.shは、対象slotがbackgroundかつRUNNINGの場合だけ、対話確認（「対象ジョブのプロセスは強制終了してありますか？」）を経てABORTEDへ遷移させる。foregroundまたはoffの場合は状態を変更せずエラー終了する"
        acceptance_criteria:
          - "Given 対象slotがbackgroundかつRUNNINGである When 対話確認でyesと回答する Then 対象slotがABORTEDへ遷移する"
          - "Given 対象slotがforegroundまたはoffである When abort-blue.shまたはabort-green.shを実行する Then 状態を変更せずエラー終了する"
        affected_models:
          - type: "buc"
            action: "add"
            target: "blue中止"
          - type: "buc"
            action: "add"
            target: "green中止"
          - type: "state"
            action: "add"
            target: "background slot実行状態"
          - type: "actor"
            action: "add"
            target: "運用者"
      - id: "SPEC-007-02"
        specification: "abort-rapid-crosscheck.sh/abort-final-crosscheck.shは、対象比較依頼がRUNNINGの場合だけ、対話確認を経てABORTEDへ遷移させる。RUNNINGでない場合は状態を変更せずエラー終了する"
        acceptance_criteria:
          - "Given 速報または確報比較依頼がRUNNINGである When 対話確認でyesと回答する Then 対象比較依頼がABORTEDへ遷移する"
        affected_models:
          - type: "buc"
            action: "add"
            target: "速報比較中止"
          - type: "buc"
            action: "add"
            target: "確報比較中止"
          - type: "state"
            action: "add"
            target: "速報比較依頼状態"
          - type: "state"
            action: "add"
            target: "確報比較依頼状態"
      - id: "SPEC-007-03"
        specification: "中止対話確認はyes以外の回答では状態を変更しない。いずれの中止スクリプトも実行プロセス・Pod・SSH接続先そのものは停止しない"
        acceptance_criteria:
          - "Given 対話確認でyes以外を回答する When 中止スクリプトが終了する Then 状態は変更されない"
        affected_models:
          - type: "business_policy"
            action: "add"
            target: "中止前の対話確認必須ポリシー"

  - id: "REQ-008"
    requirement: "中止済み・完了済みのbackground実行や速報比較依頼を、元の実行設定を保ったまま選択的に再実行できる"
    reason: "background実行はジョブスケジューラの通常リランの対象外であり、元の実行設定（ホスト・スクリプト・引数）を保った再実行手段が必要なため"
    priority: "must"
    specifications:
      - id: "SPEC-008-01"
        specification: "background-rerun.shは、元のexecution-spec.jsonからホスト・実行ユーザー・スクリプト・作業ディレクトリ・実行パラメータを復元し、新しいrun_idを発行して再実行する。新しい実行のparent_run_idには直前のリラン元run_idを設定する。元の実行のレコードと履歴は上書きしない"
        acceptance_criteria:
          - "Given 元のbackground slot実行が完了済みまたは中止済みである When background-rerun.shを実行する Then 元のexecution-spec.jsonの設定で新しいrun_idの実行が開始され、parent_run_idが元のrun_idに設定される"
          - "Given background-rerun.shによる再実行が開始される When 元のbackground slot実行のレコードを参照する Then 元の実行の状態・履歴は変更されていない"
        feedback_source:
          feedback_request_id: "20260818_113601_impl_feedback_6078c4ed"
          work_unit_ids:
