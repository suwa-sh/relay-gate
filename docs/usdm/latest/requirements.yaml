  - id: "REQ-010"
    requirement: "速報クロスチェックと確報クロスチェックそれぞれについて、run_idで相関付けたデータモデルを独立して保持する"
    reason: "速報と確報は異なるライフサイクル・比較粒度を持つため、互いのデータモデルを再利用せず、それぞれの実行状態と結果を正確に追跡できるようにする必要があるため"
