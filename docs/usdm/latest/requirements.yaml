          - "Given 設定所有区分 When 速報クロスチェック設定の所有者を確認する Then 基盤適用設計者である"
          - "Given 速報クロスチェック設定 When 内容を確認する Then 認証情報の値は含まれず管理 DB 接続の参照名だけがある"
          - "Given RAPID_CROSSCHECK_MODE=off When 速報クロスチェック設定が存在しない Then slot 実行は設定なしで実行できる"
