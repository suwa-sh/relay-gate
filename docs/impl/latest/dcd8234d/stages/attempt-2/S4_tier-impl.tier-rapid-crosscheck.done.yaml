findings_fixes:
  - id: F-001
    summary: "ヘッダーはセルの再結合文字列ではなく、列の個数と各位置の列名で判定する(CROSSCHECK_JOB_MAP_EXPECTED_COLUMNS)。actual= はカンマ・二重引用符を含む列名を CSV の囲みで出し、1 セルに全列名が入った入力を expected= と区別できるようにした(A-021)"
    regression_tests:
      - "test/domain/comparison_definition_rules.bats: validate_crosscheck_job_map_header_全列名が1セルに入っている場合 / 列名の順序が異なる場合"
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: ヘッダー全体が1つの引用セルの場合"
  - id: F-002
    summary: "job_id 重複検査が出した error 行の件数(重複した job_id ごとに 1 行)を violations=N に加える(validate_crosscheck_job_map_count_errors_since)"
    regression_tests:
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 2つのjob_idがそれぞれ重複する場合_error2行とviolations=2"
  - id: F-004
    summary: "宣言はヘッダー行より前のコメント行だけから読む(crosscheck_job_map_repo_read_declarations はヘッダー行で読み終える)。末尾に置いた宣言は declaration not found になる。ヘッダー行以降の宣言形式のコメントは自由なコメント(A-002)"
    regression_tests:
      - "test/repository/crosscheck_job_map_repo.bats: ヘッダー行より後に宣言形式のコメントがある場合"
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 宣言がヘッダー行より後にある場合 / ヘッダー行より後に宣言形式のコメントがある場合"
  - id: F-010
    summary: "compare_command は `/` で始まる絶対パスだけを受理し、相対パスは `error: compare_command is not absolute line=N job_id=... value=...`(契約の行の値不正の共通形式)で違反にする(A-008)"
    regression_tests:
      - "test/domain/comparison_definition_rules.bats: compare_commandが相対パスの場合"
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: compare_commandが相対パスの場合(cwd に実行可能な ./compare.sh を置く)"
  - id: F-013
    summary: "対象カタログの読み込みを crosscheck_target_catalog_repo_load(形式違反を FORMAT_INVALID で返す)と crosscheck_target_catalog_repo_has_version に分け、カタログの NUL / UTF-8 / BOM / CR / ヘッダーのクォート不正を config_input_rules の共通文言(path はカタログのパス)で報告してから参照未解決を出す(A-011)"
    regression_tests:
      - "test/repository/crosscheck_job_map_repo.bats: crosscheck_target_catalog_repo_load_カタログにCRがある場合 / ヘッダーがクォート不正の場合"
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 参照カタログのコメント行にNULがある場合 / CRLF改行の場合 / ヘッダーがクォート不正の場合"
  - id: F-018
    summary: "comparison_type=full の行は compare_targets が `catalog` 固定であることを検証し、違反は `error: compare_targets is not catalog line=N job_id=... value=...`(A-016)"
    regression_tests:
      - "test/domain/comparison_definition_rules.bats: full行のcompare_targetsがcatalogでない場合 / job行のcompare_targetsがcatalog以外の場合"
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: full行のcompare_targetsがcatalogでない場合"
  - id: F-021
    summary: "ヘッダーの列名の重複は report_duplicate_columns で `error: duplicate column column=<name> path: ...` を重複名ごとに出し、その後に header mismatch を出す(A-019)"
    regression_tests:
      - "test/domain/comparison_definition_rules.bats: 列名が重複する場合_duplicate columnをheader mismatchより先に出す / report_duplicate_columns 2 件"
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: ヘッダーにjob_idが2回ある場合"
  - id: F-022
    summary: "参照カタログのヘッダーも同じ report_duplicate_columns で検査し、重複があれば duplicate column(path はカタログ)を出して参照未解決にする。初出の列では解決しない(A-020)"
    regression_tests:
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 参照カタログのヘッダーにcatalog_versionが2回ある場合"
minor_findings_handling: "category_mismatch(F-023〜F-027)は Verifier の verified_category を採用した。restatement(F-008 / F-009 / F-011 / F-012)の前提 A-006 / A-007 / A-009 / A-010 は記録から除外した。spec_absent の前提は維持(文言・対象行を更新)。tier BDD の Given / Then 不整合(issues/20261010_093000)は依頼どおり変更していない"
