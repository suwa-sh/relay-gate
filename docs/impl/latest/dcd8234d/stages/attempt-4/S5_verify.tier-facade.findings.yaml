assumption_verdicts:
  - id: "A-001"
    assumption: "RAPID_COMPARE_COMMAND が無い・空(検証ルール 1 の違反)のとき、stdout は command_path: - と has_job_id_placeholder=false を出す"
    target: "facade/src/usecase/validate_rapid_crosscheck.sh:131"
    category: "data_format"
    tier: "tier-facade"
    verified_category: "data_format"
    verdict: "consistent"
    finding_id: "F-001"
    evidence: "契約conventions.output_format.stdoutの空値は -、spec.md計算ルールのcommand_pathは先頭引数、has_job_id_placeholderは文字列に{job_id}が含まれるか。空・欠落時は先頭引数なし、含有なしなので - / falseとなる既存規則の組合せ。tier-facade.mdのenv構造違反による - / - とは区別する。既存missing-key/emptyテストとLaunchCommandRulesを確認。S4固定指示は明示事項の復唱を前提から除く。"
  - id: "A-002"
    assumption: "コマンド部分の「存在し実行可能」は、通常ファイルであり実行権限があることと判定する(ディレクトリは実行権限があっても file not executable とする)"
    target: "facade/src/domain/launch_command.sh:87"
    category: "input_validation"
    tier: "tier-facade"
    verified_category: "input_validation"
    verdict: "spec_absent"
    finding_id: "F-002"
    evidence: "ルール3とCLI契約は存在・実行可能を要求するが、通常ファイルに限定する-f判定や特殊ファイルの扱いを明記しない。launch_command.shの-f && -x、およびdomainテストのディレクトリ拒否をmacOS/Linuxで確認。矛盾を立証できず入力境界の補完判断。"
  - id: "A-003"
    assumption: "バイト点検が数えた行数と行の読み取りで読んだ行数が合わないときは、補助コマンドの想定外の出力として error: internal command failed commands=tr,sed を出し終了コード 6 で終える"
    target: "facade/src/repository/rapid_crosscheck_env.sh:130"
    category: "error_handling"
    tier: "tier-facade"
    verified_category: "error_handling"
    verdict: "spec_absent"
    finding_id: "F-003"
    evidence: "config_input_rules.internal_failureは想定外出力を終了6としcommands=は実際に失敗した名前だけとするが、終了状態成功で走査行数と読取行数だけが異なり原因コマンドを特定できない場合の診断は定めない。rapid_crosscheck_env.sh:130付近はtr,sed両方を表示。snapshot.out_of_scopeは意図的コマンド差替え後の結果の正しさを保証せず、検知して6とする義務は残る。通常のtr/sedの非0障害は独立実走で失敗した単独名のみを表示。原因未特定時の表示方針として確認対象とし、保証範囲内の仕様違反は立証していない。"
  - id: "A-004"
    assumption: "読み込みが成功したあと入力の複製の削除に失敗したときは、読み込み結果を使わず error: internal command failed commands=rm を出し終了コード 6 で終える(複製の工程自体が失敗していたときは config snapshot failed を優先する)"
    target: "facade/src/repository/rapid_crosscheck_env.sh:67"
    category: "error_handling"
    tier: "tier-facade"
    verified_category: "error_handling"
    verdict: "spec_absent"
    finding_id: "F-004"
    evidence: "config_input_rules.internal_failure.handlingの工程区分から複製完了後のrm失敗を終了6/commands=rmとする部分は既存規則に沿う。一方、複製工程と削除が両方失敗した場合にsnapshot failedを優先する規則は明記されないため、前提全体はspec_absent。rm単独失敗の独立実走でstdout/info/warnなし、終了6とrm名を確認。S4固定指示にも同時失敗時の優先規則なし。"
