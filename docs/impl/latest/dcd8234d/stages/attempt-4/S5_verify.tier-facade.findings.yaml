viewpoints_checked:
  spec_conformance:
    status: "done"
    note: "spec.md、tier-facade.md、CLI 契約 env_files・byte_checks・compare_command_argv と presentation/repository/domain/usecase を照合。検証ルール5項、固定順stdout、info全件→warn全件→error、早期停止時info抑止に反証なし。対象featureは仕様gherkinと完全一致。追加BDD4場面はstderr行配列をdeepEqual、追加bats5件は行数と各行の文言・位置をassertしており、空振り・skipなし。API summaryはlegacy CLI索引でv2ではなくslice要件非該当。tables=[]でDBアクセスなし。management-db生成物の6テーブルはscope内sourceと一致。CLIのためUI非該当。"
  readability_maintainability:
    status: "done"
    note: "日本語コメント、仕様用語、層分離、dev-rulesを確認。S4のfacade差分はコメントのみ。S2はfeature/step/batsのみ。実動作を変えないという主張は差分と再実行に整合。"
  security:
    status: "done"
    note: "envをsourceせず、値を起動しない。キーと値にコマンド置換を含む独立入力で副作用ファイルが作られないことを確認。制御文字の可視化、infoに値を出さないこと、0600のsnapshot作成を照合。認証・DB接続は本UC非該当。"
  performance:
    status: "done"
    note: "利用者指定の5000行・10秒を独立計測。verbose有効で一意未知キー0.525秒、全行重複0.472秒、全行NUL/UTF-8/CR違反0.815秒、制御文字付き未知キー1.186秒。全ケース10秒以内。DB/N+1/索引はtables=[]のため非該当。"
  operability:
    status: "done"
    note: "独立14入力×C/en_US.UTF-8×verbose有無の56実行でstdoutと終了コード不変、stderrはinfo追加のみ、ロケール間出力一致。絶対/相対パス、必須キー、未知キー、段別診断を照合。Linux bash5.2/GNU sed4.9/coreutils9.4でも対象42テスト成功。"
  fault_tolerance:
    status: "done"
    note: "tr/sed/cat/mv/mktemp/rmを一時的な子bash関数で失敗させ6種類を独立実走。すべて終了6、stdout空、info/warnなし。複製工程失敗はsnapshot failed+hint、複製後は実際の失敗コマンド名。単一snapshot・シグナルtrap・削除・失敗時の値不使用をコードと既存共有テストで照合。"
  refactoring:
    status: "done"
    note: "LaunchCommandRulesとenv読み取り、表示の責務は分離。既存byte scanner/reportを共有し、変更による重複ロジック増加なし。比較用の複数Actはverbose不変性の対照実験として妥当。全facadeテストで他UC回帰なし。"
  assumption_conformance:
    status: "done"
    note: "1〜7を完走した後でid/assumption/targetのみを開き、S4固定指示と仕様でverdict/verified_categoryを独立判定。その後reason/confidence/spec_refsを参照。A-001〜004にexactly-one、consistent=1、spec_absent=3、contradicts/unlisted=0。独立候補に未記録の追加判断なし。"
