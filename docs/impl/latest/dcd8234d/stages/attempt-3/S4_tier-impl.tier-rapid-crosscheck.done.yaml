  - path: rapid-crosscheck/test/repository/crosscheck_job_map_repo.bats
    summary: "複製経由の読み込み / データ行のクォート不正の読み込み結果 / 列数不一致の行を版の照合に使わない の 3 件を追加。計 18 件"
