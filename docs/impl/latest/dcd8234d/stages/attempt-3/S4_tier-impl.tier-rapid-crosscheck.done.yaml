findings_fixes:
  - id: F-007
    summary: "参照カタログのデータ行のクォート不正を、ジョブマップ本体と同じ共通文言 `error: csv quote is invalid line=N path: <カタログ>` で全件(物理行順)報告し、形式違反のあるカタログでは版を照合せず参照未解決にする(該当版の妥当な行が別にあっても status=valid にしない)。ヘッダー行がクォート不正のときもデータ行のクォート不正を続けて報告する(A-011 / A-023)"
    regression_tests:
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 参照カタログのデータ行がクォート不正の場合(Verifier の再現手順と同じ入力) / クォート不正と列数不一致が混在する場合 / ヘッダーがクォート不正でデータ行もクォート不正の場合"
      - "test/repository/crosscheck_job_map_repo.bats: カタログのデータ行がクォート不正の場合_戻り値LOADEDで行の解析結果にquote_invalidが載ること"
      - "test/usecase/validate_crosscheck_job_map.bats: crosscheck_target_catalog_report_row_errors 2 件"
  - id: F-018
    summary: "参照カタログの空白だけの行(半角空白・タブ)を 1 セルのデータ行として `error: column count mismatch line=N expected=<ヘッダーの列数> actual=1` で拒否し、列数が合わない行も同じ文言で全件報告してから参照未解決にする。版の照合に使う行はクォート解析でき列数がヘッダーと一致する行だけ(A-011 / A-022)"
    regression_tests:
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 参照カタログに空白だけの行がある場合(半角空白 1 文字とタブ 1 文字の 2 行) / 列数が不足する行がある場合"
      - "test/repository/crosscheck_job_map_repo.bats: crosscheck_target_catalog_repo_has_version_該当版の行の列数がヘッダーと異なる場合_戻り値1であること"
catalog_input_rules_coverage:
  note: "参照カタログの読み込み経路に対する config_input_rules の全規則の回帰テスト(path= はカタログ、line= はカタログの物理行。実プロセス validate-config.sh 経由)"
  rules:
    - rule: "NUL バイト"
      test: "参照カタログのコメント行にNULがある場合(attempt 2 既存)"
    - rule: "UTF-8 として不正なバイト列"
      test: "参照カタログにUTF-8として不正なバイト列がある場合(追加)"
    - rule: "BOM"
      test: "参照カタログの先頭にBOMがある場合(追加)"
    - rule: "CR"
      test: "参照カタログがCRLF改行の場合(attempt 2 既存。hint を含む)"
    - rule: "ヘッダー列名の重複"
      test: "参照カタログのヘッダーにcatalog_versionが2回ある場合(attempt 2 既存)"
    - rule: "クォート不正(ヘッダー行)"
      test: "参照カタログのヘッダーがクォート不正の場合(attempt 2 既存)/ ヘッダーとデータ行の両方(追加)"
    - rule: "クォート不正(データ行)"
      test: "参照カタログのデータ行がクォート不正の場合(追加。F-007)"
    - rule: "列数不一致"
      test: "参照カタログの列数が不足する行がある場合 / クォート不正と列数不一致が混在する場合(追加)"
    - rule: "空白だけの行"
      test: "参照カタログに空白だけの行がある場合(追加。F-018)"
    - rule: "最終行の改行なし(受理の例外)"
      test: "参照カタログの最終行に改行が無い場合_受理して終了コード0(追加)"
    - rule: "1 時点スナップショット"
      test: "repository: crosscheck_target_catalog_repo_load_カタログを読む場合_TMPDIRのrelay-gate-で始まる複製だけを読み終えたら削除すること(追加。複製を読む関数を差し替えて複製のパスと内容を記録)"
reuse_check: "final-crosscheck/src/repository/target_catalog_repo.sh(読むだけ)は job_map_repo_load の結果を TARGET_CATALOG_* に写すだけで、行単位の診断は final-crosscheck の usecase が持つ(本 tier から呼ぶと final-crosscheck の usecase 依存になる)。facade の job_map_repo_load はバイト点検とクォート解析までで列数は判定しない。よって本 tier は同じ読み込み経路(job_map_repo_load。単一スナップショット・バイト点検・クォート解析)を再利用し、行単位の診断(クォート不正・列数不一致)だけを自 tier の usecase(crosscheck_target_catalog_report_row_errors)で行った"
minor_findings_handling: "restatement(F-013 / F-016)の前提 A-017 / A-020 は記録から除外した(excluded_as_explicit に含める)。spec_absent の minor(F-001〜F-006 / F-008〜F-012 / F-014 / F-015 / F-017)は真の前提として維持し、対象行を更新した。A-015(順序)は参照カタログの行単位の診断を含む形に更新した"
