    root_cause: "crosscheck_target_catalog_report_row_errors が列数不一致の条件 `actual -ne expected` だけで空白行を検出していた(config_input_rules の「空白だけの行は 1 セル」の説明を列数の比較に置き換えていた)"
    change: "rapid-crosscheck/src/usecase/validate_crosscheck_job_map.sh に crosscheck_csv_row_is_blank(1 セル・非空・半角空白とタブのみ)を追加し、列数不一致の条件に OR で加えた(13 行追加 / 2 行変更。他の分岐・文言・順序は変更なし)"
    regression_tests:
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 1 列ヘッダー + 半角空白 1 文字の行(Verifier の再現入力)→ 終了コード 2・column count mismatch expected=1 actual=1・参照未解決・violations=2"
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 1 列ヘッダー + タブだけの行 + 半角空白とタブを混ぜた行 → 全件拒否・violations=3"
      - "test/presentation/validate_config_crosscheck_job_map_rules.bats: 1 列ヘッダー + 該当版の行だけ → 受理して終了コード 0(巻き込み無しの対照)"
      - "test/usecase/validate_crosscheck_job_map.bats: crosscheck_target_catalog_report_row_errors が 1 列ヘッダーで空白行・タブ行を拒否し、空のセル `\"\"` の行は拒否しないこと"
