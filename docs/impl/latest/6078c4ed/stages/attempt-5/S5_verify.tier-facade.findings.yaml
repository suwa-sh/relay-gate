    suggested_fix: "PostgreSQL client経路を実装し、契約どおりrun_id単位のhead lock、audit_logs INSERT、audit_chain_heads INSERT/UPDATEを同一transactionで実行する統合テストを実PostgreSQLで追加する"
  - id: "F-002"
    viewpoint: "fault_tolerance"
    severity: "blocker"
    target: "facade/test/6078c4ed_select_slot.bats:458"
    claim: "runner_result_eventsの時系列が秒精度のoccurred_atでは一意に定まらず、TDD gateが不安定に失敗する。gate 3がexit 1のためS6へ進めない"
    evidence: "bats facade/testは42件中test 22でexit 1となった。対象テストだけを2回再実行するとfirst_exit=1、second_exit=0となり再現性の欠如も確認した。id_gateway.sh:28とrdb_gateway.sh:128はdate -u +%Y-%m-%dT%H:%M:%SZの秒精度を使い、テストはoccurred_at同値時にevent_name昇順でattempt_failedをattempt_startedより先に並べる一方、逆順を期待している"
    suggested_fix: "イベント順を確定できる時刻精度または明示的sequenceを契約・実装に持たせるか、内容だけを検証するテストなら時系列順を仮定しないassertionへ変更し、bats facade/testを複数回安定してpassさせる"
  - id: "F-003"
    viewpoint: "spec_conformance"
    severity: "blocker"
    target: "facade/src/launch_gateway.sh:29"
    claim: "SSH起動失敗時のstdoutがstatus=FAILEDまたはUNKNOWNとなり、本UCでstatusを固定値STARTINGとするCLI出力・データ契約に違反する"
