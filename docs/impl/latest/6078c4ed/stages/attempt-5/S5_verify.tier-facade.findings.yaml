    claim: "正本が要求する実PostgreSQL接続とaudit_chain_headsのSELECT ... FOR UPDATEが実行不能である。CLIはPostgreSQL DSNを無条件に終了コード1で拒否し、実行可能なSQLite経路はFOR UPDATEを発行しない"
