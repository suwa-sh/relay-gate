findings:
  - id: "F-001"
    viewpoint: "spec_conformance"
    severity: "blocker"
    target: "facade/src/launch_gateway.sh:24"
    claim: "foreground の実行完了と起動イベント受付を分離しておらず、長時間実行する foreground を SSH timeout として UNKNOWN にするため、完了を待たず10秒以内に exit 0 で応答する仕様を満たさない。"
    evidence: "spec.md:224-231 は foreground 実行が60秒かかる場合でも完了を待たず10秒以内に終了コード0と定義する。一方 launch_gateway.sh:31 は実ジョブの script_path を remote command に直接置き、launch_gateway.sh:60 は ssh を同期実行して終了まで wait する。反証実行 `bats --filter 'SSHが応答しない場合' facade/test/6078c4ed_select_slot.bats` は7.1秒で pass したが、その期待値自体が20秒継続する remote command に対する exit 124・runner_results=UNKNOWN であり、仕様の60秒 foreground Scenario と逆である。"
    suggested_fix: "remote 実行完了ではなく起動受付を返す明示的な launch acknowledgement 境界を設け、60秒継続する foreground でも background→foreground の受付後に10秒以内・exit 0となる実体テストを追加する。"
  - id: "F-002"
    viewpoint: "spec_conformance"
    severity: "blocker"
    target: "facade/src/rdb_gateway.sh:108"
    claim: "RAPID_CROSSCHECK_MODE を run 共通 execution spec に永続化しておらず、起動時に一度だけ確定して保存する仕様を満たさない。"
    evidence: "spec.md:126 は RAPID_CROSSCHECK_MODE の起動フラグを execution spec に記録すると明記するが、rdb_gateway.sh:108 の execution_specs INSERT は run_id、parent_run_id、job_id、additional_args、hang_detect_limit_minutes の5列だけである。_model-summary.yaml、rdb-schema.yaml、packages/contracts/relay-gate-db/schema-constants.sh にも対応カラムがなく、launch_gateway.sh:31 が一時的な SSH 環境変数として渡すだけなので、保存済み execution spec から on/off を復元できない。ユーザー指定で blocker 除外された exactly-one-foreground issue はこの差異を扱っていない。"
    suggested_fix: "仕様 feedback で永続化先を確定し、rdb-schema と契約生成物を再生成したうえで同一の起動前transactionに保存する。仕様側が永続化不要と決定する場合は spec.md:126 を明示的に改訂する。"
  - id: "F-003"
    viewpoint: "security"
    severity: "minor"
    target: "facade/src/credential_gateway.sh:41"
    claim: "秘密鍵 permission の実装条件とエラー文が 0600 を要求する契約に一致せず、0400・0500・0700 も受理する。"
    evidence: "cli-command-contract.yaml:125 は秘密鍵を0600で配置し、検査失敗をexit 1と定義する。実装の正規表現 `^0?[0-7]00$` に対する反証では 0400、0500、0600、0700 がすべて accepted、0644だけ rejected となった。group/other 権限は拒否できているため秘密情報露出は立証されず、minor とする。"
    suggested_fix: "0600だけを許可するか、owner-only を真の要件とするなら許容 mode とエラー文を契約へ明記して一致させる。"
  - id: "F-004"
    viewpoint: "refactoring"
    severity: "minor"
    target: "facade/features/steps/select-and-launch-slots-by-feature-flags.steps.cjs:28"
    claim: "RDBテスト用DDLが3箇所へ手書き重複しており、rdb-schema.yaml から生成する開発規約と単一正本性を満たさない。"
    evidence: "docs/dev-rules/test-strategy.md:77-79 は他tierのテストfixtureを rdb-schema.yaml から生成するよう定める。生成済み PostgreSQL fixture とは別に、facade/features/steps/select-and-launch-slots-by-feature-flags.steps.cjs:28-37、facade/test/6078c4ed_select_slot.bats:54-94、facade/test/select-and-launch-slots-by-feature-flags.bats:40-80 が SQLite DDL を個別保持している。現時点の契約定数6テーブルの列順照合は全件一致したが、将来のschema変更に対する drift gate はない。"
    suggested_fix: "rdb-schema.yaml から SQLite fixture も生成して共通化し、生成結果の drift check をゲートへ追加する。"
