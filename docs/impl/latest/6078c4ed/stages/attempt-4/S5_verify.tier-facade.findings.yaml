    claim: "起動操作の監査event schemaとsinkが未確定で、監査証跡を実装として保証できない。"
    evidence: "既存remote-handshake-rdb-audit-contract issueに記録済みで、stdoutはCLI応答契約のため独自形式を追加できない。"
    suggested_fix: "監査event schema、sink、保持・相関規則を仕様化してから実装する。"
