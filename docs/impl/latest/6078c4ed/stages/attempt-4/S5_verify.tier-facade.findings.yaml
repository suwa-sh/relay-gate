    target: "facade/bin/relaygate:initialization and resolve_job_map"
    claim: "単一deadlineがCLIプロセス開始後に設定され、初期化とjob-map可読性判定がguard外に残る。"
    evidence: "SCRIPT_DIR解決と契約sourceはdeadline設定前に実行され、resolve_job_mapの-r判定もdeadline_runを経由しないため、CLI応答10秒以内を全filesystem境界で保証できない。"
    suggested_fix: "スクリプト先頭でmonotonic deadlineを確定し、初期化を含むfilesystem境界を残余時間付きhelperへ通して遅延注入testを追加する。"
  - id: "F4-002"
    viewpoint: fault_tolerance
    severity: major
    target: "facade/bin/relaygate:deadline helpers"
    claim: "timeout対象が子プロセスを生成すると、期限後も子が残留し得る。"
    evidence: "20秒sleepを生成するSQLite test doubleではCLI assertは10秒未満でpassする一方、単独Batsの壁時計は21秒で、遅延子プロセスがtest終了まで残った。"
    suggested_fix: "I/O境界を専用process group/sessionで実行し、timeout時にgroup全体を終了して子PID不存在をtestする。"
  - id: "F4-003"
    viewpoint: spec_conformance
    severity: major
    target: "facade runtime boundaries"
    claim: "remote handshake、execution-spec配布、RDB gateway、runner_results識別を含む相互運用契約が未確定。"
    evidence: "既存runtime-contract issuesに記録済みで、現実装はJSON job map、SQLite、共有path、PATH上ssh、単一impl_versionに限定される。"
    suggested_fix: "feedbackでcross-cutting契約を確定後に実装する。"
  - id: "F4-004"
    viewpoint: operability
