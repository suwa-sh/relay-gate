findings:
  - id: "F-001"
    viewpoint: "spec_conformance"
    severity: "blocker"
    target: "facade/src/domain.sh:70"
    claim: "BLUE_MODE=offかつGREEN_MODE=offで起動対象が0件になると、未定義のselected_slots[0]を参照してnounset例外で終了する。仕様は各modeにoffを許し、禁止組合せとして同時foregroundだけを列挙しているため、この入力を未処理例外にしてよい契約はない。"
    evidence: "実行結果: env BLUE_MODE=off GREEN_MODE=off RAPID_CROSSCHECK_MODE=off ... facade/bin/relaygate concurrent-run select-slot --job-id daily-settlement は exit 1、stderr『domain.sh: line 70: selected_slots[0]: unbound variable』。spec.md:125,134はoffを値域に含め、tier-facade.md:102は同時foregroundのみを拒否する。facade/testとtier featureには両offの回帰ケースがない。"
    suggested_fix: "両offを有効な0-slot処理として扱うか、バリデーションエラーとして拒否するかを仕様へ還流して確定し、少なくとも未処理例外ではなく契約化した終了コード・stderrで処理する回帰テストを追加する。"
  - id: "F-002"
    viewpoint: "spec_conformance"
    severity: "blocker"
    target: "facade/src/job_map_gateway.sh:96"
    claim: "job_map_contractがhostとexec_userに要求するのは必須stringだけだが、実装は未契約の文字種正規表現を追加し、契約上有効な文字列をバリデーションエラーにする。SSH設定aliasや組織ディレクトリ由来の名前などを仕様根拠なく拒否する契約逸脱である。"
    evidence: "cli-command-contract.yaml:52-59はhost / exec_userをtype=string, required=trueとし文字種を限定していない。一方、job_map_gateway.sh:96-97はhostを^[A-Za-z0-9][A-Za-z0-9.-]*$、exec_userを^[a-z_][a-z0-9_-]*$?$へ限定する。job_map_contract.validationにもこの追加制約は存在しない。"
    suggested_fix: "契約のstring入力を安全にSSHへ渡せる実装へ変更するか、必要な文字種制約を仕様・job_map_contractへfeedbackで追加してから実装とテストを同期する。"
  - id: "F-003"
    viewpoint: "fault_tolerance"
    severity: "major"
    target: "facade/src/launch_gateway.sh:64"
    claim: "SSHプロセスの終了コード124をすべてローカル送出timeoutとみなしUNKNOWNへ遷移させるため、remote command自身が124を返した場合とdeadlineによるtimeoutを区別できない。外部起動側の非0応答をtimeoutと誤分類し、runner_resultsと監査イベントを誤った状態で確定する可能性がある。"
    evidence: "launch_gateway.sh:58-68はdeadline_run_for配下のssh終了コードが124なら原因を確認せずlaunch_result=timeoutとする。tier-facade.md:103-105は送出失敗をFAILED/attempt_failed、送出timeoutだけをUNKNOWN/attempt_unknownに分けるが、remote commandの終了コード範囲を124以外へ制限する契約はない。"
    suggested_fix: "ローカルdeadline発火をSSH/remote commandの終了コードと衝突しない別チャネルまたは専用statusで判別し、実際のdeadline発火時だけUNKNOWNへ遷移する。remote acceptance protocolで124を予約するなら、その制約をcross-cutting契約へ明記してテストする。"
