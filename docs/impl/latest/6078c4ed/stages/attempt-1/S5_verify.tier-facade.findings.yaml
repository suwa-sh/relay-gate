findings:
  - id: "F-001"
    viewpoint: performance
    severity: blocker
    target: "facade/bin/relaygate:launch_slot"
    claim: "SSH呼出しにタイムアウトがなく、接続ハングまたは長時間foreground処理でCLIが10秒を超えて停止し得る。"
    evidence: "tier-facade.mdのCLI応答10秒以内とNFR B.2.1.1に対し、launch_slotはtimeout制御なしで同期sshを実行する。"
    suggested_fix: "設定可能な10秒以下の接続・実行タイムアウトを適用し、タイムアウトを業務エラーとして扱う。"
  - id: "F-002"
    viewpoint: fault_tolerance
    severity: blocker
    target: "facade/bin/relaygate:persist_foreground_result,launch_slot"
    claim: "SSH起動失敗時、実際には未起動のforeground処理がRUNNINGとしてDBに残る。"
    evidence: "execution_specsとrunner_results(RUNNING)をINSERTしてからsshを実行し、失敗時の補償更新・削除がない。blue成功後にgreenが失敗する部分起動も回復不能。"
    suggested_fix: "起動失敗時にRUNNINGレコードをFAILEDへ補償更新し、run_idとslotを診断出力へ含める。部分起動も明示的に記録する。"
  - id: "F-003"
    viewpoint: readability_maintainability
    severity: major
    target: "docs/impl/latest/impl-config.yaml:tiers[tier-facade].commands.lint"
    claim: "公式lint gateが拡張子なしのfacade/bin/relaygateを検査していない。"
    evidence: "find facade -name '*.sh' は対象0件でexit 0だが、shellcheck -x facade/bin/relaygateはexit 1(SC2155、ほかinfo)となる。"
    suggested_fix: "lint commandまたは検査対象にfacade/bin/relaygateを明示し、SC2155を修正する。共有config変更はissues/feedbackで要求する。"
  - id: "F-004"
    viewpoint: security
    severity: major
    target: "facade/bin/relaygate:resolve_job_map,persist_execution_spec"
    claim: "hang_detect_limit_minutesとfixed_argsの型検証が不足し、不正なSQL断片または引数欠落を許す。"
    evidence: "hang_detect_limit_minutesは非空確認だけでSQLへ無引用連結される。fixed_argsは配列型を確認せず、process substitution内のjq失敗が親処理へ伝播しない。"
    suggested_fix: "整数範囲とJSON配列型を明示検証し、SQL値を安全に束縛または厳格に数値化する。"
  - id: "F-005"
    viewpoint: operability
    severity: major
    target: "facade/bin/relaygate:database and ssh error paths"
    claim: "外部境界失敗の診断情報が不足し、残留レコードをrun_idで追跡できない。"
    evidence: "SQLite詳細を破棄し、SSH失敗もslot名だけを返す。永続化済みrun_idを失敗時に出力しない。"
    suggested_fix: "秘密を含めずrun_id、slot、境界、原因分類をstderrへ出力する。"
  - id: "F-006"
    viewpoint: refactoring
    severity: major
    target: "facade/test/6078c4ed_select_slot.bats"
    claim: "重要な失敗経路・性能契約・remote command内容がテストされていない。"
    evidence: "SSH失敗後DB整合、SSHハング、RDB失敗、必須環境変数、ジョブマップ型、固定引数、全mode、RAPID_CROSSCHECK_MODE=offの禁止動作が未検証。"
    suggested_fix: "blockerの回帰テストと入力境界テストを追加し、fake sshの引数内容も検証する。"
  - id: "F-007"
    viewpoint: spec_conformance
    severity: minor
    target: "facade/bin/relaygate:resolve_job_map"
    claim: "credential_ref欠落時にNULLではなく空文字列を保存する。"
    evidence: "tier/model契約はnullableだが、credential_refはemptyへ正規化されsql_literalで空文字列となる。"
    suggested_fix: "欠落時はSQL NULLとして保存する。"
  - id: "F-008"
    viewpoint: readability_maintainability
    severity: minor
    target: "facade/bin/relaygate"
    claim: "多数の暗黙グローバル変数により関数の入出力とレイヤー責務が追いにくい。"
    evidence: "presentation/usecase/domain/gateway相当が単一スクリプトへ集約され、補助shellcheckでSC2155も検出される。"
    suggested_fix: "入力を明示的に受け渡す小関数へ分割し、local宣言と代入を分離する。"
