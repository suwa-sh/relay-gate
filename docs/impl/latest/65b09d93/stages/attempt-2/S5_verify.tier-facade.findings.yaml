assumption_verdicts:
  - id: "A-001"
    assumption: "runners/standard-runner.sh と lib/runner-*.sh は数行の入口にし、本体は src/presentation/standard_runner.sh と src/usecase/runner_resolve.sh / runner_spec.sh / runner_result.sh / runner_notify.sh に置く。共通ライブラリの本体 4 本は、この UC では関数を定義しない空のファイルにする"
    target: "facade/runners/standard-runner.sh:9"
    category: "data_format"
    tier: "tier-facade"
    verified_category: "data_format"
    verdict: "spec_absent"
    finding_id: "F-001"
    evidence: "tier-facade.md のデータモデル変更・責務表と CLI standard_runner は公開入口と後続UCの責務を定義するが、src配下への委譲方法は定めない。S4固定指示は可変dispatchに基づく判断も前提に記録すると明示。入口10行・各lib6行・usecase本体4行のコメントのみを確認。"
  - id: "A-002"
    assumption: "標準の slot runner の入口は、配置ディレクトリを CDPATH を空にした cd と論理パスの pwd で決め、本体へは引数でも環境変数でも渡さない(環境変数に export しない)"
    target: "facade/runners/standard-runner.sh:7"
    category: "data_format"
    tier: "tier-facade"
    verified_category: "data_format"
    verdict: "spec_absent"
    finding_id: "F-002"
    evidence: "CLI standard_runner.home は字面の runners/ の親・リンク非追跡・環境変数で受け取らないことを規定。空白を含む配置、別cwd、RELAY_GATE_HOME=/incorrect、CDPATH=/incorrectでもhelpと両slot検証は成功。配置全体のリンクは成功、runnersだけのリンクは未応答。"
  - id: "A-003"
    assumption: "標準の slot runner は、引数のうち `--` より前のどこかに --help があれば使い方を出して終了コード 0 で終える。`--` より後の --help は PARAM として扱い、使い方を出さない"
    target: "facade/src/presentation/standard_runner.sh:28"
    category: "input_validation"
    tier: "tier-facade"
    verified_category: "input_validation"
    verdict: "spec_absent"
    finding_id: "F-003"
    evidence: "CLI options[--help] はusageと版の出力・0終了を定義するが優先順位を定義しない。--unknown --help は0、正しい引数の -- より後の --help は6・無出力。"
  - id: "A-004"
    assumption: "標準の slot runner を --help 以外で起動したときは、stdout / stderr に何も出さずファイルも書かない。runner IF の引数が不正(--run-id / --job-id / --role / --mode の欠落、値を取る 5 オプション --run-id / --job-id / --role / --mode / --execution-spec の空の値・値の欠落、--role / --mode の列挙外、未知のオプション、--execution-spec と PARAM の併用)なら終了コード 2、引数が正しければ終了コード 6 で終える。exitcode.txt=2 の公開と、引数が正しい起動の処理(終了コード 6 は仮置き)は、後続 UC がジョブマップ解決・execution-spec 保存・実装の実行・Runner Result 公開・完了通知を実装するときに置き換える"
    target: "facade/src/presentation/standard_runner.sh:13"
    category: "error_handling"
    tier: "tier-facade"
    verified_category: "error_handling"
    verdict: "spec_absent"
    finding_id: "F-004"
    evidence: "CLI exit_codes は引数不正2・実行失敗6とRunner Result公開を定義し、未完成の段階の終了値は定義しない。今回の明示範囲では公開処理は後続UC。正しい引数は6、空の --execution-spec を含む不正引数は2、stdout/stderrとも空、cwdに作成物なし。完成版のジョブ実行を保証する判定ではない。"
  - id: "A-005"
    assumption: "--help の出力は `usage: standard-runner.sh --run-id <run_id> --job-id <JOB_ID> --role blue|green --mode foreground|background [--execution-spec <path>] [--help] -- [PARAM...]` の 1 行と `runner-if-version=1` の 1 行の 2 行にする"
    target: "facade/src/presentation/standard_runner.sh:15"
    category: "data_format"
    tier: "tier-facade"
    verified_category: "data_format"
    verdict: "spec_absent"
    finding_id: "F-005"
    evidence: "CLI synopsis/options[--help] と runner_help_probe.version_line_selection に一致。実測stdoutはusageとrunner-if-version=1の2行、stderr空、0終了。両slotのvalidate-configは版1を読めた。合計行数・usage全文の固定までは仕様にない。"
