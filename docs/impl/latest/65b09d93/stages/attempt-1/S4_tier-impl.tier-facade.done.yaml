scenario_handling:
  facade_sh_scenario: "『差し替えた runner 実体は runner IF だけで facade から起動できる』は、facade/bin/facade.sh が無い間は When の step が skipped を返す(Then の 2 step は実行されない)。facade.sh が存在すれば When が未実装として失敗する。fake の facade.sh は作っていない(前提 A-008)"
  probe_timeout_scenario: "『10 秒以内に復帰する』は待機の上限の振る舞いの確認として仕様どおりに判定した。経過時間は When の step の開始から終了まで(前提 A-007)。両 slot のスタブの PID を記録し、終了時点で残っていないことも確かめた"
  probe_preparation_failure_scenario: "Given どおり TMPDIR を /nonexistent/tmp にすると問い合わせの前の入力の複製が失敗して Then に届かない(issue 起票)。step は TMPDIR を /nonexistent/tmp にしたうえで、PATH の先頭の代替 mktemp が入力の複製の作業名だけを Scenario 専用のディレクトリに作る。問い合わせの一時ファイルの作成は本物の mktemp で実際に失敗する"
  home_in_steps: "読むだけの Scenario は <home> = facade/。config/ff.env を書く相対パスの Scenario は一時ディレクトリに runners/ lib/ src/ を複製した配置ディレクトリ(前提 A-009)。step はリポジトリの中にファイルを書かない"
