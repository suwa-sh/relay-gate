judgement:
  - scenario: SPEC-001-01-1
    method: "BLUE_MODE=foreground / GREEN_MODE=background で facade.sh JOB001 を起動。blue のテスト用 runner が --role blue --mode foreground、green が --role green --mode background の runner IF の引数(完全一致)で 1 回ずつ起動されたことを判定"
  - scenario: SPEC-001-01-2
    method: "GREEN_MODE=off(blue は foreground)。green にもテスト用 runner を割り当て、起動記録が無いこと・green/ が作られないこと・blue は起動されたことを判定"
  - scenario: SPEC-001-01-3
    method: "確報クロスチェックのキーが無い並行稼働の設定(速報は background、管理 DB あり)で起動。配置ディレクトリと PATH に置いた記録用の final-crosscheck-runner.sh の起動記録が無いことを判定"
  - scenario: SPEC-001-02-1
    method: "両 slot foreground。終了コード 2・定型の error 行・両 slot のテスト用 runner の起動記録なし・run ディレクトリなしを判定"
  - scenario: SPEC-001-04-1
    method: "名前から slot も実装も読み取れない 2 つの実体を BLUE_RUNNER / GREEN_RUNNER に割り当てて facade.sh JOB001 p1 を起動。どちらも同じ runner IF の引数だけ(完全一致)で 1 回ずつ起動されたことを判定"
  - scenario: SPEC-001-04-2
    method: "feature-flag.env の GREEN_RUNNER と GREEN_IMPL だけを書き換えて起動。(a) facade/bin・src・lib・runners の全ファイルと、feature-flag.env 以外の設定ファイル(slot ジョブマップ)の sha256 が書き換えの前後で同じ (b) blue は foreground、差し替えた runner は background で runner IF の引数で起動され、差し替え前の runner は起動されない、を判定。「比較規約」(比較定義・比較ツール)はクロスチェックの UC の担当で、この UC では触れていないことまでを見る(起票済み issue の 6 の判定のしかた)"
  - scenario: SPEC-002-01-1
    method: "実行ログの slot started の行の順(行の pid をテスト用 runner の PID と照合)で green → blue を判定。待機の行が blue の PID の 1 行だけで、facade の終了後も green のテスト用 runner が動いていて exitcode.txt が無いことを判定"
  - scenario: SPEC-002-01-2
    method: "facade.sh を終了を待たずに起動し、foreground の blue のテスト用 runner が動いている間(3 秒待ってから結果を書く)に、facade・blue・green の 3 プロセスが同時に動いていることを判定。その後 facade が終了コード 0 で終わり、green は動いたままであることも判定"
  - scenario: SPEC-005-06-3
    method: "CLI 契約 config_files の rapid-crosscheck.env の owner が「基盤適用設計者(設定所有区分: 速報クロスチェック設定 …)」で、運用者を含まないことを判定(文書の照合。先行 UC の SPEC-001-04-8 と同じ方式)"
  - scenario: SPEC-005-06-4
    method: "rapid-crosscheck.env(RAPID_DB_CONN_REF=mgmt-db / RAPID_LEASE_SEC / RAPID_POLL_INTERVAL_SEC)のキーが 3 つだけで、参照名は名前の形、パスワード・接続文字列・接続先の値が無いことを判定。あわせてこの設定で facade.sh を起動し、参照名だけで管理 DB に行が作られ、解決した接続情報の値が実行ログにも stderr にも出ないことを判定"
  - scenario: SPEC-011-01-1
    method: "速報 background で起動し、parallel_runs の execution_spec_uri が <RELAY_GATE_ARTIFACT_ROOT>/facade/<run_id>/execution-spec.json であることを判定"
  - scenario: SPEC-011-04-1
    method: "速報 background で起動し、facade/ の下のディレクトリ名(1 つ)と parallel_runs.run_id(1 行)が同じ値であることを判定。uc-map では UC 43850d68 の atdd_scenarios にも載っており、step はこの UC が定義した(43850d68 は同じ step を再利用する)"
  - scenario: SPEC-011-04-2
    method: "速報 off・管理 DB なし(rapid-crosscheck.env も接続設定も無い)で起動。終了コード 0・run_id 形式の成果物ディレクトリ・runner へ同じ run_id が渡ること・RDB クライアント CLI が 1 回も呼ばれていないことを判定"
  - scenario: SPEC-011-04-3
    method: "TZ=Asia/Tokyo・RELAY_GATE_NOW=2026-08-30T11:30:00Z で起動し、run_id が ^20260830T203000-JOB001-[0-9a-f]{8}$(ローカルの 20:30:00。UTC の 11:30:00 ではない)に一致し Z を含まないことを判定"
