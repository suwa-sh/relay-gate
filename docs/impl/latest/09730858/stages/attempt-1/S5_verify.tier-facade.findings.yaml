summary:
  blocker: 3
  major: 6
  minor: 16
verification_evidence:
  - check: "macOS"
    evidence: "bash 5.3.15、ShellCheck 0.11.0、setsidなし。format/lint/bin個別lint終了0。bats616/616、BDD141/141・1170/1170、skipなし。"
  - check: "Linux"
    evidence: "relay-gate-ci:ubuntu24、bash5.2.21、ShellCheck0.9.0、setsid=/usr/bin/setsid。src/test lintとbin個別lint終了0。bats616/616終了0。Linuxでcucumber/shfmtは利用者指定どおり対象外。"
  - check: "mutations"
    evidence: "一時複製3件。起動順逆転→green must be started before blue、別PID保存→pid UPDATE assertion、off分岐破壊→exit code assertion。各1シナリオが終了1で失敗。元実装のBDDは全件成功。"
  - check: "independent_probes"
    evidence: "引用符・空引数・改行のargvとJSON保持、rapid INSERT拒否時rollback、Asia/Tokyo時刻、exec失敗を確認。30ケースの変更前後比較は差分0。ログ欠落・環境継承・0件UPDATEのログも再現。"
  - check: "cleanup"
    evidence: "一時PostgreSQLはfinally/AfterAllで停止。BDDおよび変異後に対象postgresとsleep30の残留なし。テストは/tmp/relay-verify.mvzJi1の複製で実行。作業ツリーへの書込みは指定YAML2件のみ。"
environment_failures: []
accepted_scope_notes:
  - "A-001は利用者が採用済みのpsql方式。形式検証のexactly-oneリンクのため監査行を持つが欠陥・未解決major・再承認要求には数えない。"
evidence_root: "/tmp/relay-verify.mvzJi1"
