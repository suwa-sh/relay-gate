gate_run_notes:
  - "gate_runs は macOS(Darwin 25.5.0、arm64、PostgreSQL 14)での実測。最終のコードで bats と cucumber を 1 つずつ順に実行した"
  - "時間の上限を確かめるテスト・大きな入力を作るテストは追加していない。仕様のシナリオにある『green は 30 秒 sleep』は、facade が待たずに終わること(終了時に green が動いていること)として確かめた"
  - "tier BDD『runner 起動前に slot_executions を INSERT し起動後に pid を更新する』の Then 1 行目は、runner スタブの中で書く起動記録と facade の pid の UPDATE の前後が起動直後のプロセスの進み方で入れ替わりうるため、(a) INSERT(slot=green, pid なし)が green の起動記録より前、(b) pid の UPDATE が INSERT より後で、その pid が起動した green runner 自身の PID と同じ(起動の後にしか書けない)、で判定した"
  - "background で起動したスタブの記録(起動引数・環境変数・PID)は、スタブが記録の最後に書く印(<スタブ>.ready)を上限 10 秒で待ってから読む(facade は background を待たないため)。長く動くスタブの PID は After / teardown の時点で集めて止める"
  - "tier BDD『green の起動記録が blue より先』は、facade の実行ログの slot started の行(pid は各スタブが記録した自分の PID と同じ)の順で判定した(スタブの中の記録どうしの前後は同じ理由で入れ替わりうる)"
