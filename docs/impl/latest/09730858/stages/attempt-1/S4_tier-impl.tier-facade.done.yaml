test_harness:
  temp_postgres: "facade/features/steps/support/temp-postgres.js。initdb + pg_ctl の一時インスタンス(Unix ソケットだけ。ソケットは /tmp/rgpg-XXXXXX)。プロセスで 1 回起動し Scenario ごとに新しいデータベースを作る。initdb / pg_ctl / psql が PATH に無ければ fail。テーブルは packages/contracts/management-db/schema.json から実行時に組み立てる暫定 DDL(parallel_runs / slot_executions / rapid_runs。先頭に暫定と明記)"
  conn_ref_binding: "参照名 mgmt-db は一時ディレクトリの pg_service.conf(PGSERVICEFILE)で一時インスタンスに結び付ける"
  bats_db: "bats は管理 DB を起動しない。psql の呼び出し方(引数・SQL の順・終了コードの読み替え)は PATH の先頭に置く記録用の psql スタブで確かめ、実 DB は tier BDD で確かめる"
  long_running_stubs: "600 秒 / 30 秒動くテスト用 runner は exec sleep で PID を記録し、bats は teardown、cucumber は After で止める。実行後に postgres と sleep のプロセスが残っていないことを確認した"
