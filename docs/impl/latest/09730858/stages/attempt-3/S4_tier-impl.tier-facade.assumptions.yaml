    assumption: "runner プロセスの起動失敗(exec 不可)は、起動ごとに TMPDIR の下へ作る名前付きパイプで子から親へ知らせて判定する。runner を exec する層(setsid の後の bash -c)は、見張りの coproc を始めた後に最初に開始の合図の行(watch-started)を書く。この層は close-on-exec の coproc のパイプを持ち、exec に成功するとそのパイプが閉じる。親は 3 つを区別する: 合図の後の EOF は exec の成功(runner の終了は待たない)、合図の後の失敗の行は exec の失敗、合図の無い EOF または合図以外の行(setsid の失敗など、見張る層が始まる前に起動が終わった)は起動失敗。exec に失敗したときだけ coproc が失敗の行を書く(起動の直前に解決後のパスが実行可能なファイルでないときと、一時ディレクトリ・名前付きパイプを作れないときも起動失敗)。起動失敗のときは `error: runner failed to start run_id=... role=... runner=<解決後のパス>`(background-rerun.sh と同じ文言)を出し、実行ログに起動済みの PID(started_pids=)を残し、起動前に INSERT した行を FAILED で閉じて終了コード 6。PID は runner 自身の PID(setsid は呼び出し元がプロセスグループの先頭でないため fork しない)"
