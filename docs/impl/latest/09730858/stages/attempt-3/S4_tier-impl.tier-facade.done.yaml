  - id: F-001
    severity: blocker
    action: fixed
    note: "runner を exec する層(setsid の後の bash -c)が、見張りの coproc を始めた後に最初に開始の合図の行(watch-started)を名前付きパイプへ書くようにした。親は 1 行目に合図を待ち、合図の後の EOF を exec の成功、合図の後の失敗の行を exec の失敗、合図の無い EOF(setsid の失敗など見張る層が始まる前の失敗)を起動失敗として扱う。起動失敗は既存の経路(error 行・started_pids の実行ログ・起動前に INSERT した行を FAILED で閉じる・後続の slot を起動しない・終了コード 6)へ流れる。runner の終了は待たない"
  - id: F-002
    severity: major
    action: fixed
    note: "テストを 1 件追加した。runner のスタブは動き出した時点で psql のスタブが記録済みの slot_executions の INSERT の数を記録し、psql のスタブは FAKE_PSQL_SLOT_INSERT_DELAY=1 のとき slot_executions の INSERT を記録する前に 1 秒待つ。INSERT が起動の前なら数は green 1・blue 2。INSERT を起動の後へ移す変異では runner が先に記録するため数が足りず落ちる(一時複製に変異を入れ 3 回とも not ok を確認。green の判定を -ge 1 に緩めた後も 3 回とも not ok)。green は自 slot の 1 件以上(-ge 1)で判定するため、高負荷で green の動き出しが遅れて blue の INSERT まで数えても正しい実装は落ちない。待ちは変異を見逃す側にしか働かない。feature 本文は変えていない"
