spec_interpretation:
  - scenario: "mode だけを書いた Given の Scenario(多数)"
    note: "仕様の Given が要点だけを書いているため、検証を通る値(BLUE_IMPL / GREEN_IMPL、テスト用 runner、速報クロスチェックの runner / worker、rapid-crosscheck.env、起動している管理 DB)を step が補った。書かれた値は変えていない。起票済み issue の「仕様に書かれていない前提(step が補うもの)」の適用で、前提の新規抽出ではない"
  - scenario: "off の slot は起動しない(SPEC-001-01) / 新実装の単独本番モードでは green だけを起動し管理 DB に触れない(SPEC-001-03)"
    note: "「起動されない」を観測するため、off の slot にもテスト用 runner を割り当て(feature-flag.env に <SLOT>_RUNNER を書く)、起動記録が無いことを判定した"
  - scenario: "background を先に起動し foreground だけを待機する(SPEC-002-01)"
    note: "仕様どおり「facade は blue の終了後 10 秒以内に終了する」を判定した(blue のテスト用 runner が終了の印を書いた時刻から facade の終了までが 10 秒以内)。600 秒の green を待たないという振る舞いの確認で、性能の検査ではない。green のテスト用 runner(sleep 600)は Scenario の終了時に止める"
  - scenario: "並行稼働モードで blue foreground と green background を起動する(SPEC-001-01) / 次世代並行稼働モードでは blue background と green foreground を起動する(SPEC-001-03)"
    note: "「foreground の PID だけを待機する」は、(a) 実行ログの待機の行が foreground の runner の PID の 1 行だけ (b) facade の終了後も background のテスト用 runner が動いていて exitcode.txt が無い、の 2 点で判定した。起動の順は実行ログの slot started の行の順(行の pid はテスト用 runner が記録した自分の PID と照合)"
  - scenario: "RAPID_CROSSCHECK_MODE=background では parallel_run を STARTED から RUNNING にする(SPEC-011-01)"
    note: "INSERT(STARTED)→ UPDATE(RUNNING)の順は、一時 PostgreSQL のテスト用データベースに置いた履歴の表とトリガ(テストの観測用)で判定した"
  - scenario: "RAPID_CROSSCHECK_MODE=off では管理 DB に触れない(SPEC-005-04) / 新実装の単独本番モード(SPEC-001-03)"
    note: "管理 DB の接続設定が存在しない前提のため、「行は作成されない」「管理 DB へ接続せず」は、PATH の先頭に置いた RDB クライアント CLI(psql)の記録用ラッパーが 1 回も呼ばれていないことで判定した"
  - scenario: "RAPID_CROSSCHECK_MODE=off では速報クロスチェック設定が存在しなくても slot 実行できる(SPEC-005-06)"
    note: "「終了コードは foreground の exitcode.txt の値である」を 0 以外で確かめるため、foreground のテスト用 runner は exitcode.txt に 3 を書く(facade の終了コード 3 を判定)"
  - scenario: "RAPID_CROSSCHECK_MODE=background で管理 DB に接続できない"
    note: "参照名の結び付けと rapid-crosscheck.env を残したまま、一時 PostgreSQL を実際に止めてから facade.sh を起動した"
  - scenario: "確報クロスチェックを起動しない(SPEC-001-01)"
    note: "有効な並行稼働の設定を補い、配置ディレクトリ(一時ディレクトリの /opt/relay-gate と /opt/relay-gate/bin)と PATH に記録用の final-crosscheck-runner.sh を置いて、起動記録が無いことを判定した"
