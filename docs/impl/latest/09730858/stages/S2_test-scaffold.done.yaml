  - id: empty-job-map-key-scenario
    question: "UC BDD『値が空のジョブマップの場所のキーがある slot の runner は固定の名前のジョブマップで実行先を解決する』の Then 2・3 行目(execution-spec.json の中身と green の stderr.log)を、この機能でどう扱うか"
    recommended: "この機能では Then 1 行目(場所を渡す)だけを判定し、2・3 行目は標準の runner の中身ができるまで保留にして後続の機能で判定する"
    alternatives:
      - "仕様の変更要求を出し、Then 2・3 行目を後続の機能の Scenario へ移す"
    detail: docs/impl/latest/09730858/issues/20261118_091109_cross-uc-scenarios.md
