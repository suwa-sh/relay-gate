    question: "管理 DB のクライアントの呼び出し方(コマンド名と、参照名 RAPID_DB_CONN_REF の渡し方)が仕様に無い。実装者が補った前提として記録して進めてよいか"
    recommended: "psql を PATH から探し、参照名を接続サービス名として渡す。S4 の前提の記録に書く"
    alternatives:
      - "仕様の変更要求を出して契約に書いてもらう"
    detail: docs/impl/latest/09730858/issues/20261118_091109_cross-uc-scenarios.md
observations:
  - "管理 DB のテスト用ハーネス(initdb + pg_ctl の一時 PostgreSQL)はリポジトリにまだ無い。ops/migrations/ も空でテーブルの DDL が無い。S4 で facade/features/ と facade/test/ の補助として作り、DDL は契約の生成物 packages/contracts/management-db/schema.json から作って暫定と明記する(test-strategy.md)。この環境には initdb / pg_ctl / psql がある(/opt/homebrew/bin)"
  - "skeleton は Before / After を持たない。一時 PostgreSQL の起動と停止、600 秒待つテスト用 runner の後始末は、S4 / S6 で step を実装するときに、該当 Scenario だけで働く形で足す"
  - "UC BDD『background を先に起動し foreground だけを待機する』の『blue の終了後 10 秒以内に終了する』は、仕様のシナリオが定める振る舞い(600 秒の green を待たない)として転写した。仕様に無い時間の検査は足していない。MB 級の入力を作るテストも書いていない"
  - "単体テストは入口 facade/bin/facade.sh から見える振る舞いだけを判定し、facade/src/ の関数の分け方は固定していない。層ごとの単体テストは S4 の TDD で足す"
  - "bats と cucumber は 1 つずつ直列に実行した"
