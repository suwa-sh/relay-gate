    note: "exec の成否を子から親へ知らせる仕組みを入れた。起動ごとに TMPDIR の下へ名前付きパイプを作り、runner を exec する層(setsid の後の bash -c)が close-on-exec の coproc のパイプを持つ。exec に成功すると EOF、失敗すると失敗の行が届く。失敗は既存の経路(error 行・started_pids の実行ログ・FAILED への UPDATE・終了コード 6)へ戻す。runner の終了は待たず、PID は runner 自身のもの。bash 5.2(Ubuntu 24)は失敗した exec のリダイレクトを戻さないため、fd をリダイレクトで閉じる方式は使えないことを実測した"
