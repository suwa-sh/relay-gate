    viewpoint: "assumption_conformance"
    kind: "contradicts"
    assumption_id: "A-009"
    severity: "blocker"
    target: "facade/src/gateway/runner_process_adapter.sh:45"
    claim: "setsid が exec 監視層の起動前に失敗すると未起動を成功扱いする"
    evidence: "tier-facade.md 出力契約6・UCロジックのエラーハンドリングおよび cli-command-contract.yaml commands.facade.sh.exit_codes は runner 起動失敗を6とし、後続slotを起動せず失敗行をFAILEDで閉じる。PATH先頭の setsid スタブを green の場合だけ exit 1、それ以外は exec \"$@\" とする故障注入で、未変更 facade は exit=0、stdout/stderr空、起動記録は blue のみ。実DBには green|RUNNING|82429|RUNNING と blue|RUNNING|82444|RUNNING が残り、ログにも green slot started と STARTED→RUNNING が出た。直接adapter試験も macOS/bash5.3 と Linux/bash5.2 の両方で launch_rc=0, child_rc=1。FIFOの空EOFを成功とするため、watcher未起動によるEOFを区別できない。"
    suggested_fix: "exec監視層が確実に開始したことと、その層がrunnerへのexecに成功したことを区別するハンドシェイクにする。監視層より前のlauncher/bash起動失敗を空EOFで成功にせず、終了コード6・後続未起動・FAILEDへのベストエフォート更新に流す。backgroundの終了を待つ方式にはしない。"
  - id: "F-002"
    viewpoint: "refactoring"
    severity: "major"
    target: "facade/features/steps/select-slot-mode-and-launch-runners.steps.js:455"
    claim: "runner 起動前の INSERT を起動後に移した変異を、順序検証シナリオが検出できない。"
    evidence: "一時複製の launch_slots_start_slot で slot_execution_repo_create を含む if ブロックを runner_process_adapter_launch の成功後、LAUNCH_SLOTS_SLOT_PID 設定直前へ移動した。対象BDD「runner 起動前に slot_executions」は2回とも exit 0、1 scenario/10 steps passed。exec確認後でもrunner内の launch 記録は遅れ得るため、実際には起動後INSERTなのに記録の並びがINSERT→launchになる。逆起動順の変異とpid=1の変異はそれぞれ該当Thenでexit1になり、step全体が空実装なのではない。"
    suggested_fix: "runner内の遅れ得るログ行だけに依存せず、起動境界とINSERT確定の前後を同期させた故障注入テストを加える。起動後へINSERTを移す変異が確実に失敗することを確認する。"
