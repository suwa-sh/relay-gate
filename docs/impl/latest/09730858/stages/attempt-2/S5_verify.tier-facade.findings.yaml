verification_evidence:
  - check: "macOS gates"
    command: "shfmt -d . / find src test -name *.sh -exec shellcheck -x {} + / shellcheck -x bin/*.sh / bats -r test / npx cucumber-js --config ../cucumber.cjs features"
    result: "pass"
    detail: "元リポジトリの.editorconfig/.shellcheckrcも含む一時複製で実行。bash5.3.15、ShellCheck0.11.0。Bats636/636、BDD141/141・1170/1170。全コマンドexit0。Bats全件は1回。"
  - check: "Linux gates"
    command: "docker run --rm relay-gate-ci:ubuntu24; facade cwdでlint、入口lint、bats -r test"
    result: "pass"
    detail: "Ubuntu24、bash5.2.21、ShellCheck0.9.0、実setsidあり。全コマンドexit0、Bats636/636。全件1回。ユーザー指定に従いLinuxのshfmt/cucumberは対象外。"
  - check: "environment probe"
    result: "pass"
    detail: "initdb+pg_ctlで一時PostgreSQLを起動しSELECT 1、停止。Unix socket/shared-memoryの実利用が可能。docker起動・mkfifoも確認。環境失敗なし。"
  - check: "regression"
    result: "pass"
    detail: "git archive 9daed50の一時複製と現行版でvalidate-config3種・14入力の終了コード/stdout/stderrが完全一致。"
  - check: "fault injection"
    result: "fail"
    detail: "setsidのgreen起動のみexit1で起動前失敗を注入。facade exit0、blueのみ起動、green DB状態RUNNING。F-001。実DBで文字列引用・同一トランザクションrollbackは成功。"
  - check: "mutations"
    result: "fail"
    detail: "逆起動順exit1、pid=1更新exit1。slot INSERTをexec確認後へ移した変異は2回ともexit0。F-002。全変異は一時複製だけに適用。"
  - check: "cleanup"
    result: "pass"
    detail: "ゲート・変異後にテスト用PostgreSQL/runner残存なし、一時TMPDIRにrelay-gate-launch FIFOディレクトリ残存なし。元リポジトリは出力2ファイル作成前にclean。"
