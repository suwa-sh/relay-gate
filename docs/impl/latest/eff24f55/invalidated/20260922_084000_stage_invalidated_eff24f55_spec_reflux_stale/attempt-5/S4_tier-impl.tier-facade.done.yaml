    note: "job_map_repo_load は、検証の開始時に mktemp で作った一時ファイルへ cat で入力を 1 回だけ複製する。事前走査(tr と sed)も、空ファイルの判定も、bash の行の読み込みも、すべて複製だけを読み、元のパスは開かない。このため、点検した内容と解析する内容は必ず同じバイト列になる。JOB_MAP_PATH と出力の path: / map_path: は、利用者が指定したパスのまま。複製は戻る経路ごとに削除する。読み込み中は HUP / INT / TERM の trap で複製を削除し、129 / 130 / 143 で終える。読み込みを終えたら呼び出し元の trap に戻す。mktemp と cat の失敗は、既存の error: internal command failed commands=tr,sed path: <path> と終了コード 6 で終える。回帰テストは、Verifier と同じ注入(export -f した tr の直後に mv で差し替える)で追加し、修正前に RED(job_id=J2 work_dir=/new を受理して終了 0)を確認した。修正後は、差し替え前の内容だけで検証する(job_id=J1 work_dir=/old、rows=1)。逆向きの差し替え(差し替え前に NUL がある)は終了 2 で拒否する"
  - ids: ["F-021"]
    severity: "minor"
    status: "fixed"
    note: "F-001 の修正で文面が現行のコードと合わなくなった A-028 を書き直した(走査と読み込みは同じ複製から行う)。単一スナップショットの判断を A-045 として追加した。あわせて、複製の失敗時の診断を A-046、一時ファイルの置き場所と権限を A-047、シグナル時の後始末を A-048 として追加した。全前提の target の行番号を現行のコードに合わせた"
