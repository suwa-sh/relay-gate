  residual: "閾値未満(low): (1) mktemp がファイルを作った直後から変数に代入するまでの間にシグナルが届くと、複製が残りうる(理論上の競合)。(2) サブシェルの中から呼ぶと、bash が表示する親の INT・TERM・HUP の trap を戻してしまう(本番の呼び出し元は最上位のシェルだけ)。(3) 読み込み中に外部の処理が複製を消すと、リダイレクトのエラーに一時パスが出る(終了は 6)。修正後の外部再レビューは未実施"
