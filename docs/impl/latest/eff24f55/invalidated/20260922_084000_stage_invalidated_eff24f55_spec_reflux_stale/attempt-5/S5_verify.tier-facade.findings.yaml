findings:
  - id: "F-101"
    viewpoint: "fault_tolerance"
    severity: "minor"
    target: "facade/src/repository/job_map_repo.sh:221"
    claim: "一時ファイル作成直後の HUP/INT/TERM で空の一時ファイルが残る。今回の修正で追加された後始末処理の直接の欠陥。"
    evidence: "mktemp の通常処理直後、コマンド置換が戻る前に親へシグナルを送ると終了129/130/143、stdout/stderrなし、TMPDIR に0600・0バイトの relay-gate-job-map.* が各1個残った。JOB_MAP_REPO_SNAPSHOT への代入より先に trap が走るため削除対象を取得できない。走査中の同じシグナルでは残留0。空ファイルのみで、入力漏洩・誤受理は確認されていないため minor。"
    reproduction: "TMPDIR=$(mktemp -d) を export し、その外に通常の5列ヘッダーと J1,/old,/s,[],60 の map.csv を置く。bash で mktemp() { command mktemp \"$@\"; kill -TERM $$; }; export -f mktemp を定義し、facade/bin/validate-config.sh --job-map \"$MAP\" --verbose を実行する。終了143後に TMPDIR を列挙すると空ファイルが1個残る。TERM を HUP / INT に変えると129 / 130で同様。mktempの戻り値・出力は改変しない。"
    suggested_fix: "一時ファイルの作成と所有パス登録の間にも削除対象を把握できるよう、シグナル処理と資源取得の順序を見直す。"
