summary:
  blocker: 3
  major: 2
  minor: 26
reproduction:
  description: "一時ディレクトリに実体CSVを作成し、facade/bin/validate-config.shを実プロセス起動。検査後は一時ファイルを削除した。"
  raw_controls: "CSVヘッダーは job_id,work_dir,script,fixed_params,hang_detect_limit_minutes。データ行のfixed_paramsセルはJSON文字列 [\"a<control>b\"] をCSV二重引用符で囲み、内部引用符を二重化する。controlは実TAB=0x09、CR=0x0d、ESC=0x1b。--verbose実行はいずれもexit 0。"
  mixed_version: "ヘッダー job_id,work_dir,script,fixed_params,hang_detect_limit_minutes,map_version と2行 J1,/w,/s,[],60, および J2,/w,/s,[],60,v1。実行はexit 0、map_version=v1、mixed警告なし。"
  related_findings: "F-001は不正JSONの受理、A-014のfindingはJSONではないverbose出力であり関連する。件数は専用findingを要求するスキルスキーマどおり集計。"
questions_for_orchestrator:
  - assumption_id: "A-012"
    question: "参照名の正規表現に合わず、/ と BEGIN も含まない credential_ref をどう扱うか。"
    options:
      - "現在の警告のみで受理する方針を承認する"
      - "仕様を更新して拒否する"
