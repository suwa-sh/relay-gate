findings:
  - id: "F-001"
    viewpoint: "spec_conformance"
    severity: "blocker"
    target: "facade/src/domain/job_map.sh:229"
    claim: "fixed_params のJSON文字列内に生の制御文字を含む不正JSONを正常と判定する。"
    evidence: "tier-facade.md 設定契約のfixed_paramsはJSON配列の文字列要素のみ。ヘッダー job_id,work_dir,script,fixed_params,hang_detect_limit_minutes と行 J1,/w,/s,\"[\"\"a<TAB>b\"\"]\",60 の <TAB> を実バイト0x09にすると、bin/validate-config.sh --job-map <path> はexit 0、rows=1。生CRとESCもexit 0。エスケープした\\tは許可されるが未エスケープ制御文字はJSONではない。in_string分岐が引用符とバックスラッシュ以外を無条件に追加している。"
    suggested_fix: "文字列内の未エスケープU+0000〜U+001Fを拒否し、契約のfixed_paramsエラーと終了コード2を返す。実体CSVの制御文字ケースを追加する。"
  - id: "F-002"
    viewpoint: "performance"
    severity: "major"
    target: "facade/src/domain/job_map.sh:388"
    claim: "一意なjob_idを全組合せ比較するため、ジョブ数の増加で検証時間が二次的に増える。"
    evidence: "同一環境の実体CSV、5列ヘッダー、行 JOB<i>,/w,/s,[],60、非verboseで100行0.104秒、500行1.052秒、1000行3.736秒、2000行13.943秒、すべてexit 0。重複検査はn(n-1)/2回の比較。nfr-grade.yaml B.2.1.1はCLI応答10秒以内を目標とする。ただし最大マップ行数と対象実機性能は未定義なので、この追加負荷試験だけでNFR違反のblockerにはしない。"
    suggested_fix: "対応bash版に適合する索引またはソートによる重複集計で全組合せ走査を避け、対応行数の性能条件を確認する。"
