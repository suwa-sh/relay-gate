  - id: "F-001"
    viewpoint: "operability"
    severity: "blocker"
    target: "facade/src/domain/cli_field.sh:44"
    claim: "ジョブマップの値やパスに含まれる制御文字を出力し、ANSI 禁止と固定行出力の契約に違反する。"
    evidence: "ui-design.md 出力フォーマットおよび cli-command-contract.yaml conventions.output_format は ANSI エスケープを出さず、1 行 1 事実を要求する。ヘッダー job_id,work_dir,script,fixed_params,hang_detect_limit_minutes,map_version と行 J1,/w,/s,[],60,<ESC>[31mred<ESC>[0m で exit 0、stdout の map_version に実バイト 1b 5b 33 31 6d と 1b 5b 30 6d を確認。また LF を含む map ファイル名で stdout が 3 行から 4 行へ増加。"
    suggested_fix: "任意入力を表示する箇所で制御文字を安全な可視表記へ変換するか、契約に従った入力拒否を行い、成功・失敗の出力経路を検証する。"
  - id: "F-002"
    viewpoint: "fault_tolerance"
    severity: "blocker"
    target: "facade/src/domain/job_map.sh:471"
    claim: "プロセス置換内の補助コマンド失敗を検知せず、検証未実施の入力を成功扱いする。"
    evidence: "通常環境では sort/tr/sed が存在しゲートは通過。障害注入として bash 関数 sort() { return 1; } を export -f し実 CLI を起動すると、J1 が 2 行ある CSV に exit 0、rows=2、stderr 空。正常系は重複で exit 2。tr() { return 1; } の注入でも J<NUL>1 の行が exit 0 となり、正常時の csv quote is invalid/exit 2 を迂回した。job_map_repo.sh:190 と job_map.sh:471 のプロセス置換終了状態は親へ伝播しない。tier 設定契約の job_id 一意性と不正入力の拒否に違反。環境不足ではなく意図的障害注入で立証。"
    suggested_fix: "補助コマンドの終了状態を親で確認できる構造へ変更し、失敗時に成功サマリーを返さない。sort と NUL 事前走査の障害をそれぞれ検証する。"
