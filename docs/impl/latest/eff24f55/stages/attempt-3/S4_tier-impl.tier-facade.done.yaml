    severity: "major"
    status: "not_fixed"
    note: "A-012 は仕様に照合先が無い前提で、拒否へ変えると契約の stderr に無い error 行を発明することになる。警告のみで受理する実装を維持し、前提として S9 の人間判断に委ねる"
  - ids: ["F-002", "F-003", "F-004", "F-005", "F-006", "F-007", "F-008", "F-010", "F-011", "F-012", "F-013", "F-014", "F-015", "F-016", "F-017", "F-018"]
