self_inspection:
  scope: "CSV の読み込みから fixed_params 検証、verbose 出力までの経路を、bash が黙って変形または欠落させる入力の観点で点検した。各ケースは実ファイルを bin/validate-config.sh に渡して LC_ALL=C と en_US.UTF-8 の両方で挙動を確定し、bats の回帰テストにした"
  cases:
    - input: "NUL バイトを含む行(fixed_params 内、job_id 内、ヘッダー行内、閉じ引用符の直後)"
      behavior: "終了コード 2 と csv quote is invalid line=N。修正前は NUL が落ちた値を終了コード 0 で受理していた"
      basis: "A-026"
    - input: "NUL バイトだけの行(改行あり、改行の無い最終行)"
      behavior: "空行として読み飛ばさず、終了コード 2 と csv quote is invalid line=N。修正前は黙って無視していた"
      basis: "A-026"
    - input: "NUL バイトの直後に # が続く行"
      behavior: "コメント行として扱わず、終了コード 2 と csv quote is invalid line=N。修正前はコメント行として無視していた"
      basis: "A-027"
    - input: "1 バイト目が # で途中に NUL バイトがある行"
      behavior: "コメント行として無視する"
      basis: "A-027"
    - input: "最終行の末尾に改行が無いファイル"
      behavior: "最終行も検証し、集計に含める"
      basis: "A-036"
    - input: "CRLF 改行のファイル"
      behavior: "CR は行末のセルの値に残る。必須 5 列だけのファイルは header mismatch で終了コード 2。行末が任意列のファイルは unknown column の warn で終了コード 0。データ行だけ CRLF なら行末の値の検証違反で終了コード 2。CRLF の空行は column count mismatch で終了コード 2"
      basis: "A-029"
    - input: "先頭に UTF-8 の BOM があるファイル"
      behavior: "BOM は先頭のセルの値に残る。先頭の列が job_id なら header mismatch missing=job_id で終了コード 2"
      basis: "A-030"
    - input: "UTF-8 として不正なバイト列(0xff 0xfe、続きの無い先頭バイト 0xe3 の直後に引用符やカンマ)"
      behavior: "バイト列を変えずにセルの値として扱う。区切りの判定は変わらない。job_id 内なら job_id is invalid で終了コード 2"
      basis: "A-031"
    - input: "アクセント付き文字や全角英数字を含む job_id、全角数字の hang_detect_limit_minutes"
      behavior: "ロケールに関係なく終了コード 2(job_id is invalid、is not a non-negative integer)"
      basis: "A-032"
    - input: "引用符で囲んだセルの途中の改行"
      behavior: "物理行ごとに csv quote is invalid で終了コード 2"
      basis: "tier-facade.md 設定契約の「セル内に改行は置けない」と CSV セルのクォート解析規則に明示"
    - input: "空ファイル、空行だけのファイル、コメント行だけのファイル"
      behavior: "必須 5 列の header mismatch で終了コード 2"
      basis: "tier-facade.md ヘッダー検証に明示(attempt 1 の独立検証で復唱と判定済み)"
    - input: "ヘッダー行だけのファイル(末尾の改行あり、なし)"
      behavior: "rows=0 と map_version=- で終了コード 0"
      basis: "tier-facade.md 出力契約の終了コード表(error 0 件)と spec.md 計算ルール「行数集計」に明示"
    - input: "末尾に空行が続くファイル"
      behavior: "空行を rows に数えず終了コード 0"
      basis: "tier-facade.md 設定契約の「空行は無視」に明示"
    - input: "半角空白だけの行、行頭に空白のある # の行"
      behavior: "1 セルのデータ行として column count mismatch で終了コード 2"
      basis: "A-035(行頭が # でない行がコメント行でないことは tier-facade.md 設定契約に明示)"
    - input: "行末がバックスラッシュの行、glob や変数やコマンド置換やオプション風の値"
      behavior: "次の行と連結せず、展開もせず、文字どおりの値として扱う"
      basis: "CSV セルのクォート解析規則が特別扱いする文字はカンマと二重引用符だけ(明示)"
    - input: "非常に長い行(fixed_params が 10 万文字と 20 万文字、二重化引用符やエスケープが密な 4 万文字と 10 万文字)"
      behavior: "長さを理由に拒否しない。10 万文字の行は verbose つきで 0.2 秒、密な 10 万文字の行は 8 秒未満。修正前は 10 万文字の行に約 100 秒かかっていた"
      basis: "A-033 / A-034"
