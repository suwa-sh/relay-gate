    evidence: "tier-facade.md 設定契約はjob_idを^[A-Za-z0-9_-]+$に限定し、CLI契約config_filesのedit_ruleは一時ファイルを書いてmvで置換する運用を指定する。独立実行で旧行J1,/old,/s,[],60を走査後、新行J<NUL>2,/new,/s,[],60へatomic置換すると終了0、rows=1、infoのjob_id=J2 work_dir=/newとなった。旧ファイルにも新ファイルにもこの正常行は存在しない。同じ新ファイルを静的に再実行すると終了2、csv quote is invalid line=2となる。両ファイルともヘッダー込み2行のため行数チェックを通過する。"
    reproduction: "一時ディレクトリに同じ5列ヘッダーのmap.csvとnext.csvを用意する。旧データ行はJ1,/old,/s,[],60、新データ行はJ\\x002,/new,/s,[],60の実NULを含むバイト列。VERIFIER_MAPとVERIFIER_NEXTを設定し、bash関数 tr() { command tr \"$@\"; command mv \"$VERIFIER_NEXT\" \"$VERIFIER_MAP\"; }; export -f tr で通常のtr処理直後の置換タイミングのみ制御してbin/validate-config.sh --job-map \"$VERIFIER_MAP\" --verboseを起動する。tr/sedの失敗や出力改変は注入しない。"
    suggested_fix: "事前バイト検査とCSV解析が必ず同じ不変の入力を参照するようにする。atomic置換前後の別ファイルを混在させず、同一行数の置換と不正バイトを使う回帰検証を追加する。"
