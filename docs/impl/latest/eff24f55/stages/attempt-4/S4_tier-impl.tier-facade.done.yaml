findings_resolution:
  - ids: ["F-001"]
    severity: "blocker"
    status: "fixed"
    note: "共通関数 facade/src/domain/cli_field.sh に cli_field_escape_text と cli_field_safe_text を追加し、cli_field_line / cli_path_field_line / cli_field_display_value と、--job-map の error / warn / info の全行、presentation の unknown option / unexpected argument で、制御文字を可視表記へ置き換える。改行とタブは 2 文字のエスケープ、その他の U+0001〜U+001F と U+007F と UTF-8 の C1 制御文字は u00XX 形式。verbose の fixed_params= の JSON エスケープも同じ関数で作る。制御文字を含まない値は 1 バイトも変えない(単体テストと、旧実装との出力比較で確認)。表記の選択は A-040 / A-041 / A-042 に記録した"
  - ids: ["F-002"]
    severity: "blocker"
    status: "fixed"
    note: "プロセス置換を廃止し、tr と sed の事前走査と sort の結果をコマンド置換で受けて終了状態を確認する(事前走査は PIPESTATUS で全段を確認)。失敗時は stdout を出さず error: internal command failed commands=... の 1 行と終了コード 6 で終える。終了状態 0 のまま出力が欠ける障害も検知する(sort は行数と昇順を確認。事前走査は sed に走査完了の証跡と総行数を出させ、bash が読み込んだ行数と照合)。Verifier と同じ export -f の障害注入を実 CLI で再現する回帰テストを追加した。文言と終了コードの選択は A-043 / A-044 に記録した"
  - ids: ["F-025"]
    severity: "blocker"
    status: "fixed"
    note: "事前走査(tr と sed。LC_ALL=C、基本正規表現と生のバイトだけ)で UTF-8 として不正な行を検出し、セルに分解せず既存の行 error: csv quote is invalid line=N path: <path> と終了コード 2 で拒否する。妥当性は RFC 3629 の範囲(過長形式、サロゲート、U+10FFFF 超、切れた並びは不正)。コメント行も対象にした。BSD sed と GNU sed 4.9 の両方で確認した。A-031 を書き直し、A-038 / A-039 を追加した"
  - ids: ["F-010"]
    severity: "major"
    status: "not_fixed"
    note: "A-012 は仕様に照合先が無い前提で、拒否へ変えると契約の stderr に無い error 行を発明することになる。dispatch 指示のとおり実装は変えず、前提として S9 の人間判断に委ねる"
  - ids: ["F-021", "F-026"]
    severity: "minor"
    status: "fixed"
    note: "仕様に明示された判断の復唱と判定された A-027 と A-032 を前提の記録から外し、excluded_as_explicit に数えた(実装は変えていない)"
  - ids: ["F-031"]
    severity: "minor"
    status: "fixed"
    note: "A-026 の category を error_handling に改めた(A-031 も同じ分類にした)"
  - ids: ["F-032"]
    severity: "minor"
    status: "fixed"
    note: "ヘッダー行だけでデータ行 0 件のファイルを検証 OK にする判断を A-037 として前提に追加した(実装は変えていない)"
  - ids: ["F-011", "F-022"]
    severity: "minor"
    status: "fixed"
    note: "F-001 / F-025 の修正に伴い A-014(U+007F と C1 もエスケープする)と A-028(事前走査が不正な UTF-8 も検出する)の文面を現行の実装に合わせて書き直した。判断そのものは仕様に照合先が無い前提として残す"
  - ids: ["F-003", "F-004", "F-005", "F-006", "F-007", "F-008", "F-009", "F-012", "F-013", "F-014", "F-015", "F-016", "F-017", "F-018", "F-019", "F-020", "F-023", "F-024", "F-027", "F-028", "F-029", "F-030"]
    severity: "minor"
