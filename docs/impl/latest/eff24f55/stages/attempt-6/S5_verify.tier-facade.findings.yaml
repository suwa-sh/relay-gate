observations:
  - "初回macOS検証は独自差分実行とBatsが同じTMPDIRを共有し、BSD mktempの固定テンプレート作成で競合した。これを合否の根拠から外し、検証系ごとのTMPDIRへ分離して再実行した。通常ゲート537件とCLI896比較は全通過。比較前後の双方で起きた既存BSDフォールバックの並走上の注意として記録する。"
  - "一時複製の初回shfmtは.editorconfigを含めず既定インデント差を報告した。対象リポで正本.editorconfig付きのコマンドを再実行しexit0、Linux複製にも正本を配置してexit0を確認した。実装の整形違反ではない。"
  - "性能目標は合否に用いていない。既知の差はdocs/impl/latest/eff24f55/issues/20261116_062901_job-map-bash-only-parse-exceeds-performance-target.mdに記録済みとして再測定していない。参考の120行計測以外に性能網羅測定は行わなかった。"
  - "read-setにinvalidated配下の過去検証記録は含めていない。S4 doneからはgate結果だけを抽出し、実装者の説明は読んでいない。"
  - "テスト・変異・比較スクリプトとログは/tmp/relay-verify.TXz3LL配下。リポジトリへの書き込みはS5のdone/findingsのみ。"
