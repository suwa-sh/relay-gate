implementation:
  summary: "--job-map の性能の目標値(5,000 行以内かつ 8 MB 以内を内容によらず 10 秒以内)との差を縮めた。出力のバイト列(stdout / stderr)と終了コードは変えていない"
  proposal_3: "ヘッダーと行ごとの検証の報告行(未知の列名・列名の重複・列の値の error・credential_ref の warn・info: resolved・duplicate job_id・mixed map_version)は値を元のまま溜め、stderr へ出す直前に共有関数 cli_field_safe_text_list でまとめて可視表記にする。stdout の map_version は cli_field_safe_text_prepare で先に控える。共有ファイル cli_field.sh は変更していない(規則を複写していない)"
  proposal_4: "セルの解析は bash だけのまま。行の長さの 2 乗に比例する処理を除いた: (1) CSV はすべての行を窓なしの解析(単語分割)で分け、囲んだセルの `\"\"` は断片の配列を最後に 1 回つなぐ。(2) fixed_params の状態機械は、部分文字列を窓ごとに取り出さず、`\"` と `\\` の前で分けた断片を読み、要素の JSON の表記も一緒に作る。(3) fixed_params の早期判定と表記の組み立ては、パターン置換を使わず単語分割と printf の書式で行う"
  locale: "--job-map の検証全体を C ロケールで行う(validate_job_map_query の先頭で local LC_ALL=C)。LANG=C.UTF-8 のときの所要時間がロケール C と同じになった。出力のバイト列は 3 通りのロケールで変更前と同じ"
  remaining_gap: "制約(bash だけで解析・検査する)のままでは、1 行に CSV の `\"\"` や JSON のエスケープが数十万個ある 8 MB の入力(Linux 39〜97 秒)と、列が 200 万個のヘッダー(macOS 103 秒)が 10 秒を超える。事実と選択肢を issues に書いた。macOS は制御文字だらけの job_id などで 10〜12 秒(BSD sed と bash の文字列の扱いによる。実行環境の Linux では 8 秒前後)"
