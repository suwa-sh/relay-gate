findings:
  - id: "F-001"
    viewpoint: "spec_conformance"
    severity: "blocker"
    target: "facade/src/repository/job_map_repo.sh:122"
    claim: "CSV読み込み時にNULバイトが黙って消去され、不正なfixed_paramsのJSONを終了コード0で受理する。固定引数の内容も変わる。"
    evidence: "必須5列のCSVにデータ行 J1,/w,/s,\"[\"\"a<NUL>b\"\"]\",60 をバイナリ書込みし、bin/validate-config.sh --job-map <path> --verboseを実行した。<NUL>は実バイト0x00。実測は終了0、rows=1、fixed_params=[\"ab\"]。tier-facade.mdのfixed_paramsはJSON文字列配列で、不正なら終了2を要求する。生の0x00を含むJSON文字列は不正。read -rが検証前に0x00を落とすためdomainの制御文字検証に届かない。"
    suggested_fix: "bash文字列へ取り込む前にNULを検出し、行番号付きの設定検証エラーとして拒否する。実ファイルに0x00を含む回帰テストを追加する。"
