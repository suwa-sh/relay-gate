findings:
  - id: "F-001"
    viewpoint: "performance"
    severity: "blocker"
    target: "facade/src/domain/cli_field.sh:104"
    claim: "制御文字の種類が多い有効な5,000行のfeature flag設定で、10秒以内という性能条件を満たさない。前回のESC128入力だけの改善では条件全体を満たさない。"
    evidence: "relay-gate-ci:ubuntu24、Ubuntu24 ARM64/bash5.2.21、LC_ALL=C、非root、network none、リポジトリread-only。入力とsnapshotはコンテナ内mktemp -dの一時FSで他の検証と直列実行。5行の有効green_only設定と一意な未知キー4,995行。各キーは6バイトのK00000〜K04994と29種類のC0/DELを反復したもの。キー長1023/1024/1025、全体5124985/5129980/5134975バイトで14.295/14.652/24.928秒、いずれもexit0、stdout15行、stderr9995行。共有マウントでの別入力5,148,856バイトでも24.942秒。ユーザー指定の内容によらず10秒以内とCLI契約config_input_rules.rulesの行・セル長上限なし/5,000行内で処理時間保証に違反する。キャッシュ上限1024バイトを越えるとinfo/warnの置換を繰り返す。既存追加性能テストの約0.51/0.68MBは通過するが、本ケースを覆わない。"
    suggested_fix: "出力互換を保って多種類・窓/キャッシュ境界の5,000行も性能条件を満たすよう改善し、再現入力を回帰テストへ追加する。保証を変える必要がある場合は利用者による仕様変更として扱い、実装者の解釈だけで線形計算量に置き換えない。"
    reproduction: "コンテナ内でp=$(mktemp -d)を用意しTMPDIRとRELAY_GATE_CONFIG_DIRをpにする。runnerは#!/usr/bin/env bashとprintfでrunner-if-version=1を返す実行可能ファイル。green-job-map.csvを作る。先頭5行はBLUE_MODE=off、GREEN_MODE=foreground、RAPID_CROSSCHECK_MODE=off、GREEN_IMPL=g、GREEN_RUNNER=<p>/runner。Pythonでcontrols=bytes(x for x in list(range(1,32))+[127] if x not in [9,10,13]); size=1025; pat=(controls*40)[:size-6]; body=b\"\".join(f\"K{i:05}\".encode()+pat+b\"=x\\n\" for i in range(4995))を追記する。LC_ALL=Cでfacade/bin/validate-config.sh --feature-flag <入力> --verboseを実行しtime.monotonicで終了まで測る。出力はPIPEで全件回収する。"
  - id: "F-002"
    viewpoint: "assumption_conformance"
    kind: "spec_absent"
    assumption_id: "A-010"
    severity: "major"
