implementation_summary:
  - file: facade/src/domain/cli_field.sh
    change: "cli_field_escape_text の中身を、窓ごとの「同じ文字の一括置き換え」と「断片の連結」に置き換えた(新しい内部関数 cli_field_escape_chunk、可視表記の表 CLI_FIELD_ESCAPE_TABLE / CLI_FIELD_C1_SEQUENCES / CLI_FIELD_C1_ESCAPES)。cli_field_safe_text に結果の控え(CLI_FIELD_SAFE_CACHE)を加えた。関数の名前・引数・結果の変数・出力のバイト列は変えていない。使わなくなった定数 CLI_FIELD_C1_TRAIL_FIRST / CLI_FIELD_C1_TRAIL_LAST を CLI_FIELD_C1_TRAIL_BYTES に置き換えた(参照はこのファイルだけ)"
design_notes:
  - "feature flag の 3 ファイル(domain/feature_flag.sh、repository/feature_flag_config.sh、usecase/validate_feature_flag.sh)は変更していない。原因が共有関数にあり、速報クロスチェック設定と slot ジョブマップにも同じ問題があったため、共有関数だけを直した"
  - "結果の控えは、usecase が info 行を作ったあとに domain の検証をサブシェルで呼ぶ流れでも効く(サブシェルは親の控えを引き継ぐ)"
  - "断片への分割は単語分割で行う。IFS とパス名展開の設定(set -f)は関数の中だけで変え、関数の外へ漏らさない(単体テストで固定)"
