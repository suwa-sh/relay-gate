findings_addressed:
  - id: F-001
    severity: blocker
    status: fixed
    cause: "制御文字の可視表記を作る共有関数 cli_field_escape_text(facade/src/domain/cli_field.sh)が、制御文字 1 個ごとに未処理の残りを切り詰め直す処理(1 個につきシェルの処理を 10 回前後)を繰り返していた。可視表記の関数だけを 1 万回(ESC 128 個のキー)呼ぶ実測で macOS 29.9 秒、Linux 20.6 秒かかり、コマンド全体の所要時間(macOS 28.1 秒、Linux 23.1 秒)のほぼすべてを占めた。制御文字 1 個あたり約 16〜23 マイクロ秒。行の読み取り・重複検査・出力の組み立ては合計 1 秒未満で原因ではなかった。--verbose の info 行と未知キーの warn 行で同じキーを 2 回置き換えていたことが、時間を 2 倍にしていた"
    fix: "共有関数の中身だけを直した(呼び出し側の feature flag の 3 ファイルと、他の検証種別のソースは変更なし)。(1) 同じ制御文字が窓に 4 個以上あれば 1 回の処理で一括して置き換える。(2) それ以外は、窓を制御文字で区切った断片と表引きの結果を順に連結する(1 個につき連結 1 回)。(3) C1 制御文字は 32 種類を順に一括で置き換える。(4) 同じ値の可視表記の結果を控えて再利用する(1,024 バイト以下)。処理時間は行数とバイト数に比例する"
    output_unchanged_evidence:
      - "修正前の関数と修正後の関数に同じ乱数入力(制御文字・C1 の先頭と後続・引用符・バックスラッシュ・& ・全バイト値、長さ 0〜500 バイト、窓 1 / 2 / 3 / 5 / 16 / 64 / 1024 バイト、前にバックスラッシュを付ける文字 19 通り)を与え、結果のバイト列を比較: macOS(bash 5.3.15、ロケール未設定と en_US.UTF-8)と Linux(bash 5.2.21、C と C.UTF-8)で各 40,000 回、不一致 0 件"
      - "F-001 の再現入力(ESC 128 個のキー 5,000 行、--verbose)の stdout と stderr を修正前後で cmp: macOS、Linux とも一致"
      - "他の検証種別を含む 7 通りの 5,000 行入力(feature flag、速報クロスチェック設定、slot ジョブマップ)の stdout と stderr を修正前後で cmp: Linux で全件一致"
      - "約 100 万バイトの値(全種類の制御文字と引用符を混ぜたもの)の結果の cksum が修正前後で同じ(4021959149、5,075,000 バイト)"
  - id: F-002
    severity: major
    status: no_behavior_change
    note: "前提 A-010 の照合記録。挙動は変えていない(S9 の確認対象のまま)"
  - id: "F-003〜F-013"
    severity: minor
    status: no_behavior_change
