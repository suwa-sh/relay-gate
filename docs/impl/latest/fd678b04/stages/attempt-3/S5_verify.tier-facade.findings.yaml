findings:
  - id: "F-001"
    viewpoint: "performance"
    severity: "blocker"
    target: "facade/src/usecase/validate_feature_flag.sh:164"
    claim: "有効な5,000行の設定でも、制御文字を多数含む未知キーを--verboseで報告すると10秒以内の性能条件を満たさない。"
    evidence: "ユーザー指定の5,000行・内容によらず10秒以内、およびCLI契約config_input_rules.rulesの行長上限なしとconventions.output_format.control_charsに照合。Ubuntu24 ARM64 / bash5.2.21 / LC_ALL=C、ネットワークなし・非root・リポジトリread-onlyで実測23.496秒。正常なgreen_only設定5行と、K0〜K4994の各キーにESCを128個付けた未知キー4,995行、合計5,000行・678,316バイト。即応runner、存在するgreen-job-map.csvを用意。exit=0、stdout=15行、stderr=9,995行。64個ESCの5,000行入力でも11.741秒。usecase:166とdomain/feature_flag.sh:211で同じキーを別々に可視化し、cli_field_escape_textが制御文字ごとにシェル処理を反復する。既存性能テストは短い通常キーと重複キーのみでこの条件を検出しない。"
    suggested_fix: "可視化結果の再利用と制御文字処理の効率化を行い、制御文字が多いキーを含む5,000行を性能回帰テストへ加える。受理可能なキーを新しい制約で拒否して回避しない。"
    reproduction: "bashで一時ディレクトリをmktemp -dにより作り、RELAY_GATE_CONFIG_DIRとTMPDIRをそこへ設定する。green-job-map.csvを作り、GREEN_RUNNERに--helpでrunner-if-version=1を即座に出す実行可能スクリプトを用意する。env先頭5行をBLUE_MODE=off / GREEN_MODE=foreground / RAPID_CROSSCHECK_MODE=off / GREEN_IMPL=g / GREEN_RUNNER=<runner絶対パス>とする。続く4,995行はPythonで b''.join(f'K{i}'.encode()+b'\\x1b'*128+b'=x\\n' for i in range(4995)) として生成する。LC_ALL=Cで time facade/bin/validate-config.sh --feature-flag <env絶対パス> --verbose を実行しstdout/stderrを一時ファイルへ向ける。Linuxの実測23.496秒。"
