  - "feature flag の 3 ファイルは、依存する共有関数のファイル(domain/cli_field.sh、domain/job_map.sh、repository/job_map_repo.sh、usecase/validate_job_map.sh)が未 source のときだけ自分で source する。S2 の単体テストが source するファイルの組(domain / repository / usecase を個別に source)を変えずに共有関数を再利用するため。共有関数の中身と、他 UC のソース・テスト・feature は変更していない"
