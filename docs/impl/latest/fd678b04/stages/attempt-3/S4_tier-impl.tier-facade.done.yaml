implementation_summary:
  - file: facade/src/repository/feature_flag_config.sh
    change: "入力を一時ファイルへ複製してバイト点検(NUL / UTF-8 / BOM / CR)してから行を読む形に変更(複製・バイト点検は slot ジョブマップと同じ関数を再利用)。invalid line と同じキーの重複を記録し、どちらかがあれば 9 キーの値を使わない。空白は半角空白とタブだけ。行ごとのサブシェルと重複判定の総当たりをやめ、行数に比例する処理にした"
  - file: facade/src/usecase/validate_feature_flag.sh
    change: "検査の段を (i) バイト・改行 → (ii) invalid line・duplicate key → (iii) キーごとの検査に分けた。(iii) の stderr は溜めてから info 全件 → 未知キーの warn 全件 → error(と hint)→ runner 未応答の warn の順に出す。入力の複製の失敗・補助コマンドの失敗・runner 問い合わせの準備失敗は、その error 行(+ hint)だけを出して終了コード 6"
  - file: facade/src/domain/feature_flag.sh
    change: "未知キーの warn 行を error 行より先に出す。key= / value= / path: / path= / map= に出す任意入力を制御文字の可視表記にする。error 行どうしの順と、列挙外の mode の扱いは変えていない"
