    detail: "一時複製のみで5変異。mode errorのBLUE/GREEN順入替、列挙外/空modeのactive判定除外、速報worker検査除去、未知キー値の取り込み、FINAL値のexport。追加bats6件がそれぞれ1/2/2/1/1件失敗し全変異を検出。tier BDDはそれぞれ1/6/4/1/0シナリオ失敗。最後はbatsで補完し、テスト空振りではない。"
