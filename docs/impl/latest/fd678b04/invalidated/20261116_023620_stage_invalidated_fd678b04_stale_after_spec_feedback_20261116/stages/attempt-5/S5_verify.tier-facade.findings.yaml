summary:
  blocker: 0
  major: 1
  minor: 27
observations:
  - check: "environment"
    detail: "macOS Bash 5.3.15、Linux Ubuntu24 aarch64 Bash 5.2.21/C.utf8。loopback bind、initdb、pg_ctl start/stop成功。一時PGのみ使用。Linux重点55 tests pass。Linuxイメージにnode/shfmtはなくLinux全4ゲートは未実施。"
  - check: "execution_location"
    detail: "原本はformat/lintのcheck-onlyのみ。bats/BDD/独自入力/変異はmktemp -dで作った/tmp/relay-verify.ruZi8W配下の複製で実行。node_modulesは既存依存へのsymlink。元リポの実装に変更なし。"
  - check: "independent_matrix"
    detail: "98パス組合せ、PWD4ケース、mode6^3=216ケース、未知値の子環境1ケース、大規模入力1ケース、計320/320。途中の1回にsnapshot失敗があり、全ゲート後の再実行は320/320成功。macOS /tmpの物理パス差は検証側PWD指定を修正し誤検出を除去。"
  - check: "mutation"
    detail: "baseをPWDへ変更: bats7件失敗・tier BDD6件失敗。解決呼出をusecase/domain両方から除去: bats8件失敗。mode順逆転: bats1件失敗。実体検査除去: bats4件失敗。usecase側だけの解決呼出除去はdomainの同じ処理が補う等価変異なので欠陥検出漏れとしない。"
  - check: "scope"
    detail: "--final-crosscheck/--housekeepとfacade.sh等の実行時実装は他UC所有。契約が全読み手に及ぶことだけ確認。性能テストの存在・既知の性能目標との差をblocker/majorにしていない。"
