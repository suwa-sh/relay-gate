    assumption: "domain の関数を、設定ファイルのパス(FEATURE_FLAG_PATH)が空・未設定のまま単体で呼んだとき(usecase を通さない呼び方。CLI からは通らない)は、空のパスを相対パスとして扱い、作業ディレクトリを基準のディレクトリにする(エラーにしない)"
    target: "facade/src/domain/feature_flag.sh:333"
