    evidence: "env_filesは「値をプロセスの変数・環境変数へ取り込まない」と規定する。feature_flag_config.sh:155-196ではnormalizedとFEATURE_FLAG_CONFIG_SPLIT_LINESに未知値を一時保持するが、9キーだけをprintf -vで設定し、読み取り後は配列を空にする。独自入力PATH/IFS/BASH_ENV/LD_PRELOAD/PWD/UNKNOWN/FINAL_XのINJECTED_VALUEはrunner環境に存在せず、コマンド置換・バッククォートも実行されない。設定値としての取り込みと解析用バッファの区別は契約に明記がなく、同名変数・子プロセスへの流入という仕様違反は立証されていない。securityのspec_absentとしてmajor。"
  - id: "A-041"
    tier: "tier-facade"
    assumption: "4 キーの値を解決後のパスへ置き換えるのは、検査するキーだけとする(mode が off と完全一致する slot の <SLOT>_RUNNER と、RAPID_CROSSCHECK_MODE=off のときの RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER は解決せず、設定に書いた値のまま持つ)。mode が列挙外・欠落・空のキーは off でないとして解決する"
    target: "facade/src/domain/feature_flag.sh:337"
    category: "input_validation"
    verified_category: "data_format"
    verdict: "spec_absent"
    finding_id: "F-021"
    evidence: "runner_path_resolution.displayはoffを-とし、usageは検査範囲を変更しない。検査しない値の内部表現は指定しない。domainとusecaseテストでoffの値を検査・起動しないことを確認。"
  - id: "A-042"
    tier: "tier-facade"
    assumption: "設定ファイルのパスが相対パスのときの絶対化に使う作業ディレクトリは、bash が起動時に決めたシェル変数 PWD の値をそのまま使う(pwd や realpath などの外部コマンドで求め直さない)。起動元から受け継いだ環境変数 PWD が実際の作業ディレクトリを指していれば、その字面(シンボリックリンクを含む論理パス)になる。環境変数 PWD が無い、または実際の作業ディレクトリと食い違うときは、bash が求め直した物理パスになる"
    target: "facade/src/domain/feature_flag.sh:297"
    category: "data_format"
    verified_category: "data_format"
    verdict: "consistent"
    finding_id: "F-022"
    evidence: "runner_path_resolution.base_dir.2は「シェルの$PWDの論理パス」と明記する。親環境にPWDがない/食い違うときbashが設定した値もシェルのPWDであり別規則を補っていない。独自4ケースでルート・未設定・不一致・symlink論理パスを確認。"
  - id: "A-043"
    tier: "tier-facade"
    assumption: "解決後のパスは、4 キーと同じ名前のシェル変数(BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER)を上書きして持ち、設定に書いた元の値は残さない。読み込み(repository)は設定に書いた値のまま載せ、置き換えは domain の関数 feature_flag_resolve_runner_paths が行う。usecase が表示用の値を控える前に 1 回呼び、検証表の関数(validate_feature_flag_errors)も検査の前に自分で呼ぶ(解決後のパスは / で始まるため、2 回呼んでも結果は変わらない)"
    target: "facade/src/domain/feature_flag.sh:341"
    category: "data_format"
    verified_category: "data_format"
    verdict: "spec_absent"
    finding_id: "F-023"
    evidence: "usage/displayは解決後の値を使うことだけを定める。変数の保存場所と二重呼出は内部判断。usecase側の呼出だけの除去はdomain側で補完される等価変異、両方の除去は追加テスト8件が検出。"
  - id: "A-044"
