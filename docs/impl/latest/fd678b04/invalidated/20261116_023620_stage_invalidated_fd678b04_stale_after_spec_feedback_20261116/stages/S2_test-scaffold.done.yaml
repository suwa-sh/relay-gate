  - "bats の全件と UC BDD を同時に走らせたとき、この UC と関係の無い既存 Scenario が 1 回だけ error: config snapshot failed(終了コード 6)で落ちた。単独で走らせ直すと通る。段は 1 つずつ実行すること。上の test_runs はすべて単独実行の結果"
  - "facade/test/usecase/validate_feature_flag_error_order.bats の先頭コメントにある『現行実装で green になる』は 2026-11-15 の前回追加分の説明。今回更新した 2 件は、その下に足したコメントのとおり S4 までは red"
