    evidence: "docs/specs/latest/適用構成業務/適用構成定義フロー/feature flag を設定する/tier-facade.md#設定契約は KEY=value、コメント、空行、引用符除去を定義するが、キー・値の前後空白の正規化は定義しない。repository:55-61 は trim を適用する。"
