findings:
  - id: "F-001"
    viewpoint: "operability"
    severity: "major"
    target: "facade/src/gateway/runner_probe.sh:54"
    claim: "probe用一時ファイルの作成失敗が正常なrunnerの未応答に置き換わり、検証成功として報告される。設定の問題と検証器側の障害を診断で区別できない。"
    evidence: "意図的障害注入: OS一時ディレクトリ内に有効なgreen_only設定、読めるgreen-job-map.csv、helpでrunner-if-version=1を出して終了0の実行可能runnerを作り、TMPDIRだけを存在しない子ディレクトリにしてbin/validate-config.sh --feature-flag <設定>を実行した。終了0、green_runner_if_version=-、stderrはmktemp: mkstemp failed ... No such file or directoryとwarn: runner does not respond to --help。TMPDIRが正常なら同じrunnerは版1を返す。54行目はmktemp失敗を検査せず、usecase:23-27が全probe失敗を同じwarnへ変換する。docs/dev-rules/coding-rules.mdの利用者が直せるエラー、およびverify-viewpoints.mdの原因特定可能性に照らす運用欠陥。基準環境の4ゲートは成功しており、ゲートの環境失敗とは分離した故障注入である。"
    suggested_fix: "一時ファイル作成・読取の失敗をrunner未応答から区別し、検証器側の原因と一時ディレクトリを診断に含める。内部障害の終了コードはCLI共通契約と整合させる。"
