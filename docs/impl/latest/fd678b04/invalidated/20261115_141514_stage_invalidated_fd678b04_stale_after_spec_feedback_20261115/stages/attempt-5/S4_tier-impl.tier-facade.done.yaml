implementation_summary:
- file: facade/src/domain/cli_field.sh
  change: 'まとめて置き換える関数を足した: cli_field_escape_batch(sed 1 回、または sed 2 回と tr 1 回。失敗したコマンド名を CLI_FIELD_BATCH_FAILED_COMMANDS に載せる)、cli_field_safe_text_list(行数に比例する個数の値を配列で受けて配列で返す)、cli_field_safe_text_prepare(大きな値をまとめて置き換えて控える)、cli_field_print_safe_text(控えから直接出す)。値ごとの関数 cli_field_safe_text / cli_field_escape_text の置き換えの方法と出力は attempt 4 のまま(外部コマンドを起動しない)。控えに合計 64 MiB の上限を付けた。cli_field_line / cli_path_field_line / cli_field_display_value は、値を変数へ写さずに出す形にした(出力は同じ)'
- file: facade/src/repository/feature_flag_config.sh
  change: 行の構造の取り出し(空行・コメント行・形式違反の行・キーと値、前後の空白の除去)を sed 1 回にし、bash は結果を読むだけにした。sed の失敗・想定外の出力は補助コマンドの失敗(commands=sed)。引用符を外す処理は先頭と末尾の 1 文字だけを見る形にした
- file: facade/src/domain/feature_flag.sh
  change: '検証表を 3 つの関数に分けた: feature_flag_classify_keys(キーの分類)、feature_flag_report_unknown_keys(未知キーの warn 行)、validate_feature_flag_errors(error 行)。validate_feature_flag は 3 つを順に呼ぶ(出す行と順は同じ)。報告行の出し先を配列にもできるようにし(feature_flag_emit)、大きな値を埋め込む行は出すときに値の表示を付ける(feature_flag_emit_value_line / feature_flag_flush_report_lines)。運用モード名をサブシェルなしで返す関数を足した。数 MB のキーと値を比べる・写す回数を減らした'
- file: facade/src/usecase/validate_feature_flag.sh
  change: キー名と表示しうる値の可視表記を、出力の前にまとめて作る。外部コマンドの失敗は error 行 1 つだけで終了コード 6。info 行と未知キーの warn 行は溜めずに最後に書式で出す。検証表・対応ジョブマップ・runner の問い合わせ・stdout の組み立てでサブシェルを使わない(runner --help の起動だけはサブシェルのまま)
design_notes:
- 他 UC のソース(domain/job_map.sh、domain/launch_command.sh、repository/job_map_repo.sh、repository/rapid_crosscheck_env.sh、usecase/validate_job_map.sh、usecase/validate_rapid_crosscheck.sh、presentation/validate-config.sh、gateway/runner_probe.sh)は変更していない
- 5,000 行または 8 MB を超えるファイルを拒否・警告する処理は入れていない(従来どおり受け付けて処理する)
- 通常の大きさの設定(キー名と値の合計が 4,096 バイト未満)では外部コマンドを起動しない。可視表記を作る sed / tr を失敗するものに差し替えても、通常の設定の検証結果は変わらない(テストで固定)
- IFS とパス名展開の設定(set -f)は関数の中だけで変え、関数の外へ漏らさない(単体テストで固定)
