findings_addressed:
- id: F-001
  severity: blocker
  status: fixed
  cause: 原因は 3 つあった。(1) 可視表記を値ごとに bash で作っていた。制御文字の種類が多い値では 1 バイトあたり約 2.6 マイクロ秒かかり、約 5 MB のキーで 14 秒を超えた。1,024 バイトを超えるキーは結果を控えないため、info 行と warn 行で置き換えを 2 回行い 25 秒になった。(2) 行の読み取り(最初の = での分割・前後の空白の除去)を bash のパターン照合で行っていた。1.6 KB のキー 5,000 行で 2.4 秒かかり、1 行が数 MB のときは行の長さの 2 乗に比例して 60 秒でも終わらなかった。(3) 可視表記は元の最大 6 倍(8 MB の入力で 48 MB)になり、その行を配列に溜めて写し直す・サブシェルで受けて行に分け直すたびに 0.5〜1.5 秒かかっていた
  fix: (1) キー名と表示しうる値の可視表記を、出力の前にまとめて作る(共有ファイル cli_field.sh に足した cli_field_safe_text_list / cli_field_safe_text_prepare。値の個数にも制御文字の種類の数にもよらず sed 1 回。値に 0xC2 があるときは sed 2 回と tr 1 回)。(2) feature flag env の行の構造の取り出しを sed 1 回にした(行の長さに比例する時間)。(3) info 行と未知キーの warn 行を配列に溜めず、検査をすべて終えた後に書式で直接出す。大きな値を埋め込む error 行は、出すときに可視表記を直接出す。検証表・対応ジョブマップ・runner の問い合わせの結果をサブシェルで受けない。出力のバイト列と stdout / stderr の行の順は変えていない
- id: F-014
  severity: blocker
  status: fixed
  note: 前提 A-030 を書き換えた。「行数とバイト数に比例すればよい」という読み替えを取り下げ、利用者決定の性能目標(5,000 行以内かつ 8 MB 以内を内容によらず 10 秒以内)を満たす実装と回帰テストにした
