- macOS では、1 行が数 MiB の値を error 行に出す入力が 7〜8.5 秒かかり、目安の 7 秒に余裕が無い(10 秒以内。Linux は 5 秒以下)。5,000 行の入力は macOS でも 5.6 秒以下
