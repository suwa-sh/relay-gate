approach:
  chosen: まとめて変換する(利用者決定の第一候補のとおり)
  summary:
  - '可視表記: 1 行 1 値にして sed へ渡す。1 バイトの制御文字は、前に \u000 / \u001 を挿入してから y コマンドで元の 1 バイトを 16 進 1 桁へ写す(置き換え 4 回と y 1 回。種類の数によらない)'
  - 'C1 制御文字(値に 0xC2 があるときだけ): C1 制御文字の前後で行を分け、2 段目の sed が C1 制御文字 1 つだけの行にだけ y を適用し、tr で改行を消して値の終わりの目印で値に分ける'
  - sed のスクリプトは基本正規表現と生のバイトだけ(LC_ALL=C)。GNU sed 4.9 と BSD sed(macOS)で同じ出力になることを確認した
  - 外部コマンドを使うのは、値の合計が 4,096 バイト以上のときだけ(通常の大きさの設定では起動しない)
  - '外部コマンドの失敗・想定外の出力は、何かを出力する前に検出し、error: internal command failed commands=<sed|tr|sed,tr> path: <path> の 1 行だけを出して終了コード 6(CLI 契約 config_input_rules.internal_failure)'
  - 値ごとの関数 cli_field_safe_text は外部コマンドを起動しない(attempt 4 と同じ bash の置き換え)。他の検証種別の呼び出し元の挙動は変えていない
  alternatives_measured:
  - 'C1 制御文字 32 種を 1 種類ずつ置き換える方式(sed の置き換え 32 回)と、目印を付けてから下位 4 ビットごとに置き換える方式(20 回): macOS の BSD sed で 8 MB の C1 制御文字だけの入力が 4.3〜5.2 秒(採用した行を分ける方式は 2.1 秒)。Linux はどれも 1.1〜2.4 秒'
  - '値ごとに外部コマンドを起動する方式: 1 回の起動が数ミリ秒のため、5,000 行で 10 秒を超える(不採用)'
  - '可視表記を控え(連想配列)に載せて info 行と warn 行で引く方式: 48 MB の可視表記を載せる・引く・行に組み立てるたびに 0.3〜0.6 秒かかる(キー名は配列で持ち回る形にした。控えは大きな値 9 個までに使う)'
  - '大きな値を埋め込んだ error 行を組み立てて配列に溜める方式: 4 MiB の値 2 つ(stderr 約 100 MB)で macOS 11.3 秒(10 秒を超えた)。出すときに可視表記を直接出す方式にして 7〜8 秒'
