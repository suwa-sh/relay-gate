reproduction:
  F_001: "mktemp -dで専用ディレクトリDを作る。D/slow-runnerに#!/usr/bin/env bashとsleep 30を書いてchmod755。D/blue-job-map.csvとgreen-job-map.csvにヘッダーを置く。envはBLUE_MODE=foreground、GREEN_MODE=background、RAPID_CROSSCHECK_MODE=off、BLUE_IMPL=v1、GREEN_IMPL=v2、BLUE_RUNNER=D/slow-runner、GREEN_RUNNER=D/slow-runnerの7行に、i=0..4989それぞれbytes(\"K\"+str(i))+bytes([1])*1500+b\"=x\\n\"を追加する。LC_ALL=C、TMPDIR=D、RELAY_GATE_CONFIG_DIR=Dでfacade/bin/validate-config.sh --feature-flag D/probe.envを実行し、--verbose有無を測る。stdout/stderrはD内の通常ファイルへリダイレクト。入力生成は計測外。"
  F_002: "専用Dのenvをb\"BLUE_MODE=\"+bytes([1,194,133])*1398000+b\"\\nGREEN_MODE=\"+bytes([2,194,134])*1398000+b\"\\nRAPID_CROSSCHECK_MODE=off\\n\"で生成する。8,388,049バイト。LC_ALL=C.UTF-8、TMPDIR=D、RELAY_GATE_CONFIG_DIR=DでCLIを実行。--verbose有無、LC_ALL=Cとの比較を行う。入力生成を計測外とし、stdout/stderrは通常ファイルへリダイレクト。"
