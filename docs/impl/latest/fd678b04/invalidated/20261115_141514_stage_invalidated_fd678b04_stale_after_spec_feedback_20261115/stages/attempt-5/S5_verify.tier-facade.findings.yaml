    tier: "tier-facade"
    assumption: "feature flag env の 1 行ごとの処理(コメント行の判定、最初の = での分割、キーと値の前後の半角空白・タブの除去)は、入力の複製に対する sed 1 回で行い、bash は sed の結果(行の種類・キー・値)を読むだけにする。sed の照合はどれも行の長さに比例する時間で終わる形にする(置き換えは行頭に固定した 1 回の照合)。値の先頭末尾の引用符を外す処理は、9 キーの値にだけ bash で行う"
