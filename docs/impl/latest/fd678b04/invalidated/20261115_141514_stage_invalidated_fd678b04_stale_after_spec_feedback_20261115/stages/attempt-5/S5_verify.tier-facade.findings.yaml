    target: "facade/src/usecase/validate_feature_flag.sh:228"
    claim: "5,000行以内かつ8MB以内でも、大きな設定の検証と両slotのrunner未応答が重なるとCLI全体が10秒を超える。"
    evidence: "2026-11-13利用者決定とCLI契約 runner_help_probe.response_time_budget に反する。7,485,000バイトの制御文字を含む未知キー4,990行と有効な7キーを合わせた4,997行、約7.524MB。両runnerは実行可能な sleep 30 のスクリプト。終了0で正規の15行とwarnを返すが、再測定でLinux 11.022/11.120秒、macOS 14.048/14.434秒。順にverboseなし/あり。小入力はLinux 8.637/8.607秒、macOS 9.219/9.229秒。同じ7.5MBをBLUE_IMPLの値にした7行でもLinux 11.636/11.647秒、macOS 15.153/15.195秒。入力生成時間を除きプロセス開始から終了までmonotonicで計測、stdout/stderrは通常ファイルへ出力。既存性能テストはrunner即応条件のためこの組合せを検出しない。"
    suggested_fix: "runner_help_probeの4秒待機・逐次実行を維持した総応答時間で性能予算を検証する。大きな設定と未応答runnerの組合せを回帰入力へ追加し、入力を制限せず10秒以内に収める。"
  - id: "F-002"
    viewpoint: "performance"
    severity: "blocker"
    target: "facade/src/usecase/validate_feature_flag.sh:210"
    claim: "C.UTF-8ロケールでは、runnerを呼ばない3行・8MiB未満の設定でも10秒を超える。"
    evidence: "BLUE_MODEの値をbytes([1,194,133])*1398000、GREEN_MODEをbytes([2,194,134])*1398000、RAPID_CROSSCHECK_MODE=offとする。LF付き3行、8,388,049バイト。modeは列挙外、runner未指定なので問い合わせ待ちはない。終了2。通常ファイルへの出力で再測定するとC.UTF-8のLinux 9.936/10.213秒、macOS 10.426/10.587秒。初回もLinux 10.962/10.078秒、macOS 10.751/10.458秒。順にverboseなし/あり。同じ入力のCロケール再測定はLinux 4.149/4.382秒、macOS 7.868/8.418秒。sed内部のLC_ALL=Cだけでは検証全体の時間を一定にできていない。今回指示は8MiB以内の内容によらない10秒目標を明示している。"
    suggested_fix: "長い文字列を扱うdomain/usecaseの文字列長・比較・出力準備も含めてロケールの影響を調べ、可視表記と出力順を維持して改善する。CとC.UTF-8の双方で異なる長いmode値を同時に検証する回帰試験を追加する。"
