  - id: "F-001"
    viewpoint: "fault_tolerance"
    severity: "blocker"
    target: "facade/src/usecase/runner_resolve.sh:119"
    claim: "exitcode.txtがなくaborted.txtがある中止済みslotで解決に失敗すると、既存の成果物を上書きしてexitcode.txt=2を公開する。中止済みslotはexitcode.txtを書かずWARNを残して6で終了するという契約に違反する。"
    evidence: "docs/specs/latest/_cross-cutting/api/cli-command-contract.yaml:439-440のrunner IF exit_codes/idempotencyが、中止済みslotの終了6・WARN slot already aborted run_id=... role=...・exitcode.txt非作成を明記する。実際の標準runnerをリポジトリ外の一時ディレクトリで実行した。ヘッダーのみの有効なgreen用ジョブマップに対し、run_id=20260830T113000-JOB001-3f9a1c2e、job_id=JOB001、role=green、mode=backgroundとし、roleディレクトリへaborted.txtと既存のstarted-at.txt/stdout.log/stderr.logを置き、exitcode.txtは置かなかった。結果はプロセス終了2、exitcode.txtに2を新規作成、stdout.logは空に切り詰め、stderr.logはジョブ未定義エラーへ置換、started-at.txtは現在時刻へ更新、aborted.txtだけ保持。実行ログはジョブ未定義のERRORのみで中止済みWARNはなかった。119行目はexitcode.txtしか確認せず130行目でfailure公開へ進むためである。OSコマンドの差し替えや故障注入は行っていない。解決失敗時に本UCが行う書き込みの問題であり、後続UCの未実装を指摘したものではない。"
    suggested_fix: "既存exitcode.txtの確認に続いてaborted.txtを確認し、中止済みなら既存成果物を保持して契約どおりWARNと終了6を返す。引数不正から同じ失敗公開関数へ入る経路にも適用する。"
