observations:
  - "自己点検 1(runner IF exit_codes の 2): 引数不足・job_id 未定義・マップなし・バイト点検・ヘッダー不一致・クォート不正・host / user の片方だけ空・work_dir / script が空・fixed_params 不正・上限不正は、どれも exitcode.txt=2 と同じ終了コードで一致。BLUE_IMPL / GREEN_IMPL の未設定、速報クロスチェックの設定、復元起動の条件は後続の機能の担当で対象外"
  - "自己点検 2(exit_codes の 6): 補助コマンドの失敗と入力の複製の失敗は exitcode.txt=6 で一致。成果物を揃えられないときは ERROR + 6(exitcode.txt 無し)で一致。中止済みの slot は食い違い(F-001)で、今回直した"
  - "自己点検 3(idempotency): 公開済みで解決に失敗した回は一致。公開済み・中止済みで解決に成功した回は食い違いで、今回直した。started-at.txt だけがある回は上書きで一致"
  - "自己点検 4(stdout / stderr の規則): プロセスの stdout / stderr に出さないこと、exitcode.txt 公開後に stderr.log を変えないことは一致(公開済み・中止済みの回は 1 ファイルも書かない)"
  - "自己点検 5(config_input_rules): バイト点検の全件と順と hint、止め方、空白だけの行、空のファイル、データ行 0 件、列名の重複、最終行の改行なし、1 時点の内容での判定、内部障害の 2 種の文言は一致(検証コマンドと同じ関数を使用)"
  - "自己点検 6(config_files の slot ジョブマップ): 列の対応付け、未知列の WARN、host / user の規則、work_dir / script の形式を検査しないこと、credential_ref の警告と値を出さない規則、map_version、制御文字の可視表記は一致"
  - "自己点検 7(conventions): 実行ログの行形式と run_id 未確定の `-` は一致。RELAY_GATE_NOW の WARN は引数の違反の経路で欠けていたため今回直した。実行ログに書けないときの扱いは前提 A-016 のまま"
  - "自己点検 8(tier-facade.md): エラーメッセージ表の 10 種、終了コード表、失敗時の 4 ファイル、ティア完了条件 13 シナリオは一致"
  - "中止済みの slot・公開済みの run で引数の違反になった回に RELAY_GATE_NOW が設定されていると、成果物を書かないのに WARN test clock injected が 1 行残る(契約は『設定されていれば起動時に残す』なので食い違いではない)"
