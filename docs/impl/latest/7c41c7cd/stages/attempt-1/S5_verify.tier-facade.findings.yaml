    claim: "既存exitcode.txtが0の二重起動で解決に失敗すると、標準runnerの終了値だけが6になり、既存成果物の0と一致しない。"
    evidence: "CLI契約 commands[$BLUE_RUNNER / $GREEN_RUNNER].idempotency は既存exitcode.txtの値で終了すること、対象tierのRunner Result完備条件はプロセス終了値との一致を要求する。実体プローブで同一run_id/greenにstdout.log・stderr.log・exitcode.txt=0を置き、ヘッダーだけのマップへJOB001を問い合わせた。成果物は保存されたまま、ログはnot foundのERRORとrunner result already publishedのWARN、プロセス終了は6だった。runner_resolve_fail:97-100が既存0を返し、standard_runner_main:175-181が新規の解決成功と区別せず暫定6へ進む。新規解決成功後の後続UC未実装を指摘しているのではなく、既存結果を返す解決失敗経路の不一致である。"
    suggested_fix: "既存結果を返す経路と新規にExecutionTargetを解決した経路を区別し、既存exitcode.txtの値を標準runnerの出口まで保持する。"
