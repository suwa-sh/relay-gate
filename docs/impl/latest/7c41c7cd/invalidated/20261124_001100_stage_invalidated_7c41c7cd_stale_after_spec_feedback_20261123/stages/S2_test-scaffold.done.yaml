    kind: cross_uc_scenarios
    summary: "UC BDD の正常系 10 Scenario は、解決結果のうち実行ログの行(host と map_version)に出ない項目(user / script / work_dir / hang_detect_limit_minutes / credential_ref / fixed_params / 実装へ渡す引数)を Then に含む。runner を 1 プロセスとして起動しただけでは、execution-spec.json(次の機能)か実装の実行(その次の機能)ができるまで外から見えない。異常系 6 Scenario と tier BDD 13 Scenario はこの機能だけで判定できる。共通ライブラリの関数の呼び方と、解決に成功した後(後続の段が無い間)の runner の終わり方は仕様に無い。前の機能から引き継いだ 3 点(保留中の Then、標準の runner の既存の単体テスト、記録用の包み)の事実と対応先も記録した"
    blocker: false
decisions_needed:
  - id: how-to-observe-resolution-result
    question: "解決結果のうち実行ログに出ない項目(user / script / work_dir / 引数列など)を、この機能のテストで何を使って確かめるか"
    recommended: "step と単体テストが共通ライブラリ(lib/runner-resolve.sh)を source して関数を直接呼ぶ。関数の名前と結果の受け取り方は実装者が決め、補った前提として S4 の記録に書く。あわせて S8 で、共通ライブラリの呼び方を仕様に書く要望を出す"
    alternatives:
      - "実行ログの行(host と map_version)だけで判定し、残りの項目は execution-spec.json ができる次の機能まで保留にする"
    detail: docs/impl/latest/7c41c7cd/issues/20261123_142047_cross-uc-scenarios.md
observations:
  - "単体テストは入口 facade/runners/standard-runner.sh から見える結果だけを判定し、共通ライブラリの関数の名前と分け方は固定していない(仕様に無いため)。層ごとの単体テストは S4 の TDD で足す"
  - "単体テストは、runner を直接起動する前に role ディレクトリ(facade/<run_id>/<role>/)を用意する。作るのは facade で、runner を直接起動するときに誰が作るかは仕様に無い。どちらの実装でも通る形にした"
  - "解決に成功したときの runner の終了コードは判定していない(後続の段が無い間の終わり方が仕様に無い)。実行ログの行だけを見る"
  - "前の機能の UC BDD『値が空のジョブマップの場所のキー』の保留は、標準の runner が終了コード 6 で何も書かない間だけ働く。この機能が解決の段を作ると保留が外れ、execution-spec.json を見る Then は次の機能まで満たせない。S6 で保留の条件を行ごとに分ける必要がある(issue の 6)"
  - "既存の facade/test/presentation/standard_runner.bats は RELAY_GATE_LOG_DIR を渡さずに runner を起動する。解決の段ができると実行ログの既定の出力先がリポジトリの中になりうるため、S4 で仮の応答とあわせて見直す(issue の 6)"
  - "時間を確かめるテスト、MB 級の入力を作るテスト、作為的な巨大入力のテストは書いていない"
  - "bats と cucumber は 1 つずつ直列に実行した。tier BDD・UC BDD・ATDD・bats は macOS の手元で実行した"
