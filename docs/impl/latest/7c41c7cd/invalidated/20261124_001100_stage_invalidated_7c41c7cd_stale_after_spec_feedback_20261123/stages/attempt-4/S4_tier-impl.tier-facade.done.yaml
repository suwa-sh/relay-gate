  cause: "mktemp のテンプレートが relay-gate-XXXXXX.part で、X の並びが末尾に無い。macOS(BSD)の mktemp は末尾以外の X を置き換えず、テンプレートのままの名前で作る(既にあれば失敗する)。同時に動く 2 つのプロセスが同じ作業名を取り合い、後から来たほうの mktemp が失敗していた。作った後に別の名前へ移す後処理にも、移す前の名前を共有する間があった"
  reproduced: "直す前に、追加した単体テスト(2 つのプロセスが同じ TMPDIR で同時に複製を持つ)で片方の複製が失敗することを macOS で確認した"
  resolution: fixed
  spec_basis: "契約 config_input_rules.snapshot.validate_config(名前は relay-gate- で始まる / 作業名は最終名 + .part / 作業名を mktemp で作る / 最終名は rename まで存在させない / 権限 0600)を自分で読んで確かめ、どれも変えていない"
  change: "mktemp に渡すテンプレートを relay-gate-<呼んだプロセスの番号>-XXXXXX.part にし、mktemp が返した名前を移し替えずにそのまま使う。プロセスの番号は BASHPID をコマンド置換の外で取る。X を置き換えない mktemp でも名前がプロセスごとに分かれ、名前の確保は mktemp の 1 回の操作(既にある名前は作らない)のまま。作ってから別の名前へ移す後処理は削除した"
  why_this_way: "既存のテストと契約が『作業名を mktemp で作ること』『mktemp の失敗は入力の複製の失敗』を前提にしているため、mktemp の呼び出しは残した。OS ごとの分岐を作らず、macOS と Linux が同じ 1 本の経路を通る。書き込み途中の複製を読ませない規約(作業名へ書いてから最終名へ rename)と、接頭辞 relay-gate- と作業名 .part による後片付けは変えていない"
  tests: "job_map_repo.bats 2 件(別プロセスから呼ぶと名前に呼んだプロセスの番号が入る / 2 つのプロセスが同じ TMPDIR で同時に複製を持つと、別々の最終名でそれぞれの内容を持ち、作業名を残さない)"
