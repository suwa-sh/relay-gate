# 並び順 = 実施順(依存関係を考慮。dist-impl-run はこの順で UC に着手する):
#   ① 並行稼働実行(execution-spec / Runner Result を生む中核)
#   ② 速報クロスチェック(① の runner 完了通知に依存)
#   ③ 確報クロスチェック(② で確立した queue/lease パターンを再利用)
#   ④ ハング監視(① の成果物と ②③ の依頼状態を走査)
#   ⑤ 中止系(① の background 実行・②③ の比較依頼が前提。依頼 → ABORTED 遷移の順)
#   ⑥ background側リラン(⑤ の ABORTED と ① の execution-spec.json に依存)
