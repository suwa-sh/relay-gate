# uc-map(正本)。use_cases[] の並び順 = 実施順(引数なし dist-impl-run の着手順)。
# 並び順の根拠: docs/specs/latest/_cross-cutting/uc-dependencies.md「実装順序の推奨(トポロジカル順)」段 0〜12 を平坦化した。
#   段 0: 設定契約(feature flag / ジョブマップ / クロスチェック定義。他 UC に依存しない)
#   段 1〜4: runner IF 割当 → facade 起動 → ジョブマップ解決 → execution-spec 確定 → 実装実行と Runner Result(生産者の中核)
#   段 5〜6: foreground 中継・完了通知・確報登録 → 応答契約確認・速報依頼作成・確報 claim
#   段 7〜8: 速報 claim・全量比較 → ジョブ単位比較・確報中継
#   段 9: 結果参照 3 件(速報 / 確報 / 停止確認)
#   段 10: hang-detector 3 段・ABORTED 遷移・リラン事前検証(監視・中止は実行成果物を読む消費者)
#   段 11: メール受信・上限調整・復元起動・依頼再作成・運用モード実行(復旧系の消費者)
#   段 12: 系譜追跡(リランが作る parent_run_id を読む最終消費者)
# 同一段の UC は依存が無いため BUC のフロー順を保った。uc_id は state-schema.md の生成式(NFC + canonical JSON + sha256 先頭 8 桁)。
# has_design_system: false かつ frontend tier 無しのため、ui_screens / ui_screen_resolution はどの UC にも置かない(dist-impl-run S1 規則)。
# UC→ATDD マッピング(Scenario 単位)は events/20260917_004437_config_confirmed_atdd_mapping_all_ucs の config_confirmed で全 UC 一括確定(atdd_confirmed: true)。
