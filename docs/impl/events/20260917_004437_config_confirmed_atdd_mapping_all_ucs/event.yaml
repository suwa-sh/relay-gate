    chosen: also
    chosen_label: also にとどめ、振る舞い所有 UC(中継 UC)を primary にする
  - id: D
    question: 速報・確報に共通する依頼ライフサイクルの基準(SPEC-007-01 / 007-02)を、実装順で先に来る確報 worker(claim / 全量比較)で検証するか、速報 worker(claim / ジョブ単位比較)で検証するか
    chosen: final
    chosen_label: 確報 worker で検証する(実装順で先)
  - id: E
    question: 振る舞いを持たない、または実行時に観測できない基準(設定所有者の契約記載照合 / worker 実体の flag 解決 / 適用構成文書への調整記録 / 全スクリプト不変の統合確認)を、matrix の配置どおり UC に紐づけて low confidence で残すか、SPEC-011-05 と同じく primary null(モデル・契約整合)にするか
    chosen: assign
    chosen_label: matrix の配置どおり UC に紐づける(low / medium)
