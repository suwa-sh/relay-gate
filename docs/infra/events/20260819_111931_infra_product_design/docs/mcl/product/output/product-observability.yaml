schema_version: "1.0"
artifact_type: "observability_spec"
skill_type: "product"
artifact_id: "product-observability-job-relay"
title: "ジョブ実行中継基盤 オブザーバビリティ仕様"
status: "draft"
generated_at: "2026-08-19T11:19:31"
source_refs:
  - "product-workload-model"
decision_refs:
  - "product-decision-audit-persistence"
inputs_ref:
  - "product-workload-model"
  - "product-impl-onprem"

metrics:
  - name: "cpu_utilization"
    description: "各サーバのCPU使用率"
  - name: "memory_utilization"
    description: "各サーバのメモリ使用率"
  - name: "disk_utilization"
    description: "データストア・ログストレージのディスク使用率"
  - name: "network_throughput"
    description: "内部通信のネットワークスループット"
  - name: "facade_response_latency"
    description: "facadeエントリポイントの応答時間（p50/p95/p99）"
  - name: "job_error_rate"
    description: "foreground実行の非0終了コード発生率（退避コード125/124で応答したrelay-gate自身のエラーは除外する）"
  - name: "relaygate_error_exit_count"
    description: "relay-gate自身のエラーで退避終了コードを応答した件数（125=実行結果未確定・取得不能・中止済み、124=バリデーションエラーの内訳別）"
  - name: "queue_pending_count"
    description: "速報/確報比較依頼のREQUESTED/CLAIMED滞留件数（キュー深度相当）"
  - name: "hang_detection_count"
    description: "hang-detectorによる異常検知件数（種別別）"
  - name: "audit_event_write_failure_count"
    description: "slot起動監査イベントの永続化失敗件数（外部作用前・後を区別）"
  - name: "audit_event_retry_backlog"
    description: "監査追記ローカル永続outboxの未解消件数と最古滞留時間"
  - name: "audit_hash_chain_mismatch_count"
    description: "監査イベントのハッシュチェーン定期検証で検出した不一致件数"

sli:
  - id: "sli-availability"
    description: "facadeエントリポイントの可用性（応答成功率）"
    target: "99.9%"
  - id: "sli-latency"
    description: "facade応答のp99レイテンシ"
    target: "1s以内"
  - id: "sli-error_rate"
    description: "foreground実行の異常終了率（業務ジョブの非0終了とrelay-gate退避コードを区別して集計する）"
    target: "低水準を維持（具体的閾値は運用開始後に確定）"
  - id: "sli-batch_throughput"
    description: "日次確報クロスチェックの完了率・所要時間"
    target: "8時間以内に完了"

slo:
  - sli_ref: "sli-availability"
    objective: "99.9%（月次）"
    error_budget_policy: "エラーバジェット消化時は非緊急変更を凍結し原因調査を優先する"
  - sli_ref: "sli-latency"
    objective: "p99 1秒以内（日次）"
    error_budget_policy: "閾値超過が継続する場合はリソース増強（スケールアップ）を検討する"

logs:
  categories:
    - "access"
    - "audit"
    - "diagnostic"
    - "dependency"
  format: "JSON構造化ログ（stdout/stderr出力）"
  required_fields:
    - "run_id"
    - "timestamp"
    - "service"
    - "event_name"
    - "schema_version"
  retention_days: 180
  rotation: "サイズ+時間ベース併用"
  level_policy: "DEBUG/TRACEは本番無効をデフォルトとし、再起動なしで動的に変更可能とする"
  audit_event_policy: "slot起動監査イベントはPostgreSQLの追記専用テーブルに6ヶ月保持し、認証情報・起動引数の実値・stdout/stderr本文を除外する"

tracing:
  enabled: true
  correlation_id: "run_id / parent_run_id"
  notes: "OpenTelemetryのtrace_id/span_id相当の役割をrun_id/parent_run_idが担う。エアギャップのため外部トレーシングSaaSは利用不可。ログ相関ベースの追跡とする"

dashboards:
  - id: "dash-operations"
    description: "facade/worker/データストアのリソース状況・エラー率・キュー滞留を一覧表示する運用ダッシュボード"
  - id: "dash-crosscheck"
    description: "速報/確報クロスチェックの結果・所要時間・異常検知件数を表示するダッシュボード"

alerting:
  rules:
    - id: "alert-health-check"
      condition: "facadeまたはworkerのヘルスチェック失敗"
      severity: "critical"
      escalation: "運用者へ即時通知"
    - id: "alert-error-rate"
      condition: "foreground実行の異常終了率が閾値を超過（業務ジョブ由来の非0終了）"
      severity: "high"
      escalation: "運用者・障害調査担当者へ通知"
    - id: "alert-latency"
      condition: "facade応答p99レイテンシが1秒を継続的に超過"
      severity: "medium"
      escalation: "運用者へ通知"
    - id: "alert-relaygate-error-exit"
      condition: "退避終了コード125/124の応答件数が閾値を超過"
      severity: "high"
      escalation: "relay-gate自身の異常として運用者・障害調査担当者へ通知し、run_id・slotで照合する"
    - id: "alert-hang-detection"
      condition: "hang-detectorが異常検知記録を作成"
      severity: "high"
      escalation: "運用者・移行運用責任者へ通知"
    - id: "alert-audit-write-failure-before-launch"
      condition: "外部slot起動前の監査イベント追記が失敗"
      severity: "critical"
      escalation: "起動を中止し、運用者・障害調査担当者へ即時通知"
    - id: "alert-audit-retry-backlog"
      condition: "外部作用後の監査追記ローカル永続outboxが未解消、または滞留時間が運用閾値を超過"
      severity: "high"
      escalation: "運用者・障害調査担当者へ通知し、run_id・slot・attempt_idで照合"
    - id: "alert-audit-hash-chain-mismatch"
      condition: "監査イベントのハッシュチェーン検証で欠損または不一致を検出"
      severity: "critical"
      escalation: "監査証跡の利用を保留し、運用責任者・障害調査担当者へ即時通知"
