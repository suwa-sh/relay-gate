  - "product-workload-model"

decision:
  context: "全永続化対象エンティティはトランザクション整合性・リース/claim排他制御を要求する一方、実行ログ本体（stdout/stderr等）は大容量テキストであり、RDBに直接格納するかファイルシステムに分離するかの選択が必要。RDB内の状態管理系エンティティの永続化粒度（snapshot-onlyかEvent/Snapshot併用か）はproduct-decision-event-snapshot-persistenceで扱う"
  conflict_type: "granularity"
  options:
    - id: "opt-rdb-only"
      description: "実行ログ本体も含めて全てRDBに格納する"
      pros:
        - "参照経路が単純"
      cons:
        - "大容量テキストのRDB格納はパフォーマンス・バックアップサイズに悪影響"
    - id: "opt-rdb-plus-filesystem"
      description: "状態・メタデータはRDB、ログ本体はファイルシステムに分離しRDBからパス参照する"
      pros:
        - "RDBのトランザクション整合性を状態管理に限定して活用できる"
        - "ログ本体のバックアップ・ローテーションを独立して運用できる"
      cons:
        - "RDBとファイルシステムの整合性（参照切れ）を運用で担保する必要がある"
  chosen_option: "opt-rdb-plus-filesystem"
  rationale: "arch-design.yaml の data_architecture.storage_mapping で、状態管理系エンティティはRDB、ログ本体はファイルシステム参照とする方針が既に示されているため、これに従う。RDB側のevent_snapshot型エンティティ（Runner実行結果等）はsnapshot-onlyではなく、append-only履歴INSERTとsnapshot UPSERTを同一transactionで更新するEvent/Snapshot併用方式とする（product-decision-event-snapshot-persistence、アーキテクチャ設計LR-002準拠）"
  risk_assessment: "ファイルシステムとRDBのバックアップタイミングがずれると参照整合性が一時的に崩れる可能性がある。同一バックアップウィンドウ内での取得を運用手順で担保する"
  affected_elements:
    - "product.persistence"
  review_date: ""
