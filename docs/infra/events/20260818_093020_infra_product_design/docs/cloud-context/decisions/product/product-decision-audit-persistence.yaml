skill_type: "product"
artifact_id: "product-decision-audit-persistence"
title: "slot起動監査をPostgreSQLの追記専用テーブルへ統合"
status: "accepted"
generated_at: "2026-08-18T09:30:20"
source_refs:
  - "arch-design:20260818_090120_arch_audit_contract_feedback (CTP-005, CTR-008)"
  - "docs/cloud-context/sources/onprem/postgresql-high-availability.md"
decision_refs: []
inputs_ref:
  - "product-workload-model"

decision:
  context: "slot起動の操作受付から最終状態までを、既存CLI出力契約を変えず、実行系譜で照会できる改ざん検知可能な監査証跡として永続化する必要がある"
  conflict_type: "capability"
  options:
    - id: "opt-postgresql-append-only"
      description: "既存のPostgreSQLに追記専用監査テーブルとハッシュチェーンを設け、RDB障害時はローカル永続outboxから再試行する"
      pros:
        - "run_id/parent_run_idによる既存の実行系譜照会と同じトランザクション基盤へ統合できる"
        - "一意制約と権限制御で追記・再試行を冪等化できる"
      cons:
        - "監査テーブルの容量管理とハッシュチェーン定期検証を自前運用する必要がある"
    - id: "opt-append-only-file"
      description: "追記専用ファイルへ監査イベントを記録する"
      pros:
        - "RDB障害時にも独立した出力先を持てる"
      cons:
        - "run_id横断照会、同時追記、保持、既存監査ログとの統合が複雑になる"
    - id: "opt-rdb-without-hash-chain"
      description: "PostgreSQLの権限制御だけで追記専用性を担保する"
      pros:
        - "実装と運用が最も単純"
      cons:
        - "管理者権限による欠損・改ざんを事後検知できない"
  chosen_option: "opt-postgresql-append-only"
  rationale: "ユーザーがPostgreSQLと監査ログ追記を指定し、アーキテクチャでRDB append-only監査テーブルとハッシュチェーンが確定している。既存のRDB運用と実行系譜照会へ統合でき、RDBへ書けない外部作用後の結果もローカル永続outboxから回復できる"
  risk_assessment: "PostgreSQL全体の障害時は起動前監査ゲートがslot起動を停止する。起動後の一時障害はローカル永続outboxで回復するが、outbox滞留、ファイル領域枯渇、ハッシュチェーン不一致をcritical/highアラートで監視する必要がある"
  affected_elements:
    - "product.audit_event_persistence"
    - "product.persistence"
    - "product.observability_needs"
  review_date: ""
