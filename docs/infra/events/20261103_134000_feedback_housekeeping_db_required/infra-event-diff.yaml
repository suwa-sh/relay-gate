    outputs_updated:
      - path: "docs/mcl/product/input/product-input.yaml"
        change: "management_db の説明を、管理 DB を使う設置で接続参照名が無い・空ならハウスキープは設定エラーで何も削除しない(増え続ける状態にならない)、接続しないのは管理 DB を一切使わない設置だけで、その設置では新たに行は増えないが off 以外の期間の実行の行が残る、に改めた。config_store のハウスキープ設定の接続参照名を、off 以外または確報クロスチェックを使う設置では必須、省略・空は管理 DB を一切使わない設置だけ、に改めた。product-input.yaml(イベント直下のコピー)も同一内容"
        work_units: ["CR-9d2e6c41-001#1"]
      - path: "docs/mcl/product/output/product-workload-model.yaml"
        change: "management_db の容量の頭打ちの constraint から「接続しない設定の間は行と確報比較依頼が増え続ける」を外し、設定エラーで何も削除しないこと、管理 DB を一切使わない設置では新たに増えないが off 以外の期間の実行の行が残ることに改めた。artifact_store の例外の条件を「管理 DB を一切使わない設置」に、config_store のハウスキープ設定の接続参照名を必須の設置と省略できる設置に分けて書き直した"
        work_units: ["CR-9d2e6c41-001#1"]
      - path: "docs/mcl/product/output/product-mapping-onprem.yaml"
        change: "management_db の notes を、off 以外または確報クロスチェックを使う設置で接続参照名が無い・空なら housekeep は設定エラーで何も削除せず非 0 で終わる、接続しないのは管理 DB を一切使わない設置だけ、に改めた。artifact_store の例外の条件と config_store のハウスキープ設定の接続参照名の説明を同じ条件に揃えた"
        work_units: ["CR-9d2e6c41-001#1"]
      - path: "docs/mcl/product/output/product-impl-onprem.yaml"
        change: "housekeep_delete に、設定の検査を置き場の残りの削除を含むすべての削除より先に行い、必須の設置で接続参照名が無い・空なら置き場の中身も含めて何も削除せず非 0 で終わること、off でも確報クロスチェックを使う設置では確報比較依頼を保持日数で削除することを追加し、接続しない条件を管理 DB を一切使わない設置に絞った。connection_resolution、artifact_store capacity、config_store contents を同じ条件に揃えた。ハウスキープ設定の検証規則を『存在すること。保持日数のキーは省略可(既定 90 日)、off 以外または確報クロスチェックを使う設置では接続参照名が空でない値で設定されていること(省略・空を許すのは管理 DB を一切使わない設置だけ。判定は housekeep.sh が起動時に行う)』に改めた"
        work_units: ["CR-9d2e6c41-001#1"]
      - path: "docs/mcl/product/output/product-observability.yaml"
        change: "alert-housekeep-failure の condition に、管理 DB を使う設置で接続参照名が無い・空の設定エラー(非 0 終了)も失敗通知の対象であることを追記し、warn が対象外になる条件を管理 DB を一切使わない設置に改めた"
        work_units: ["CR-9d2e6c41-001#1"]
      - path: "docs/mcl/product/output/product-cost-hints.yaml"
        change: "storage_tiering の「接続しない設定の間は管理 DB の行と確報比較依頼が削除されない」を、管理 DB を使う設置では接続参照名が必須で削除されないまま増え続ける状態にならないこと、管理 DB を一切使わない設置では off 以外の期間に作られた実行の行と成果物が残る分を別に見込むことに改めた(NFR B.3.3.1 と同じ趣旨)"
        work_units: ["CR-9d2e6c41-001#1"]
      - path: "docs/cloud-context/conformance/product/product-conformance-onprem.yaml"
        change: "設定の要件の notes のハウスキープ設定の接続参照名を、必須の設置(無い・空なら設定エラーで何も削除しない)と省略できる設置(管理 DB を一切使わない設置)に分けて書き直した(判定は不変)"
        work_units: ["CR-9d2e6c41-001#1"]
      - path: "docs/cloud-context/generated-md/product/relay-gate-target-architecture.md"
        change: "housekeep → 管理 DB の辺のラベルを「管理 DB を一切使わない設置だけ接続しない」に改めた"
        work_units: ["CR-9d2e6c41-001#1"]
      - path: "infra/product/onprem/ansible/roles/relay-gate-config/tasks/main.yml"
        change: "ハウスキープ設定の検査のコメントの「off では接続参照名も省略・空にできる」を「管理 DB を一切使わない設置では」に改め、必須の設置での接続参照名の検査は housekeep.sh が起動時に行い、配置時にモードや確報設定を判定しないことを追記した。検査タスク(存在検査)は変えない"
        work_units: ["CR-9d2e6c41-001#1"]
    outputs_verified_unchanged:
      - path: "infra/product/onprem/ansible/roles/relay-gate-config/tasks/main.yml(検査タスク)"
        reason: "ハウスキープ設定の存在検査(空でもよい)は、管理 DB を一切使わない設置で空のファイルが正当になり得るため維持する。モードや確報クロスチェック worker 設定の有無による必須判定を配置時の静的検査に足すと、housekeep.sh の起動時検査と判定の二重管理になるため足さない(前回の判断を維持)"
