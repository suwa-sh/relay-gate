components:
  - id: "impl.compute.execution_hosts"
    name: "実行ホスト群(systemd/cron)"
    canonical_element_id: "product.compute.script_runtime_hosts"
    vendor_service: "Linux VM/物理サーバ + systemd + OpenSSH"
    configuration:
      os: "RHEL 系または Debian 系 LTS(最新の LTS を利用)"
      shell: "bash 5"
      services:
        - name: "relay-gate-rapid-worker.service"
          type: "systemd service(常駐)"
          restart_policy: "Restart=on-failure, RestartSec=5"
          host_group: "job-scheduler実行ホストセグメント"
        - name: "relay-gate-final-crosscheck-worker.service"
          type: "systemd service(常駐)"
          restart_policy: "Restart=on-failure, RestartSec=5"
          host_group: "DBセグメント専用ホスト"
      scheduled_scripts: "hang-detector(5 分ごと)と housekeep(1 日 1 回)はジョブスケジューラ実行ホストセグメントにスクリプトとして配置するだけで、systemd timer / cron には登録しない。起動はジョブスケジューラの定期ジョブ(impl.integration.job_scheduler)で行い、終了結果を障害通知に乗せる"
      ssh:
        auth: "公開鍵認証のみ(パスワード認証無効)"
        known_hosts: "配布物として事前配布(TOFU無効化)"
      scaling: "worker ホスト追加 + 同一 unit ファイル配置(手動水平スケール)"
      timezone: "全ホストで同じローカルタイムゾーンを OS に設定し、systemd unit / cron で TZ を上書きしない(実行ログ・run_id の時刻軸)。時刻同期は組織内 NTP(閉域)に向ける"
    dependencies:
      - "impl.database.management_db"
      - "impl.storage.artifact_store"
      - "impl.storage.config_store"
    iac_module: "infra/product/onprem/ansible/roles/relay-gate-runtime"
    validation_rules:
      - rule: "systemctl is-enabled relay-gate-*-worker.service で enabled であること"
        type: "runtime"
        description: "常駐 worker の自動起動設定を確認する"
      - rule: "systemctl is-active relay-gate-*-worker.service で active(running) であること"
        type: "runtime"
        description: "常駐 worker の稼働状態を確認する"
      - rule: "ssh -o BatchMode=yes による疎通確認(パスワードプロンプトが出ないこと)"
        type: "runtime"
        description: "公開鍵認証のみで完結することを検証する"
      - rule: "timedatectl の Time zone が全ホストで一致し、時刻同期(NTP synchronized)が yes であること"
        type: "runtime"
        description: "ローカルタイムゾーンのログ日時と run_id の時刻軸をホスト間でそろえる(REQ-LOG-003)"
      - rule: "systemctl list-timers と crontab に hang-detector / housekeep の起動登録が無いこと"
        type: "static"
        description: "定期ジョブの二重起動と、終了結果がジョブスケジューラの障害通知に乗らない経路を防ぐ(REQ-SCH-002 / REQ-SCH-003)"

  - id: "impl.database.management_db"
    name: "管理DB(PostgreSQL)"
    canonical_element_id: "product.database.management_db"
    vendor_service: "PostgreSQL 16 セルフホスト(単一インスタンス)"
    configuration:
      schemas: ["rapid(速報)", "final(確報)"]
      roles:
        - name: "app_rw"
          privileges: "rapid/final スキーマへの SELECT/INSERT/UPDATE のみ(DELETE は与えない)"
        - name: "ops_ro"
          privileges: "全スキーマへの SELECT のみ(参照専用)"
        - name: "housekeep_del"
          privileges: "管理 DB の 6 テーブル(parallel_runs / slot_executions / rapid_runs / rapid_crosscheck_requests / final_crosscheck_requests / monitor_records)への SELECT/DELETE のみ。INSERT/UPDATE とスキーマ変更権限は与えない。housekeep だけが使う"
      housekeep_delete: "housekeep は削除単位(リランの親子をまとめた実行の単位、確報比較依頼 1 件)ごとに、成果物を削除待ちの置き場へ移して削除したあと、その単位の管理 DB の行を housekeep_del で 1 トランザクションで削除する。DB 行が残っていれば次回の走査で再発見される。RAPID_CROSSCHECK_MODE=off でハウスキープ設定の接続参照名が無い・空のときは管理 DB に接続せず、管理 DB の行と確報比較依頼を削除しない(起動のたびに warn 1 行。速報クロスチェックのモードが off でない期間に作られた実行は単位ごと残して warn。warn は終了コードに影響しない)。接続する設定では容量は保持日数(既定 90 日)分の行で頭打ちになる"
      claim_pattern: "SELECT ... FOR UPDATE SKIP LOCKED + lease_until 列の UPDATE(lease 期間は rapid-crosscheck.env の RAPID_LEASE_SEC、worker の poll 間隔は RAPID_POLL_INTERVAL_SEC)"
      connection_resolution: "facade / slot runner / 速報クロスチェック runner / 速報 worker は rapid-crosscheck.env の RAPID_DB_CONN_REF、確報 worker は final-crosscheck.env の DB 接続参照、hang-detector は hang-detector.env の HANG_DB_CONN_REF、housekeep はハウスキープ設定の専用 DB ロールの接続参照名(キー名は仕様で確定。RAPID_CROSSCHECK_MODE=off で無い・空なら接続しない)で接続先と認証情報を解決する(設定ファイルに値を置かない)。確報 worker は別ネットワークセグメント(DB セグメント)で動くため、runner 側の成果物ファイルパスを渡されても読まず、起動に必要な値は依頼レコードと自身の設定ファイルだけから得る"
      abort_updates: "abort-rapid-crosscheck は運用者に worker のプロセス停止を対話確認し yes のときだけ、対象の速報比較依頼を WHERE status IN ('REQUESTED', 'CLAIMED', 'RUNNING') の条件付き UPDATE で ABORTED にする(更新件数 0 = 終端済みはエラー終了。CLAIMED を放置すると lease 失効で REQUESTED に戻り別 worker が再 claim するため運用者が止める手段)。abort-final-crosscheck は WHERE status = RUNNING のみ。abort-blue / abort-green は対象 run の REQUESTED の速報比較依頼を WHERE status = REQUESTED の条件付き UPDATE で ABORTED にする(完了通知で依頼が作成された直後に slot を中止した場合の競合窓を塞ぐ保険。該当なしは正常。dispatcher 側の中止済み run 判定と併用)。いずれも app_rw の UPDATE 権限で足りる"
      worker_start_update: "worker は claim した依頼を比較開始前に WHERE status = 'CLAIMED' AND worker_id = 自 worker_id の条件付き UPDATE で RUNNING にし、psql のコマンドタグ(UPDATE n)で更新件数を取る。0 件(abort-rapid-crosscheck で ABORTED 済み)なら比較ツールを起動せずに正常終了し、その旨を実行ログに残す"
      aborted_run_judgement: "dispatcher の中止済み run 判定は parallel_run.status と対象 slot の slot_executions.status(ファイル正本 aborted.txt のミラー)を同一トランザクションで読む(いずれかが ABORTED なら依頼を作成しない)。テーブル・権限の追加は不要"
      pg_hba: "実行ホストセグメント/DBセグメントのIP範囲のみ許可、他は拒否"
      backup:
        full: "pg_basebackup 日次(cronで自動実行)"
        incremental: "archive_command による WAL 連続アーカイブ"
        rpo_target: "4h"
        rto_target: "12h"
      future_extension: "ストリーミングレプリケーション(HA拡張時のみ、現行は単一インスタンス)"
    dependencies: []
    iac_module: "infra/product/onprem/ansible/roles/relay-gate-postgresql"
    validation_rules:
      - rule: "pg_hba.conf に実行ホストセグメント/DBセグメント以外からの接続許可行が無いこと"
        type: "static"
        description: "ネットワークセグメント分離の設定検証"
      - rule: "app_rw ロールと ops_ro ロールにどのテーブルへの DELETE 権限も付与されていないこと"
        type: "static"
        description: "権限分離(REQ-DB-005 / REQ-DB-007)の検証。管理 DB の行の削除はハウスキープだけが行う(CTR-008)"
      - rule: "housekeep_del ロールの権限が 6 テーブルへの SELECT と DELETE だけであること(INSERT / UPDATE / TRUNCATE / スキーマ変更権限が無いこと)"
        type: "static"
        description: "ハウスキープ専用ロール(REQ-DB-007 / CTP-002)の検証"
      - rule: "psql -c による条件付き UPDATE の実行で、条件不一致時にコマンドタグ UPDATE 0 が取得でき、スクリプトがそれを分岐に使えること"
        type: "runtime"
        description: "条件付き UPDATE の更新件数取得(REQ-DB-006)の検証。worker の比較開始判定と abort-* CLI の競合判定の前提"
      - rule: "WAL アーカイブ先ディレクトリへの書き込みが継続していること(タイムスタンプ差分監視)"
        type: "runtime"
        description: "RPO 4h を満たす WAL アーカイブ稼働確認"

  - id: "impl.storage.artifact_store"
    name: "成果物ディレクトリ"
    canonical_element_id: "product.storage.artifact_store"
    vendor_service: "実行ホストのローカルディスク(RAID1)"
    configuration:
      mount_point: "/var/lib/relay-gate/facade/"
      filesystem: "ext4 または xfs(RAID1構成のボリューム上)"
      write_pattern: "一時ファイル(.tmp サフィックス)へ書き込み後 rename(2) で確定"
      artifacts: "started-at.txt / stdout.log / stderr.log / exitcode.txt / aborted.txt(中止時のみ) / execution-spec.json"
      notified_marks: "RAPID_CROSSCHECK_MODE=off 時のハング検知の通知済みの印を成果物ルート配下に置く(Runner Result の契約ファイルとは別。一時ファイル → リネーム。場所とファイル名は仕様で確定)"
      housekeep_staging: "ハウスキープの削除待ちの置き場を成果物ルート配下(成果物ルートと同じファイルシステム)に置き、削除単位の成果物を rename(2) で移してから削除する(場所は仕様で確定)"
      capacity: "保持日数(既定 90 日)× 1 日あたりの成果物量で頭打ちになる。管理 DB に接続しない設定の間は、速報クロスチェックのモードが off でない期間に作られた実行の成果物が日数にかかわらず残る"
      state_derivation: "exitcode.txt があれば SUCCEEDED(0) / FAILED(非 0)、無く aborted.txt があれば ABORTED、どちらも無ければ RUNNING。管理 DB なしでも成立"
      raid: "RAID1(部品冗長化)"
    dependencies: []
    iac_module: "infra/product/onprem/ansible/roles/relay-gate-runtime"
    validation_rules:
      - rule: "確定済みファイルに .tmp サフィックスの残留が無いこと"
        type: "runtime"
        description: "原子的確定(REQ-ART-001)の検証"
      - rule: "RAID アレイの状態が healthy であること(mdadm --detail 等)"
        type: "runtime"
        description: "ストレージ冗長化(REQ-ART-003)の検証"
      - rule: "ハウスキープの削除待ちの置き場が成果物ルートと同じファイルシステム(NFS の場合は同一 export)上にあること(stat -c %d が一致)"
        type: "runtime"
        description: "置き場への移動を rename(2) で行う前提(REQ-ART-004)の検証。クロスデバイス rename を避ける"

  - id: "impl.storage.config_store"
    name: "設定ファイル配置"
    canonical_element_id: "product.storage.config_store"
    vendor_service: "実行ホストのローカルディレクトリ(読み取り専用配置)"
    configuration:
      path: "/etc/relay-gate/"
      contents: "feature-flag.env(9 キー: BLUE_MODE / GREEN_MODE / RAPID_CROSSCHECK_MODE / BLUE_IMPL / GREEN_IMPL / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER)、<role>-job-map.csv(CSV: 1 行目ヘッダー、セルは二重引用符で囲み内部の二重引用符は二重化)、hang-detector.env(HANG_DB_CONN_REF だけ)、ハウスキープ設定(保持日数。既定 90 日と、ハウスキープ専用 DB ロールの接続参照名。RAPID_CROSSCHECK_MODE=off では接続参照名を省略・空にでき、そのときハウスキープは管理 DB に接続せず管理 DB の行と確報比較依頼を削除しない。ファイル名・キー名は仕様で確定)、rapid-crosscheck.env(RAPID_DB_CONN_REF / RAPID_LEASE_SEC / RAPID_POLL_INTERVAL_SEC と速報比較ツールの起動コマンド 1 行。速報有効時のみ配置。RAPID_CROSSCHECK_MODE=off では不要)、final-crosscheck.env(確報 worker の DB 接続参照と確報比較ツールの起動コマンド 1 行)、適用文書。比較対象の定義は比較ツール側が持ち、ジョブ ID ごとの比較定義 CSV・対象カタログは配置しない"
      versioning: "設定版ファイルは持たない。実装版は feature-flag.env の BLUE_IMPL / GREEN_IMPL、マップ版はジョブマップ末尾の任意列 map_version"
      ownership: "所有者=配布用サービスアカウント、実行ユーザーは読み取り専用(0644, グループ read)"
      distribution: "適用側の構成管理ツール(Ansible等)で配布"
      secret_handling: "認証情報は参照名のみを記載し実体は置かない(ジョブマップ credential_ref、hang-detector.env HANG_DB_CONN_REF、ハウスキープ設定の専用 DB ロールの接続参照名、rapid-crosscheck.env RAPID_DB_CONN_REF)"
      backup: "正本は適用側の構成管理リポジトリ。バックアップ対象(C.1.2.2)は版管理側で満たし、ホスト側の追加バックアップは行わない"
    dependencies: []
    iac_module: "infra/product/onprem/ansible/roles/relay-gate-config"
    validation_rules:
      - rule: "/etc/relay-gate/ 配下のファイルパーミッションが実行ユーザーに対し write 不可であること"
        type: "static"
        description: "読み取り専用配置(REQ-CFG-002)の検証"
      - rule: "設定ファイル中に認証情報の平文値が含まれないこと(grepベースの静的検査。hang-detector.env の HANG_DB_CONN_REF と rapid-crosscheck.env の RAPID_DB_CONN_REF は参照名であること)"
        type: "static"
        description: "foundation.identity.no_secret_values_in_config の検証"
      - rule: "feature-flag.env のキーが 9 キーと一致し、RAPID_CROSSCHECK_MODE が foreground / background / off のいずれかであること"
        type: "static"
        description: "元の方針資料の設定契約(E-001)との一致検証"
      - rule: "ジョブマップ CSV(<role>-job-map.csv)の 1 行目ヘッダーが契約の列名と一致し、fixed_params セルが JSON 配列として解析できること"
        type: "static"
        description: "CSV 形式・列名(E-003)の検証。ジョブ ID ごとの比較定義 CSV・対象カタログは廃止したため検証対象にしない"
      - rule: "RAPID_CROSSCHECK_MODE が off 以外のとき rapid-crosscheck.env が存在し、RAPID_DB_CONN_REF / RAPID_LEASE_SEC / RAPID_POLL_INTERVAL_SEC の 3 キーと速報比較ツールの起動コマンドのキーを持ち、秒の 2 キーが正の整数であること"
        type: "static"
        description: "速報クロスチェック設定(E-027)の存在とキー構成の検証。起動コマンドの内容検証(コマンド部分が絶対パスで実行可能・{job_id} を含む・{params} を使うなら引数 1 つ全体がちょうど {params} の 3 点)は validate-config.sh が所有する"
      - rule: "final-crosscheck.env が存在し、確報 worker の DB 接続参照のキーと確報比較ツールの起動コマンドのキーを持つこと"
        type: "static"
        description: "確報クロスチェック worker 設定の存在とキー構成の検証。起動コマンドの内容検証(コマンド部分が絶対パスで実行可能)は validate-config.sh が所有する"
      - rule: "hang-detector.env が HANG_DB_CONN_REF だけを持ち、通知の宛先・送信コマンド・件名のキーを持たないこと"
        type: "static"
        description: "メール通知の廃止(2026-11-01)に伴うハング検知定期ジョブ設定(E-026)のキー構成の検証"
      - rule: "ハウスキープ設定が存在すること。保持日数のキーは省略できる(既定 90 日)。RAPID_CROSSCHECK_MODE が off 以外なら専用 DB ロールの接続参照名のキーを持つこと(off では省略・空を許す)"
        type: "static"
        description: "ハウスキープ設定(E-028)の存在とキー構成の検証。保持日数が正の整数であることの内容検証は validate-config.sh が所有する(CTR-007)"

  - id: "impl.storage.execution_log_store"
    name: "実行ログ領域"
    canonical_element_id: "product.storage.execution_log_store"
    vendor_service: "実行ホストのローカルディスク + logrotate"
    configuration:
      path: "/var/log/relay-gate/<script>.log"
      format: "日時 スクリプト名 run_id レベル メッセージ"
      timestamp: "ホストのローカルタイムゾーン、ISO 8601 秒精度、タイムゾーン指示子なし(run_id の時刻部と同じ時刻軸。UTC 統一はしない)"
      rotation: "logrotate: daily, rotate 90, compress"
      retention: "3ヶ月(90世代)"
    dependencies: []
    iac_module: "infra/product/onprem/ansible/roles/relay-gate-runtime"
    validation_rules:
      - rule: "logrotate -d /etc/logrotate.d/relay-gate がエラー無く完了すること"
        type: "static"
        description: "ローテーション設定の構文検証"
      - rule: "90日超のログファイルが残存していないこと"
        type: "runtime"
        description: "ログ保管期間(REQ-LOG-001)の検証"

  - id: "impl.integration.job_scheduler"
    name: "ジョブスケジューラ連携"
    canonical_element_id: "product.integration.job_scheduler"
    vendor_service: "組織既存のジョブスケジューラ(製品固定なし)"
    configuration:
      job_definitions:
        - "業務ジョブ: facade.sh JOB_ID [PARAM...] への置き換え"
        - "確報クロスチェックジョブ: 日次スケジュール"
        - "ハング検知定期ジョブ: 5分間隔(終了結果: 正常終了 / 警告終了 / 失敗。警告終了と失敗を障害通知の対象にする)"
        - "ハウスキープ定期ジョブ: 1日1回(失敗は障害通知の対象。次回の実行で残りを削除できるため即時対応は要さない。削除したくない場合は登録しない)"
        - "backgroundリラン専用ジョブ: 手動トリガー起動用"
      exit_code_policy: "終了コードで成否判定(0=成功、非0=失敗)。ハング検知ジョブは警告終了の終了コードを警告として扱う(具体的な値は CLI 契約で確定)。stdout/stderrは無加工中継"
      alerting: "運用者への通知はジョブスケジューラの既存のジョブ監視・障害通知だけで行う。ハング検知ジョブの標準エラー(異常 1 件 1 行)をジョブログとして参照できるようにし、業務ジョブの障害と区別できるジョブ定義名にする"
    dependencies:
      - "impl.compute.execution_hosts"
    iac_module: "(ジョブスケジューラ側の定義。IaCスケルトン対象外)"
    validation_rules:
      - rule: "ジョブ定義のコマンドライン引数がfacade.shのCLIコマンド契約と一致すること"
        type: "static"
        description: "cli-command-contract.yaml とのトレーサビリティ検証"
      - rule: "ハング検知定期ジョブとハウスキープ定期ジョブがジョブスケジューラに登録され、警告終了・失敗が障害通知の対象になっていること"
        type: "runtime"
        description: "通知経路(REQ-SCH-003)と定期実行(REQ-SCH-002)の検証。登録手順は運用手順書に記載する"

  - id: "impl.operations.backup_and_monitoring"
    name: "バックアップと基盤監視"
    canonical_element_id: "product.operations.backup_and_monitoring"
    vendor_service: "cron + 組織既存のホスト監視エージェント"
    configuration:
      backup_jobs:
        - "pg_basebackup(日次フル、cron)"
        - "WALアーカイブ(archive_command による継続実行)"
      monitoring: "組織既存の監視エージェントにCPU/メモリ/ディスク/ネットワークを統合"
      fallback: "組織既存監視が無い場合は sar/df の閾値検査スクリプトをジョブスケジューラの定期ジョブとして登録し、閾値超過を失敗終了として障害通知で届ける(ダッシュボード無し)"
      dr_drill: "PITR復旧手順を年1回テスト環境で演習"
    dependencies:
      - "impl.database.management_db"
      - "impl.storage.execution_log_store"
    iac_module: "infra/product/onprem/ansible/roles/relay-gate-backup"
    validation_rules:
      - rule: "直近24時間以内にpg_basebackupの成功ログが存在すること"
        type: "runtime"
        description: "日次バックアップ(REQ-OPS-001)の稼働検証"
