---
# relay-gate-postgresql: 管理DB(PostgreSQL単一インスタンス)を構成する
# 対応: product-impl-onprem.yaml#impl.database.management_db

- name: PostgreSQL 16をオフラインリポジトリからインストールする
  ansible.builtin.package:
    name: postgresql16-server
    state: present

- name: rapid/finalスキーマを作成する
  community.postgresql.postgresql_schema:
    name: "{{ item }}"
    database: relay_gate
  loop:
    - rapid
    - final

- name: app_rwロールを作成する(rapid/finalへのSELECT/INSERT/UPDATE)
  community.postgresql.postgresql_user:
    name: app_rw
    role_attr_flags: NOSUPERUSER,NOCREATEDB

- name: ops_roロールを作成する(全スキーマSELECT専用)
  community.postgresql.postgresql_user:
    name: ops_ro
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: pg_hba.confを実行ホスト/DBセグメントのCIDRに限定する
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /var/lib/pgsql/16/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: restart postgresql

- name: WALアーカイブ用ディレクトリを作成する
  ansible.builtin.file:
    path: /var/lib/relay-gate/wal-archive
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: postgresql.confでarchive_modeを有効化する
  community.postgresql.postgresql_set:
    name: archive_mode
    value: "on"
  notify: restart postgresql
