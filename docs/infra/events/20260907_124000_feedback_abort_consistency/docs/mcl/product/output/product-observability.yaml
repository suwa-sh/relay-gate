schema_version: "1.0"
artifact_type: "observability_spec"
skill_type: "product"
artifact_id: "product-observability-relay-gate"
title: "relay-gate 並行稼働実行基盤 オブザーバビリティ仕様"
status: "draft"
generated_at: "2026-09-07T12:40:00"
source_refs:
  - "docs/mcl/product/output/product-workload-model.yaml#workload_characteristics.observability_needs"
inputs_ref:
  - "product-relay-gate-workload-model"

metrics:
  - name: "run_duration_seconds"
    description: "run_id 単位の実行時間(起動〜終了)"
    unit: "seconds"
    source: "facade / runner が execution-spec.json に記録"
  - name: "run_exit_code"
    description: "run_id 単位の終了コード"
    unit: "count(non-zero率で集計)"
    source: "exitcode.txt"
  - name: "queue_depth"
    description: "速報/確報比較依頼テーブルの未処理件数(claimされていないレコード数)"
    unit: "count"
    source: "管理DBへの定期クエリ"
  - name: "hang_detection_count"
    description: "ハング検知定期ジョブが検知した長時間未完了run件数"
    unit: "count/5min"
    source: "hang-detector"
  - name: "host_cpu_memory_disk_network"
    description: "実行ホスト/DBホストのCPU・メモリ・ディスク・ネットワーク使用率"
    unit: "percent / bytes"
    source: "組織既存のホスト監視エージェント"
  - name: "backup_success_rate"
    description: "日次pg_basebackupの成功率"
    unit: "percent"
    source: "cronジョブの終了コードをログ集計"

sli:
  - id: "sli-availability"
    description: "業務ジョブがfacade経由で起動でき、Runner Resultを正しく返せた比率"
    measurement: "run件数のうちexitcode.txtが正常に生成された比率"
  - id: "sli-latency"
    description: "facadeの起動・中継オーバーヘッドが10秒以内に収まった比率"
    measurement: "run_duration_secondsのfacadeオーバーヘッド部分のp99"
  - id: "sli-error-rate"
    description: "run_idのうち異常終了(非0終了コード、クロスチェック不一致含む)の比率"
    measurement: "run_exit_code != 0 の件数 / 全run件数"
  - id: "sli-throughput"
    description: "日次確報クロスチェックが夜間バッチウィンドウ8時間以内に完了した比率"
    measurement: "final-crosscheckジョブの所要時間"

slo:
  - sli_ref: "sli-availability"
    target: "99%(月次)"
    error_budget: "月間ダウンタイム許容 約7.2時間(availability_target: 99%と整合)"
  - sli_ref: "sli-latency"
    target: "facade起動・中継オーバーヘッド p99 10秒以内"
    error_budget: "超過は警告のみ(ハードな課金影響なし)"
  - sli_ref: "sli-error-rate"
    target: "月次エラー率 5%未満"
    error_budget: "5%を超えた場合は運用者へエスカレーション"
  - sli_ref: "sli-throughput"
    target: "日次確報クロスチェック8時間以内完了 100%"
    error_budget: "超過は即日エスカレーション(翌営業日の確報遅延に直結するため)"

logging:
  levels: ["diagnostic", "audit"]
  format: "日時 スクリプト名 run_id レベル メッセージ"
  timestamp: "ホストのローカルタイムゾーン(ISO 8601 秒精度、タイムゾーン指示子なし)。run_id の時刻部と同じ時刻軸。全ホストで TZ 設定と時刻同期をそろえる"
  diagnostic_only_events: "中止済み run(並行稼働実行が ABORTED、または完了通知の対象 slot の slot 実行が ABORTED(aborted.txt 公開済み)のいずれか。foreground 完了後の background 中止は slot 実行 ABORTED 側で該当)で速報クロスチェック runner(dispatcher)が両系成功でも速報比較依頼を作成しなかった事実は warning として実行ログにのみ残す(メール通知しない)。worker が claim 後の RUNNING への条件付き UPDATE が 0 件(abort-rapid-crosscheck で ABORTED 済み)で比較を開始しなかった事実も run_id / worker_id 付きで実行ログにのみ残す"
  retention: "3ヶ月(logrotate: daily, rotate 90, compress)"
  storage: "/var/log/relay-gate/<script>.log(実行ホストローカルディスク)"
  correlation_id: "run_id / parent_run_id(リランの親子関係追跡)"

tracing:
  approach: "分散トレーシング基盤は導入しない"
  correlation: "run_id / parent_run_id によるログ相関のみ"
  rationale: "UI画面・HTTP APIが無くリクエストチェーンが単純なバッチ系基盤のため、専用トレーシング基盤は過剰投資と判断(cost_posture: cost_optimized)"

dashboards:
  - name: "組織既存監視ダッシュボード(ホストリソース)"
    description: "CPU/メモリ/ディスク/ネットワークを既存監視基盤のダッシュボードに統合表示。relay-gate専用ダッシュボードは新規構築しない"
  - name: "運用者向け日次サマリー(メール)"
    description: "確報クロスチェック結果・エラー件数・ハング検知件数を日次メールでレポートする(ダッシュボードの代替)"

alerting:
  rules:
    - id: "alert-health-check"
      condition: "hang-detector が長時間未完了run(exitcode.txt も aborted.txt も無く経過時間が hang_detect_limit_minutes 超過)を検知。aborted.txt がある対象は中止済みとして終端し通知しない"
      severity: "warning"
      channel: "メール通知のみ(宛先・送信コマンド・件名プレフィックスは hang-detector.env)"
    - id: "alert-error-rate"
      condition: "run_exit_code非0、またはクロスチェック不一致検知(中止済み run(並行稼働実行 ABORTED または対象 slot の slot 実行 ABORTED)で速報比較依頼を作成しなかった warning、abort-blue / abort-green による未着手依頼の ABORTED 化(競合窓の保険)、abort-rapid-crosscheck による REQUESTED / CLAIMED / RUNNING 依頼の ABORTED 化、worker が条件付き UPDATE 0 件で比較を開始しなかった事象は対象外)"
      severity: "error"
      channel: "メール通知のみ(宛先・送信コマンド・件名プレフィックスは hang-detector.env)"
    - id: "alert-backup-failure"
      condition: "日次pg_basebackupが失敗、またはWALアーカイブが停止"
      severity: "error"
      channel: "メール通知のみ"
  escalation: "チャット/ページャ連携は導入しない(foundation.policy.no_ui_no_http_apiおよびmessaging方針と整合)。メール受信後は運用体制の連絡フローに従う"
