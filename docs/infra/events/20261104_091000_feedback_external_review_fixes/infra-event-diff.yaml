    outputs_updated:
      - path: "infra/product/onprem/ansible/roles/relay-gate-config/tasks/main.yml"
        change: "「ハング検知定期ジョブ設定が HANG_DB_CONN_REF だけを持つことを検査する」タスク(HANG_DB_CONN_REF の行を必須とし、それ以外の非コメント行を拒否する grep)を「ハング検知定期ジョブ設定が存在することを検査する」(test -f /etc/relay-gate/hang-detector.env)に改めた。中身の検査(キーの定義 HANG_DB_CONN_REF / 任意キー RAPID_HANG_DETECT_LIMIT_MINUTES / HANG_SCAN_WINDOW_HOURS、HANG_DB_CONN_REF の必須判定は RAPID_CROSSCHECK_MODE が off 以外のときだけ、行の形)は CLI 契約が所有し hang-detector.sh が起動時に行う旨をコメントに書いた。配置タスク名の「HANG_DB_CONN_REF だけ」を 3 キーを持ち得る旨に直した"
        work_units: ["CR-c5e19a72-002#1"]
      - path: "docs/mcl/product/output/product-impl-onprem.yaml"
        change: "config_store の contents の hang-detector.env を「HANG_DB_CONN_REF だけ」から 3 キーを持ち得る(HANG_DB_CONN_REF は off 以外のときだけ必須)に直した。検証規則「hang-detector.env が HANG_DB_CONN_REF だけを持つこと」を「hang-detector.env が存在すること(配置時はファイルの存在確認だけ)」に改め、中身の検査の所有者を CLI 契約(hang-detector.sh の起動時検査。validate-config.sh には検証種別が無い)と書いた"
        work_units: ["CR-c5e19a72-002#1"]
      - path: "docs/mcl/product/output/product-mapping-onprem.yaml"
        change: "config_store の notes の hang-detector.env を 3 キーを持ち得る(HANG_DB_CONN_REF は off 以外のときだけ必須)に直した"
        work_units: ["CR-c5e19a72-002#1"]
      - path: "docs/mcl/product/output/product-workload-model.yaml"
        change: "config_store の説明のハング検知定期ジョブ設定を 3 キーを持ち得る(HANG_DB_CONN_REF は off 以外のときだけ必須)に直した"
        work_units: ["CR-c5e19a72-002#1"]
      - path: "docs/cloud-context/conformance/product/product-conformance-onprem.yaml"
