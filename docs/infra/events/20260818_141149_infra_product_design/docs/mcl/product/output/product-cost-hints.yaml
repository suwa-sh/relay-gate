note: "デプロイ先がエアギャップ環境のオンプレミスLinuxサーバであり、クラウドの従量課金・オートスケーリング・リザーブド割引等のコスト最適化手法は適用対象外。以下はオンプレミス資産運用の観点で関連するヒントのみに限定して記載する（ユーザー指示によりクラウド向けコスト最適化ヒントは省略）"

hints:
  - category: "rightsizing"
    description: "初期リソース割当（CPU/メモリ）はNFRのベースライントラフィック（低頻度・少人数運用）を踏まえ小規模構成から開始し、監視結果に基づき増設判断を行う"
  - category: "storage_tiering"
    description: "実行ログは日次生成される軽量テキストが中心のため、一定期間（保持方針に基づく世代数）経過後のログをコールドストレージ相当（低速・安価なディスク）へ移動する運用を検討する"
  - category: "capacity_planning"
    description: "オートスケーリングを行わない前提のため、ピーク時（日次確報バッチ実行時間帯）のリソース使用量を実測し、スケールアップ判断の基準値として運用開始後に確定する"
  - category: "audit_retention"
    description: "slot起動監査イベントは月次パーティションで6ヶ月保持し、run_id/parent_run_id照会用索引とローカル永続outboxを含む容量を実測する。保持期限を超えたパーティションはハッシュチェーン検証後に削除し、RDB容量を予測可能に保つ"

