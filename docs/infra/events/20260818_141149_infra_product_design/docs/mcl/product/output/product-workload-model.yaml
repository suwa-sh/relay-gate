schema_version: "1.0"
artifact_type: "canonical_model"
skill_type: "product"
artifact_id: "product-job-relay-canonical"
title: "ジョブ実行中継基盤 ワークロードモデル"
status: "draft"
generated_at: "2026-08-18T14:11:49"
source_refs:
