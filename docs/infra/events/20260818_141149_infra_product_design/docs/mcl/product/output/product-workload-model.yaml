  - "product-decision-storage-approach"
  - "product-decision-audit-persistence"
  - "product-decision-event-snapshot-persistence"
inputs_ref:
  - "foundation-context"
  - "shared-platform-context"

elements:
  - id: "product.workload_type"
    name: "ワークロード種別"
    category: "workload_characteristics"
    description: "外部スケジューラからの起動要求に対し同期応答するエントリポイントと、非同期・定期実行される後続処理を組み合わせた API 型ワークロード"
    requirements:
      - id: "REQ-WT-001"
        description: "エントリポイントは呼び出し元へ標準出力・標準エラー・終了コード相当の同期応答のみを返す"
        priority: "must"
        rationale: "既存の呼び出し契約を変更しない制約"
      - id: "REQ-WT-002"
        description: "非同期処理（比較検証・異常監視）は定期実行機構によりスケジュール駆動で実行する"
        priority: "must"
        rationale: "日次全量比較・24時間監視の要件"
    constraints:
      - "同期応答はエントリポイント経由のみ。非同期処理の実行状況は同期応答に含めない"
    dependencies: []
    source_refs:
      - "product-input.yaml: workload_type"

  - id: "product.availability_target"
    name: "可用性ターゲット"
    category: "availability"
    description: "N+1 冗長構成（手動切替）を前提とし、障害時は60分未満でのサービス切替を目標とする"
    requirements:
      - id: "REQ-AV-001"
        description: "SLA 99.9% を目標とする"
        priority: "must"
        rationale: "24時間無停止運用が求められるため"
      - id: "REQ-AV-002"
        description: "フェイルオーバーは warm standby（60分未満での切替）を前提とする"
        priority: "should"
        rationale: "コールドスタンバイより短い切替時間が求められる"
    constraints:
      - "自動フェイルオーバーではなく手動切替運用を前提とする"
    dependencies: []
    source_refs:
      - "product-input.yaml: availability_target"

  - id: "product.latency_sensitivity"
    name: "応答性要件"
    category: "performance"
    description: "同期応答型 capability であり、p99 で 1 秒以内の応答を目標とする"
    requirements:
      - id: "REQ-LT-001"
        description: "同期応答は p99 1 秒以内を目標とする"
        priority: "should"
        rationale: "CLI/バッチ運用中心であり厳密なリアルタイム性は不要"
    constraints: []
    dependencies: []
    source_refs:
      - "product-input.yaml: latency_sensitivity"

  - id: "product.data_sensitivity"
    name: "データ機密性"
    category: "security"
    description: "内部分類データを扱い、個人情報は保持しない。通信経路の暗号化を必須とし、機密属性（認証情報等）は参照名のみを保存する"
    requirements:
      - id: "REQ-DS-001"
        description: "全ての内部通信を暗号化する"
        priority: "must"
        rationale: "通信時暗号化の要件"
      - id: "REQ-DS-002"
        description: "認証情報等の機密属性は実値を保存せず参照名のみを保存する"
        priority: "must"
        rationale: "機密情報の保管リスク低減"
    constraints:
      - "個人情報は取り扱わない前提（PII 属性なし）"
    dependencies: []
    source_refs:
      - "product-input.yaml: data_sensitivity"

  - id: "product.traffic_pattern"
    name: "トラフィックパターン"
    category: "workload_characteristics"
    description: "スケジュール駆動型のトラフィックパターン。定期実行される非同期処理を主体とし、同期応答のベースライン負荷は小規模"
    requirements:
      - id: "REQ-TP-001"
        description: "定期実行される非同期処理をスケジュール駆動でトリガーする仕組みを持つ"
        priority: "must"
        rationale: "日次全量比較・24時間監視の定期実行要件"
    constraints:
      - "ベースラインは低トラフィック（同時実行数が限定的な社内利用）"
    dependencies: []
    source_refs:
      - "product-input.yaml: traffic_pattern"

  - id: "product.consistency_needs"
    name: "整合性要件"
    category: "data"
    description: "強整合性を要求する capability。排他制御機構により同一処理対象への重複実行を防止する"
    requirements:
      - id: "REQ-CN-001"
        description: "処理対象の占有・解放を伴う排他制御機構（リース方式）で重複実行を防止する"
        priority: "must"
        rationale: "非同期処理の重複実行防止が業務要件として明示されている"
      - id: "REQ-CN-002"
        description: "処理系譜（親子関係）を相関 ID で追跡可能にする"
        priority: "must"
        rationale: "実行系譜の追跡要件"
      - id: "REQ-CN-003"
        description: "起動試行を（相関ID, slot種別, role区分, 起動試行ID）で一意に識別し、再実行は新しい相関IDと親相関IDの関連付けで表現する（既存履歴は変更しない）"
        priority: "must"
        rationale: "同一runでのslot・role・試行の識別と、リランを含む実行系譜の不変履歴要件"
    constraints: []
    dependencies: []
    source_refs:
      - "product-input.yaml: consistency_needs"

  - id: "product.recovery_target"
    name: "復旧目標"
    category: "availability"
    description: "RPO/RTO ともに 72 時間以内を目標とし、日次のフル+差分バックアップにより保護する"
    requirements:
      - id: "REQ-RT-001"
        description: "RPO 72時間以内、RTO 72時間以内を目標とする"
        priority: "must"
        rationale: "業務継続要件"
      - id: "REQ-RT-002"
        description: "永続化データ・実行ログはフル+差分バックアップ（日次）で保護し、複数世代を保持する"
        priority: "must"
        rationale: "バックアップ運用方針"
    constraints:
      - "マネージドバックアップサービスは利用不可。ストレージ/永続化層レベルでの運用を前提とする"
    dependencies: []
    source_refs:
      - "product-input.yaml: recovery_target"

  - id: "product.observability_needs"
    name: "オブザーバビリティ要件"
    category: "operations"
    description: "リソース・応答性・エラー率・スループットの主要メトリクスを収集し、アクセス/監査/診断/依存関係の各ログを構造化して出力する。ヘルスチェック・エラー率・レイテンシに基づくアラーティングを行う"
    requirements:
      - id: "REQ-OB-001"
        description: "CPU/メモリ/ディスク/ネットワーク/レイテンシ/エラー率/スループットのメトリクスを収集する"
        priority: "must"
        rationale: "運用監視要件（重要指標）"
      - id: "REQ-OB-002"
        description: "アクセスログ・監査ログ・診断ログ・依存関係ログを構造化形式で出力し、処理系譜の相関 ID を必須フィールドとする"
        priority: "must"
        rationale: "ログ管理要件・監査ログ要件"
      - id: "REQ-OB-003"
        description: "ヘルスチェック異常・エラー率上昇・レイテンシ悪化を検知し通知する"
        priority: "must"
        rationale: "定期異常検知・通知要件"
    constraints: []
    dependencies: []
    source_refs:
      - "product-input.yaml: observability_needs"

  - id: "product.cost_posture"
    name: "コスト方針"
    category: "cost"
    description: "既存の物理/仮想リソースを前提としたコスト重視の方針。垂直方向のリソース拡張（増設・交換）で対応し、自動水平スケーリングは前提としない"
    requirements:
      - id: "REQ-CP-001"
        description: "リソース拡張は既存資産の増設・交換（スケールアップ）で対応する"
        priority: "should"
        rationale: "オンプレミス物理/VMサーバのため自動スケールアウトは想定しにくい"
    constraints: []
    dependencies: []
    source_refs:
      - "product-input.yaml: cost_posture"

  - id: "product.persistence"
    name: "永続化 capability"
    category: "data"
    description: "トランザクション整合性を持つリレーショナルなデータストアで、キュー相当の状態遷移管理（作成・占有・実行中・完了/失敗/中断）と処理系譜の相関参照を担う。状態遷移エンティティはappend-onlyのイベント履歴と現在状態snapshotを併用して永続化する。加えて、構造化されたテキストログ本体をファイル単位で永続化するストレージ capability を併せ持つ"
    requirements:
      - id: "REQ-PS-001"
        description: "トランザクション整合性のあるリレーショナルなデータストアを提供する"
        priority: "must"
        rationale: "全永続化対象エンティティがトランザクション整合性を要求"
      - id: "REQ-PS-002"
        description: "リース/占有に基づく排他制御をデータストアレベルで実現する"
        priority: "must"
        rationale: "重複実行防止の要件"
      - id: "REQ-PS-003"
        description: "テキストログファイルを永続化し、データストアからパス参照可能なストレージを提供する"
        priority: "must"
        rationale: "実行ログ本体（標準出力・標準エラー等）の保存要件"
      - id: "REQ-PS-004"
        description: "状態遷移エンティティはappend-onlyの履歴追記と現在状態snapshotの更新を同一トランザクションで実行する"
        priority: "must"
        rationale: "履歴保全と現在状態照会の両立、およびアーキテクチャ設計LR-002（Event/Snapshot併用）との整合"
    constraints:
      - "マネージドデータベースサービスは利用不可。自己運用による高可用性構成が前提"
    dependencies:
      - "product.consistency_needs"
      - "product.recovery_target"
    source_refs:
      - "product-input.yaml: elements[database]"
      - "docs/cloud-context/sources/onprem/postgresql-high-availability.md"

  - id: "product.audit_event_persistence"
    name: "監査イベント永続化 capability"
    category: "security"
    description: "slot起動の操作受付から最終状態までを、実行系譜と起動試行に相関付けた追記専用イベントとして永続化し、保持期間中の照会と改ざん検知を可能にする"
    requirements:
      - id: "REQ-AU-001"
        description: "操作受付、slot別起動試行、成功、失敗、timeout、最終状態を同一の構造化イベント契約で追記する"
        priority: "must"
        rationale: "slot起動の全監査対象事象を一貫して追跡するため"
      - id: "REQ-AU-002"
        description: "監査イベントを実行系譜の相関IDと起動試行IDで一意に照合できるようにする"
        priority: "must"
        rationale: "リランを含む実行系譜の照会と重複追記防止のため"
      - id: "REQ-AU-003"
        description: "監査イベントを6ヶ月保持し、追記順序に基づくハッシュチェーンを定期検証する"
        priority: "must"
        rationale: "監査証跡の保持と欠損・改ざん検知のため"
      - id: "REQ-AU-004"
        description: "認証情報、起動引数の実値、標準出力本文、標準エラー本文を監査イベントへ保存しない"
        priority: "must"
        rationale: "監査目的に不要な秘密情報と実行内容の複製を避けるため"
      - id: "REQ-AU-005"
        description: "外部作用前に監査イベントを永続化できない場合はslot起動を中止する"
        priority: "must"
        rationale: "未記録の外部起動を防ぐため"
      - id: "REQ-AU-006"
        description: "外部作用後の監査イベント永続化失敗は、起動結果と未記録状態を失わず永続的に再試行・照合する"
        priority: "must"
        rationale: "外部作用を取り消せない状況でも監査証跡の整合を回復するため"
    constraints:
      - "監査イベントは更新・削除せず、訂正も新しいイベントとして追記する"
      - "CLIの標準出力・標準エラー・終了コード契約を変更しない"
    dependencies:
      - "product.persistence"
      - "product.consistency_needs"
    source_refs:
      - "product-input.yaml: elements[database].requirements"
      - "arch-design:20260818_090120_arch_audit_contract_feedback"

  - id: "product.scheduled_execution"
    name: "定期実行 capability"
    category: "workload_characteristics"
    description: "OS レベルの定期実行機構により、監視処理と日次全量比較処理をスケジュール駆動でトリガーする"
    requirements:
      - id: "REQ-SE-001"
        description: "定期実行機構により監視処理を高頻度（分オーダー）でトリガーする"
        priority: "must"
        rationale: "24時間定期監視の要件"
      - id: "REQ-SE-002"
        description: "定期実行機構により日次全量比較処理を1日1回トリガーする"
        priority: "must"
        rationale: "日次確報バッチの要件"
    constraints:
      - "定期実行機構自体の高可用化は対象サーバの冗長構成に依存する"
    dependencies:
      - "product.persistence"
    source_refs:
      - "product-input.yaml: elements[cron]"
