  - "foundation-context"

decision:
  context: "本ワークロードはエアギャップ環境のオンプレミスLinuxサーバへのデプロイが前提であり、インターネット接続なし・クラウドマネージドサービス利用なしという制約がアーキテクチャ設計・プロジェクト背景の双方で明記されている"
  conflict_type: "capability"
  options:
    - id: "opt-cloud-multi-vendor"
      description: "AWS/Azure/GCP等のクラウドベンダーへのマッピングも合わせて検討する"
      pros:
        - "将来クラウド移行する場合の比較材料になる"
      cons:
        - "エアギャップ制約と矛盾し実現不可能"
        - "検討工数が無駄になる"
    - id: "opt-onprem-only"
      description: "オンプレミス（自己運用OSSスタック）のみをマッピング対象とする"
      pros:
        - "実際のデプロイ制約と整合する"
        - "検討工数を実装に直結する範囲に集中できる"
      cons:
        - "クラウドのマネージド機能（自動フェイルオーバー・自動バックアップ等）は利用できず、自前運用の設計・運用負担が発生する"
  chosen_option: "opt-onprem-only"
  rationale: "プロジェクト背景としてエアギャップ環境のオンプレミスLinuxサーバへのデプロイが確定要件であるため、クラウドベンダー比較は行わずオンプレミスのみを対象とする"
  risk_assessment: "マネージドサービス相当の運用性（自動パッチ適用・自動フェイルオーバー・自動バックアップ）を自前運用で担保する必要があり、運用手順の整備・訓練が別途必要"
  affected_elements:
    - "product.availability_target"
    - "product.recovery_target"
    - "product.persistence"
    - "product.observability_needs"
  review_date: ""
