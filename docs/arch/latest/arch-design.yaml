              source_model: "状態: 速報比較依頼状態, 確報比較依頼状態"
              confidence: "high"
            - id: "LP-008"
              name: "ログ出力禁止"
              description: "domain層は直接ログ出力を行わない。ドメインイベントの発行または例外のスローで状態変化を通知する"
              reason: "レイヤー責務の分離とテスト容易性の確保"
              source_model: "なし"
              confidence: "high"
          rules: []
        - id: "L-worker-repository"
          name: "リポジトリ層"
          responsibility: "domainのデータアクセス方法。速報比較依頼（AG-003）・確報比較依頼（AG-004）・ハング検知記録（AG-005）のaggregate rootと1:1で定義し、gateway/adapterを利用して永続化・取得する"
          allowed_dependencies:
            - "L-worker-domain"
            - "L-worker-gateway"
          policies: []
          rules:
            - id: "LR-006"
              name: "Aggregate Root対応"
              description: "repositoryはdomainのaggregate root（速報比較依頼、確報比較依頼、ハング検知記録）と1:1で定義する"
              reason: "DDDの集約パターンに従い、データアクセスの責務を明確化"
              source_model: "なし"
              confidence: "default"
            - id: "LR-007"
              name: "Event/Snapshot併用パターン"
              description: "速報比較依頼・確報比較依頼（event_snapshot型）の repository.save は historyAdapter.insert + snapshotAdapter.upsert を実行する"
              reason: "イミュータブルデータモデルの永続化パターンをrepositoryで隠蔽する"
              source_model: "なし"
              confidence: "default"
        - id: "L-worker-gateway"
          name: "ゲートウェイ層"
          responsibility: "Driven Sideの入出力。RDBへのadapter（速報/確報比較依頼、速報比較結果、ハング検知記録テーブルと1:1）と、比較対象データ取得・通知送信のclient"
          allowed_dependencies: []
          policies: []
          rules:
            - id: "LR-008"
              name: "楽観ロック競合ログ"
              description: "速報/確報比較依頼のlease/claim更新時の楽観ロック競合（OptimisticLockException相当）をWARNレベルで出力する。対象run_idと競合回数をcontextに含める"
              reason: "速報比較依頼・確報比較依頼が状態モデルを持ち、複数workerからの同時claimが起こりうるため"
              source_model: "情報: 速報比較依頼, 確報比較依頼"
              confidence: "medium"
      cross_layer_policies:
        - id: "CLP-005"
          name: "IFなし（直接依存）"
          description: "レイヤー間は直接依存とし、開発スピードを優先する"
          reason: "新規構築のため過剰な抽象化を避ける"
          source_model: "なし"
          confidence: "default"
        - id: "CLP-006"
          name: "ログ運用方針"
          description: "非同期ログ出力を原則とする。DEBUG/TRACEは本番無効をデフォルトとする。保持期間はNFR C.6.1.1（6ヶ月）に準拠する"
          reason: "NFR C.6（ログ管理）の要件を満たすため"
          source_model: "NFR C.6.1.1"
          confidence: "medium"
      cross_layer_rules:
        - id: "CLR-002"
          name: "ログアンチパターン防止"
          description: "多重ログ出力禁止、例外の握り潰し禁止、機密情報のマスキング必須、ループ内逐次ログ禁止、構造化ログ強制、タイムゾーンはUTC統一とする"
          reason: "運用監視・障害調査の実効性を確保するため"
          source_model: "なし"
          confidence: "default"
      diagram_mermaid: |
        graph TD
          P[presentation] --> U[usecase]
