        - target_entity: "E-002"
          type: "1:N"
          description: "1つの実行設定に対し、slot・role・起動試行ごとのRunner実行結果が対応する"
        - target_entity: "E-003"
          type: "1:N"
          description: "1つの実行設定に対し速報比較依頼が対応する（run_id相関）"
        - target_entity: "E-005"
          type: "1:N"
          description: "1つの実行設定に対し確報比較依頼が対応する（run_id相関）"
        - target_entity: "E-006"
          type: "1:N"
