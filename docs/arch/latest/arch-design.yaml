          type: "string"
          description: "リラン元のrun_id（新規実行時はnull）。再実行は新しいrun_idの新規runとして作成され、元runのレコード・履歴は変更しない"
          nullable: true
          primary_key: false
        - name: "job_id"
          type: "string"
          description: "ジョブスケジューラから渡されるジョブ識別子"
          nullable: false
          primary_key: false
        - name: "additional_args"
          type: "text"
          description: "起動時に解決済みの追加引数（ジョブスケジューラから渡されるrun共通の引数）"
          nullable: true
          primary_key: false
        - name: "job_map_version"
          type: "string"
          description: "実行先解決に用いたジョブマップのバージョン"
          nullable: false
          primary_key: false
        - name: "hang_detect_limit_minutes"
