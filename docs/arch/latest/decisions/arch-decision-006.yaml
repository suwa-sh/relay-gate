schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-006"
title: "比較定義を独立したクロスチェック定義管理コンテキストへ配置する"
status: "approved"
generated_at: "2026-08-19T11:05:31"
context: |
  RDRA 差分 20260819_104301_slot_config_comparison_def_exitcode で、情報モデルに新コンテキスト
  「クロスチェック定義管理」の情報「比較定義」（JOB_ID / 比較対象テーブル / 比較対象ファイル /
  比較実装識別子 / 有効期間）が追加された。アーキテクチャ側には対応するエンティティも
  境界づけられたコンテキストも存在せず、速報クロスチェック・確報クロスチェックが実行時に
  何を根拠に比較対象と比較実装を解決するかが設計上未定義だった。
decision: |
  比較定義を E-008（model_type: resource_scd2、PK: job_id + valid_from、storage: rdb）として
  データアーキテクチャへ追加し、BC-005「クロスチェック定義管理コンテキスト」に所有させる。
  BC-005 は速報クロスチェック（BC-002）・確報クロスチェック（BC-003）の上流に置き、
  OHS + Published Language（CM-005 / CM-006）で比較定義を公開する。
  サブドメインは新設せず SD-002（クロスチェック検証）に所属させ、対応する BUC を持たない
  参照専用コンテキストとして owned_buc_ids は空とする。
  集約仮説 AG-006 で「同一 JOB_ID の有効期間は重複させない」「世代は追記管理し既存世代を変更しない」
  「速報と確報は同一 JOB_ID に対し同一世代を参照する」を不変条件とする。
consequences:
  positive:
    - "速報・確報の双方が同じ定義を参照する構造を、どちらか一方の内部モデルへ依存させずに表現できる"
    - "比較対象・比較実装の世代交代を、実行トランザクション（比較依頼）の履歴を書き換えずに扱える"
    - "RDRA 情報モデルのコンテキスト区分とアーキテクチャの BC 区分が 1:1 で対応し、追跡が容易になる"
  negative:
    - "比較実行時に有効期間による定義解決の一手間が増え、実装側に世代解決ロジックが必要になる"
    - "BUC を持たない参照専用 BC が 1 つ増え、コンテキストマップの読み取り対象が増える"
alternatives_considered:
  - name: "比較定義を BC-002（速報クロスチェック）に所有させ、BC-003 が参照する"
    reason_rejected: "確報クロスチェックが速報側の内部モデルへ依存し、RDRA が独立コンテキストとして定義した区分とも矛盾するため"
  - name: "比較定義を BC-001（実行管理）の execution-spec.json に取り込む"
    reason_rejected: "実行ごとに確定する run 単位の実行設定と、JOB_ID 単位で世代管理されるマスタ定義はライフサイクルが異なり、一度だけ確定する実行設定の不変条件を壊すため"
