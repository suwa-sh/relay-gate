schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-026"
title: "ハウスキープ設定の管理 DB 接続参照名は、管理 DB を使う機能が 1 つでもある設置では必須とし、欠けたら設定エラーで何も削除しない。管理 DB に接続しない振る舞いは管理 DB を一切使わない設置に限る"
status: "approved"
generated_at: "2026-11-03T13:30:00Z"
context: |
  arch-decision-025 は、RAPID_CROSSCHECK_MODE=off ならハウスキープ設定の管理 DB 接続参照名を省略でき、そのときハウスキープは管理 DB に接続しないとした。
  しかし確報クロスチェックは速報クロスチェックのモードにかかわらず管理 DB を使うため、off で確報クロスチェックを使う設置で接続参照名を省略すると、
  終端した確報比較依頼が保持日数を過ぎても削除されずに増え続ける。
  前段の要求仕様は 2026-11-03 に、接続参照名を RAPID_CROSSCHECK_MODE が off 以外の設置と確報クロスチェックを使う設置(確報クロスチェック worker の設定がある設置)では必須とし、
  必須なのに無い・空なら設定エラーとして非 0 で終わり、成果物・管理 DB の行・確報比較依頼のいずれも削除しないことにした。
  管理 DB に接続しない振る舞いは、管理 DB を一切使わない設置(off で確報クロスチェック worker の設定が無い設置)に絞った。
  RDRA は情報「ハウスキープ設定」と条件「ハウスキープの削除判定」の説明を、NFR は B.3.3.1 / F.1.2.1 の説明を同じ趣旨で更新した。
decision: |
  - arch-decision-025 の「off では接続参照名を省略できる」を改め、省略できるのは管理 DB を一切使わない設置だけとする(arch-decision-025 は過去の判断の記録として書き換えない)
  - SP-027(ハウスキープの削除判定)に、接続参照名が必須の設置と、必須なのに無い・空なら設定エラーで何も削除しないことを加え、管理 DB に接続しない条件を「off で確報クロスチェック worker の設定が無く、接続参照名が無い・空」に絞る。off でも確報クロスチェックを使う設置では確報比較依頼を同じ規則で保持日数で削除する
  - SP-028(削除順序と回復)と tier-ops の usecase に、設定の検査を削除待ちの置き場の残りの削除を含むすべての削除より先に行い、設定エラーなら置き場の中身も消さないことを加える。BC-006 の語「削除待ちの置き場」の無条件の削除も、設定の検査を通った実行に限る
  - ハウスキープ設定(E-028 と BC-005 の語)の接続参照名の説明を、必須の設置と省略できる設置に分けて書く。管理 DB を一切使わない設置では省略できるため nullable: true は維持する
  - コンテキストマップ CM-013(ハウスキープ → 適用構成)に、ハウスキープが確報クロスチェック worker 設定の有無も判定に使うことを加える
  - 確報クロスチェック worker の設定があるとみなす判定方法(既存の確報系コマンドの判定と揃える)、設定エラーの終了コード、キー名は仕様で確定する
consequences:
  positive:
    - "管理 DB を使う設置では確報比較依頼も保持日数で削除され、管理 DB の容量が保持日数分で頭打ちになる(NFR B.3.3.1 の前提が成り立つ)"
    - "設定の誤りを最初に検出して何も削除しないため、誤った設定のまま一部だけ削除されて状態が分かりにくくなることがない"
  negative:
    - "off で確報クロスチェックを使う設置では、ハウスキープ専用 DB ロールの接続参照名を必ず設定する必要がある"
    - "ハウスキープが確報クロスチェック worker 設定の有無を読むため、適用構成への依存が 1 つ増える"
alternatives_considered:
  - name: "off なら従来どおり接続参照名を省略可能とし、確報比較依頼の増加は運用で見込む"
    reason_rejected: "確報比較依頼が保持日数を過ぎても増え続け、ストレージ拡張性の前提(保持日数による頭打ち)が崩れるため"
  - name: "接続参照名を常に必須にする"
    reason_rejected: "管理 DB を一切使わない設置では接続先そのものが無く、成果物だけのハウスキープができなくなるため"
  - name: "必須なのに欠けているときは warn を出して成果物だけ削除する"
    reason_rejected: "設定の誤りに気づかれないまま管理 DB 側の削除だけが止まり、要求の受け入れ基準(何も削除しない)とも合わないため"
