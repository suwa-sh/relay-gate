artifact_id: "arch-decision-005"
title: "再実行identity（新run_id + parent_run_id関連付け・既存履歴不変）へのアーキテクチャ整合"
status: "approved"
generated_at: "2026-08-18T13:55:04"
context: |
  実装フィードバック CR-6078c4ed-003（blocker）で、再実行の identity が USDM（比較依頼だけを新規作成）と
  RDRA 状態遷移（完了済み依頼の REQUESTED への差し戻し）で二重正本になっていることが確認された。
  上流 requirements ステージは RDRA 状態.tsv を「新 run_id の新規作成 + parent_run_id 関連付け、
  既存履歴不変」（rdra:20260818_133855_rerun_identity_new_run_id）へ整合済みであり、
  アーキテクチャ側の冪等性方針（CTP-006）が旧表現のままでは再実行 identity を一意に読めない。
decision: |
  feedback request 本文で確定された推奨案に合わせ、CTP-006（冪等性方針）を
  「再実行は元の execution-spec.json（run 共通 + slot 別実行設定）を保ったまま、新しい run_id を発行し
  parent_run_id で元 run に関連付けた新規 run として実行する。既存 run のレコード・状態・履歴は変更しない」
  へ更新する（confidence: user）。あわせて BC-001 の run 定義・AG-001 不変条件・E-001 parent_run_id の
  説明にも同じ再実行 identity を明記し、RDRA 状態遷移と単一正本に整合させる。
consequences:
  positive:
    - "再実行の識別子発行規則・履歴の不変性・実行系譜（run_id / parent_run_id）照会の意味が全レイヤーで一意になる"
    - "確定済みの run_id / parent_run_id 照会前提（CTP-004 / CTP-005 / SP-005）と矛盾しない"
  negative:
    - "既存 run_id を差し戻して再利用する運用は選択できない（履歴の上書きを許さないトレードオフ）"
alternatives_considered:
  - name: "既存 run_id の差し戻し再利用（完了済み依頼を REQUESTED へ戻す）"
    reason_rejected: "履歴の上書きが生じ、確定済みの run_id / parent_run_id 照会前提と整合しないため（CR が明示的に否定）"
