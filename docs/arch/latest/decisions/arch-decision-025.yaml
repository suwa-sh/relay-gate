schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-025"
title: "管理 DB に接続しない設定のハウスキープは、確報比較依頼と管理 DB の行を消さず、off 以外の期間に作られた実行を単位ごと残す。ハウスキープ設定の接続参照名は off では省略できる"
status: "approved"
generated_at: "2026-11-03T08:30:00Z"
context: |
  前段の要求仕様が 2026-11-03 に、管理 DB に接続しないとき(RAPID_CROSSCHECK_MODE=off で、ハウスキープ設定の管理 DB 接続参照名が無い・空)の
  ハウスキープの振る舞いを要求と受け入れ基準に加えた。管理 DB に接続せず、確報比較依頼と管理 DB の行を削除しない(起動のたびに warn を 1 行)。
  execution-spec.json に記録された速報クロスチェックのモードが off でない実行は、管理 DB に終わっていない構成要素があり得るため単位ごと残す(warn)。
  off の期間に作られた成果物だけの実行は従来の成果物だけの規則で判定する。これらの warn は終了コードに影響しない。
  RDRA は条件「ハウスキープの削除判定」の説明を、NFR は B.3.3.1 / F.1.2.1 の説明を同じ趣旨で更新した。
  アーキテクチャ設計の latest では、削除判定(SP-027)がこの場合の規則を持たず、ハウスキープ設定(E-028)の接続参照名が必須(nullable: false)になっていた。
decision: |
  - SP-027(ハウスキープの削除判定)に、管理 DB に接続しないときの規則を追記し、このときは既存の規則より優先する
  - SP-028(削除順序と回復)に、管理 DB に接続しないときは管理 DB の行の削除の段を行わず、その warn を失敗として扱わないことを追記する
  - ハウスキープ設定(E-028)の接続参照名を省略可能(nullable: true)にし、適用構成コンテキスト(BC-005)の語「ハウスキープ設定」に off では無し・空にできることを追記する
  - コンテキストマップ CM-013(ハウスキープ → 適用構成)に、ハウスキープが feature flag の RAPID_CROSSCHECK_MODE も読むことを追記する
  - warn の文言と設定のキー名は仕様(CLI 契約)で確定する。削除の所有(CTR-008)と専用 DB ロールの方針は変えない
consequences:
  positive:
    - "管理 DB を使わない設定でも、off 以外の期間に作られた実行を成果物だけで消して管理 DB 側の終わっていない構成要素を見落とす経路が無い"
    - "要求の受け入れ基準から ATDD のテストを作るときに、アーキテクチャ設計の削除判定と矛盾しない"
  negative:
    - "管理 DB に接続しない設定では確報比較依頼と管理 DB の行が残り続けるため、それらを消すには接続参照名を設定する必要がある"
alternatives_considered:
  - name: "管理 DB に接続しない設定ではハウスキープを起動エラーにする"
    reason_rejected: "off の期間に作られた成果物だけの実行は消せるべきであり、要求も warn で続行する振る舞いを定めているため"
  - name: "成果物だけで全実行を判定する"
    reason_rejected: "off 以外の期間に作られた実行は管理 DB に終わっていない構成要素があり得るため、成果物だけでは終端を判定できないため"
