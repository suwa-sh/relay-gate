schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-022"
title: "メール通知を廃止し、ハング検知の異常はハング検知ジョブ自身の終了結果と標準エラーで知らせる。通知済みの判定は監視記録(off では成果物ルート配下の通知済みの印)で行う"
status: "approved"
generated_at: "2026-11-01T12:30:00Z"
context: |
  前段の要求仕様・RDRA・NFR が 2026-11-01 にメール送信を廃止した。RDRA から外部システム「メール通知」と情報「通知メール」が削除され、
  条件「CLI とメールによる提示」は「CLI による提示」に改名され、情報「ハング検知定期ジョブ設定」からメールの 3 項目
  (通知先メールアドレス・送信コマンド・件名プレフィックス)が削除された。ハング検知は、その回の見回りで新たに見つけた異常を
  標準エラーに 1 件 1 行で出し、異常なしは正常終了、ハング疑いだけなら警告終了、実行エラー・比較異常が 1 件でもあれば失敗で終える
  (失敗の条件は利用者が確定)。運用者へはジョブスケジューラの既存のジョブ監視・障害通知で届く。通知済みの異常は再び知らせず、
  RAPID_CROSSCHECK_MODE=off では成果物ルート配下の通知済みの印(Runner Result の契約ファイルとは別、一時ファイル → リネーム)で判定し、
  保存に失敗した異常は次回も知らせる。方針資料(しくみ・利用イメージ)も同じ内容に書き換え済み。
  アーキテクチャ設計の latest には、技術スタックの「OS のメール送信コマンド」、提示方式「CLI と定期ジョブとメールだけ」、
  tier-ops のメール送信アダプタとメール設定の読み込み、通知メールのエンティティと ER、運用体制の「異常メール」、SLO の「日次メールサマリー」、
  外部接続アダプタ規則のメール通知が残っていた。
decision: |
  - technology_context からメール送信コマンドを外し、制約を「CLI と定期ジョブだけで動作し、異常の通知もハング検知ジョブの終了結果と
    標準エラーで行い、ジョブスケジューラの障害通知で届ける(CLI の出力以外の通知送信手段は持たない)」に改める
  - CTP-001 を「CLI と定期ジョブだけの提示(UI 画面・通知送信手段なし)」へ改名し、根拠を条件「CLI による提示」に差し替える
  - tier-ops の SP-018 / LP-017 / 各層の責務を、終了結果の決定(新たな異常なし=正常終了 / warning だけ=警告終了 / error が 1 件でも=失敗。
    具体的な終了コードは CLI 契約で確定)と標準エラー 1 件 1 行の出力、通知済みの除外、保存失敗時の再通知に改める。
    終了結果の決定表は他の判定表と同じく domain 層の純粋関数に置く
  - 通知済みの印はエンティティにしない(RDRA の情報ではなく監視記録の説明の一部)。監視記録の storage_mapping と tier-ops の
    repository / gateway の責務に、off 時の印の扱い(Runner Result とは別ファイル、一時ファイル → リネーム、置き場所とファイル名は仕様で確定)を記す
  - data_architecture から通知メール(E-022)とその storage_mapping を削除し、監視記録・ハング検知定期ジョブ設定の関連と、
    ハング検知定期ジョブ設定のメール 3 属性を削除する。ER 図から NOTIFICATION_MAIL を除く
  - CTR-003 から外部システム「メール通知」を外し、外部システム数を 5 種に改める。CTP-009(運用体制)・CTP-010(オブザーバビリティ)の
    メールの記述をジョブスケジューラの障害通知・既存監視へ改める
  - arch-decision-001〜021 は当時の文脈記録として書き換えない(メールに触れる記述は本決定で置き換えたものとして読む)
consequences:
  positive:
    - "運用者が既に見ているジョブスケジューラの障害通知に通知経路が一本化され、relay-gate にメール送信の設定・依存・失敗モードが無くなる"
    - "通知済みの判定と保存失敗時の再通知を arch で明記したことで、下流 spec が取りこぼしと重複通知の扱いを一意に書ける"
  negative:
    - "ハング検知ジョブの警告終了・失敗がジョブスケジューラの障害通知として届くため、運用側で業務ジョブの障害と区別できるようジョブ定義名などで識別する運用が必要になる"
    - "通知の詳細(対象・段階・経過時間)は標準エラーと監視記録で確認するため、運用者はジョブスケジューラのジョブログを開く手順を持つ必要がある"
alternatives_considered:
  - name: "メール送信アダプタを残し、設定で無効化できるようにする"
    reason_rejected: "要求と方針資料がメール送信の廃止を定めており、RDRA から外部システム「メール通知」が削除されたため。使わない経路を残すと設定契約と検証が複雑になる"
  - name: "異常があれば段階によらず失敗で終える"
    reason_rejected: "利用者がハング疑いだけなら警告終了、実行エラー・比較異常があれば失敗と確定しており、静観してよい warning と対処が要る error を運用者が区別できなくなるため"
  - name: "通知済みの印をデータモデルのエンティティとして追加する"
    reason_rejected: "RDRA の情報ではなく監視記録の説明の一部であり、arch で RDRA に無い情報を追加しない規則に反するため。storage_mapping と層の責務で扱う"
