          nullable: true
          primary_key: false
        - name: "work_dir"
          type: "string"
          description: "作業ディレクトリ(CSV 列 work_dir)"
          nullable: false
          primary_key: false
        - name: "script"
          type: "string"
          description: "実装スクリプトパス(CSV 列 script)"
          nullable: false
          primary_key: false
        - name: "fixed_params"
          type: "text"
          description: "固定引数(CSV 列 fixed_params。JSON 配列文字列を格納するセルで、二重引用符で囲みセル内の二重引用符は二重化する。空は [])"
          nullable: false
          primary_key: false
        - name: "hang_detect_limit_minutes"
          type: "integer"
