        - "SSH クライアント(リモート実行ホストへの実装スクリプト起動)"
        - "ローカル / 共有ファイルシステム(成果物ディレクトリ facade/<run_id>/)"
        - "RDB クライアント CLI(速報有効時のみ parallel_run を作成。接続先は速報クロスチェック設定の RAPID_DB_CONN_REF で解決)"
