          reason: "MCL product-cost-hints（オンプレミス資産運用観点）で示されたストレージ階層化ヒントを、データストアティア固有のポリシーとして採用する"
          source_model: "infra: docs/infra/latest/docs/mcl/product/output/product-cost-hints.yaml (hints[category=storage_tiering])"
          confidence: "medium"
      rules:
