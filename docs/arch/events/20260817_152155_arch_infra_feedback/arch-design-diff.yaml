technology_context:
  constraints:
    - "外部SaaS型の監視・アラーティングサービスはエアギャップ環境のため利用不可。閉域内監視基盤（ログ集約・可視化）の整備が前提となる（共有プラットフォーム未確定時は構造化ログ+logrotateによるローカル最小構成とする）"
system_architecture:
  cross_tier_policies:
    - id: "CTP-013"
      name: "SLI/SLOベースのオブザーバビリティ方針"
      description: "facadeエントリポイントの可用性SLI（月次99.9%）、p99レイテンシSLI（日次1秒以内）、日次確報クロスチェックの完了SLI（8時間以内）を定義し、エラーバジェット消化時は非緊急変更を凍結して原因調査を優先する運用方針とする。レイテンシSLOの閾値超過が継続する場合はリソース増強（スケールアップ）を検討する"
      reason: "MCL product-design（オンプレミス実装仕様）でSLI/SLOの具体値が定義されたため、arch レベルの横断方針として採用する。CTP-009（性能・拡張性の設計方針）を補完する運用ガバナンス方針"
      source_model: "infra: docs/infra/latest/docs/mcl/product/output/product-observability.yaml (sli / slo)"
      confidence: "medium"
  cross_tier_rules:
    - id: "CTR-006"
      name: "可用性・リストア運用手順の整備"
      description: "RDBのウォームスタンバイ切替、バックアップからのリストアはいずれもマネージド自動化機能を持たないため、手順書（フェイルオーバー手順・バックアップ/リストア手順）を整備し、定期的な復旧訓練で実効性を検証する"
      reason: "MCL product-mapping（オンプレミス）で availability_target・recovery_target・persistence が fidelity: partial（自動フェイルオーバー/自動リストア相当機能なし）と判定されたため、運用手順の整備を横断ルールとして明示する"
      source_model: "infra: docs/infra/latest/docs/mcl/product/output/product-mapping-onprem.yaml (fidelity: partial — availability_target, recovery_target, persistence)"
      confidence: "medium"
    - id: "CTR-007"
      name: "アラートしきい値・エスカレーションの統一方針"
      description: "facade/workerのヘルスチェック失敗はcritical（運用者へ即時通知）、実行異常終了率超過・ハング検知はhigh（運用者・障害調査担当者/移行運用責任者へ通知）、レイテンシp99超過はmedium（運用者へ通知）として重大度とエスカレーション先を統一する"
      reason: "MCL product-observability のアラート定義に基づき、全ティア共通のアラート重大度・エスカレーション方針を横断ルールとして明示する"
      source_model: "infra: docs/infra/latest/docs/mcl/product/output/product-observability.yaml (alerting.rules)"
      confidence: "medium"
  tiers:
    - id: "tier-datastore"
      name: "データストアティア"
      description: "execution-spec.json・Runner実行結果・速報/確報比較依頼・比較結果・ハング検知記録を保持する。RDBがジョブキュー（REQUESTED/CLAIMED/RUNNING等のlease管理）と管理DB（実行系譜の照会）を兼ねる"
      technology_candidates:
