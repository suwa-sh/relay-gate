          description: "オンプレミスサーバはN+1冗長（手動切替）、ネットワーク機器・回線は一部冗長化、ストレージはRAID5（パリティ）、電源はUPSによる冗長化を前提とする。CPU/メモリ/ストレージの拡張はスケールアップ（増設・交換）で対応する"
          reason: "エアギャップオンプレミスの物理/VMサーバであり、クラウドのような自動スケールアウトは想定しにくいため"
          source_model: "NFR A.2.3.1, NFR A.2.5.1, NFR A.2.6.2, NFR B.3.1.1, プロジェクト背景: エアギャップ環境のオンプレミスLinuxサーバ"
          confidence: "default"
        - id: "SP-012"
          name: "サービス切替時間"
          description: "RDBはコールドスタンバイ構成とし、障害時のサービス切替は60分未満で完了する運用手順を整備する"
          reason: "モデルシステム2のデフォルト値を適用（エアギャップオンプレのためクラウド補正なし）"
