        - "ファイルシステム（started-at.txt/stdout.log/stderr.log/exitcode.txt 等の実行ログ本体）"
      policies:
        - id: "SP-005"
          name: "実行系譜の一元管理"
          description: "run_id/parent_run_idをRDBの主要な相関キーとし、リラン時の系譜追跡を可能にする"
          reason: "システム概要に明記された実行系譜の追跡要件"
          source_model: "システム概要: 「run_id/parent_run_idによる実行系譜の追跡」"
          confidence: "high"
        - id: "SP-009"
          name: "バックアップ運用"
          description: "RDB・実行ログファイルはフル+差分バックアップ（日次）で保護し、7世代程度を保持する。execution-spec.json・実行結果ログ・速報/確報比較結果等の全データを対象とする"
