          name: "認証情報の非保存"
          description: "execution-spec.jsonには認証情報の参照名のみを保存し、実値（パスワード・鍵等）は保存しない"
          reason: "情報.tsvに明記された制約。エアギャップオンプレ環境でも機密情報の保管リスクを避ける"
