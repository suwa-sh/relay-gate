          description: "コールドスタンバイ拠点を用意し、RPO（前日の最終バックアップまで）・RTO（1営業日以内）を目標に業務継続を図る"
          reason: "確報クロスチェック結果がリリース判断の正本として利用されるため、業務継続の要否を明確化する必要がある"
          source_model: "NFR A.3.1.1, NFR A.3.1.2, NFR A.4.1.1, NFR A.4.1.2"
