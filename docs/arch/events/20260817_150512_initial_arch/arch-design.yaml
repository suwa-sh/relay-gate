          name: "foreground結果限定応答"
          description: "ジョブスケジューラへはforeground roleの標準出力・標準エラー・終了コードのみを応答し、background/rapid-crosscheckの実行状況は応答に含めない"
          reason: "既存ジョブスケジューラの契約（stdout/stderr/exitcode）を変えずに済ませるため"
