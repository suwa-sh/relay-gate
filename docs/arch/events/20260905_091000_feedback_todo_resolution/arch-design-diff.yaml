  storage_mapping:
    - entity_id: "E-001"
      storage_type: "file"
      reason: "feature flag は元資料の 9 キー(BLUE_MODE / GREEN_MODE / RAPID_CROSSCHECK_MODE / BLUE_IMPL / GREEN_IMPL / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER)を持つ env 形式の設定ファイルとして基盤適用設計者が版管理し、facade が起動のたびに読み込む。設定版キーは持たない"
      confidence: "high"
    - entity_id: "E-003"
      storage_type: "file"
      reason: "slot ジョブマップは 1 行目ヘッダーの CSV(列: job_id / host / user / work_dir / script / fixed_params / hang_detect_limit_minutes。credential_ref / map_version は末尾の任意列)として適用側が版管理する設定ファイル。fixed_params は JSON 配列文字列を二重引用符で囲んだセル(内部の二重引用符は二重化)で、bash 単独で解析する。run 開始時に execution-spec.json へ確定保存される"
      confidence: "high"
    - entity_id: "E-007"
      storage_type: "file"
      reason: "クロスチェックジョブマップは slot ジョブマップと同じ CSV 形式(1 行目ヘッダー、1 行 1 job_id、JSON 配列セルは二重引用符で囲む)で適用側が定義する設定ファイル"
      confidence: "high"
    - entity_id: "E-008"
      storage_type: "file"
      reason: "対象カタログは slot ジョブマップと同じ CSV 形式で適用側が版管理する定義ファイル。確報比較依頼は版だけを紐付ける(infra: product-mapping-onprem.yaml → config_storeのfidelity=exactで適合確認)"
      confidence: "high"
    - entity_id: "E-014"
      storage_type: "file"
      reason: "slot 実行の状態はファイル正本(exitcode.txt があれば SUCCEEDED / FAILED、無く aborted.txt があれば ABORTED、どちらも無ければ RUNNING)から導出し、RAPID_CROSSCHECK_MODE=off では成果物ファイルだけで実行・監視・中止・リランが成立する。abort-blue / abort-green は aborted.txt(中止日時 1 行)を一時ファイル → リネームで書く"
      confidence: "high"
    - entity_id: "E-014"
      storage_type: "rdb"
      reason: "RAPID_CROSSCHECK_MODE が foreground / background のときは mode / PID / 状態(ABORTED を含む)をファイル正本と同じ値で管理 DB にも保持し、abort-blue / abort-green と background-rerun の対象特定と運用者の参照に使う。二重マッピング(ファイル正本 + 速報有効時の管理 DB 複製)として確定する(条件「slot 実行の状態導出規則」)"
      confidence: "high"
    - entity_id: "E-021"
      storage_type: "rdb"
      reason: "監視記録は管理 DB(接続先はハング検知定期ジョブ設定の管理 DB 接続参照名)に保持し、monitor_status の 6 値と通知後・中止後の終端を含めて警告傾向の確認と hang_detect_limit_minutes の調整根拠にする。RAPID_CROSSCHECK_MODE=off ではファイルのみで監視し記録は実行ログに残す"
      confidence: "medium"
    - entity_id: "E-024"
      storage_type: "rdb"
      reason: "slot の中止指示の結果は成果物ディレクトリの aborted.txt(ファイル正本)に反映し、RAPID_CROSSCHECK_MODE が off 以外なら slot 実行 / parallel_run(STARTED / RUNNING)の ABORTED 更新として管理 DB にも反映する。比較依頼の中止は管理 DB の ABORTED 更新で反映する。指示者と応答は実行ログに残す"
      confidence: "high"
    - entity_id: "E-026"
      storage_type: "file"
      reason: "ハング検知定期ジョブ設定は env 形式の設定ファイル(ALERT_MAIL_TO / ALERT_MAIL_CMD / ALERT_SUBJECT_PREFIX / HANG_DB_CONN_REF)として基盤適用設計者が所有し、hang-detector が起動のたびに読み込む。認証情報は参照名のみ"
      confidence: "high"
  diagram_mermaid: |
    erDiagram
      FEATURE_FLAG ||--o{ SLOT_RUNNER_ASSIGNMENT : owns
      SLOT_RUNNER_ASSIGNMENT ||--|| JOB_MAP : refers
      JOB_MAP ||--o{ HANG_DETECT_LIMIT : owns
      JOB_MAP ||--o{ EXECUTION_SPEC : resolved_into
      CROSSCHECK_JOB_MAP ||--o{ COMPARISON_DEFINITION : holds
      CROSSCHECK_JOB_MAP ||--|| TARGET_CATALOG : refers
      JOB_LAUNCH_REQUEST ||--|| PARALLEL_RUN : starts
      PARALLEL_RUN ||--|| EXECUTION_SPEC : refers
      PARALLEL_RUN ||--o{ SLOT_EXECUTION : has
      PARALLEL_RUN o|--o| PARALLEL_RUN : parent_run_id
      SLOT_EXECUTION ||--|| RUNNER_RESULT : outputs
      RUNNER_RESULT ||--o| SCHEDULER_RESPONSE : relayed_as
      SLOT_EXECUTION ||--o| COMPLETION_NOTICE : sends
      COMPLETION_NOTICE }o--|| RAPID_RUN : aggregated_into
      PARALLEL_RUN ||--o| RAPID_RUN : correlates
      RAPID_RUN ||--o| RAPID_CROSSCHECK_REQUEST : requests
      RAPID_CROSSCHECK_REQUEST }o--|| COMPARISON_DEFINITION : follows
      RAPID_CROSSCHECK_REQUEST ||--o{ COMPARISON_RESULT : produces
      RAPID_CROSSCHECK_REQUEST ||--o| TOOL_RESULT : stores
      TARGET_CATALOG ||--o{ FINAL_CROSSCHECK_REQUEST : versioned_for
      FINAL_CROSSCHECK_REQUEST ||--o| TOOL_RESULT : stores
      FINAL_CROSSCHECK_REQUEST ||--o| SCHEDULER_RESPONSE : relayed_as
      SLOT_EXECUTION ||--o{ MONITOR_RECORD : monitored_by
      RAPID_CROSSCHECK_REQUEST ||--o{ MONITOR_RECORD : monitored_by
      MONITOR_RECORD ||--o{ NOTIFICATION_MAIL : sends
      HANG_DETECTOR_CONFIG ||--o{ NOTIFICATION_MAIL : addresses
      FEATURE_FLAG ||--o{ EXECUTION_SPEC : impl_version
      APPLICATION_DOCUMENT ||--o{ HANG_DETECT_LIMIT : adjustment_records
      EXECUTION_SPEC ||--o{ RERUN_INSTRUCTION : restored_from
      RERUN_INSTRUCTION ||--|| PARALLEL_RUN : creates
      ABORT_INSTRUCTION }o--o| SLOT_EXECUTION : aborts
      ABORT_INSTRUCTION }o--o| RAPID_CROSSCHECK_REQUEST : aborts
      ABORT_INSTRUCTION }o--o| FINAL_CROSSCHECK_REQUEST : aborts
      EXECUTION_LOG }o--o| PARALLEL_RUN : traces
