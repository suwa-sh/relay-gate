system_architecture:
  cross_tier_policies:
    - id: "CTP-006"
      name: "冪等性方針"
      description: "background側リランおよび比較依頼の再実行は、元のexecution-spec.json（run共通実行設定+slot別実行設定）を保ったまま、新しいrun_idを発行しparent_run_idで元runに関連付けた新規runとして実行する。既存runのレコード・状態・履歴は変更しない。RDBのlease/claim機構とrun_id/parent_run_idの相関により、同一対象への重複起動を検知・防止する"
      reason: "ユーザー指定: 再実行は新run_id発行+parent_run_id関連付け・既存履歴不変とする再実行identity（CR-6078c4ed-003）に、RDRA状態遷移（新規作成遷移）と整合してアーキテクチャ方針を一意化するため"
      source_model: "BUC: background側リランフロー「元のexecution-spec.jsonの実行設定を保ったまま再実行する」, 状態: background slot実行状態, 速報比較依頼状態（再実行の新規作成遷移）"
      confidence: "user"
