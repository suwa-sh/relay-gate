domain_architecture:
  bounded_contexts:
    - id: "BC-001"
      name: "実行管理コンテキスト"
      ubiquitous_language:
        - term: "run"
          definition: "facadeが起動する1回のslot実行の単位。run_idで一意に識別され、parent_run_idでリラン系譜を追跡する。再実行は新しいrun_idの新規runとして作成しparent_run_idで元runに関連付け、既存runのレコード・履歴は変更しない"
        - term: "slot"
          definition: "blue実装またはgreen実装のうち、facadeが起動する実装系統（slot種別: blue/green）"
        - term: "role"
          definition: "slot runnerが担う実行役割（foreground: ジョブスケジューラへの応答対象、background: 非同期実行、rapid-crosscheck: 速報比較専用）"
        - term: "実行設定"
          definition: "execution-spec.jsonに起動時解決済みで一度だけ確定・保存される実行設定。run共通部（JOB_ID・追加引数・マップ版・hang_detect_limit_minutes等）とslot別実行設定に分離して保持し、リラン時の復元基準となる"
        - term: "slot別実行設定"
          definition: "blue/green各slotに対して起動時に一度だけ確定される実行設定（ホスト・実行ユーザー・スクリプト・作業ディレクトリ・固定引数・実装版・認証情報参照名）。slotごとにhost・impl_version等が異なる並行稼働を表現する"
        - term: "attempt（起動試行）"
          definition: "slotのroleに対する1回の起動試行。attempt_idで一意に識別し、attempt_noを同一（run_id, slot, role）内の連番として管理する。実行状態STARTING/RUNNING/SUCCEEDED/FAILED/UNKNOWN/ABORTEDを遷移し、timeout後は推測でFAILEDを確定せずUNKNOWNとする"
      related_subdomain_id: "SD-001"
      owned_entity_ids:
        - "E-001"
        - "E-002"
        - "E-007"
      owned_buc_ids:
        - "並行稼働実行フロー"
      team_ownership: null
      reason: "execution-spec.json（run共通）・slot別実行設定・Runner実行結果（起動試行）の3エンティティに閉じた独立の状態モデル（background slot実行状態）を持ち、他コンテキストからはrun_idで相関参照されるのみで属性を共有しない言語境界がある"
      source_model: "情報: execution-spec.json, Runner実行結果（コンテキスト列=実行管理）, 状態: background slot実行状態"
      confidence: "medium"
