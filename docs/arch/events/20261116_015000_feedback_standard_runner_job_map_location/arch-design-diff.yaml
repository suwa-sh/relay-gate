          description: "usecase 層が run_id 付きの実行ログ(スクリプト名 / run_id / 日時 / レベル / メッセージ)をファイルへ出力する集約ポイントとする。gateway は外部呼び出し(SSH / RDB / 比較ツール)の開始・終了・所要時間・成否を記録し、失敗は技術例外として非 0 で返す。domain 層はログを出さない。ログ出力先は stdout / stderr を汚さない専用ファイルとする。ログの日時はホストのローカルタイムゾーン(プロセスの TZ 環境変数に従う)で ISO 8601 秒精度、タイムゾーン指示子(Z / オフセット)なしとし、run_id の時刻部と同じ時刻軸にそろえる。UTC への統一は行わない。管理 DB の *_at 列は RDB のタイムスタンプ型に委ね、CLI が stdout に表示する日時もローカル時刻で出す。テスト用の時刻注入(RELAY_GATE_NOW)は UTC の Z 付きで受け付け、内部でローカル時刻へ変換してから使う。この方針は全ティアの実行ログ方針に共通し(CLP-004 / CLP-006 が参照)、tier-ops の運用操作記録(CLP-008)も同じ日時規則に従う"
          reason: "利用者指定: run_id の時刻部(ローカルタイムゾーン)と実行ログの日時を同じ時刻軸にそろえ、障害調査で運用者が時差を読み替えずに突き合わせられるようにする。NFR C.6.1.1(ログ保管)・C.3.1.1(自動記録)・E.7.1.1(監査)への対応"
          source_model: "情報: 実行ログ, 並行稼働実行(parallel_run), NFR C.6.1.1, NFR C.3.1.1, NFR E.7.1.1"
          confidence: "high"
      cross_layer_rules:
        - id: "CLR-001"
          name: "エラーハンドリングと終了コード"
          description: "set -euo pipefail を基本とし、domain / repository / gateway のエラーは usecase で 1 回だけログ出力して presentation へ返し、presentation が終了コードを決める。catch の握り潰しと多重ログを禁止する"
          reason: "レイヤー責務の分離。一般的なベストプラクティスとして適用"
          source_model: "なし"
          confidence: "default"
      diagram_mermaid: |
        graph TD
          P[presentation: facade.sh / runner CLI] --> U[usecase: slot 起動フロー]
          U --> D[domain: 判定表・状態遷移]
          U --> R[repository: parallel_run / execution-spec / Runner Result / 設定]
          R --> D
          R --> G[gateway: SSH / filesystem / RDB / completed 通知]
data_architecture:
  entities:
    - id: "E-001"
      name: "feature flag 設定"
      source_info: "情報: feature flag 設定"
      model_type: "resource_mutable"
      attributes:
        - name: "blue_mode"
          type: "string"
          description: "BLUE_MODE: blue slot 実行モード(foreground / background / off)"
          nullable: false
          primary_key: false
        - name: "green_mode"
          type: "string"
          description: "GREEN_MODE: green slot 実行モード(foreground / background / off)"
          nullable: false
          primary_key: false
        - name: "rapid_crosscheck_mode"
          type: "string"
          description: "RAPID_CROSSCHECK_MODE(foreground / background / off)。foreground / background は runner が完了通知を送信し速報管理 DB へ書き込む。off は完了通知を送信せず速報管理 DB へ接続も書込みもしない"
          nullable: false
          primary_key: false
        - name: "blue_impl"
          type: "string"
          description: "BLUE_IMPL: blue の実装版(execution-spec.json の実装版の出所)"
          nullable: false
          primary_key: false
        - name: "green_impl"
          type: "string"
          description: "GREEN_IMPL: green の実装版(execution-spec.json の実装版の出所)"
          nullable: false
          primary_key: false
        - name: "blue_runner"
          type: "string"
          description: "BLUE_RUNNER: blue runner 実体スクリプトパス(relay-gate が提供する標準の slot runner、または利用者が自作した runner)"
          nullable: false
          primary_key: false
        - name: "green_runner"
          type: "string"
          description: "GREEN_RUNNER: green runner 実体スクリプトパス(relay-gate が提供する標準の slot runner、または利用者が自作した runner)"
          nullable: false
          primary_key: false
        - name: "rapid_crosscheck_runner"
          type: "string"
          description: "RAPID_CROSSCHECK_RUNNER: slot runner が完了通知(blue-completed / green-completed)を送る速報クロスチェック runner の実体パス"
          nullable: false
          primary_key: false
        - name: "rapid_crosscheck_worker"
          type: "string"
          description: "RAPID_CROSSCHECK_WORKER: 速報クロスチェック worker の実体パス"
          nullable: false
          primary_key: false
        - name: "blue_job_map_location"
          type: "string"
          description: "blue 用の slot ジョブマップの場所(任意のキー。キー名は仕様で確定する)。無い・空なら設定ファイル置き場の固定の名前(blue-job-map.csv)を使う。絶対パスと相対パスを受け付け、相対パスの基準は feature flag の設定ファイルがあるディレクトリ"
          nullable: true
          primary_key: false
        - name: "green_job_map_location"
          type: "string"
          description: "green 用の slot ジョブマップの場所(任意のキー。キー名は仕様で確定する)。無い・空なら設定ファイル置き場の固定の名前(green-job-map.csv)を使う。絶対パスと相対パスを受け付け、相対パスの基準は feature flag の設定ファイルがあるディレクトリ"
          nullable: true
          primary_key: false
      relationships:
        - target_entity: "E-002"
          type: "1:N"
          description: "feature flag が slot ごとの runner 割当(BLUE_RUNNER / GREEN_RUNNER)と、対応するジョブマップの所在(任意のキー)を所有する"
        - target_entity: "E-003"
          type: "1:N"
          description: "任意のキーで slot ごとのジョブマップの場所を指定する(無い・空なら固定の名前)"
        - target_entity: "E-010"
          type: "1:N"
          description: "BLUE_IMPL / GREEN_IMPL が execution-spec の実装版として確定保存される"
    - id: "E-002"
      name: "slot runner 割当"
      source_info: "情報: slot runner 割当"
      model_type: "resource_scd2"
      attributes:
        - name: "slot"
          type: "string"
          description: "slot(blue / green)"
          nullable: false
          primary_key: true
        - name: "runner_script_path"
          type: "string"
          description: "runner 実体スクリプトパス(relay-gate が提供する標準の slot runner、または利用者が自作した runner)"
          nullable: false
          primary_key: false
        - name: "job_map_location"
          type: "string"
          description: "対応するジョブマップの所在(feature flag の任意のキーで指定。無い・空なら設定ファイル置き場の固定の名前)"
          nullable: false
          primary_key: false
      relationships:
        - target_entity: "E-003"
          type: "1:1"
          description: "slot の runner が参照するジョブマップ"
    - id: "E-005"
