      source_info: "情報: 適用構成文書"
      model_type: "resource_mutable"
      attributes:
        - name: "project_id"
          type: "string"
          description: "案件識別"
          nullable: false
          primary_key: true
        - name: "document_version"
          type: "string"
          description: "文書版"
          nullable: false
          primary_key: true
        - name: "external_if_policy"
          type: "text"
          description: "外部 IF の送受信方針"
          nullable: true
          primary_key: false
        - name: "network_constraints"
          type: "text"
          description: "ネットワーク制約"
          nullable: true
          primary_key: false
        - name: "host_placement"
          type: "text"
          description: "ホスト配置・実行ユーザー方針・DB セグメント構成"
          nullable: true
          primary_key: false
        - name: "runner_location"
          type: "text"
          description: "runner 実体の所在(relay-gate が提供する標準の slot runner の割り当て、または自作した runner の所在)"
          nullable: true
          primary_key: false
        - name: "hang_limit_adjustment_records"
          type: "text"
          description: "運用者の hang_detect_limit_minutes 調整記録(job_id / role ごとの調整日時と、調整根拠となる警告時経過時間)"
          nullable: true
          primary_key: false
      relationships:
        - target_entity: "E-003"
          type: "1:N"
          description: "案件固有事項がジョブマップ定義の根拠となる"
        - target_entity: "E-004"
          type: "1:N"
          description: "ハング検知上限の調整記録を保持する"
  storage_mapping:
    - entity_id: "E-001"
      storage_type: "file"
      reason: "feature flag は元資料の 9 キー(BLUE_MODE / GREEN_MODE / RAPID_CROSSCHECK_MODE / BLUE_IMPL / GREEN_IMPL / BLUE_RUNNER / GREEN_RUNNER / RAPID_CROSSCHECK_RUNNER / RAPID_CROSSCHECK_WORKER)に、slot ジョブマップの場所を書く任意の 2 キー(キー名は仕様で確定する)を加えた env 形式の設定ファイルとして基盤適用設計者が版管理し、facade が起動のたびに読み込む。任意の 2 キーを書かない 9 キーだけの設定はそのまま通る。設定版キーは持たない"
      confidence: "high"
    - entity_id: "E-002"
      storage_type: "file"
      reason: "runner 割当は feature flag 設定ファイル内の BLUE_RUNNER / GREEN_RUNNER として所有される。割り当てる実体は、relay-gate が提供する標準の slot runner のスクリプトファイルか、利用者が自作した runner のスクリプトファイル。対応するジョブマップの所在も feature flag 設定ファイル内の任意のキーとして所有される(無い・空なら固定の名前)"
      confidence: "high"
    - entity_id: "E-003"
      storage_type: "file"
      reason: "slot ジョブマップは 1 行目ヘッダーの CSV(列: job_id / host / user / work_dir / script / fixed_params / hang_detect_limit_minutes。credential_ref / map_version は末尾の任意列)として適用側が版管理する設定ファイル。置き場所は feature flag の任意のキーで指定でき、無い・空なら設定ファイル置き場の固定の名前を使う。fixed_params は JSON 配列文字列を二重引用符で囲んだセル(内部の二重引用符は二重化)で、bash 単独で解析する。run 開始時に execution-spec.json へ確定保存される"
      confidence: "high"
