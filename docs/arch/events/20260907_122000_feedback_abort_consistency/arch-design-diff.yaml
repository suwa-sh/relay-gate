        - target_entity: "E-016"
          type: "1:1"
          description: "速報実行から作成される"
        - target_entity: "E-018"
          type: "1:N"
          description: "比較結果を生む"
        - target_entity: "E-006"
          type: "N:1"
          description: "job_id ごとの比較定義に従う"
        - target_entity: "E-027"
