system_architecture:
  tiers:
    - id: "tier-facade"
      name: "facade実行ティア"
      description: "ジョブスケジューラからJOB_IDと追加引数を受け取り、feature flag設定に基づきblue/greenのslotを選択・起動し、foreground roleの標準出力・標準エラー・終了コードのみをジョブスケジューラへ応答するCLIエントリポイント。BC-001（実行管理）を実装する"
      technology_candidates:
        - "CLI実行基盤（シェルスクリプト）"
        - "SSH（対象実装の起動・作業ディレクトリ制御）"
      policies:
        - id: "SP-001"
          name: "ジョブ定義非変更の原則"
          description: "facadeは既存ジョブスケジューラのジョブ定義（起動コマンド・引数形式）を変更せずに追加導入し、JOB_IDと追加引数のみを入力として受け取る"
          reason: "ジョブ定義を変更せずに既存実装（blue）と新実装（green）を並行稼働・段階的に切替える strangler facade パターンの前提"
          source_model: "システム概要: 「ジョブスケジューラのジョブ定義を変更せず」, NFR D.3.1.1"
          confidence: "high"
        - id: "SP-002"
          name: "foreground結果限定応答・終了コード透過"
          description: "ジョブスケジューラへはforeground roleの標準出力・標準エラー・終了コードのみを応答し、background/rapid-crosscheckの実行状況は応答に含めない。foregroundのexitcode.txtの値は0を含む全値をそのまま透過し、relay-gate側で丸めたり再割り当てしたりしない"
          reason: "既存ジョブスケジューラの契約（stdout/stderr/exitcode）を変えずに済ませるため。業務ジョブの終了コード分岐が既存ジョブ直接実行時と互換であることを保つ"
          source_model: "BUC: 並行稼働実行フロー「foreground roleの標準出力・標準エラー・終了コードを応答する」, 条件: relay-gateエラーの退避終了コード"
          confidence: "high"
      rules:
        - id: "SR-001"
          name: "排他的foreground制約"
          description: "BLUE_MODEとGREEN_MODEを同時にforegroundにする組み合わせを起動前に検証し拒否する"
          reason: "条件.tsvで明示された制約"
          source_model: "条件: feature flag設定（BLUE_MODE/GREEN_MODE/RAPID_CROSSCHECK_MODE）"
          confidence: "high"
        - id: "SR-005"
          name: "対応OS限定・Web UI非対応"
          description: "facadeは単一OS（Linux）上でのシェルスクリプト実行のみをサポートする。Web UIを持たないためブラウザ対応・WAF・Webアプリケーション対策は対象外とする"
          reason: "デプロイ先がエアギャップ環境のオンプレミスLinuxサーバに限定され、Web UIを持たないCLI/バッチ運用が中心であるため"
          source_model: "NFR F.1.1.1, NFR F.1.1.2, NFR E.10.1.1, プロジェクト背景: エアギャップ環境のオンプレミスLinuxサーバ, Web UIを持たないCLI/バッチ運用"
          confidence: "high"
        - id: "SR-006"
          name: "relay-gateエラーの退避終了コード分離"
          description: "relay-gate自身のエラーは業務ジョブの終了コードと区別するため退避終了コードで応答する。実行結果未確定・取得不能・中止済み（UNKNOWN/ABORTEDを含む）は125、relay-gateのバリデーションエラーは124とし、bashが自動生成する126（実行不可）・127（コマンド未検出）とは衝突させない。UNKNOWNを推測でFAILED相当の業務終了コードへ変換しない。relay-gateエラー時の標準エラーには、取得可能な場合のforeground stderr.logの内容とrelay-gate自身のエラー内容（原因と次アクション）を併記して応答する"
          reason: "終了コードを透過する前提では、relay-gate自身の異常と業務ジョブの非0終了が同じ値で区別できなくなるため、業務ジョブが通常使用しない値を予約して分離する必要がある。UNKNOWNの推測確定を禁じる実行状態方針（AG-002）とも整合させる"
          source_model: "条件: relay-gateエラーの退避終了コード, BUC: 並行稼働実行フロー「foreground roleの標準出力・標準エラー・終了コードを応答する」, 情報: Runner実行結果（実行状態 UNKNOWN/ABORTED）"
          confidence: "high"
