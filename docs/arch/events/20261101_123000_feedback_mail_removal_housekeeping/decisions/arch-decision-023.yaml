schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-023"
title: "ハウスキープ(housekeep.sh)を tier-ops に置き、独立したハウスキープコンテキスト(generic)とする。削除は置き場への rename → 成果物削除 → 管理 DB の行の 1 トランザクション削除の順で、専用 DB ロールだけが行う"
status: "approved"
generated_at: "2026-11-01T12:30:00Z"
context: |
  前段の要求仕様・RDRA が 2026-11-01 にハウスキープを新設した。RDRA には独立した業務「ハウスキープ業務」(利用者確定)、
  BUC「ハウスキープフロー」、情報「ハウスキープ設定」(保持日数。既定 90 日、専用 DB ロールの接続参照名。ファイル名・キー名は仕様で確定)、
  条件「ハウスキープの削除判定」「ハウスキープの削除順序と回復」が追加された。housekeep.sh は 1 日 1 回の定期ジョブで、
  リランの親子をまとめた実行の単位と確報比較依頼ごとに、すべての構成要素が終端し最も遅い終了日時から保持日数を過ぎたものだけを削除する。
  成果物は削除待ちの置き場へ rename してから削除し、その後に管理 DB の行を 1 トランザクションで削除する。DB の削除はハウスキープ専用ロール
  (対象テーブルの SELECT と DELETE だけ)で行い、業務用ロールに DELETE を足さない。方針資料は C1 にハウスキープを独立要素として置く。
  アーキテクチャ設計の latest には、CTR-006 に「保持期間超過分削除の手動手順」(自動化なし前提)が残り、速報・確報のモデル所有規則
  (SR-003 / SR-004)は作成・更新の所有だけを定めて削除を扱っていなかった。実装 tier は bootstrap で 4 つ(facade / rapid-crosscheck /
  final-crosscheck / ops)に確定しており、管理 DB のスキーマ所有(datastore_owner)は tier-ops である。
decision: |
  - 配置: housekeep.sh は tier-ops に置く。ジョブスケジューラの定期ジョブとして facade から分離され、成果物ルートと管理 DB を走査する運用スクリプトという
    形が hang-detector と同じで、管理 DB の所有ティアも tier-ops のため。新しい tier は作らない(bootstrap 済みの tier 構成・契約への波及を避ける)
  - ドメイン: サブドメイン SD-005「実行履歴のハウスキープ」(generic)と BC-006「ハウスキープコンテキスト」を新設し、tier-ops に同居させる。
    RDRA が独立業務とし、行を削除する責務が実行監視・復旧コンテキストの不変条件(監視は通知のみ、中止は状態更新のみ)と相容れないため統合しない。
    BC-006 は永続エンティティを持たず、ハウスキープ設定(E-028)は他の設定と同じく適用構成コンテキスト(BC-005)が所有する。
    コンテキストマップは BC-006 から BC-001〜BC-005 への Conformist(各 BC の状態・成果物契約に従って判定し、状態を変えない)とする
  - 削除判定(SP-027): 削除の単位・終端条件・最も遅い終了日時(開始日時は使わない)・off で管理 DB の行が無い実行の成果物だけの判定・
    判定不能時の残置と warn・確報比較依頼の依頼ごとの判定を、domain 層の純粋関数の判定表とする
  - 削除順序と回復(SP-028 / LP-025 / LP-026): 置き場の残りを無条件削除 → 単位ごとに成果物を同一ファイルシステム内の rename で置き場へ移して削除 →
    管理 DB の行を専用ロールで 1 トランザクション削除、の順を守る。DB 行が残っている限り次回の走査で再発見し、既に無いファイルは削除済みとして扱う
  - 権限と所有(CTR-008 / CTP-002): 管理 DB の行と成果物を削除するのは housekeep だけとし、SR-003 / SR-004 の作成・更新の所有は変えず、
    保持日数を過ぎた終端済みの行の削除だけを例外として housekeep に許す。業務用ロールのアダプタには DELETE を実装しない
  - データモデル: arch-decision-007 の event / event_snapshot のイミュータブル性は保持期間内の追記・状態遷移について保ち、
    保持期間後の物理削除はハウスキープの削除単位でだけ行う例外として扱う
  - CTR-006 の「保持期間超過分削除の手動手順」をハウスキープによる自動削除へ改める。ハウスキープの対象外である実行ログの手動ローテーション(3 ヶ月)は残す
  - validate-config.sh の検証対象(CTR-007)にハウスキープ設定(保持日数が正の整数)を加える。期限切れで成果物が消えた実行のリランは
    元の execution-spec.json が無いことをエラーとして返す(SP-020)
  - ファイル名・キー名・置き場の場所・失敗後に残りの単位を続けるか・終了コードの値は仕様で確定する(arch では決めない)
consequences:
  positive:
    - "成果物と管理 DB の量が保持日数分で頭打ちになり、ストレージ拡張性(NFR B.3.3.1)の見積もりが保持日数で行える"
    - "削除の所有と専用ロールをクロスティアで一意に定めたため、業務スクリプトの誤りで履歴が消える経路が無い"
    - "置き場への rename と単位ごとのトランザクションで、途中失敗後も次回の実行で同じ結果に収束する"
  negative:
    - "tier-ops に監視・復旧とハウスキープの 2 コンテキストが同居するため、実装時にディレクトリと関数接頭辞でコンテキストを分ける配慮が要る"
    - "保持日数を過ぎた実行の relay-gate 側の記録は消えるため、それより長い追跡はジョブスケジューラの実行履歴に頼る(NFR E.7.1.1)"
alternatives_considered:
  - name: "新しい tier(tier-housekeep)を作る"
    reason_rejected: "bootstrap で確定した 4 tier・契約・uc-map への波及が大きく、hang-detector と同じ形の運用スクリプトを分ける利点が小さいため"
  - name: "tier-datastore に置く"
    reason_rejected: "tier-datastore はデータストア(管理 DB・成果物・設定)の論理ティアで実行可能なスクリプトを持たないため"
  - name: "BC を新設せず実行監視・復旧コンテキスト(BC-004)へ統合する"
    reason_rejected: "RDRA が独立業務とした(利用者確定)うえ、行を削除する責務が BC-004 の不変条件(監視は通知のみ・中止は状態更新のみ)と相容れないため"
  - name: "業務用ロールに DELETE を足して housekeep も同じ接続を使う"
    reason_rejected: "条件「ハウスキープの削除順序と回復」と方針資料が専用ロールを定めており、業務スクリプトから行を消せる経路を作らないため"
