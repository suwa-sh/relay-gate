schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-024"
title: "relay-gate は実行ログを整理しない。実行ログは設置環境の OS 標準のログ整理(logrotate)で 3 か月保管する(arch-decision-023 の「実行ログの手動ローテーションは残す」を改める)"
status: "approved"
generated_at: "2026-11-03T08:30:00Z"
context: |
  arch-decision-023(2026-11-01)はハウスキープの新設にあわせて、ハウスキープの対象外である実行ログについて
  「ファイル領域での手動ローテーション(3 ヶ月)は残す」と決め、クロスティアルール CTR-006 も運用手順書の手動手順に
  「実行ログのローテーション」を挙げていた。一方でインフラ設計は、OS 標準の logrotate を「日次ローテーション・90 世代保持・圧縮」で
  配置しており(relay-gate-runtime ロールの /etc/logrotate.d/relay-gate)、実行ログは約 3 か月で自動的に消える。
  「手動」の記述を読んだ実装者や運用者が logrotate とは別に手作業の整理手順を作りうる状態で、正本どうしで実行ログの整理方法が
  食い違っていた。利用者は 2026-11-03 に、実行ログをハウスキープの対象にせず logrotate に任せることを確認した。
decision: |
  - relay-gate(どのスクリプトも)は実行ログを整理・削除しない。実行ログの整理は設置環境の OS 標準のログ整理(logrotate)に任せ、3 か月保管する
  - CTR-006 の「ハウスキープの対象外である実行ログはファイル領域での手動ローテーション(3 ヶ月保管)とする」を上記の趣旨に改め、
    運用手順書に明記する手動手順の列挙から「実行ログのローテーション」を外す(ホスト追加・障害復旧の手動手順とハウスキープ定期ジョブの登録手順は残す)
  - 実行ログをハウスキープの対象にしない規則と、保管期間 3 か月(NFR C.6.1.1)は変えない
  - logrotate の設定の配置はインフラ設計のまま維持する(本判断は配置を変えない)
  - arch-decision-023 は過去の判断の記録として書き換えず、その「実行ログの手動ローテーションは残す」の 1 項目だけを本判断で改める(023 のほかの決定は有効)
consequences:
  positive:
    - "実行ログの整理方法がアーキテクチャ設計・インフラ設計・仕様で 1 つにそろい、手作業の整理手順が別に作られることを防げる"
    - "relay-gate のスクリプトに実行ログの削除処理を持たないため、ハウスキープの責務(成果物と管理 DB の行の削除)が広がらない"
  negative:
    - "実行ログの保管期間は設置環境の logrotate の設定に依存する。設置時に logrotate の配置が漏れると実行ログが溜まり続けるため、インフラの構成手順での配置確認が要る"
alternatives_considered:
  - name: "手動ローテーションのまま残す(現状維持)"
    reason_rejected: "インフラ設計が既に logrotate を配置しており、正本どうしで整理方法が食い違ったままになるため。利用者も logrotate に任せることを確認した"
  - name: "実行ログもハウスキープの対象にする"
    reason_rejected: "実行ログをハウスキープの対象にしない規則は変えない前提であり、OS 標準機能で足りる整理を relay-gate に実装する利点が無いため"
