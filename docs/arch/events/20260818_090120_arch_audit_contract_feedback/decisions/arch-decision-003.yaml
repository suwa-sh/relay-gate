schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-003"
title: "slot起動監査イベントをRDBへappend-onlyで記録する"
status: "approved"
generated_at: "2026-08-18T09:01:20"
context: |
  feature flag設定に基づくslot起動について、CLIのstdout契約を変更せず、操作受付からslot別の起動結果・
  最終状態までを一貫して追跡できる監査証跡が必要である。NFR E.7.1.1は操作ログと改ざん検知を要求し、
  NFR C.6.1.1はログ保持期間を6ヶ月としている。run_id/parent_run_idによる既存の実行系譜とも統合する必要がある。
decision: |
  slot起動監査イベントはRDBのappend-only監査ログへ追記し、ハッシュチェーンで欠損・改ざんを検知する。
  操作受付、slotごとの起動試行、成功、失敗、timeout、最終状態を同一schemaで記録し、run_id、
  parent_run_id、slot、attempt_idで相関・照合する。保持期間は6ヶ月とする。外部slot起動前に監査イベントを
  書けない場合は起動を中止し、外部作用後の結果記録に失敗した場合は結果を保持して再試行する。
  認証情報、起動引数の実値、stdout/stderr本文は記録しない。confidenceはuserとする。
consequences:
  positive:
    - "slot起動の因果関係をrun_id/parent_run_idで既存監査ログと一元照会できる"
    - "append-onlyとハッシュチェーンにより監査イベントの欠損・改ざんを検知できる"
    - "CLIのstdout/stderr/exitcode契約を変更せず監査証跡を追加できる"
  negative:
    - "ハッシュチェーン検証と外部作用後の監査記録再試行を実装・運用する必要がある"
    - "6ヶ月分の監査イベント用RDB容量と定期的な整合性検証が必要になる"
alternatives_considered:
  - name: "RDB append-only + DB権限制御のみ"
    reason_rejected: "正規権限を悪用した更新・削除の検知力がNFR E.7.1.1の改ざん検知要求に対して弱いため"
  - name: "追記専用ファイル + チェックサム"
    reason_rejected: "run_id横断照会と既存audit_logsとの一元管理に追加索引・運用が必要になるため"
