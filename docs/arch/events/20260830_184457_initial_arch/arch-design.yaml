          confidence: "high"
        - id: "SP-007"
          name: "execution-spec の一度きりの確定保存"
          description: "run 開始時(並行稼働実行の STARTED 遷移時)に解決済みの実行設定・追加引数・マップ版・実装版・role ごとの hang_detect_limit_minutes を facade/<run_id>/execution-spec.json として一時ファイル経由で一度だけ保存する。以後ジョブマップを変更しても上書きしない。認証情報は値を保存せず参照名だけを保存する"
