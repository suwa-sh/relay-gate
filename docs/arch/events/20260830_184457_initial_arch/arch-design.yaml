              name: "応答の無加工中継"
              description: "presentation は foreground の stdout.log / stderr.log / exitcode.txt を加工せず中継する。background slot と速報の結果は応答に反映しない"
              reason: "条件「ジョブスケジューラ応答の決定」への対応"
              source_model: "条件: ジョブスケジューラ応答の決定, 情報: ジョブスケジューラ応答"
