          source_model: "条件: 実行設定の確定条件, 認証情報の非保存, 情報: 実行設定(execution-spec), NFR E.5.1.1, NFR E.6.1.1"
          confidence: "high"
        - id: "SP-008"
          name: "速報クロスチェック有効判定と完了通知の系統独立"
          description: "RAPID_CROSSCHECK_MODE=on のときのみ facade が run_id を発行して parallel_run を作成し、runner は完了時に自系統の公開 function(blue-completed / green-completed)で run_id・job_id・結果を通知する。off のときは完了通知を送らず、速報管理 DB へ接続も書き込みもせず parallel_run も作成しない。runner は相手側の状態や比較依頼の要否を判断しない"
