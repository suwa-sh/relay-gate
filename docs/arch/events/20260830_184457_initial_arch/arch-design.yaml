  storage_mapping:
    - entity_id: "E-001"
      storage_type: "file"
      reason: "feature flag は env 形式の設定ファイルとして基盤適用設計者が版管理し、facade が起動のたびに読み込む"
      confidence: "high"
    - entity_id: "E-002"
      storage_type: "file"
      reason: "runner 割当は feature flag 設定ファイル内の BLUE_RUNNER / GREEN_RUNNER として所有される"
      confidence: "high"
    - entity_id: "E-003"
      storage_type: "file"
      reason: "slot ジョブマップは適用側が版管理する設定ファイル。run 開始時に execution-spec.json へ確定保存される"
      confidence: "high"
    - entity_id: "E-004"
      storage_type: "file"
      reason: "ハング検知上限はジョブマップの一部として所有され、execution-spec.json に反映される"
      confidence: "high"
    - entity_id: "E-005"
      storage_type: "file"
      reason: "適用文書は relay-gate の仕組みに含めない案件固有事項の文書。適用側が版管理する"
      confidence: "high"
    - entity_id: "E-006"
      storage_type: "file"
      reason: "比較定義はクロスチェックジョブマップの一部として job_id ごとに差し替える設定ファイル"
      confidence: "high"
    - entity_id: "E-007"
      storage_type: "file"
      reason: "クロスチェックジョブマップは適用側が定義する設定ファイル"
      confidence: "high"
    - entity_id: "E-008"
      storage_type: "file"
      reason: "対象カタログは適用側が版管理する定義ファイル。確報比較依頼は版だけを紐付ける"
      confidence: "medium"
    - entity_id: "E-009"
      storage_type: "file"
      reason: "ジョブ起動要求は永続レコードを持たず、execution-spec.json(追加引数)と実行ログに取り込まれる"
      confidence: "low"
    - entity_id: "E-010"
      storage_type: "file"
      reason: "facade/<run_id>/execution-spec.json として成果物ディレクトリに一度だけ確定保存する(Runner Result Contract)"
      confidence: "high"
    - entity_id: "E-011"
      storage_type: "file"
      reason: "started-at.txt / stdout.log / stderr.log / exitcode.txt として成果物ディレクトリに残す外部 IF の正本"
      confidence: "high"
    - entity_id: "E-012"
      storage_type: "file"
      reason: "応答は標準出力・標準エラー・終了コードとして中継され、履歴はジョブスケジューラの責務。relay-gate 側は実行ログにのみ残す"
      confidence: "medium"
    - entity_id: "E-013"
      storage_type: "rdb"
      reason: "run_id で成果物・rapid_run・比較依頼を相関付ける管理レコード。速報有効時のみ作成し、リラン系譜を parent_run_id で追跡する"
      confidence: "high"
    - entity_id: "E-014"
      storage_type: "file"
      reason: "slot 実行の状態は Runner Result(exitcode.txt の有無・値)から導出でき、RAPID_CROSSCHECK_MODE=off では成果物ファイルだけで動作する"
      confidence: "medium"
    - entity_id: "E-014"
      storage_type: "rdb"
      reason: "速報有効時は mode / PID / 状態(ABORTED を含む)を管理 DB にも保持し、abort-blue / abort-green と background-rerun の対象特定に使う"
      confidence: "low"
    - entity_id: "E-015"
      storage_type: "rdb"
      reason: "完了通知は rapid_run の blue_status / green_status / artifact_uri / completed_at として管理 DB に反映される"
      confidence: "high"
    - entity_id: "E-016"
      storage_type: "rdb"
      reason: "両系成功判定と比較依頼の一意作成を行う管理 DB レコード(rapid_run)"
      confidence: "high"
    - entity_id: "E-017"
      storage_type: "rdb"
      reason: "管理 DB 上のジョブキュー。worker の poll / claim / lease による多重実行防止に RDB のトランザクションを使う"
      confidence: "high"
    - entity_id: "E-018"
      storage_type: "rdb"
      reason: "速報比較の結果を run_id で参照するための管理 DB レコード(comparison_result)"
      confidence: "high"
    - entity_id: "E-019"
      storage_type: "rdb"
      reason: "確報側のジョブキュー(final_crosscheck_request)。速報側と別テーブルに分離する"
      confidence: "high"
    - entity_id: "E-020"
      storage_type: "rdb"
      reason: "比較ツールの stdout / stderr / exitcode は依頼レコード(速報 / 確報)に保存される"
      confidence: "high"
    - entity_id: "E-021"
      storage_type: "rdb"
      reason: "監視記録は管理 DB に保持し、警告傾向の確認と hang_detect_limit_minutes の調整根拠にする。RAPID_CROSSCHECK_MODE=off ではファイルのみで監視し記録は実行ログに残す"
      confidence: "medium"
    - entity_id: "E-022"
      storage_type: "file"
      reason: "メール本体は外部システム(メール通知)へ送信され、relay-gate 側は送信内容を実行ログに残し、alerted_at を監視記録に記録する"
      confidence: "low"
    - entity_id: "E-023"
      storage_type: "rdb"
      reason: "リラン指示は新しい parallel_run(parent_run_id 付き)として管理 DB に記録され、事前検証結果は実行ログに残す"
      confidence: "medium"
    - entity_id: "E-024"
      storage_type: "rdb"
      reason: "中止指示の結果は slot 実行 / 比較依頼 / parallel_run の ABORTED 更新として管理 DB に反映され、指示者と応答は実行ログに残す"
      confidence: "medium"
    - entity_id: "E-025"
      storage_type: "file"
      reason: "各スクリプトの実行ログはファイルとして残す。監査の正本はジョブスケジューラであり、3 ヶ月保管の障害調査資料とする"
      confidence: "high"
  diagram_mermaid: |
    erDiagram
      FEATURE_FLAG ||--o{ SLOT_RUNNER_ASSIGNMENT : owns
      SLOT_RUNNER_ASSIGNMENT ||--|| JOB_MAP : refers
      JOB_MAP ||--o{ HANG_DETECT_LIMIT : owns
      JOB_MAP ||--o{ EXECUTION_SPEC : resolved_into
      CROSSCHECK_JOB_MAP ||--o{ COMPARISON_DEFINITION : holds
      CROSSCHECK_JOB_MAP ||--|| TARGET_CATALOG : refers
      JOB_LAUNCH_REQUEST ||--|| PARALLEL_RUN : starts
      PARALLEL_RUN ||--|| EXECUTION_SPEC : refers
      PARALLEL_RUN ||--o{ SLOT_EXECUTION : has
      PARALLEL_RUN o|--o| PARALLEL_RUN : parent_run_id
      SLOT_EXECUTION ||--|| RUNNER_RESULT : outputs
      RUNNER_RESULT ||--o| SCHEDULER_RESPONSE : relayed_as
      SLOT_EXECUTION ||--o| COMPLETION_NOTICE : sends
      COMPLETION_NOTICE }o--|| RAPID_RUN : aggregated_into
      PARALLEL_RUN ||--o| RAPID_RUN : correlates
      RAPID_RUN ||--o| RAPID_CROSSCHECK_REQUEST : requests
      RAPID_CROSSCHECK_REQUEST }o--|| COMPARISON_DEFINITION : follows
      RAPID_CROSSCHECK_REQUEST ||--o{ COMPARISON_RESULT : produces
      RAPID_CROSSCHECK_REQUEST ||--o| TOOL_RESULT : stores
      TARGET_CATALOG ||--o{ FINAL_CROSSCHECK_REQUEST : versioned_for
      FINAL_CROSSCHECK_REQUEST ||--o| TOOL_RESULT : stores
      FINAL_CROSSCHECK_REQUEST ||--o| SCHEDULER_RESPONSE : relayed_as
      SLOT_EXECUTION ||--o{ MONITOR_RECORD : monitored_by
      RAPID_CROSSCHECK_REQUEST ||--o{ MONITOR_RECORD : monitored_by
      MONITOR_RECORD ||--o{ NOTIFICATION_MAIL : sends
      EXECUTION_SPEC ||--o{ RERUN_INSTRUCTION : restored_from
      RERUN_INSTRUCTION ||--|| PARALLEL_RUN : creates
      ABORT_INSTRUCTION }o--o| SLOT_EXECUTION : aborts
      ABORT_INSTRUCTION }o--o| RAPID_CROSSCHECK_REQUEST : aborts
      ABORT_INSTRUCTION }o--o| FINAL_CROSSCHECK_REQUEST : aborts
      EXECUTION_LOG }o--o| PARALLEL_RUN : traces
