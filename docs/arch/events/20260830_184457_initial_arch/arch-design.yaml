          confidence: "high"
      rules:
        - id: "SR-001"
          name: "Runner Result 完備"
          description: "slot 実行が終了したとき成果物ディレクトリに stdout.log / stderr.log / exitcode.txt を揃える。exitcode.txt は数値 1 行で runner の終了コードと一致させる。起動失敗・ジョブマップ未定義・SSH 失敗でも可能な限り 3 ファイルを出力する。started-at.txt は起動時に出力する。exitcode.txt が 0 なら slot 実行を SUCCEEDED、非 0 なら FAILED とする"
