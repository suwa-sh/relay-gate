          name: "ユースケース層"
          responsibility: "slot 起動フロー(background 起動 → foreground 起動 → foreground 待機 → 中継)、run_id 発行と parallel_run 作成(速報有効時のみ)、実行先解決 → execution-spec 確定保存 → 実装実行 → Runner Result 公開 → 完了通知のフロー制御"
          allowed_dependencies:
