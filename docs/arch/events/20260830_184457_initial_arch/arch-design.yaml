            - "L-facade-usecase"
          policies:
            - id: "LP-001"
              name: "入力検証で拒否する構成"
              description: "両 slot foreground、未知の実行モード、JOB_ID 欠落は入力検証でエラー終了し、どの slot も起動しない。原因は stderr に英語で出す"
              reason: "条件「foreground slot 排他」への対応"
              source_model: "条件: foreground slot 排他, 情報: ジョブ起動要求"
