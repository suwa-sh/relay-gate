schema_version: "1.0"
artifact_type: "decision_record"
skill_type: "architecture"
artifact_id: "arch-decision-019"
title: "validate-config.sh はティア間の関数委譲を無くし facade 単独で設定検証を完結させる。同一プロセスに source されるティアの名前空間の一般規則を CTR-007 に追加する"
status: "approved"
generated_at: "2026-10-10T20:20:00Z"
context: |
  実装フェーズで、設定検証コマンド validate-config.sh のエントリポイント(tier-facade が所有)が、速報クロスチェックティアと
  確報クロスチェックティアの検証関数ファイルを同じシェルに source して検証ロジックを委譲し、両ティアが facade ティアの CSV 解析関数を
  呼ぶ暫定依存で統合テストを通していた。この関数共有はアーキテクチャのティア間依存の宣言(契約)にも、同一プロセスに source される
  ティアの名前空間の規則にもなく、開発規約「契約に無いティア間依存の禁止」とティア仕様「直接依存で共有する」が両立しない状態だった。
  実際に速報ティアと確報ティアで repository 層の同名関数(target_catalog_repo_load)が後勝ちで上書きされ、対象カタログ参照の解決が
  内部障害(終了コード 6)になる衝突が起きた(速報側はティア固有接頭辞 crosscheck_ / CROSSCHECK_ を付けて回避)。
  同時期のクロスチェック簡素化で、速報クロスチェックの設定検証は「速報クロスチェック設定(env)に比較ツール起動コマンドのキーを 1 つ
  追加し、その値が『絶対パスで存在し実行可能』『{job_id} を含む』の 2 点を検証する」だけに縮退した。CSV クォート解析を要さなくなり、
  クロスチェックジョブマップ CSV・対象カタログ CSV の検証オプション(--crosscheck-job-map / --target-catalog)自体が廃止された。
  方針資料(tmp/RelayGateのしくみ.md / tmp/RelayGateの利用イメージ.md)は validate-config.sh の内部構成を定めておらず、
  委譲を残すか無くすかのどちらでも方針資料と矛盾しない。
decision: |
  - 委譲を無くす構成(案1)を採用する。validate-config.sh は全設定ファイル(feature flag / slot ジョブマップ / 速報クロスチェック設定
    (速報の比較ツール起動コマンドのキーを含む)/ ハング検知定期ジョブ設定 / 確報クロスチェック worker 設定)を tier-facade 自身の
    解析関数で検証し、他ティアの検証関数を source して委譲しない。既存の env 検証(feature flag 9 キー・rapid-crosscheck.env)と
    同じ方式であり、簡素化後は速報の検証も env の 1 キー検証に縮退するため facade 単独で完結する
  - ティア間のシェル関数共有・source の規則をクロスティアルール CTR-007 として明記する。各ティアの CLI は独立プロセスで、原則として
    他ティアのシェルファイルを source しない。ティア間連携は宣言済みの契約(管理 DB スキーマ・成果物ファイル・設定ファイル・公開 function
    (完了通知)・終了コード契約)だけで行う
  - 名前空間の規則は将来ティアを増やして同一プロセスに source する場合に備えた一般規則として CTR-007 に残す:
    (1) トップレベルの関数名・グローバル変数名にティア固有の接頭辞を付ける、(2) facade の共有面は契約に列挙した名前だけを公開し他は
    facade 固有接頭辞で閉じる、(3) 検証関数ファイルは定義のみで source 時に副作用を起こさない、(4) 他ティアの名前を再定義しない
  - app_architecture の CLP-003(速報ティアのレイヤー間直接依存)に、ティア間のシェル関数共有は CTR-007 に従い、本ティアは
    validate-config.sh へ検証関数を提供せず source されない旨を注記する
  - CLI 契約 validate-config.sh の tier_note / owner_tier からティア間委譲の記述を外し、UC ティア仕様を追従させるのは下流 spec の責務
consequences:
  positive:
    - "開発規約「契約に無いティア間依存の禁止」とティア仕様が両立する。validate-config.sh が他ティアのパスを直書きして source する暫定依存が消える"
    - "ティアを追加しても facade 側のエントリポイントを書き換えずに済み、同一プロセスの名前衝突(後勝ち上書きによる内部障害)が再発しない"
    - "受け入れ基準を validate-config.sh の終了コード・stdout・stderr の振る舞いだけで書けるようになり、実装構造(関数共有・内部呼び出し)に依存しない"
  negative:
    - "将来、複数ティアの設定を 1 プロセスで横断検証する高度な要件が出た場合は、CTR-007 の名前空間規則に沿って委譲構成を改めて設計する必要がある"
alternatives_considered:
  - name: "案2: 委譲を残し、提供側・利用側・共有関数の集合を契約として明記し、登録方式(固定パスを存在時のみ source)と名前空間規則を加える"
    reason_rejected: "簡素化で速報の検証が env の 1 キー検証に縮退し CSV クォート解析の共有が不要になったため、委譲を残す必然性が消えた。委譲を残すと facade のエントリポイントに他ティアのパス・関数登録規約が増え、ティア追加のたびに結合面が広がる。簡素な構成を優先する"
  - name: "案3: 名前空間規則を一切設けず、委譲も契約化しない(現状維持)"
    reason_rejected: "同一プロセスの名前衝突で内部障害が実際に発生しており、規則の不在が残ると将来のティア追加で再発する。委譲を無くしても将来の source 併用に備えた一般規則は安価な保険として残す価値がある"
