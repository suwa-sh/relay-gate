# 6 段ゲート CI(dist-impl-bootstrap P6 生成)
# コマンドは docs/impl/latest/impl-config.yaml の commands / integration_commands と一致させる
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  format-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt
      - name: shfmt (check-only)
        run: |
          shfmt -d facade
          shfmt -d worker
          shfmt -d packages/contracts

  lint:
    runs-on: ubuntu-latest
    needs: format-check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          find facade -name '*.sh' -print0 | xargs -0 -r shellcheck -x
          find worker -name '*.sh' -print0 | xargs -0 -r shellcheck -x
          find packages/contracts -name '*.sh' -print0 | xargs -0 -r shellcheck -x

  tdd:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    strategy:
      matrix:
        tier: [facade, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: bats (${{ matrix.tier }})
        run: bats ${{ matrix.tier }}/test

  tier-bdd:
    runs-on: ubuntu-latest
    needs: tdd
    permissions:
      contents: read
    strategy:
      matrix:
        tier: [facade, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cucumber tier-${{ matrix.tier }}
        run: npx cucumber-js --config cucumber.cjs --profile tier-${{ matrix.tier }}

  uc-bdd:
    runs-on: ubuntu-latest
    needs: tier-bdd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cucumber uc
        run: npx cucumber-js --config cucumber.cjs --profile uc

  atdd:
    runs-on: ubuntu-latest
    needs: uc-bdd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cucumber atdd
        run: npx cucumber-js --config cucumber.cjs --profile atdd
